/* animations */
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

/* teacher panel */

.plist { display: grid; gap: 6px; }

.game-card { text-align: left; padding: 18px; border-radius: 18px; border: 3px solid var(--line); background: var(--panel2); color: var(--ink); }
.game-card.sel { border-color: var(--accent); }
.game-card .gi { font-size: 2.6rem; }

/* ===== minimalist visual layer (students + projector) ===== */
body[data-theme="startup"] { --good: #16a34a; --bad: #e11d48; --warn: #d97706; }

/* progress: 🎓 1 2 [Set 3 ●●○] 4 5 */
.pset { padding: 3px 8px; }

/* timer + situation side by side */
.scene { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.scene .situation { flex: 1; min-width: 0; }
@media (max-width: 600px) { .scene { flex-direction: column; } }
.situation { padding: 14px 16px; }
.sit-head { align-items: center; }
.sit-icon { font-size: 3.4rem; }
.sit-kicker { letter-spacing: .06em; }
.sit-title { font-size: 1.55rem; }
.sit-text { margin: 2px 0 10px; font-size: 1.02rem; }
.clue { font-weight: 700; }

/* action cards: big icon, name, effect chips, cost */
.actions { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
.action { text-align: center; justify-items: center; align-content: start; gap: 7px; padding: 14px 10px 12px; }
.action .ai { font-size: 2.5rem; }
.action .an { font-size: 1rem; line-height: 1.15; }
.action .chips { justify-content: center; }
.action .chip { font-size: .8rem; padding: 3px 7px; }
.action .why-no { font-size: .78rem; }
.lockbar .risk { font-size: .82rem; font-weight: 700; color: var(--muted); margin-top: 2px; }
.subchoice b { font-size: 1.05rem; }

/* side column */
.side { display: grid; gap: 12px; align-content: start; }
.my-team { border-top: 6px solid var(--tc); }
.my-head { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.05rem; margin-bottom: 10px; }
.my-score { margin-left: auto; padding: 3px 10px; border-radius: 99px; background: var(--tc); color: #fff; font-size: .9rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.tile { position: relative; padding: 10px 6px 8px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); text-align: center; }
.tile .ti { font-size: 1.5rem; line-height: 1; }
.tile .tv { font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 3px; white-space: nowrap; }
.tile .tl { font-size: .68rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .bar { height: 6px; margin-top: 6px; }
.tile.danger .tv { color: var(--bad); }
.tile .delta { position: absolute; top: -8px; right: -4px; margin: 0; }
.tstrip { display: grid; gap: 6px; }
.tchip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 12px; background: var(--panel2); border-left: 6px solid var(--tc); font-weight: 800; }
.tchip.mine { box-shadow: 0 0 0 2px var(--tc); }
.tchip .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tchip .ts { font-size: 1.15rem; }
.thinking { display: inline-block; animation: bob 1.2s ease-in-out infinite; }

/* results */
.hero { border-top: 6px solid var(--tc); display: grid; gap: 10px; }
.hero-top { display: flex; align-items: center; gap: 14px; }
.hero .hi { font-size: 3.4rem; line-height: 1; }
.hero .gain { font-size: 2.4rem; line-height: 1.1; }
.tip-line { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent2) 14%, transparent); border: 1px solid var(--accent2); font-weight: 800; }
.tip-line.best { background: color-mix(in srgb, var(--good) 14%, transparent); border-color: var(--good); }
details.more summary { cursor: pointer; font-weight: 800; color: var(--muted); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }
details.more[open] summary { margin-bottom: 10px; }
details.more p { font-size: .92rem; color: var(--muted); }
.reveal .gain { font-size: 1.5rem; margin-top: 4px; }
.reveal .rn { font-size: .95rem; }
.waiting { text-align: center; margin: 18px 0 6px; font-weight: 800; color: var(--muted); }

/* lobby */
.name-edit label { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; }
.name-edit input { flex: 1; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-size: 1.1rem; font-weight: 800; }
.name-edit input:focus { outline: none; border-color: var(--accent); }

/* set intro + winner */
.goal { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; font-weight: 900; }
.goal .chip { font-size: .98rem; padding: 6px 11px; }
.goal-eq { font-size: 1.2rem; }
.goal-plus { color: var(--muted); font-size: 1.1rem; }
.card .goal { justify-content: flex-start; margin-top: 4px; }
.card .goal .chip { font-size: .8rem; padding: 3px 8px; }
.steps { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 12px; min-width: 76px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); font-weight: 800; font-size: .85rem; }
.step b { font-size: 1.8rem; line-height: 1.1; }
.steps .arrow { color: var(--muted); font-weight: 900; }
.plus-win { display: inline-block; margin-top: 8px; padding: 4px 14px; border-radius: 99px; background: var(--tc); color: #fff; font-weight: 900; font-size: 1.1rem; animation: pop .5s .5s both; }
.winner-screen .win-why { margin-top: 6px; }
.settled .plus-win { animation: none; }
/* compact stats on team cards: one mini column per stat */
.stats.compact { grid-template-columns: repeat(auto-fit, minmax(46px, 1fr)); gap: 6px; }
body.projector .team-grid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.stats.compact .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .85rem; }
.stats.compact .stat .bar { width: 100%; height: 6px; order: 3; }
.stats.compact .stat .sv { text-align: center; white-space: nowrap; }
.stats.compact .stat .delta { display: block; margin: 2px auto 0; font-size: .72rem; }
.tiles.n4 { grid-template-columns: repeat(4, 1fr); }
.tiles.n6 { grid-template-columns: repeat(3, 1fr); }
.lockbar .subchoice { flex-basis: 100%; margin: 0; }

/* team vote */
.action .vote-badge { position: absolute; top: 7px; left: 8px; }
.vote-badge { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 99px; background: var(--accent2); color: #fff; font-size: .75rem; font-weight: 900; animation: pop .3s ease-out; }
.settled .vote-badge { animation: none; }
.vote-meter { display: grid; justify-items: center; gap: 6px; min-width: 190px; padding: 8px 14px; border-radius: 14px; background: var(--panel2); border: 2px dashed var(--line); }
.vote-meter .pips { display: flex; gap: 6px; }
.pip { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); background: var(--bg); transition: background .2s, border-color .2s; }
.pip.on { background: var(--good); border-color: var(--good); box-shadow: 0 0 10px color-mix(in srgb, var(--good) 60%, transparent); }
.vm-text { font-size: .85rem; font-weight: 800; text-align: center; }

/* ===== reading layout (v3): situation on the left, decision on the right ===== */
.read-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(330px, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .read-grid { grid-template-columns: 1fr; } }
.act-col { display: grid; gap: 14px; align-content: start; }
.act-top { display: flex; gap: 14px; align-items: center; }
.act-top .my-team { flex: 1; min-width: 0; }
.situation.read { padding: 22px 26px; font-size: 1.12rem; line-height: 1.6; }
.situation.read .sit-icon { font-size: 2.8rem; }
.situation.read .sit-title { font-size: 1.7rem; }
.sit-story { margin: 14px 0 4px; }
.sit-label { font-size: .78rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 16px 0 6px; }
.act-col > .sit-label { margin: 2px 0 -6px; }
.know { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.know li.clue { list-style: none; margin-left: -1.2em; padding: 8px 12px; border-radius: 10px; font-size: 1rem; }
.sit-decide { margin: 0; }
.sit-ask { margin: 18px 0 0; font-weight: 900; font-size: 1.2rem; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 12%, transparent); border-left: 5px solid var(--accent); }
.side-label { font-size: .78rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

/* the three numbers */
.ptiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ptile { padding: 12px 8px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--line); text-align: center; }
.ptile .pl { font-size: .82rem; font-weight: 800; color: var(--muted); }
.ptile .pv { font-size: 1.55rem; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
.arr { margin-left: 4px; font-size: 1.15rem; }
.arr.up { color: var(--good); }
.arr.down { color: var(--bad); }
.my-team details.more { margin-top: 10px; }
.my-team .tiles { margin-bottom: 4px; }
.my-team .tile .tv { font-size: 1.1rem; }

/* plain action cards: icon + name only */
.actions.plain { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.actions.plain .action { min-height: 104px; align-content: center; padding: 16px 10px; gap: 8px; }
.actions.plain .action .ai { font-size: 2.2rem; }
.actions.plain .action .an { font-size: 1.02rem; }
.action.looking { border-color: var(--accent2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent2) 35%, transparent); }
.action.cant { opacity: .5; }
.info-panel { border: 2px solid var(--accent2); font-size: 1.02rem; }
.ip-head { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.25rem; }
.ip-icon { font-size: 1.8rem; }
.info-panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 14px; margin: 12px 0 14px; line-height: 1.45; }
.info-panel dt { font-weight: 900; color: var(--muted); }
.info-panel dd { margin: 0; }
.ip-choose .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.ip-choose .btn.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 25%, var(--panel2)); }
.vote-btn { width: 100%; font-size: 1.1rem; padding: 12px; }
.btn.voted:disabled { border-color: var(--good); color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); opacity: 1; filter: none; cursor: default; }
.info-hint { text-align: center; color: var(--muted); font-weight: 800; padding: 12px; border: 2px dashed var(--line); border-radius: 14px; }
.info-panel .why-no { font-size: .9rem; }

/* results */
.result-card { border-top: 6px solid var(--tc); font-size: 1.1rem; line-height: 1.55; }
.result-card .sit-label:first-child { margin-top: 0; }
.rc-decision { font-size: 1.45rem; font-weight: 900; }
.rc-text { margin: 0; }
.results-line { display: flex; flex-wrap: wrap; gap: 8px; }
.res { padding: 6px 12px; border-radius: 10px; font-weight: 900; background: var(--panel2); border: 1px solid var(--line); }
.res.up { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); background: color-mix(in srgb, var(--good) 12%, transparent); }
.res.down { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.res.same { color: var(--muted); font-weight: 700; }
.result-card details.more { margin-top: 16px; font-size: .95rem; }
.act-col .reveal-grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); margin-top: 0; gap: 8px; }
.act-col .reveal { padding: 10px 6px; }
.act-col .reveal .ri { font-size: 1.8rem; }
.intro-goal { font-size: 1.3rem !important; }
.intro-how { font-size: 1.05rem; color: var(--muted); }
@media (min-width: 901px) { .read-grid > .read-col { position: sticky; top: 70px; } }
.act-col .lockbar { position: static; }
.read-grid > * { min-width: 0; }
.act-top .timer { width: 80px; height: 80px; }
.ptile { min-width: 0; overflow: hidden; }
.ptile .pv { font-size: clamp(1.05rem, 1.7vw, 1.55rem); }
.ptile .pl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.actions.plain { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
.ptile .pl { white-space: normal; line-height: 1.15; min-height: 1.15em; }

/* ===== Cyber Arena (loaded after style.css) ===== */
body[data-theme="arena"] {
  --bg: #0d1320; --bg2: #121a2b; --panel: #151e30; --panel2: #1b2640; --line: #2a3754;
  --ink: #e8edf6; --muted: #97a3ba; --accent: #38bdf8; --accent2: #818cf8; --good: #22c55e; --bad: #f43f5e; --warn: #f59e0b; --part: #eab308;
  background: radial-gradient(1000px 520px at 15% -10%, #18233d, transparent), var(--bg);
}
body[data-theme="arena"] .btn-primary { color: #04101c; }
.a-wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }

/* top bar numbers */
.me-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.me-pills .pill b { font-size: 1rem; font-variant-numeric: tabular-nums; }
.pill.score { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.pill.streak { border-color: var(--warn); color: var(--warn); }

/* progress through the game */
.a-progress { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.a-stage-name { font-weight: 900; font-size: 1rem; }
.a-steps { display: flex; gap: 4px; flex: 1; min-width: 160px; }
.a-steps i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); max-width: 60px; }
.a-steps i.done { background: color-mix(in srgb, var(--accent) 70%, transparent); }
.a-steps i.on { background: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
.a-count { color: var(--muted); font-weight: 800; font-size: .85rem; white-space: nowrap; }

/* the challenge card */
.ch { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); animation: slide .35s ease-out both; }
.ch-head { display: flex; gap: 12px; align-items: flex-start; }
.ch-head .timer { width: 78px; height: 78px; margin-left: auto; }
.ch-head .timer .t-num { font-size: 1.5rem; }
.ch-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 8px; font-size: .78rem; font-weight: 800; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
.tag.d1 { color: #4ade80; } .tag.d2 { color: #facc15; } .tag.d3 { color: #fb7185; }
.tag.story { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 50%, var(--line)); }
.ch-title { font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 900; margin: 0; }
.ch-text { font-size: 1.06rem; line-height: 1.55; margin: 12px 0 0; }
.ch-clues { margin: 10px 0 0; padding: 10px 12px 10px 30px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); }
.ch-clues li { margin: 4px 0; }
.ch-log { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: #0a0f19; border: 1px solid var(--line); font: 600 .86rem/1.6 Consolas, "Cascadia Mono", monospace; color: #cbd5e1; overflow-x: auto; white-space: pre; }
.ch-ask { margin: 14px 0 10px; font-weight: 900; font-size: 1.05rem; color: var(--accent); }

/* multiple choice */
.opts { display: grid; gap: 8px; }
.opt { position: relative; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); color: var(--ink); font-size: 1rem; font-weight: 600; transition: border-color .12s, transform .12s, background .12s; }
button.opt:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); transform: translateY(-1px); }
.opt .ol { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; background: var(--bg); border: 1px solid var(--line); }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
.opt.sel .ol { background: var(--accent); color: #04101c; border-color: transparent; }
.opt:disabled { cursor: default; }
.opt .ok { font-weight: 900; font-size: 1.1rem; }
.opt.best { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--panel2)); }
.opt.half { border-color: var(--part); }
.opt.wrongpick { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel2)); }
.opt .then { grid-column: 2 / -1; font-size: .88rem; font-weight: 600; color: var(--muted); }
.opt .dist { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); font-weight: 800; }
.opt .dist .bar { flex: 1; height: 8px; }
.opt.best .dist .bar > span { background: var(--good); }
.opt .mine { position: absolute; top: -9px; right: 12px; padding: 1px 8px; border-radius: 99px; font-size: .72rem; font-weight: 900; background: var(--ink); color: var(--bg); }

/* simulated message / web page (spot the threat) */
.art { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #f8fafc; color: #0f172a; font-size: .98rem; }
.art-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #e2e8f0; color: #334155; font-weight: 800; font-size: .82rem; }
.art-bar .dots { display: flex; gap: 5px; }
.art-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; }
.art-body { padding: 12px; display: grid; gap: 6px; }
.art-row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: baseline; }
.art-row .lbl { color: #64748b; font-size: .8rem; font-weight: 800; text-transform: uppercase; }
.u { display: block; width: 100%; text-align: left; padding: 6px 9px; margin: 0; border-radius: 9px; border: 2px dashed transparent; background: transparent; color: inherit; font: inherit; line-height: 1.45; }
button.u { cursor: pointer; }
button.u:hover:not(:disabled) { background: #e0f2fe; border-color: #7dd3fc; }
.u.flag { background: #ffe4e6; border: 2px solid #e11d48; }
.u.flag::after { content: " 🚩"; }
.u.url { font-family: Consolas, "Cascadia Mono", monospace; font-size: .9rem; }
.u.hit { background: #dcfce7; border: 2px solid #16a34a; }
.u.miss { background: #fef3c7; border: 2px solid #d97706; }
.u.false { background: #f1f5f9; border: 2px solid #94a3b8; text-decoration: line-through; text-decoration-color: #94a3b8; }
.u .uwhy { display: block; margin-top: 4px; font-size: .84rem; font-weight: 700; color: #7f1d1d; }
.u.hit .uwhy { color: #14532d; }
.art.sms, .art.chat { background: #eef2f7; }
.art.sms .art-body, .art.chat .art-body { gap: 8px; }
.art.sms .u, .art.chat .u { background: #fff; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); width: auto; max-width: 92%; }
.art.sms .u.flag, .art.chat .u.flag { background: #ffe4e6; }
.art.sms .u.hit, .art.chat .u.hit { background: #dcfce7; }
.art.sms .u.miss, .art.chat .u.miss { background: #fef3c7; }
.art.popup { background: #fff7ed; }
.art .login-box { margin: 4px auto; max-width: 380px; width: 100%; display: grid; gap: 4px; padding: 10px; border-radius: 12px; border: 1px solid #cbd5e1; background: #fff; }
.spot-count { margin-top: 8px; font-weight: 800; color: var(--muted); font-size: .9rem; }
.spot-key { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: .82rem; font-weight: 800; color: var(--muted); }
.spot-key span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.spot-key .k-hit::before { background: #16a34a; } .spot-key .k-miss::before { background: #d97706; } .spot-key .k-false::before { background: #94a3b8; }

/* put in order */
.osteps { display: grid; gap: 8px; }
.ostep { display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); color: var(--ink); font-size: 1rem; font-weight: 600; }
button.ostep:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); }
.ostep .num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 1.1rem; border: 2px dashed var(--line); color: var(--muted); }
.ostep.placed { border-color: var(--accent); }
.ostep.placed .num { border: none; background: var(--accent); color: #04101c; }
.ostep.right .num { background: var(--good); color: #fff; border: none; }
.ostep.off .num { background: var(--bad); color: #fff; border: none; }
.ostep .your { font-size: .8rem; color: var(--muted); font-weight: 800; grid-column: 2; }

/* sort into groups */
.sorts { display: grid; gap: 8px; }
.sort-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel2); }
.sort-row .it { font-weight: 700; }
.seg { display: flex; border-radius: 11px; overflow: hidden; border: 2px solid var(--line); }

/* submit bar */
.submit-bar { position: sticky; bottom: 0; margin-top: 14px; padding: 12px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); z-index: 5; }

<body data-theme="arena">
<header class="topbar">
  <div class="brand"><div class="logo">🏟️</div><span>Cyber Arena</span></div>
  <div class="me-pills" id="me-pills"></div>
  <div class="spacer"></div>
  <a class="btn btn-sm" href="START_HERE_Computer_Lab.html" title="Back to the list of activities">← Lab home</a>
</header>
<main class="a-wrap" id="app"></main>
<script>
/* Offline: no server, so the clock is this computer's clock. */
const Net = { now: () => Date.now() };

/* Rendering helpers shared by the student and teacher screens. They only display
   what the server sent — no game rules run in the browser. */
const UI = (() => {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const $ = (sel, root) => (root || document).querySelector(sel);
  const usd = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');

  function fmt(game, id, v) {
    const s = game.stats.find(x => x.id === id);
    return s && s.fmt === 'usd' ? usd(v) : String(Math.round(v));
  }
  function signed(game, id, v) {
    const s = game.stats.find(x => x.id === id);
    if (s && s.fmt === 'usd') return (v >= 0 ? '+' : '') + usd(v);
    return (v > 0 ? '+' : '−') + Math.abs(v);
  }
  const teamById = (st, id) => st.teams.find(t => t.id === id);
  const wins = n => n ? '🏆'.repeat(n) : '';
  const fmtScore = (st, n) => st.set && st.set.fmt === 'usd' ? usd(n) : n + ' pts';
  const gainText = (st, n) => (n >= 0 ? '+' : '') + (st.set && st.set.fmt === 'usd' ? usd(n) : n);

  /* small visual pieces */
  const chip = (text, cls, tip) => '<span class="chip' + (cls ? ' ' + cls : '') + '"' + (tip ? ' title="' + esc(tip) + '"' : '') + '>' + esc(text) + '</span>';
  const fact = f => typeof f === 'string' ? chip(f) : chip(f.t, '', f.tip);
  function deltaChips(game, delta) {
    if (!delta) return '';
    const list = game.stats.filter(s => delta[s.id]).map(s => chip(s.icon + ' ' + signed(game, s.id, delta[s.id]), delta[s.id] > 0 ? 'good' : 'bad', s.name));
    return list.length ? '<div class="chips">' + list.join('') + '</div>' : '';
  }

  /* stat bars (with optional change chips) — compact version is used on team cards */
  function stats(game, values, delta, compact) {
    if (!values) return '';
    return '<div class="stats' + (compact ? ' compact' : '') + '">' + game.stats.map(s => {
      const v = values[s.id] || 0, max = s.max || s.bar || 100;
      const pct = Math.max(0, Math.min(100, v / max * 100));
      const d = delta && delta[s.id];
      const danger = s.warnLow && v < 30;
      return '<div class="stat" title="' + esc(s.name + ' — ' + (s.help || '')) + '"><span class="si">' + s.icon + '</span><span class="sn">' + esc(s.name) + '</span>' +
        '<div class="bar' + (danger ? ' danger' : '') + '"><span style="width:' + pct + '%"></span></div>' +
        '<span class="sv">' + fmt(game, s.id, v) + (d ? '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + signed(game, s.id, d) + '</span>' : '') + '</span></div>';
    }).join('') + '</div>';
  }
  /* big stat tiles: icon, number, bar, one-word label */
  function tiles(game, values, delta) {
    if (!values) return '';
    return '<div class="tiles n' + game.stats.length + '">' + game.stats.map(s => {
      const v = values[s.id] || 0, max = s.max || s.bar || 100;
      const pct = Math.max(0, Math.min(100, v / max * 100));
      const d = delta && delta[s.id];
      const danger = s.warnLow && v < 30;
      return '<div class="tile' + (danger ? ' danger' : '') + '" title="' + esc(s.name + ' — ' + (s.help || '')) + '"><div class="ti">' + s.icon + '</div>' +
        '<div class="tv">' + fmt(game, s.id, v) + '</div><div class="tl">' + esc(s.short || s.name) + '</div>' +
        '<div class="bar' + (danger ? ' danger' : '') + '"><span style="width:' + pct + '%"></span></div>' +
        (d ? '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + signed(game, s.id, d) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function mem(list) {
    return list && list.length ? '<div class="chips" style="margin-top:8px">' + list.map(m => chip(m.name + ': ' + m.value)).join('') + '</div>' : '';
  }

  /* how to win this set, as icon chips: 🏆 = 💚 Health + 🧠 Intel gained */
  function goal(set) {
    if (!set || !set.goal || !set.goal.length || set.practice) return '';
    return '<div class="goal"><span class="goal-eq">🏆 =</span>' + set.goal.map((g, i) => (i && g.label[0] !== '−' ? '<span class="goal-plus">+</span>' : '') + chip(g.icon + ' ' + g.label)).join('') + '</div>';
  }

  /* progress: 🎓 1 2 3 4 5 (+ ⚡), round dots on the current set */
  function progress(st) {
    if (!st.set) return '';
    const items = [0, 1, 2, 3, 4, 5].concat(st.setIndex === 6 ? [6] : []);
    return '<div class="progress">' + items.map(i => {
      const on = i === st.setIndex, done = i < st.setIndex;
      const label = i === 0 ? '🎓' : i === 6 ? '⚡' : on ? 'Set ' + i : String(i);
      const dots = on ? ' ' + Array.from({ length: st.set.rounds }, (_, r) => '<span class="dot' + (r < st.round || (r === st.round && ['results', 'setEnd'].includes(st.phase)) ? ' done' : r === st.round ? ' on' : '') + '"></span>').join('') : '';
      return '<span class="pset' + (on ? ' on' : done ? ' done' : '') + '" title="' + (i === 0 ? 'Practice' : i === 6 ? 'Tie-breaker' : 'Set ' + i) + '">' + label + dots + '</span>';
    }).join('') + '</div>';
  }

  /* countdown ring (updated by tick()) */
  function timer(big) {
    return '<div class="timer' + (big ? ' big' : '') + '" id="timer"><svg viewBox="0 0 100 100"><circle class="t-track" cx="50" cy="50" r="44"/><circle class="t-fill" id="t-fill" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="t-num" id="t-num">--</div></div>';
  }
  function tick(st) {
    const el = $('#timer');
    if (!el || !st || !st.timer) return;
    const left = st.timer.remaining != null ? st.timer.remaining : Math.max(0, st.timer.endsAt - Net.now());
    const secs = Math.ceil(left / 1000);
    $('#t-num').textContent = st.paused ? '⏸' : secs;
    $('#t-fill').setAttribute('stroke-dashoffset', String(276.5 * (1 - left / (st.timer.total * 1000))));
    el.classList.toggle('low', secs <= 10 && !st.paused);
  }

  /* the situation to read: SITUATION → WHAT YOU KNOW (+ hidden clues) → THE DECISION → question */
  function situation(st, game, clues) {
    if (!st.sit) return '';
    const s = st.sit;

'use strict';
/*
 * Cyber Arena — the rules, with no networking: choosing the challenges for a grade,

const crypto = require('crypto');

const RULES = {
  base: { 1: 100, 2: 120, 3: 150 },              // easy / medium / hard
  speedMax: 20,                                   // only for correct answers; full bonus with half the time or more left
  correctAt: 0.75,                                // "correct" = at least 75 % right (partial answers still earn points)
  streak: { 3: 25, 5: 50 },                       // + 50 again at 10, 15, 20 …
  crisis: { contained: 100, limited: 50 },        // Final Cyber Crisis outcome bonus
  gradeTime: { 8: 1.2, 9: 1.1, 10: 1, 11: 1 },
  relaxed: 1.5
};
const DIFF_NAME = { 1: 'Easy', 2: 'Medium', 3: 'Hard' };
const GRADES = [8, 9, 10, 11];

/* how many easy / medium / hard challenges each normal round gets, per grade */
const MIX = {
  8: [[4, 1, 0], [2, 3, 0]],
  9: [[2, 3, 0], [1, 2, 2]],
  10: [[1, 3, 1], [0, 2, 3]],
  11: [[0, 3, 2], [0, 1, 4]]
};
const ROUND_SIZE = 5;

/* ---------------------------- random helpers ---------------------------- */
const rand = () => crypto.randomInt(1 << 30) / (1 << 30);
function shuffle(list, rng) {
  const a = list.slice(), r = rng || rand;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const ART_FIELDS = ['from', 'subject', 'url', 'title'];

// One challenge, in the shape the room uses. ctx = where it sits (stage kind, incident story…).
function normalize(raw, ctx) {
  const c = {
    id: raw.id, cat: raw.cat, diff: raw.diff, type: raw.type, time: raw.time, icon: raw.icon || (ctx && ctx.icon) || '🛡️',
    title: raw.title || (ctx && ctx.title) || '', text: raw.text, ask: raw.ask || '', clues: raw.clues || null, log: raw.log || null,
    why: raw.why, ctx: ctx || null

  if (raw.type === 'choice') c.options = raw.options.map(o => ({ t: o[0], credit: o[1], then: o[2] || '' }));
  if (raw.type === 'spot') {
    c.art = { kind: raw.art.kind, fields: {}, body: raw.art.body.map(unit) };
    ART_FIELDS.forEach(f => { if (raw.art[f] != null) c.art.fields[f] = unit(raw.art[f]); });

/* ---------------------------- the game plan ---------------------------- */
// Pick challenges for one round: the right difficulty mix, new categories and a mix of challenge types.
function pickRound(counts, used, usedCats, rng) {
  const out = [];
  counts.forEach((n, di) => {
    for (let k = 0; k < n; k++) {
      const pool = BANK.filter(r => r.diff === di + 1 && !used.has(r.id));
      if (!pool.length) continue;
      const types = new Set(out.map(r => r.type));
      const nonChoice = out.filter(r => r.type !== 'choice').length;
      const score = r => (usedCats.has(r.cat) ? 0 : 3) + (r.type !== 'choice' && !types.has(r.type) ? 2 : 0) - (r.type !== 'choice' && nonChoice >= 2 ? 3 : 0) + rng() * 1.5;
      const best = pool.map(r => ({ r, s: score(r) })).sort((a, b) => b.s - a.s)[0].r;
      out.push(best); used.add(best.id); usedCats.add(best.cat);
    }
  });
  // every round has at least one hands-on challenge (spot / order / sort), not only multiple choice
  if (out.length && out.every(r => r.type === 'choice')) {
    for (let i = out.length - 1; i >= 0; i--) {
      const alt = shuffle(BANK.filter(r => r.diff === out[i].diff && r.type !== 'choice' && !used.has(r.id)), rng)[0];
      if (alt) { used.delete(out[i].id); out[i] = alt; used.add(alt.id); usedCats.add(alt.cat); break; }
    }
  }
  // order: easier first, but avoid two of the same challenge type in a row
  let bestOrder = null, bestBad = 99;
  for (let t = 0; t < 30; t++) {
    const o = shuffle(out, rng).sort((a, b) => a.diff - b.diff);
    const bad = o.reduce((n, r, i) => n + (i && o[i - 1].type === r.type && r.type !== 'choice' ? 2 : 0) + (i && o[i - 1].cat === r.cat ? 1 : 0), 0);
    if (bad < bestBad) { bestBad = bad; bestOrder = o; }
    if (!bad) break;
  }
  return bestOrder || out;
}

  if (grade === 9) return shuffle(['I1', 'I2', 'I3'], rng).slice(0, 2).map(byId);

      g.hist.push({ no: g.no, si: g.si, cat: c.cat, frac: s.frac, correct: s.correct, points: s.points, counted: true });
      if (stage().kind === 'crisis') { g.crisisSum += s.frac; g.crisisN++; }
    }
    g.phase = 'reveal';
    save();
  }
  function next() {
    const g = G();
    if (g.phase === 'intro') startQuestion();
    else if (g.phase === 'reveal') {
      if (g.qi < stage().items.length - 1) { g.qi++; startQuestion(); }
      else {
        if (stage().kind === 'crisis' && g.crisisN) {
          const o = A.crisisOutcome(g.crisisSum / g.crisisN);
          g.crisisOutcome = { id: o.id, label: o.label, icon: o.icon, bonus: o.bonus, text: stage().endings[o.id] };
          g.score += o.bonus;
        }
        g.cur = null; g.phase = 'partEnd';
      }
    } else if (g.phase === 'partEnd') {
      if (g.si < stages().length - 1) { g.si++; g.qi = 0; g.phase = 'intro'; }
      else finishGame();
    }
    save();
    render(true);
  }
  function finishGame() {
    const g = G();
    const report = A.playerReport({ hist: g.hist, bestStreak: g.bestStreak, crisisOutcome: g.crisisOutcome });
    let mask = 0;
    g.hist.forEach(h => { if (h.correct && h.no >= 1 && h.no <= 21) mask |= 1 << (h.no - 1); });
    const crisis = g.crisisOutcome ? CRISIS.indexOf(g.crisisOutcome.id) : 0;
    g.report = report;
    g.resultCode = makeResult(g.code, data.name, g.score, report.accuracy, mask, crisis);
    g.phase = 'final';
    g.finished = now();
    data.played[g.code] = { name: data.name, result: g.resultCode, score: g.score, grade: g.grade, at: g.finished };
  }

  /* ---------------- drawing: the pieces AUI needs ---------------- */
  function st() {

  function finalView() {

    app.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { const i = d.seq.indexOf(b.dataset.step); if (i >= 0) d.seq.splice(i, 1); else d.seq.push(b.dataset.step); redrawAnswer(); }));
    app.querySelectorAll('[data-item]').forEach(b => b.addEventListener('click', () => { d.bins[b.dataset.item] = +b.dataset.bin; redrawAnswer(); }));
    const cs = $('#clear-seq'); if (cs) cs.addEventListener('click', () => { d.seq = []; redrawAnswer(); });

  /* ---------------- teacher: game codes + results ---------------- */

    return (tbig ? '' : '<div class="teacher-grid"><div>' + codeCard + make + '</div><div>' + entry + '</div></div>') +
      '<div class="card" style="margin-top:14px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;flex:1">🏆 Class ranking — game ' + esc(code) + ' <span class="muted" style="font-size:1rem">(' + rs.length + ' result' + (rs.length === 1 ? '' : 's') + ')</span></h2>' +
      '<button class="btn btn-sm" id="t-big">' + (tbig ? '🎛️ Show controls' : '📽️ Ranking only (projector)') + '</button>' + (tbig ? '' : '<button class="btn btn-sm" id="t-csv"' + (rs.length ? '' : ' disabled') + '>💾 Save results (CSV)</button><button class="btn btn-sm btn-danger" id="t-clear"' + (rs.length ? '' : ' disabled') + '>Clear results</button>') + '</div>' +
      (rs.length ? AUI.podium(rs.slice(0, 3).map((r, i) => ({ rank: i + 1, name: r.name, score: r.score }))) +
        '<div style="overflow-x:auto;margin-top:16px"><table class="ptable"><tr><th>#</th><th>Name</th><th class="num">Score</th><th class="num">Accuracy</th><th class="num">Correct</th><th>Final crisis</th>' + (tbig ? '' : '<th></th>') + '</tr>' +
        // projector view: top 10 only, so nobody's low rank is shown to the whole class
        (tbig ? rs.slice(0, 10) : rs).map((r, i) => '<tr><td>' + (i + 1) + '</td><td><b>' + esc(r.name) + '</b></td><td class="num"><b>' + AUI.num(r.score) + '</b></td><td class="num">' + r.acc + '%</td><td class="num">' + bits(r.mask) + '/' + list.length + '</td><td>' + crisisLabel(r.crisis) + '</td>' + (tbig ? '' : '<td><button class="btn btn-sm" data-del="' + esc(r.name) + '" title="Remove this result">✕</button></td>') + '</tr>').join('') + '</table></div>' +
        (tbig && rs.length > 10 ? '<p class="muted" style="text-align:center">Top 10 of ' + rs.length + ' shown.</p>' : '')
        : '<p class="muted">No results yet. When students finish, type their names and result codes above.</p>') + '</div>' +
      (rs.length ? '<div class="card" style="margin-top:14px"><h2 style="margin-top:0">📊 How the class did</h2>' + classResults(rs, list) + '</div>' : '') + (tbig ? '' : backLink());
  }
  const backLink = () => '<p style="text-align:center;margin-top:16px"><button class="btn" data-go="home">← Cyber Arena home</button></p>';
  const bits = m => { let n = 0; while (m) { n += m & 1; m >>>= 1; } return n; };
  const crisisLabel = c => c === 'contained' ? '✅ Contained' : c === 'limited' ? '⚠️ Limited damage' : c === 'breach' ? '🔥 Major incident' : '—';
  function classResults(rs, list) {
    const n = rs.length;
    const per = list.map((c, i) => ({ no: i + 1, title: c.title, cat: c.cat, pct: Math.round(rs.filter(r => r.mask & (1 << i)).length / n * 100) }));
    const cats = {};
    per.forEach(p => { const x = cats[p.cat] || (cats[p.cat] = { sum: 0, k: 0 }); x.sum += p.pct; x.k++; });
    const catRows = Object.entries(cats).map(([id, x]) => ({ name: A.CATEGORIES[id].name, icon: A.CATEGORIES[id].icon, pct: Math.round(x.sum / x.k) })).sort((a, b) => b.pct - a.pct);
    const hardest = per.slice().sort((a, b) => a.pct - b.pct)[0];
    const avg = Math.round(rs.reduce((a, r) => a + r.score, 0) / n), acc = Math.round(rs.reduce((a, r) => a + r.acc, 0) / n);
    const weak = catRows.filter(c => c.pct < 60);
    return '<div class="an-grid">' + AUI.tile('Class average', AUI.num(avg)) + AUI.tile('Class accuracy', acc + '%') + AUI.tile('Students', n) +
      AUI.tile('Most difficult', '#' + hardest.no + ' ' + esc(hardest.title) + ' — ' + hardest.pct + '% correct', true) + '</div>' +
      '<h3 style="margin-top:16px">Correct answers by topic</h3><div class="cat-bars">' + catRows.map(c => '<div class="cat-bar' + (c.pct < 60 ? ' low' : '') + '"><span>' + c.icon + ' ' + esc(c.name) + '</span><span class="bar"><span style="width:' + c.pct + '%"></span></span><span style="text-align:right">' + c.pct + '%</span></div>').join('') + '</div>' +
      (weak.length ? '<div class="tip">📚 <b>Worth reteaching:</b> ' + weak.map(c => esc(c.name)).join(', ') + '.</div>' : '') +
      '<details class="key-box" style="margin-top:14px"><summary>Every challenge</summary><table class="ptable"><tr><th>#</th><th>Challenge</th><th>Topic</th><th class="num">Correct</th></tr>' +
      per.map(p => '<tr><td>' + p.no + '</td><td>' + esc(p.title) + '</td><td>' + A.CATEGORIES[p.cat].icon + ' ' + esc(A.CATEGORIES[p.cat].name) + '</td><td class="num">' + p.pct + '%</td></tr>').join('') + '</table></details>';
  }
  function addResult(name, raw) {
    const tg = tgame();
    name = String(name || '').replace(/\s+/g, ' ').trim();
    if (name.length < 2) { tmsg = 'Type the student’s name.'; return false; }
    const r = readResult(tdata.current, name, raw);
    if (r.error) { tmsg = r.error; return false; }
    const same = tg.results.findIndex(x => normName(x.name) === normName(name));
    if (same >= 0) {
      if (tg.results[same].score === r.result.score && tg.results[same].mask === r.result.mask) { tmsg = name + ' is already in the list.'; return false; }
      if (!confirm(name + ' already has a result (' + tg.results[same].score + ' points). Replace it with this one (' + r.result.score + ' points)?')) { tmsg = ''; return false; }
      tg.results.splice(same, 1);
    }
    tg.results.push(Object.assign({ name, at: now() }, r.result));
    saveT();
    tmsg = '✅ Added ' + name + ': ' + r.result.score + ' points.';
    return true;
  }
  function saveCsv() {
    const tg = tgame(), rs = ranked(tg.results), list = scoredList(tdata.current);
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['Game', tdata.current], ['Grade', tg.grade], [], ['Rank', 'Name', 'Score', 'Accuracy %', 'Correct', 'Final crisis'].concat(list.map((c, i) => '#' + (i + 1) + ' ' + c.title))];
    rs.forEach((r, i) => rows.push([i + 1, r.name, r.score, r.acc, bits(r.mask), crisisLabel(r.crisis).replace(/^\S+ /, '')].concat(list.map((c, k) => r.mask & (1 << k) ? 1 : 0))));
    UI.download('Cyber_Arena_' + tdata.current + '_results.csv', '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
    UI.toast('💾 Saved to Downloads (stays on this computer).');
  }

  /* ---------------- buttons ---------------- */
  function wire() {
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
      const go = b.dataset.go;
      if (go === 'next') next();
      else if (go === 'continue') { view = 'game'; render(true); }
      else if (go === 'teacher') { view = 'teacher'; tmsg = ''; render(true); }
      else if (go === 'home') { if (G() && G().phase === 'final') data.game = null; save(); view = 'home'; notice = ''; render(true); }
    }));
    const jf = $('#join-form');
    if (jf) jf.addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#h-name').value.replace(/\s+/g, ' ').trim(), parsed = parseCode($('#h-code').value);
      if (name.length < 2) { notice = 'Please type your name (at least 2 letters).'; render(true); return; }
      if (!parsed) { notice = 'That game code doesn’t look right. It looks like 9-4821 — ask your teacher.'; render(true); return; }
      const past = data.played[parsed.code];
      if (past) { notice = 'This computer already played game ' + parsed.code + (past.result ? ' (' + past.name + ', ' + past.score + ' points, result code ' + past.result + ')' : '') + '. Each game can be played once — ask your teacher for a new code.'; render(true); return; }
      notice = '';
      startGame(name, parsed, false);
    });
    const sf = $('#solo-form');
    if (sf) sf.addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#s-name').value.replace(/\s+/g, ' ').trim();
      if (name.length < 2) { notice = 'Please type your name (at least 2 letters).'; render(true); return; }
      let code; do { code = newCode(+$('#s-grade').value, false); } while (data.played[code]);
      notice = '';
      startGame(name, parseCode(code), true);
    });
    wireAnswer();
    // teacher
    const mk = $('#t-make');
    if (mk) mk.addEventListener('click', () => {
      let code; do { code = newCode(+$('#t-grade').value, $('#t-relaxed').value === '1'); } while (tdata.games[code]);
      const p = parseCode(code);
      tdata.games[code] = { grade: p.grade, relaxed: p.relaxed, created: now(), results: [] };
      tdata.current = code; tmsg = ''; saveT(); render(true);
    });
    const use = $('#t-use');
    if (use) use.addEventListener('submit', e => {
      e.preventDefault();
      const p = parseCode($('#t-usecode').value);
      if (!p) { UI.toast('A game code looks like 9-4821 (grade, dash, 4 digits).'); return; }
      if (!tdata.games[p.code]) tdata.games[p.code] = { grade: p.grade, relaxed: p.relaxed, created: now(), results: [] };
      tdata.current = p.code; tmsg = ''; saveT(); render(true);
    });
    const pk = $('#t-pick');
    if (pk) pk.addEventListener('change', () => { tdata.current = pk.value; tmsg = ''; saveT(); render(true); });
    const add = $('#t-add');
    if (add) add.addEventListener('submit', e => {
      e.preventDefault();
      const name = $('#t-name').value, code = $('#t-code').value;
      tform = addResult(name, code) ? { name: '', code: '' } : { name, code };
      render(true);
      const f = $(tform.name ? '#t-code' : '#t-name'); if (f) f.focus();
    });
    const big = $('#t-big');
    if (big) big.addEventListener('click', () => { tbig = !tbig; render(true); });
    const csv = $('#t-csv');
    if (csv) csv.addEventListener('click', saveCsv);
    const clr = $('#t-clear');
    if (clr) clr.addEventListener('click', () => { if (confirm('Remove all results for game ' + tdata.current + '?')) { tgame().results = []; saveT(); tmsg = ''; render(true); } });
    app.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      const tg = tgame(), i = tg.results.findIndex(r => r.name === b.dataset.del);
      if (i >= 0 && confirm('Remove ' + tg.results[i].name + '’s result?')) { tg.results.splice(i, 1); saveT(); render(true); }
    }));
  }

  // a damaged or unreadable save must never leave a blank page: drop the unfinished game (results are kept)
  try {
    const g = data.game;
    if (g && (!parseCode(g.code) || !stages()[g.si] || !['intro', 'question', 'reveal', 'partEnd', 'final'].includes(g.phase) || (g.phase === 'question' && !(g.cur && g.cur.ids)) || (g.phase === 'final' && !g.report))) throw new Error('bad save');
    if (g && g.phase !== 'partEnd' && g.phase !== 'final') item();
  } catch (e) { data.game = null; view = 'home'; notice = 'Your last game could not be loaded, so it was closed. Finished games and result codes are kept.'; save(); }
  // a game left in the middle of a question: the clock kept running while the page was closed
  if (data.game && data.game.phase === 'question' && timeLeft() <= 0) finishQuestion(null);
  render(true);

  // test hook (?test=1): lets an automated check play through the game
  if (/[?&]test=1/.test(location.search)) window.CyberArena = { data: () => data, tdata: () => tdata, inst, item, next, finishQuestion, makeResult, readResult, parseCode, planOf, addResult, render, setView: v => { view = v; render(true); } };
})();

</script>
</body>
</html>
