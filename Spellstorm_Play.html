<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play latest · Spellstorm Royale</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#20465b,#101a2e 70%);color:#f8f1df;font:18px/1.5 system-ui}main{max-width:560px;margin:24px;padding:34px;text-align:center;border:1px solid #c29b55;border-radius:18px;background:#12243a}h1{font:700 38px Georgia,serif;color:#ffe0a0;margin:0 0 18px}p{color:#c6d8e4}button{background:#f3cc74;color:#16233a;border:0;border-radius:10px;padding:13px 24px;font:700 18px system-ui;cursor:pointer}small{display:block;margin-top:24px;color:#8fa9ba}</style></head><body><main><h1>Spellstorm Royale</h1><p id="status" role="status">Opening the latest game…</p><button id="retry" hidden>Try again</button><small>Bookmark this page for the latest version.<br>Your class room code is entered inside the game.</small></main><script>
(function(){'use strict';const status=document.querySelector('#status'),retry=document.querySelector('#retry');let busy=false;
async function liveBuild(signal){   // the build number in the LIVE game file (its first 2 KB only, never from a cache)
  const game=new URL('Tool_G6-12_Spellstorm_Royale.html',location.href);game.searchParams.set('check',Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const read=async headers=>{const r=await fetch(game,{cache:'no-store',headers,signal});if(!r.ok&&r.status!==206)throw Error('The game could not be read');const rd=r.body.getReader(),dec=new TextDecoder();let t='';
    while(t.length<8192){const x=await rd.read();if(x.done)break;t+=dec.decode(x.value,{stream:true});const m=t.match(/name="sr-build" content="(\d{14})"/);if(m){try{rd.cancel();}catch(e){}return m[1];}}return null;};
  try{return await read({Range:'bytes=0-2047'});}catch(e){if(signal.aborted)throw e;}return read({});}
async function openLatest(){if(busy)return;busy=true;retry.hidden=true;status.textContent='Checking the latest game…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
try{const nonce=Date.now().toString(36)+Math.random().toString(36).slice(2,8),build=await liveBuild(controller.signal);
  const target=new URL('Tool_G6-12_Spellstorm_Royale.html',location.href);target.searchParams.set('v',build||nonce);target.searchParams.set('launch',nonce);
  const room=new URL(location.href).searchParams.get('room');if(room&&/^[A-Z0-9-]{3,16}$/i.test(room))target.searchParams.set('room',room.toUpperCase());
  status.textContent='Latest version found. Starting…';location.replace(target.href);
}catch(e){status.textContent='Could not check the latest version. Check the internet, then click Try again.';retry.hidden=false;}finally{clearTimeout(timer);busy=false;}}
retry.onclick=openLatest;openLatest();})();
</script></body></html>
