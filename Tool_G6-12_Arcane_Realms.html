.bars { display: flex; flex-direction: column; gap: 5px; }

<script>/* src/shared/util.js */
/* Arcane Realms · src/shared/util.js — small helpers shared by server and client (no DOM). */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  const rng = seed => { let s = (seed >>> 0) || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };
  const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const newId = () => (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 12).padEnd(12, '0');
  const r2 = v => Math.round(v * 100) / 100;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // Kind-words filter for nicknames and chat (school setting). Matches whole words and common letter swaps.
  const BAD = ['stupid', 'idiot', 'dumb', 'loser', 'hate', 'kill yourself', 'kys', 'shut up', 'ugly', 'fat', 'noob', 'trash',
    'damn', 'hell', 'crap', 'sucks', 'suck', 'shit', 'fuck', 'bitch', 'ass', 'bastard', 'dick', 'piss', 'sex', 'porn', 'retard', 'moron'];
  const norm = s => String(s || '').toLowerCase().replace(/[@4]/g, 'a').replace(/3/g, 'e').replace(/[1!|]/g, 'i').replace(/0/g, 'o').replace(/[$5]/g, 's').replace(/7/g, 't');
  function isUnkind(s) {
    const t = ' ' + norm(s).replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ') + ' ', squash = norm(s).replace(/[^a-z]/g, '');
    return BAD.some(w => t.indexOf(' ' + w + ' ') >= 0 || (w.length >= 5 && squash.indexOf(w.replace(/ /g, '')) >= 0));
  }
  function cleanText(s, max) { return String(s || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, max || 80); }
  function cleanName(s) {
    const t = cleanText(s, 16).replace(/[^\p{L}\p{N} _.-]/gu, '').trim();
    return t && !isUnkind(t) ? t : '';
  }
  const GID = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function gameId(rnd) { const r = rnd || Math.random; let s = ''; for (let i = 0; i < 4; i++) s += GID[Math.floor(r() * GID.length)]; return '#' + s; }
  const ROOM_WORDS = ['ELF', 'DRAKE', 'RUNE', 'OAK', 'MAGE', 'GROVE', 'KEEP', 'WYRM', 'GEM', 'FAE', 'TOME', 'STAR'];
  function roomCode(rnd) { const r = rnd || Math.random; return ROOM_WORDS[Math.floor(r() * ROOM_WORDS.length)] + '-' + (10 + Math.floor(r() * 90)); }
  const fmtTime = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };

  AR.util = { rng, hash, newId, r2, clamp, isUnkind, cleanText, cleanName, gameId, roomCode, fmtTime };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* src/shared/balance.js */
/* Arcane Realms · src/shared/balance.js
   EVERY gameplay number lives here, in one editable place. All values are starting points for playtesting.
   The server simulation and the interface both read these tables, so a change here changes the game and the
   descriptions together. Times are in seconds unless the name says otherwise; distances in metres. */
(function (root) {

<script>/* src/shared/movement.js */
/* Shared, deterministic movement timing. Times use played round seconds, so pauses freeze recovery and jumps. */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};
  const cfg = () => AR.Balance.player;
  const fresh = () => ({ sprintFrom: -1, sprintUntil: -1, readyAt: 0, jumpAt: -1 });
  function sprint(m, t) {
    if (t < m.readyAt) return false;
    m.sprintFrom = t; m.sprintUntil = t + cfg().sprint.duration;
    m.readyAt = m.sprintUntil + cfg().sprint.recovery;
    return true;
  }
  function jump(m, t) {
    if (m.jumpAt >= 0 && t < m.jumpAt + flight() + cfg().jump.rest) return false;
    m.jumpAt = t; return true;
  }
  function flight() { return 2 * cfg().jump.velocity / cfg().jump.gravity; }
  function height(m, t) {
    const age = m && m.jumpAt >= 0 ? t - m.jumpAt : -1;
    return age < 0 || age > flight() ? 0 : Math.max(0, cfg().jump.velocity * age - cfg().jump.gravity * age * age / 2);
  }
  function active(m, t) { return !!m && t >= m.sprintFrom && t < m.sprintUntil; }
  function speed(m, t) { return cfg().speed * (active(m, t) ? cfg().sprint.multiplier : 1); }
  function distance(m, from, to) {
    const dt = Math.max(0, to - from);
    const boosted = m ? Math.max(0, Math.min(to, m.sprintUntil) - Math.max(from, m.sprintFrom)) : 0;
    return cfg().speed * (dt + boosted * (cfg().sprint.multiplier - 1));
  }
  AR.Motion = { fresh, sprint, jump, flight, height, active, speed, distance };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/shared/teams.js */
/* Arcane Realms · src/shared/teams.js — team sizes, shuffling, team identities and the income multiplier.
   Pure functions (no DOM), used by the server and by the tests in Node. */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  // Team identities: colour + symbol + name, so teams are never told apart by colour alone.
  const KINGDOMS = [
    { id: 'T1', name: 'Azure Stag', color: '#3b82f6', sym: '▲' },
    { id: 'T2', name: 'Crimson Phoenix', color: '#ef4444', sym: '◆' },
    { id: 'T3', name: 'Golden Griffin', color: '#eab308', sym: '★' },
    { id: 'T4', name: 'Violet Owl', color: '#a855f7', sym: '●' },
    { id: 'T5', name: 'Teal Serpent', color: '#14b8a6', sym: '■' },
    { id: 'T6', name: 'Amber Bear', color: '#f97316', sym: '✚' },
    { id: 'T7', name: 'Rose Unicorn', color: '#ec4899', sym: '⬟' },
    { id: 'T8', name: 'Silver Moon', color: '#94a3b8', sym: '☾' },
  ];

  /** Fewest teams that keeps every team between min and max players. Returns 0 when a match is not possible. */
  function suggestCount(n, min, max) {
    min = min || 3; max = max || 5;
    if (n < min * 2) return 0;
    const k = Math.ceil(n / max);
    return n >= k * min ? k : 0;
  }

  /** Team sizes for n players in k teams, differing by at most one, biggest first (13 → [5,4,4], 18 → [5,5,4,4]). */
  function sizes(n, k) {
    const base = Math.floor(n / k), extra = n % k, out = [];
    for (let i = 0; i < k; i++) out.push(base + (i < extra ? 1 : 0));
    return out;
  }

  /** Fisher–Yates shuffle with an optional seeded random function. */
  function shuffle(list, rnd) {
    const a = list.slice(), r = rnd || Math.random;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  /** Randomly distribute player ids into k teams. Returns [{id, name, color, sym, members: [...]}]. */
  function distribute(ids, k, rnd) {
    const order = shuffle(ids, rnd), sz = sizes(ids.length, k), teams = [];
    let at = 0;
    for (let i = 0; i < k; i++) {
      const K = KINGDOMS[i];
      teams.push({ id: K.id, name: K.name, color: K.color, sym: K.sym, members: order.slice(at, at + sz[i]) });
      at += sz[i];
    }
    return teams;
  }

  /** Income multiplier per team: smallest starting team size / this team's starting size. */
  function multipliers(teams) {
    const counts = teams.map(t => t.members.length).filter(n => n > 0);
    const smallest = counts.length ? Math.min.apply(null, counts) : 1, out = {};
    for (const t of teams) out[t.id] = t.members.length ? smallest / t.members.length : 1;
    return out;
  }

  /** Plain-language explanation for the lobby. */
  function explain(teams) {
    const m = multipliers(teams), lines = [];
    const diff = teams.some(t => m[t.id] !== 1);
    if (!diff) return ['All teams are the same size, so everyone earns the same gold per answer.'];
    lines.push('Teams have different sizes, so bigger teams earn a little less gold EACH. Team totals stay fair.');
    for (const t of teams) lines.push(t.sym + ' ' + t.name + ' (' + t.members.length + ' players): ×' + (Math.round(m[t.id] * 100) / 100) + ' gold per answer and starting gold' + (m[t.id] < 1 ? ', ×' + (Math.round(m[t.id] * 100) / 100) + ' character damage' : ''));
    lines.push('Every team gets the same army size, building limits and spell limits.');
    return lines;
  }

  AR.Teams = { KINGDOMS, suggestCount, sizes, shuffle, distribute, multipliers, explain };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/shared/questions.js */
/* Arcane Realms · src/shared/questions.js — question logic (no content, no DOM).
   - validate(bank)            → list of problems (empty = OK)
   - kindOf(q)                 → 'standard' | 'applied' | 'puzzle' (decides the reward)
   - deliver(q, rnd)           → {pub, key}: pub is what the student's screen gets (shuffled, NO answer);
                                 key is what only the server keeps to mark it
   - mark(q, key, answer)      → true / false
   - reveal(q, key)            → the correct answer in the student's shuffled order (sent only after a wrong answer)
   - Picker                    → which question a student gets next (variety, no reward twice, missed topics revisited) */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};
  const TYPES = ['choice', 'match', 'order', 'input'];

  function kindOf(q) {
    if (q.type === 'input') return 'puzzle';
    if (q.type === 'order' || q.sit) return 'applied';
    return 'standard';
  }

  function validate(bank) {
    const out = [], ids = {};
    if (!bank || !Array.isArray(bank.questions)) return ['bank has no questions'];
    for (const q of bank.questions) {
      const where = bank.id + ':' + (q.id || '?');
      if (!q.id) out.push(where + ' has no id');
      if (ids[q.id]) out.push(where + ' duplicate id'); ids[q.id] = 1;
      if (!bank.topics[q.topic]) out.push(where + ' unknown topic ' + q.topic);
      if (TYPES.indexOf(q.type) < 0) out.push(where + ' unknown type ' + q.type);
      if (!q.q || !q.ex || !q.fix) out.push(where + ' needs q, ex and fix');
      if (q.type === 'choice' && (!Array.isArray(q.o) || q.o.length < 2 || new Set(q.o).size !== q.o.length)) out.push(where + ' choice needs 2+ different options');
      if (q.type === 'match' && (!Array.isArray(q.pairs) || q.pairs.length < 3)) out.push(where + ' match needs 3+ pairs');
      if (q.type === 'match' && q.pairs && new Set(q.pairs.map(p => p[0])).size !== q.pairs.length) out.push(where + ' match left items must differ');
      if (q.type === 'order' && (!Array.isArray(q.items) || q.items.length < 3 || new Set(q.items).size !== q.items.length)) out.push(where + ' order needs 3+ different items');
      if (q.type === 'input' && (!Array.isArray(q.accept) || !q.accept.length)) out.push(where + ' input needs accept[]');
    }
    return out;
  }

  const shuffled = (n, rnd) => { const a = []; for (let i = 0; i < n; i++) a.push(i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const normInput = s => String(s == null ? '' : s).toLowerCase().replace(/[\s,]+/g, '').replace(/^\.+/, '').trim();

  /** Make the student's (public) copy. Choice: options shuffled. Match: right-hand list shuffled (unique values).
      Order: items shuffled (never already in the correct order). Input: just the prompt. */
  function deliver(q, rnd) {
    rnd = rnd || Math.random;
    const pub = { id: q.id, type: q.type, q: q.q, topic: q.topic, kind: kindOf(q) };
    let key = null;
    if (q.type === 'choice') {
      const perm = shuffled(q.o.length, rnd);
      pub.o = perm.map(i => q.o[i]);
      key = perm.indexOf(0);   // the first authored option is correct
    } else if (q.type === 'match') {
      const rights = Array.from(new Set(q.pairs.map(p => p[1]))), perm = shuffled(rights.length, rnd);
      pub.left = q.pairs.map(p => p[0]);
      pub.right = perm.map(i => rights[i]);
      key = q.pairs.map(p => pub.right.indexOf(p[1]));
    } else if (q.type === 'order') {
      let perm = shuffled(q.items.length, rnd), tries = 0;
      while (perm.every((v, i) => v === i) && tries++ < 10) perm = shuffled(q.items.length, rnd);
      pub.items = perm.map(i => q.items[i]);
      key = q.items.map(it => pub.items.indexOf(it));   // correct sequence of shown indexes
    } else if (q.type === 'input') {
      key = q.accept.map(normInput);
    }
    return { pub, key };
  }

  /** answer formats: choice → index; match → [rightIndex per left]; order → [shown indexes in chosen order]; input → string. */
  function mark(q, key, answer) {
    if (q.type === 'choice') return Number(answer) === key;
    if (q.type === 'match' || q.type === 'order') {
      if (!Array.isArray(answer) || answer.length !== key.length) return false;
      return key.every((v, i) => Number(answer[i]) === v);
    }
    if (q.type === 'input') return key.indexOf(normInput(answer)) >= 0;
    return false;
  }

  function reveal(q, key) {
    if (q.type === 'input') return q.accept[0];
    return key;
  }

  /** Per-student question chooser. State is plain data (saved with the server):
      {seen: {qid: count}, correct: {qid: 1}, missed: [{qid, topic, after}], served: n, lastTopic} */
  const Picker = {
    fresh() { return { seen: {}, correct: {}, missed: [], served: 0, lastTopic: null }; },
    next(bank, st, rnd, cfg) {
      rnd = rnd || Math.random;
      cfg = Object.assign({ revisitAfter: 3, sameQuestionAfter: 6 }, cfg);
      const open = bank.questions.filter(q => !st.correct[q.id]);
      if (!open.length) return null;   // every question answered correctly: bank mastered
      // 1) a missed concept that is due: same topic, preferably a different question; the very same question only
      //    after sameQuestionAfter others (so the revealed answer is never rewarded straight away)
      for (const due of st.missed.slice()) {
        if (st.served < due.at + cfg.revisitAfter) continue;
        const sameTopic = open.filter(q => q.topic === due.topic && q.id !== due.qid);
        const unseen = sameTopic.filter(q => !st.seen[q.id]), pool = unseen.length ? unseen : sameTopic;
        let pick = pool.length ? pool[Math.floor(rnd() * pool.length)] : null;
        if (!pick && !st.correct[due.qid] && st.served >= due.at + cfg.sameQuestionAfter) pick = bank.questions.find(q => q.id === due.qid);
        if (!pick && st.correct[due.qid] && !sameTopic.length) { st.missed.splice(st.missed.indexOf(due), 1); continue; }
        if (pick) { st.missed.splice(st.missed.indexOf(due), 1); return pick; }
      }
      // 2) unseen questions, avoiding the topic just asked
      const unseen = open.filter(q => !st.seen[q.id]);
      let pool = unseen.filter(q => q.topic !== st.lastTopic);
      if (!pool.length) pool = unseen;
      // 3) everything seen: questions not yet answered correctly, oldest/least-seen first, never the very last one
      if (!pool.length) {
        const wa = st.wrongAt || {}, ok = open.filter(q => q.id !== st.lastId && !(wa[q.id] != null && st.served < wa[q.id] + cfg.sameQuestionAfter));
        if (!ok.length) return null;   // only just-missed questions are left: wait (the shrine says "come back soon")
        const min = Math.min.apply(null, ok.map(q => st.seen[q.id] || 0));
        pool = ok.filter(q => (st.seen[q.id] || 0) === min);
      }
      return pool[Math.floor(rnd() * pool.length)];
    },
    served(st, q) { st.seen[q.id] = (st.seen[q.id] || 0) + 1; st.served++; st.lastTopic = q.topic; st.lastId = q.id; },
    wrong(st, q) {
      (st.wrongAt = st.wrongAt || {})[q.id] = st.served;
      if (!st.missed.some(m => m.topic === q.topic)) st.missed.push({ qid: q.id, topic: q.topic, at: st.served });
    },
    right(st, q) { st.correct[q.id] = 1; },
  };

  const Banks = {
    get(id) { return AR.BankData && AR.BankData[id] ? AR.BankData[id] : null; },
    list() { return Object.keys(AR.BankData || {}).map(k => AR.BankData[k]); },

<script>/* src/shared/maps.js */
/* Arcane Realms · src/shared/maps.js — map layouts (no DOM, no WebGL): terrain height, kingdom slots, shrines, paths,
   scenery placement and colliders. Deterministic from (map, team count), so the server and every client agree.
   Kingdoms sit evenly on a ring, so every team has the same base space and the same travel distances.
   Routes: a spoke from every kingdom to the central ruins plus a ring road between neighbours (no single chokepoint). */

  'use strict';

    const sm = t => t * t * (3 - 2 * t);
    return (x, z) => {
      const xi = Math.floor(x), zi = Math.floor(z), fx = sm(x - xi), fz = sm(z - zi);
      const a = h(xi, zi), b = h(xi + 1, zi), c = h(xi, zi + 1), d = h(xi + 1, zi + 1);

    return [Math.hypot(px - (a[0] + dx * t), pz - (a[1] + dz * t)), t];
  }

  const DEFS = {
    emerald: {
      id: 'emerald', name: 'Emerald Glades', round: 1,
      text: 'A green forest realm with rolling hills, ancient ruins and clear paths.',
      seed: 11, half: 130, ring: 86, baseR: 24, plazaR: 15, hill: 7, baseH: 1.2, edge: 112,
      palette: { grass: ['#6aa84f', '#74b35a', '#7cbf5e', '#5f9e46'], grassHigh: '#8cc06a', path: '#c8a46a', base: '#9ccf72', plaza: '#b9b2a2', rock: ['#8d8f96', '#9a9088', '#8a7f73'], edge: '#6f8f5a' },
      lighting: 'forest',
    },
    stormcrest: {
      id: 'stormcrest', name: 'Stormcrest Valley', round: 2, style: 'storm',
      text: 'A rocky valley under storm clouds: a dry riverbed with bridges, crystal formations and new attack routes.',
      seed: 29, half: 130, ring: 86, baseR: 24, plazaR: 13, hill: 10, baseH: 1.4, edge: 112, riverR: 50, riverW: 6,
      palette: { grass: ['#8f9b62', '#9aa36c', '#848f58', '#a3a372'], grassHigh: '#a59c7c', path: '#b8a07a', base: '#a7b27a', plaza: '#a69f92', river: '#d2bf95', rock: ['#8d8f96', '#7f7a74', '#9a9088'], edge: '#7c7766' },
      lighting: 'storm',
    },

  /** Build the layout for `teams` kingdoms (2..8). Returns a plain object with functions. */
  function build(mapId, teams) {

    const n1 = noise2(D.seed), n2 = noise2(D.seed + 7), n3 = noise2(D.seed + 19);

      const dir = [Math.cos(a), Math.sin(a)];          // outward from the centre
      const c = [dir[0] * D.ring, dir[1] * D.ring];
      bases.push({
        index: i, angle: a, dir, center: c,
        heartkeep: [c[0] - dir[0] * 2, c[1] - dir[1] * 2],
        shrine: [c[0] + dir[0] * 15, c[1] + dir[1] * 15],                       // the rear of the kingdom
        spawn: [c[0] - dir[0] * 10, c[1] - dir[1] * 10],                        // in front of the Heartkeep
        gate: [c[0] - dir[0] * D.baseR, c[1] - dir[1] * D.baseR],

    const riverC = a => D.riverR + Math.sin(a * 3) * 5;   // the riverbed's centre line (meanders)

      const a0 = bases[i].angle, a1 = bases[(i + 1) % k].angle + (i + 1 === k ? Math.PI * 2 : 0), steps = Math.max(3, Math.round((a1 - a0) * 6));
      const R = D.ring - D.baseR * 0.55;
      for (let s = 0; s < steps; s++) {
        const t0 = a0 + (a1 - a0) * s / steps, t1 = a0 + (a1 - a0) * (s + 1) / steps;

    /** distance to the nearest path (m) */
    function pathDist(x, z) { let best = 1e9; for (const p of paths) { const d = segDist(x, z, p[0], p[1])[0]; if (d < best) best = d; } return best; }
    function nearestBase(x, z) { let best = null, bd = 1e9; for (const b of bases) { const d = Math.hypot(x - b.center[0], z - b.center[1]); if (d < bd) { bd = d; best = b; } } return { base: best, dist: bd }; }

    /** distance to the dry riverbed's centre line (Stormcrest only; Infinity elsewhere) */
    function riverDist(x, z) { return storm ? Math.abs(Math.hypot(x, z) - riverC(Math.atan2(z, x))) : Infinity; }

      h = Math.max(h, -0.3);
      if (storm) {   // rocky ridges, and the dry riverbed: a wide sandy channel all round the valley
        h += Math.pow(Math.max(0, n3(x / 21 + 5, z / 21) - 0.55), 2) * 40;
        const rd = riverDist(x, z);

      scenery.push({ kind: r < 0.55 ? 'bush' : r < 0.9 ? 'flowers' : 'crystal', x, z, s: 0.7 + rnd() * 0.6, rot: rnd() * 6.28, v: Math.floor(rnd() * 4) });

        if (!free(x, z, 1.5)) continue;

        scenery.push({ kind: 'crystalBig', x, z, s, rot: rnd() * 6.28, v: i % 4 });
        colliders.push({ x, z, r: 1.3 * s });

      for (const b of bases) { const p = riverPt(b.angle); scenery.push({ kind: 'bridge', x: p[0], z: p[1], s: 1, rot: Math.atan2(b.dir[0], b.dir[1]), v: 0, flat: true }); }

    for (let i = 0; i < 10; i++) {

    colliders.push({ x: 0, z: 0, r: 1.6 });

    for (const b of bases) colliders.push({ x: b.heartkeep[0], z: b.heartkeep[1], r: 5.2, keep: b.index });

      return null;

<script>/* src/server/pathfind.js */
/* Arcane Realms · src/server/pathfind.js — ground pathfinding for troops (server only, no DOM).
   A 2 m grid over the realm. Blocked: trees, rocks, ruins, Heartkeeps (from the map), steep mountains, and buildings
   (added/removed while playing). A* with 8 directions (no corner cutting), then the path is straightened with
   line-of-sight checks so troops walk in clean lines. */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  class PathGrid {
    constructor(layout, cell) {
      this.L = layout; this.cell = cell || 2; this.half = layout.def.edge;
      this.n = Math.ceil(this.half * 2 / this.cell);
      this.block = new Uint16Array(this.n * this.n);   // counts, so overlapping obstacles can be removed safely
      for (let j = 0; j < this.n; j++) for (let i = 0; i < this.n; i++) {
        const [x, z] = this.center(i, j);
        if (layout.height(x, z) > 6.5) this.block[j * this.n + i] = 1;   // mountains at the edge
      }
      for (const c of layout.colliders) this.mark(c.x, c.z, c.r + 0.4, 1);
    }
    center(i, j) { return [-this.half + (i + 0.5) * this.cell, -this.half + (j + 0.5) * this.cell]; }
    cellOf(x, z) { return [Math.floor((x + this.half) / this.cell), Math.floor((z + this.half) / this.cell)]; }
    inside(i, j) { return i >= 0 && j >= 0 && i < this.n && j < this.n; }
    blocked(i, j) { return !this.inside(i, j) || this.block[j * this.n + i] > 0; }
    freeAt(x, z) { const [i, j] = this.cellOf(x, z); return !this.blocked(i, j); }
    /** Add (d = +1) or remove (d = -1) a round obstacle. */
    mark(x, z, r, d) {
      const [i0, j0] = this.cellOf(x - r, z - r), [i1, j1] = this.cellOf(x + r, z + r);
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        if (!this.inside(i, j)) continue;
        const [cx, cz] = this.center(i, j);
        if (Math.hypot(cx - x, cz - z) <= r + this.cell * 0.35) { const k = j * this.n + i; this.block[k] = Math.max(0, this.block[k] + d); }
      }
    }
    /** Nearest free cell centre to (x, z), or null. */
    nearestFree(x, z, maxR) {
      const [ci, cj] = this.cellOf(x, z);
      if (!this.blocked(ci, cj)) return [x, z];
      for (let r = 1; r <= (maxR || 12); r++) {
        let best = null, bd = 1e9;
        for (let j = cj - r; j <= cj + r; j++) for (let i = ci - r; i <= ci + r; i++) {
          if (Math.max(Math.abs(i - ci), Math.abs(j - cj)) !== r || this.blocked(i, j)) continue;
          const [cx, cz] = this.center(i, j), d = Math.hypot(cx - x, cz - z);
          if (d < bd) { bd = d; best = [cx, cz]; }
        }
        if (best) return best;
      }
      return null;
    }
    /** Straight walkable line between two points? */
    los(ax, az, bx, bz) {
      // visit EVERY cell the segment touches (grid traversal), so a line never clips the corner of a blocked cell
      const c = this.cell, h = this.half, x0 = (ax + h) / c, z0 = (az + h) / c, x1 = (bx + h) / c, z1 = (bz + h) / c;
      let i = Math.floor(x0), j = Math.floor(z0);
      const i1 = Math.floor(x1), j1 = Math.floor(z1), dx = x1 - x0, dz = z1 - z0;
      const si = dx > 0 ? 1 : -1, sj = dz > 0 ? 1 : -1;
      const tdx = dx ? Math.abs(1 / dx) : Infinity, tdz = dz ? Math.abs(1 / dz) : Infinity;
      let tx = dx ? (dx > 0 ? (i + 1 - x0) : (x0 - i)) * tdx : Infinity, tz = dz ? (dz > 0 ? (j + 1 - z0) : (z0 - j)) * tdz : Infinity;
      for (let n = 0; n < 4000; n++) {
        if (this.blocked(i, j)) return false;
        if (i === i1 && j === j1) return true;
        if (Math.abs(tx - tz) < 1e-9) { if (this.blocked(i + si, j) || this.blocked(i, j + sj)) return false; i += si; j += sj; tx += tdx; tz += tdz; }
        else if (tx < tz) { i += si; tx += tdx; } else { j += sj; tz += tdz; }

    }
    /** Path from (ax, az) to (bx, bz): array of [x, z] waypoints (without the start), or null if unreachable.

    find(ax, az, bx, bz, maxNodes) {

      const g0 = this.cellOf(goal[0], goal[1]);

      const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = i * 2 + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
      const hEst = k => { const i = k % n, j = (k / n) | 0, dx = Math.abs(i - g0[0]), dz = Math.abs(j - g0[1]); return Math.max(dx, dz) + 0.414 * Math.min(dx, dz); };
      G[si] = 0; push(si, hEst(si));
      let found = false, expanded = 0;
      const lim = maxNodes || 9000;
      while (heap.length) {
        const [, k] = pop();
        if (closed[k]) continue;
        closed[k] = 1;
        if (k === gi) { found = true; break; }
        if (++expanded > lim) break;
        const i = k % n, j = (k / n) | 0;
        for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
          if (!di && !dj) continue;
          const ni = i + di, nj = j + dj;
          if (this.blocked(ni, nj)) continue;
          if (di && dj && (this.blocked(i + di, j) || this.blocked(i, j + dj))) continue;   // no corner cutting
          const nk = nj * n + ni, cost = G[k] + (di && dj ? 1.414 : 1);
          if (cost < G[nk]) { G[nk] = cost; from[nk] = k; push(nk, cost + hEst(nk)); }
        }
      }
      if (!found) return null;
      const cells = [];
      for (let k = gi; k !== -1 && k !== si; k = from[k]) cells.push(k);
      cells.reverse();
      const pts = cells.map(k => this.center(k % n, (k / n) | 0));
      pts[pts.length - 1] = goal.slice();
      // straighten: keep a point only when the line from the last kept point to the next one is blocked
      const out = []; let ax2 = ax, az2 = az;
      for (let i = 0; i < pts.length; i++) {
        const nxt = pts[i + 1];
        if (nxt && this.los(ax2, az2, nxt[0], nxt[1])) continue;
        out.push(pts[i]); ax2 = pts[i][0]; az2 = pts[i][1];
      }
      return out.map(p => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]);
    }
  }
  AR.PathGrid = PathGrid;
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* src/server/sim.js */
/* Arcane Realms · src/server/sim.js — the authoritative BATTLE simulation. Runs inside AR.Server (the teacher's
   browser, or Node for tests). No DOM. All state is plain data in server.s.w so the host can save and restore it.
   Milestone 2: buildings (buy + place in your own kingdom, construction, health, owner-only sell, limited teammate
   repairs, destruction; Heartkeep destroyed = team eliminated), troops (recruit at a finished team building, equal army

        if (now < sp.at) continue;

        if (sp.ty === 'tidalWave') {

          if (sp.front >= D.length) sp.done = sp.pulses;
        } else {
          while (sp.done < sp.pulses && now >= sp.at + sp.done * sp.every) { this.spellPulse(sp, now); sp.done++; this.addFx('z' + sp.ty[0], sp.x, sp.z, sp.x, sp.z, sp.tm); }
        }
        if (sp.done >= sp.pulses && now > sp.end + 800) { delete this.w.sp[sp.id]; this.dirty[sp.id] = 'remove'; }
      }
      for (const w of Object.values(this.w.wd)) if (now >= w.until) { delete this.w.wd[w.id]; this.dirty[w.id] = 'remove'; S.touchG(); }
    }

    // ===================== views (published by the host) =====================
    structView(s) { return { ty: s.ty, tm: s.tm, own: s.own, x: s.x, z: s.z, r: Math.round(s.rot * 100) / 100, hp: Math.ceil(s.hp), mx: s.max, bp: Math.round(s.bp * 100), f: s.free ? 1 : 0 }; }
    unitView(u) {
      return { ty: u.ty, tm: u.tm, own: u.own, hp: Math.ceil(u.hp), mx: u.max, s: u.st, p: r1(u.p0[0]) + ',' + r1(u.p0[1]), w: u.path.map(p => p[0] + ',' + p[1]).join(';'), t: u.t0, v: Math.round(this.speedOf(u) * 100) / 100, tg: u.tg || '', rd: u.st === 'sum' ? u.ready : 0 };
    }
    spellView(sp) { return { ty: sp.ty, tm: sp.tm, own: sp.own, x: sp.x, z: sp.z, dx: sp.dx, dz: sp.dz, at: sp.at, end: sp.end, ev: sp.every, n: sp.pulses }; }
    wardView(w) { return { tm: w.tm, own: w.own, x: w.x, z: w.z, until: w.until }; }
    /** Per-team magic and research state for the interface (cooldowns, casts left, armour). */
    teamView(tm) {
      const st = this.team(tm), r = st.res.armour;
      return { lock: st.lock || 0, cd: Object.assign({}, st.cd), casts: st.casts || 0, ward: st.wardReady || 0, armour: r ? (r.done ? 1 : r.doneAt) : 0 };
    }
    /** Changes since the last call: id → view | null. HP-only changes are sent at most every hpEveryMs. */
    takeDirty(hpEveryMs) {
      const out = {}, now = Date.now(), keep = {}, w = this.w;
      this._hpAt = this._hpAt || {};
      for (const id in this.dirty) {
        const k = this.dirty[id], e = w.b[id] || w.u[id] || w.sp[id] || w.wd[id];
        if (k === 'remove' || !e) { out[id] = null; delete this._hpAt[id]; continue; }
        if (k === 'hp' && now - (this._hpAt[id] || 0) < hpEveryMs) { keep[id] = 'hp'; continue; }
        this._hpAt[id] = now;
        out[id] = id[0] === 'b' ? this.structView(e) : id[0] === 'u' ? this.unitView(e) : id[0] === 's' ? this.spellView(e) : this.wardView(e);
      }
      this.dirty = keep;
      return out;
    }
    takeFx() { const f = this.fx; this.fx = []; return f; }
    allDirty() { const w = this.w; for (const m of [w.b, w.u, w.sp, w.wd]) for (const id in m) this.dirty[id] = 'full'; }
  }
  Sim.PATH = { b: 'st/', u: 'un/', s: 'sp/', w: 'wd/' };   // where each kind is published in the room
  AR.Sim = Sim;
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* src/server/server.js */
/* Arcane Realms · src/server/server.js — THE AUTHORITATIVE GAME SERVER (no DOM, no network).
   It runs inside the teacher's (host's) browser; src/net/host.js connects it to the room. Students only send requests;
   everything that matters is decided here: answers and rewards, gold and unlock progress, teams, chat membership and
   moderation, positions (validated), round clock and victory. Runs in Node too (tests/server.test.js).

   Student requests  handle(pid, {t, ...}):
     shrine            enter your team's knowledge shrine (must stand next to it; round running)
     leave             leave the shrine (protection ends)
     ans  {tok, a}     answer the current question (tok = the question's one-time token)
     fixdone {tok, a}  complete the correction step after a wrong answer (no reward)
     next              ask for the next question
     chat {x} · quick {i} · ping {x, z} · report {target, reason} · look {look}
   Presence / position (from the player's own record): join(pid, name, look), presence(pid, online), pos(pid, x, y, z, yaw)
   Teacher (host) actions are plain method calls: suggestTeams, setTeamCount, shuffleTeams, moveToTeam, start, pause,
   resume, end, kick, mute, rename, announce.
   Output: the host reads `dirty` (what changed) and the view functions (gView, pView, pvView, posString). */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};
  const B = () => AR.Balance, Q = () => AR.Questions, U = AR.util;

  const LOOK_RANGES = { robe: 10, hat: 4, skin: 6, hair: 8, gem: 6, trim: 6 };
  function cleanLook(l) {
    const out = {};
    for (const k in LOOK_RANGES) { const v = l && Number(l[k]); out[k] = Number.isInteger(v) && v >= 0 && v < LOOK_RANGES[k] ? v : 0; }
    return out;
  }

  class Server {
    /** opts: {bankId, mapId, now: () => ms, seed, practice, room} */
    constructor(opts) {
      opts = opts || {};
      this.now = opts.now || (() => Date.now());
      this.rnd = U.rng(opts.seed || (Date.now() & 0xffffff) || 1);
      this.practice = !!opts.practice;
      this.s = {
        v: 1, room: opts.room || '', bankId: opts.bankId || 'g68', mapId: opts.mapId || 'emerald',
        phase: 'lobby',                 // lobby → running → ended
        round: 1, locked: false, teamCount: 0,
        players: {}, teams: [],
        clock: { startedAt: 0, pausedAt: 0, pausedTotal: 0 },
        chatLog: [], reports: [], flagged: [], qstats: {}, ann: '', results: null, seq: 1, kicked: {},
      };
      this.dirty = { g: true, p: {}, pv: {}, chat: [], pos: true };
      this._bank = null;
      this.sim = new AR.Sim(this);   // buildings, troops and combat (Milestone 2)
    }

    // ===================== helpers =====================
    bank() { if (!this._bank || this._bank.id !== this.s.bankId) this._bank = Q().Banks.get(this.s.bankId); return this._bank; }
    map() {
      const k = Math.max(2, this.s.teams.length);
      if (!this._map || this._map.id !== this.s.mapId || this._map.teams !== k) this._map = AR.Maps.build(this.s.mapId, k);
      return this._map;
    }
    player(pid) { return this.s.players[pid] || null; }
    team(id) { return this.s.teams.find(t => t.id === id) || null; }
    teamIndex(id) { return this.s.teams.findIndex(t => t.id === id); }
    touchP(pid) { this.dirty.p[pid] = 1; }
    touchPv(pid) { this.dirty.pv[pid] = 1; }
    touchG() { this.dirty.g = true; }
    notify(pid, text, kind) { const P = this.player(pid); if (!P) return; P.note = { x: text, k: kind || 'info', n: (P.note ? P.note.n : 0) + 1 }; this.touchPv(pid); }

    /** Seconds of round time played (pauses excluded). */
    elapsed(now) {
      const c = this.s.clock; now = now == null ? this.now() : now;
      if (this.s.phase === 'lobby' || !c.startedAt) return 0;
      const end = c.pausedAt || (this.s.phase === 'ended' && c.endedAt) || now;
      return Math.max(0, (end - c.startedAt - c.pausedTotal) / 1000);
    }
    phaseInfo(now) {
      const t = this.elapsed(now), list = B().round.phases;
      let cur = list[0];
      for (const p of list) if (t >= p.from) cur = p;
      const next = list.find(p => p.from > t) || null;
      return { phase: cur, next, t, left: B().round.durationSec - t };
    }
    isRunning() { return this.s.phase === 'running' && !this.s.clock.pausedAt; }

    // ===================== presence =====================
    join(pid, name, look) {
      if (!/^[a-z0-9]{6,20}$/.test(String(pid))) return { ok: false, why: 'bad id' };
      if ((this.s.kicked || {})[pid]) return { ok: false, why: 'removed by the teacher' };
      let P = this.player(pid);
      const nm = U.cleanName(name);
      if (!P) {
        if (Object.keys(this.s.players).length >= 48) return { ok: false, why: 'room full' };
        const gids = new Set(Object.values(this.s.players).map(p => p.gid));
        let gid; do { gid = U.gameId(this.rnd); } while (gids.has(gid));
        P = this.s.players[pid] = {
          id: pid, name: nm || 'Mage ' + gid.slice(1), gid, look: cleanLook(look), team: null, late: false,
          online: true, joinedAt: this.now(), gold: 0, earned: 0, earnedRaw: 0, mult: 1,
          shrine: null, pos: null, posAt: 0, sp: null, muted: false, chatTimes: [], lastText: '', lastTextAt: 0, lastPingAt: 0,
          qs: Q().Picker.fresh(), cur: null, stats: {}, right: 0, wrong: 0, corrections: 0, dupes: 0, mastered: false, note: null,
        };
        if (!nm && name) this.flag(pid, 'nickname', String(name).slice(0, 20));
        if (this.s.phase !== 'lobby') P.late = true;
      } else {
        P.online = true;
        if (look) P.look = cleanLook(look);
      }
      this.touchP(pid); this.touchPv(pid); this.touchG(); this.dirty.pos = true;
      return { ok: true, player: P };
    }
    presence(pid, online) {
      const P = this.player(pid); if (!P) return;
      if (P.online === !!online) return;
      P.online = !!online;
      if (!online && P.shrine) this.leaveShrine(pid, 'disconnected');
      this.touchP(pid); this.touchG(); this.dirty.pos = true;
    }

    /** A position report from a student's PC. The server accepts it only if it is possible. */
    pos(pid, x, y, z, yaw) {
      const P = this.player(pid);
      if (!P || !P.team || this.s.phase !== 'running' || ![x, y, z, yaw].every(isFinite) || P.dead || P.out) return;
      const now = this.now(), M = this.map(), cfg = B().player;
      const ti = this.teamIndex(P.team);
      let bad = null;
      if (P.pos && P.posAt) {
        const dt = Math.min(5, Math.max(0.05, (now - P.posAt) / 1000)), d = Math.hypot(x - P.pos[0], z - P.pos[2]);
        if (d > AR.Motion.distance(P.motion, this.elapsed(now) - dt, this.elapsed(now)) * cfg.maxSpeedSlack + 2.5) bad = 'too fast';
      }
      if (!M.inBounds(x, z)) bad = 'out of bounds';
      const ph = this.phaseInfo(now).phase;
      if (!bad && !ph.enemyBaseEntry && M.inEnemyBase(x, z, ti)) bad = 'enemy kingdom closed';
      if (this.s.clock.pausedAt && P.pos && Math.hypot(x - P.pos[0], z - P.pos[2]) > 1.5) bad = 'paused';
      if (bad) {
        if (P.pos) this.teleport(pid, P.pos[0], P.pos[2]);
        if (bad === 'enemy kingdom closed') this.notify(pid, 'Enemy kingdoms are closed during Preparation.', 'warn');
        return;
      }
      P.pos = [x, M.height(x, z), z, yaw]; // Jump is visual; height never bypasses ground collision.
      P.posAt = now;
      if (P.shrine && Math.hypot(x - P.shrine.x, z - P.shrine.z) > B().shrine.leaveRange) this.leaveShrine(pid, 'moved');
      this.dirty.pos = true;
    }
    teleport(pid, x, z) {
      const P = this.player(pid); if (!P) return;
      const y = this.map().height(x, z);
      P.pos = [x, y, z, P.pos ? P.pos[3] : 0]; P.posAt = this.now();
      P.sp = [U.r2(x), U.r2(z), (P.sp ? P.sp[2] : 0) + 1];
      this.touchP(pid); this.dirty.pos = true;
    }

    // ===================== teams (teacher) =====================
    lobbyIds() { return Object.values(this.s.players).filter(p => p.online || p.team).map(p => p.id); }
    suggestCount() { return AR.Teams.suggestCount(this.lobbyIds().length, B().teams.min, B().teams.max); }
    /** Randomly shuffle every connected student into `count` teams (default: the suggested fewest teams). */
    shuffleTeams(count) {
      if (this.s.locked) return { ok: false, why: 'Teams are locked.' };
      const ids = this.lobbyIds();
      let k = count || this.suggestCount();
      if (this.practice) k = 1;
      if (!k) return { ok: false, why: ids.length < B().teams.minStudentsForMatch ? 'Fewer than ' + B().teams.minStudentsForMatch + ' students: use Practice, or choose a team count to test.' : 'Choose a team count.' };
      k = Math.max(this.practice ? 1 : 2, Math.min(B().teams.maxTeams, k, ids.length || 1));
      const teams = AR.Teams.distribute(ids, k, this.rnd);
      this.s.teams = teams.map(t => ({ id: t.id, name: t.name, color: t.color, sym: t.sym, members: t.members, size0: 0, mult: 1 }));
      for (const P of Object.values(this.s.players)) { P.team = null; this.touchP(P.id); }
      for (const t of this.s.teams) for (const pid of t.members) this.s.players[pid].team = t.id;
      this.s.teamCount = k; this._map = null;
      this.touchG();
      return { ok: true };
    }
    moveToTeam(pid, teamId) {
      const P = this.player(pid), T = this.team(teamId);
      if (!P || !T) return { ok: false, why: 'unknown player or team' };
      if (this.s.locked && P.team) return { ok: false, why: 'Teams are locked. Only students without a team can be placed.' };
      for (const t of this.s.teams) t.members = t.members.filter(m => m !== pid);
      T.members.push(pid); P.team = T.id;
      if (this.s.locked) { P.late = true; P.mult = T.mult; if (!P.started) this.startPlayer(P, this.teamIndex(T.id), T.members.length - 1); }
      this.touchP(pid); this.touchG();
      return { ok: true };
    }
    teamWarnings() {
      const out = [], sz = this.s.teams.map(t => t.members.length);
      if (!this.s.teams.length) return ['No teams yet: press Shuffle teams.'];
      if (!this.practice) {
        if (sz.some(n => n < B().teams.min)) out.push('A team has fewer than ' + B().teams.min + ' players (classroom rule: ' + B().teams.min + '–' + B().teams.max + ').');
        if (sz.some(n => n > B().teams.max)) out.push('A team has more than ' + B().teams.max + ' players.');
        if (Math.max.apply(null, sz) - Math.min.apply(null, sz) > 1) out.push('Team sizes differ by more than one.');
      }
      const waiting = Object.values(this.s.players).filter(p => p.online && !p.team).length;
      if (waiting) out.push(waiting + ' student(s) have no team yet.');
      return out;
    }

    // ===================== round control (teacher) =====================
    start() {
      if (this.s.phase === 'running') return { ok: false, why: 'Already running.' };
      if (!this.s.teams.length || this.s.teams.every(t => !t.members.length)) return { ok: false, why: 'Make teams first.' };
      this.s.teams = this.s.teams.filter(t => t.members.length);
      this._map = null;
      const mult = AR.Teams.multipliers(this.s.teams);
      for (const t of this.s.teams) { t.size0 = t.members.length; t.mult = mult[t.id]; }
      this.s.locked = true; this.s.phase = 'running'; this.s.results = null;
      this.s.clock = { startedAt: this.now(), pausedAt: 0, pausedTotal: 0 };
      this.s.teams.forEach((t, ti) => t.members.forEach((pid, mi) => this.startPlayer(this.s.players[pid], ti, mi)));
      this.sim.startRound();
      this.touchG();
      return { ok: true };
    }
    startPlayer(P, ti, mi) {
      const T = this.s.teams[ti], cfg = B().gold;
      P.motion = AR.Motion.fresh();
      P.mult = T.mult; P.gold = U.r2(cfg.start * T.mult); P.earned = 0; P.earnedRaw = 0; P.started = true;
      P.qs = Q().Picker.fresh(); P.cur = null; P.shrine = null; P.mastered = false;   // learning stats (right/wrong/topics) are kept for the whole lesson
      P.stats = P.stats || {}; P.right = P.right || 0; P.wrong = P.wrong || 0; P.corrections = P.corrections || 0;
      const b = this.map().bases[ti], side = [-b.dir[1], b.dir[0]], off = (mi - 2) * 2.4;
      this.teleport(P.id, b.spawn[0] + side[0] * off, b.spawn[1] + side[1] * off);
      this.touchP(P.id); this.touchPv(P.id);
    }
    pause() { if (!this.isRunning()) return { ok: false }; this.s.clock.pausedAt = this.now(); this.touchG(); return { ok: true }; }
    resume() {
      const c = this.s.clock; if (this.s.phase !== 'running' || !c.pausedAt) return { ok: false };
      c.pausedTotal += this.now() - c.pausedAt; c.pausedAt = 0; this.touchG(); return { ok: true };
    }
    end(reason) {
      if (this.s.phase !== 'running') return { ok: false };
      const c = this.s.clock; if (c.pausedAt) { c.pausedTotal += this.now() - c.pausedAt; c.pausedAt = 0; }
      c.endedAt = this.now();
      for (const P of Object.values(this.s.players)) if (P.shrine) this.leaveShrine(P.id, 'round over');
      this.s.phase = 'ended';
      this.s.results = this.computeResults(reason || 'time');
      (this.s.history = this.s.history || []).push(this.s.results);   // every round's result is kept (no combined score)
      this.touchG();
      return { ok: true };
    }
    /** Teacher: choose the map for the next round while in the lobby. */
    setMap(mapId) { if (this.s.phase !== 'lobby' || !AR.Maps.DEFS[mapId]) return { ok: false }; this.s.mapId = mapId; this._map = null; this.touchG(); return { ok: true }; }
    /** Back to the lobby for another round with the same teams (everything else resets). */
    resetRound(mapId) {
      this.s.phase = 'lobby'; this.s.locked = false; this.s.results = null; this.s.round++;
      const maps = B().rounds.maps;
      this.s.mapId = AR.Maps.DEFS[mapId] ? mapId : maps[(this.s.round - 1) % maps.length];   // round 1 Emerald Glades, round 2 Stormcrest Valley
      this._map = null;
      this.s.clock = { startedAt: 0, pausedAt: 0, pausedTotal: 0 };
      this.sim.reset(); for (const t of this.s.teams) t.out = false;
      for (const P of Object.values(this.s.players)) { P.dead = 0; P.out = false; P.repairing = null; P.started = false; P.shrine = null; P.cur = null; P.gold = 0; P.earned = 0; P.earnedRaw = 0; P.pos = null; this.touchP(P.id); this.touchPv(P.id); }
      this.touchG();
    }

    // ===================== wealth & victory =====================
    /** Team wealth = unspent personal gold + surviving building value + surviving troop value (assets: Milestone 2). */
    teamWealth(teamId) {
      const T = this.team(teamId);
      let gold = 0;
      for (const pid of T.members) gold += this.s.players[pid].gold;
      const A = this.sim.wealth(teamId);   // buildings and troops: cost × health% × completion% (free assets = 0)
      return { gold: U.r2(gold), infra: A.infra, troops: A.troops, total: U.r2(gold + A.infra + A.troops), keepPct: A.keepPct, out: !!T.out };
    }
    computeResults(reason) {
      const rows = this.s.teams.map(t => Object.assign({ id: t.id, name: t.name, sym: t.sym, color: t.color, size: t.members.length }, this.teamWealth(t.id)));
      // surviving kingdoms first, then wealth; an exact tie is broken by Heartkeep health, otherwise joint winners
      rows.sort((a, b) => (a.out ? 1 : 0) - (b.out ? 1 : 0) || b.total - a.total || b.keepPct - a.keepPct);
      const top = rows[0], winners = rows.filter(r => !r.out && r.total === top.total && r.keepPct === top.keepPct).map(r => r.id);
      return { reason, round: this.s.round, map: this.s.mapId, mapName: (AR.Maps.DEFS[this.s.mapId] || {}).name || this.s.mapId, rows, winners, at: this.now() };
    }

    // ===================== knowledge shrine =====================
    enterShrine(pid) {
      const P = this.player(pid);
      if (!P || !P.team) return this.notify(pid, 'You are not in a team yet.', 'warn');
      if (this.s.phase !== 'running') return this.notify(pid, 'The shrine wakes up when the round starts.', 'warn');
      if (this.s.clock.pausedAt) return this.notify(pid, 'The game is paused.', 'warn');
      if (P.shrine) return;
      if (P.dead) return this.notify(pid, 'Wait until you are back at your Heartkeep.', 'warn');
      const b = this.map().bases[this.teamIndex(P.team)];
      // eliminated students may keep practising questions from anywhere (no gold)
      if (!P.out && (!P.pos || Math.hypot(P.pos[0] - b.shrine[0], P.pos[2] - b.shrine[1]) > B().shrine.useRange)) return this.notify(pid, 'Walk up to your team\'s shrine first.', 'warn');
      P.repairing = null;
      P.shrine = { x: P.pos ? P.pos[0] : 0, z: P.pos ? P.pos[2] : 0, since: this.now(), practice: !!P.out };
      if (!P.cur || P.cur.state === 'done' || P.cur.state === 'corrected') this.serve(P);
      this.touchP(pid); this.touchPv(pid);
    }
    leaveShrine(pid, why) {
      const P = this.player(pid); if (!P || !P.shrine) return;
      P.shrine = null;
      this.touchP(pid); this.touchPv(pid);
      if (why === 'moved') this.notify(pid, 'You left the shrine: shrine protection ended.', 'info');
    }
    serve(P) {
      const bank = this.bank(), q = Q().Picker.next(bank, P.qs, this.rnd, B().shrine);
      if (!q) {
        const allDone = bank.questions.every(x => P.qs.correct[x.id]);
        P.cur = null; P.mastered = allDone;
        this.notify(P.id, allDone ? 'You answered every question in the bank! Amazing.' : 'Come back in a moment for a new question.', 'good');
        this.touchPv(P.id); return;
      }
      Q().Picker.served(P.qs, q);
      const d = Q().deliver(q, this.rnd);
      P.cur = { qid: q.id, tok: (this.s.seq++).toString(36) + Math.floor(this.rnd() * 1e6).toString(36), key: d.key, pub: d.pub, state: 'open', at: this.now(), fb: null };
      const st = this.s.qstats[q.id] = this.s.qstats[q.id] || { served: 0, r: 0, w: 0 };
      st.served++;
      this.touchPv(P.id);
    }
    answer(pid, tok, a) {
      const P = this.player(pid);
      if (!P || !P.cur || !P.shrine) return;
      if (P.cur.tok !== tok || P.cur.state !== 'open') { P.dupes++; return; }   // duplicate / stale submission: ignored
      if (this.s.clock.pausedAt) return this.notify(pid, 'The game is paused.', 'warn');
      const q = Q().Banks.byId(this.bank(), P.cur.qid), kind = Q().kindOf(q), ok = Q().mark(q, P.cur.key, a);
      const ts = P.stats[q.topic] = P.stats[q.topic] || { r: 0, w: 0 }, qs = this.s.qstats[q.id];
      if (ok) {
        const base = P.out ? 0 : B().gold.reward[kind], reward = U.r2(base * P.mult);   // eliminated: practice, no gold
        P.gold = U.r2(P.gold + reward); P.earned = U.r2(P.earned + reward); P.earnedRaw += base;
        P.right++; ts.r++; qs.r++;
        Q().Picker.right(P.qs, q);
        P.cur.state = 'done'; P.cur.fb = { ok: true, reward, kind };
        this.touchP(pid);
      } else {
        P.wrong++; ts.w++; qs.w++;
        Q().Picker.wrong(P.qs, q);
        P.cur.state = 'wrong'; P.cur.fb = { ok: false, ex: q.ex, fix: q.fix, reveal: Q().reveal(q, P.cur.key) };
      }
      this.touchPv(pid);
    }
    /** Correction step after a wrong answer: the student re-does it with the revealed answer. No gold. */
    correction(pid, tok, a) {
      const P = this.player(pid);
      if (!P || !P.cur || P.cur.tok !== tok || P.cur.state !== 'wrong') return;
      const q = Q().Banks.byId(this.bank(), P.cur.qid);
      if (!Q().mark(q, P.cur.key, a)) return this.notify(pid, 'Not yet: copy the correct answer shown.', 'warn');
      P.cur.state = 'corrected'; P.corrections++;
      this.touchPv(pid);
    }
    nextQuestion(pid) {
      const P = this.player(pid);
      if (!P || !P.shrine) return;
      if (P.cur && (P.cur.state === 'open' || P.cur.state === 'wrong')) return;   // finish this one first
      this.serve(P);
    }

    // ===================== chat & moderation =====================
    chat(pid, kind, payload) {
      const P = this.player(pid), C = B().chat, now = this.now();
      if (!P || !P.team) return;
      if (P.muted) return this.notify(pid, 'Your teacher has paused your chat.', 'warn');
      P.chatTimes = P.chatTimes.filter(t => now - t < C.burstWindowSec * 1000);
      if (P.chatTimes.length >= C.burst) return this.notify(pid, 'Slow down: wait a few seconds before sending again.', 'warn');
      let entry = null;
      if (kind === 'msg') {
        const x = U.cleanText(payload.x, C.maxLength);
        if (!x) return;
        if (U.isUnkind(x)) { this.flag(pid, 'chat', x); return this.notify(pid, 'Please use kind words. (Your teacher can see team chat.)', 'warn'); }
        if (x.toLowerCase() === P.lastText && now - P.lastTextAt < 10000) return this.notify(pid, 'You just sent that.', 'warn');
        P.lastText = x.toLowerCase(); P.lastTextAt = now;
        entry = { k: 'msg', x };
      } else if (kind === 'quick') {
        const i = Number(payload.i); if (!(i >= 0 && i < C.quick.length)) return;
        entry = { k: 'quick', x: C.quick[i] };
      } else if (kind === 'ping') {
        if (now - P.lastPingAt < 2000 || !isFinite(payload.x) || !isFinite(payload.z)) return;
        P.lastPingAt = now;
        entry = { k: 'ping', x: 'Look here!', p: [U.r2(payload.x), U.r2(payload.z)] };
      }
      if (!entry) return;
      P.chatTimes.push(now);
      entry.f = pid; entry.n = P.name; entry.g = P.gid; entry.at = now; entry.tm = P.team; entry.id = (this.s.seq++).toString(36);
      this.s.chatLog.push(entry); if (this.s.chatLog.length > 300) this.s.chatLog.shift();
      this.dirty.chat.push(entry);
    }
    report(pid, target, reason) {
      const P = this.player(pid), T = this.player(target);
      if (!P || !T || P.team !== T.team) return;
      this.s.reports.push({ from: pid, fromName: P.name, target, targetName: T.name, reason: U.cleanText(reason, 80) || 'no reason given', at: this.now() });
      this.notify(pid, 'Report sent to your teacher. Thank you.', 'good');
      this.touchG();
    }
    flag(pid, what, text) { const P = this.player(pid); this.s.flagged.push({ pid, name: P ? P.name : '?', what, text, at: this.now() }); this.touchG(); }
    mute(pid, on) { const P = this.player(pid); if (!P) return; P.muted = !!on; this.notify(pid, on ? 'Your teacher has paused your chat.' : 'Your chat is back on.', on ? 'warn' : 'good'); this.touchP(pid); }
    rename(pid, name) { const P = this.player(pid), n = U.cleanName(name); if (!P || !n) return { ok: false }; P.name = n; this.touchP(pid); this.touchG(); return { ok: true }; }
    kick(pid) {
      const P = this.player(pid); if (!P) return;
      for (const t of this.s.teams) t.members = t.members.filter(m => m !== pid);
      delete this.s.players[pid];
      (this.s.kicked = this.s.kicked || {})[pid] = 1;
      this.dirty.p[pid] = 'remove'; this.dirty.pv[pid] = 'remove'; this.touchG(); this.dirty.pos = true;
    }
    announce(text) { this.s.ann = U.cleanText(text, 120); this.touchG(); }
    setLook(pid, look) { const P = this.player(pid); if (!P) return; P.look = cleanLook(look); this.touchP(pid); }

    requestMotion(pid, kind) {
      const P = this.player(pid);
      if (!P || !P.online || !P.team || !P.pos || P.shrine || P.dead || P.out || !this.isRunning()) return false;
      const motion = P.motion || (P.motion = AR.Motion.fresh()), t = this.elapsed();
      const ok = kind === 'sprint' ? AR.Motion.sprint(motion, t) : AR.Motion.jump(motion, t);
      if (ok) this.touchP(pid);
      return ok;
    }

    // ===================== requests =====================
    handle(pid, m) {
      if (!m || typeof m !== 'object') return;
      switch (m.t) {
        case 'sprint': return this.requestMotion(pid, 'sprint');
        case 'jump': return this.requestMotion(pid, 'jump');
        case 'shrine': return this.enterShrine(pid);
        case 'leave': return this.leaveShrine(pid, 'left');
        case 'ans': return this.answer(pid, String(m.tok || ''), m.a);
        case 'fixdone': return this.correction(pid, String(m.tok || ''), m.a);
        case 'next': return this.nextQuestion(pid);
        case 'chat': return this.chat(pid, 'msg', m);
        case 'quick': return this.chat(pid, 'quick', m);
        case 'ping': return this.chat(pid, 'ping', m);
        case 'report': return this.report(pid, String(m.target || ''), m.reason);
        case 'look': return this.setLook(pid, m.look);
        case 'build': return this.sim.build(pid, String(m.ty || ''), Number(m.x), Number(m.z), Number(m.rot) || 0);
        case 'recruit': return this.sim.recruit(pid, String(m.ty || ''));
        case 'sell': return this.sim.sell(pid, String(m.id || ''));
        case 'repair': return this.sim.repair(pid, String(m.id || ''));
        case 'cmd': return this.sim.command(pid, m.ids, String(m.k || ''), Number(m.x), Number(m.z), m.target);
        case 'bolt': return this.sim.bolt(pid, Number(m.x), Number(m.z));
        case 'cast': return this.sim.cast(pid, String(m.ty || ''), Number(m.x), Number(m.z), Number(m.dx), Number(m.dz));
        case 'ward': return this.sim.ward(pid, Number(m.x), Number(m.z));
        case 'research': return this.sim.research(pid, String(m.kind || ''));
        default: return;
      }
    }

    tick(now) {
      now = now == null ? this.now() : now;
      if (this.s.phase === 'running' && !this.s.clock.pausedAt) {
        const pi = this.phaseInfo(now);
        if (pi.phase.id !== this._lastPhase) { this._lastPhase = pi.phase.id; this.touchG(); }
        const dt = Math.min(0.25, Math.max(0, (now - (this._lastTick || now)) / 1000));
        if (dt > 0) this.sim.step(dt);
        if (pi.left <= 0 && this.s.phase === 'running') this.end('time');
      }
      this._lastTick = now;
    }

    // ===================== views (what the host publishes) =====================
    gView() {
      const s = this.s;
      return {
        ph: s.phase, bank: s.bankId, map: s.mapId, round: s.round, locked: s.locked, practice: this.practice,
        teams: s.teams.map(t => ({ id: t.id, name: t.name, color: t.color, sym: t.sym, members: t.members.slice(), size0: t.size0, mult: U.r2(t.mult), out: t.out ? 1 : 0, sc: s.phase === 'running' ? this.sim.teamView(t.id) : 0 })),
        clock: { s: s.clock.startedAt, p: s.clock.pausedAt, pz: s.clock.pausedTotal, e: s.clock.endedAt || 0 },
        dur: B().round.durationSec, ann: s.ann, res: s.results, hist: s.history || [],
        n: Object.values(s.players).filter(p => p.online).length,
      };
    }
    /** Public record of one player (all students in the room can read it). */
    pView(pid) {
      const P = this.player(pid); if (!P) return null;
      return { n: P.name, gid: P.gid, tm: P.team || '', on: P.online ? 1 : 0, mo: P.motion || AR.Motion.fresh(), gold: U.r2(P.gold), earned: U.r2(P.earned), shr: P.shrine ? 1 : 0, look: P.look, sp: P.sp || 0, mu: P.muted ? 1 : 0, late: P.late ? 1 : 0,
        hp: Math.ceil(P.hp == null ? B().player.health : P.hp), dead: P.dead || 0, sh: P.shieldUntil || 0, out: P.out ? 1 : 0, rep: P.repairing || '' };
    }
    /** Private record: only this student's screen uses it (the current question WITHOUT its answer, feedback, notes). */
    pvView(pid) {
      const P = this.player(pid); if (!P) return null;
      const c = P.cur;
      return {
        q: c ? { tok: c.tok, st: c.state, pub: c.pub, fb: c.fb || 0 } : 0,
        in: P.shrine ? 1 : 0, right: P.right, wrong: P.wrong, mastered: P.mastered ? 1 : 0, note: P.note || 0,
      };
    }
    /** Every in-world player's validated position in one short string: "pid,x,z,yaw;…" */
    posString() {
      const out = [];
      for (const P of Object.values(this.s.players)) if (P.online && P.team && P.pos && !P.dead && !P.out) out.push(P.id + ',' + P.pos[0].toFixed(1) + ',' + P.pos[2].toFixed(1) + ',' + P.pos[3].toFixed(2));
      return out.join(';');
    }
    /** Learning report: accuracy per topic (class and per student). Kept separate from combat. */
    learningReport() {
      const bank = this.bank(), topics = {}, students = [];
      for (const k in bank.topics) topics[k] = { name: bank.topics[k], r: 0, w: 0 };
      for (const P of Object.values(this.s.players)) {
        const row = { id: P.id, name: P.name, gid: P.gid, team: P.team, right: P.right, wrong: P.wrong, corrections: P.corrections, topics: {} };
        for (const k in P.stats) { row.topics[k] = Object.assign({}, P.stats[k]); if (topics[k]) { topics[k].r += P.stats[k].r; topics[k].w += P.stats[k].w; } }
        students.push(row);
      }
      return { bank: bank.id, label: bank.label, topics, students, qstats: this.s.qstats };
    }

    // ===================== save / restore (host refresh) =====================
    save() { return JSON.stringify({ s: this.s, practice: this.practice, savedAt: this.now() }); }
    /** Restore after the teacher's page was closed or refreshed. A running round comes back PAUSED from the moment it
        was saved, so the time the host was away does not count. */
    static load(json, opts) {
      const d = JSON.parse(json), S = new Server(Object.assign({}, opts, { practice: d.practice }));
      S.s = d.s;
      if (S.s.phase === 'running' && !S.s.clock.pausedAt) S.s.clock.pausedAt = d.savedAt || S.now();
      for (const pid in S.s.players) { S.s.players[pid].online = false; S.s.players[pid].shrine = null; }   // everyone reconnects
      S.dirty = { g: true, p: Object.fromEntries(Object.keys(S.s.players).map(k => [k, 1])), pv: Object.fromEntries(Object.keys(S.s.players).map(k => [k, 1])), chat: [], pos: true };
      S.sim.allDirty();   // republish every building and troop
      return S;
    }
  }

  AR.Server = Server;
  AR.cleanLook = cleanLook;
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* src/net/transport.js */
/* Arcane Realms · src/net/transport.js — the room "wire". Three interchangeable transports with the same small API
   (ref(path).set/update/remove/push/once/on/off/onDisconnect, offset, onConnected, close):
     firebase  the teacher's Firebase Realtime Database (vendor/firebase-config.js) — real multiplayer over the internet
     fake      an in-memory database shared by every frame of one browser tab (automated multi-client tests)
     local     a private in-memory database for Practice mode (clearly NOT multiplayer)
   Adapted from the Game Kit's mechanics/online/online.js (FakeNet). */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  function FakeNet(latency) { this.root = {}; this.listeners = []; this.disc = {}; this.latency = latency == null ? 15 : latency; this.seq = 0; this.writes = 0; this.bytes = 0; }
  const split = p => String(p).split('/').filter(Boolean);
  FakeNet.prototype = {
    get(path) { let o = this.root; for (const k of split(path)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; },
    write(path, val) {
      const ks = split(path), last = ks.pop();
      let o = this.root;
      for (const k of ks) { if (o[k] == null || typeof o[k] !== 'object') { if (val === null) return this.fire(); o[k] = {}; } o = o[k]; }
      if (val === null || val === undefined) delete o[last];
      else { const j = JSON.stringify(val); this.bytes += j.length; o[last] = JSON.parse(j); }
      this.writes++;
      this.prune(this.root);
      this.fire();
    },
    prune(o) { for (const k in o) if (o[k] && typeof o[k] === 'object') { this.prune(o[k]); if (!Object.keys(o[k]).length) delete o[k]; } },
    fire() {
      if (this.pending) return;
      this.pending = true;
      const net = this;
      setTimeout(() => {
        net.pending = false;
        for (const L of net.listeners.slice()) {
          if (L.dead) continue;
          const now = net.get(L.path), json = JSON.stringify(now);
          if (L.event === 'value') { if (json !== L.last) { L.last = json; L.fn(new Snap(L.key, now)); } continue; }
          const old = L.kids || {}, cur = now && typeof now === 'object' ? now : {}, next = {};
          for (const k in cur) {
            next[k] = JSON.stringify(cur[k]);
            if (!(k in old)) { if (L.event === 'child_added') L.fn(new Snap(k, cur[k])); }
            else if (old[k] !== next[k] && L.event === 'child_changed') L.fn(new Snap(k, cur[k]));
          }
          if (L.event === 'child_removed') for (const k in old) if (!(k in cur)) L.fn(new Snap(k, JSON.parse(old[k])));
          L.kids = next;
        }
      }, this.latency);
    },
    disconnect(client) { const list = this.disc[client] || []; delete this.disc[client]; for (const w of list) this.write(w.path, w.val); },
  };
  function Snap(key, v) { this.key = key; this.v = v === undefined ? null : JSON.parse(JSON.stringify(v)); }
  Snap.prototype = { val() { return this.v; }, exists() { return this.v != null; }, forEach(fn) { if (this.v && typeof this.v === 'object') for (const k in this.v) fn(new Snap(k, this.v[k])); } };

  function fakeRef(net, client, path) {
    const ks = split(path);
    const ref = {
      key: ks[ks.length - 1] || null,
      child: sub => fakeRef(net, client, path + '/' + sub),
      set: v => { net.write(path, v); return Promise.resolve(); },
      update: obj => { for (const k in obj) net.write(path + '/' + k, obj[k]); return Promise.resolve(); },
      remove: () => { net.write(path, null); return Promise.resolve(); },
      push: v => { const k = 'e' + Date.now().toString(36) + (++net.seq).toString(36).padStart(5, '0'); const r = fakeRef(net, client, path + '/' + k); if (v !== undefined) r.set(v); return r; },
      once: () => Promise.resolve(new Snap(ref.key, net.get(path))),
      on: (event, fn) => {
        const L = { path, event, fn, key: ref.key, last: undefined, kids: {}, client };
        net.listeners.push(L);
        setTimeout(() => {   // like Firebase: a new listener hears the current data first
          if (L.dead) return;
          const now = net.get(path);
          if (event === 'value') { L.last = JSON.stringify(now); fn(new Snap(ref.key, now)); }
          else if (now && typeof now === 'object') { for (const k in now) { L.kids[k] = JSON.stringify(now[k]); if (event === 'child_added') fn(new Snap(k, now[k])); } }
        }, net.latency);
        return fn;
      },
      off: (event, fn) => { for (const L of net.listeners) if (L.client === client && L.path === path && (!event || L.event === event) && (!fn || L.fn === fn)) L.dead = true; net.listeners = net.listeners.filter(L => !L.dead); },
      onDisconnect: () => ({
        set: v => { (net.disc[client] = net.disc[client] || []).push({ path, val: v }); return Promise.resolve(); },
        update: obj => { for (const k in obj) (net.disc[client] = net.disc[client] || []).push({ path: path + '/' + k, val: obj[k] }); return Promise.resolve(); },
        remove: () => { (net.disc[client] = net.disc[client] || []).push({ path, val: null }); return Promise.resolve(); },
        cancel: () => { net.disc[client] = []; return Promise.resolve(); },
      }),
    };
    return ref;
  }
  function memTransport(net, name) {
    const client = 'c' + Math.random().toString(36).slice(2, 8);
    return { name, net, client, offset: 0, ref: p => fakeRef(net, client, p), onConnected: fn => fn(true), close: () => net.disconnect(client) };
  }

  let practiceNet = null;
  const TRANSPORTS = {
    fake: {
      connect() {
        let top = root;
        try { let w = root; while (w) { if (w.AR_FAKE_HOST) { top = w; break; } if (w === w.parent) break; w = w.parent; } if (top === root && root.top && root.top.document) top = root.top; } catch (e) { /* another origin */ }
        const net = top.AR_FAKE_NET || (top.AR_FAKE_NET = new FakeNet());
        return Promise.resolve(memTransport(net, 'fake'));
      },
    },
    local: { connect() { practiceNet = practiceNet || new FakeNet(5); return Promise.resolve(memTransport(practiceNet, 'local')); } },
    firebase: {
      connect(timeoutMs, appName) {
        const cfg = root.GK_ONLINE_CONFIG, an = appName || 'arcane';
        if (!root.firebase || !cfg || !cfg.databaseURL) return Promise.reject(new Error('This copy has no online setup.'));
        let app;
        try { app = firebase.apps.find(a => a.name === an) || firebase.initializeApp(cfg, an); } catch (e) { return Promise.reject(e); }
        const db = app.database(), T = { name: 'firebase', db, offset: 0, ref: p => db.ref(p), close: () => { try { db.goOffline(); } catch (e) { /* ignore */ } } };
        db.goOnline();
        db.ref('.info/serverTimeOffset').on('value', s => { T.offset = s.val() || 0; });
        T.onConnected = fn => db.ref('.info/connected').on('value', s => fn(!!s.val()));
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('No connection to the class server. Check the internet, or try Practice.')), timeoutMs || 20000);
          db.ref('.info/connected').on('value', s => { if (s.val()) { clearTimeout(t); resolve(T); } });
        });
      },
    },
  };

  AR.Net = {
    FakeNet,
    /** ?online=fake picks the in-memory test transport; otherwise Firebase. Practice always uses 'local'. */
    pick() { const q = (root.location && (root.location.search.match(/[?&]online=(\w+)/) || [])[1]) || ''; return TRANSPORTS[q] ? q : 'firebase'; },
    /** appName (Firebase only): a separate connection per name — tests open several "PCs" in one page. */
    connect(name, timeoutMs, appName) { const tr = TRANSPORTS[name]; return tr ? tr.connect(timeoutMs, appName) : Promise.reject(new Error('Unknown transport ' + name)); },
    resetPractice() { practiceNet = null; },
    available(name) { return name !== 'firebase' || !!(root.firebase && root.GK_ONLINE_CONFIG && root.GK_ONLINE_CONFIG.databaseURL); },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/net/host.js */
/* Arcane Realms · src/net/host.js — connects the authoritative AR.Server (running in the teacher's browser) to a room.
   Room data (rooms/<CODE>/…):
     meta              {host, game: 'arcane-realms', v, at}                       host
     g                 round, teams, clock, results                                host
     ps/<pid>          public player record (name, game ID, team, gold, …)        host
     pv/<pid>          private record: current question (no answer), feedback      host
     pos               "pid,x,z,yaw;…" validated positions, ~4 times a second      host
     chat/<team>/<id>  moderated team chat                                         host
     players/<pid>     {name, look, on, h, p}: presence + reported position         each student (their own)
     in/<push id>      {f, t, …}: requests; the host processes and deletes them    each student
   Students never write g, ps, pv, pos or chat: their screens only show what the host published. */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};
  const GAME = 'arcane-realms';

  class HostLink {
    constructor(T, room, server) {
      this.T = T; this.room = room; this.base = 'rooms/' + room; this.S = server; this.seen = {}; this.lastPos = ''; this.posAt = 0;
      this.saveAt = 0; this.listeners = []; this.stats = { in: 0, out: 0 }; this.stopped = false;
      server.now = () => Date.now() + (T.offset || 0);
    }
    ref(p) { return this.T.ref(this.base + '/' + p); }
    start() {
      const S = this.S;
      this.ref('meta').set({ host: 'teacher', game: GAME, v: 1, at: S.now(), bank: S.s.bankId });
      const onPlayer = snap => {
        const v = snap.val(), pid = snap.key;
        if (!v || !v.name) return;
        const P = S.player(pid), online = v.on !== 0;
        if (!online) { if (P) S.presence(pid, false); return; }
        if (!P || !P.online) {
          if (v.kicked) return;
          let look = v.look; if (typeof look === 'string') { try { look = JSON.parse(look); } catch (e) { look = {}; } }
          S.join(pid, v.name, look);
        }
        if (v.p) { const n = String(v.p).split(',').map(Number); if (n.length >= 4) S.pos(pid, n[0], n[1], n[2], n[3]); }
      };
      const pl = this.ref('players');
      pl.on('child_added', onPlayer); pl.on('child_changed', onPlayer);
      pl.on('child_removed', snap => S.presence(snap.key, false));
      const inbox = this.ref('in');
      inbox.on('child_added', snap => {
        const k = snap.key, m = snap.val();
        this.ref('in/' + k).remove();
        if (this.seen[k]) return; this.seen[k] = 1;
        if (!m || !m.f) return;
        this.stats.in++;
        try { S.handle(String(m.f), m); } catch (e) { console.error('[host] request failed', m, e); }
        this.flush();
      });
      this.timer = setInterval(() => this.step(), 1000 / AR.Balance.net.tickRate);
      this.flush();
      return this;
    }
    step() {
      if (this.stopped) return;
      this.S.tick();
      this.flush();
      if (Date.now() - this.saveAt > 3000) this.save();
    }
    /** Publish everything the server marked as changed. */
    flush() {
      const S = this.S, D = S.dirty, up = {};
      if (D.g) { up.g = S.gView(); D.g = false; }
      for (const pid in D.p) up['ps/' + pid] = D.p[pid] === 'remove' ? null : S.pView(pid);
      for (const pid in D.pv) up['pv/' + pid] = D.pv[pid] === 'remove' ? null : S.pvView(pid);
      D.p = {}; D.pv = {};
      for (const e of D.chat) up['chat/' + e.tm + '/' + e.id] = { f: e.f, n: e.n, g: e.g, k: e.k, x: e.x, p: e.p || 0, at: e.at };
      D.chat = [];
      const now = Date.now();
      if (D.pos && now - this.posAt >= 1000 / AR.Balance.net.publishRate) {
        const s = S.posString();
        if (s !== this.lastPos) { up.pos = s || ''; this.lastPos = s; }

<script>/* src/net/client.js */
/* Arcane Realms · src/net/client.js — a student's connection to a room.
   The student's screen READS what the host publishes (g, ps, pos, pv/<me>, chat/<my team>) and WRITES only its own
   presence record (players/<me>: name, look, online, reported position) and requests (in/…).
   The player id is kept per room in localStorage, so a refresh or a crash rejoins the SAME player (same team, gold). */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  class ClientLink {
    constructor(T, room, pid) {
      this.T = T; this.room = room; this.base = 'rooms/' + room; this.id = pid;
      this.g = null; this.ps = {}; this.pv = null; this.pos = {}; this.chat = []; this.chatTeam = null; this.st = {}; this.un = {}; this.sp = {}; this.wd = {};
      this.handlers = {}; this.sentAt = 0; this.lastSent = null; this.connected = true; this.kicked = false;
    }
    ref(p) { return this.T.ref(this.base + '/' + p); }
    on(ev, fn) { (this.handlers[ev] = this.handlers[ev] || []).push(fn); return this; }
    emit(ev, d) { for (const fn of this.handlers[ev] || []) { try { fn(d); } catch (e) { console.error('[client]', ev, e); } } }
    serverNow() { return Date.now() + (this.T.offset || 0); }

    start(name, look) {
      const me = this.ref('players/' + this.id);
      this.name = String(name || '').slice(0, 16);
      me.update({ name: this.name, look: JSON.stringify(look || {}), on: 1, h: this.serverNow() });
      me.onDisconnect().update({ on: 0 });
      this.T.onConnected(ok => {
        this.connected = ok; this.emit('connection', ok);
        if (ok && !this.stopped) { me.onDisconnect().update({ on: 0 }); me.update({ on: 1, h: this.serverNow() }); }
      });
      this.beat = setInterval(() => { if (this.connected && !this.stopped) me.update({ on: 1, h: this.serverNow() }); }, 10000);
      this.ref('g').on('value', s => { this.g = s.val(); this.emit('g', this.g); this.watchChat(); });
      const ps = this.ref('ps');
      const up = s => { this.ps[s.key] = s.val(); this.emit('ps', s.key); if (s.key === this.id) this.watchChat(); };
      ps.on('child_added', up); ps.on('child_changed', up);
      ps.on('child_removed', s => { delete this.ps[s.key]; this.emit('ps', s.key); if (s.key === this.id && this.g) { this.kicked = true; this.emit('kicked'); this.stop(); } });

        r.on('child_removed', s => { const old = this[map][s.key]; delete this[map][s.key]; this.emit(map + 'Gone', old || { id: s.key }); });
      }

        const v = String(s.val() || ''), bar = v.indexOf('|'); if (bar < 0) return;
        const seq = v.slice(0, bar); if (seq === this.fxSeq) return; this.fxSeq = seq;

      });

    }
    /** Where a troop is now: it walks its published path at its speed from the published start time. */
    unitPos(u) {
      const p = String(u.p || '0,0').split(',').map(Number);
      if (u.s !== 'move' || !u.w) return p;
      const pts = u.w.split(';').map(q => q.split(',').map(Number));
      let left = Math.max(0, (this.serverNow() - u.t) / 1000) * (u.v || 1), x = p[0], z = p[1];
      for (const q of pts) {
        const d = Math.hypot(q[0] - x, q[1] - z);
        if (d >= left) return [x + (q[0] - x) / (d || 1) * left, z + (q[1] - z) / (d || 1) * left];

    }
    parsePos(str) {
      const out = {}, t = performance.now();

    }

    watchChat() {
      const me = this.ps[this.id], team = me && me.tm || null;

    }
    me() { return this.ps[this.id] || null; }
    send(t, data) { if (this.stopped) return; this.ref('in').push(Object.assign({ f: this.id, t, at: this.serverNow() }, data || {})); }

    }
    setLook(look) { this.ref('players/' + this.id).update({ look: JSON.stringify(look) }); this.send('look', { look }); }
    stop() {
      if (this.stopped) return;
      this.stopped = true; clearInterval(this.beat);
      for (const p of ['g', 'ps', 'pos', 'pv/' + this.id, 'st', 'un', 'sp', 'wd', 'fx']) this.ref(p).off();
      if (this.chatTeam) this.ref('chat/' + this.chatTeam).off();
      if (!this.kicked) this.ref('players/' + this.id).update({ on: 0 });
    }
  }

  /** Same room + same nickname on this computer = the same player (crash / refresh recovery); another nickname = a new player. */
  function storedId(room, name) {
    const key = 'ar.pid.' + room + '.' + String(name || '').toLowerCase();
    let id = null;
    try { id = sessionStorage.getItem(key) || localStorage.getItem(key); } catch (e) { /* storage off */ }
    if (!id || !/^[a-z0-9]{6,20}$/.test(id)) {
      id = AR.util.newId();
      try { sessionStorage.setItem(key, id); localStorage.setItem(key, id); } catch (e) { /* storage off */ }
    }
    return id;
  }

  AR.Client = {
    /** Join a room by code. opts: {room, name, look, transport, id (tests)} → Promise<ClientLink> */
    join(opts) {
      const room = String(opts.room || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 16);
      if (!/^[A-Z0-9-]{3,16}$/.test(room)) return Promise.reject(new Error('Type the room code your teacher shows (like ELF-42).'));
      return AR.Net.connect(opts.transport || AR.Net.pick(), null, opts.appName).then(T => T.ref('rooms/' + room + '/meta').once('value').then(m => {
        const meta = m.val();
        if (!meta) throw new Error('There is no room "' + room + '". Check the code with your teacher.');
        if (meta.game !== AR.Host.GAME) throw new Error('Room "' + room + '" belongs to a different game.');
        const pid = opts.id || (T.name === 'fake' ? AR.util.newId() : storedId(room, opts.name));
        try { localStorage.setItem('ar.last.room', room); } catch (e) { /* ignore */ }
        return new ClientLink(T, room, pid).start(opts.name, opts.look);
      }));
    },
    lastRoom() { try { return localStorage.getItem('ar.last.room') || ''; } catch (e) { return ''; } },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>/* src/client/models.js */
/* Arcane Realms · src/client/models.js — original low-poly fantasy models, built from code with GK.Geo (no files).

        B.shop.units.map(ty => { const D = B.units[ty]; return h('tr', h('td', ICON[ty]), h('td', h('b', D.name), h('div.small', D.text)), h('td', D.cost), h('td', D.health), h('td', D.heal ? '💚 ' + D.heal : D.damage + (D.buildingDamage != null ? ' (bldg ' + D.buildingDamage + ')' : '') + (D.splash ? ' area' : '')), h('td', D.interval + ' s'), h('td', D.range + ' m'), h('td', D.speed + (D.layer === 'air' ? ' ✈' : '')), h('td', tgt(D.targets)), h('td', D.capacity)); }));
      const blds = h('table.small.guide', h('tr', ['', 'Building', 'Cost', 'Health', 'Does', 'Limit'].map(x => h('th', x))),
        B.shop.structures.map(ty => { const D = B.structures[ty]; return h('tr', h('td', ICON[ty]), h('td', h('b', D.name)), h('td', D.cost), h('td', D.health), h('td', D.text + (D.attack ? ' ' + D.attack.damage + ' dmg / ' + D.attack.interval + ' s, ' + D.attack.range + ' m' : '') + (D.unlockMin ? ' (from minute ' + D.unlockMin + ')' : '')), h('td', B.structureLimits[ty] || '')); }));

        h('p.small', 'Spells: ' + B.spells.warningSec + ' s warning, team waits ' + B.spells.teamLockoutSec + ' s between spells, each spell ' + B.spells.perSpellCooldownSec + ' s, ' + B.spells.maxCastsPerTeamPerRound + ' per team per round. Wards: ' + Math.round(B.spells.ward.reduction * 100) + '% less spell damage.')), [h('button.btn', { onclick: () => m.close() }, 'Close')]);

    update(now) {

        if (p && this.placing) { this.placing.x = Math.round(p[0] * 2) / 2; this.placing.z = Math.round(p[2] * 2) / 2; this.placing.why = this.placeProblem(this.placing.ty, this.placing.x, this.placing.z); this.placing.ok = !this.placing.why; }

          const a = this.aim;
