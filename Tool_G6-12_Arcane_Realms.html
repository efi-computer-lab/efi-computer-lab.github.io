      this.hp.firstChild.style.background = hp > 60 ? '#51cf66' : hp > 30 ? '#ffd43b' : '#ff6b6b';
      this.hp.lastChild.textContent = '❤ ' + Math.ceil(hp) + ' / ' + mx + (m.sh > this.link.serverNow() ? '  🛡 shield' : '');
      this.army.textContent = '⚔ Army ' + this.armyUsed() + ' / ' + B.armyCapacityPerTeam;
      if (this.pop && now - (this.popAt || 0) > 1000) {   // keep locks and cooldowns current, but only touch the page when something changed
        this.popAt = now; const tmp = h('div'); this.drawMenu(tmp);
        if (tmp.textContent !== this.popEl.textContent || tmp.innerHTML.length !== this.popEl.innerHTML.length) { const y = this.popEl.scrollTop; clear(this.popEl); while (tmp.firstChild) this.popEl.appendChild(tmp.firstChild); this.popEl.scrollTop = y; }
      }
      const dead = m.dead && !m.out;
      this.dead.hidden = !dead;
      if (dead) { clear(this.dead).appendChild(h('div', h('b', '💫 You were defeated!'), h('div', 'Back at your Heartkeep in ' + Math.max(0, Math.ceil((m.dead - this.link.serverNow()) / 1000)) + ' s. You keep your gold, buildings and troops.'))); }

      this.bar.classList.toggle('disabled', !!m.out);
      for (const id of Array.from(this.selected)) if (!this.link.un[id]) this.selected.delete(id);
      if (this.selStruct && !this.link.st[this.selStruct]) this.selStruct = null;
      if (this.selected.size || this.selStruct) this.drawSel(true); else this.selPanel.hidden = true;
    }
  }
  AR.CommandUI = CommandUI;
})(window);

<script>/* src/client/ui-teacher.js */
/* Arcane Realms · src/client/ui-teacher.js — the teacher's screen. The teacher's browser IS the game server

(function (root) {

    // ---------------- tabs ----------------

      box.appendChild(h('table.small.qtable', h('tr', ['Topic', 'Type', 'Question', 'Answer', 'Served', '✔', '✘'].map(x => h('th', x))),
        bank.questions.map(q => { const st = s.qstats[q.id] || { served: 0, r: 0, w: 0 }; return h('tr', h('td', bank.topics[q.topic]), h('td', q.type + (q.sit ? ' (situation)' : '')), h('td', q.q), h('td', ans(q)), h('td', st.served), h('td', st.r), h('td', st.w)); })));
      return box;
    }
    tab_report() {
      const R = this.S.learningReport(), box = h('div');
      box.appendChild(h('p.note', 'Learning results only: answers at the shrine (whole lesson, all rounds; practice answers after a team falls count too). Combat, gold and winning are NOT part of this report.'));
      const bars = h('div.bars');
      for (const k in R.topics) {
        const t = R.topics[k], n = t.r + t.w, pct = n ? Math.round(t.r / n * 100) : null;
        bars.appendChild(h('div.bar', h('span.blabel', t.name), h('span.btrack', h('span.bfill', { style: { width: (pct || 0) + '%', background: pct == null ? '#666' : pct >= 75 ? '#2f9e44' : pct >= 50 ? '#f08c00' : '#e03131' } })), h('span.bval', pct == null ? '–' : pct + '% (' + n + ')')));
      }
      box.appendChild(h('h3', 'Class accuracy by topic'));
      box.appendChild(bars);
      const bank = AR.Questions.Banks.get(R.bank), missed = Object.keys(R.qstats).map(id => Object.assign({ id }, R.qstats[id])).filter(q => q.r + q.w >= 2).sort((a, b) => b.w / (b.r + b.w) - a.w / (a.r + a.w) || b.w - a.w).slice(0, 5);
      if (missed.length) box.appendChild(h('div', h('h3', 'Most-missed questions (talk about these)'), h('ol.small', missed.map(q => { const Qn = AR.Questions.Banks.byId(bank, q.id); return Qn ? h('li', Qn.q + '  ', h('b', Math.round(q.w / (q.r + q.w) * 100) + '% wrong'), ' (' + (q.r + q.w) + ' answers)') : null; }))));
      const topicKeys = Object.keys(R.topics), cell = t => { if (!t || !(t.r + t.w)) return h('td.hm', '·'); const p = t.r / (t.r + t.w); return h('td.hm', { style: { background: p >= 0.75 ? '#2f9e44' : p >= 0.5 ? '#f08c00' : '#e03131' }, title: t.r + ' right, ' + t.w + ' wrong' }, Math.round(p * 100)); };
      box.appendChild(h('h3', 'Topic grid (each student × topic, % right)'));
      box.appendChild(h('div.hmwrap', h('table.small.heat', h('tr', h('th', 'Student'), topicKeys.map(k => h('th.vert', R.topics[k].name))), R.students.map(st => h('tr', h('td', st.name), topicKeys.map(k => cell(st.topics[k])))))));
      box.appendChild(h('h3', 'Students'));
      const rows = R.students.map(st => {
        const n = st.right + st.wrong, acc = n ? Math.round(st.right / n * 100) : null;
        let weak = null, wv = 2;
        for (const k in st.topics) { const t = st.topics[k], tn = t.r + t.w; if (tn >= 2 && t.r / tn < wv) { wv = t.r / tn; weak = k; } }
        return { st, n, acc, weak: weak && wv < 0.75 ? R.topics[weak].name : '' };
      });
      box.appendChild(h('table.small', h('tr', ['Student', 'Answered', 'Right', 'Accuracy', 'Corrections', 'Practise more'].map(x => h('th', x))),
        rows.map(r => h('tr', h('td', r.st.name + ' ' + r.st.gid), h('td', r.n), h('td', r.st.right), h('td', r.acc == null ? '–' : r.acc + '%'), h('td', r.st.corrections), h('td', r.weak)))));
      box.appendChild(h('div.row', h('button.btn', { onclick: () => {
        const topics = Object.keys(R.topics), head = ['Nickname', 'Game ID', 'Team', 'Right', 'Wrong', 'Corrections'].concat(topics.map(k => R.topics[k].name + ' %'));
        const lines = [head.join(',')].concat(R.students.map(st => [st.name, st.gid, st.team || '', st.right, st.wrong, st.corrections].concat(topics.map(k => { const t = st.topics[k]; return t && t.r + t.w ? Math.round(t.r / (t.r + t.w) * 100) : ''; })).map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')));
        download('arcane-realms-learning-' + this.host.room + '.csv', lines.join('\r\n'));
      } }, '⬇ Download report (CSV)')));
      return box;
    }

    // ---------------- 3D view ----------------
    drag(dx, dy) { const o = this.sc.cam.over; o.x -= dx * o.h / 600; o.z -= dy * o.h / 600; }
    wheel(d) { const o = this.sc.cam.over; o.h = U.clamp(o.h * (d > 0 ? 1.1 : 0.9), 30, 220); }
    key() { }
    update(dt) {
      const S = this.S, sc = this.sc, now = performance.now();
      if (now - this.at > 500) { this.at = now; this.draw(); }
      const K = this.app.keys, o = sc.cam.over, sp = o.h * 0.8 * dt;
      if (K.KeyW || K.ArrowUp) o.z -= sp; if (K.KeyS || K.ArrowDown) o.z += sp; if (K.KeyA || K.ArrowLeft) o.x -= sp; if (K.KeyD || K.ArrowRight) o.x += sp;
      if (S.s.teams.length) this.app.ensureWorld(S.s.teams, S.s.mapId);
      const L = this.app.layout && this.app.worldKey !== 'backdrop' ? this.app.layout : this.app.backLayout;
      sc.overhead(); sc.cam.mode = 'over';
      const items = [], used = {};
      for (const P of Object.values(S.s.players)) {
        if (!P.pos || !P.online || !P.team || P.dead || P.out) continue;
        const t = S.team(P.team) || { color: '#ccc', sym: '' }, y = L.height(P.pos[0], P.pos[2]);
        items.push({ mesh: sc.charMesh(P.look), pos: [P.pos[0], y, P.pos[2]], yaw: P.pos[3] });
        items.push({ mesh: sc.ringMesh(t.color), pos: [P.pos[0], y, P.pos[2]], noShadow: true, scale: 1.4 });
        const p = sc.project([P.pos[0], y + 2.6, P.pos[2]]);
        if (p.visible) {
          let el = this.labelPool[P.id]; if (!el) { el = this.labelPool[P.id] = h('div.nlabel'); this.app.labels.appendChild(el); }
          const txt = t.sym + ' ' + P.name + (P.shrine ? ' ⛩' : ''); if (el._t !== txt) { el._t = txt; el.textContent = txt; }
          el.style.borderColor = t.color; el.style.transform = 'translate(' + Math.round(p.x) + 'px,' + Math.round(p.y) + 'px) translate(-50%,-100%)'; el.hidden = false; used[P.id] = 1;
        }
      }
      for (const id in this.labelPool) if (!used[id]) this.labelPool[id].hidden = true;
      // Milestone 2: buildings, troops, effects and health gauges straight from the server (the teacher sees everything)
      if (!this.wv) {
        this.wv = new AR.WorldView(sc, this.app.labels);
        this.host.onFlush = up => { if (up.fx && this.wv) this.wv.addFx(String(up.fx).split('|')[1].split(';').map(e => { const a = e.split(','); return { k: a[0], x1: +a[1], z1: +a[2], x2: +a[3], z2: +a[4], tm: a[5] }; })); };
      }
      const sim = S.sim, src = {
        structures: () => Object.keys(sim.w.b).map(id => Object.assign({ id }, sim.structView(sim.w.b[id]))),
        units: () => Object.keys(sim.w.u).map(id => { const u = sim.w.u[id], tg = u.tg && sim.target(u.tg); return { id, ty: u.ty, tm: u.tm, own: u.own, x: u.x, z: u.z, hp: Math.ceil(u.hp), mx: u.max, s: u.st, tgPos: tg ? [tg.x, tg.z] : null }; }),
        spells: () => Object.keys(sim.w.sp || {}).map(id => Object.assign({ id }, sim.spellView(sim.w.sp[id]))),
        wards: () => Object.keys(sim.w.wd || {}).map(id => Object.assign({ id }, sim.wardView(sim.w.wd[id]))),
      };
      if (S.s.phase !== 'lobby') this.wv.frame(items, src, { L, teams: S.s.teams, viewerTeam: null, teacher: true, allies: [], serverNow: S.now() });
      sc.render(items, dt);
      if (S.s.phase !== 'lobby') this.wv.drawBars(Object.values(S.s.players).filter(P => P.pos && P.online && P.team && !P.dead && !P.out).map(P => ({ id: 'p' + P.id, kind: 'p', x: P.pos[0], y: L.height(P.pos[0], P.pos[2]) + 2.1, z: P.pos[2], hp: P.hp == null ? 100 : P.hp, mx: AR.Balance.player.health, tm: P.team })), S.now());
    }
  }
  AR.TeacherSession = TeacherSession;
})(window);

<script>/* src/client/app.js */
/* Arcane Realms · src/client/app.js — screens, the student game (third-person + overhead command view), HUD, team chat,
   minimap, practice mode and the start-up flow. The teacher dashboard lives in ui-teacher.js. */
(function (root) {
  'use strict';
  const AR = root.AR;
  const { h, $, clear, gold, toast, modal } = AR.ui;
  const B = AR.Balance, U = AR.util;
  const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage off */ } } };

  const App = AR.App = {
    bankId: LS.get('ar.bank', 'g68'),
    look: LS.get('ar.look', { robe: Math.floor(Math.random() * 10), hat: 0, skin: 1, hair: 1, gem: 0, trim: 0 }),
    settings: LS.get('ar.settings', { low: false, big: false }),
    keys: {}, mouse: { x: 0, y: 0 }, session: null,

    init() {
      this.ui = $('#ui'); this.labels = $('#labels'); this.canvas = $('#view');
      document.body.classList.toggle('bigtext', !!this.settings.big);
      try { this.scene = new AR.Scene(this.canvas); } catch (e) { this.fatal(e.message); return; }
      this.scene.setLow(this.settings.low);
      this.scene.onAdapt = off => toast('⚙ Simpler graphics for a smoother game (' + off + ' off)');
      this.backdrop();
      this.bindInput();
      const q = new URLSearchParams(location.search);
      if (q.get('room')) this.showJoin(q.get('room'));
      else this.showMenu();
      let last = performance.now();
      const frame = t => {
        requestAnimationFrame(frame);
        const dt = Math.min(0.1, (t - last) / 1000); last = t;
        try { this.frame(dt); } catch (e) { console.error(e); }
      };
      requestAnimationFrame(frame);
      window.addEventListener('beforeunload', () => { if (this.session && this.session.stop) this.session.stop(); });
    },
    fatal(msg) { clear($('#ui')).appendChild(h('div.panel.center', h('h1', 'Arcane Realms'), h('p', msg), h('p', 'Ask your teacher for help.'))); },

    /** The menu background: Emerald Glades with four kingdoms, slowly orbiting. */
    backdrop() {
      const teams = AR.Teams.KINGDOMS.slice(0, 4);
      this.backLayout = AR.Maps.build('emerald', 4);
      this.scene.buildWorld(this.backLayout, teams);
      this.worldKey = 'backdrop';
      this.scene.cam.mode = 'orbit';
    },
    ensureWorld(teams, mapId) {
      const key = mapId + ':' + teams.map(t => t.id + t.color + (t.out ? 'x' : '')).join(',');
      if (this.worldKey === key) return this.layout;
      this.layout = AR.Maps.build(mapId, Math.max(2, teams.length));
      this.scene.buildWorld(this.layout, teams);
      this.worldKey = key;
      this.colliderGrid = buildGrid(this.layout.colliders);
      console.log('[Arcane Realms] world triangles: ' + Math.round(this.scene.world.tris));
      return this.layout;
    },

    // ===================== menu =====================
    showMenu() {
      this.endSession();
      const ui = clear(this.ui), sel = () => { document.querySelectorAll('.grade').forEach(b => b.classList.toggle('on', b.dataset.bank === this.bankId)); };
      const grade = (id, label, sub) => h('button.grade', { 'data-bank': id, onclick: () => { this.bankId = id; LS.set('ar.bank', id); sel(); } }, h('b', label), h('span', sub));
      ui.appendChild(h('div.menu',
        h('a.labhome', { href: 'START_HERE_Computer_Lab.html' }, '← Lab home'),
        h('h1.title', 'Arcane Realms'), h('div.subtitle', 'Knowledge Conquest'),
        h('p.tagline', 'Answer computer questions at your kingdom\'s shrine, earn gold, and build a fantasy kingdom with your team.'),
        h('div.grades', grade('g68', 'Grades 6–8', 'parts · files · scams · passwords · privacy'), grade('g912', 'Grades 9–12', 'phishing · MFA · backups · binary · logic')),
        h('p.small.center', 'Both grade levels play the same game, maps and prices. Only the questions are different.'),
        h('div.actions',
          h('button.btn.big', { onclick: () => this.startHost() }, h('span.ico', '🏰'), 'Host a game', h('small', 'Teacher: make a room')),
          h('button.btn.big.primary', { onclick: () => this.showJoin() }, h('span.ico', '🔑'), 'Join by code', h('small', 'Student: type the room code')),
          h('button.btn.big', { onclick: () => this.startPractice() }, h('span.ico', '📖'), 'Practice', h('small', 'Play alone (not online)'))),
        h('div.howto', [['⛩', 'Visit your shrine'], ['❓', 'Answer questions'], ['🪙', 'Earn gold'], ['🏰', 'Build & defend'], ['🐉', 'Summon dragons']].map(([i, t]) => h('div', h('span', i), t))),
        h('button.link.settings', { onclick: () => this.showSettings() }, '⚙ Settings')));
      sel();
    },
    showSettings() {
      const s = this.settings;
      const m = modal('Settings', h('div.col',
        h('label.check', h('input', { type: 'checkbox', checked: s.low, onchange: e => { s.low = e.target.checked; this.scene.setLow(s.low); LS.set('ar.settings', s); } }), ' Low graphics (faster on old computers)'),
        h('label.check', h('input', { type: 'checkbox', checked: s.tips !== false, onchange: e => { s.tips = e.target.checked; LS.set('ar.settings', s); const S = this.session; if (S && S.advisor) S.advisor.brain.enabled = s.tips; } }), ' Tips from Sage Lyra, the guide (danger warnings always show)'),
        h('label.check', h('input', { type: 'checkbox', checked: s.big, onchange: e => { s.big = e.target.checked; document.body.classList.toggle('bigtext', s.big); LS.set('ar.settings', s); } }), ' Bigger text'),
        h('p.small', 'Graphics level picked for this computer: ' + this.scene.det.tier + '.')), [h('button.btn', { onclick: () => m.close() }, 'Close')]);
    },
    showJoin(code) {
      const ui = clear(this.ui);
      const name = h('input.text', { maxlength: 16, placeholder: 'Nickname (no full names)', value: LS.get('ar.name', ''), 'aria-label': 'Nickname' });
      const room = h('input.text.code', { maxlength: 16, placeholder: 'ROOM-00', value: code || AR.Client.lastRoom(), 'aria-label': 'Room code' });
      const msg = h('p.error');
      const go = () => {
        const nm = U.cleanName(name.value);
        if (!nm) { msg.textContent = 'Choose a kind nickname (letters and numbers, up to 16).'; return; }
        LS.set('ar.name', nm); msg.textContent = 'Connecting…';
        AR.Client.join({ room: room.value, name: nm, look: this.look }).then(link => this.startStudent(link, false)).catch(e => { msg.textContent = e.message; });
      };
      [name, room].forEach(i => i.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); }));
      ui.appendChild(h('div.panel.center.join',
        h('h2', '🔑 Join a game'),
        h('label', 'Your nickname', name), h('label', 'Room code', room), msg,
        h('p.small', 'Use a nickname, never your full name. The game gives you a game ID like #K7P2.'),
        h('div.row.end', h('button.btn', { onclick: () => this.showMenu() }, 'Back'), h('button.btn.primary', { onclick: go }, 'Join'))));
      setTimeout(() => (name.value ? room : name).focus(), 50);
    },

    // ===================== sessions =====================
    endSession() {
      if (this.session) { try { this.session.stop(); } catch (e) { /* ignore */ } }
      this.session = null; clear(this.labels);
      if (this.worldKey !== 'backdrop') this.backdrop();
    },
    startStudent(link, practice) {
      this.endSession();
      this.session = new StudentSession(this, link, practice);
    },
    startPractice() {
      this.endSession();
      AR.Net.resetPractice();
      AR.Host.open({ transport: 'local', bankId: this.bankId, practice: true }).then(host => {
        const nm = LS.get('ar.name', '') || 'Apprentice';
        return AR.Client.join({ room: host.room, name: nm, look: this.look, transport: 'local' }).then(link => {
          this.startStudent(link, true);
          this.session.practiceHost = host;
          const tryStart = () => { if (host.S.player(link.id)) { host.S.shuffleTeams(1); host.S.start(); host.flush(); } else setTimeout(tryStart, 50); };
          tryStart();
        });
      }).catch(e => toast(e.message, 'warn'));
    },
    startHost() {
      const saved = AR.Host.savedRoom();
      const open = resume => {
        this.endSession();
        const wait = h('div.panel.center', h('h2', 'Opening a room…'), h('p', 'Connecting to the class server.'));
        clear(this.ui).appendChild(wait);
        AR.Host.open({ bankId: this.bankId, resumeRoom: resume || null }).then(host => { this.session = new AR.TeacherSession(this, host); })
          .catch(e => { clear(this.ui).appendChild(h('div.panel.center', h('h2', 'Could not open a room'), h('p', e.message), h('button.btn', { onclick: () => this.showMenu() }, 'Back'))); });
      };
      if (saved) {
        const m = modal('Continue your room?', h('p', 'Room ' + saved + ' was open on this computer. Continue it (students keep their teams and gold), or start a new room.'),
          [h('button.btn', { onclick: () => { m.close(); AR.Host.forget(saved); open(null); } }, 'New room'), h('button.btn.primary', { onclick: () => { m.close(); open(saved); } }, 'Continue ' + saved)]);
      } else open(null);
    },

    // ===================== input =====================
    bindInput() {
      const typing = e => /INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '');
      window.addEventListener('keydown', e => {
        this.lastInputAt = performance.now();
        if (typing(e)) return;
        this.keys[e.code] = true;
        if (this.session && this.session.key) this.session.key(e);
        if (e.code === 'Tab') e.preventDefault();
      });
      window.addEventListener('keyup', e => { this.keys[e.code] = false; });
      window.addEventListener('blur', () => { this.keys = {}; });
      const cv = this.canvas;
      let drag = null;
      window.addEventListener('pointerdown', () => { this.lastInputAt = performance.now(); }, true);
      cv.addEventListener('pointerdown', e => { drag ={ x: e.clientX, y: e.clientY, moved: 0, button: e.button }; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* no capture: dragging still works */ } });
      cv.addEventListener('pointermove', e => {
        this.mouse = { x: e.clientX, y: e.clientY };
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
        if (this.session && this.session.drag) this.session.drag(dx, dy);
      });
      cv.addEventListener('pointerup', e => { if (drag && drag.moved < 6 && this.session && this.session.click) this.session.click(e.clientX, e.clientY, drag.button); drag = null; });
      cv.addEventListener('pointercancel', () => { drag = null; });
      cv.addEventListener('lostpointercapture', () => { drag = null; });
      cv.addEventListener('wheel', e => { e.preventDefault(); if (this.session && this.session.wheel) this.session.wheel(e.deltaY); }, { passive: false });
      cv.addEventListener('contextmenu', e => e.preventDefault());
    },

    frame(dt) {
      const S = this.session;
      if (S && S.update) S.update(dt);
      else {   // menu: slow orbit over the backdrop
        const t = performance.now() / 1000, sc = this.scene;
        sc.eye = [Math.cos(t * 0.04) * 120, 55, Math.sin(t * 0.04) * 120];
        sc.fwd = GK.vec.norm(GK.vec.sub([0, 0, 0], sc.eye)); sc.fov = 55; sc.cam.mode = 'orbit';
        sc.render([], dt);
      }
    },
  };

  // ===================== collision grid =====================
  function buildGrid(cols) {
    const g = {}, cell = 8;
    for (const c of cols) {
      const x0 = Math.floor((c.x - c.r) / cell), x1 = Math.floor((c.x + c.r) / cell), z0 = Math.floor((c.z - c.r) / cell), z1 = Math.floor((c.z + c.r) / cell);
      for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) (g[x + ',' + z] = g[x + ',' + z] || []).push(c);
    }
    return { near: (x, z) => g[Math.floor(x / cell) + ',' + Math.floor(z / cell)] || [] };
  }
  App.buildGrid = buildGrid;

  // ===================== the student game =====================
  class StudentSession {
    constructor(app, link, practice) {
      this.app = app; this.link = link; this.practice = practice; this.sc = app.scene;
      this.pos = null; this.yaw = 0; this.spSeq = -1; this.remote = {}; this.pings = []; this.muted = new Set(LS.get('ar.muted.' + link.room, []));
      this.labelPool = {}; this.hudAt = 0; this.mode = 'lobby'; this.view = 'third';
      this.sc.cam.yaw = 0; this.sc.cam.pitch = 0.38; this.sc.cam.dist = 9;
      link.on('g', () => this.onG()).on('ps', id => this.onPs(id)).on('pv', pv => this.onPv(pv)).on('chat', e => this.onChat(e)).on('chatReset', () => this.drawChat())
        .on('kicked', () => this.kicked()).on('connection', ok => { const b = $('.netwarn'); if (b) b.hidden = ok; })
        .on('fx', list => { if (this.wv) this.wv.addFx(list); });
      this.explored = new Set();
      this.screen();
    }
    stop() { this.link.stop(); if (this.practiceHost) this.practiceHost.stop(true); clear(this.app.labels); }
    me() { return this.link.me(); }
    team() { const m = this.me(), g = this.link.g; return m && g && (g.teams || []).find(t => t.id === m.tm) || null; }
    teamIndex() { const m = this.me(), g = this.link.g; return m && g ? (g.teams || []).findIndex(t => t.id === m.tm) : -1; }
    mult() { const t = this.team(); return t ? t.mult || 1 : 1; }

    // ---------------- screens ----------------
    screen() {
      const g = this.link.g, ph = g ? g.ph : 'lobby';
      const want = ph === 'running' || ph === 'ended' ? 'game' : 'lobby';
      if (want !== this.mode || !this.built) { this.mode = want; this.built = true; want === 'game' ? this.buildHud() : this.buildLobby(); }
      if (ph === 'ended') this.showResults(); else if (this.resultsEl) { this.resultsEl.remove(); this.resultsEl = null; }
    }
    onG() {
      const g = this.link.g; if (!g) return;
      if (g.ph === 'running' && g.round !== this.roundSeen) {   // a new round (Round 2 = a new map): start fresh

<script>/* src/client/movement-controls.js */
/* Clickable movement/camera buttons. Loaded after app.js; keeps the integration hooks small. */
(function () {
  'use strict';
  const AR = window.AR, P = AR.StudentSession.prototype, h = AR.ui.h;
  P.motionAction = function (type) {
    if (this.canMove()) this.link.send(type);
  };

  };
  const oldHud = P.buildHud;
  P.buildHud = function () {
    oldHud.call(this);
    const config = AR.Balance.player.sprint;
    const sprint = this.sprintButton = h('button.btn', { onclick: () => this.motionAction('sprint'), title: 'Run faster for ' + config.duration + ' seconds, then rest for ' + config.recovery + ' seconds' }, 'Sprint');
    const jump = this.jumpButton = h('button.btn', { onclick: () => this.motionAction('jump') }, 'Jump');
    const look = (label, title, yaw, pitch) => h('button.btn', { 'aria-label': title, title, onclick: () => {
      if (this.lookBy) this.lookBy(yaw / 0.006, pitch / 0.004);
      else { this.sc.cam.yaw += yaw; this.sc.cam.pitch = AR.util.clamp(this.sc.cam.pitch + pitch, 0.05, 1.2); }
    } }, label);
    this.app.ui.querySelector('.hud').appendChild(h('div.motion-controls', sprint, jump,
      h('span.look-buttons', { 'aria-label': 'Look around' }, look('↶', 'Look left', -0.35, 0), look('↷', 'Look right', 0.35, 0), look('↑', 'Look up', 0, -0.15), look('↓', 'Look down', 0, 0.15)),
      h('span.motion-hint', 'Drag the world to look around')));
  };
  const oldUpdate = P.update;
  P.update = function (dt) {
    oldUpdate.call(this, dt);
    if (!this.sprintButton) return;
    const t = this.elapsed(), me = this.me(), motion = me && me.mo, active = AR.Motion.active(motion, t);
    const rest = motion ? Math.max(0, motion.readyAt - t) : 0;
    this.sprintButton.textContent = active ? 'Sprint ' + Math.ceil(motion.sprintUntil - t) + 's' : rest > 0 ? 'Rest ' + Math.ceil(rest) + 's' : 'Sprint';
    this.sprintButton.disabled = !this.canMove() || rest > 0;

  };

  };
})();

<script>/* src/client/camera-controls.js */
/* Arcane Realms · src/client/camera-controls.js — how the mouse moves the view (teacher's choice, 2026-10-15):
   - NORMAL: the view never follows the mouse. The mouse is free for buttons, menus, chat and building.
   - AIM (🎯): RIGHT-CLICK on the world switches aiming on: a target sight appears in the centre, moving the mouse turns
     the view (the mouse is captured when the browser allows it), and LEFT-CLICK casts a magic bolt at the sight.
     Right-click again, Esc, or the 🎯 button switches aiming off. Opening the Command view, a menu, the shrine or a pop-up
     also ends aiming.
   - V (or the button) switches first / third person. The arrow keys and the ↶ ↷ ↑ ↓ buttons still turn the view.

  'use strict';

  };

    this.aimButton = h('button.btn.aim-toggle', { onclick: () => this.setAim(!this.aiming), title: 'Aim with a target sight (or right-click the world)' }, '🎯 Aim');

  const oldUpdate = P.update;
  P.update = function (dt) {
    if ((this.sc.cam.perspective === 'first' || this.aiming) && this.view !== 'over') this.yaw = Math.atan2(Math.sin(this.sc.cam.yaw), -Math.cos(this.sc.cam.yaw));   // face where you look / aim
    if (this.aiming && (busy(this) || (this.me() || {}).dead)) this.setAim(false);
    oldUpdate.call(this, dt);
    this.refreshCameraButtons();
  };
  // third person while aiming: the camera eases in over the mage's RIGHT shoulder, so the sight looks past the mage
  const oldThird = AR.Scene.prototype.thirdPerson;
  AR.Scene.prototype.thirdPerson = function (target) {
    const c = this.cam, k = c.aimBlend || 0;
    if (k > 0.001 && c.perspective !== 'first') {
      const right = [Math.cos(c.yaw), Math.sin(c.yaw)], s = 1.25 * k;
      target = [target[0] + right[0] * s, target[1] + 0.25 * k, target[2] + right[1] * s];
    }
    return oldThird.call(this, target);
  };
  const oldUpdate2 = P.update;
  P.update = function (dt) {
    const c = this.sc.cam, want = this.aiming ? 1 : 0;
    if (c.aimBlend == null) c.aimBlend = 0;
    if (c.normalDist == null || (!this.aiming && c.aimBlend < 0.01)) c.normalDist = c.dist;
    c.aimBlend += (want - c.aimBlend) * Math.min(1, dt * 10);
    c.dist = c.normalDist + (4.6 - c.normalDist) * c.aimBlend;   // closer while aiming, back to your zoom after
    oldUpdate2.call(this, dt);
  };
  const oldStop = P.stop;
  P.stop = function () { this.aiming = false; release(); this.sc.cam.perspective = 'third'; oldStop.call(this); };

  const oldBind = App.bindInput;
  App.bindInput = function () {
    oldBind.call(this);
    const cv = this.canvas; let last = null;
    cv.style.cursor = 'default';
    const S = () => this.session && this.session.setAim ? this.session : null;
    // mousedown sees every button separately (pointer events merge a 2nd button into a move)
    cv.addEventListener('mousedown', e => {
      const s = S(); if (!s || s.view === 'over') return;
      if (e.button === 2) { e.preventDefault(); s.setAim(!s.aiming); last = [e.clientX, e.clientY]; }
      else if (e.button === 0 && s.aiming) { e.preventDefault(); s.castAtSight(); }
    });
    document.addEventListener('mousemove', e => {
      const s = S(); if (!s || !s.aiming) { last = null; return; }
      if (locked()) s.lookBy(e.movementX, e.movementY);
      else { if (last) s.lookBy(e.clientX - last[0], e.clientY - last[1]); last = [e.clientX, e.clientY]; }   // no capture allowed: turn while the mouse moves
    });
    document.addEventListener('pointerlockchange', () => { const s = S(); if (s && s.aiming && !locked() && s._lockWas) s.setAim(false); if (s) s._lockWas = locked(); if (s && s.refreshCameraButtons) s.refreshCameraButtons(); });
    window.addEventListener('blur', () => { const s = S(); if (s && s.aiming) s.setAim(false); });
  };
})();

</script>
