<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== LAB BASE START ===== */
/* Computer Lab shared design system. Identical in every tool so each folder works on its own. */
:root {
  --ink: #172033;
  --ink-2: #3d4863;
  --muted: #5d6883;
  --bg: #f2f4f9;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --line: #dde2ec;
  --line-strong: #c3cad9;
  --good: #146c43;
  --good-soft: #e2f4ea;
  --bad: #b42318;
  --bad-soft: #fdecea;
  --warn: #8a5100;
  --warn-soft: #fff3d6;
  --focus: #f59e0b;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(23, 32, 51, .06), 0 4px 16px rgba(23, 32, 51, .06);
  --shadow-lg: 0 16px 48px rgba(23, 32, 51, .22);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", "Lucida Console", "Courier New", monospace;
  --accent: #0b7a6c;
  --accent-strong: #0b7a6c;
  --accent-dark: #075a50;
  --accent-soft: #e0f3f0;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  min-height: 100vh;
}
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; color: var(--ink); }
h1 { font-size: 2rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .8em; }
a { color: var(--accent-dark); }
img, svg { max-width: 100%; }
code, kbd, pre { font-family: var(--mono); }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }

.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 1000;
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none;
}
.skip-link:focus { top: 8px; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(23, 32, 51, .02);
}
.app-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.app-logo {
  flex: none; width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--accent-strong); color: #fff;
}
.app-logo svg { width: 28px; height: 28px; }
.app-title { font-size: 1.2rem; font-weight: 700; margin: 0; white-space: nowrap; }
.app-sub { font-size: .82rem; color: var(--muted); margin: 0; white-space: nowrap; }
.app-header .spacer { flex: 1; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 9px 18px;
  font: inherit; font-weight: 600; font-size: .95rem; line-height: 1.2;
  color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm);
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background-color .15s, border-color .15s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-danger { background: var(--surface); border-color: #e3a29b; color: var(--bad); }
.btn-danger:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-danger-solid:hover { background: #8f1b12; border-color: #8f1b12; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--accent-soft); border-color: transparent; }
.btn-lg { min-height: 54px; padding: 12px 26px; font-size: 1.08rem; border-radius: 12px; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- Cards, chips, notices ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}
.card-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-dark); margin: 0 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: .8rem; font-weight: 600;
  background: var(--accent-soft); color: var(--accent-dark);
  white-space: nowrap;
}
.chip-neutral { background: #e8ebf2; color: var(--ink-2); }
.chip-good { background: var(--good-soft); color: var(--good); }
.chip-bad { background: var(--bad-soft); color: var(--bad); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }

.notice {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--line);
}
.notice-icon { flex: none; font-weight: 800; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; color: #fff; background: var(--muted); }
.notice-good { background: var(--good-soft); border-color: #a9d9bf; }
.notice-good .notice-icon { background: var(--good); }
.notice-bad { background: var(--bad-soft); border-color: #f0b3ac; }
.notice-bad .notice-icon { background: var(--bad); }
.notice-warn { background: var(--warn-soft); border-color: #ecc77a; }
.notice-warn .notice-icon { background: var(--warn); }
.notice-info { background: var(--accent-soft); border-color: transparent; }
.notice-info .notice-icon { background: var(--accent-strong); }

.progress-bar { height: 12px; background: #e3e7f0; border-radius: 999px; overflow: hidden; }
.progress-bar > span { display: block; height: 100%; background: var(--accent-strong); border-radius: 999px; transition: width .3s; }

/* ---------- Forms ---------- */
label { font-weight: 600; }
input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select, textarea {
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line-strong); border-radius: 8px;
  padding: 8px 10px; min-height: 42px;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent-strong); }
input[type="range"] { accent-color: var(--accent-strong); }

/* ---------- Layout helpers ---------- */
.screen { animation: lab-fade .2s ease-out; }
@keyframes lab-fade { from { opacity: 0; } to { opacity: 1; } }
.container { max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.stack > * + * { margin-top: 14px; }
.muted { color: var(--muted); }
.center { text-align: center; }
.hero {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 32px; box-shadow: var(--shadow);
}
.hero h1 { font-size: 2.3rem; }
.hero-art svg { width: 100%; height: auto; display: block; }
.hero-lead { font-size: 1.12rem; color: var(--ink-2); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li { position: relative; padding-left: 30px; margin: 6px 0; }
.checklist li::before {
  content: "\2713"; position: absolute; left: 0; top: 1px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-dark);
  font-size: .75rem; font-weight: 800; display: grid; place-items: center;
}
.table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.table th, .table td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table th { background: var(--surface-2); font-weight: 700; color: var(--ink-2); }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(15, 22, 38, .55);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: lab-fade .15s ease-out;
}
.modal {
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
  width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto;
  padding: 26px 28px 22px;
}
.modal.modal-wide { width: min(820px, 100%); }
.modal h2 { margin-bottom: 12px; }
.modal-body { color: var(--ink-2); }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 22px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 600;
  transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 12px 20px; border-radius: 12px; box-shadow: var(--shadow-lg);
  font-weight: 600; max-width: calc(100% - 40px);
}

.no-storage-note { font-size: .85rem; color: var(--warn); }

/* ---------- Fun layer: motion and game feel ---------- */
.app-header::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
  background: linear-gradient(90deg, var(--accent-strong), #f5b700, var(--accent), var(--accent-strong));
  background-size: 300% 100%; animation: lab-sheen 9s linear infinite;
}
@keyframes lab-sheen { to { background-position: 300% 0; } }

.btn { transition: background-color .15s, border-color .15s, box-shadow .15s, transform .12s; }
.btn:hover:not([disabled]) { transform: translateY(-1px); }
.btn:active:not([disabled]) { transform: translateY(1px) scale(.98); }
.btn-primary { box-shadow: 0 3px 0 var(--accent-dark), 0 6px 14px rgba(23, 32, 51, .14); }
.btn-primary:hover:not([disabled]) { box-shadow: 0 4px 0 var(--accent-dark), 0 8px 18px rgba(23, 32, 51, .18); }
.btn-primary:active:not([disabled]) { box-shadow: 0 1px 0 var(--accent-dark); transform: translateY(2px); }
.btn-lg.btn-primary { box-shadow: 0 4px 0 var(--accent-dark), 0 8px 18px rgba(23, 32, 51, .16); }

.screen { animation: lab-enter .38s cubic-bezier(.2, .7, .3, 1); }
@keyframes lab-enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.modal { animation: lab-pop .32s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes lab-pop { from { opacity: 0; transform: scale(.88) translateY(10px); } to { opacity: 1; transform: none; } }
.toast { animation: lab-toast .3s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes lab-toast { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }

.hero { position: relative; overflow: hidden; }
.hero > * { position: relative; }
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  background: var(--accent-soft); opacity: .8;
}
.hero::before { width: 340px; height: 340px; right: -90px; top: -120px; animation: lab-drift 14s ease-in-out infinite alternate; }
.hero::after { width: 200px; height: 200px; left: 38%; bottom: -120px; animation: lab-drift 11s ease-in-out infinite alternate-reverse; }
@keyframes lab-drift { to { transform: translate(-40px, 30px) scale(1.12); } }
.hero-art svg { animation: lab-float 5.5s ease-in-out infinite; transform-origin: center; }
@keyframes lab-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-1deg); } }
@keyframes lab-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .55); } 70% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); } }
.pulse { animation: lab-pulse 2s ease-out infinite; }

#fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 900; overflow: hidden; }
.fx-bit { position: fixed; display: block; border-radius: 2px; will-change: transform, opacity; }

/* Picture tiles and icons */
.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -.22em; }
.pic-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; }
.pic-tile {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 16px 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); transition: transform .18s;
}
.pic-tile:hover { transform: translateY(-3px) rotate(-1deg); }
.pic-badge {
  width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
  background: var(--tile-bg, var(--accent-soft)); color: var(--tile-ink, var(--accent-dark));
}
.pic-badge .ic { width: 36px; height: 36px; }
.pic-tile:nth-child(5n+2) { --tile-bg: #fff1d6; --tile-ink: #8a5100; }
.pic-tile:nth-child(5n+3) { --tile-bg: #e7efff; --tile-ink: #1740a8; }
.pic-tile:nth-child(5n+4) { --tile-bg: #fde8f1; --tile-ink: #8f1146; }
.pic-tile:nth-child(5n+5) { --tile-bg: #e2f4ea; --tile-ink: #146c43; }
.pic-cap { font-weight: 700; font-size: .95rem; line-height: 1.2; }
.pic-num {
  position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; font-size: .78rem; font-weight: 800; color: #fff; background: var(--accent-strong);
}
.pic-title { font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 22px 0 10px; }
.tut-pic { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 14px; }
.tut-pic .pic-tile { min-width: 110px; box-shadow: none; }
.tut-line { text-align: center; font-size: 1.05rem; margin: 0; }

/* Breadcrumbs */
.crumbs { background: var(--surface); border-bottom: 1px solid var(--line); }
.crumbs ol { list-style: none; margin: 0 auto; padding: 6px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: .88rem; }
.crumbs li { display: inline-flex; align-items: center; }
.crumbs li + li::before { content: "›"; color: var(--muted); margin: 0 8px; font-weight: 700; }
.crumbs a, .crumbs button {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 3px 10px; border-radius: 999px;
  font: inherit; font-weight: 600; color: var(--accent-dark); background: transparent; border: 0; cursor: pointer; text-decoration: none;
}
.crumbs a:hover, .crumbs button:hover { background: var(--accent-soft); }
.crumbs a svg { width: 16px; height: 16px; }
.crumbs [aria-current="page"] { font-weight: 800; color: var(--ink); padding: 3px 10px; background: var(--surface-2); border-radius: 999px; }
.btn-sound[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-strong); color: var(--accent-dark); }
.btn-save { border-color: var(--good); color: var(--good); }
.btn-save:hover { background: var(--good-soft); border-color: var(--good); }
.btn-reset { color: var(--bad); border-color: #e3a29b; }
.btn-reset:hover { background: var(--bad-soft); border-color: var(--bad); }
.crumbs { display: flex; align-items: center; flex-wrap: wrap; }
.crumbs ol { flex: 1; margin: 0; }
.save-status { padding: 4px 24px; font-size: .82rem; font-weight: 600; color: var(--good); white-space: nowrap; }
.save-status:not(:empty)::before { content: "\2713  "; }
@media (max-width: 700px) { .save-status { padding: 2px 12px 6px; } }

/* ---------- Guided tutorial ---------- */
.coach {
  position: fixed; left: 20px; bottom: 20px; z-index: 560; width: min(340px, calc(100vw - 32px));
  background: var(--surface); border: 2px solid var(--accent-strong); border-radius: 16px;
  box-shadow: var(--shadow-lg); padding: 14px 16px 12px;
  animation: lab-pop .3s cubic-bezier(.2, .9, .3, 1.25);
}
.coach-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.coach-name { font-weight: 800; color: var(--accent-dark); font-size: .95rem; }
.coach-step { font-size: .78rem; font-weight: 700; color: var(--muted); margin-left: auto; white-space: nowrap; }
.coach-x { font: inherit; font-size: 1.2rem; line-height: 1; width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; background: var(--surface-2); color: var(--ink-2); }
.coach-x:hover { background: var(--bad-soft); color: var(--bad); }
.coach-bar { height: 8px; border-radius: 999px; background: #e3e7f0; overflow: hidden; margin-bottom: 10px; }
.coach-bar span { display: block; height: 100%; background: var(--accent-strong); border-radius: 999px; transition: width .3s; }
.coach-pics:not(:empty) { margin-bottom: 10px; }
.coach-pics .pic-row { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.coach-pics .pic-tile { padding: 10px 6px 8px; box-shadow: none; }
.coach-pics .pic-badge { width: 42px; height: 42px; border-radius: 12px; }
.coach-pics .pic-badge .ic { width: 24px; height: 24px; }
.coach-pics .pic-cap { font-size: .78rem; }
.coach-text { margin: 0 0 12px; font-size: 1rem; line-height: 1.45; color: var(--ink); }
.coach-text code, .coach-text strong { font-weight: 800; }
.coach-actions { display: flex; gap: 8px; justify-content: flex-end; }
.coach.is-done { border-color: var(--good); }
.coach.is-done .coach-text::after { content: "  \2713 done"; color: var(--good); font-weight: 800; }
.coach.coach-right { left: auto; right: 20px; }
@media (max-width: 700px) { .coach, .coach.coach-right { left: 8px; right: 8px; bottom: 8px; width: auto; } }

.coach-halo {
  position: relative; z-index: 1;
  outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 10px;
  animation: coach-ring 1.6s ease-out infinite;
}
@keyframes coach-ring {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .55); }
  60% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 700px) {
  html { font-size: 16px; }
  .app-header { padding: 8px 12px; flex-wrap: wrap; }
  .app-sub { display: none; }
  .container { padding: 18px 12px 40px; }
}
@media print {
  .app-header, .crumbs, #fx-layer, .no-print, .modal-backdrop, .toast, .skip-link, .coach { display: none !important; }
  .hero::before, .hero::after { display: none; }
  body { background: #fff; }
  .card { box-shadow: none; border-color: #bbb; }
}
/* ===== LAB BASE END ===== */

/* ===== Song Star Studio ===== */
:root {
  --accent: #d6336c;
  --accent-strong: #d6336c;
  --accent-dark: #a61e4d;
  --accent-soft: #ffe3ee;
  --night: #24124a;
}
body { background: #f6f0ff; }

/* home */
.stage-hero { display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; align-items: center; padding: 28px; border-radius: 22px; color: #fff; position: relative; overflow: hidden;
  background: radial-gradient(circle at 15% 0%, #7b2ff7 0%, var(--night) 60%); box-shadow: var(--shadow-lg); }
.stage-hero::before { content: '♪ ♫ ♪ ♬ ♩ ♫'; position: absolute; right: -10px; top: -12px; font-size: 5rem; letter-spacing: .2em; color: #ffffff12; white-space: nowrap; pointer-events: none; }
.stage-hero h1 { color: #fff; font-size: 2.5rem; margin: 0 0 4px; }
.hero-lead { font-size: 1.3rem; font-weight: 700; color: #ffd6f0; margin: 0 0 12px; }
.who-chip { display: inline-flex; align-items: center; gap: 6px; background: #ffffff1f; border-radius: 999px; padding: 5px 14px; font-size: 1rem; margin-bottom: 16px; }
.who-chip .link-btn { color: #ffd166; background: transparent; border: 0; font: inherit; font-size: .85rem; text-decoration: underline; cursor: pointer; }
.btn-free { background: #ffd166; border-color: #ffd166; color: #3b2300; font-weight: 800; }
.score-card { background: #fff; color: var(--ink); border-radius: 18px; padding: 16px 20px; display: grid; gap: 6px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); position: relative; }
.sc-row { display: flex; align-items: baseline; gap: 8px; }
.sc-big { font-size: 1.8rem; font-weight: 900; color: var(--accent-dark); }
.sc-row small { color: var(--muted); font-weight: 700; }
.zone { margin-top: 24px; }

<script>
'use strict';
/* ===== LAB KIT START ===== */
/* Computer Lab shared helpers. Identical in every tool so each folder works on its own. */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

/* Progress is kept only in this browser on this computer. Nothing is ever sent anywhere. */
const store = {
  available: (() => {
    try {
      const k = '__lab_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })(),
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  /* locked stops any last-second writes (for example on page unload) after a reset or a file load. */
  locked: false,
  onWrite: null,
  set(key, value) {
    if (store.locked) return false;
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      if (typeof store.onWrite === 'function') store.onWrite(key);
      return true;
    } catch (e) { return false; }
  },
  remove(key) {
    try { window.localStorage.removeItem(key); } catch (e) { /* storage unavailable */ }
  }
};

const Modal = (() => {
  let root = null;
  let returnFocus = null;
  let current = null;

  function close() {
    if (!root) return;
    const opts = current;
    root.innerHTML = '';
    current = null;
    document.removeEventListener('keydown', onKey, true);
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
    if (opts && typeof opts.onClose === 'function') opts.onClose();
  }

  function onKey(e) {
    if (!current) return;
    if (e.key === 'Escape' && current.dismissible !== false) {
      e.preventDefault();
      close();
      return;
    }
    if (e.key === 'Tab') {
      const box = $('.modal', root);
      const items = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', box)
        .filter(el => !el.disabled && el.offsetParent !== null);
      if (!items.length) return;
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  /* opts: { title, html, actions: [{label, variant, onClick, keepOpen}], dismissible, wide, onClose, onOpen } */
  function open(opts) {
    root = root || document.getElementById('modal-root');
    if (current) { current = null; root.innerHTML = ''; }
    else {
      const active = document.activeElement;
      returnFocus = active && !root.contains(active) ? active : null;
    }
    current = opts;
    const actions = opts.actions && opts.actions.length ? opts.actions : [{ label: 'Close', variant: 'primary' }];
    root.innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal' + (opts.wide ? ' modal-wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
          '<h2 id="modal-title">' + esc(opts.title || '') + '</h2>' +
          '<div class="modal-body">' + (opts.html || '') + '</div>' +
          '<div class="modal-actions">' +
            actions.map((a, i) => '<button type="button" class="btn ' + (a.variant ? 'btn-' + a.variant : '') + '" data-modal-action="' + i + '">' + esc(a.label) + '</button>').join('') +
          '</div>' +
        '</div>' +
      '</div>';
    const backdrop = $('.modal-backdrop', root);
    backdrop.addEventListener('click', e => {
      if (e.target === backdrop && opts.dismissible !== false) close();
    });
    $$('[data-modal-action]', root).forEach(btn => {
      btn.addEventListener('click', () => {
        const action = actions[Number(btn.dataset.modalAction)];
        if (!action.keepOpen) {
          const onClose = current && current.onClose;
          if (current) current.onClose = null;
          close();
          if (typeof action.onClick === 'function') action.onClick();
          else if (typeof onClose === 'function') onClose();
        } else if (typeof action.onClick === 'function') {
          action.onClick();
        }
      });
    });
    document.addEventListener('keydown', onKey, true);
    if (typeof opts.onOpen === 'function') opts.onOpen($('.modal', root));
    const focusTarget = $('[data-autofocus]', root) || $('.modal-actions .btn-primary', root) || $('.modal-actions .btn', root);
    if (focusTarget) focusTarget.focus();
  }

  return { open, close, isOpen: () => !!current };
})();

function confirmBox(title, message, confirmLabel, onConfirm, danger) {
  Modal.open({
    title,
    html: '<p>' + message + '</p>',
    actions: [
      { label: 'Cancel', variant: 'secondary' },
      { label: confirmLabel, variant: danger ? 'danger-solid' : 'primary', onClick: onConfirm }
    ]
  });
}

let toastTimer = null;
function toast(message) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/* If a teacher clears progress in another tab (for example on the launcher page), start fresh here too,
   so this tab cannot write the old progress back. */
function reloadWhenCleared(key) {
  window.addEventListener('storage', e => {
    if (e.key === null || (e.key === key && e.newValue === null)) window.location.reload();
  });
}

function showScreen(id) {
  $$('.screen').forEach(s => { s.hidden = s.id !== id; });
  window.scrollTo(0, 0);
  Nav.render(id);
  const screen = document.getElementById(id);
  const heading = screen && $('h1, h2', screen);
  if (heading) {
    heading.setAttribute('tabindex', '-1');
    heading.focus({ preventScroll: true });
  }
}

/* ---------- "You are here" breadcrumbs ----------
   Nav.setup({ tool: 'Code Island', screens: { 'screen-home': { label, go }, 'screen-map': { label, parent, go } } })
   A label may be a function, so it can show the current level or case. */
const Nav = (() => {
  let cfg = null;
  let current = null;

  function setup(options) {
    cfg = options;
    const header = $('.app-header');
    if (!header || $('#crumbs')) return;
    const bar = document.createElement('nav');
    bar.className = 'crumbs';
    bar.setAttribute('aria-label', 'You are here');
    bar.innerHTML = '<ol id="crumbs"></ol>';
    header.insertAdjacentElement('afterend', bar);
    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-crumb]');
      if (!b) return;
      const s = cfg.screens[b.dataset.crumb];
      if (s && typeof s.go === 'function') { Fx.sound('click'); s.go(); }
    });
  }

  function label(s) { return typeof s.label === 'function' ? s.label() : s.label; }

  function render(id) {
    current = id || current;
    const list = $('#crumbs');
    if (!cfg || !list) return;
    const trail = [];
    let step = current;
    while (step && cfg.screens[step] && trail.length < 6) {
      trail.unshift(step);
      step = cfg.screens[step].parent;
    }
    /* Reuse the page's own "Lab home" link so the address is right in every copy of the tools. */
    const homeLink = $('.app-header a[href]');
    let html = homeLink
      ? '<li><a href="' + esc(homeLink.getAttribute('href')) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>Computer Lab</a></li>'
      : '';
    trail.forEach((sid, i) => {
      const s = cfg.screens[sid];
      const last = i === trail.length - 1;
      html += '<li>' + (last
        ? '<span aria-current="page">' + esc(label(s)) + '</span>'
        : '<button type="button" data-crumb="' + sid + '">' + esc(label(s)) + '</button>') + '</li>';
    });
    list.innerHTML = html;
  }

  return { setup, render: id => render(id), refresh: () => render(null) };
})();

function icon(name, cls) {
  const p = ICON_PATHS[name] || ICON_PATHS.star;
  return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}

/* A row of picture tiles: "icon:Label|icon:Label". */
function picRow(spec, numbered) {
  return String(spec).split('|').map((item, i) => {
    const at = item.indexOf(':');
    const name = at === -1 ? item : item.slice(0, at);
    const label = at === -1 ? '' : item.slice(at + 1);
    return '<div class="pic-tile">' + (numbered ? '<span class="pic-num" aria-hidden="true">' + (i + 1) + '</span>' : '') +
      '<span class="pic-badge">' + icon(name.trim()) + '</span><span class="pic-cap">' + esc(label.trim()) + '</span></div>';
  }).join('');
}

function fillPictures(root) {
  $$('[data-icon]', root).forEach(el => { if (!el.firstElementChild) el.innerHTML = icon(el.dataset.icon); });
  $$('[data-pics]', root).forEach(el => { if (!el.firstElementChild) el.innerHTML = picRow(el.dataset.pics, el.classList.contains('numbered')); });
}
fillPictures(document);

/* ---------- Save and Reset buttons ----------
   SaveBar.setup({ id: 'code-island', key: SAVE_KEY, name: 'Code Island', what: 'your stars and levels', save: fn, note: '' })
   Progress already saves automatically; these buttons make that visible, and let students carry
   progress to another computer in a small file (for example on a flash drive). */
const SaveBar = (() => {
  let cfg = null;
  const ICON_SAVE = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></svg>';
  const ICON_RESET = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>';

  const clock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function setStatus(text) {
    const el = $('#save-status');
    if (el) el.textContent = text;
  }

  function setup(options) {
    cfg = options;
    store.onWrite = key => { if (key === cfg.key) setStatus('Auto-saved at ' + clock()); };
    if (!store.available) setStatus('Saving is blocked in this browser – use “Save to a file”');
    const bar = $('.header-actions');
    if (!bar || $('#btn-save')) return;
    const save = document.createElement('button');
    save.type = 'button';
    save.id = 'btn-save';
    save.className = 'btn btn-sm btn-save';
    save.innerHTML = ICON_SAVE + '<span>Save</span>';
    save.addEventListener('click', saveNow);
    const reset = document.createElement('button');
    reset.type = 'button';
    reset.id = 'btn-reset-all';
    reset.className = 'btn btn-sm btn-reset';
    reset.innerHTML = ICON_RESET + '<span>Reset</span>';
    reset.addEventListener('click', askReset);
    bar.insertBefore(reset, bar.firstChild);
    bar.insertBefore(save, bar.firstChild);
    const crumbs = $('.crumbs');
    if (crumbs && !$('#save-status')) {
      const status = document.createElement('span');
      status.id = 'save-status';
      status.className = 'save-status';
      crumbs.appendChild(status);
    }
    if (store.available && window.localStorage.getItem(cfg.key)) setStatus('Saved progress found on this computer');
  }

  function saveNow() {
    try { cfg.save(); } catch (e) { /* the file option below still works */ }
    const ok = store.available;
    if (ok) setStatus('Saved at ' + clock());
    Fx.sound('good');
    Modal.open({
      title: ok ? 'Game saved!' : 'This browser is blocking saving',
      html: (ok
        ? '<div class="notice notice-good"><span class="notice-icon" aria-hidden="true">&#10003;</span><div><strong>Your progress is saved on this computer.</strong> Next time, open ' + esc(cfg.name) + ' on this same computer and browser, and you will continue where you stopped.</div></div>'
        : '<div class="notice notice-warn"><span class="notice-icon" aria-hidden="true">!</span><div>This browser (or a private window) does not allow saving. Use <strong>Save to a file</strong> so you do not lose your work.</div></div>') +
        (cfg.note ? '<p style="margin-top:12px">' + esc(cfg.note) + '</p>' : '') +
        '<h3 style="margin:16px 0 6px;font-size:1rem">Using a different computer next time?</h3>' +
        '<p style="margin:0">Choose <strong>Save to a file</strong>. The browser puts a small progress file in your <strong>Downloads</strong> folder – copy it to your flash drive or school folder. On the other computer, open ' + esc(cfg.name) + ', press <strong>Save</strong>, then <strong>Load from a file</strong>.</p>',
      actions: [
        { label: 'Load from a file', variant: 'secondary', onClick: loadFromFile },
        { label: 'Save to a file', variant: 'secondary', onClick: saveToFile },
        { label: 'Done', variant: 'primary' }
      ]
    });
  }

  function saveToFile() {
    try { cfg.save(); } catch (e) { /* use what is stored */ }
    let data = store.get(cfg.key, null);
    if (!data) { toast('There is no progress to save yet – play first!'); return; }
    const today = new Date();
    const payload = { app: 'computerLab', tool: cfg.id, name: cfg.name, savedAt: today.toISOString(), data };
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = cfg.name.replace(/\s+/g, '-') + '-progress-' + today.toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Progress file saved – look in your Downloads folder.');
  }

  function loadFromFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let payload = null;
        try { payload = JSON.parse(String(reader.result)); } catch (e) { payload = null; }
        if (!payload || payload.app !== 'computerLab' || !payload.data || typeof payload.data !== 'object') {
          Modal.open({ title: 'That file cannot be loaded', html: '<p>This is not a Computer Lab progress file. Choose a file that was made with <strong>Save to a file</strong>.</p>' });
          return;
        }
        if (payload.tool !== cfg.id) {
          Modal.open({ title: 'Wrong activity', html: '<p>This progress file belongs to <strong>' + esc(payload.name || 'another activity') + '</strong>, not ' + esc(cfg.name) + '. Open ' + esc(payload.name || 'that activity') + ' and load it there.</p>' });
          return;
        }
        const when = payload.savedAt ? new Date(payload.savedAt).toLocaleString() : 'an earlier date';
        confirmBox('Load this progress?', 'This replaces the progress on this computer with the progress saved on <strong>' + esc(when) + '</strong>.', 'Load progress', () => {
          if (!store.set(cfg.key, payload.data)) { toast('This browser is blocking saving, so the file could not be loaded.'); return; }
          store.locked = true;
          window.location.reload();
        });
      };
      reader.readAsText(file);
    });
    input.click();
  }

  function askReset() {
    Modal.open({
      title: 'Reset ' + cfg.name + '?',
      html: '<p>This deletes <strong>' + esc(cfg.what) + '</strong> for ' + esc(cfg.name) + ' on this computer and starts again from the beginning. This cannot be undone.</p>' +
        '<p class="muted">Want to keep a copy? Choose <strong>Save to a file first</strong>.</p>',
      actions: [
        { label: 'Cancel', variant: 'secondary' },
        { label: 'Save to a file first', variant: 'secondary', onClick: saveToFile },
        { label: 'Reset and start again', variant: 'danger-solid', onClick: () => {
          store.remove(cfg.key);
          store.locked = true;
          window.location.reload();
        } }
      ]
    });
  }

  return { setup, saveNow, askReset };
})();

/* ---------- Fun layer: celebrations, small animations and optional sound ----------
   Everything here is decoration only: the game state never waits for an animation. */
const Fx = (() => {
  const SOUND_KEY = 'computerLab.sound';
  const COLORS = ['#f5b700', '#2a78d6', '#eb6834', '#1baf7a', '#e87ba4', '#7c3aed', '#ffffff'];
  let audio = null;
  let soundOn = !!store.get(SOUND_KEY, false);

  const calm = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const canAnimate = () => !calm() && typeof Element !== 'undefined' && !!Element.prototype.animate;

  function layer() {
    let l = document.getElementById('fx-layer');
    if (!l) {
      l = document.createElement('div');
      l.id = 'fx-layer';
      l.setAttribute('aria-hidden', 'true');
      document.body.appendChild(l);
    }
    return l;
  }

  function centerOf(el) {
    if (!el || !el.getBoundingClientRect) return { x: window.innerWidth / 2, y: window.innerHeight * 0.35 };
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* Pieces fly out from a point and fall with gravity. */
  function particles(x, y, count, power, colors, life) {
    if (!canAnimate()) return;
    const l = layer();
    for (let i = 0; i < count; i++) {
      const p = document.createElement('i');

/* ---------- Guided tutorial ----------
   Coach.start({ name, steps, onDone }) walks a student through one complete piece of work.
   Each step: { text, pic, target, check, act, done }
     text   one short instruction
     pic    optional "icon:Label|icon:Label" picture row
     target CSS selector of the thing to use; it is outlined and scrolled into view
     check  function returning true once the student has done it (the step then ticks by itself)
     act    function that does the step for them ("Show me")
   The tutorial never blocks the tool: students can press Stop at any time and keep whatever they made. */
const Coach = (() => {
  let cfg = null;
  let index = 0;
  let timer = null;
  let lastTarget = null;
  let advancing = false;

  const panel = () => document.getElementById('coach');

  function mount() {
    if (panel()) return;
    const el = document.createElement('div');
    el.id = 'coach';
    el.className = 'coach';
    el.setAttribute('role', 'region');
    el.setAttribute('aria-label', 'Guided tutorial');
    el.innerHTML =
      '<div class="coach-head"><span class="coach-name"></span><span class="coach-step"></span>' +
      '<button type="button" class="coach-x" data-coach="move" aria-label="Move this box to the other side">&harr;</button>' +
      '<button type="button" class="coach-x" data-coach="stop" aria-label="Stop the tutorial">&times;</button></div>' +
      '<div class="coach-bar" aria-hidden="true"><span></span></div>' +
      '<div class="coach-pics"></div>' +
      '<p class="coach-text" aria-live="polite"></p>' +
      '<div class="coach-actions">' +
        '<button type="button" class="btn btn-sm" data-coach="show">Show me</button>' +
        '<button type="button" class="btn btn-sm btn-primary" data-coach="next">Next</button>' +
      '</div>';
    document.body.appendChild(el);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-coach]');
      if (!b) return;
      if (b.dataset.coach === 'stop') stop(true);
      else if (b.dataset.coach === 'move') el.classList.toggle('coach-right');
      else if (b.dataset.coach === 'show') showMe();
      else next();
    });
  }

  function clearHalo() {
    $$('.coach-halo').forEach(el => el.classList.remove('coach-halo'));
    lastTarget = null;
  }

  function highlight() {
    const step = cfg && cfg.steps[index];
    if (!step || !step.target) { clearHalo(); return; }
    const el = $(step.target);
    if (!el) { clearHalo(); return; }
    if (el === lastTarget) { el.classList.add('coach-halo'); return; }
    clearHalo();
    el.classList.add('coach-halo');
    lastTarget = el;
    if (el.scrollIntoView) el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: Fx.calm() ? 'auto' : 'smooth' });
  }

  function render() {
    mount();
    const el = panel();
    const step = cfg.steps[index];
    const last = index === cfg.steps.length - 1;
    $('.coach-name', el).textContent = cfg.name || 'Tutorial';
    $('.coach-step', el).textContent = 'Step ' + (index + 1) + ' of ' + cfg.steps.length;
    $('.coach-bar span', el).style.width = Math.round(index / cfg.steps.length * 100) + '%';
    $('.coach-pics', el).innerHTML = step.pic ? '<div class="pic-row">' + picRow(step.pic) + '</div>' : '';
    $('.coach-text', el).innerHTML = step.text;
    $('[data-coach="show"]', el).hidden = typeof step.act !== 'function';
    $('[data-coach="next"]', el).textContent = last ? 'Finish' : 'Next';
    el.classList.remove('is-done');
    highlight();
    clearInterval(timer);
    timer = setInterval(tick, 300);
  }

  function tick() {
    if (!cfg) return;
    highlight();
    const step = cfg.steps[index];
    if (advancing || typeof step.check !== 'function') return;
    let ok = false;
    try { ok = !!step.check(); } catch (e) { ok = false; }
    if (!ok) return;
    advancing = true;
    const el = panel();
    if (el) el.classList.add('is-done');
    Fx.sound('good');
    setTimeout(() => { advancing = false; next(); }, 700);
  }

  function showMe() {
    const step = cfg && cfg.steps[index];
    if (!step || typeof step.act !== 'function') return;
    try { step.act(); } catch (e) { /* the student can still do it themselves */ }
    if (typeof step.check !== 'function') next();
  }

  function next() {
    if (!cfg) return;
    if (index >= cfg.steps.length - 1) { finish(); return; }
    index++;
    render();
  }

  function finish() {
    const done = cfg && cfg.onDone;
    stop(false);
    if (typeof done === 'function') done();
  }

  function stop(byStudent) {
    clearInterval(timer);
    timer = null;
    advancing = false;
    const onStop = cfg && cfg.onStop;
    cfg = null;
    clearHalo();
    const el = panel();
    if (el) el.remove();
    if (byStudent && typeof onStop === 'function') onStop();
  }

  function start(options) {
    stop(false);
    cfg = options;
    index = 0;
    render();
  }

  return { start, stop, next, active: () => !!cfg, step: () => index, count: () => (cfg ? cfg.steps.length : 0) };
})();

  let extra = [];   /* words the teacher adds (Teacher page) */
  const LEET = { 0: 'o', 1: 'i', 3: 'e', 4: 'a', 5: 's', 7: 't', 8: 'b', '@': 'a', $: 's', '!': 'i', '|': 'i', '+': 't' };
  const norm = w => w.toLowerCase().replace(/[0-9@$!|+]/g, c => LEET[c] || c).replace(/[^a-z]/g, '');
  const squash = w => w.replace(/(.)\1+/g, '$1');
  function setExtra(list) { extra = (list || []).map(norm).filter(w => w.length > 1); }
  function badWord(raw) {
    const w = norm(raw);
    if (!w) return false;
    const forms = [w, squash(w)];
    return forms.some(f => INSIDE.some(b => f.indexOf(b) > -1) || WHOLE.indexOf(f) > -1 || extra.indexOf(f) > -1 ||
      (f.length > 3 && /s$/.test(f) && (WHOLE.indexOf(f.slice(0, -1)) > -1 || extra.indexOf(f.slice(0, -1)) > -1)));
  }
  /* the words in a text that are not OK (also "f u c k" written with spaces) */
  function check(text) {
    const tokens = String(text || '').split(/[\s,.;:?"()]+/).filter(Boolean);
    const bad = [];
    tokens.forEach(t => { if (badWord(t)) bad.push(t); });
    /* single letters in a row: f u c k */
    let run = [];
    tokens.concat(['  ']).forEach(t => {
      if (norm(t).length === 1) run.push(t);
      else { if (run.length > 2 && badWord(run.join(''))) bad.push(run.join(' ')); run = []; }
    });
    return bad;
  }
  return { check, setExtra, ok: text => !check(text).length };
})();

/* ---------- the judges: Hit Meter 0–100 ---------- */
function judge(s, sylls) {
  const notes = notesOf(s), rows = notes.map(x => x[1]);
  const beat = Math.min(10, drumCount(s, 0) * 2.5) + Math.min(10, drumCount(s, 1) * 2.5) + Math.min(6, drumCount(s, 2)) + ([0, 1, 2].every(r => drumCount(s, r) > 0) ? 4 : 0);
  let hook = false;
  for (let a = 0; a < 4 && !hook; a++) for (let b = a + 1; b < 4 && !hook; b++) if (barNotes(s, a).filter(n => n >= 0).length >= 3 && sameBar(s, a, b)) hook = true;
  const melody = Math.min(10, notes.length) + Math.min(8, new Set(rows).size * 2) + Math.min(6, turns(s) * 2) + (hook ? 6 : 0);
  const fit = sylls.length ? Math.min(1, notes.length / sylls.length) : 0;
  const words = Math.min(10, sylls.length) + Math.round(fit * 10) + (linesRhyme(s.lyrics) ? 5 : 0);
  const ending = rows.length && rows[rows.length - 1] % 5 === 0 ? 10 : 0;   /* ends on the home note (the lowest or the 6th row) */
  const total = Math.round(Math.min(30, beat) + Math.min(30, melody) + Math.min(25, words) + 5 + ending);
  const tip = (part, max) => part >= max * 0.85;
  return {
    total: Math.min(100, total),
    judges: [
      { icon: '🎧', name: 'DJ Beat', score: Math.round(Math.min(30, beat)), max: 30, say: tip(beat, 30) ? 'That beat makes me dance!' : drumCount(s, 1) < 3 ? 'Add more 👏 Claps for a strong beat.' : 'Add ✨ Tss sounds to make it busier.' },
      { icon: '🎹', name: 'Melody Max', score: Math.round(Math.min(30, melody)), max: 30, say: tip(melody, 30) ? 'What a catchy tune!' : notes.length < 10 ? 'Add more notes to your melody.' : !hook ? 'Repeat your best bar: a hook makes songs catchy.' : 'Go up AND down, like a roller coaster.' },
      { icon: '🎤', name: 'Lyric Lou', score: Math.round(Math.min(25, words)), max: 25, say: tip(words, 25) ? 'Great words, and they fit the notes!' : sylls.length < 8 ? 'Write more lyrics, or ask 🤖 Lyric Bot.' : fit < 1 ? 'Some words have no note. Press 🎹 Notes for my words.' : 'Try two lines that rhyme.' },
      { icon: '🏠', name: 'Ending', score: ending + 5, max: 15, say: ending ? 'Your song ends at home. Nice!' : 'End your melody on a red or blue note: it sounds finished.' }
    ]
  };
}

    ['Sing about {w} with me today', 'Sing it loud and clap away'],
    ['Let us sing about {w} now', 'Clap your hands and take a bow']
  ];
  const pickN = (arr, n, seed) => { const a = arr.slice(), out = []; let x = seed; while (out.length < n && a.length) { x = (x * 9301 + 49297) % 233280; out.push(a.splice(Math.floor(x / 233280 * a.length), 1)[0]); } return out; };
  /* which topic does a typed idea mean? */
  function topicFor(idea) {
    const w = String(idea || '').toLowerCase().split(/[^a-z]+/).filter(Boolean);
    return Object.keys(TOPICS).find(k => k === w.join('') || w.some(x => TOPICS[k].words.indexOf(x) > -1)) || null;
  }
  /* write lyrics. idea = a topic key or a word typed by the student. lines = 2 or 4 */
  function write(idea, lines, seed) {
    seed = seed || Date.now() % 233280;
    const n = lines >= 4 ? 2 : 1;
    const key = TOPICS[idea] ? idea : topicFor(idea);
    if (key) {
      /* 4 lines must fit the 32 notes of the song */
      for (let t = 0; t < 12; t++) {
        const got = pickN(TOPICS[key].pairs, n, seed + t * 7919).map(p => p.join('\n')).join('\n');
        if (syllablesOf(got).length <= STEPS) return got;
      }
      return pickN(TOPICS[key].pairs, 1, seed).map(p => p.join('\n')).join('\n');
    }
    const word = String(idea || '').trim().toLowerCase().replace(/[^a-z ]/g, '').split(/\s+/).slice(0, 2).join(' ');
    if (!word) return '';
    const cap = word.charAt(0).toUpperCase() + word.slice(1);
    return pickN(FREE, n, seed).map(p => p.join('\n')).join('\n').replace(/\{w\}/g, word).replace(/\{W\}/g, cap);
  }
  return { TOPICS, write, topicFor };
})();

/* 🎹 Make notes for my words: one note per lyric piece, each line goes up and comes home at the end */
function notesForWords(song, sylls) {
  const n = Math.min(STEPS, sylls.length);
  if (!n) return;
  const gap = n <= 16 ? 2 : 1;
  const SHAPES = [[2, 3, 4, 4, 3, 2, 3, 0], [4, 5, 6, 5, 4, 3, 4, 5], [2, 3, 4, 5, 4, 3, 2, 0], [5, 4, 3, 4, 5, 4, 3, 0]];
  song.mel = Array(STEPS).fill(-1);
  let step = 0, k = 0;
  const lines = [];
  sylls.slice(0, n).forEach(p => { (lines[p.line] = lines[p.line] || []).push(p); });
  lines.filter(Boolean).forEach((line, li) => {
    const shape = SHAPES[li % SHAPES.length];
    line.forEach((p, j) => {
      if (step >= STEPS || k >= n) return;
      const last = j === line.length - 1;
      song.mel[step] = last ? (li % 2 ? 5 : 0) : shape[j % shape.length];
      step += gap; k++;
    });
    /* a small rest at the end of a line, when there is room */
    if (gap === 2 && step < STEPS - (n - k) * 2) step += 2;
  });
}

/* ===== Song Star Studio: sound =====
   The music is made with Web Audio (no sound files). The singing is the STUDENT'S OWN VOICE:
   recorded with the headset microphone while the music plays, then played back in time with the music.
   Song + voice can be saved as one audio file (.webm) to hand in. */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null;
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
      master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function noise() {
    if (noiseBuf) return noiseBuf;
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function drum(id, t) {
    if (id === 'boom') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
      env(g, t, 0.95, 0.005, 0.32);
      o.connect(g).connect(master); o.start(t); o.stop(t + 0.4);
      return;
    }
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise();
    if (id === 'clap') { f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.8; env(g, t, 0.7, 0.003, 0.16); }
    else { f.type = 'highpass'; f.frequency.value = 7000; env(g, t, 0.28, 0.002, 0.05); }
    src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + 0.25);
  }
  const INST = {
    piano: { type: 'triangle', peak: 0.32, a: 0.005, d: 0.9 },
    guitar: { type: 'sawtooth', peak: 0.18, a: 0.004, d: 0.6, lp: 1800 },
    bells: { type: 'sine', peak: 0.3, a: 0.002, d: 1.4, bell: true },
    synth: { type: 'square', peak: 0.12, a: 0.02, d: 0.5, lp: 2600 }
  };
  function note(midi, t, dur, inst) {
    const p = INST[inst] || INST.piano, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = p.type; o.frequency.value = hz(midi);
    let out = o;
    if (p.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = p.lp; o.connect(f); out = f; }
    env(g, t, p.peak, p.a, Math.max(0.15, Math.min(p.d, dur + 0.2)));
    out.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 1.5);
    if (p.bell) { const o2 = ctx.createOscillator(), g2 = ctx.createGain(); o2.type = 'sine'; o2.frequency.value = hz(midi) * 3; env(g2, t, 0.08, 0.002, 0.4); o2.connect(g2).connect(master); o2.start(t); o2.stop(t + 0.6); }
  }
  function bass(midi, t, dur) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = hz(midi); f.type = 'lowpass'; f.frequency.value = 420;
    env(g, t, 0.3, 0.01, dur);
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + dur + 0.1);
  }
  function click(t, high) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = high ? 1320 : 880; env(g, t, 0.35, 0.002, 0.08);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.12);
  }

  /* ---------- play a song ----------
     opts: { loops (0 = until stop), onStep(i), onEnd(), voice: AudioBuffer of the student's singing, countIn: true }
     The voice starts together with the first step (it was recorded the same way). */
  let current = null;
  const LATENCY = () => (ctx.outputLatency || 0.03) + (ctx.baseLatency || 0.01) + 0.05;   /* mic + speaker delay, so the voice is not late */
  function play(song, opts) {
    stop();
    if (!ac()) return null;
    opts = opts || {};
    const mood = MOODS[song.mood] || MOODS.happy, stepDur = 60 / (song.tempo || 100) / 2;
    const beat = stepDur * 2, lead = opts.countIn ? beat * 4 : 0;
    const run = { step: 0, loop: 0, next: ctx.currentTime + 0.15 + lead, timers: [], stopped: false, voiceSrc: null };
    run.startAt = run.next;
    if (opts.countIn) for (let b = 0; b < 4; b++) {
      click(run.next - lead + b * beat, b === 0);
      if (opts.onCount) run.timers.push(setTimeout(() => { if (!run.stopped) opts.onCount(4 - b); }, Math.max(0, (run.next - lead + b * beat - ctx.currentTime) * 1000)));
    }
    if (opts.voice) {
      const src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = opts.voice.buffer; g.gain.value = 1.4;
      src.connect(g).connect(master);
      const off = Math.max(0, (opts.voice.offset || 0) + LATENCY());
      src.start(run.startAt, Math.min(off, src.buffer.duration));
      run.voiceSrc = src;
    }
    function noteLen(i) { let k = 1; while (k < 4 && i + k < STEPS && song.mel[i + k] < 0) k++; return k * stepDur; }
    function schedule() {
      while (!run.stopped && run.next < ctx.currentTime + 0.25) {
        const i = run.step, t = run.next;
        DRUMS.forEach((d, r) => { if (song.drums[r][i]) drum(d.id, t); });
        if (song.bass && i % 4 === 0) bass(mood.bass[Math.floor(i / 8)], t, stepDur * 3.5);
        if (song.mel[i] >= 0) note(mood.notes[song.mel[i]], t, noteLen(i), song.inst);
        if (opts.onStep) run.timers.push(setTimeout(() => { if (!run.stopped) opts.onStep(i); }, Math.max(0, (t - ctx.currentTime) * 1000)));
        run.next += stepDur;
        run.step++;
        if (run.step >= STEPS) {
          run.step = 0; run.loop++;
          if (opts.loops && run.loop >= opts.loops) {
            run.stopped = true;
            run.timers.push(setTimeout(() => { if (current === run) { current = null; if (opts.onEnd) opts.onEnd(); } }, Math.max(0, (run.next - ctx.currentTime) * 1000 + 300)));
          }
        }
      }
    }
    run.iv = setInterval(schedule, 25);
    schedule();
    run.stop = () => { run.stopped = true; clearInterval(run.iv); run.timers.forEach(clearTimeout); if (run.voiceSrc) { try { run.voiceSrc.stop(); } catch (e) { /* not started */ } } };
    current = run;
    return run;
  }
  function stop() { if (current) { const c = current; current = null; c.stop(); } }
  function tap(kind, row, song) {
    if (!ac()) return;
    const t = ctx.currentTime + 0.01;
    if (kind === 'mel') note((MOODS[song.mood] || MOODS.happy).notes[row], t, 0.3, song.inst); else drum(kind, t);
  }

  /* ---------- the microphone ---------- */
  const micOk = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  function getMic() { return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  /* record the voice while the song plays (after a 4-beat count-in). opts: { onStep, onCount, onEnd(result | {error}) } → { stop() } */
  async function recordVoice(song, opts) {
    stop();
    if (!ac()) return opts.onEnd({ error: 'sound' });
    if (!micOk()) return opts.onEnd({ error: 'nomic' });
    let stream;
    try { stream = await getMic(); } catch (e) { return opts.onEnd({ error: 'nomic' }); }
    const chunks = [], rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    let recStart = 0, run = null, cancelled = false;
    const finish = () => { try { if (rec.state !== 'inactive') rec.stop(); } catch (e) { /* stopped */ } };
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (cancelled) return opts.onEnd({ error: 'cancel' });
      const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
      /* the voice file starts at recStart; the music started at run.startAt */
      const offset = run ? Math.max(0, run.startAtPerf - recStart) / 1000 : 0;
      opts.onEnd({ blob, offset });
    };
    rec.onstart = () => {
      recStart = performance.now();
      run = play(song, { loops: 2, countIn: true, onStep: opts.onStep, onCount: opts.onCount, onEnd: () => setTimeout(finish, 250) });
      run.startAtPerf = performance.now() + (run.startAt - ctx.currentTime) * 1000;
    };
    rec.start();
    return { stop(cancel) { cancelled = !!cancel; stop(); finish(); } };
  }
  async function decode(blob) {
    if (!ac()) return null;
    const buf = await blob.arrayBuffer();
    return new Promise((res) => { ctx.decodeAudioData(buf, b => res(b), () => res(null)); });
  }
  /* the music + the voice as one audio file (real time: a 10 second song takes 10 seconds) */
  function exportSong(song, voice, onDone) {
    if (!ac() || !window.MediaRecorder || !ctx.createMediaStreamDestination) { onDone({ error: 'Your browser cannot save audio. Use Microsoft Edge or Google Chrome.' }); return; }
    const dest = ctx.createMediaStreamDestination();
    master.connect(dest);
    const chunks = [], rec = new MediaRecorder(dest.stream);
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => { try { master.disconnect(dest); } catch (e) { /* gone */ } onDone({ blob: new Blob(chunks, { type: rec.mimeType || 'audio/webm' }) }); };
    rec.start();
    play(song, { loops: 2, voice, onEnd: () => setTimeout(() => { try { rec.requestData(); } catch (e) { /* ok */ } setTimeout(() => rec.stop(), 300); }, 400) });
    return { cancel() { stop(); try { rec.stop(); } catch (e) { /* ok */ } } };
  }
  return { play, stop, tap, micOk, getMic, recordVoice, decode, exportSong, playing: () => !!current, ac };
})();

/* ---------- the student's recordings: kept in this browser (IndexedDB), one per level and one for the Free Studio ---------- */
const Voices = (() => {
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((res) => {
      try {
        const r = indexedDB.open('songStarVoices', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('v');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function op(mode, fn) {
    const d = await db();
    if (!d) return null;
    return new Promise(res => {
      try { const tx = d.transaction('v', mode), st = tx.objectStore('v'), r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => res(null); } catch (e) { res(null); }
    });
  }
  return {
    get: key => op('readonly', st => st.get(key)),
    set: (key, val) => op('readwrite', st => st.put(val, key)),
    del: key => op('readwrite', st => st.delete(key))
  };
})();

/* ---------- 🎙️ microphone test (Teacher page) ---------- */
async function testMic() {
  const msg = $('#mic-msg');
  if (!Sound.micOk()) { msg.innerHTML = '⚠️ This browser cannot use a microphone. Use Microsoft Edge or Google Chrome.'; return; }
  let stream;
  try { stream = await Sound.getMic(); } catch (e) { msg.innerHTML = '⚠️ No microphone found, or it was blocked. Plug in a headset with a microphone and click <b>Allow</b> when the browser asks.'; return; }
  const ctx = Sound.ac(), an = ctx.createAnalyser(), src = ctx.createMediaStreamSource(stream), buf = new Uint8Array(an.fftSize);
  src.connect(an);

  const t0 = Date.now(), iv = setInterval(() => {
    an.getByteTimeDomainData(buf);

    const el = $('#mic-lvl'); if (el) el.style.width = Math.min(100, m * 1.6) + '%';
    if (Date.now() - t0 > 5000) {
      clearInterval(iv); stream.getTracks().forEach(t => t.stop()); src.disconnect();
      msg.innerHTML = peak > 8 ? '✅ The microphone works! Students can record their voice.' : '⚠️ The microphone is on, but it heard almost nothing. Check the headset plug and Windows › Sound › Input.';
    }
  }, 60);
}

  if (!st.done) st.help = (st.help || 0) + 1;
  L.fix(cur.song);
  $('#lyrics').value = cur.song.lyrics || '';
  cur.showing = [];
  if (shows('lyrics')) glow($('#btn-play'));
  changed();
}
function resetLevel() {
  const L = cur.L;
  confirmBox('↺ Start level ' + L.id + ' again?', 'Your notes for this level are cleared. Do it yourself to get ★★★!', 'Start again', () => {
    const st = lvl(L.id);
    st.song = L.start(); st.help = 0;
    cur.song = st.song; cur.played = cur.listened = cur.sang = false; cur.judged = 0; cur.showing = []; cur.finished = false; cur.step = null;
    Voices.del(voiceKey()); cur.voice = null;
    $('#lyrics').value = cur.song.lyrics || '';
    save(); renderStudio();
  });
}
function clearSong() {
  confirmBox('🧹 Clear the whole song?', 'All beats, notes and lyrics are removed.', 'Clear', () => {
    const keep = cur.song, s = blankSong();
    ['mood', 'tempo', 'inst'].forEach(k => { s[k] = keep[k]; });
    Voices.del(voiceKey()); cur.voice = null;
    cur.song = s; if (cur.L) lvl(cur.L.id).song = s; else data.studio = s;
    $('#lyrics').value = '';
    stopAll(); renderStudio(); save();
  });
}

/* ---------- song files ---------- */
function saveFile() {
  const name = (data.name || 'My').replace(/[^A-Za-z0-9]+/g, '_') + '_Song.song';
  const write = voice => {
    downloadBlob(new Blob([JSON.stringify({ app: 'songStar', v: 1, name: data.name, song: cur.song, voice })], { type: 'application/json' }), name);
    toast('💾 Saved to your Downloads folder: ' + name);
  };
  if (!cur.voice || !cur.voice.blob) { write(null); return; }
  const rd = new FileReader();
  rd.onload = () => write({ data: rd.result, offset: cur.voice.offset });
  rd.readAsDataURL(cur.voice.blob);
}
function blobFromDataUrl(url) {
  const m = String(url || '').match(/^data:([^;]+);base64,(.*)$/);
  if (!m) return null;
  const bin = atob(m[2]), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: m[1] });
}
function openFile(then) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.song,application/json';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d = null;
      try { d = JSON.parse(String(rd.result)); } catch (e) { d = null; }
      const s = d && d.app === 'songStar' && d.song;
      if (!s || !Array.isArray(s.mel) || !Array.isArray(s.drums)) { Modal.open({ title: 'That file cannot be opened', html: '<p>Choose a <b>.song</b> file made with 💾 Save song.</p>' }); return; }
      const song = Object.assign(blankSong(), s);
      if (!WordGuard.ok(song.lyrics)) song.lyrics = '';
      const vb = d.voice && blobFromDataUrl(d.voice.data);
      then(song, d.name, vb ? { blob: vb, offset: d.voice.offset || 0 } : null);
    };
    rd.readAsText(f);
  });
  inp.click();
}

/* ================= NAME + HELP ================= */
function askName(first) {
  Modal.open({ title: first ? '🎤 Welcome, Song Star!' : '🎤 Your name', dismissible: !first,
    html: '<label class="pf"><span class="eyebrow">Your name</span><input type="text" id="who-in" maxlength="20" autocomplete="off" value="' + esc(data.name) + '" placeholder="First name"></label><p class="small bad-word" id="who-msg"></p>',
    actions: [{ label: 'Let’s make music! 🎵', variant: 'primary', keepOpen: true, onClick: () => {
      const v = $('#who-in').value.trim().replace(/\s+/g, ' ');
      if (v.length < 2) { $('#who-msg').textContent = 'Type your name first.'; return; }
      if (!WordGuard.ok(v)) { $('#who-msg').textContent = '🚫 Please use your real name.'; Fx.shake($('#who-in')); return; }
      data.name = v; save(); updateTop(); Modal.close(); renderHome();
      if (first && !data.seenHelp) showHelp();
    } }] });
  setTimeout(() => { const i = $('#who-in'); if (i) { i.focus(); i.addEventListener('keydown', e => { if (e.key === 'Enter') $('.modal-actions .btn-primary').click(); }); } }, 50);
}
function showHelp() {
  data.seenHelp = true; save();
  Modal.open({ title: '🎵 How to play', wide: true,
    html: '<ol class="how"><li><span>🟩</span><b>Click squares</b><small>to make a beat and notes</small></li><li><span>▶</span><b>Play</b><small>to hear your song</small></li><li><span>✍️</span><b>Write lyrics</b><small>then 🎤 Sing</small></li><li><span>⭐</span><b>Get 3 stars</b><small>do it yourself!</small></li></ol>' +
      '<p class="small">Follow the <b>steps</b> on the left. 👆 <b>Show me</b> helps (free). 🪄 <b>Do it for me</b> costs a star.</p>' +
      '<p class="small">🎙️ <b>Record</b> sings with <b>your own voice</b> (headset microphone). No microphone? Press ▶ Play and sing along. 🤖 <b>Lyric Bot</b> helps you write words. Kind words only!</p>',
    actions: [{ label: 'Let’s go!', variant: 'primary' }] });
}

/* ================= EVENTS ================= */
function goHome() { stopAll(); cur = null; showScreen('screen-home'); renderHome(); Nav.refresh(); }
document.addEventListener('click', e => {
  const t = e.target;
  const lv = t.closest('[data-level]');
  if (lv && !lv.closest('.modal')) { Fx.sound('click'); openLevel(+lv.dataset.level); return; }
  const pk = t.closest('[data-pick]');
  if (pk && cur) {
    const g = pk.dataset.pick, v = pk.dataset.v;
    if (g === 'Speed') cur.song.tempo = +v; else if (g === 'Mood') cur.song.mood = v; else if (g === 'Sound') cur.song.inst = v;
    renderPickers(); changed();
    if (g === 'Sound' || g === 'Mood') Sound.tap('mel', 4, cur.song);
    return;
  }
  const act = t.closest('[data-act]');
  if (!act || act.closest('.modal')) return;
  const a = act.dataset.act;
  if (a === 'show') showMe();
  else if (a === 'doit') doIt();
  else if (a === 'reset-level') resetLevel();
  else if (a === 'judge') judgeSong();
  else if (a === 'clear') clearSong();
  else if (a === 'file-save') saveFile();
  else if (a === 'file-open') openFile((song, n, voice) => { cur.song = song; data.studio = song; $('#lyrics').value = song.lyrics; save(); renderStudio(); if (voice) Voices.set('free', voice).then(() => useVoice(voice)); else { Voices.del('free'); cur.voice = null; renderVoice(); } });
  else if (a === 'name') askName(false);
  else if (a === 'bot') lyricBot();
  else if (a === 'notes') notesForMyWords();
  else if (a === 'download') downloadSong();
  else if (a === 'voice-toggle') { cur.voiceOn = !cur.voiceOn; renderVoice(); }
  else if (a === 'voice-del') deleteVoice();
  else if (a === 'test-mic') testMic();
  else if (a === 'home') goHome();
  else if (a === 'print') window.print();
  else if (a === 'save-words') { const list = $('#t-words').value.split(/[,\n]/).map(w => w.trim()).filter(Boolean); store.set(WORDS_KEY, list); WordGuard.setExtra(list); toast('🛡️ Saved: ' + list.length + ' extra word' + (list.length === 1 ? '' : 's')); }
  else if (a === 'open-student') openFile((song, name, voice) => { cur = { L: null, song, sang: false, voice: null, voiceOn: true, judged: 0, showing: [], visitor: name }; showScreen('screen-studio'); $('#lyrics').value = song.lyrics; renderStudio(); if (voice) useVoice(voice); toast('🎵 ' + (name || 'Student') + '’s song: press ▶ Play'); });
  else if (a === 'unlockall') { data.unlockAll = true; save(); renderTeacher(); }
  else if (a === 'lockall') { data.unlockAll = false; save(); renderTeacher(); }
  else if (a === 'clear-top') confirmBox('Clear the Top 10?', 'All names and scores on the board are removed from this computer.', 'Clear', () => { store.set(TOP_KEY, []); toast('Top 10 cleared'); }, true);
});
$('#btn-continue').addEventListener('click', () => (isDone(12) ? openFree() : openLevel(nextLevel().id)));
$('#btn-free').addEventListener('click', openFree);
$('#btn-top').addEventListener('click', showTop);
$('#btn-help').addEventListener('click', showHelp);
$('#btn-teacher').addEventListener('click', () => { stopAll(); renderTeacher(); showScreen('screen-teacher'); Nav.refresh(); });

Nav.setup({
  tool: 'Song Star Studio',
  screens: {
    'screen-home': { label: 'Level map', go: goHome },
    'screen-studio': { label: () => (cur && cur.L ? 'Level ' + cur.L.id + ': ' + cur.L.title : 'Free Studio'), parent: 'screen-home', go: () => {} },
    'screen-teacher': { label: 'Teacher guide', parent: 'screen-home', go: () => {} }
  }
});
SaveBar.setup({ id: 'song-star', key: SAVE_KEY, name: 'Song Star Studio', what: 'your levels, stars and songs', save });
window.addEventListener('storage', e => { if (e.key === null || (e.key === SAVE_KEY && e.newValue === null)) store.locked = true; });
reloadWhenCleared(SAVE_KEY);
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); save(); });
function nameButtons() { $$('.header-actions .btn').forEach(b => { const t = b.textContent.trim(); b.setAttribute('aria-label', t); b.title = t; }); }
nameButtons();

renderHome();
showScreen('screen-home');
if (!FAST && !data.name) setTimeout(() => askName(true), 250);

if (FAST) {
  window.SS = {
    LEVELS, WordGuard, Sound, judge, syllablesOf, data: () => data, cur: () => cur, top: topList,
    setName(n) { data.name = n; save(); renderHome(); },
    open: openLevel, free: openFree, home: goHome,
    /* finish a level through the real buttons: 🪄 Do it for me (+ 🎤 Sing) */
    solve(id) {
      openLevel(id);
      const L = cur.L;
      if (L.steps.some(st => st[2] === 'listen')) { $('#btn-listen').click(); stopAll(); }
      if (L.fix) { $('[data-act="doit"]').click(); }
      if (L.steps.some(st => st[2] === 'play')) { $('#btn-play').click(); stopAll(); }
      Modal.close();
      return isDone(id);
    }
  };
}
