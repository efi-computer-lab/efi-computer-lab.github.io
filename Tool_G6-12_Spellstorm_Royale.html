<script>/* src/shared/util.js */
/* Arcane Realms · src/shared/util.js — small helpers shared by server and client (no DOM). */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  const rng = seed => { let s = (seed >>> 0) || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); };
  const hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const newId = () => (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 12).padEnd(12, '0');
  const r2 = v => Math.round(v * 100) / 100;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // Kind-words filter for nicknames and chat (school setting). Matches whole words and common letter swaps.
  const BAD = ['stupid', 'idiot', 'dumb', 'loser', 'hate', 'kill yourself', 'kys', 'shut up', 'ugly', 'fat', 'noob', 'trash',
    'damn', 'hell', 'crap', 'sucks', 'suck', 'shit', 'fuck', 'bitch', 'ass', 'bastard', 'dick', 'piss', 'sex', 'porn', 'retard', 'moron'];
  const norm = s => String(s || '').toLowerCase().replace(/[@4]/g, 'a').replace(/3/g, 'e').replace(/[1!|]/g, 'i').replace(/0/g, 'o').replace(/[$5]/g, 's').replace(/7/g, 't');
  function isUnkind(s) {
    const t = ' ' + norm(s).replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ') + ' ', squash = norm(s).replace(/[^a-z]/g, '');
    return BAD.some(w => t.indexOf(' ' + w + ' ') >= 0 || (w.length >= 5 && squash.indexOf(w.replace(/ /g, '')) >= 0));
  }
  function cleanText(s, max) { return String(s || '').replace(/[\u0000-\u001f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, max || 80); }
  function cleanName(s) {
    const t = cleanText(s, 16).replace(/[^\p{L}\p{N} _.-]/gu, '').trim();
    return t && !isUnkind(t) ? t : '';
  }
  const GID = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function gameId(rnd) { const r = rnd || Math.random; let s = ''; for (let i = 0; i < 4; i++) s += GID[Math.floor(r() * GID.length)]; return '#' + s; }
  const ROOM_WORDS = ['ELF', 'DRAKE', 'RUNE', 'OAK', 'MAGE', 'GROVE', 'KEEP', 'WYRM', 'GEM', 'FAE', 'TOME', 'STAR'];
  function roomCode(rnd) { const r = rnd || Math.random; return ROOM_WORDS[Math.floor(r() * ROOM_WORDS.length)] + '-' + (10 + Math.floor(r() * 90)); }
  const fmtTime = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };

  AR.util = { rng, hash, newId, r2, clamp, isUnkind, cleanText, cleanName, gameId, roomCode, fmtTime };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/shared/balance.js */

  'use strict';

<script>/* src/shared/squads.js */
/* Spellstorm Royale · src/shared/squads.js — squad identities, the size options shown to the teacher, and
   "mix & balance": new squads every round that (1) put students with classmates they have NOT played with yet and
   (2) spread the strongest players, so every squad has a fair chance. Pure functions (no DOM), tested in Node. */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  // colour + symbol + name, so squads are never told apart by colour alone
  const SQUADS = [
    { name: 'Phoenix', color: '#ef4444', sym: '🔥' }, { name: 'Griffin', color: '#3b82f6', sym: '🦅' },
    { name: 'Kraken', color: '#14b8a6', sym: '🐙' }, { name: 'Wyvern', color: '#22c55e', sym: '🐉' },
    { name: 'Unicorn', color: '#ec4899', sym: '🦄' }, { name: 'Basilisk', color: '#eab308', sym: '🐍' },
    { name: 'Pegasus', color: '#a855f7', sym: '🪽' }, { name: 'Minotaur', color: '#f97316', sym: '🐂' },
    { name: 'Owlbear', color: '#94a3b8', sym: '🦉' }, { name: 'Sphinx', color: '#b45309', sym: '🦁' },
    { name: 'Hydra', color: '#0ea5e9', sym: '🌊' }, { name: 'Golem', color: '#78716c', sym: '🗿' },

  function sizes(n, k) {

  /** The ready-made choices for the teacher: for n present students, one option per squad size (2 squads at least). */
  function options(n, sizesWanted) {
    const out = [], seen = {};
    const ks = [];
    for (const s of sizesWanted || [2, 3, 4, 5, 6]) ks.push(Math.floor(n / s), Math.ceil(n / s));   // e.g. 10 students: 5, 4, 3 or 2 squads
    for (const k0 of ks) {
      const k = Math.max(2, k0);

      seen[k] = 1;

      if (sz[sz.length - 1] < 2) continue;   // nobody plays alone

  }
  /** Remember who played together (for the next mix). */

  function multipliers(squads) {

    for (const s of squads) out[s.id] = s.members.length ? biggest / s.members.length : 1;

</script>

/* Spellstorm Royale · src/shared/storm.js — the Mana Storm. Pure functions: the same seed gives the same circles on the
   host, every student's screen and the bots, so only the seed travels over the network.
   plan(seed, island) → the circles of one round; at(plan, t) → where the safe circle is at round time t (seconds). */

  'use strict';

  function plan(seed, island) {

    for (const st of S.steps) {
      const p = circles[circles.length - 1], room = Math.max(0, p.r - st.r) * 0.8;
      let x = p.x, z = p.z;

        const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * room, nx = p.x + Math.cos(a) * d, nz = p.z + Math.sin(a) * d;
        if (Math.hypot(nx, nz) + st.r * 0.5 <= land || tries === 19) { x = nx; z = nz; break; }
      }
      circles.push({ x, z, r: st.r });
    }
    return { seed, circles };
  }

  /** The storm at round time t: {x, z, r (safe radius now), dps (damage/s outside), stage, moving, next (shown circle or null), nextAt, moveEnd} */
  function at(pl, t) {
    const S = B().storm, steps = S.steps, C = pl.circles;

    const prev = C[Math.max(0, i - 1)], step = steps[i - 1], move = step ? step.move || S.moveSec : 0;
    let cur = C[i], x = cur.x, z = cur.z, r = cur.r, moving = false;
    if (step && t < step.at + move) {   // the wall is sliding from the previous circle to this one
      const k = (t - step.at) / move, from = C[i - 1];
      x = from.x + (cur.x - from.x) * k; z = from.z + (cur.z - from.z) * k; r = from.r + (cur.r - from.r) * k; moving = true;
    }

  }

    { id: 'wood', name: 'Whisperwood', icon: '🌲', a: 0.25, d: 108, r: 26, kind: 'wood', text: 'Thick elven forest: good cover.' },
    { id: 'forge', name: 'Ember Forge', icon: '🌋', a: 1.12, d: 112, r: 24, kind: 'forge', text: 'A small volcano with a dwarf forge.' },
    { id: 'frost', name: 'Frostmere', icon: '❄', a: 2.0, d: 110, r: 26, kind: 'frost', text: 'Frozen lake and ice spikes.' },
    { id: 'market', name: 'Market Village', icon: '🏘', a: 2.82, d: 104, r: 26, kind: 'market', text: 'Houses and market stalls.' },
    { id: 'library', name: 'Floating Library', icon: '📚', a: 3.66, d: 108, r: 22, kind: 'library', text: 'Book towers on floating rocks.' },

<script>/* src/shared/questions.js */
/* Arcane Realms · src/shared/questions.js — question logic (no content, no DOM).
   - validate(bank)            → list of problems (empty = OK)
   - kindOf(q)                 → 'standard' | 'applied' | 'puzzle' (decides the reward)
   - deliver(q, rnd)           → {pub, key}: pub is what the student's screen gets (shuffled, NO answer);
                                 key is what only the server keeps to mark it
   - mark(q, key, answer)      → true / false
   - reveal(q, key)            → the correct answer in the student's shuffled order (sent only after a wrong answer)
   - Picker                    → which question a student gets next (variety, no reward twice, missed topics revisited) */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};
  const TYPES = ['choice', 'match', 'order', 'input'];

  function kindOf(q) {
    if (q.type === 'input') return 'puzzle';
    if (q.type === 'order' || q.sit) return 'applied';
    return 'standard';
  }

  function validate(bank) {
    const out = [], ids = {};
    if (!bank || !Array.isArray(bank.questions)) return ['bank has no questions'];
    for (const q of bank.questions) {
      const where = bank.id + ':' + (q.id || '?');
      if (!q.id) out.push(where + ' has no id');
      if (ids[q.id]) out.push(where + ' duplicate id'); ids[q.id] = 1;
      if (!bank.topics[q.topic]) out.push(where + ' unknown topic ' + q.topic);
      if (TYPES.indexOf(q.type) < 0) out.push(where + ' unknown type ' + q.type);
      if (!q.q || !q.ex || !q.fix) out.push(where + ' needs q, ex and fix');
      if (q.type === 'choice' && (!Array.isArray(q.o) || q.o.length < 2 || new Set(q.o).size !== q.o.length)) out.push(where + ' choice needs 2+ different options');
      if (q.type === 'match' && (!Array.isArray(q.pairs) || q.pairs.length < 3)) out.push(where + ' match needs 3+ pairs');
      if (q.type === 'match' && q.pairs && new Set(q.pairs.map(p => p[0])).size !== q.pairs.length) out.push(where + ' match left items must differ');
      if (q.type === 'order' && (!Array.isArray(q.items) || q.items.length < 3 || new Set(q.items).size !== q.items.length)) out.push(where + ' order needs 3+ different items');
      if (q.type === 'input' && (!Array.isArray(q.accept) || !q.accept.length)) out.push(where + ' input needs accept[]');
    }
    return out;
  }

  const shuffled = (n, rnd) => { const a = []; for (let i = 0; i < n; i++) a.push(i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  const normInput = s => String(s == null ? '' : s).toLowerCase().replace(/[\s,]+/g, '').replace(/^\.+/, '').trim();

  /** Make the student's (public) copy. Choice: options shuffled. Match: right-hand list shuffled (unique values).
      Order: items shuffled (never already in the correct order). Input: just the prompt. */
  function deliver(q, rnd) {
    rnd = rnd || Math.random;
    const pub = { id: q.id, type: q.type, q: q.q, topic: q.topic, kind: kindOf(q) };
    let key = null;
    if (q.type === 'choice') {
      const perm = shuffled(q.o.length, rnd);
      pub.o = perm.map(i => q.o[i]);
      key = perm.indexOf(0);   // the first authored option is correct
    } else if (q.type === 'match') {
      const rights = Array.from(new Set(q.pairs.map(p => p[1]))), perm = shuffled(rights.length, rnd);
      pub.left = q.pairs.map(p => p[0]);
      pub.right = perm.map(i => rights[i]);
      key = q.pairs.map(p => pub.right.indexOf(p[1]));
    } else if (q.type === 'order') {
      let perm = shuffled(q.items.length, rnd), tries = 0;
      while (perm.every((v, i) => v === i) && tries++ < 10) perm = shuffled(q.items.length, rnd);
      pub.items = perm.map(i => q.items[i]);
      key = q.items.map(it => pub.items.indexOf(it));   // correct sequence of shown indexes
    } else if (q.type === 'input') {
      key = q.accept.map(normInput);
    }
    return { pub, key };
  }

  /** answer formats: choice → index; match → [rightIndex per left]; order → [shown indexes in chosen order]; input → string. */
  function mark(q, key, answer) {
    if (q.type === 'choice') return Number(answer) === key;
    if (q.type === 'match' || q.type === 'order') {
      if (!Array.isArray(answer) || answer.length !== key.length) return false;
      return key.every((v, i) => Number(answer[i]) === v);
    }
    if (q.type === 'input') return key.indexOf(normInput(answer)) >= 0;
    return false;
  }

  function reveal(q, key) {
    if (q.type === 'input') return q.accept[0];
    return key;
  }

  /** Per-student question chooser. State is plain data (saved with the server):
      {seen: {qid: count}, correct: {qid: 1}, missed: [{qid, topic, after}], served: n, lastTopic} */
  const Picker = {
    fresh() { return { seen: {}, correct: {}, missed: [], served: 0, lastTopic: null }; },
    next(bank, st, rnd, cfg) {
      rnd = rnd || Math.random;
      cfg = Object.assign({ revisitAfter: 3, sameQuestionAfter: 6 }, cfg);
      const open = bank.questions.filter(q => !st.correct[q.id]);
      if (!open.length) return null;   // every question answered correctly: bank mastered
      // 1) a missed concept that is due: same topic, preferably a different question; the very same question only
      //    after sameQuestionAfter others (so the revealed answer is never rewarded straight away)
      for (const due of st.missed.slice()) {
        if (st.served < due.at + cfg.revisitAfter) continue;
        const sameTopic = open.filter(q => q.topic === due.topic && q.id !== due.qid);
        const unseen = sameTopic.filter(q => !st.seen[q.id]), pool = unseen.length ? unseen : sameTopic;
        let pick = pool.length ? pool[Math.floor(rnd() * pool.length)] : null;
        if (!pick && !st.correct[due.qid] && st.served >= due.at + cfg.sameQuestionAfter) pick = bank.questions.find(q => q.id === due.qid);
        if (!pick && st.correct[due.qid] && !sameTopic.length) { st.missed.splice(st.missed.indexOf(due), 1); continue; }
        if (pick) { st.missed.splice(st.missed.indexOf(due), 1); return pick; }
      }
      // 2) unseen questions, avoiding the topic just asked
      const unseen = open.filter(q => !st.seen[q.id]);
      let pool = unseen.filter(q => q.topic !== st.lastTopic);
      if (!pool.length) pool = unseen;
      // 3) everything seen: questions not yet answered correctly, oldest/least-seen first, never the very last one
      if (!pool.length) {
        const wa = st.wrongAt || {}, ok = open.filter(q => q.id !== st.lastId && !(wa[q.id] != null && st.served < wa[q.id] + cfg.sameQuestionAfter));
        if (!ok.length) return null;   // only just-missed questions are left: wait (the shrine says "come back soon")
        const min = Math.min.apply(null, ok.map(q => st.seen[q.id] || 0));
        pool = ok.filter(q => (st.seen[q.id] || 0) === min);
      }
      return pool[Math.floor(rnd() * pool.length)];
    },
    served(st, q) { st.seen[q.id] = (st.seen[q.id] || 0) + 1; st.served++; st.lastTopic = q.topic; st.lastId = q.id; },
    wrong(st, q) {
      (st.wrongAt = st.wrongAt || {})[q.id] = st.served;
      if (!st.missed.some(m => m.topic === q.topic)) st.missed.push({ qid: q.id, topic: q.topic, at: st.served });
    },
    right(st, q) { st.correct[q.id] = 1; },
  };

  const Banks = {
    get(id) { return AR.BankData && AR.BankData[id] ? AR.BankData[id] : null; },
    list() { return Object.keys(AR.BankData || {}).map(k => AR.BankData[k]); },
    byId(bank, qid) { return bank.questions.find(q => q.id === qid) || null; },
  };

  AR.Questions = { kindOf, validate, deliver, mark, reveal, normInput, Picker, Banks };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>/* src/server/server.js */
/* Spellstorm Royale · src/server/server.js — THE AUTHORITATIVE GAME SERVER (no DOM, no network).

   griffin flight 0–40 s, then play; the storm closes completely by 9:50) → 'results' → the teacher starts the next round.
   Player states in a round: haven · fly (on the griffin) · glide · ground · down (waiting to respawn, first 5 min) · out.

   Student requests  handle(pid, {t, …}):
     jump                 jump off the griffin (or a normal jump on the ground)
     sprint               sprint
     shoot {x, z}         fire the Spark Staff at a point (the host checks range, aim and who is hit)
     rune {id}            start answering at a Rune Stone (must stand next to it)
     learn                answer in the Learn panel (Sky Haven, or while down / out)
     leave                stop answering
     ans {tok, a} · fixdone {tok, a} · next     the question flow (same as Arcane Realms)
     chat {x} · quick {i} · ping {x, z} · report {target, reason} · look {look}

    }

    griffinLeaving(t) {

      const spot = mate ? I.randomLand(this.rnd, mate.pos[0], mate.pos[2], 12) : I.randomLand(this.rnd, st.x, st.z, Math.max(10, st.r * 0.7));

        const members = r.q.members.map(id => this.player(id)).filter(Boolean).map(P => ({ id: P.id, n: P.name, g: P.gid, rp: r2(P.rp), ko: P.roundStats.ko, as: P.roundStats.as, ans: P.roundStats.ans, ch: P.roundStats.chests || 0, dmg: Math.round(P.roundStats.dmg || 0), deaths: P.deaths || 0, bonus: P.placeBonus || 0 }))

      });
      for (const P of Object.values(this.s.players)) { P.pts = r2(P.pts + P.rp); this.touchP(P.id); }

      this.s.history.push({ round: this.s.round, squads: squads.map(s => ({ name: s.name, place: s.place, members: s.members.map(m => m.n) })), mvp: mvps[0] ? mvps[0].n : '' });

    learnPanel(pid) {

    }

      const bank = this.bank(), q = Q().Picker.next(bank, P.qs, this.rnd, B().runes);
      if (!q) { P.cur = null; this.notify(P.id, 'Come back in a moment for a new question.', 'info'); this.touchPv(P.id); return; }
      Q().Picker.served(P.qs, q);
      const d = Q().deliver(q, this.rnd);
      P.cur = { qid: q.id, tok: (this.s.seq++).toString(36) + Math.floor(this.rnd() * 1e6).toString(36), key: d.key, pub: d.pub, state: 'open', at: this.now(), fb: null };
      const st = this.s.qstats[q.id] = this.s.qstats[q.id] || { served: 0, r: 0, w: 0 }; st.served++;
      this.touchPv(P.id);
    }
    answer(pid, tok, a) {
      const P = this.player(pid);
      if (!P || !P.cur || (!P.rune && !P.learn)) return;
      if (P.cur.tok !== tok || P.cur.state !== 'open') { P.dupes++; return; }
      if (this.s.clock.pausedAt) return this.notify(pid, 'The game is paused.', 'warn');
      const q = Q().Banks.byId(this.bank(), P.cur.qid), kind = Q().kindOf(q), ok = Q().mark(q, P.cur.key, a);
      const ts = P.stats[q.topic] = P.stats[q.topic] || { r: 0, w: 0 }, qs = this.s.qstats[q.id], PB = B().points;
      if (ok) {
        const coins = r2(B().coins.reward[kind] * (P.mult || 1));
        let pts = P.state === 'out' || P.state === 'down' ? PB.outAnswer : this.s.phase === 'haven' ? PB.havenAnswer : PB.answer;
        P.streak++; if (P.streak % 3 === 0) pts += PB.streak3;
        if (P.state !== 'out') P.coins = r2(P.coins + coins);
        P.rp += pts; P.right++; ts.r++; qs.r++; if (P.roundStats) P.roundStats.ans++;
        Q().Picker.right(P.qs, q);
        P.cur.state = 'done'; P.cur.fb = { ok: true, coins: P.state === 'out' ? 0 : coins, pts, kind };
        this.touchP(pid);
      } else {
        P.wrong++; ts.w++; qs.w++; P.streak = 0;
        Q().Picker.wrong(P.qs, q);
        P.cur.state = 'wrong'; P.cur.fb = { ok: false, ex: q.ex, fix: q.fix, reveal: Q().reveal(q, P.cur.key) };
      }
      if (P.rune) {   // each stone gives 3 questions (right or wrong), then rests for everybody
        P.rune.n++;
        if (P.rune.n >= B().runes.perVisit) { this.s.runeSleep[P.rune.id] = this.now() + B().runes.sleepSec * 1000; P.cur.fb.last = 1; this.touchG(); }
      }
      this.touchPv(pid);
    }
    correction(pid, tok, a) {
      const P = this.player(pid);
      if (!P || !P.cur || P.cur.tok !== tok || P.cur.state !== 'wrong') return;
      const q = Q().Banks.byId(this.bank(), P.cur.qid);
      if (!Q().mark(q, P.cur.key, a)) return this.notify(pid, 'Not yet: copy the correct answer shown.', 'warn');
      P.cur.state = 'corrected'; P.corrections++;
      this.touchPv(pid);
    }
    nextQuestion(pid) {
      const P = this.player(pid);
      if (!P || (!P.rune && !P.learn)) return;
      if (P.cur && (P.cur.state === 'open' || P.cur.state === 'wrong')) return;
      if (P.rune && P.rune.n >= B().runes.perVisit) { this.stopAnswering(P); return this.notify(pid, 'This stone is resting now. Find another Rune Stone!', 'info'); }
      this.serve(P);
    }

    // ===================== combat: the Spark Staff =====================
    shoot(pid, ax, az) {
      const P = this.player(pid), W = B().weapons.sparkStaff, now = this.now();
      if (!P || P.state !== 'ground' || !P.pos || this.s.phase !== 'battle' || this.s.clock.pausedAt || !isFinite(ax) || !isFinite(az)) return;
      if (now - (P.lastShot || 0) < W.interval * 1000 * 0.9) return;
      P.lastShot = now;
      if (P.shieldUntil > now) P.shieldUntil = 0;   // attacking ends the respawn shield
      const px = P.pos[0], pz = P.pos[2], dir = Math.atan2(az - pz, ax - px);
      let best = null, bd = 1e9;
      for (const T of Object.values(this.s.players)) {
        if (T === P || T.squad === P.squad || T.state !== 'ground' && T.state !== 'glide' || !T.pos || !T.online && !T.bot) continue;
        const d = Math.hypot(T.pos[0] - px, T.pos[2] - pz);
        if (d > W.range) continue;
        let da = Math.atan2(T.pos[2] - pz, T.pos[0] - px) - dir; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
        if (Math.abs(da) > W.aimCone && d > 2) continue;
        const score = d + Math.abs(da) * 10;
        if (score < bd) { bd = score; best = T; }
      }
      const sq = this.squad(P.squad), tag = sq ? sq.color.slice(1) : '';
      if (!best) { const L = Math.min(W.range, Math.hypot(ax - px, az - pz) || W.range); this.addFx('b', px, pz, px + Math.cos(dir) * L, pz + Math.sin(dir) * L, tag); return; }
      this.addFx('b', px, pz, best.pos[0], best.pos[2], tag);
      this.damage(best, W.damage, P);
    }
    /** Damage a player (src = the attacking player, or null for the storm). */
    damage(T, amount, src) {
      const now = this.now();
      if (!this.alive(T) || T.state === 'fly') return 0;
      if (src && T.shieldUntil > now) return 0;
      T.hp -= amount; if (src) { T.dmgBy[src.id] = now; if (src.roundStats) src.roundStats.dmg += amount; }
      this.touchP(T.id);
      if (T.hp <= 0) this.knockOut(T, src);
      return amount;
    }
    knockOut(T, src) {
      const now = this.now(), PB = B().points, t = this.t();
      T.hp = 0; T.deaths++; this.stopAnswering(T);
      if (T.pos) this.addFx('d', T.pos[0], T.pos[2]);
      // the knock-out goes to the attacker (or, after a storm knock-out, to the last enemy who hit them in the last 10 s)
      let killer = src;
      if (!killer) { let last = 0; for (const id in T.dmgBy) if (T.dmgBy[id] > last && now - T.dmgBy[id] < PB.assistSec * 1000) { last = T.dmgBy[id]; killer = this.player(id); } }
      if (killer && killer.squad !== T.squad) { killer.rp += PB.knockout; killer.roundStats.ko++; this.notify(killer.id, '💥 Knock-out! +' + PB.knockout, 'good'); this.touchP(killer.id); }
      for (const id in T.dmgBy) {
        const A = this.player(id);
        if (A && A !== killer && A.squad !== T.squad && now - T.dmgBy[id] < PB.assistSec * 1000) { A.rp += PB.assist; A.roundStats.as++; this.touchP(A.id); }
      }
      this.s.feed.push({ k: killer ? killer.name : '', ks: killer ? killer.squad : '', v: T.name, vs: T.squad, storm: src ? 0 : 1, at: now }); if (this.s.feed.length > 8) this.s.feed.shift();
      if (t < B().round.oneLifeFromSec) {
        T.state = 'down'; T.downUntil = now + (B().player.respawnBase + B().player.respawnStep * (T.deaths - 1)) * 1000;
        this.notify(T.id, '💫 Knocked out! Back in ' + Math.round((T.downUntil - now) / 1000) + ' s. Every knock-out gives the enemy points: be careful!', 'warn');
      } else {
        T.state = 'out';
        this.notify(T.id, '👻 You are out for this round. Answer questions in 📖 Learn to keep earning points!', 'warn');
        const q = this.squad(T.squad);
        if (q && !q.members.some(id => this.alive(this.player(id)) || (this.player(id) || {}).state === 'down')) q.outAt = now;
      }
      this.touchP(T.id); this.touchG(); this.dirty.pos = true;
    }

    // ===================== chat & moderation (from Arcane Realms) =====================
    chat(pid, kind, payload) {
      const P = this.player(pid), C = B().chat, now = this.now();
      if (!P || !P.squad) return;
      if (P.muted) return this.notify(pid, 'Your teacher has paused your chat.', 'warn');
      P.chatTimes = P.chatTimes.filter(t => now - t < C.burstWindowSec * 1000);
      if (P.chatTimes.length >= C.burst) return this.notify(pid, 'Slow down: wait a few seconds before sending again.', 'warn');
      let entry = null;
      if (kind === 'msg') {
        const x = U.cleanText(payload.x, C.maxLength); if (!x) return;
        if (U.isUnkind(x)) { this.flag(pid, 'chat', x); return this.notify(pid, 'Please use kind words. (Your teacher can see squad chat.)', 'warn'); }
        if (x.toLowerCase() === P.lastText && now - P.lastTextAt < 10000) return this.notify(pid, 'You just sent that.', 'warn');
        P.lastText = x.toLowerCase(); P.lastTextAt = now; entry = { k: 'msg', x };
      } else if (kind === 'quick') { const i = Number(payload.i); if (!(i >= 0 && i < C.quick.length)) return; entry = { k: 'quick', x: C.quick[i] }; }
      else if (kind === 'ping') { if (now - P.lastPingAt < 2000 || !isFinite(payload.x) || !isFinite(payload.z)) return; P.lastPingAt = now; entry = { k: 'ping', x: 'Look here!', p: [r2(payload.x), r2(payload.z)] }; }
      if (!entry) return;
      P.chatTimes.push(now);
      entry.f = pid; entry.n = P.name; entry.g = P.gid; entry.at = now; entry.tm = P.squad + 'r' + this.s.round; entry.id = (this.s.seq++).toString(36);
      this.s.chatLog.push(entry); if (this.s.chatLog.length > 300) this.s.chatLog.shift();
      this.dirty.chat.push(entry);
    }
    report(pid, target, reason) {
      const P = this.player(pid), T = this.player(target); if (!P || !T) return;
      this.s.reports.push({ from: pid, fromName: P.name, target, targetName: T.name, reason: U.cleanText(reason, 80) || 'no reason given', at: this.now() });
      this.notify(pid, 'Report sent to your teacher. Thank you.', 'good'); this.touchG();
    }
    flag(pid, what, text) { const P = this.player(pid); this.s.flagged.push({ pid, name: P ? P.name : '?', what, text, at: this.now() }); this.touchG(); }
    mute(pid, on) { const P = this.player(pid); if (!P) return; P.muted = !!on; this.notify(pid, on ? 'Your teacher has paused your chat.' : 'Your chat is back on.', on ? 'warn' : 'good'); this.touchP(pid); }
    rename(pid, name) { const P = this.player(pid), n = U.cleanName(name); if (!P || !n) return { ok: false }; P.name = n; this.touchP(pid); this.touchG(); return { ok: true }; }
    kick(pid) {
      const P = this.player(pid); if (!P) return;
      for (const q of this.s.squads) q.members = q.members.filter(m => m !== pid);

    }
    announce(text) { this.s.ann = U.cleanText(text, 120); this.touchG(); }
    setLook(pid, look) { const P = this.player(pid); if (!P) return; P.look = cleanLook(look); this.touchP(pid); }
    requestMotion(pid, kind) {
      const P = this.player(pid);
      if (!P || !this.running()) return false;
      if (kind === 'jump' && P.state === 'fly') { this.dropOff(P); return true; }
      if (P.state !== 'ground' && P.state !== 'haven') return false;
      const m = P.motion || (P.motion = AR.Motion.fresh()), t = this.t();
      const ok = kind === 'sprint' ? AR.Motion.sprint(m, t) : AR.Motion.jump(m, t);
      if (ok) this.touchP(pid);
      return ok;
    }

    // ===================== requests =====================
    handle(pid, m) {
      if (!m || typeof m !== 'object') return;
      switch (m.t) {
        case 'jump': return this.requestMotion(pid, 'jump');
        case 'sprint': return this.requestMotion(pid, 'sprint');
        case 'shoot': return this.shoot(pid, Number(m.x), Number(m.z));
        case 'rune': return this.useRune(pid, String(m.id || ''));
        case 'learn': return this.learnPanel(pid);
        case 'leave': return this.stopAnswering(this.player(pid));
        case 'ans': return this.answer(pid, String(m.tok || ''), m.a);
        case 'fixdone': return this.correction(pid, String(m.tok || ''), m.a);
        case 'next': return this.nextQuestion(pid);
        case 'chat': return this.chat(pid, 'msg', m);
        case 'quick': return this.chat(pid, 'quick', m);
        case 'ping': return this.chat(pid, 'ping', m);
        case 'report': return this.report(pid, String(m.target || ''), m.reason);
        case 'look': return this.setLook(pid, m.look);
        default: return;
      }
    }

    // ===================== the clock =====================
    tick(now) {
      now = now == null ? this.now() : now;
      const dt = Math.min(0.25, Math.max(0, (now - (this._lastTick || now)) / 1000)); this._lastTick = now;
      if (!this.running()) return;
      const t = this.t(now), R = B().round;
      if (this.s.phase === 'haven' && t >= 0) {   // the griffin takes off: everybody on board
        this.s.phase = 'battle';
        for (const P of Object.values(this.s.players)) if (P.squad && P.state === 'haven') { this.stopAnswering(P); P.state = 'fly'; this.touchP(P.id); }
        this.touchG();
      }
      if (this.s.phase !== 'battle') { if (this.bots) this.bots.step(dt); return; }
      // griffin: riders move with it; the last ones are dropped at the end of the flight
      const gp = this.griffinAt(t);
      for (const P of Object.values(this.s.players)) {
        if (P.state === 'fly') { if (t >= R.flightSec || this.griffinLeaving(t)) this.dropOff(P); else { P.pos = [gp[0], gp[1], gp[2], 0]; this.dirty.pos = true; } }
        else if (P.state === 'glide' && now - P.glideAt > ((P.glideY0 || 46) / B().player.glide.fall + 4) * 1000) { P.state = 'ground'; if (P.pos) this.teleport(P.id, P.pos[0], P.pos[2]); }   // landed (safety net)
        else if (P.state === 'down' && now >= P.downUntil) this.respawn(P);
      }
      // the storm: damage outside the circle; points for everyone still standing at each step
      const st = AR.Storm.at(this.storm(), t);
      if (st.stage > this.s.stormStep) {
        this.s.stormStep = st.stage;
        for (const P of Object.values(this.s.players)) if (this.alive(P) && P.state !== 'fly') { P.rp += B().points.stormStep; this.touchP(P.id); }
        this.touchG();
      }
      for (const P of Object.values(this.s.players)) {
        if ((P.state === 'ground' || P.state === 'glide') && P.pos && t >= R.flightSec && AR.Storm.outside(st, P.pos[0], P.pos[2])) {
          P.stormAcc = (P.stormAcc || 0) + st.dps * dt;
          if (P.stormAcc >= 1) { const d = Math.floor(P.stormAcc); P.stormAcc -= d; this.damage(P, d, null); }
        }
      }
      if (this.bots) this.bots.step(dt);
      // round end: time is up, or (from 5:00) only one squad is left
      const squadsLeft = this.s.squads.filter(q => q.members.some(id => { const P = this.player(id); return P && (this.alive(P) || P.state === 'down'); })).length;
      if (t >= R.durationSec || (t >= R.oneLifeFromSec && squadsLeft <= 1 && this.s.squads.length > 1) || squadsLeft === 0) this.endRound(t >= R.durationSec ? 'time' : 'last squad');
    }

    // ===================== views (what the host publishes) =====================
    gView() {
      const s = this.s, now = this.now();
      const sleep = {}; for (const id in s.runeSleep) if (s.runeSleep[id] > now) sleep[id] = s.runeSleep[id];
      return {
        ph: s.phase, round: s.round, rounds: s.rounds, bank: s.bankId, practice: this.practice, bots: this.bots ? 1 : 0, iseed: s.islandSeed, seed: s.seed,
        clock: { s: s.clock.startedAt, p: s.clock.pausedAt, pz: s.clock.pausedTotal, e: s.clock.endedAt || 0 },
        squads: s.squads.map(q => ({ id: q.id, name: q.name, color: q.color, sym: q.sym, members: q.members.slice(), mult: r2(q.mult || 1), out: q.outAt ? 1 : 0 })),
        sq: s.squadCount, ann: s.ann, res: s.results, feed: s.feed.slice(-6), ru: sleep,
        n: Object.values(s.players).filter(p => p.online).length,
      };
    }
    pView(pid) {
      const P = this.player(pid); if (!P) return null;
      return { n: P.name, gid: P.gid, sq: P.squad || '', on: P.online ? 1 : 0, look: P.look, st: P.state, hp: Math.ceil(Math.max(0, P.hp)), coins: r2(P.coins), pts: r2(P.pts), rp: r2(P.rp),
        ko: P.roundStats ? P.roundStats.ko : 0, sh: P.shieldUntil || 0, du: P.downUntil || 0, sp: P.sp || 0, mo: P.motion || AR.Motion.fresh(), mu: P.muted ? 1 : 0, bot: P.bot ? 1 : 0, ans: P.rune || P.learn ? 1 : 0 };
    }
    pvView(pid) {
      const P = this.player(pid); if (!P) return null;
      const c = P.cur;
      return { q: c ? { tok: c.tok, st: c.state, pub: c.pub, fb: c.fb || 0 } : 0, in: P.rune || P.learn ? 1 : 0, mode: P.rune ? 'rune' : P.learn ? 'learn' : '', rn: P.rune ? P.rune.n : 0,
        right: P.right, wrong: P.wrong, note: P.note || 0 };
    }
    /** Every visible player's validated position in one short string: "pid,x,z,yaw,y;…" */
    posString() {
      const out = [];
      for (const P of Object.values(this.s.players)) if (P.pos && P.state !== 'out' && P.state !== 'down' && P.state !== 'lobby' && (P.online || P.bot)) out.push(P.id + ',' + r2(P.pos[0]) + ',' + r2(P.pos[2]) + ',' + r2(P.pos[3]) + ',' + r2(P.pos[1]));
      return out.join(';');
    }
    learningReport() {
      const bank = this.bank(), topics = {}, students = [];
      for (const k in bank.topics) topics[k] = { name: bank.topics[k], r: 0, w: 0 };
      for (const P of Object.values(this.s.players)) {
        if (P.bot) continue;
        const row = { id: P.id, name: P.name, gid: P.gid, right: P.right, wrong: P.wrong, corrections: P.corrections, pts: P.pts, topics: {} };
        for (const k in P.stats) { row.topics[k] = Object.assign({}, P.stats[k]); if (topics[k]) { topics[k].r += P.stats[k].r; topics[k].w += P.stats[k].w; } }

      }

    }
    // ===================== save / restore (host refresh) =====================
    save() { return JSON.stringify({ s: this.s, practice: this.practice, savedAt: this.now() }); }
    static load(json, opts) {
      const d = JSON.parse(json), S = new Server(Object.assign({}, opts, { practice: d.practice }));
      S.s = d.s;

    }
  }

  AR.Server = Server;
  AR.cleanLook = cleanLook;

</script>
<script>/* src/server/arsenal.js */
/* Spellstorm Royale · src/server/arsenal.js — Milestone 2 on the authoritative server (loaded after server.js):
   8 weapons with rarities, line of sight (rocks, buildings, Rune Walls, fog), shields, items (potion, mana shield, blink,
   fog, griffin feather), classes + Q abilities (Blink, Hawk Eye, Rune Wall, Grove), chests with loot, the shop at Rune
   Stones / Sky Haven, and blessings sent from the sky by knocked-out students.
   New requests: shoot {x, z} · sel {i} · use {i, x, z} · ability {x, z} · cls {c} · chest {id} · buy {k: 'w'|'i', ty, r} · bless {to, kind} */
(function (root) {
  'use strict';
  const AR = root.AR, SP = AR.Server.prototype, B = () => AR.Balance, U = AR.util;
  const r2 = n => Math.round(n * 100) / 100;
  const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };

  // ===================== kit =====================
  SP.maxHp = function (P) { const C = B().classes[P.cls]; return B().player.health + (C && C.health || 0); };
  SP.resetKit = function (P) {
    P.cls = P.cls || 'wizard';
    P.weapons = [{ ty: 'sparkStaff', r: 0 }, null]; P.sel = 0; P.items = [null, null, null]; P.shield = 0;
    P.slowUntil = 0; P.hawkUntil = 0; P.abilityAt = 0; P.hot = null; P.blessN = 0; P.blessReady = 0;
    P.hp = this.maxHp(P);
  };
  const oldReset = SP.resetForRound;
  SP.resetForRound = function (P) { oldReset.call(this, P); this.resetKit(P); };
  const oldStart = SP.startRound;
  SP.startRound = function () {
    const r = oldStart.call(this);
    if (r && r.ok) { this.s.opened = {}; this.s.walls = []; this.s.fogs = []; this.projs = []; this.touchG(); }
    return r;
  };
  const oldRespawn = SP.respawn;
  SP.respawn = function (P) { oldRespawn.call(this, P); P.hp = this.maxHp(P); P.shield = 0; P.slowUntil = 0; P.hot = null; this.touchP(P.id); };

  SP.weaponDmg = function (P, w) {
    const D = B().weapons[w.ty], C = B().classes[P.cls] || {};
    return D.damage * B().rarity[w.r || 0].mult * (D.magic && C.magicDamage ? 1 + C.magicDamage : 1);
  };
  SP.weaponRange = function (P, w) { const D = B().weapons[w.ty], C = B().classes[P.cls] || {}; return D.range * (D.bow && C.bowRange ? 1 + C.bowRange : 1); };

  // ===================== line of sight =====================
  /** Can a shot go from a to b? Blocked by rocks/buildings/stones (not by thin trees near the ends), Rune Walls, and enemy fog. */
  SP.canSee = function (ax, az, bx, bz, shooterSq, targetP) {
    if (!B().los) return true;
    const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz, L = Math.sqrt(L2) || 1;
    for (const c of this.island().colliders) {
      if (c.r < 0.75) continue;   // thin trees do not block
      const t = U.clamp(((c.x - ax) * dx + (c.z - az) * dz) / (L2 || 1), 0, 1), px = ax + dx * t, pz = az + dz * t;
      if (t * L < c.r + 0.6 || (1 - t) * L < c.r + 0.6) continue;   // standing right next to it
      if (Math.hypot(c.x - px, c.z - pz) < c.r * 0.85) return false;
    }

  const SKILL = {
    easy:   { acc: 0.6, qSec: 9, aim: 0.45, react: 1.1, range: 22 },
    normal: { acc: 0.78, qSec: 6.5, aim: 0.25, react: 0.7, range: 26 },
    hard:   { acc: 0.92, qSec: 4.5, aim: 0.1, react: 0.45, range: 30 },
  };

  class Bots {
    constructor(S, opts) { this.S = S; this.skill = SKILL[(opts && opts.skill) || 'normal'] || SKILL.normal; this.brains = {}; this.n = 0; }
    create() {
      const S = this.S, i = this.n++, pid = 'bot' + i.toString(36) + Math.floor(S.rnd() * 1e6).toString(36) + 'xx';
      const look = { robe: Math.floor(S.rnd() * 10), hat: Math.floor(S.rnd() * 4), skin: Math.floor(S.rnd() * 6), hair: Math.floor(S.rnd() * 8), gem: Math.floor(S.rnd() * 6), trim: Math.floor(S.rnd() * 6) };
      const r = S.join(pid, 'Bot ' + NAMES[i % NAMES.length], look);
      if (!r.ok) return null;

      return pid;
    }
    fresh() { return { goal: null, path: [], think: this.S.rnd(), shotAt: 0, qAt: 0, target: null, jumpPlace: null, wander: 0, picked: 0, chest: null }; }
    reset() { for (const id in this.brains) this.brains[id] = this.fresh(); }
    grid() {
      const I = this.S.island();
      if (!this._grid || this._gridSeed !== I.seed) {
        this._grid = new AR.PathGrid({ def: { edge: I.half }, height: () => 0, colliders: I.colliders }); this._gridSeed = I.seed;
        const G = this._grid;
        for (let j = 0; j < G.n; j++) for (let i = 0; i < G.n; i++) { const [x, z] = G.center(i, j); if (!I.onLand(x, z)) G.block[j * G.n + i] = 1; }
      }

    }
    step(dt) {
      const S = this.S, ph = S.s.phase;
      for (const pid in this.brains) {
        const P = S.player(pid), m = this.brains[pid]; if (!P || !P.squad) continue;
        try {
          if (P.state === 'haven') this.haven(P, m, dt);
          else if (P.state === 'fly') this.fly(P, m);
          else if (P.state === 'glide') this.glide(P, m, dt);
          else if (P.state === 'ground' && ph === 'battle') this.ground(P, m, dt);
        } catch (e) { this.errors = (this.errors || 0) + 1; this.lastError = e; }
      }
    }
    haven(P, m, dt) {
      const S = this.S, H = S.island().haven;
      if (!m.picked) { m.picked = 1; const cs = Object.keys(B().classes), i = Object.keys(this.brains).indexOf(P.id); S.chooseClass(P.id, cs[(i + S.s.round) % cs.length]); }   // classes spread evenly
      if (!m.goal || Math.hypot(P.pos[0] - m.goal[0], P.pos[2] - m.goal[1]) < 1) { const a = S.rnd() * 6.28, d = S.rnd() * (H.r - 6); m.goal = [H.x + Math.cos(a) * d, H.z + Math.sin(a) * d]; }

    }
    fly(P, m) {
      const S = this.S, I = S.island();
      if (!m.jumpPlace) { const pl = I.places[Math.floor(S.rnd() * I.places.length)]; m.jumpPlace = [pl.x + (S.rnd() - 0.5) * 20, pl.z + (S.rnd() - 0.5) * 20]; }
      const g = S.griffinAt(S.t());
      if (Math.hypot(g[0] - m.jumpPlace[0], g[2] - m.jumpPlace[1]) < 45 + S.rnd() * 20) { S.requestMotion(P.id, 'jump'); m.goal = m.jumpPlace; }
    }
    glide(P, m, dt) {
      const S = this.S, I = S.island(), G = B().player.glide, goal = m.goal || m.jumpPlace || [0, 0];
      const dx = goal[0] - P.pos[0], dz = goal[1] - P.pos[2], d = Math.hypot(dx, dz), sp = Math.min(d, G.speed * dt);
      const x = P.pos[0] + (d ? dx / d * sp : 0), z = P.pos[2] + (d ? dz / d * sp : 0), g = I.ground(x, z);
      let y = P.pos[1] - G.fall * dt;
      if (y <= g + 0.6) { P.state = 'ground'; y = g; S.touchP(P.id); m.goal = null; }

    }
    ground(P, m, dt) {
      const S = this.S, I = S.island(), t = S.t(), sk = this.skill, now = S.now();
      m.think -= dt;
      if (m.think <= 0) {
        m.think = sk.react * (0.7 + S.rnd() * 0.6);
        const st = AR.Storm.at(S.storm(), t), safe = st.next || st;
        // 1) the storm first: get inside the (next) circle
        if (Math.hypot(P.pos[0] - safe.x, P.pos[2] - safe.z) > safe.r * 0.85 && safe.r > 2) {
          S.stopAnswering(P);
          const a = S.rnd() * 6.28, rr = safe.r * 0.5 * S.rnd();
          this.goTo(P, m, [safe.x + Math.cos(a) * rr, safe.z + Math.sin(a) * rr]); m.target = null;
        } else {
          // 2) fight the nearest enemy in sight
          let foe = null, fd = sk.range;
          for (const T of Object.values(S.s.players)) { if (T.squad === P.squad || (T.state !== 'ground' && T.state !== 'glide') || !T.pos) continue; const d = Math.hypot(T.pos[0] - P.pos[0], T.pos[2] - P.pos[2]); if (d < fd) { fd = d; foe = T; } }
          m.target = foe ? foe.id : null;
          this.gear(P, foe, fd);
          if (foe) { S.stopAnswering(P); const want = this.bestRange(P) * 0.6; if (fd > want) this.goTo(P, m, [foe.pos[0], foe.pos[2]]); else m.path = []; }
          // 2b) a chest close by
          else if (!P.rune && (m.chest = this.nearChest(P, st))) {
            if (Math.hypot(m.chest.x - P.pos[0], m.chest.z - P.pos[2]) <= B().chests.useRange - 0.5) { S.openChest(P.id, m.chest.id); m.chest = null; m.path = []; }
            else this.goTo(P, m, [m.chest.x + 1, m.chest.z]);
          }
          // 3) answer at a Rune Stone, 4) or wander to a place inside the circle
          else if (!P.rune) {
            const R = this.nearestRune(P, st);
            if (R && Math.hypot(R.x - P.pos[0], R.z - P.pos[2]) <= B().runes.useRange - 0.6) { this.shop(P); S.useRune(P.id, R.id); m.qAt = now + sk.qSec * 1000; m.path = []; }
            else if (R) this.goTo(P, m, [R.x + 1.2, R.z]);
            else if (!m.path.length) { const pl = I.places[Math.floor(S.rnd() * I.places.length)]; if (Math.hypot(pl.x - st.x, pl.z - st.z) < st.r) this.goTo(P, m, [pl.x, pl.z]); }
          }
        }
      }
      // answering: the real question flow, one answer every few seconds
      if (P.rune && P.cur && now >= m.qAt) {
        m.qAt = now + sk.qSec * (0.7 + S.rnd() * 0.6) * 1000;
        const q = AR.Questions.Banks.byId(S.bank(), P.cur.qid), right = AR.Questions.reveal(q, P.cur.key);
        if (P.cur.state === 'open') S.answer(P.id, P.cur.tok, S.rnd() < sk.acc ? right : this.wrong(right));
        else if (P.cur.state === 'wrong') S.correction(P.id, P.cur.tok, P.cur.fb.reveal);
        else S.nextQuestion(P.id);
      }
      // shooting
      if (m.target) {
        const T = S.player(m.target);
        const W = P.weapons && P.weapons[P.sel], WD = B().weapons[(W || {}).ty || 'sparkStaff'];
        if (T && T.pos && now - m.shotAt > WD.interval * 1000 + 80) {
          m.shotAt = now;
          const a = Math.atan2(T.pos[2] - P.pos[2], T.pos[0] - P.pos[0]) + (S.rnd() - 0.5) * 2 * sk.aim, d = Math.hypot(T.pos[0] - P.pos[0], T.pos[2] - P.pos[2]);
          P.pos[3] = Math.atan2(Math.cos(a), Math.sin(a));
          S.shoot(P.id, P.pos[0] + Math.cos(a) * d, P.pos[2] + Math.sin(a) * d);
        }
      }
      if (!P.rune) this.walk(P, m, dt);
    }
    /** Use the right weapon for the distance, drink potions, use shields and the class ability. */
    gear(P, foe, d) {
      const S = this.S, now = S.now();
      if (P.weapons) {
        let bi = P.sel, bs = -1;
        P.weapons.forEach((w, i) => { if (!w) return; const D = B().weapons[w.ty], rg = S.weaponRange(P, w), score = (foe ? (rg >= d ? 1 : 0.2) : 0.5) * S.weaponDmg(P, w) / D.interval; if (score > bs) { bs = score; bi = i; } });
        if (bi !== P.sel) S.selectWeapon(P.id, bi);
      }
      if (P.items) P.items.forEach((it, i) => {
        if (!it) return;
        if (it.ty === 'potion' && P.hp < S.maxHp(P) * 0.5 && !P.hot) S.useItem(P.id, i);
        else if (it.ty === 'shield' && foe && P.shield < 40) S.useItem(P.id, i);
        else if (it.ty === 'fog' && foe && P.hp < 35) S.useItem(P.id, i);
      });
      if (foe && now >= (P.abilityAt || 0) && S.rnd() < 0.3) S.ability(P.id, foe.pos[0], foe.pos[2]);
      else if (!foe && P.cls === 'healer' && P.hp < S.maxHp(P) * 0.6 && now >= (P.abilityAt || 0)) S.ability(P.id, P.pos[0], P.pos[2]);
    }
    bestRange(P) { let r = 10; for (const w of P.weapons || []) if (w) r = Math.max(r, this.S.weaponRange(P, w)); return Math.min(r, 30); }
    /** At a Rune Stone: buy a better weapon or items with the coins. */
    shop(P) {
      const S = this.S, sh = B().shop.weapons;
      if (!P.weapons) return;
      if (!P.weapons[1] && P.coins >= 80) { const list = Object.keys(sh).filter(k => sh[k][0] && sh[k][0] <= P.coins); if (list.length) S.buy(P.id, 'w', list[Math.floor(S.rnd() * list.length)], 0); }
      if (P.coins >= B().items.potion.price && !P.items.some(i => i && i.ty === 'potion')) S.buy(P.id, 'i', 'potion');
      if (P.coins >= B().items.shield.price && S.rnd() < 0.5) S.buy(P.id, 'i', 'shield');
    }
    nearChest(P, st) {
      const S = this.S; let best = null, bd = 45;
      for (const C of S.island().chests) { if ((S.s.opened || {})[C.id] || Math.hypot(C.x - st.x, C.z - st.z) > st.r * 0.9) continue; const d = Math.hypot(C.x - P.pos[0], C.z - P.pos[2]); if (d < bd) { bd = d; best = C; } }
      return best;
    }
    wrong(right) { return typeof right === 'number' ? (right + 1) % 4 : Array.isArray(right) ? right.slice().reverse() : 'no idea'; }
    nearestRune(P, st) {
      const S = this.S, now = S.now(); let best = null, bd = 70;
      for (const R of S.island().runes) {
        if ((S.s.runeSleep[R.id] || 0) > now || Math.hypot(R.x - st.x, R.z - st.z) > st.r * 0.9) continue;
        if (Object.values(S.s.players).some(Q => Q !== P && Q.rune && Q.rune.id === R.id)) continue;
        const d = Math.hypot(R.x - P.pos[0], R.z - P.pos[2]); if (d < bd) { bd = d; best = R; }
      }
      return best;
    }
    goTo(P, m, goal) {
      if (m.goal && Math.hypot(m.goal[0] - goal[0], m.goal[1] - goal[1]) < 3 && m.path.length) return;
      m.goal = goal;
      const p = this.grid().find(P.pos[0], P.pos[2], goal[0], goal[1], 6000);
      m.path = p ? p.slice() : [goal];
    }
    walk(P, m, dt) {
      const S = this.S, I = S.island();
      let left = B().player.speed * 0.9 * dt, x = P.pos[0], z = P.pos[2], yaw = P.pos[3];
      while (left > 0 && m.path.length) {

        if (d < 1e-3) { m.path.shift(); continue; }
        const k = Math.min(1, left / d); x += dx * k; z += dz * k; left -= d * k; if (!m.target) yaw = Math.atan2(dx, dz);

      if (x !== P.pos[0] || z !== P.pos[2]) { P.pos = [x, I.ground(x, z), z, yaw]; P.posAt = S.now(); S.dirty.pos = true; }

      const S = this.S, dx = goal[0] - P.pos[0], dz = goal[1] - P.pos[2], d = Math.hypot(dx, dz), sp = Math.min(d, B().player.speed * 0.6 * dt);
      if (d < 1e-3) return;
      P.pos = [P.pos[0] + dx / d * sp, y, P.pos[2] + dz / d * sp, Math.atan2(dx, dz)]; P.posAt = S.now(); S.dirty.pos = true;
    }
  }

  /** Practice with bots: the student plus bots, mixed into `squads` squads of about `size`. */
  function setupPractice(S, humanPid, opts) {
    const k = AR.util.clamp(Math.round(Number(opts.squads) || 4), 2, 8), per = AR.util.clamp(Math.round(Number(opts.size) || 3), 1, 5);
    const bots = S.bots = new Bots(S, { skill: opts.skill });

    S.setRounds(opts.rounds || B().match.rounds);

  }

  AR.Bots.setupPractice = setupPractice;

<script>/* src/net/transport.js */
/* Arcane Realms · src/net/transport.js — the room "wire". Three interchangeable transports with the same small API
   (ref(path).set/update/remove/push/once/on/off/onDisconnect, offset, onConnected, close):
     firebase  the teacher's Firebase Realtime Database (vendor/firebase-config.js) — real multiplayer over the internet
     fake      an in-memory database shared by every frame of one browser tab (automated multi-client tests)
     local     a private in-memory database for Practice mode (clearly NOT multiplayer)
   Adapted from the Game Kit's mechanics/online/online.js (FakeNet). */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  function FakeNet(latency) { this.root = {}; this.listeners = []; this.disc = {}; this.latency = latency == null ? 15 : latency; this.seq = 0; this.writes = 0; this.bytes = 0; }
  const split = p => String(p).split('/').filter(Boolean);
  FakeNet.prototype = {
    get(path) { let o = this.root; for (const k of split(path)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; },
    write(path, val) {
      const ks = split(path), last = ks.pop();
      let o = this.root;
      for (const k of ks) { if (o[k] == null || typeof o[k] !== 'object') { if (val === null) return this.fire(); o[k] = {}; } o = o[k]; }
      if (val === null || val === undefined) delete o[last];
      else { const j = JSON.stringify(val); this.bytes += j.length; o[last] = JSON.parse(j); }
      this.writes++;
      this.prune(this.root);
      this.fire();
    },
    prune(o) { for (const k in o) if (o[k] && typeof o[k] === 'object') { this.prune(o[k]); if (!Object.keys(o[k]).length) delete o[k]; } },
    fire() {
      if (this.pending) return;
      this.pending = true;

      setTimeout(() => {
        net.pending = false;

          if (L.dead) continue;

          if (L.event === 'value') { if (json !== L.last) { L.last = json; L.fn(new Snap(L.key, now)); } continue; }
          const old = L.kids || {}, cur = now && typeof now === 'object' ? now : {}, next = {};
          for (const k in cur) {
            next[k] = JSON.stringify(cur[k]);
            if (!(k in old)) { if (L.event === 'child_added') L.fn(new Snap(k, cur[k])); }
            else if (old[k] !== next[k] && L.event === 'child_changed') L.fn(new Snap(k, cur[k]));
          }
          if (L.event === 'child_removed') for (const k in old) if (!(k in cur)) L.fn(new Snap(k, JSON.parse(old[k])));

    disconnect(client) { const list = this.disc[client] || []; delete this.disc[client]; for (const w of list) this.write(w.path, w.val); },
  };

      set: v => { net.write(path, v); return Promise.resolve(); },
      update: obj => { for (const k in obj) net.write(path + '/' + k, obj[k]); return Promise.resolve(); },
      remove: () => { net.write(path, null); return Promise.resolve(); },

  let practiceNet = null;

    fake: {

    local: { connect() { practiceNet = practiceNet || new FakeNet(5); return Promise.resolve(memTransport(practiceNet, 'local')); } },
    firebase: {

        const db = app.database(), T = { name: 'firebase', db, offset: 0, ref: p => db.ref(p), close: () => { try { db.goOffline(); } catch (e) { /* ignore */ } } };
        db.goOnline();

        T.onConnected = fn => db.ref('.info/connected').on('value', s => fn(!!s.val()));
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('No connection to the class server. Check the internet, or try Practice.')), timeoutMs || 20000);
          db.ref('.info/connected').on('value', s => { if (s.val()) { clearTimeout(t); resolve(T); } });
        });
      },
    },
  };

  AR.Net = {
    FakeNet,
    /** ?online=fake picks the in-memory test transport; otherwise Firebase. Practice always uses 'local'. */
    pick() { const q = (root.location && (root.location.search.match(/[?&]online=(\w+)/) || [])[1]) || ''; return TRANSPORTS[q] ? q : 'firebase'; },
    /** appName (Firebase only): a separate connection per name — tests open several "PCs" in one page. */
    connect(name, timeoutMs, appName) { const tr = TRANSPORTS[name]; return tr ? tr.connect(timeoutMs, appName) : Promise.reject(new Error('Unknown transport ' + name)); },
    resetPractice() { practiceNet = null; },

  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/net/host.js */
/* Spellstorm Royale · src/net/host.js (from Arcane Realms) — connects the authoritative AR.Server (running in the teacher's browser) to a room.
   Room data (rooms/<CODE>/…):
     meta              {host, game: 'arcane-realms', v, at}                       host
     g                 round, teams, clock, results                                host
     ps/<pid>          public player record (name, game ID, team, gold, …)        host
     pv/<pid>          private record: current question (no answer), feedback      host
     pos               "pid,x,z,yaw;…" validated positions, ~4 times a second      host
     chat/<team>/<id>  moderated team chat                                         host
     players/<pid>     {name, look, on, h, p}: presence + reported position         each student (their own)

      this.saveAt = 0; this.listeners = []; this.stats = { in: 0, out: 0 }; this.stopped = false;

<script>/* src/net/client.js */
/* Spellstorm Royale · src/net/client.js (from Arcane Realms) — a student's connection to a room.
   The student's screen READS what the host publishes (g, ps, pos, pv/<me>, chat/<my team>) and WRITES only its own
   presence record (players/<me>: name, look, online, reported position) and requests (in/…).
   The player id is kept per room in localStorage, so a refresh or a crash rejoins the SAME player (same team, gold). */
(function (root) {
  'use strict';
  const AR = root.AR = root.AR || {};

  class ClientLink {
    constructor(T, room, pid) {
      this.T = T; this.room = room; this.base = 'rooms/' + room; this.id = pid;
      this.g = null; this.ps = {}; this.pv = null; this.pos = {}; this.chat = []; this.chatTeam = null;
      this.handlers = {}; this.sentAt = 0; this.lastSent = null; this.connected = true; this.kicked = false;
    }
    ref(p) { return this.T.ref(this.base + '/' + p); }
    on(ev, fn) { (this.handlers[ev] = this.handlers[ev] || []).push(fn); return this; }
    emit(ev, d) { for (const fn of this.handlers[ev] || []) { try { fn(d); } catch (e) { console.error('[client]', ev, e); } } }

    start(name, look) {
      const me = this.ref('players/' + this.id);
      this.name = String(name || '').slice(0, 16);
      me.update({ name: this.name, look: JSON.stringify(look || {}), on: 1, h: this.serverNow() });

      });

      this.ref('pos').on('value', s => { this.parsePos(s.val()); this.emit('pos'); });

    watchChat() {

    send(t, data) { if (this.stopped) return; this.ref('in').push(Object.assign({ f: this.id, t, at: this.serverNow() }, data || {})); }

      if (this.stopped) return;

    }
  }

  function storedId(room, name) {
    const key = 'sr.pid.' + room + '.' + String(name || '').toLowerCase();
    let id = null;
    try { id = sessionStorage.getItem(key) || localStorage.getItem(key); } catch (e) { /* storage off */ }

    }

  }

    /** Join a room by code. opts: {room, name, look, transport, id (tests)} → Promise<ClientLink> */
    join(opts) {
      const room = String(opts.room || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 16);
      if (!/^[A-Z0-9-]{3,16}$/.test(room)) return Promise.reject(new Error('Type the room code your teacher shows (like ELF-42).'));
      return AR.Net.connect(opts.transport || AR.Net.pick(), null, opts.appName).then(T => T.ref('rooms/' + room + '/meta').once('value').then(m => {
        const meta = m.val();
        if (!meta) throw new Error('There is no room "' + room + '". Check the code with your teacher.');
        if (meta.game !== AR.Host.GAME) throw new Error('Room "' + room + '" belongs to a different game.');
        const pid = opts.id || (T.name === 'fake' ? AR.util.newId() : storedId(room, opts.name));
        try { localStorage.setItem('sr.last.room', room); } catch (e) { /* ignore */ }
        return new ClientLink(T, room, pid).start(opts.name, opts.look);
      }));
    },
    lastRoom() { try { return localStorage.getItem('sr.last.room') || ''; } catch (e) { return ''; } },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/client/models.js */
/* Arcane Realms · src/client/models.js — original low-poly fantasy models, built from code with GK.Geo (no files).

(function (root) {

    }
    safety() {
      const s = this.S.s, S = this.S;
      const m = modal('💬 Chat & safety', h('div.guidebox',
        h('h3', '🚩 Blocked words and reports'), s.flagged.length || s.reports.length ? h('ul', s.flagged.map(f => h('li', f.name + ': "' + f.text + '" (blocked)')), s.reports.map(r => h('li', r.fromName + ' reported ' + r.targetName + ': ' + r.reason))) : h('p.small', 'Nothing yet.'),
        h('h3', '👥 Students'), h('div', Object.values(s.players).filter(P => !P.bot).map(P => h('div.tprow', h('span', P.name + ' ' + P.gid), h('button.btn.small', { onclick: () => { S.mute(P.id, !P.muted); this.host.flush(); m.close(); this.safety(); } }, P.muted ? '🔈 Unmute' : '🔇 Mute')))),
        h('h3', '💬 Squad chat (latest)'), h('div.chatlog', s.chatLog.slice(-60).map(e => h('div.small', h('b', e.n), ' (' + e.tm + '): ' + (e.k === 'ping' ? '📍 ping' : e.x))))), [h('button.btn', { onclick: () => m.close() }, 'Close')]);
      m.el.querySelector('.modal').classList.add('wide');
    }
    learning() {
      const r = this.S.learningReport(), pct = (a, b) => a + b ? Math.round(a / (a + b) * 100) + '%' : '—';
      const csv = ['Name,Game ID,Right,Wrong,Corrections,Points'].concat(r.students.map(s => [s.name, s.gid, s.right, s.wrong, s.corrections, Math.round(s.pts)].join(','))).join('\n');
      const m = modal('📈 Learning', h('div.guidebox', h('h3', 'Topics (whole class)'), h('ul', Object.values(r.topics).map(t => h('li', t.name + ': ' + pct(t.r, t.w) + ' right (' + (t.r + t.w) + ' answers)'))),
        h('h3', 'Students'), h('ul', r.students.map(s => h('li', s.name + ': ✔' + s.right + ' ✘' + s.wrong)))), [h('button.btn', { onclick: () => AR.ui.download('spellstorm-learning.csv', csv) }, '⬇ CSV'), h('button.btn', { onclick: () => m.close() }, 'Close')]);
    }
    // ---------------- live view ----------------
    addFx(str) { const now = performance.now(), bar = str.indexOf('|'); for (const e of str.slice(bar + 1).split(';')) { const a = e.split(','); this.fx.push({ k: a[0], a: [+a[1], +a[2]], b: [+a[3], +a[4]], col: a[5] ? '#' + a[5] : '#fff', t0: now, dur: a[0] === 'b' ? 380 : 700 }); } }
    key(e) { if (e.code === 'Escape') return; }
    wheel(d) { const o = this.sc.cam.over; o.h = AR.util.clamp(o.h * (d > 0 ? 1.1 : 0.9), 30, 300); }
    drag(dx, dy) { const o = this.sc.cam.over; o.x -= dx * o.h / 700; o.z -= dy * o.h / 700; }
    update(dt) {
      const S = this.S, s = S.s, sc = this.sc, I = this.app.island, now = performance.now(), MR = AR.ModelsRoyale, K = this.app.keys, o = sc.cam.over;
      const sp = o.h * 0.8 * dt; if (K.KeyW || K.ArrowUp) o.z -= sp; if (K.KeyS || K.ArrowDown) o.z += sp; if (K.KeyA || K.ArrowLeft) o.x -= sp; if (K.KeyD || K.ArrowRight) o.x += sp;
      if (this.watch && (s.phase === 'battle' || s.phase === 'haven')) {   // follow the watched squad
        const q = S.squad(this.watch), P2 = q && q.members.map(id => S.player(id)).find(M => M && M.pos && (S.alive(M) || M.state === 'haven'));
        if (P2) { o.x += (P2.pos[0] - o.x) * Math.min(1, dt * 3); o.z += (P2.pos[2] - o.z) * Math.min(1, dt * 3); o.h += (60 - o.h) * Math.min(1, dt * 2); }
      }
      sc.cam.mode = 'over'; sc.overhead();
      const items = [], col = {}; s.squads.forEach(q => { col[q.id] = q.color; });
      const running = s.phase === 'haven' || s.phase === 'battle', t = S.t();
      if (running) {
        for (const P of Object.values(s.players)) {
          if (!P.pos || P.state === 'out' || P.state === 'down' || P.state === 'lobby' || P.state === 'fly') continue;
          items.push({ mesh: sc.charMesh(P.look, false, now), pos: P.pos.slice(0, 3), yaw: P.pos[3] });
          items.push({ mesh: sc.ringMesh(col[P.squad] || '#ccc'), pos: P.pos.slice(0, 3), scale: Math.max(1, o.h / 60), noShadow: true });
        }
        if (s.phase === 'battle') {
          if (t < B.round.flightSec + 6) { const gp = S.griffinAt(Math.max(0, t)), R = I.griffinRoute(s.seed); items.push({ mesh: sc.mesh('griffin0', () => MR.griffin(0)), pos: [gp[0], gp[1] - 2.4, gp[2]], yaw: Math.atan2(R.to[0] - R.from[0], R.to[1] - R.from[1]), scale: 1.6 }); }
          const st = AR.Storm.at(S.storm(), Math.max(0, t));
          if (st.r > 0.5) items.push({ mesh: sc.mesh('storm', () => MR.stormWall()), pos: [st.x, -5, st.z], scale: [st.r, 140, st.r], alpha: 0.45, noShadow: true });
          if (st.next && st.next.r > 0.5) items.push({ mesh: sc.mesh('nextline', () => MR.circleLine('#80ffdb')), pos: [st.next.x, 0.6, st.next.z], scale: [st.next.r, 1, st.next.r], noShadow: true });
        }
        for (const R of I.runes) { const awake = !(s.runeSleep[R.id] > S.now()); items.push({ mesh: sc.mesh('rune' + awake, () => MR.runeStone(awake)), pos: [R.x, I.height(R.x, R.z) - 0.05, R.z] }); }
        this.fx = this.fx.filter(f => now - f.t0 < f.dur);
        for (const f of this.fx) if (f.k === 'b') { const dx = f.b[0] - f.a[0], dz = f.b[1] - f.a[1], tt = (now - f.t0) / f.dur; items.push({ mesh: sc.mesh('beam' + f.col + '0', () => AR.Models3.beam(f.col, 0)), pos: [f.a[0], I.ground(f.a[0], f.a[1]) + 1.5, f.a[1]], yaw: Math.atan2(dx, dz), scale: [2, 2, Math.hypot(dx, dz) || 1], alpha: 1 - tt, noShadow: true }); }

    drawMini() {

    }
  }
  AR.TeacherSession = TeacherSession;
})(window);

<script>/* src/client/app.js */
/* Spellstorm Royale · src/client/app.js — start-up, menu, joining, Practice with bots, input, and the STUDENT game:
   Sky Haven → griffin → glide → battle (third person, right-click aim + left-click fire) → knocked out (spectate +
   Learn panel) → results. The teacher dashboard lives in teacher.js. Every action is only a REQUEST to the host. */
(function (root) {
  'use strict';
  const AR = root.AR;
  const { h, $, clear, toast, modal } = AR.ui;
  const B = AR.Balance, U = AR.util;
  const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage off */ } } };
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const STATE_ICON = { haven: '☁', fly: '🦅', glide: '🪂', ground: '', down: '💫', out: '👻', lobby: '' };

  const App = AR.App = {
    bankId: LS.get('sr.bank', 'g68'),
    look: LS.get('sr.look', { robe: Math.floor(Math.random() * 10), hat: 0, skin: 1, hair: 1, gem: 0, trim: 0 }),
    settings: LS.get('sr.settings', { low: false, big: false }),
    keys: {}, mouse: { x: 0, y: 0 }, session: null,

    init() {

      this.scene.setLow(this.settings.low);
      this.scene.onAdapt = off => toast('⚙ Simpler graphics for a smoother game (' + off + ' off)');
      this.ensureWorld(7);
      this.bindInput();
      const q = new URLSearchParams(location.search);
      if (q.get('room')) this.showJoin(q.get('room')); else this.showMenu();
      let last = performance.now();
      const frame = t => { requestAnimationFrame(frame); const dt = Math.min(0.1, (t - last) / 1000); last = t; try { this.frame(dt); } catch (e) { console.error(e); } };
      requestAnimationFrame(frame);

    },
    fatal(msg) { clear($('#ui')).appendChild(h('div.panel.center', h('h1', 'Spellstorm Royale'), h('p', msg), h('p', 'Ask your teacher for help.'))); },
    ensureWorld(seed) {
      if (this.island && this.island.seed === seed) return this.island;
      this.island = AR.Island.build(seed);
      this.scene.buildWorld(this.island);
      this.colliders = buildGrid(this.island.colliders);
      console.log('[Spellstorm Royale] world triangles: ' + Math.round(this.scene.world.tris));
      return this.island;
    },

    // ===================== menu =====================
    showMenu() {
      this.endSession();
      const ui = clear(this.ui), sel = () => document.querySelectorAll('.grade').forEach(b => b.classList.toggle('on', b.dataset.bank === this.bankId));
      const grade = (id, label, sub) => h('button.grade', { 'data-bank': id, onclick: () => { this.bankId = id; LS.set('sr.bank', id); sel(); } }, h('b', label), h('span', sub));
      ui.appendChild(h('div.menu',
        h('a.labhome', { href: 'START_HERE_Computer_Lab.html' }, '← Lab home'),
        h('h1.title', 'Spellstorm Royale'), h('div.subtitle', 'A magical team battle royale'),
        h('p.tagline', 'Fly in on a griffin, answer questions at Rune Stones, win with your squad. The storm is coming!'),
        h('div.grades', grade('g68', 'Grades 6–8', 'parts · files · scams · passwords'), grade('g912', 'Grades 9–12', 'phishing · MFA · backups · logic')),
        h('div.actions',
          h('button.btn.big', { onclick: () => this.startHost() }, h('span.ico', '🏰'), 'Host a game', h('small', 'Teacher: make a room')),
          h('button.btn.big.primary', { onclick: () => this.showJoin() }, h('span.ico', '🔑'), 'Join by code', h('small', 'Student: type the room code')),
          h('button.btn.big', { onclick: () => this.showPracticeSetup() }, h('span.ico', '🤖'), 'Practice', h('small', 'Play with bots (not online)'))),
        h('div.howto', [['🦅', 'Jump off the griffin'], ['✦', 'Answer at Rune Stones'], ['🪙', 'Earn coins & points'], ['⚡', 'Win the battle'], ['🌀', 'Stay out of the storm']].map(([i, t]) => h('div', h('span', i), t))),
        h('div.row.center', h('button.btn', { onclick: () => this.showLook() }, '🎨 My mage'), h('button.link.settings', { onclick: () => this.showSettings() }, '⚙ Settings'))));
      sel();
    },
    /** Choose how your mage looks (looks only: no gameplay effect). */
    showLook() {
      const L = AR.Models.LOOKS, look = this.look, box = h('div.customizer');
      const row = (key, label, items, isColor) => h('div.crow', h('span.clabel', label), h('div.chips', items.map((v, i) => h('button.chip' + (look[key] === i ? '.on' : ''), {
        'aria-label': label + ' ' + (isColor ? i + 1 : v), title: isColor ? '' : v, style: isColor ? { background: v } : null,
        onclick: e => { look[key] = i; LS.set('sr.look', look); e.currentTarget.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === e.currentTarget)); },
      }, isColor ? '' : v))));
      box.appendChild(row('robe', 'Robe', L.robe, true)); box.appendChild(row('trim', 'Trim', L.trim, true)); box.appendChild(row('hat', 'Hat', L.hat, false));
      box.appendChild(row('skin', 'Skin', L.skin, true)); box.appendChild(row('hair', 'Hair', L.hair, true)); box.appendChild(row('gem', 'Staff gem', L.gem, true));
      const m = modal('🎨 My mage', h('div', h('p.small', 'Looks only: every mage has the same health and speed.'), box), [h('button.btn.primary', { onclick: () => m.close() }, 'Done')]);
    },
    showSettings() {
      const s = this.settings;
      const m = modal('Settings', h('div.col',
        h('label.check', h('input', { type: 'checkbox', checked: s.low, onchange: e => { s.low = e.target.checked; this.scene.setLow(s.low); LS.set('sr.settings', s); } }), ' Low graphics (faster on old computers)'),
        h('label.check', h('input', { type: 'checkbox', checked: s.big, onchange: e => { s.big = e.target.checked; document.body.classList.toggle('bigtext', s.big); LS.set('sr.settings', s); } }), ' Bigger text'),
        h('p.small', 'Graphics level picked for this computer: ' + this.scene.det.tier + '.')), [h('button.btn', { onclick: () => m.close() }, 'Close')]);
    },
    showJoin(code) {
      const ui = clear(this.ui);
      const name = h('input.text', { maxlength: 16, placeholder: 'Nickname (no full names)', value: LS.get('sr.name', ''), 'aria-label': 'Nickname' });
      const room = h('input.text.code', { maxlength: 16, placeholder: 'ROOM-00', value: code || AR.Client.lastRoom(), 'aria-label': 'Room code' });
      const msg = h('p.error');
      const go = () => {
        const nm = U.cleanName(name.value);
        if (!nm) { msg.textContent = 'Choose a kind nickname (letters and numbers, up to 16).'; return; }
        LS.set('sr.name', nm); msg.textContent = 'Connecting…';
        AR.Client.join({ room: room.value, name: nm, look: this.look }).then(link => this.startStudent(link, false)).catch(e => { msg.textContent = e.message; });
      };
      [name, room].forEach(i => i.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') go(); }));
      ui.appendChild(h('div.panel.center.join', h('h2', '🔑 Join a game'), h('label', 'Your nickname', name), h('label', 'Room code', room), msg,
        h('p.small', 'Use a nickname, never your full name.'),
        h('div.row.end', h('button.btn', { onclick: () => this.showMenu() }, 'Back'), h('button.btn.primary', { onclick: go }, 'Join'))));
      setTimeout(() => (name.value ? room : name).focus(), 50);
    },
    showPracticeSetup() {
      const o = Object.assign({ squads: 4, size: 3, skill: 'normal', rounds: 2 }, LS.get('sr.practice', {}));
      const pick = (key, label, opts) => h('label', label, h('select.text', { onchange: e => { o[key] = isNaN(e.target.value) ? e.target.value : Number(e.target.value); } },
        opts.map(([v, t]) => h('option', { value: v, selected: String(o[key]) === String(v) }, t))));
      const m = modal('🤖 Practice with bots', h('div.col',
        pick('squads', 'Squads', [2, 3, 4, 5, 6].map(n => [n, n + ' squads'])),
        pick('size', 'Players in each squad (you count in yours)', [1, 2, 3, 4].map(n => [n, n + (n === 1 ? ' (solo)' : ' players')])),
        pick('skill', 'Bot skill', [['easy', '🙂 Easy'], ['normal', '😐 Normal'], ['hard', '😈 Hard']]),
        pick('rounds', 'Rounds', [1, 2, 3, 4].map(n => [n, n + ' round' + (n > 1 ? 's' : '')])),
        h('p.small', 'Bots fly in, answer questions at Rune Stones, fight and run from the storm. Practice is not online.')),
        [h('button.btn', { onclick: () => m.close() }, 'Cancel'), h('button.btn.primary', { onclick: () => { m.close(); LS.set('sr.practice', o); this.startPractice(o); } }, '▶ Play')]);
    },

    // ===================== sessions =====================
    endSession() { if (this.session) { try { this.session.stop(); } catch (e) { /* ignore */ } } this.session = null; clear(this.labels); },
    startStudent(link, practice) { this.endSession(); this.session = new StudentSession(this, link, practice); },
    startPractice(o) {
      this.endSession(); AR.Net.resetPractice();
      AR.Host.open({ transport: 'local', bankId: this.bankId, practice: true }).then(host => {
        const nm = LS.get('sr.name', '') || 'Apprentice';
        return AR.Client.join({ room: host.room, name: nm, look: this.look, transport: 'local' }).then(link => {
          this.startStudent(link, true); this.session.practiceHost = host;
          const go = () => { if (!host.S.player(link.id)) return setTimeout(go, 50); AR.Bots.setupPractice(host.S, link.id, o); host.S.startRound(); host.flush(); };
          go();
        });
      }).catch(e => toast(e.message, 'warn'));
    },
    startHost() {
      const saved = AR.Host.savedRoom();
      const open = resume => {
        this.endSession();
        clear(this.ui).appendChild(h('div.panel.center', h('h2', 'Opening a room…'), h('p', 'Connecting to the class server.')));
        AR.Host.open({ bankId: this.bankId, resumeRoom: resume || null }).then(host => { this.session = new AR.TeacherSession(this, host); })
          .catch(e => { clear(this.ui).appendChild(h('div.panel.center', h('h2', 'Could not open a room'), h('p', e.message), h('button.btn', { onclick: () => this.showMenu() }, 'Back'))); });
      };
      if (saved) {
        const m = modal('Continue your room?', h('p', 'Room ' + saved + ' was open on this computer. Continue it (students keep their points), or start a new room.'),
          [h('button.btn', { onclick: () => { m.close(); AR.Host.forget(saved); open(null); } }, 'New room'), h('button.btn.primary', { onclick: () => { m.close(); open(saved); } }, 'Continue ' + saved)]);
      } else open(null);
    },

    // ===================== input =====================
    bindInput() {
      const typing = e => /INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '');
      window.addEventListener('keydown', e => {
        this.lastInputAt = performance.now();
        if (typing(e)) return;
        this.keys[e.code] = true;
        if (this.session && this.session.key) this.session.key(e);
        if (e.code === 'Tab' || e.code === 'Space') e.preventDefault();
      });
      window.addEventListener('keyup', e => { this.keys[e.code] = false; });
      window.addEventListener('blur', () => { this.keys = {}; if (this.session && this.session.setAim) this.session.setAim(false); });
      const cv = this.canvas; let drag = null, last = null;
      cv.addEventListener('mousedown', e => {
        this.lastInputAt = performance.now();
        const s = this.session; if (!s) return;
        if (e.button === 2 && s.setAim) { e.preventDefault(); s.setAim(!s.aiming); last = [e.clientX, e.clientY]; return; }
        if (e.button === 0 && s.aiming && s.fire) { e.preventDefault(); s.fire(); return; }
        drag = { x: e.clientX, y: e.clientY, moved: 0, button: e.button };
      });
      window.addEventListener('mousemove', e => {
        this.mouse = { x: e.clientX, y: e.clientY };
        const s = this.session;
        if (s && s.aiming) { if (document.pointerLockElement === cv) s.lookBy(e.movementX, e.movementY); else { if (last) s.lookBy(e.clientX - last[0], e.clientY - last[1]); last = [e.clientX, e.clientY]; } return; }
        last = null;
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
        if (s && s.drag) s.drag(dx, dy);
      });
      window.addEventListener('mouseup', e => { if (drag && drag.moved < 6 && this.session && this.session.click) this.session.click(e.clientX, e.clientY, drag.button); drag = null; });
      document.addEventListener('pointerlockchange', () => { const s = this.session; if (s && s.aiming && document.pointerLockElement !== cv && s._locked) s.setAim(false); if (s) s._locked = document.pointerLockElement === cv; });
      cv.addEventListener('wheel', e => { e.preventDefault(); if (this.session && this.session.wheel) this.session.wheel(e.deltaY); }, { passive: false });
      cv.addEventListener('contextmenu', e => e.preventDefault());
    },
    frame(dt) {
      const S = this.session;
      if (S && S.update) { S.update(dt); return; }
      const t = performance.now() / 1000, sc = this.scene;   // menu: slow flight around the island
      sc.eye = [Math.cos(t * 0.03) * 230, 95, Math.sin(t * 0.03) * 230]; sc.fwd = GK.vec.norm(GK.vec.sub([0, 0, 0], sc.eye)); sc.fov = 55; sc.cam.mode = 'orbit';
      sc.render([], dt);
    },
  };

  function buildGrid(cols) {
    const g = {}, cell = 8;
    for (const c of cols) { const x0 = Math.floor((c.x - c.r) / cell), x1 = Math.floor((c.x + c.r) / cell), z0 = Math.floor((c.z - c.r) / cell), z1 = Math.floor((c.z + c.r) / cell); for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) (g[x + ',' + z] = g[x + ',' + z] || []).push(c); }
    return { near: (x, z) => g[Math.floor(x / cell) + ',' + Math.floor(z / cell)] || [] };
  }

  // ===================== the student game =====================
  class StudentSession {
    constructor(app, link, practice) {
      this.app = app; this.link = link; this.practice = practice; this.sc = app.scene;
      this.pos = null; this.yaw = 0; this.spSeq = -1; this.remote = {}; this.pings = []; this.fxList = []; this.labelPool = {}; this.hudAt = 0;
      this.mode = ''; this.aiming = false; this.spectate = 0;
      Object.assign(this.sc.cam, { yaw: 0, pitch: 0.32, dist: 8, perspective: 'third' });
      link.on('g', () => this.onG()).on('ps', id => this.onPs(id)).on('pv', pv => { if (this.panel) this.panel.update(pv); this.onPv(pv); }).on('chat', () => this.drawChat()).on('chatReset', () => this.drawChat())

<script>/* src/client/gear.js */
/* Spellstorm Royale · src/client/gear.js — Milestone 2 on the student's screen (loaded after app.js; decorates it):

    el.appendChild(h('div.shopsec', 'Items')); el.appendChild(h('div.stiles', it));
    el.appendChild(h('p.small', 'Epic and Legendary weapons are only in chests 🎁.'));
  };

      h('span.si', C.icon), h('b', C.name), h('span.small', C.ability.icon + ' ' + C.ability.name)); })));
  };
