    if (e.code === 'KeyE' && !e.repeat && this.nearChest() && !(this.link.pv && this.link.pv.in)) { this.openChest(); return; }
    if (e.code === 'KeyB' && !e.repeat && this.canShop()) { this.toggleShop(); return; }
    if (e.code === 'Escape' && !this.shopEl.hidden) { this.toggleShop(false); return; }
    return oldKey.call(this, e);
  };

  // ===================== every frame: world items =====================
  const oldFx = P.fxItems;
  P.fxItems = function (items, now) {
    const sc = this.sc, I = this.app.island, MR = AR.ModelsRoyale, M2 = AR.Models2, M3 = AR.Models3, g = this.link.g, me = this.pos || [0, 0, 0], sNow = this.link.serverNow();
    // chests (closed ones)
    if (g && (g.ph === 'battle')) {
      const op = new Set(String(g.op || '').split(','));
      for (const C of I.chests) { if (op.has(C.id) || Math.hypot(C.x - me[0], C.z - me[2]) > 150) continue; items.push({ mesh: sc.mesh('chest' + C.gold, () => MR.chest(C.gold)), pos: [C.x, I.height(C.x, C.z) - 0.02, C.z], yaw: C.rot }); }
      for (const w of g.wl || []) if (w.until > sNow) items.push({ mesh: sc.mesh('wall', () => MR.wallBox()), pos: [w.x, I.ground(w.x, w.z) - 0.2, w.z], yaw: -w.yaw + Math.PI / 2, scale: [w.half * 2, 3.2, 1], alpha: 0.55, noShadow: true });
      for (const f of g.fg || []) if (f.until > sNow) items.push({ mesh: sc.mesh('fog', () => MR.fogCloud()), pos: [f.x, I.ground(f.x, f.z), f.z], scale: [f.r * 1.4, f.r * 0.9, f.r * 1.4], alpha: 0.6, noShadow: true });
      // Hawk Eye: every enemy within range gets a red beam (through walls)
      const m = this.me();
      if (m.hk > sNow && this.pos) for (const pid in this.link.pos) {
        const ps = this.link.ps[pid], R = this.link.pos[pid]; if (!ps || pid === this.link.id || (this.squad() && ps.sq === this.squad().id)) continue;
        if (Math.hypot(R.x - me[0], R.z - me[2]) < B.classes.archer.ability.r) items.push({ mesh: sc.mesh('hawk', () => AR.Models.pingBeam('#ff4d4d')), pos: [R.x, I.ground(R.x, R.z), R.z], scale: [0.5, 0.8, 0.5], alpha: 0.85, noShadow: true });
      }
    }
    // effects of every weapon
    const keep = [];
    for (const f of this.fxList) {
      const t = (now - f.t0) / f.dur; if (t >= 1) continue; keep.push(f);
      if (f.k === 'b') continue;   // lightning beams: drawn by app.js
      const y0 = I.ground(f.a[0], f.a[1]) + 1.4, dx = f.b[0] - f.a[0], dz = f.b[1] - f.a[1], len = Math.hypot(dx, dz) || 1, yaw = Math.atan2(dx, dz), fade = Math.max(0, 1 - t);
      const mid = [f.a[0] + dx * t, f.a[1] + dz * t];
      if (f.k === 'a') items.push({ mesh: sc.mesh('arrow', () => MR.arrowFx()), pos: [mid[0], I.ground(mid[0], mid[1]) + 1.4, mid[1]], yaw, noShadow: true });
      else if (f.k === 'i') items.push({ mesh: sc.mesh('beamice', () => M3.beam('#bdeaff', 1)), pos: [f.a[0], y0, f.a[1]], yaw, scale: [1.3, 1.3, len], alpha: fade, noShadow: true });
      else if (f.k === 'f') items.push({ mesh: sc.mesh('fireball', () => M3.fireball()), pos: [mid[0], I.ground(mid[0], mid[1]) + 1.6 + Math.sin(t * Math.PI) * 2.5, mid[1]], scale: 1.8, noShadow: true });
      else if (f.k === 'x') items.push({ mesh: sc.mesh('burstO', () => M2.burst('#ff922b')), pos: [f.a[0], I.ground(f.a[0], f.a[1]) + 0.8, f.a[1]], scale: 1 + t * 3.5, alpha: fade, noShadow: true });
      else if (f.k === 'w' || f.k === 'm') items.push({ mesh: sc.mesh('ring' + f.k, () => MR.shockRing(f.k === 'w' ? '#d9a066' : '#ffe066')), pos: [f.a[0], I.ground(f.a[0], f.a[1]) + 0.2, f.a[1]], scale: [1 + t * (f.k === 'w' ? 8 : 3.5), 1.2, 1 + t * (f.k === 'w' ? 8 : 3.5)], alpha: fade, noShadow: true });
      else if (f.k === 'h' || f.k === 'g' || f.k === 's') items.push({ mesh: sc.mesh('ring' + f.k, () => MR.shockRing(f.k === 's' ? '#74c0fc' : '#69db7c')), pos: [f.a[0], I.ground(f.a[0], f.a[1]) + t * 2, f.a[1]], scale: [f.k === 'g' ? 7 : 1.2, 0.6, f.k === 'g' ? 7 : 1.2], alpha: fade, noShadow: true });
      else if (f.k === 'k') for (const p of [f.a, f.b]) items.push({ mesh: sc.mesh('burstP', () => M2.burst('#b197fc')), pos: [p[0], I.ground(p[0], p[1]) + 1, p[1]], scale: 0.4 + t * 1.5, alpha: fade, noShadow: true });
      else if (f.k === 'o') items.push({ mesh: sc.mesh('burstG', () => M2.burst('#ffd43b')), pos: [f.a[0], I.ground(f.a[0], f.a[1]) + 1, f.a[1]], scale: 0.4 + t * 2, alpha: fade, noShadow: true });
    }
    const oldList = this.fxList; this.fxList = oldList.filter(f => f.k === 'b');   // app.js draws the beams
    oldFx.call(this, items, now);
    this.fxList = keep.concat(this.fxList.filter(f => keep.indexOf(f) < 0));
  };
  const oldAdd = P.addFx;
  P.addFx = function (list) { const now = performance.now(); for (const e of list) { if (e.k === 'b' || e.k === 'd') continue; this.fxList.push({ k: e.k, a: [e.x1, e.z1], b: [e.x2, e.z2], t0: now, dur: { a: 300, i: 300, f: 700, x: 600, w: 450, m: 300, h: 900, g: 1000, s: 700, k: 500, o: 800 }[e.k] || 500, col: e.tm }); } return oldAdd.call(this, list.filter(e => e.k === 'b' || e.k === 'd')); };

  // ===================== HUD refresh =====================
  const oldUpdate = P.update;
  P.update = function (dt) {
    oldUpdate.call(this, dt);
    const now = performance.now(); if (now - (this.gearAt || 0) < 200) return; this.gearAt = now;
    const m = this.me(), g = this.link.g, st = m.st, sNow = this.link.serverNow();
    const mx = m.mx || 100, hp = st === 'ground' || st === 'glide' || st === 'haven' || st === 'fly' ? m.hp || 0 : 0;
    this.hpEl.firstChild.style.width = Math.min(100, hp / mx * 100) + '%'; this.hpEl.lastChild.textContent = '❤ ' + hp + (m.shd ? '  🔷 ' + m.shd : '');
    this.shdEl.style.width = Math.min(100, (m.shd || 0) / mx * 100) + '%';
    const W = parseW(m.w), IT = parseI(m.it), sig = m.w + '/' + m.it + '/' + m.sel + '/' + m.cls;
    if (sig !== this.gearSig) {
      this.gearSig = sig;
      this.wSlots.forEach((el, i) => { const w = W[i]; el.classList.toggle('on', i === (m.sel || 0) && !!w); el.style.borderColor = w ? RAR(w.r).color : ''; el.firstChild.textContent = w ? B.weapons[w.ty].icon : ''; if (w) el.dataset.tip = tipW(w); else delete el.dataset.tip; });
      this.iSlots.forEach((el, i) => { const it = IT[i], D = it && B.items[it.ty]; el.firstChild.textContent = D ? D.icon : ''; el.children[1].textContent = it && it.n > 1 ? '×' + it.n : ''; if (D) el.dataset.tip = D.name + '\n' + D.text; else delete el.dataset.tip; });
      const C = B.classes[m.cls || 'wizard']; this.abBtn.firstChild.textContent = C.ability.icon; this.abBtn.dataset.tip = C.icon + ' ' + C.name + ': ' + C.ability.name + '\n' + C.ability.text + '\nPassive: ' + C.passive + '\nCooldown ' + C.ability.cd + ' s (Q)';
    }
    const left = Math.max(0, Math.ceil(((m.ab || 0) - sNow) / 1000)); this.abBtn.children[1].textContent = left ? left : ''; this.abBtn.classList.toggle('cooling', left > 0);
    // prompts
    const answering = !!(this.link.pv && this.link.pv.in), chest = st === 'ground' && !answering && this.nearChest();
    this.chestBtn.hidden = !chest; if (chest) this.runeBtn.hidden = true;
    const shop = this.canShop(); this.shopBtn.hidden = !shop; if (!shop && !this.shopEl.hidden) this.toggleShop(false);
    // class cards in Sky Haven (once per round, closable)
    if (g && g.ph === 'haven' && st === 'haven') { if (g.round !== this.classRound) { this.classRound = g.round; this.classClosed = false; } if (!this.classClosed) { this.classEl.hidden = false; if (this.classSig !== m.cls) { this.classSig = m.cls; this.drawClasses(); } } }
    else this.classEl.hidden = true;
    // blessings from the sky
    const bless = (st === 'down' || st === 'out') && m.bl > 0;
    this.blessEl.hidden = !bless; if (bless) this.drawBless();
  };
})();

</script>
