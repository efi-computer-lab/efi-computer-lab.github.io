    }
    /** Facing stored with a named location (used when an entity placed `at` it has no rot of its own). */
    rotAt(d) { const L = d.at && this.locations[d.at]; return L && L.rot != null ? L.rot : 0; }
    location(name) { return this.locations[name] || null; }

    // ----- building -----
    /** cfg.worldDef = the world library entry (or inline world); cfg.map/entities/zones = the game's additions. */
    build(cfg) {
      const def = cfg.worldDef || {}, gmap = cfg.map || {};
      const map = U.merge(def.map, gmap);
      for (const k of LISTS) map[k] = U.list(def.map && def.map[k]).concat(U.list(gmap[k]));
      map.legend = Object.assign({}, def.map && def.map.legend, gmap.legend);
      this.def = def;
      this.cell = map.cell || 2;
      this.wallH = map.wallHeight || 3;
      this.origin = map.origin || [0, 0];
      this.colors = U.merge({ wall: '#d8d2c4', wallTop: '#b9b2a3', floor: '#9aa5b1', floor2: '#8f9aa6', ceiling: '#eeeeea', stairs: '#b0a595', platform: '#a7b0ba' }, map.colors);

      const pending = [];
      if (map.grid) this.buildGrid(map, pending);
      for (const f of map.floors) this.floor(f);
      for (const w of map.walls) this.wall(w);
      for (const r of map.rooms) this.room(r, pending);
      // platforms: {pos, size, color, top, kind, invisible} (invisible: collision only, e.g. a tall boundary behind a low fence)
      for (const p of map.platforms) this.solid(this.toPos(p), p.size || [2, 1, 2], p.color || this.colors.platform, { top: p.top, kind: p.kind || (p.invisible ? 'wall' : 'platform'), noDraw: p.invisible });
      for (const s of map.stairs) this.stairs(s);

      // named places (world first, game may add or override)
      const addLoc = (name, L) => { this.locations[name] = { pos: this.toPos(L), rot: L.rot, name, data: L.data }; };
      for (const n in def.locations || {}) addLoc(n, def.locations[n]);
      for (const n in cfg.locations || {}) addLoc(n, cfg.locations[n]);
      const routes = Object.assign({}, def.routes, cfg.routes);
      for (const n in routes) this.routes[n] = routes[n].map(p => (typeof p === 'string' ? this.toPos({ at: p }) : this.toPos(Array.isArray(p) ? { pos: p } : p)));
      const spawns = Object.assign({}, def.spawns, cfg.spawns);
      for (const n in spawns) this.spawns[n] = { pos: this.toPos(spawns[n]), rot: spawns[n].rot != null ? spawns[n].rot : this.rotAt(spawns[n]) };
      if (map.spawn) this.spawns.default = { pos: this.toPos(map.spawn), rot: map.spawn.rot || 'n' };
      if (!this.spawns.default && this.gridSpawn) this.spawns.default = this.gridSpawn;
      const sp = cfg.spawn;
      this.spawn = (typeof sp === 'string' ? this.spawns[sp] : sp && (sp.pos || sp.at || sp.cell) ? { pos: this.toPos(sp), rot: sp.rot || 'n' } : null) || this.spawns.default || this.spawn;
      if (typeof sp === 'string' && !this.spawns[sp]) this.problem('Unknown spawn "' + sp + '". This world has: ' + Object.keys(this.spawns).join(', '));

      // areas are named regions of the world; games use them as zones (e.g. reach objectives)
      for (const n in def.areas || {}) this.addZone(Object.assign({ id: n, area: true }, def.areas[n]));
      // scenery marked `merge` (or every plain decoration when the world sets mergeScenery) is baked into the level mesh:
      // one draw call for a whole city of buildings and trees, and solid ones still collide
      for (const d of U.list(def.decorations)) {
        if (d.merge || (def.mergeScenery && d.merge !== false && !d.label && !d.interact && !d.id && !d.spin && !d.bob && !d.hover && !d.light)) this.bake(d);
        else this.add(Object.assign({ type: 'decoration' }, d));
      }
      for (const d of pending) this.add(d);
      // slots: the game fills the world's named locations with gameplay. {prefix: template | fn(location, name)} adds an
      // entity (id = the location's name) at every location called `prefix` or `prefix-…`, with the location's `data`
      // merged in and `route` set when the world has a route of the same name (movers, patrolling hazards).
      const names = Object.keys(this.locations).sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
      for (const pre in cfg.slots || {}) {
        for (const n of names) {
          if (n !== pre && n.indexOf(pre + '-') !== 0) continue;
          const L = this.locations[n], t = cfg.slots[pre], tpl = typeof t === 'function' ? t(L, n) : t;
          if (tpl) this.add(U.merge(tpl, L.data, { id: n, at: n }, this.routes[n] ? { route: n } : {}));
        }
      }
      for (const d of U.list(cfg.entities)) this.add(d);
      for (const z of U.list(cfg.zones)) this.addZone(z);
    }

    /** Bake a scenery model into the level mesh (no entity): {model, look, color, size, scale, rot, pos | at | cell, solid}. */
    bake(d) {
      if (d.model && !GK.Models.has(d.model)) { this.problem('Scenery: unknown model "' + d.model + '"'); return; }
      const shape = GK.Models.shape(d.model || 'box', U.merge({ color: d.color, size: d.size }, d.look), 'bake');
      const p = this.toPos(d), yaw = U.yaw(d.rot != null ? d.rot : this.rotAt(d));
      const s = d.scale == null ? [1, 1, 1] : typeof d.scale === 'number' ? [d.scale, d.scale, d.scale] : d.scale;
      const g = new GK.Geo().add(shape.geo).scale(s[0], s[1], s[2]).rotY(yaw).move(p[0], p[1], p[2]);
      this.geo.add(g);
      if (d.solid !== false) { const b = g.bounds(); this.statics.push({ min: b.min, max: b.max, color: shape.top || '#888', kind: 'prop', noDraw: true }); }
    }
    /** Static solid box (visual + collision). pos = bottom centre. */
    solid(pos, size, color, o) {
      o = o || {};
      if (!o.noDraw) this.geo.box(pos[0], pos[1], pos[2], size[0], size[1], size[2], color, { top: o.top, noBottom: true });
      if (!o.noCollide) this.statics.push({ min: [pos[0] - size[0] / 2, pos[1], pos[2] - size[2] / 2], max: [pos[0] + size[0] / 2, pos[1] + size[1], pos[2] + size[2] / 2], color, top: o.top || color, kind: o.kind || 'wall', noDraw: o.noDraw || undefined });
    }
    floor(f) {
      const p = this.toPos(f), s = f.size || [10, 10], t = 0.3, color = f.color || this.colors.floor;
      this.solid([p[0], p[1] - t, p[2]], [s[0], t, s[1]], color, { kind: 'floor' });
      this.tiles.push({ x: p[0], z: p[2], w: s[0], d: s[1], y: p[1], color });
    }
    /** Axis-aligned wall from [x,z] to [x,z]. */
    wall(w) {
      const a = w.from, b = w.to, th = w.thick || 0.2, h = w.height || this.wallH, y = w.y || 0;
      const cx = (a[0] + b[0]) / 2, cz = (a[1] + b[1]) / 2;
      const sx = Math.abs(b[0] - a[0]) || th, sz = Math.abs(b[1] - a[1]) || th;
      this.solid([cx, y, cz], [sx === th ? th : sx + th, h, sz === th ? th : sz + th], w.color || this.colors.wall, { top: this.colors.wallTop, kind: y > 0.5 ? 'lintel' : 'wall' });
    }
    /** Stairs: pos = bottom-front centre of the first step, dir = direction you climb. */
    stairs(s) {
      const p = this.toPos(s), d = U.dir(s.dir), n = s.steps || 6, rise = s.rise || 0.25, run = s.run || 0.5, w = s.width || 2;
      for (let i = 0; i < n; i++) {
        const along = run * i + run / 2, h = rise * (i + 1);
        const size = d[0] ? [run, h, w] : [w, h, run];
        this.solid([p[0] + d[0] * along, p[1], p[2] + d[1] * along], size, s.color || this.colors.stairs, { top: U.shade(s.color || this.colors.stairs, 1.1), kind: 'stairs' });
      }
    }
    /** Rectangular room with optional door gaps: doors [{side:'n', offset:0, width:1.4, height:2.2, door:{…}|false}] */
    room(r, pending) {
      const c = r.pos, w = r.size[0], d = r.size[1], h = r.height || this.wallH, y = r.y || 0, th = r.thick || 0.2;
      const col = r.color || this.colors.wall;
      if (r.floor !== false) this.floor({ pos: [c[0], y, c[1]], size: [w + th, d + th], color: r.floor || this.colors.floor });
      if (r.ceiling) this.geo.plane(c[0], y + h, c[1], w, d, r.ceiling === true ? this.colors.ceiling : r.ceiling, { down: true });
      const sides = {
        n: { a: [c[0] - w / 2, c[1] - d / 2], b: [c[0] + w / 2, c[1] - d / 2], ax: 0 },
        s: { a: [c[0] - w / 2, c[1] + d / 2], b: [c[0] + w / 2, c[1] + d / 2], ax: 0 },
        w: { a: [c[0] - w / 2, c[1] - d / 2], b: [c[0] - w / 2, c[1] + d / 2], ax: 1 },
        e: { a: [c[0] + w / 2, c[1] - d / 2], b: [c[0] + w / 2, c[1] + d / 2], ax: 1 },
      };
      const doors = U.list(r.doors);
      for (const k in sides) {
        if (r.open && r.open.indexOf(k) >= 0) continue;
        const S = sides[k], ax = S.ax, lo = S.a[ax], hi = S.b[ax], mid = (lo + hi) / 2;
        const gaps = doors.filter(g => g.side === k).map(g => { const gw = g.width || 1.4; const at = mid + (g.offset || 0); return { g, a: at - gw / 2, b: at + gw / 2 }; }).sort((x, y2) => x.a - y2.a);
        let cur = lo;
        const seg = (from, to, yy, hh) => {
          if (to - from < 0.01) return;
          const A = S.a.slice(), B = S.a.slice();
          A[ax] = from; B[ax] = to;
          this.wall({ from: A, to: B, height: hh, y: yy, thick: th, color: col });
        };
        for (const gp of gaps) {
          seg(cur, gp.a, y, h);
          const dh = gp.g.height || 2.2;
          seg(gp.a, gp.b, y + dh, h - dh);
          const at = (gp.a + gp.b) / 2, pos = ax === 0 ? [at, y, S.a[1]] : [S.a[0], y, at];
          if (gp.g.location) this.locations[gp.g.location] = { pos, rot: ax === 0 ? 0 : 90, name: gp.g.location };
          if (gp.g.door) pending.push(U.merge({ type: 'door', width: gp.b - gp.a, height: dh, rot: ax === 0 ? 0 : 90 }, gp.g.door, { pos }));
          cur = gp.b;
        }
        seg(cur, hi, y, h);
      }
    }
    /** ASCII grid. Legend entries: {wall, floor, spawn, door, entity|entities, zone, location:'name' ('#' → auto number)}. */
    buildGrid(map, pending) {
      const rows = map.grid, cs = this.cell, H = this.wallH;
      // legend entries may reuse a world part: {part: 'workstation', location: 'pc#'} (worlds/_parts.js)
      const legend = Object.assign({}, LEGEND);
      for (const ch in map.legend || {}) {
        const L = map.legend[ch];
        legend[ch] = L && L.part ? U.merge(GK.WorldParts.get(L.part), L) : L;
      }
      const at = (c, r) => legend[(rows[r] || '')[c] || ' '] || {};
      const isWall = (c, r) => !!at(c, r).wall;
      const hasFloor = L => !!(L.floor || L.spawn || L.door || L.entity || L.entities || L.zone || L.location);
      const counters = {};
      rows.forEach((line, r) => {
        let run = null;
        const flush = end => {
          if (!run) return;
          const L = run.L, wc = U.isObj(L.wall) ? L.wall : {};
          const x0 = this.origin[0] + run.c * cs, x1 = this.origin[0] + end * cs, z = this.origin[1] + (r + 0.5) * cs;
          this.solid([(x0 + x1) / 2, 0, z], [x1 - x0, wc.height || H, cs], wc.color || this.colors.wall, { top: wc.top || this.colors.wallTop });
          run = null;
        };
        for (let c = 0; c <= line.length; c++) {
          const ch = line[c], L = at(c, r);
          if (c < line.length && L.wall) {
            if (run && run.ch !== ch) flush(c);
            if (!run) run = { c, ch, L };
          } else flush(c);
          if (c >= line.length) break;
          const p = this.cellPos(c, r);
          const acrossX = isWall(c - 1, r) || isWall(c + 1, r);
          if (hasFloor(L)) {
            const fc = U.isObj(L.floor) && L.floor.color ? L.floor.color : ((c + r) % 2 ? this.colors.floor : this.colors.floor2);
            this.geo.plane(p[0], 0, p[2], cs, cs, fc);
            this.tiles.push({ x: p[0], z: p[2], w: cs, d: cs, y: 0, color: fc });
            this.statics.push({ min: [p[0] - cs / 2, -0.5, p[2] - cs / 2], max: [p[0] + cs / 2, 0, p[2] + cs / 2], color: fc, kind: 'floor', noDraw: true });
            if (map.ceiling) this.geo.plane(p[0], H, p[2], cs, cs, map.ceiling === true ? this.colors.ceiling : map.ceiling, { down: true });
          }
          if (L.spawn) this.gridSpawn = { pos: p.slice(), rot: (U.isObj(L.spawn) && L.spawn.rot) || map.spawnRot || 'n' };
          if (L.location) {
            let name = L.location;
            if (name.indexOf('#') >= 0) { counters[name] = (counters[name] || 0) + 1; name = name.replace('#', counters[name]); }
            this.locations[name] = { pos: p.slice(), rot: L.rot != null ? L.rot : (acrossX ? 0 : 90), name };
          }
          if (L.door) {
            const dh = L.door.height || 2.2;
            if (GK.Prefabs.has('door')) pending.push(U.merge({ type: 'door', width: cs, height: dh, rot: acrossX ? 0 : 90 }, L.door, { pos: p.slice() }));
            else this.problem('The map has a door (D) but the "world-objects" mechanic is not loaded');
            if (dh < H) this.solid([p[0], dh, p[2]], [cs, H - dh, cs], this.colors.wall, { top: this.colors.wallTop, kind: 'lintel' });
          }
          // legend entities with no 	ype (and no template) are scenery; give them a type (e.g. 'collectible') for gameplay
          for (const e of U.list(L.entity).concat(U.list(L.entities))) pending.push(U.merge(e.type || e.use ? {} : { type: 'decoration' }, e, { cell: [c, r] }));
          if (L.zone) this.addZone(U.merge(L.zone, { cell: [c, r] }));
        }
      });
    }

    // ----- entities & zones -----
    add(def) {
      const tpl = def.use ? (this.game.cfg.templates || {})[def.use] : null;
      if (def.use && !tpl) this.problem('Unknown template "' + def.use + '"');
      let d = tpl ? U.merge(tpl, def) : U.merge(def);
      if (d.type && !GK.Prefabs.has(d.type)) { this.problem('Entity "' + (d.id || '?') + '": unknown type "' + d.type + '" (is its mechanic loaded?) — shown as a prop'); d.type = 'prop'; }
      const prefab = GK.Prefabs.get(d.type || 'prop');
      d = U.merge(prefab.defaults, d);
      const ent = new Entity(this, d);
      if (this.byId[ent.id]) this.problem('Duplicate entity id "' + ent.id + '"');
      this.byId[ent.id] = ent;
      this.entities.push(ent);
      ent.prefab = prefab;
      if (prefab.init) prefab.init(ent, this.game);
      if (d.type === 'spawn') this.spawn = { pos: ent.pos.slice(), rot: d.rot || 'n' };
      return ent;
    }
    get(id) { return this.byId[id] || null; }
    /** Entities by tag, type or item. */
    find(q) {
      return this.entities.filter(e => !e.removed && (q.tag ? e.tags.indexOf(q.tag) >= 0 : true) && (q.type ? e.type === q.type : true) && (q.item ? (e.def.item || e.id) === q.item : true));
    }
    addZone(z) {
      const zone = Object.assign({}, z);
      zone.id = z.id || ('zone-' + (++this.seq));
      const p = this.toPos(z);
      if (z.radius) zone.test = q => Math.hypot(q[0] - p[0], q[2] - p[2]) <= z.radius && q[1] >= p[1] - 1 && q[1] <= p[1] + (z.height || 4);
      else {
        const s = z.size || (z.cell || z.at ? [this.cell, 4, this.cell] : [2, 4, 2]);
        const sz = s.length === 2 ? [s[0], 4, s[1]] : s;
        zone.box = { min: [p[0] - sz[0] / 2, p[1] - 0.5, p[2] - sz[2] / 2], max: [p[0] + sz[0] / 2, p[1] + sz[1], p[2] + sz[2] / 2] };
        zone.test = q => Ph.contains(zone.box, q);
      }
      zone.center = p;
      zone.inside = false; zone.fired = 0;
      const old = this.zones.findIndex(o => o.id === zone.id);
      if (old >= 0) this.zones.splice(old, 1);   // a game zone replaces a world area with the same name
      this.zones.push(zone);
      return zone;
    }
    zone(id) { return this.zones.find(z => z.id === id) || null; }
    /** Zones a view should draw (config `show: true | colour`). */
    visibleZones() { return this.zones.filter(z => z.show && z.box && (z.if === undefined || GK.test(this.game, z.if))); }

    // ----- per-frame -----
    /** Everything the player collides with this frame (optionally leaving one entity out). */
    solids(except) {
      const out = this.statics.slice();
      for (const e of this.entities) if (e !== except && e.blocks()) out.push(e.collider());
      return out;
    }
    update(dt) {
      const g = this.game, pl = g.player, pbox = Ph.bodyBox(pl.pos, pl.r + 0.15, pl.h);
      for (const e of this.entities) {
        if (e.removed) continue;
        e.t += dt;
        if (e.spin) e.yaw += e.spin * dt;
        if (e.pressT > 0) { e.pressT -= dt; e.offset[1] = e.pressT > 0 ? -0.04 : 0; }
        if (e.prefab.update) e.prefab.update(e, dt, g);
        if (!e.active || g.state.mode !== 'playing') continue;
        if (e.def.touch || e.onTouch || e.def.onTouch) {
          if (Ph.overlap(pbox, e.pickBox())) {
            if (!e.touching) {
              e.touching = true;
              if (e.onTouch) e.onTouch(g);
              if (e.def.onTouch) GK.run(g, e.def.onTouch, { entity: e });
              if (e.def.touch && e.currentInteraction() && g.interactWith) g.interactWith(e, true);
            }
          } else e.touching = false;
        }
      }
      if (g.state.mode !== 'playing') return;
      const feet = [pl.pos[0], pl.pos[1] + 0.1, pl.pos[2]];
      for (const z of this.zones) {
        const inside = (z.if === undefined || GK.test(g, z.if)) && z.test(feet);
        g.state.inZone[z.id] = inside;
        if (inside === z.inside) {
          if (inside && z.onStay) GK.run(g, z.onStay, { zone: z, dt });
          continue;
        }
        z.inside = inside;
        if (inside) {
          if (z.once && z.fired) continue;
          z.fired++;
          g.emit('zone:enter', { id: z.id });
          GK.run(g, z.onEnter, { zone: z });
        } else {
          g.emit('zone:exit', { id: z.id });
          GK.run(g, z.onExit, { zone: z });
        }
      }
    }
    /** Nearest thing along a ray: {t, entity} (entity null = wall/floor). */
    raycast(o, d, maxDist) {
      let best = { t: maxDist, entity: null, hit: false };
      for (const s of this.statics) {
        const t = Ph.rayBox(o, d, s);
        if (t >= 0 && t < best.t) best = { t, entity: null, hit: true };
      }
      for (const e of this.entities) {
        if (!e.active) continue;
        const it = e.currentInteraction();
        if (!e.blocks() && !it) continue;
        const t = Ph.rayBox(o, d, it ? e.pickBox() : e.box());
        if (t >= 0 && t < best.t) best = { t, entity: e, hit: true };
      }
      return best;
    }
    /** Interactable entity closest to point p within `reach` (views without aiming, e.g. top-down). */
    nearest(p, reach, facing) {
      let best = null, bs = Infinity;
      for (const e of this.entities) {
        if (!e.active || !e.currentInteraction()) continue;
        const b = e.pickBox();
        const dx = Math.max(b.min[0] - p[0], 0, p[0] - b.max[0]), dz = Math.max(b.min[2] - p[2], 0, p[2] - b.max[2]);
        const d = Math.hypot(dx, dz);
        if (d > reach || b.min[1] > p[1] + 2.2 || b.max[1] < p[1] - 0.5) continue;
        const c = e.center(), dir = V.norm([c[0] - p[0], 0, c[2] - p[2]]);
        const score = d - (facing ? V.dot(dir, facing) * 0.4 : 0);
        if (score < bs) { bs = score; best = e; }
      }
      return best;
    }
  }
  GK.World = World;
})();

</script>
<script>/* game-types/../worlds/_parts.js */
/* World parts — reusable furniture groups for world grids, so worlds share pieces instead of copying them.
   Use in a world legend:  w: { part: 'workstation', location: 'pc#' }   (anything you add overrides the part)
   A part is a legend entry: {floor: true, entities: [...], rot, location}. Offsets are within one 2 m cell; the
   part's "front" (where a person stands or sits) faces +z unless noted. Add parts with GK.WorldParts.add(). */
(function () {
  'use strict';
  const P = GK.WorldParts;
  P.add('workstation', {   // student computer desk; the chair and screen face +z (a person sits on the +z side)
    floor: true, rot: 's',
    entities: [{ model: 'workstation', offset: [0, 0, -0.2] }, { model: 'chair', offset: [0, 0, 0.55], rot: 'n' }],
  });
  P.add('studentDesk', {
    floor: true, rot: 's',
    entities: [{ model: 'desk', look: { size: [1.1, 0.6] }, offset: [0, 0, -0.15] }, { model: 'chair', offset: [0, 0, 0.45], rot: 'n' }],
  });
  P.add('teacherDesk', {   // desk + computer, chair on the +z side
    floor: true, rot: 's',
    entities: [{ model: 'desk', look: { size: [1.6, 0.8] }, color: '#b08d64' }, { model: 'computer', y: 0.76, offset: [0.3, 0, 0] }, { model: 'chair', offset: [0, 0, 0.75], rot: 'n' }],
  });
  P.add('officeDesk', {    // desk + computer, chair on the −z side (faces the room)
    floor: true, rot: 's',
    entities: [{ model: 'desk', color: '#8b6b4a' }, { model: 'computer', y: 0.76, offset: [0.3, 0, 0] }, { model: 'chair', offset: [0, 0, -0.65], rot: 's' }],
  });
  P.add('serverRack', {    // against an east wall, facing west
    floor: true, rot: 'w',
    entity: { model: 'server', rot: 'w', offset: [0.5, 0, 0] },
  });
  P.add('bookshelf', {     // against a north wall
    floor: true, rot: 's',
    entity: { model: 'shelf', offset: [0, 0, -0.6] },
  });
  P.add('crates', { floor: true, entities: [{ model: 'crate', offset: [-0.3, 0, 0] }, { model: 'crate', look: { size: 0.7 }, offset: [0.5, 0, 0.3] }] });
  P.add('barrels', { floor: true, entities: [{ model: 'barrel', offset: [-0.4, 0, 0] }, { model: 'barrel', offset: [0.45, 0, 0.2], color: '#d35400' }] });
  P.add('doorway', { floor: true });   // an open doorway cell; give it a location name so games can put a door there
})();

<script>/* game-types/_spatial/spatial.js */
/* Game Kit · game-types/_spatial/spatial.js
   What every game type WITH A MAP shares (first-person, top-down, later third-person / platformer…):
   builds the world + player body, checkpoints, respawn and falling, per-frame world update, and the
   list of labels (entity names + objective marker) a view projects onto the screen.
   Also registers the spatial conditions ({inZone}, {visible}) and actions (show/hide/teleport/…).
   A view calls:  GK.Spatial.setup(game) in setup(),  GK.Spatial.update(game, dt) in update(). */
(function () {
  'use strict';
  const U = GK.util, V = GK.vec;

  const PLAYER = {
    height: 1.7, eyeHeight: 1.6, radius: 0.3, walkSpeed: 4.2, sprintSpeed: 7, jumpSpeed: 5.6, gravity: 18,
    stepHeight: 0.4, accel: 14, airAccel: 3, sensitivity: 0.0022, invertY: false, fov: 72, reach: 3,
    canJump: true, canSprint: true, headBob: true, health: null, respawnOnDeath: false, killY: -15, steering: 'camera',
  };

  const S = GK.Spatial = {
    PLAYER,
    setup(game) {
      const cfg = game.cfg;
      game.state.inZone = {};
      game.state.found = {};
      game.state.deaths = 0;
      game.world = new GK.World(game);
      game.world.build(cfg);
      game.player = new GK.Player(game, U.merge(PLAYER, cfg.player));
      game.player.place(game.world.spawn.pos, game.world.spawn.rot);
      game.checkpoint = { pos: game.world.spawn.pos.slice(), rot: game.world.spawn.rot };
      game.setCheckpoint = (pos, rot, id) => {
        game.checkpoint = { pos: pos.slice(), rot: rot == null ? game.checkpoint.rot : rot };
        game.ui.toast('⚑ Checkpoint', 'good');
        game.audio.play('checkpoint');
        game.emit('checkpoint', { id: id || null });
      };
      game.respawn = heal => {
        if (heal && game.player.maxHealth != null) game.player.health = game.player.maxHealth;
        game.player.place(game.checkpoint.pos, game.checkpoint.rot);
        game.emit('player:respawn');
      };
    },
    /** Move the player (when playing), update entities and zones, handle falling and health. */
    update(game, dt, input) {
      const s = game.state, cfg = game.cfg, pl = game.player;
      if (s.mode === 'playing' && input) pl.update(dt, input, game.world.solids());
      game.world.update(dt);
      if (s.mode !== 'playing') return;
      if (pl.pos[1] < pl.cfg.killY) {
        s.deaths++;
        if (cfg.scoring.respawn) game.scoring.add(-cfg.scoring.respawn, 'Fell', 'penalty');
        game.respawn();
        game.ui.toast('Whoops! Back to the last checkpoint.', 'bad');
        game.audio.play('hurt');
      }
      if (pl.health != null && pl.health <= 0) {
        if (pl.cfg.respawnOnDeath) {
          s.deaths++;
          if (cfg.scoring.respawn) game.scoring.add(-cfg.scoring.respawn, 'Knocked out', 'penalty');
          game.respawn(true);
          game.ui.toast('You were knocked out!' + (cfg.scoring.respawn ? ' −' + cfg.scoring.respawn : ''), 'bad');
          game.emit('player:down');
        }
        else game.lose(pl.cfg.deathText || 'You ran out of health.', true);
      }
    },
    /** Labels to draw: [{text, pos:[x,y,z], cls}] — names of labelled entities near `eye`, plus the objective marker. */
    labels(game, eye) {
      const out = [], range = game.cfg.ui.labelRange || 10, mode = game.state.mode;
      if (mode === 'ended' || mode === 'title') return out;
      for (const e of game.world.entities) {
        if (!e.active || !e.label) continue;
        const top = e.figure ? [e.pos[0], e.pos[1] + GK.HERO.height + 0.1, e.pos[2]] : e.top();   // animated characters have no single model
        if (V.dist(top, eye) > (e.labelRange || range)) continue;   // entity.labelRange: e.g. other players' names from further away
        out.push({ text: U.fill(e.label, game.state.vars), pos: [top[0], top[1] + 0.25, top[2]], cls: e.labelCls });
      }
      // named places + areas: shown with the teacher debug overlay, or ui.showLocations (world viewer)
      if (game.cfg.ui.showLocations || GK.Settings.get('overlay', false)) {
        const r = game.cfg.ui.locationRange || 30;
        for (const n in game.world.locations) {
          const L = game.world.locations[n].pos;
          if (Math.hypot(L[0] - game.player.pos[0], L[2] - game.player.pos[2]) <= r) out.push({ text: '📍 ' + n, pos: [L[0], L[1] + 0.2, L[2]], cls: 'loc' });
        }
        for (const z of game.world.zones) if (z.area) out.push({ text: '▭ ' + z.id, pos: [z.center[0], z.center[1] + 2.6, z.center[2]], cls: 'area' });
      }
      if (game.cfg.ui.markers !== false && game.missions) {
        const t = game.missions.targetOf(game.missions.current());
        if (t) {
          const d = Math.round(Math.hypot(t[0] - game.player.pos[0], t[2] - game.player.pos[2]));
          if (d > 1.5) out.push({ text: '▼ ' + d + ' m', pos: [t[0], t[1] + 0.75, t[2]], cls: 'marker' });
        }
      }
      return out;
    },
    snapshot(game, out) {
      const p = game.player;
      out.player = { pos: p.pos, yaw: p.yaw, pitch: p.pitch, health: p.health, checkpoint: game.checkpoint };
      out.entities = game.world.entities.map(e => ({ id: e.id, pos: e.pos, yaw: e.yaw, visible: e.visible, removed: e.removed, enabled: e.enabled, state: e.state,
        model: typeof e.model === 'string' ? e.model : undefined, look: e.look, label: e.label, tint: e.tint, name: e.name }));
    },
    /** Apply the spatial part of a snapshot. opts.player === false / opts.entities === false skip those parts. */
    restore(game, snap, opts) {
      opts = opts || {};
      if (snap.entities && opts.entities !== false) {
        for (const s of snap.entities) {
          const e = game.world.get(s.id);
          if (!e) continue;
          Object.assign(e, { pos: s.pos.slice(), yaw: s.yaw, visible: s.visible, removed: s.removed, enabled: s.enabled, state: s.state, label: s.label, tint: s.tint, name: s.name });
          if (s.model) e.setModel(s.model, s.look);
          if (e.prefab.restore) e.prefab.restore(e, game);
        }
      }
      if (snap.player && opts.player !== false) {
        const p = game.player, s = snap.player;
        p.pos = s.pos.slice(); p.vel = [0, 0, 0]; p.yaw = s.yaw; p.pitch = s.pitch;
        if (s.health != null) p.health = s.health;
        if (s.checkpoint) game.checkpoint = s.checkpoint;
      }
    },
  };

  // ---------- spatial rules ----------
  const C = GK.Conditions, A = GK.Actions, T = GK.targetOf;
  C.add('inZone', (g, v) => !!(g.state.inZone && g.state.inZone[v]));
  C.add('visible', (g, v) => { const e = g.world && g.world.get(v); return !!(e && e.active); });
  A.add('show', (g, a, ctx) => { for (const id of U.list(a.target)) { const e = T(g, { do: 'show', target: id }, ctx); if (e) { e.show(); g.emit('entity:shown', { id }); } } });
  A.add('hide', (g, a, ctx) => { for (const id of U.list(a.target)) { const e = T(g, { do: 'hide', target: id }, ctx); if (e) e.hide(); } });
  A.add('remove', (g, a, ctx) => { const e = T(g, a, ctx); if (e) e.remove(); });
  A.add('enable', (g, a, ctx) => { const e = T(g, a, ctx); if (e) e.enabled = true; });
  A.add('disable', (g, a, ctx) => { const e = T(g, a, ctx); if (e) e.enabled = false; });
  A.add('set', (g, a, ctx) => { // change an entity's look / model / label / tint / name
    const e = T(g, a, ctx);
    if (!e) return;
    if (a.model) e.setModel(a.model, a.look || e.look); else if (a.look) e.setLook(a.look);
    if (a.label !== undefined) e.label = a.label;
    if (a.tint !== undefined) e.tint = a.tint;
    if (a.name !== undefined) e.name = a.name;
  });
  A.add('move', (g, a, ctx) => { const e = T(g, a, ctx); if (e) e.pos = g.world.toPos(a); });
  A.add('spawn', (g, a) => g.world.add(a.entity));
  A.add('teleport', (g, a) => { const e = a.to ? g.world.get(a.to) : null; g.player.place(e ? e.pos : g.world.toPos(a), a.rot); });
  A.add('checkpoint', (g, a) => g.setCheckpoint(a.pos || a.cell || a.at ? g.world.toPos(a) : g.player.pos, a.rot));
  A.add('damage', (g, a) => g.player.damage(a.amount || 10));
  A.add('heal', (g, a) => g.player.heal(a.amount || 10));
})();

</script>
<script>/* game-types/first-person-3d/renderer.js */
/* Game Kit · game-types/first-person-3d/renderer.js
   A small WebGL 1 renderer for flat-coloured, vertex-coloured low-poly scenes (GK.Geo meshes), with the look of
   modern browser games:
   - per-pixel lighting: sun + sky/ground ambient + fill light + up to 8 coloured POINT LIGHTS (setLights)
   - per-vertex glow (neon), soft contact shading near the floor, linear fog
   - floor detail on items marked `grid` (tile seams and fine circuit lines)
   - BLOOM: bright and glowing parts bleed light (setQuality({bloom}); off in "low graphics")
   To use Three.js instead, write a renderer with the same small surface
   (mesh, cached, free, resize, setCamera, setLights, setQuality, render, project, setEnv, destroy). */
(function () {
  'use strict';
  const U = GK.util, V = GK.vec, M4 = GK.mat4;
  const MAX_LIGHTS = 8;

  // ---------- main scene shader ----------
  const VS = [
    'attribute vec3 aPos;', 'attribute vec3 aNor;', 'attribute vec3 aCol;', 'attribute float aGlo;',
    'uniform mat4 uVP;', 'uniform mat4 uM;', 'uniform vec3 uTint;', 'uniform float uGlow;',
    'varying vec3 vCol;', 'varying vec3 vNor;', 'varying vec3 vWorld;', 'varying float vGlo;',
    'void main() {',
    '  vec4 wp = uM * vec4(aPos, 1.0);',
    '  vWorld = wp.xyz;',
    '  vNor = (uM * vec4(aNor, 0.0)).xyz;',
    '  vCol = aCol * uTint;',
    '  vGlo = clamp(aGlo + uGlow, 0.0, 1.0);',
    '  gl_Position = uVP * wp;',
    '}',
  ].join('\n');
  const FS = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH', 'precision highp float;', '#else', 'precision mediump float;', '#endif',
    'uniform vec3 uSunDir;', 'uniform vec3 uSun;', 'uniform vec3 uSky;', 'uniform vec3 uGround;',
    'uniform vec3 uEye;', 'uniform vec3 uFogColor;', 'uniform vec2 uFog;', 'uniform float uAlpha;', 'uniform float uHi;',
    'uniform int uNL;', 'uniform vec3 uLP[' + MAX_LIGHTS + '];', 'uniform vec3 uLC[' + MAX_LIGHTS + '];', 'uniform float uLR[' + MAX_LIGHTS + '];',
    'uniform float uGrid;', 'uniform vec3 uGridCol;', 'uniform float uCell;',
    'varying vec3 vCol;', 'varying vec3 vNor;', 'varying vec3 vWorld;', 'varying float vGlo;',
    'void main() {',
    '  vec3 n = normalize(vNor);',
    '  vec3 fill = normalize(vec3(-uSunDir.x, 0.0, -uSunDir.z) + vec3(0.0001));',
    '  vec3 lit = mix(uGround, uSky, n.y * 0.5 + 0.5) + uSun * max(dot(n, uSunDir), 0.0) + uSun * 0.35 * max(dot(n, fill), 0.0);',
    '  for (int i = 0; i < ' + MAX_LIGHTS + '; i++) {',
    '    if (i >= uNL) break;',
    '    vec3 L = uLP[i] - vWorld; float d = length(L);',
    '    float a = clamp(1.0 - d / uLR[i], 0.0, 1.0); a *= a;',
    '    lit += uLC[i] * a * (0.3 + 0.7 * max(dot(n, L / max(d, 0.001)), 0.0));',
    '  }',
    '  float ao = mix(0.68, 1.0, clamp(vWorld.y / 1.3, 0.0, 1.0));',   // soft shading where walls meet the floor
    '  vec3 c = mix(vCol * lit * ao, vCol, vGlo);',
    '  if (uGrid > 0.5 && n.y > 0.9) {',
    '    vec2 gp = vWorld.xz / uCell;',
    '    vec2 f = abs(fract(gp) - 0.5);',
    '    float seam = smoothstep(0.455, 0.5, max(f.x, f.y));',
    '    c *= 1.0 - 0.35 * seam;',
    '    vec2 q = abs(fract(gp * 2.0) - 0.5);',
    '    float line = 1.0 - smoothstep(0.0, 0.05, min(q.x, q.y));',
    '    float pick = step(0.6, fract(sin(dot(floor(gp * 2.0), vec2(12.9898, 78.233))) * 43758.5453));',
    '    c += uGridCol * line * pick * 0.2;',
    '  } else if (uGrid > 0.5 && abs(n.y) < 0.3) {',   // walls: panel seams, a glowing trim near the floor, a dark band higher up
    '    float u2 = (abs(n.x) > abs(n.z) ? vWorld.z : vWorld.x) / uCell;',
    '    float fu = min(fract(u2), 1.0 - fract(u2));',
    '    c *= 1.0 - 0.3 * (1.0 - smoothstep(0.0, 0.03, fu));',
    '    c += uGridCol * (1.0 - smoothstep(0.0, 0.05, abs(vWorld.y - 0.3))) * 0.55;',
    '    c *= 1.0 - 0.3 * (1.0 - smoothstep(0.0, 0.05, abs(vWorld.y - 2.6)));',
    '  }',
    '  c += vec3(uHi);',
    '  float fog = clamp((distance(vWorld, uEye) - uFog.x) / max(uFog.y - uFog.x, 0.001), 0.0, 1.0);',
    '  gl_FragColor = vec4(mix(c, uFogColor, fog), uAlpha);',
    '}',
  ].join('\n');

  // ---------- full-screen passes for bloom ----------
  const QUAD_VS = ['attribute vec2 aQ;', 'varying vec2 vUv;', 'void main() { vUv = aQ * 0.5 + 0.5; gl_Position = vec4(aQ, 0.0, 1.0); }'].join('\n');
  const BRIGHT_FS = ['precision mediump float;', 'uniform sampler2D uTex;', 'uniform float uThr;', 'varying vec2 vUv;',
    'void main() { vec3 c = texture2D(uTex, vUv).rgb; float m = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(uThr, 1.0, m), 1.0); }'].join('\n');
  const BLUR_FS = ['precision mediump float;', 'uniform sampler2D uTex;', 'uniform vec2 uDir;', 'varying vec2 vUv;',
    'void main() {',
    '  vec3 c = texture2D(uTex, vUv).rgb * 0.227;',
    '  c += (texture2D(uTex, vUv + uDir * 1.385).rgb + texture2D(uTex, vUv - uDir * 1.385).rgb) * 0.316;',
    '  c += (texture2D(uTex, vUv + uDir * 3.231).rgb + texture2D(uTex, vUv - uDir * 3.231).rgb) * 0.07;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'].join('\n');
  const ADD_FS = ['precision mediump float;', 'uniform sampler2D uTex;', 'uniform float uK;', 'varying vec2 vUv;',
    'void main() { gl_FragColor = vec4(texture2D(uTex, vUv).rgb * uK, 0.0); }'].join('\n');

  class Renderer {
    /** opts: {pixelRatio, antialias, far} */
    constructor(canvas, opts) {
      opts = opts || {};
      this.canvas = canvas;
      const attrs = { antialias: opts.antialias !== false, alpha: true, premultipliedAlpha: false };
      const gl = this.gl = canvas.getContext('webgl', attrs) || canvas.getContext('experimental-webgl', attrs);
      if (!gl) throw new Error('This computer\'s browser cannot show 3D graphics (WebGL is turned off or not supported).');
      this.pixelRatio = opts.pixelRatio || 1;
      this.far = opts.far || 150;
      this.prog = this._program(VS, FS);
      gl.useProgram(this.prog);
      this.a = {};
      for (const n of ['aPos', 'aNor', 'aCol', 'aGlo']) this.a[n] = gl.getAttribLocation(this.prog, n);
      this.u = {};
      for (const n of ['uVP', 'uM', 'uSunDir', 'uSun', 'uSky', 'uGround', 'uTint', 'uEye', 'uGlow', 'uHi', 'uFogColor', 'uFog', 'uAlpha', 'uNL', 'uLP', 'uLC', 'uLR', 'uGrid', 'uGridCol', 'uCell']) {
        this.u[n] = gl.getUniformLocation(this.prog, n);
      }
      gl.enable(gl.DEPTH_TEST);
      gl.disable(gl.CULL_FACE);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      this.proj = M4.create(); this.view = M4.create(); this.vp = M4.create(); this.tmp = M4.create();
      this.eye = [0, 0, 0];
      this.cache = {};
      this.lights = [];
      this.quality = { bloom: true, lights: MAX_LIGHTS, bloomStrength: 0.85, bloomThreshold: 0.8 };
      this.gridColor = [0.3, 0.8, 1]; this.cell = 2;
      this.setEnv({});
    }
    _program(vs, fs) {
      const gl = this.gl, mk = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader error: ' + gl.getShaderInfoLog(s));
        return s;
      };
      const p = gl.createProgram();
      gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Shader link error: ' + gl.getProgramInfoLog(p));
      return p;
    }
    /** env: {sun:{dir,color,intensity}, ambient:{sky,ground}, fog:[near,far], fogColor, grid: colour of the floor traces} */
    setEnv(env) {
      const sun = env.sun || {}, amb = env.ambient || {};
      this.env = {
        sunDir: V.norm(sun.dir || [0.4, 1, 0.3]),
        sun: U.shade(sun.color || '#fff3dd', sun.intensity == null ? 0.5 : sun.intensity),
        sky: U.color(amb.sky || '#8494aa'),

          }
        }
        for (const L of U.list(g.world.def && g.world.def.lights)) this.staticLights.push({ pos: g.world.toPos(L), color: L.color, range: L.range || 8, k: L.intensity == null ? 0.8 : L.intensity });
      }
      for (const L of this.staticLights) if (!L.ent || L.ent.active) add(L.pos, L.color, L.range, L.k);
      for (const e of g.world.entities) {
        if (!e.active) continue;
        if (e.type === 'fx' && e.model === 'bolt') add(e.pos, e.look.color, 4.5, 1.0);
        else if (e.type === 'powerup' || e.type === 'pickup') add(e.drawPos(), e.look.color, 4, 0.7);
        else if (e.type === 'portal') add(e.center(), e.look.color || e.def.color, 7, 1);
        else if (e.type === 'hazard' && e.def.boss && !e.state.dead) add(e.center(), e.look.color, 10, 0.9);
      }
      for (const f of this.flashes) add(f.pos, f.color, f.range, 1.6 * f.t / f.max);
      out.sort((a, b) => a.d - b.d);
      return out;
    }
    snapshot(out) { GK.Spatial.snapshot(this.game, out); }
    restore(snap, opts) { GK.Spatial.restore(this.game, snap, opts); }
    destroy() { this.teardown(); this.renderer.destroy(); this.canvas.remove(); }
  }
})();
