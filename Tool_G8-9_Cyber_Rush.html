<script>/* mechanics/juice/juice.js */
/* Game Kit · mechanics/juice   (spatial game types)
   Game feel for running games:
   - Speed (sprinting, speed boosts) widens the view (game.fovKick) and draws speed lines around the screen edge.
   - Dust puffs fly up at your feet while you run, a ring of dust appears when you land a big jump, and a coloured trail
     follows you while a speed power is on.
   - game.fxBurst(pos, color, n): a burst of puffs, which other mechanics use for breaking glass, hits and pick-ups.
   Config juice: { dust: '#cfd8e3', trail: '#4cc9f0', lines: true, fov: 10 }. Puffs are pooled (at most 48 entities). */
(function () {
  'use strict';
  const U = GK.util, MAXP = 48;
  GK.Models.add('puff', () => new GK.Geo().sphere(0, 0, 0, 0.22, '#ffffff', { glow: 0.55, seg: 6, rings: 4 }));
  GK.Prefabs.add('puff', { defaults: { model: 'puff', solid: false } });

  const CSS = '.gk-speedlines{position:absolute;inset:-10%;pointer-events:none;z-index:1;opacity:0;transition:opacity .15s;' +
    'background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 5deg,rgba(255,255,255,.55) 5.2deg 5.5deg,transparent 5.7deg 9deg);' +
    '-webkit-mask:radial-gradient(circle at 50% 50%,transparent 38%,#000 78%);mask:radial-gradient(circle at 50% 50%,transparent 38%,#000 78%);animation:gkLines .12s steps(2) infinite}' +
    '@keyframes gkLines{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(2.3deg) scale(1.02)}100%{transform:rotate(-1.4deg) scale(1)}}';

  function spawn(g, pos, color, vel, size, life) {
    const J = g.juice;
    let e = J.pool.find(p => !p.visible);
    if (!e) {
      if (J.pool.length >= MAXP) e = J.pool.reduce((a, b) => (a.state.life < b.state.life ? a : b));
      else { e = g.world.add({ id: 'puff-' + J.pool.length, type: 'puff', pos: pos.slice() }); J.pool.push(e); }
    }
    e.pos = pos.slice(); e.tint = color; e.visible = true;
    e.state.vel = vel; e.state.life = e.state.max = life || 0.6; e.state.size = size || 1;
    e.scale = [e.state.size, e.state.size, e.state.size]; e.alpha = 0.7;
    return e;
  }

  GK.Mechanics.add('juice', {
    configKeys: ['juice'],
    setup(game) {
      if (!document.getElementById('gk-juice-css')) { const s = document.createElement('style'); s.id = 'gk-juice-css'; s.textContent = CSS; document.head.appendChild(s); }
      const cfg = U.merge({ dust: '#cfd8e3', trail: game.cfg.ui.accent || '#4cc9f0', lines: true, fov: 10 }, game.cfg.juice);
      game.juice = { cfg, pool: [], stepT: 0, trailT: 0, air: false, fall: 0 };
      game.fovKick = 0;
      game.fxBurst = (pos, color, n) => {
        for (let i = 0; i < (n || 10); i++) {
          const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
          spawn(game, pos, color || '#ffffff', [Math.cos(a) * sp, 1.5 + Math.random() * 4, Math.sin(a) * sp], 0.8 + Math.random() * 0.9, 0.5 + Math.random() * 0.4);
        }
      };
      if (cfg.lines && !game.ui.hud.querySelector('.gk-speedlines')) game.ui.hud.insertBefore(U.el('div', 'gk-speedlines'), game.ui.hud.firstChild);
    },
    update(game, dt) {
      const J = game.juice, pl = game.player;
      if (!pl || !J) return;
      // puffs: drift, slow down, grow, fade
      for (const e of J.pool) {
        if (!e.visible) continue;
        const S = e.state;
        S.life -= dt;
        if (S.life <= 0) { e.visible = false; continue; }
        const k = S.life / S.max;
        e.pos[0] += S.vel[0] * dt; e.pos[1] += S.vel[1] * dt; e.pos[2] += S.vel[2] * dt;
        S.vel[0] *= 0.92; S.vel[2] *= 0.92; S.vel[1] = S.vel[1] * 0.9 - 2 * dt;
        const sc = S.size * (1.6 - 0.6 * k);
        e.scale = [sc, sc, sc]; e.alpha = 0.65 * k;
      }
      const hs = Math.hypot(pl.vel[0], pl.vel[2]), boosted = game.hasPower && (game.hasPower('speed') || game.hasPower('rocket') || game.hasPower('jetpack'));
      const run = pl.cfg.walkSpeed || 5, fast = U.clamp((hs - run * 1.05) / Math.max(1, (pl.cfg.sprintSpeed || 7) - run), 0, 1);
      // wider view and speed lines when fast
      const want = (fast * 0.7 + (boosted && hs > 3 ? 0.6 : 0)) * J.cfg.fov;
      game.fovKick += (want - game.fovKick) * Math.min(1, dt * 5);
      const lines = game.ui.hud.querySelector('.gk-speedlines');
      if (lines) lines.style.opacity = String(U.clamp(fast * 0.55 + (boosted && hs > 3 ? 0.45 : 0), 0, 0.9).toFixed(2));
      // dust at the feet while running, a ring when landing hard, a trail while boosted
      if (pl.grounded && hs > 3) {
        J.stepT -= dt;
        if (J.stepT <= 0) {
          J.stepT = fast > 0.3 ? 0.11 : 0.2;
          const back = [-pl.vel[0] / hs, -pl.vel[2] / hs], side = (Math.random() - 0.5) * 0.5;
          spawn(game, [pl.pos[0] + back[0] * 0.3 - back[1] * side, pl.pos[1] + 0.12, pl.pos[2] + back[1] * 0.3 + back[0] * side], J.cfg.dust, [back[0] * 1.5, 0.8 + Math.random(), back[1] * 1.5], 0.7 + fast * 0.6, 0.45);
        }
      }
      if (!pl.grounded) J.fall = Math.min(J.fall, pl.vel[1]);
      if (pl.grounded && J.air && J.fall < -7) {
        for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; spawn(game, [pl.pos[0], pl.pos[1] + 0.1, pl.pos[2]], J.cfg.dust, [Math.cos(a) * 4, 0.6, Math.sin(a) * 4], 1.1, 0.5); }
        if (game.shake) game.shake(0.15, 0.06);
      }
      if (pl.grounded) J.fall = 0;
      J.air = !pl.grounded;
      if (boosted && hs > 3) {
        J.trailT -= dt;
        if (J.trailT <= 0) { J.trailT = 0.05; spawn(game, [pl.pos[0], pl.pos[1] + 0.7 + Math.random() * 0.6, pl.pos[2]], game.hasPower('jetpack') ? '#ff9f43' : J.cfg.trail, [0, game.hasPower('jetpack') ? -2 : 0.3, 0], 0.9, 0.35); }
      }
    },
  });
})();

</script>
<script>/* mechanics/music/music.js */
/* Game Kit · mechanics/music   (any game type)
   Background music made live with WebAudio (no files, works offline): bass, chord arpeggios, a soft pad and drums,
   looping a 4-chord progression. A game (or each level) picks the style:

<script>/* mechanics/online/online.js */
/* Game Kit · mechanics/online   (spatial game types; needs internet for the real transport)
   Internet rooms like Poki / CrazyGames: everyone who types the same room code shares one room. Generic: it knows
   nothing about racing (mechanics/race uses it). Data lives in the teacher's free Firebase Realtime Database
   (online/README.md) under rooms/<CODE>/…; the rules only allow that.
     rooms/<CODE>/meta              {host, at}                         written by whoever created the room
     rooms/<CODE>/players/<id>      {name, char, p, f, on}            each player writes their own record
        p = "x,y,z,yaw,vx,vz" (2 decimals, ONE small string), sent at most `rate` times a second and only when moving
        f = flags other PCs draw (bit 1 in the air, then bits a game gives meaning, e.g. shield / stunned)
     rooms/<CODE>/ev/<push id>      {k, from, to, d, at}               short events (send / onEvent), cleared by the host
     rooms/<CODE>/kick/<id>         true                               the host removed a player
   Other mechanics keep their own shared data next to these with game.online.ref('name').
   Config: online: { rate: 3, ghosts: true, ghostAlpha: 1, labelRange: 40, dot: '#ffd166' }
   API (game.online, null until a room is joined; the session survives level changes):
     id, room, name, isHost, players() [{id, name, char, on, f, pos, yaw, me}], ghost(id) (the entity), serverNow(),
     ref(sub) (transport ref under the room), set(fields) (my record), flags(bits), send(kind, data, to), onEvent(fn),
     kick(id), clear() (delete the room), leave()
   Start: GK.Online.join({room, name, char, host}) / GK.Online.create(name) → Promise (rejects with a friendly message).
   Transports: 'firebase' (online/ SDK + config), 'fake' (in-memory, shared by every frame of one tab: tests), chosen by
   ?online=fake or GK.Online.use(name). Events: online:join {id}, online:leave {id}, online:players, online:event {k, from, d},
   online:kicked, online:lost. */
(function () {
  'use strict';
  const U = GK.util;

  // ===================== transports =====================
  /** In-memory database with the same small API as Firebase refs. One per browser tab (window.top), so several
      game frames in one test page share it. latency: ms before listeners hear about a write. */
  function FakeNet() {
    this.root = {}; this.listeners = []; this.disc = {}; this.latency = 15; this.seq = 0;
  }
  const split = p => String(p).split('/').filter(Boolean);
  FakeNet.prototype = {
    get(path) { let o = this.root; for (const k of split(path)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; },
    write(path, val) {

      if (val === null) delete o[last]; else o[last] = JSON.parse(JSON.stringify(val));
      this.prune(this.root);
      this.fire();
    },
    prune(o) { for (const k in o) if (o[k] && typeof o[k] === 'object') { this.prune(o[k]); if (!Object.keys(o[k]).length) delete o[k]; } },
    fire() {
      const net = this;

          const old = L.kids || {}, cur = now && typeof now === 'object' ? now : {}, next = {};
          for (const k in cur) {

            if (!(k in old)) { if (L.event === 'child_added') L.fn(new Snap(k, cur[k])); }
            else if (old[k] !== next[k] && L.event === 'child_changed') L.fn(new Snap(k, cur[k]));
          }

      set: v => { net.write(path, v); return Promise.resolve(); },
      update: obj => { for (const k in obj) net.write(path + '/' + k, obj[k]); return Promise.resolve(); },
      remove: () => { net.write(path, null); return Promise.resolve(); },

        let app;
        try { app = firebase.apps.find(a => a.name === 'gk-online') || firebase.initializeApp(cfg, 'gk-online'); } catch (e) { return Promise.reject(e); }
        const db = app.database(), T = { name: 'firebase', db, offset: 0, ref: p => db.ref(p), close: () => { try { db.goOffline(); } catch (e) { /* ignore */ } } };
        db.goOnline();
        db.ref('.info/serverTimeOffset').on('value', s => { T.offset = s.val() || 0; });
        T.onConnected = fn => db.ref('.info/connected').on('value', s => fn(!!s.val()));
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error('No connection to the class server. Check the internet, or play solo.')), timeoutMs || 9000);
          db.ref('.info/connected').on('value', s => { if (s.val()) { clearTimeout(t); resolve(T); } });
        });
      },
    },
  };

  // ===================== the session (one per page, survives level changes) =====================
  const WORDS = ['RUSH', 'BYTE', 'NEON', 'CODE', 'DATA', 'CORE', 'WIFI', 'CHIP', 'PIXEL', 'CLOUD', 'LASER', 'ROBOT'];
  const newId = () => (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, '').slice(0, 10).padEnd(10, '0');
  const clean = code => String(code || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 16);

  const O = GK.Online = {
    session: null,
    choice: null,
    use(name) { this.choice = name; },
    transportName() {
      const q = (location.search.match(/[?&]online=(\w+)/) || [])[1];
      return this.choice || q || 'firebase';
    },
    /** Is online play possible in this copy? (not whether the internet works: join() finds that out) */
    available() { return this.transportName() === 'fake' || !!(window.firebase && window.GK_ONLINE_CONFIG && window.GK_ONLINE_CONFIG.databaseURL); },
    cleanCode: clean,
    /** A new room code like NEON-42 that is not in use yet. */
    create(opts) {
      opts = Object.assign({}, opts, { host: true });
      return this.connect().then(T => {
        const tryCode = n => {
          const code = WORDS[Math.floor(Math.random() * WORDS.length)] + '-' + (10 + Math.floor(Math.random() * 90));
          return T.ref('rooms/' + code + '/meta').once('value').then(s => (s.exists() && n < 6 ? tryCode(n + 1) : code));
        };
        return tryCode(0).then(code => this.join(Object.assign(opts, { room: code })));
      });
    },
    connect() {
      if (this.session && this.session.T) return Promise.resolve(this.session.T);
      const name = this.transportName(), tr = TRANSPORTS[name];
      if (!tr) return Promise.reject(new Error('Unknown online transport "' + name + '"'));
      return tr.connect().then(T => { this.T = T; return T; });
    },
    /** Join (or, with host: true, open) a room. opts: {room, name, char, host, watch (host only: not a player)} */
    join(opts) {
      const room = clean(opts.room);
      if (!/^[A-Z0-9-]{3,16}$/.test(room)) return Promise.reject(new Error('Type the room code your teacher shows (like NEON-42).'));
      return (this.T ? Promise.resolve(this.T) : this.connect()).then(T => {
        const base = 'rooms/' + room;
        return T.ref(base + '/meta').once('value').then(m => {
          if (!opts.host && !m.exists()) throw new Error('There is no room "' + room + '". Check the code with your teacher.');
          // the id survives a refresh (sessionStorage), so a student who reloads keeps their record. The fake transport
          // (tests: several game frames in one tab share sessionStorage) gives every page its own id.
          let id = T.name === 'fake' ? O.pageId || (O.pageId = newId()) : null;
          try { if (!id) id = sessionStorage.getItem('gk.online.id'); } catch (e) { /* storage off */ }
          if (!id || !/^[a-z0-9]{6,20}$/.test(id)) { id = newId(); try { if (T.name !== 'fake') sessionStorage.setItem('gk.online.id', id); } catch (e) { /* storage off */ } }
          const S = this.session = {
            T, room, base, id, name: String(opts.name || 'Player').slice(0, 16), char: opts.char || null, isHost: !!opts.host,
            player: !opts.host || !opts.watch, players: {}, handlers: [], joinedAt: Date.now() + T.offset, game: null, sentAt: 0, last: null,
          };
          if (opts.host) T.ref(base + '/meta').set({ host: id, at: Date.now() + T.offset });
          if (S.player) {
            const me = T.ref(base + '/players/' + id);
            me.update({ name: S.name, char: S.char || '', on: 1, f: 0 });
            me.onDisconnect().update({ on: 0 });   // keep the record: a refresh rejoins with the same id and progress
            T.onConnected(ok => { if (ok && O.session === S) { me.onDisconnect().update({ on: 0 }); me.update({ on: 1 }); } });
          }
          T.ref(base + '/players').on('child_added', s => upsert(S, s.key, s.val(), true));
          T.ref(base + '/players').on('child_changed', s => upsert(S, s.key, s.val(), false));
          T.ref(base + '/players').on('child_removed', s => { delete S.players[s.key]; dropGhost(S, s.key); emit(S, 'online:leave', { id: s.key }); emit(S, 'online:players', {}); });
          T.ref(base + '/ev').on('child_added', s => {
            const e = s.val();
            if (!e || e.from === S.id || (e.to && e.to !== S.id) || (e.at || 0) < S.joinedAt - 2000) return;
            for (const fn of S.handlers) { try { fn(e); } catch (err) { console.error('[GK online] event handler', err); } }
            emit(S, 'online:event', e);
          });
          if (S.player) T.ref(base + '/kick/' + id).on('value', s => { if (s.val()) { emit(S, 'online:kicked', {}); O.leave(true); } });
          if (GK.current) attach(GK.current);
          return S;
        });
      });
    },
    leave(kicked) {
      const S = this.session;
      if (!S) return;
      const T = S.T;
      for (const p of ['/players', '/ev']) T.ref(S.base + p).off();
      if (S.player) { T.ref(S.base + '/kick/' + S.id).off(); if (!kicked) T.ref(S.base + '/players/' + S.id).update({ on: 0 }); }
      for (const id in S.players) dropGhost(S, id);
      this.session = null;
      if (S.game) { S.game.online = null; S.game.emit('online:lost', { kicked: !!kicked }); }
    },
  };

  function emit(S, name, data) { const g = S.game; if (g && g.state) g.emit(name, data); }
  function look(g, char) {
    const list = g && g.characterChoices ? g.characterChoices() : null, c = list && (list.find(x => x.id === char) || list[0]);
    return c ? Object.assign({}, c.look) : {};
  }
  /** A remote player's data arrived (new or changed). */
  function upsert(S, id, v, added) {
    if (!v) return;
    const old = S.players[id], P = S.players[id] = old || { id, pos: null, vel: [0, 0, 0], yaw: 0, at: 0 };
    P.name = v.name; P.char = v.char; P.on = v.on !== 0; P.f = v.f || 0; P.me = id === S.id; P.raw = v;
    if (v.p && !P.me) {
      const n = String(v.p).split(',').map(Number);
      if (n.length >= 6 && n.every(isFinite)) { P.pos = [n[0], n[1], n[2]]; P.yaw = n[3]; P.vel = [n[4], 0, n[5]]; P.at = performance.now(); }
    }
    if (!old) emit(S, 'online:join', { id });
    if (added || !old || old.on !== P.on) emit(S, 'online:players', {});
    if (S.game && S.game.world) ghostOf(S, S.game, id);
  }
  /** The ghost entity drawing a remote player in the current world. */
  function ghostOf(S, g, id) {
    const P = S.players[id];
    if (!P || P.me || !P.pos || !g.world || (g.cfg.online || {}).ghosts === false) return null;
    let e = g.world.get('ghost-' + id);
    if (!e) {
      const cfg = U.merge({ ghostAlpha: 1, labelRange: 40, dot: '#ffd166' }, g.cfg.online);
      e = g.world.add({ id: 'ghost-' + id, type: 'ghost', pos: P.pos.slice(), solid: false });
      e.figure = { look: look(g, P.char), walk: 0, phase: 0 };
      e.label = P.name; e.labelRange = cfg.labelRange; e.labelCls = 'player'; e.mapDot = cfg.dot; e.alpha = cfg.ghostAlpha < 1 ? cfg.ghostAlpha : undefined;
      e.yaw = P.yaw; e.player = id;
    }
    e.label = P.name;
    if (e.figure.char !== P.char) { e.figure = { look: look(g, P.char), walk: 0, phase: 0, char: P.char }; }
    if (P.on) e.show(); else e.hide();
    return e;
  }
  function dropGhost(S, id) { const g = S.game, e = g && g.world && g.world.get('ghost-' + id); if (e) e.remove(); }

  /** Give a (new) level's game the session API and ghosts. */
  function attach(g) {
    const S = O.session;
    if (!S) { g.online = null; return; }
    S.game = g;
    const T = S.T;
    g.online = {
      get id() { return S.id; }, get room() { return S.room; }, get name() { return S.name; }, get isHost() { return S.isHost; }, get isPlayer() { return S.player; },
      players: () => Object.keys(S.players).map(id => S.players[id]),
      player: id => S.players[id] || null,
      ghost: id => g.world && g.world.get('ghost-' + id),
      serverNow: () => Date.now() + (T.offset || 0),
      ref: sub => T.ref(S.base + '/' + sub),
      set: fields => (S.player ? T.ref(S.base + '/players/' + S.id).update(fields) : Promise.resolve()),
      flags: bits => { if (S.player && bits !== S.flags) { S.flags = bits; T.ref(S.base + '/players/' + S.id).update({ f: bits }); } },
      send: (k, d, to) => T.ref(S.base + '/ev').push({ k, from: S.id, to: to || '', d: d == null ? 0 : d, at: Date.now() + (T.offset || 0) }),
      onEvent: fn => { S.handlers.push(fn); return () => { S.handlers = S.handlers.filter(h => h !== fn); }; },
      kick: id => T.ref(S.base + '/kick/' + id).set(true).then(() => T.ref(S.base + '/players/' + id).remove()),
      clear: () => T.ref(S.base).remove(),   // the host deletes the whole room (end of the lesson)
      leave: () => O.leave(),
      transport: T.name,
    };
    for (const id in S.players) ghostOf(S, g, id);
  }

  GK.Prefabs.add('ghost', { defaults: { solid: false, model: null } });

  GK.Mechanics.add('online', {
    configKeys: ['online'],
    setup(game) {
      game.online = null;
      if (O.session) attach(game);
      // handlers registered with onEvent belong to the session; a mechanic re-registering each level must remove its old one
    },
    update(game, dt) {
      const S = O.session;
      if (!S || S.game !== game) return;
      // my position: at most `rate` times a second, and only when something changed (standing still sends nothing)
      if (S.player && game.player && !game.onlineSilent) {
        const rate = (game.cfg.online && game.cfg.online.rate) || 3, now = performance.now(), p = game.player;
        if (now - S.sentAt >= 1000 / rate) {
          const v = [p.pos[0], p.pos[1], p.pos[2], p.yaw, p.vel[0], p.vel[2]].map(x => Math.round(x * 100) / 100);
          const key = v.join(',');
          const L = S.last, moved = !L || Math.abs(v[0] - L[0]) + Math.abs(v[1] - L[1]) + Math.abs(v[2] - L[2]) > 0.04 || Math.abs(v[3] - L[3]) > 0.08 || (Math.abs(v[4]) + Math.abs(v[5]) < 0.1) !== (Math.abs(L[4]) + Math.abs(L[5]) < 0.1);
          if (moved) { S.sentAt = now; S.last = v; S.T.ref(S.base + '/players/' + S.id).update({ p: key }); S.sends = (S.sends || 0) + 1; }
        }
      }
      // other players: dead reckoning (last position + velocity × age), smoothed, limbs swinging with their speed
      const k = 1 - Math.exp(-dt * 10), now2 = performance.now();
      for (const id in S.players) {
        const P = S.players[id];
        if (P.me || !P.pos) continue;
        const e = ghostOf(S, game, id);
        if (!e) continue;
        const age = Math.min(0.6, (now2 - P.at) / 1000), tx = P.pos[0] + P.vel[0] * age, tz = P.pos[2] + P.vel[2] * age;
        if (Math.hypot(tx - e.pos[0], tz - e.pos[2]) > 12) e.pos = [tx, P.pos[1], tz];   // teleported / respawned: jump there
        else { e.pos[0] += (tx - e.pos[0]) * k; e.pos[1] += (P.pos[1] - e.pos[1]) * k; e.pos[2] += (tz - e.pos[2]) * k; }
        let dy = P.yaw + Math.PI - e.yaw;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        e.yaw += dy * k;
        const sp = Math.hypot(P.vel[0], P.vel[2]);
        e.figure.walk += ((sp > 0.5 ? 1 : 0) - e.figure.walk) * k;
        e.figure.phase = (e.figure.phase || 0) + dt * sp * 3.2;
        e.figure.air = !!(P.f & 1);
        e.flags = P.f;
      }
    },
  });
})();

</script>
<script>/* mechanics/quiz-gates/quiz-gates.js */
/* Game Kit · mechanics/quiz-gates   (needs: puzzles, world-objects; spatial)
   Question terminals that control the way forward: firewall gates you open with a right answer, optional "case"
   terminals worth more, a once-per-round comeback challenge, and shortcut doors. Every player gets their own order
   of questions (seeded by game.quizSeed, e.g. the online player id), so neighbours cannot copy.
   Config  quiz: {
     bank: {easy: [Q], medium: [Q], hard: [Q], case: [Q], comeback: [Q]},   Q = {q, options, answer (index), why, title}
                                                                             or {q, order: [steps in the right order]}
     gates: ['easy', 'easy', 'medium', …]   difficulty of gate 1, 2, … (the last one repeats)
     reward: {easy: 10, medium: 15, hard: 20, case: 25, comeback: 60, shortcut: 10},
     revealCost: 0.5   (share of the reward a "Show answer" costs, at least 5; gates and shortcuts only)
     freeze: 4         (seconds locked out after a wrong answer: then a NEW question)
     retry: 0.5        (reward share after a wrong answer at the same terminal)
     kind: 'academic'  (scoring kind of the points) }
   Entity {type: 'qterm', pool: 'gate' | 'case' | 'comeback' | 'shortcut', gate: N, opens: ['doorId', …], flag: 'name'}
     gate: a right answer (or a revealed one) sets flag `gate-N-open` and opens `opens` (and every door-N-…);
     case / comeback: ONE try (wrong = closed for this round); shortcut: opens `opens`, points to kind 'strategy'.
   Emits quiz:correct {pool, gate, revealed, first, points, id} · quiz:wrong {pool, gate, id} · quiz:reveal {cost}.
   game.state.quiz = {correct, wrong, reveals, done: {terminalId}, tries: {terminalId}}.
   Adds game.quizSeed (set it before a level starts) and GK.QuizDeck (who saw which question, kept across levels). */
(function () {
  'use strict';
  const U = GK.util, P = GK.Prefabs;
  const SCREEN = { gate: '#ff4d6d', case: '#4cc9f0', comeback: '#ffd166', shortcut: '#7cfc00' };

  /** The questions not seen yet, in this player's own order (kept for the page, so later rounds bring new ones). */
  const Deck = GK.QuizDeck = {
    seed: 'player', used: {}, order: {},
    reset(seed) { this.seed = String(seed || 'player'); this.used = {}; this.order = {}; },
    hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
    next(bank, pool) {
      const list = bank[pool] || [];
      if (!list.length) return null;
      if (!this.order[pool]) {
        const r = U.rng(this.hash(this.seed + ':' + pool));
        this.order[pool] = list.map((q, i) => i).sort(() => r() - 0.5);
        this.used[pool] = 0;
      }
      if (this.used[pool] >= list.length) { this.used[pool] = 0; }   // everything seen: start the list again
      const i = this.order[pool][this.used[pool]++];
      return { q: list[i], index: i };
    },
  };

  /** A bank question → a puzzle definition (choice or order), options shuffled per player. */
  function toPuzzle(Q, pool, seed, title) {
    const r = U.rng(Deck.hash(seed + ':' + (Q.q || '').slice(0, 40)));
    if (Q.order) return { type: 'order', title, question: Q.q, items: Q.order, seed: Deck.hash(seed) % 997, wide: pool === 'case' };
    const idx = Q.options.map((o, i) => i).sort(() => r() - 0.5);
    return { type: 'choice', title, question: Q.q, options: idx.map(i => Q.options[i]), correct: idx.indexOf(Q.answer), wide: pool === 'case' || (Q.q || '').length > 140 };
  }

  P.add('qterm', {
    defaults: { model: 'terminal', solid: true, pool: 'gate' },
    init(e, game) {
      const d = e.def, R = Object.assign({ case: 25, comeback: 60, shortcut: 10 }, ((game && game.cfg.quiz) || {}).reward);
      e.setLook({ screen: SCREEN[d.pool] || '#2ecc71', color: d.pool === 'comeback' ? '#4a3b10' : '#1e2433' });
      if (!e.name) e.name = { gate: 'Firewall terminal', case: 'Cyber Case', comeback: 'COMEBACK CHALLENGE', shortcut: 'Shortcut lock' }[d.pool] || 'Terminal';
      // short, big, glowing labels for the optional challenges (seen from far away), plus a beam of light above them
      // short labels (kids do not read long ones) and a soft beam of light above the optional challenges
      if (e.label == null) e.label = { gate: '❓', case: '⭐ +' + R.case, comeback: '⭐ +' + R.comeback, shortcut: '⚡' }[d.pool] || null;
      e.labelCls = d.pool === 'gate' ? 'quiz-gate' : d.pool === 'comeback' ? 'quiz-bonus big' : 'quiz-bonus';
      e.labelRange = d.pool === 'gate' ? 25 : 40;
      if (d.pool !== 'gate' && e.world) e.world.add({ id: e.id + '-beam', type: 'decoration', model: 'beacon', pos: e.pos.slice(), solid: false, look: { color: SCREEN[d.pool] }, alpha: 0.18, spin: 0.8 });
      e.interact = [{ type: 'quizTerminal', prompt: d.pool === 'gate' ? 'Answer to open the firewall' : d.pool === 'shortcut' ? 'Answer to open the shortcut' : 'Take the challenge' }];
    },
  });

  GK.Models.add('beacon', o => {   // a tall beam of light with a star on top: "come here!"
    const c = o.color || '#ffd166', g = new GK.Geo().cyl(0, 1.8, 0, 0.22, 7, c, { seg: 8, glow: 0.8, noBottom: true });
    for (let i = 0; i < 4; i++) g.add(new GK.Geo().box(0, 0, 0, 0.18, 0.9, 0.18, c, { glow: 0.8 }).rotZ(i * Math.PI / 4).move(0, 3.2, 0));
    return g;
  });
  const CSS = '.gk-label.quiz-bonus{font:900 19px system-ui;color:#1a1a1a;background:#ffd166;border:2px solid #fff;padding:3px 12px;border-radius:12px;' +
    'box-shadow:0 0 10px rgba(255,209,102,.6);animation:gkBonus 1.4s ease-in-out infinite alternate}.gk-label.quiz-bonus.big{font-size:23px}' +
    '.gk-label.quiz-gate{font:900 20px system-ui;color:#fff;background:rgba(255,77,109,.9);border:2px solid #ffb3c1;padding:2px 10px;border-radius:50%}' +
    '@keyframes gkBonus{to{margin-top:-5px}}';
  function css() { if (document.getElementById('gk-quiz-css')) return; const st = document.createElement('style'); st.id = 'gk-quiz-css'; st.textContent = CSS; document.head.appendChild(st); }

  GK.Interactions.add('quizTerminal', {
    prompt: 'Answer',
    run(g, ent, def, done) {
      const Qs = g.state.quiz, d = ent.def, cfg = g.cfg.quiz || {}, now = g.state.time;
      const finishDone = () => { if (done) done(false); };
      if (g.quizBlocked && g.quizBlocked(ent)) { finishDone(); return; }
      if (Qs.done[ent.id]) { g.ui.toast(d.pool === 'gate' || d.pool === 'shortcut' ? 'Already open: go through!' : 'You already did this one.', 'good'); finishDone(); return; }
      if (Qs.locked[ent.id] > now) { g.ui.toast('🔒 Rebooting… wait ' + Math.ceil(Qs.locked[ent.id] - now) + ' s', 'bad'); finishDone(); return; }
      if ((d.pool === 'case' || d.pool === 'comeback') && Qs.tries[ent.id]) { g.ui.toast('This challenge is closed for this round.', 'bad'); finishDone(); return; }
      const pool = d.pool === 'gate' ? (cfg.gates || ['easy'])[Math.min((d.gate || 1) - 1, (cfg.gates || ['easy']).length - 1)] : d.pool === 'shortcut' ? 'hard' : d.pool;
      const pick = Deck.next(cfg.bank || {}, pool);
      if (!pick) { g.ui.toast('No questions for "' + pool + '"', 'bad'); finishDone(); return; }
      const R = Object.assign({ easy: 10, medium: 15, hard: 20, case: 25, comeback: 60, shortcut: 10 }, cfg.reward);
      const base = d.pool === 'gate' ? R[pool] : R[d.pool];
      const tries = Qs.tries[ent.id] || 0, reward = Math.round(base * (tries ? (cfg.retry == null ? 0.5 : cfg.retry) : 1));
      const canReveal = d.pool === 'gate' || d.pool === 'shortcut', cost = Math.max(5, Math.round(base * (cfg.revealCost == null ? 0.5 : cfg.revealCost)));
      const kind = d.pool === 'shortcut' ? 'strategy' : (cfg.kind || 'academic');
      const title = { gate: '🔥 FIREWALL ' + (d.gate || '') + ' · ' + pool.toUpperCase(), case: '🔎 CYBER CASE: ' + (pick.q.title || 'Investigate'), comeback: '⭐ COMEBACK CHALLENGE', shortcut: '⚡ SHORTCUT LOCK · HARD' }[d.pool];
      const pz = Object.assign(toPuzzle(pick.q, d.pool, Deck.seed + ':' + ent.id + ':' + tries, title), {
        id: ent.id + ':q' + tries, points: reward, kind, maxAttempts: 1, penalty: 0, repeatable: true,
        reveal: canReveal ? cost : 0, revealKind: cfg.kind || 'academic', solvedText: '✔ Correct! ' + (reward ? '+' + reward : ''),
      });
      if (pick.q.why) pz.wrongText = '✘ Not quite. ' + pick.q.why;
      let revealed = false;
      const offR = g.on('puzzle:revealed', ev => { if (ev.id === pz.id) { revealed = true; Qs.reveals++; g.emit('quiz:reveal', { cost: ev.cost, id: ent.id }); } });
      const offS = g.on('puzzle:solved', ev => {
        if (ev.id !== pz.id) return;
        Qs.done[ent.id] = true; Qs.correct++;
        if (d.pool === 'gate') {
          g.setFlag('gate-' + d.gate + '-open', true);
          for (const e of g.world.entities) if (e.type === 'door' && (U.list(d.opens).indexOf(e.id) >= 0 || e.id.indexOf('door-' + d.gate + '-') === 0)) { if (e.unlock) e.unlock(g); if (e.setOpen) e.setOpen(g, true); }
          for (const e of g.world.entities) if (e.type === 'qterm' && e.def.pool === 'gate' && e.def.gate === d.gate) Qs.done[e.id] = true;
        } else for (const id of U.list(d.opens)) { const e = g.world.get(id); if (e && e.setOpen) { if (e.unlock) e.unlock(g); e.setOpen(g, true); } }
        if (d.flag) g.setFlag(d.flag, true);
        g.emit('quiz:correct', { pool: d.pool, gate: d.gate || 0, revealed, first: !tries && !revealed, points: revealed ? 0 : reward, id: ent.id, difficulty: pool });
      });
      const offF = g.on('puzzle:failed', ev => {
        if (ev.id !== pz.id) return;
        Qs.wrong++; Qs.tries[ent.id] = tries + 1;
        const fz = cfg.freeze == null ? 4 : cfg.freeze;
        if (d.pool === 'gate' || d.pool === 'shortcut') { Qs.locked[ent.id] = g.state.time + fz + 0.9; if (g.player) g.player.stun = Math.max(g.player.stun || 0, fz + 0.9); }
        g.emit('quiz:wrong', { pool: d.pool, gate: d.gate || 0, id: ent.id, freeze: fz });
      });
      g.openPuzzle(pz, solved => { offR(); offS(); offF(); if (done) done(solved); }, ent);
    },
  });

  GK.Mechanics.add('quiz-gates', {
    configKeys: ['quiz'],
    validate(game, report) {
      const b = (game.cfg.quiz || {}).bank || {};
      for (const pool in b) b[pool].forEach((Q, i) => {
        if (Q.order) { if (!(Q.order.length > 1)) report('quiz.bank.' + pool + '[' + i + ']: an order question needs 2+ steps', 'error'); return; }
        if (!Q.q || !Array.isArray(Q.options) || !(Q.answer >= 0 && Q.answer < Q.options.length)) report('quiz.bank.' + pool + '[' + i + ']: needs q, options and a valid answer index', 'error');
      });
      if (game.world) for (const e of game.world.entities) if (e.type === 'qterm' && e.def.pool !== 'gate' && e.def.pool !== 'shortcut' && !(b[e.def.pool] || []).length) report('Terminal ' + e.id + ': no questions in quiz.bank.' + e.def.pool, 'error');
    },
    answers(game) {
      const out = [], b = (game.cfg.quiz || {}).bank || {};
      for (const pool in b) b[pool].forEach(Q => out.push({ where: pool + ': ' + String(Q.q).slice(0, 60), answer: Q.order ? Q.order.join(' → ') : Q.options[Q.answer] }));
      return out;
    },
    setup(game) {
      css();
      game.state.quiz = { correct: 0, wrong: 0, reveals: 0, done: {}, tries: {}, locked: {} };
      if (game.quizSeed && game.quizSeed !== Deck.seed) Deck.reset(game.quizSeed);
    },
    restore(game) { if (!game.state.quiz) game.state.quiz = { correct: 0, wrong: 0, reveals: 0, done: {}, tries: {}, locked: {} }; },
  });
})();

</script>
<script>/* mechanics/gadgets/gadgets.js */
/* Game Kit · mechanics/gadgets   (needs: powerups, terrain; spatial)
   Cartoon gadgets for party races: 3 slots (1 offence/trap · 2 defence · 3 utility), chosen on a loadout screen,
   used with keys 1 2 3 (or by clicking the slot). Charges per round, cooldowns, counters, recovery protection.
     1  🥊 Spring Glove  🎳 Bowling Ball  🍌 Banana Peel (trap)  🦠 Lag Virus (cloud)
     2  🫧 Bubble Shield  👻 Ghost Mode  ⚓ Anchor Boots
     3  🚀 Rocket Shoes   📡 Scanner     🟣 Jump Pad (anyone can use it)
   Nothing is permanent: knock-backs and slow-downs last a second or three, and after a big hit you are protected
   for 2.5 s (no chain attacks). Every attack has a counter (shown on the loadout screen).
   Mouse: left click = use the selected item (the wheel chooses), or PUNCH with empty hands; right click = punch.
   Config  gadgets: { charges: 2, max: 3, choices: [[slot 1 ids], [slot 2 ids], [slot 3 ids]], recover: 2.5, punchCooldown: 0.7,
                      pickup: true (no loadout: random gadgets from ❓ boxes {type: 'itembox'}, one use each, 3 slots),
                      weights: {id: [weight for the leader, weight for the last racer]} (game.raceRank() 0..1) }
   Other players: another mechanic provides them (works alone too, with nobody to hit):
     game.rivals() → [{id, name, pos, yaw, ent}]  ·  game.hitRival(id, effect) (deliver an effect) ·
     game.shareGadget(obj) (tell the room about a ball / trap / cloud / pad) — mechanics/race does this online and for bots.
   Incoming: game.gadgetEffect(effect, fromId, fromName) → 'hit' | 'blocked' | 'immune'; game.gadgetObject(obj) spawns a
   shared object. Emits gadget:use {id}, gadget:landed {id, on}, gadget:blocked {id}, gadget:hitme {id, from}.
   Points: kind 'strategy' (a hit +10, a block +6).
   Adds GK.Gadgets (definitions; add more with GK.Gadgets.add(id, def)), game.gadgets {slots, use(i), give(slot, n),
   chooser(opts), enabled()}, game.protect(), game.anchored(). */
(function () {
  'use strict';
  const U = GK.util, V = GK.vec, M = GK.Models, P = GK.Prefabs, G = () => new GK.Geo();
  const KINDS = GK.PowerUps;
  Object.assign(KINDS, {
    ghostmode: { label: '👻 GHOST', color: '#c3b5ff', duration: 4 },
    anchor: { label: '⚓ ANCHOR', color: '#9aa4b1', duration: 6 },
    rocket: { label: '🚀 ROCKET', color: '#ff7a1a', duration: 3.5 },
    scan: { label: '📡 SCAN', color: '#7cfc00', duration: 8 },
    slow: { label: '🦠 LAGGING', color: '#38d39f', duration: 3 },
    safe: { label: '✨', color: '#ffffff', duration: 2.5, quiet: true },
    jetpack: { label: '🚀 FLY', color: '#ff7a1a', duration: 3, quiet: true },
    frozen: { label: '🧊', color: '#bfefff', duration: 2.2, quiet: true },
    balloon: { label: '🎈', color: '#ff4fd8', duration: 2.6, quiet: true },
  });

  // ---------- models ----------
  M.add('glove', o => G().box(0, -0.25, 0, 0.5, 0.5, 0.5, o.color || '#e53e3e', { glow: 0.3 }).box(0.2, -0.05, 0.05, 0.22, 0.25, 0.3, '#e53e3e').box(0, -0.15, -0.6, 0.12, 0.12, 0.8, '#a0aec0'));
  M.add('bowlingBall', o => G().sphere(0, 0.45, 0, 0.45, o.color || '#2b2d42', { seg: 10, rings: 7 }).box(0.12, 0.7, 0.3, 0.08, 0.08, 0.12, '#ff4fd8', { glow: 1 }).box(-0.08, 0.78, 0.32, 0.08, 0.08, 0.12, '#ff4fd8', { glow: 1 }));
  M.add('banana', o => {
    const g = G().cyl(0, 0, 0, 0.75, 0.03, '#ffd166', { seg: 14, glow: 0.35 });
    for (const a of [0, 2.1, 4.2]) g.add(G().box(0, 0.06, 0.25, 0.16, 0.08, 0.5, '#ffe066', { glow: 0.2 }).rotY(a));
    return g.box(0, 0.06, 0, 0.18, 0.14, 0.18, '#9c6b1e');
  });
  M.add('virusCloud', o => {
    const g = G(), c = o.color || '#38d39f';
    for (const [x, y, z, r] of [[0, 1.2, 0, 1.6], [1.4, 1, 0.6, 1.1], [-1.3, 1.1, -0.5, 1.2], [0.3, 1.9, -1, 1], [-0.5, 0.8, 1.3, 1]]) g.sphere(x, y, z, r, c, { glow: 0.6, seg: 8, rings: 5 });
    return g;
  });
  M.add('itemBox', o => {   // a glowing ❓ box (rainbow edges)
    const c = o.color || '#ffd166', g = G().box(0, 0, 0, 1.1, 1.1, 1.1, '#7c5cff', { glow: 0.35 });
    for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) g.box(x * 0.55, 0, z * 0.55, 0.12, 1.12, 0.12, c, { glow: 1 });
    for (const y of [0, 1.1]) g.box(0, y - 0.06, 0, 1.22, 0.12, 1.22, c, { glow: 1 });
    for (const f of [1, -1]) {   // a "?" on two faces

        .box(0.03, 0.47, f * 0.56, 0.12, 0.12, 0.04, '#ffffff', { glow: 1 }).box(0, 0.22, f * 0.56, 0.12, 0.12, 0.04, '#ffffff', { glow: 1 });

  /** ❓ box: touch it during the race for a random gadget (pickup mode); it comes back after `back` seconds. */

    update(e, dt) { if (e.state.backT > 0) { e.state.backT -= dt; if (e.state.backT <= 0) e.show(); } },
  });
  M.add('iceShot', () => G().box(0, -0.25, 0, 0.5, 0.5, 0.5, '#bfefff', { glow: 0.9 }).box(0, -0.12, -0.5, 0.2, 0.2, 0.6, '#ffffff', { glow: 1 }));
  M.add('balloonShot', () => G().sphere(0, 0.1, 0, 0.45, '#ff4fd8', { glow: 0.5, seg: 8, rings: 6 }).box(0, -0.6, 0, 0.03, 0.4, 0.03, '#ffffff'));
  M.add('bubble', o => G().sphere(0, 0, 0, 1, o.color || '#7fdbff', { glow: 0.7, seg: 12, rings: 8 }));

  // ---------- gadget definitions ----------
  const D = GK.Gadgets = {
    list: {},
    add(id, def) { this.list[id] = Object.assign({ id, slot: 1, cd: 6 }, def); },
    get(id) { return this.list[id] || null; },
    pick: null,   // the loadout chosen on this page (kept between rounds): [id, id, id]
  };
  /** The nearest other player in front of you (within range, inside the cone), or null. */
  function aim(g, range, cone) {
    const me = g.player, f = me.forward(), fl = Math.hypot(f[0], f[2]) || 1, fx = f[0] / fl, fz = f[2] / fl;
    let best = null, bd = range;
    for (const r of rivalsOf(g)) {
      const dx = r.pos[0] - me.pos[0], dz = r.pos[2] - me.pos[2], d = Math.hypot(dx, dz);
      if (d < bd && d > 0.01 && (dx * fx + dz * fz) / d > cone && Math.abs(r.pos[1] - me.pos[1]) < 3) { bd = d; best = { r, dir: [dx / d, dz / d], d }; }
    }
    return best;
  }
  const miss = (g, icon) => { g.ui.toast(icon + ' ✖', 'bad'); return false; };
  D.add('glove', { slot: 1, icon: '🥊', name: 'Mega Glove', text: 'Punch far: the nearest player in front of you flies back.', counter: 'Bubble or dodge.', cd: 1,
    use(g) {
      const t = aim(g, 8, 0.45);
      if (!t) return miss(g, '🥊');
      fx_(g, 'glove', g.player.pos, t.dir);
      g.hitRival(t.r.id, { k: 'knock', g: 'glove', dir: t.dir, power: 15, stun: 1.1, up: 6 });
      return true;
    } });
  D.add('bowling', { slot: 1, icon: '🎳', name: 'Bowling', text: 'Rolls ahead and knocks everyone over.', counter: 'Jump over it.', cd: 1,
    use(g) { const f = flatFwd(g); g.audio.play('whoosh'); return share(g, { t: 'ball', x: g.player.pos[0] + f[0] * 1.2, y: g.player.pos[1], z: g.player.pos[2] + f[1] * 1.2, dx: f[0], dz: f[1] }); } });
  D.add('banana', { slot: 1, icon: '🍌', name: 'Banana', text: 'Drop it behind you: whoever steps on it slips.', counter: 'Look down!', cd: 1,
    use(g) { const f = flatFwd(g); return share(g, { t: 'banana', x: g.player.pos[0] - f[0] * 1.6, y: g.player.pos[1], z: g.player.pos[2] - f[1] * 1.6 }); } });
  D.add('freeze', { slot: 1, icon: '❄️', name: 'Freeze', text: 'The player in front of you becomes an ice cube for 2 s.', counter: 'Bubble.', cd: 1,
    use(g) {
      const t = aim(g, 16, 0.5);
      if (!t) return miss(g, '❄️');
      fx_(g, 'freeze', g.player.pos, t.dir);
      g.hitRival(t.r.id, { k: 'freeze', g: 'freeze', seconds: 2.2 });

    } });
  D.add('balloon', { slot: 1, icon: '🎈', name: 'Balloon', text: 'A balloon lifts the player in front of you into the air.', counter: 'Bubble.', cd: 1,
    use(g) {
      const t = aim(g, 16, 0.5);
      if (!t) return miss(g, '🎈');
      fx_(g, 'balloon', g.player.pos, t.dir);
      g.hitRival(t.r.id, { k: 'lift', g: 'balloon', seconds: 2.6 });

    } });
  D.add('bubble', { slot: 2, icon: '🫧', name: 'Bubble', text: '5 s: nothing can hit you.', counter: 'Wait 5 s.', cd: 1,
    use(g) { g.activatePower('shield', 5, null, true); g.ui.toast('🫧 5 s', 'good'); return true; } });
  D.add('jetpack', { slot: 3, icon: '🚀', name: 'Jetpack', text: 'Fly for 3 seconds!', counter: 'A glove still hits you.', cd: 1,

  D.add('scanner', { slot: 3, icon: '📡', name: 'Scanner', text: '8 s: see every trap, fake glass and hidden data.', counter: '', cd: 1,
    use(g) { g.activatePower('scan', 8, null, true); g.ui.toast('📡 8 s', 'good'); return true; } });
  D.add('jumppad', { slot: 3, icon: '🟣', name: 'Jump Pad', text: 'A bounce pad in front of you (anyone can use it).', counter: '', cd: 1,
    use(g) { const f = flatFwd(g); return share(g, { t: 'pad', x: g.player.pos[0] + f[0] * 2.5, y: g.player.pos[1], z: g.player.pos[2] + f[1] * 2.5, dx: f[0], dz: f[1] }); } });
  // older items, kept for games that list them in gadgets.choices
  D.add('virus', { slot: 1, icon: '🦠', name: 'Lag Virus', text: 'A green cloud ahead: players inside run slower.', counter: 'Go around it.', cd: 9,
    use(g) {
      const f = flatFwd(g), eye = g.player.eye(), hit = g.world.raycast([eye[0], g.player.pos[1] + 1, eye[2]], [f[0], 0, f[1]], 10), d = Math.max(2, (hit.hit ? hit.t : 10) - 1);
      return share(g, { t: 'virus', x: g.player.pos[0] + f[0] * d, y: g.player.pos[1], z: g.player.pos[2] + f[1] * d });
    } });
  D.add('ghost', { slot: 2, icon: '👻', name: 'Ghost', text: '4 s: things go through you.', counter: 'Wait.', cd: 12, use(g) { g.activatePower('ghostmode', 4, null, true); return true; } });
  D.add('anchor', { slot: 2, icon: '⚓', name: 'Anchor', text: '6 s: nobody can push you.', counter: 'Banana.', cd: 9, use(g) { g.activatePower('anchor', 6, null, true); return true; } });
  D.add('rocket', { slot: 3, icon: '👟', name: 'Rocket Shoes', text: 'Run faster for 3.5 s.', counter: '', cd: 8, use(g) { g.activatePower('rocket', 3.5, null, true); g.activatePower('speed', 3.5, null, true); return true; } });

  // ---------- helpers ----------
  function flatFwd(g) { const f = g.player.forward(), l = Math.hypot(f[0], f[2]) || 1; return [f[0] / l, f[2] / l]; }
  const rivalsOf = g => (g.rivals ? g.rivals() : []);
  let seq = 0;
  /** Spawn a shared object here and tell the room (online) or the rivals (solo). */
  function share(g, o) {

    e.state.t = 0; e.state.dir = dir; e.state.life = short ? 0.14 : 0.35; e.state.speed = short ? 14 : 22;

        if (mine) for (const r of rivalsOf(g)) if (r.bot && !S['hit' + r.id] && Math.hypot(r.pos[0] - nx, r.pos[2] - nz) < 1.1) { S['hit' + r.id] = 1; g.hitRival(r.id, { k: 'knock', g: 'bowling', dir: [o.dx, o.dz], power: 11, stun: 1.2 }); }
      } else if (o.t === 'banana') {
        e.hi = scanning ? 0.5 + Math.sin(S.age * 8) * 0.3 : 0;
        e.label = scanning ? '⚠ TRAP' : null;
        if (!mine && !S.done && Math.hypot(me.pos[0] - e.pos[0], me.pos[2] - e.pos[2]) < 0.85 && Math.abs(me.pos[1] - e.pos[1]) < 0.6) {
          S.done = true;
          const f = flatFwd(g), r = landOn(g, { k: 'slip', g: 'banana', dir: [f[0], f[1]], power: 4, stun: 1.2, up: 2.5 }, o);

        if (mine) for (const r of rivalsOf(g)) if (r.bot && !S.done && Math.hypot(r.pos[0] - e.pos[0], r.pos[2] - e.pos[2]) < 0.9) { S.done = true; g.hitRival(r.id, { k: 'slip', g: 'banana', power: 4, stun: 1.2 }); e.remove(); }
      } else if (o.t === 'virus') {
        const R = 3.6;
        if (!mine && !S.done && Math.hypot(me.pos[0] - e.pos[0], me.pos[2] - e.pos[2]) < R) { const r = landOn(g, { k: 'slow', g: 'virus', seconds: 3 }, o); if (r !== 'immune') S.done = true; }
        if (mine) for (const r of rivalsOf(g)) if (r.bot && !S['hit' + r.id] && Math.hypot(r.pos[0] - e.pos[0], r.pos[2] - e.pos[2]) < R) { S['hit' + r.id] = 1; g.hitRival(r.id, { k: 'slow', g: 'virus', seconds: 3 }); }

      }
    },
  });
  /** An effect from a shared object reaches me. */
  function landOn(g, eff, o) { const r = g.gadgetEffect(eff, o.o, o.n); if (r === 'hit' && g.reportHit) g.reportHit(o.o, eff.g); return r; }

  // ---------- HUD + chooser styles ----------
  const CSS = '.gk-gadgets{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto;z-index:3}' +
    '.gk-gslot{position:relative;width:86px;height:78px;border-radius:14px;background:rgba(10,14,28,.78);border:2px solid rgba(255,255,255,.18);color:#fff;font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}' +
    '.gk-gslot .ic{font-size:30px;line-height:1}.gk-gslot .k{position:absolute;left:6px;top:4px;font-size:11px;opacity:.8;background:rgba(255,255,255,.15);border-radius:4px;padding:0 5px}' +
    '.gk-gslot .ch{position:absolute;right:6px;top:4px;font-size:12px;color:#ffd166}.gk-gslot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.66) var(--p),transparent 0);pointer-events:none}' +
    '.gk-gslot.empty{opacity:.45}.gk-gslot.ready{border-color:#7cfc00;box-shadow:0 0 14px rgba(124,252,0,.35)}.gk-gslot.off{filter:grayscale(1);opacity:.5}' +
    '.gk-gslot.sel{border-color:#ffd166;box-shadow:0 0 0 3px #ffd166,0 0 18px rgba(255,209,102,.6);transform:translateY(-6px)}.gk-ghint{align-self:center;font:800 15px system-ui;color:#fff;background:rgba(10,14,28,.7);padding:6px 10px;border-radius:10px;white-space:nowrap}' +
    '.gk-label.itembox{font-size:30px;background:none;text-shadow:0 0 14px #ffd166,0 0 30px #ffd166;animation:gkBob 0.8s ease-in-out infinite alternate}@keyframes gkBob{to{margin-top:-6px}}' +
    '.gk-gslot .nm{font-size:10px;opacity:.85;margin-top:4px;white-space:nowrap}.gk-gslot.fresh{border-color:#ffd166;box-shadow:0 0 22px #ffd166;animation:gkpop .35s}@keyframes gkpop{50%{transform:scale(1.25)}}' +
    '.gk-load{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gk-load h3{margin:0 0 6px;font-size:14px;letter-spacing:.06em;opacity:.85}' +
    '.gk-gcard{display:block;width:100%;text-align:left;margin:0 0 8px;padding:9px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:inherit;cursor:pointer;font:inherit}' +
    '.gk-gcard b{font-size:15px}.gk-gcard .ic{font-size:22px;margin-right:6px}.gk-gcard p{margin:4px 0 0;font-size:12.5px;opacity:.9}.gk-gcard small{display:block;margin-top:4px;font-size:11.5px;opacity:.75}' +
    '.gk-gcard.on{border-color:#7cfc00;background:rgba(124,252,0,.12)}.gk-load-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}' +
    '.gk-load-time{font:800 22px system-ui;color:#ffd166}.gk-load-time.final{color:#ff4d6d;animation:gkpulse .5s infinite alternate}@keyframes gkpulse{to{transform:scale(1.08)}}' +
    '@media (max-width:760px){.gk-load{grid-template-columns:1fr}}';
  function css() { if (document.getElementById('gk-gadgets-css')) return; const s = document.createElement('style'); s.id = 'gk-gadgets-css'; s.textContent = CSS; document.head.appendChild(s); }

  GK.Mechanics.add('gadgets', {
    configKeys: ['gadgets'],
    setup(game) {
      const cfg = U.merge({ charges: 2, max: 3, recover: 2.5, choices: [['glove', 'bowling', 'banana', 'freeze', 'balloon'], ['bubble'], ['jetpack', 'jumppad', 'scanner']] }, game.cfg.gadgets);
      css();
      if (!D.pick) D.pick = cfg.choices.map(c => c[0]);
      const GG = game.gadgets = {
        cfg,
        // pickup mode (config pickup: true): no loadout; slots start empty and fill from ❓ boxes, one use each
        slots: cfg.pickup ? [0, 1, 2].map(() => ({ id: null, charges: 0, cd: 0 })) : D.pick.map(id => ({ id, charges: cfg.charges, cd: 0 })),
        enabled: () => true,   // mechanics/race: only while racing
        use(i) {
          const s = GG.slots[i], d = s && D.get(s.id);
          if (s && !s.id && cfg.pickup && game.state.mode === 'playing') { GG.punch(); return false; }
          if (!d || game.state.mode !== 'playing') return false;
          if (!GG.enabled()) return false;
          if (s.cd > 0) { game.audio.play('deny'); return false; }
          if (s.charges <= 0) { game.ui.toast(d.icon + ' No charges: answer questions to earn more!', 'bad'); game.audio.play('deny'); return false; }
          if (!d.use(game)) { s.cd = 1; return false; }
          s.charges--; s.cd = cfg.pickup ? 0.4 : d.cd;
          const used = s.id;
          if (cfg.pickup && s.charges <= 0) { s.id = null; const nx = GG.slots.findIndex(x => x.id); if (nx >= 0) GG.sel = nx; }   // used up: the slot is free for the next box
          game.emit('gadget:use', { id: used });
          GG.draw(true);
          return true;
        },
        sel: 0, punchCd: 0,
        /** Everyone can punch, any time: the nearest player close in front is pushed back a little. */
        punch() {
          if (!GG.enabled() || GG.punchCd > 0 || game.state.mode !== 'playing') return false;
          GG.punchCd = cfg.punchCooldown || 0.7;
          const t = aim(game, 2.8, 0.35), f = flatFwd(game);
          fx_(game, 'punch', game.player.pos, t ? t.dir : f, true);
          game.emit('gadget:punch', {});
          if (!t) return false;
          game.hitRival(t.r.id, { k: 'knock', g: 'punch', dir: t.dir, power: 9, stun: 0.55, up: 3.5 });
          return true;
        },
        /** A random gadget into the first free slot (pickup mode). Racers further behind get better ones (like kart games). */
        giveRandom() {
          const i = GG.slots.findIndex(x => !x.id);
          if (i < 0) { game.ui.toast('🎒 FULL', 'bad'); return false; }
          const r = game.raceRank ? game.raceRank() : 0.5, pool = cfg.choices.flat(), W = cfg.weights || {};
          const wt = id => { const w = W[id] || [1.5, 1.5]; return w[0] * (1 - r) + w[1] * r; };
          let x = Math.random() * pool.reduce((a, id) => a + wt(id), 0), id = pool[0];
          for (const k of pool) { x -= wt(k); if (x <= 0) { id = k; break; } }
          GG.slots[i] = { id, charges: 1, cd: 0, fresh: 1.2 };
          const d = D.get(id);
          game.ui.toast('🎁 ' + d.icon + ' ' + d.name, 'good');
          if (!GG.slots[GG.sel] || !GG.slots[GG.sel].id) GG.sel = i;
          game.audio.play('pickup');
          game.emit('gadget:got', { id, slot: i });
          GG.draw(true);
          return true;
        },
        /** Earn charges: slot index (0-2), 'random' or 'all'. */
        give(slot, n) {
          if (cfg.pickup) { for (let k = 0; k < (slot === 'all' ? 2 : n || 1); k++) GG.giveRandom(); return; }
          const list = slot === 'all' ? [0, 1, 2] : [slot === 'random' || slot == null ? Math.floor(Math.random() * 3) : slot];
          for (const i of list) { const s = GG.slots[i]; if (s) s.charges = Math.min(cfg.max, s.charges + (n || 1)); }
          if (list.length) { const d = D.get(GG.slots[list[0]].id); game.ui.toast('+' + (n || 1) + ' charge' + (list.length > 1 ? ' for every gadget' : ': ' + (d ? d.icon + ' ' + d.name : '')), 'good'); }
        },
        setLoadout(ids) { D.pick = ids.slice(0, 3); GG.slots = D.pick.map(id => ({ id, charges: cfg.charges, cd: 0 })); GG.draw(true); },
        chooser: opts => chooser(game, opts || {}),
        draw(force) { drawHud(game, force); },
      };
      game.state.gstats = { hits: 0, blocks: 0, used: 0, traps: 0 };
      game.on('gadget:use', () => { game.state.gstats.used++; });
      // protection rules (mechanics/terrain asks before every knock)
      const lastBlock = { t: -9 };
      game.protect = opts => {
        if (game.hasPower('ghostmode')) return true;
        if (game.hasPower('shield')) {
          if (opts.gadget && game.state.time - lastBlock.t > 2) { lastBlock.t = game.state.time; game.state.gstats.blocks++; game.scoring.add(6, 'Blocked a gadget', 'strategy'); game.emit('gadget:blocked', { id: opts.kind }); }
          game.audio.play('blocked'); return true;
        }
        if (game.hasPower('anchor') && opts.kind !== 'slip') { if (opts.gadget) game.ui.toast('⚓ Anchored: no knock-back!', 'good'); return true; }
        if (opts.gadget && game.hasPower('safe')) return true;
        return false;
      };
      game.anchored = () => game.hasPower('anchor');
      const shielded = game.shielded;
      game.shielded = () => (shielded ? shielded() : false) || game.hasPower('ghostmode');
      /** An effect from another player: 'hit', 'blocked' or 'immune'. */
      game.gadgetEffect = (eff, from, fromName) => {
        if (game.state.mode !== 'playing' && game.state.mode !== 'modal') return 'immune';
        if (game.gadgetsImmune && game.gadgetsImmune()) return 'immune';   // e.g. finished players
        const d = D.get(eff.g) || {}, who = fromName || (game.rivalName ? game.rivalName(from) : '') || 'Someone';
        if (eff.k === 'freeze' || eff.k === 'lift') {
          if (game.hasPower('ghostmode') || game.hasPower('shield')) { game.protect({ kind: eff.k, gadget: true }); return 'blocked'; }
          if (game.hasPower('safe')) return 'immune';
          const sec = eff.seconds || 2.4;
          game.player.stun = Math.max(game.player.stun || 0, sec);
          if (eff.k === 'freeze') { game.activatePower('frozen', sec, null, true); game.player.vel = [0, game.player.vel[1], 0]; game.ui.flash('#bfefff'); game.ui.toast('🧊 ' + who, 'bad'); game.audio.play('zap'); }
          else { game.activatePower('balloon', sec, null, true); game.player.vel[1] = 5; game.player.grounded = false; game.ui.toast('🎈 ' + who, 'bad'); game.audio.play('boing'); }
        } else if (eff.k === 'slow') {
          if (game.hasPower('ghostmode') || game.hasPower('shield')) { game.protect({ kind: 'slow', gadget: true }); return 'blocked'; }
          if (game.hasPower('safe')) return 'immune';
          game.activatePower('slow', eff.seconds || 3, null, true);
          game.ui.toast((d.icon || '🦠') + ' ' + who, 'bad');
        } else {
          const ok = game.knock(eff.dir || [Math.random() - 0.5, Math.random() - 0.5], eff.power || 10, { stun: eff.stun, up: eff.up, kind: eff.k === 'slip' ? 'slip' : eff.g, gadget: true, source: from });
          if (!ok) return game.hasPower('safe') && !game.hasPower('shield') && !game.hasPower('anchor') && !game.hasPower('ghostmode') ? 'immune' : 'blocked';
          if (eff.k === 'slip') game.state.spinT = 1.1;
          game.ui.toast((eff.g === 'punch' ? '👊' : d.icon || '💥') + ' ' + who, 'bad');
          game.ui.flash('#ff9f43');
        }
        game.activatePower('safe', cfg.recover, null, true);
        game.emit('gadget:hitme', { id: eff.g, from });
        return 'hit';
      };
      /** One of my gadgets landed on someone (online: their PC tells mine). */
      game.gadgetLanded = (gid, onName) => {
        const d = D.get(gid) || {};
        game.state.gstats.hits++;
        if (d.slot === 1 && gid === 'banana') game.state.gstats.traps++;
        game.scoring.add(gid === 'punch' ? 5 : 10, gid === 'punch' ? 'Punch' : (d.name || 'Gadget') + ' hit', 'strategy');
        game.ui.toast((gid === 'punch' ? '👊' : d.icon || '💥') + ' +' + (gid === 'punch' ? 5 : 10), 'good');
        game.emit('gadget:landed', { id: gid, on: onName || null });
      };
      /** A shared gadget object (mine or someone else's) appears in my world. */
      game.gadgetObject = (o) => {
        if (o.t === 'del') { const e = game.world.get('g-' + o.id); if (e) e.remove(); return; }
        if (game.world.get('g-' + o.id)) return;
        if (o.t === 'pad') {
          game.world.add({ id: 'g-' + o.id, type: 'bouncer', pos: [o.x, o.y, o.z], rot: Math.atan2(o.dx || 0, o.dz || 1) * 180 / Math.PI, power: 12, launch: 6, look: { color: '#b794f4' }, label: '🟣', labelRange: 12, state: { life: 30 } });
          const e = game.world.get('g-' + o.id); const up = e.prefab.update;
          e.prefab = Object.assign({}, e.prefab, { update(en, dt, g) { if (up) up(en, dt, g); en.state.age = (en.state.age || 0) + dt; if (en.state.age > 30) en.remove(); } });
          return;
        }
        const life = { ball: 3, banana: 45, virus: 5 }[o.t] || 5, model = { ball: 'bowlingBall', banana: 'banana', virus: 'virusCloud' }[o.t];
        const e = game.world.add({ id: 'g-' + o.id, type: 'gobj', model, pos: [o.x, o.y + (o.t === 'virus' ? 0 : 0.02), o.z], obj: o, solid: false, alpha: o.t === 'virus' ? 0.45 : undefined });
        e.state.life = life; e.labelRange = 30;
      };
      game.state.spinT = 0;
      drawHud(game, true);
    },
    update(game, dt) {
      const GG = game.gadgets, pl = game.player;
      for (const s of GG.slots) { if (s.cd > 0) s.cd = Math.max(0, s.cd - dt); if (s.fresh > 0) s.fresh -= dt; }
      if (GG.punchCd > 0) GG.punchCd -= dt;
      const inp = game.input;
      if (game.state.mode === 'playing') {
        for (let i = 0; i < 3; i++) if (inp.hits.has('Digit' + (i + 1)) || inp.hits.has('Numpad' + (i + 1))) GG.use(i);
        // the mouse: wheel = choose an item, left click = use it (or punch with empty hands), right click = punch
        if (inp.wheel) { const full = [0, 1, 2].filter(i => GG.slots[i].id); if (full.length) { const k = full.indexOf(GG.sel); GG.sel = full[((k < 0 ? 0 : k) + (inp.wheel > 0 ? 1 : -1) + full.length) % full.length]; GG.draw(true); } inp.wheel = 0; }
        if (game.clickFire && !game.focus) { game.clickFire = false; const s2 = GG.slots[GG.sel]; if (s2 && s2.id) GG.use(GG.sel); else GG.punch(); }
        if (inp.takeRight && inp.takeRight()) GG.punch();
      }
      game.clickFire = false;
      // speeds and jumps (after powerups and terrain have set theirs this frame)
      if (game.hasPower('slow')) pl.speedMul *= 0.6;
      if (game.hasPower('rocket')) pl.jumpMul = (pl.jumpMul || 1) * 1.35;
      if (game.hasPower('jetpack')) {   // fly about 3 m above the ground (walls and firewalls still stop you)
        const hit = game.world.raycast([pl.pos[0], pl.pos[1] + 0.2, pl.pos[2]], [0, -1, 0], 12), ground = hit.hit ? pl.pos[1] + 0.2 - hit.t : pl.pos[1] - 12;
        pl.gravityMul = 0; pl.vel[1] = U.clamp((ground + 3 - pl.pos[1]) * 3, -4, 6); pl.speedMul *= 1.25; pl.grounded = false;
        if (game.fxBurst && Math.random() < dt * 30) game.fxBurst([pl.pos[0], pl.pos[1] + 0.3, pl.pos[2]], '#ff9f43', 1);
      }
      if (game.hasPower('balloon')) { pl.gravityMul = 0.12; if ((game.state.powers.balloon || 0) > 1.2) pl.vel[1] = Math.max(pl.vel[1], 2.2); }
      if (game.hasPower('frozen')) { pl.vel[0] = 0; pl.vel[2] = 0; }
      if (game.state.spinT > 0) { game.state.spinT -= dt; pl.yaw += dt * Math.PI * 2.2; }
      // glove fx flying out
      for (const e of game.world.entities) if (e.type === 'fx' && e.state.dir) { e.state.t += dt; e.pos[0] += e.state.dir[0] * dt * (e.state.speed || 18); e.pos[2] += e.state.dir[1] * dt * (e.state.speed || 18); if (e.state.t > (e.state.life || 0.35)) e.remove(); }
      // flags other PCs draw on my figure
      if (game.online && game.online.flags) game.online.flags((pl.grounded ? 0 : 1) | (game.hasPower('shield') ? 2 : 0) | (game.hasPower('ghostmode') ? 4 : 0) | (game.hasPower('anchor') ? 8 : 0) | ((pl.stun || 0) > 0 && !game.hasPower('frozen') && !game.hasPower('balloon') ? 16 : 0) | (game.hasPower('rocket') || game.hasPower('jetpack') ? 32 : 0) | (game.hasPower('frozen') ? 64 : 0) | (game.hasPower('balloon') ? 128 : 0));
      // other players' looks from their flags (online ghosts and solo rivals)
      for (const e of game.world.entities) {
        if (!e.figure || e.flags == null) continue;
        const f = e.flags;
        e.alpha = f & 4 ? 0.3 : undefined;
        e.figure.bubble = f & 64 ? '#bfefff' : f & 2 ? '#7fdbff' : null;
        e.figure.balloon = f & 128 ? '#ff4fd8' : null;
        e.figure.spin = f & 16 ? (e.figure.spin || 0) + dt * 10 : 0;
        e.hi = f & 32 ? 0.25 : (e.hi || 0);
      }
      // scanner labels
      const scan = game.hasPower('scan');
      if (scan !== game.wasScanning) {
        game.wasScanning = scan;
        for (const e of game.world.entities) if (e.def.scanLabel) { e.label = scan ? e.def.scanLabel : null; e.labelRange = 60; if (e.def.scanShow) { if (scan) e.show(); else e.hide(); } }
      }
      drawHud(game);
    },
  });

  function drawHud(game, force) {
    const GG = game.gadgets;
    let box = game.ui.hud.querySelector('.gk-gadgets');
    if (!box) {
      box = U.el('div', 'gk-gadgets');
      game.ui.hud.appendChild(box);
      force = true;
    }
    const on = GG.enabled() && game.state.mode !== 'title';
    const key = GG.slots.map(s => s.id + s.charges + ':' + Math.ceil(s.cd * 4) + (s.fresh > 0 ? 'f' : '')).join('|') + on + GG.sel;
    if (!force && box.dataset.k === key) return;
    box.dataset.k = key;
    box.innerHTML = '';
    GG.slots.forEach((s, i) => {
      const d = D.get(s.id) || (GG.cfg.pickup ? { icon: '❔', name: '' } : {}), b = U.el('button', 'gk-gslot' + (s.charges ? '' : ' empty') + (on && s.charges && !s.cd ? ' ready' : '') + (on ? '' : ' off') + (s.fresh > 0 ? ' fresh' : '') + (GG.cfg.pickup && i === GG.sel && s.id ? ' sel' : ''));
      b.type = 'button';
      b.title = (d.name || s.id) + ': ' + (d.text || '') + ' (key ' + (i + 1) + ')';
      b.innerHTML = '<span class="k">' + (i + 1) + '</span><span class="ch">' + '●'.repeat(s.charges) + '</span><span class="ic">' + (d.icon || '?') + '</span><span class="nm">' + U.esc(d.name || s.id || '') + '</span>' +
        (s.cd > 0 ? '<i class="cd" style="--p:' + Math.round(s.cd / (d.cd || 1) * 100) + '%"></i>' : '');
      b.onmousedown = e => e.stopPropagation();
      b.onclick = e => { e.stopPropagation(); GG.use(i); };
      box.appendChild(b);
    });
    if (GG.cfg.pickup) box.appendChild(U.el('div', 'gk-ghint', '🖱 ' + (GG.slots[GG.sel] && GG.slots[GG.sel].id ? (D.get(GG.slots[GG.sel].id) || {}).icon : '👊') + '   🖱R 👊'));
  }

  /** The loadout screen: pick one gadget per slot. opts: {secondsLeft() → number, info: html, onDone(ids)} */
  function chooser(game, opts) {
    const GG = game.gadgets, picks = (D.pick || GG.cfg.choices.map(c => c[0])).slice();
    const body = U.el('div', 'gk-loadout');
    const top = U.el('div', 'gk-load-top');
    top.innerHTML = '<div>' + (opts.info || '') + '</div><div class="gk-load-time"></div>';
    const grid = U.el('div', 'gk-load');
    const titles = ['1 · ATTACK / TRAP', '2 · DEFENCE', '3 · TRICK / SPEED'];
    GG.cfg.choices.forEach((list, si) => {
      const col = U.el('div');
      col.appendChild(U.el('h3', '', titles[si]));
      list.forEach(id => {
        const d = D.get(id);
        if (!d) return;
        const b = U.el('button', 'gk-gcard' + (picks[si] === id ? ' on' : ''));
        b.type = 'button';
        b.innerHTML = '<span class="ic">' + d.icon + '</span><b>' + U.esc(d.name) + '</b><p>' + U.esc(d.text) + '</p><small>⏱ ' + d.cd + ' s cooldown · 🛡 Counter: ' + U.esc(d.counter || '') + '</small>';
        b.onclick = () => { picks[si] = id; col.querySelectorAll('.gk-gcard').forEach(x => x.classList.toggle('on', x === b)); game.audio.play('click'); };
        col.appendChild(b);
      });
      grid.appendChild(col);
    });
    body.append(top, grid);
    let closed = false;
    const finish = () => { if (closed) return; closed = true; clearInterval(timer); GG.setLoadout(picks); if (opts.onDone) opts.onDone(picks); };
    const h = game.ui.panel({ title: opts.title || '🎒 Choose your gadgets', body, wide: true, closable: false, buttons: [{ label: '✔ Ready', primary: true, action: () => { finish(); } }], onClose: finish });
    const tEl = top.querySelector('.gk-load-time');
    const tick = () => {
      if (!opts.secondsLeft) return;
      const s = Math.max(0, Math.ceil(opts.secondsLeft()));
      tEl.textContent = s <= 10 ? 'FINALIZE LOADOUT · ' + s : s + ' s';
      tEl.classList.toggle('final', s <= 10);
      if (s <= 0) h.close();
    };
    const timer = setInterval(tick, 250);
    tick();
    return { close: () => h.close() };
  }
})();

</script>
<script>/* mechanics/race/race.js */
/* Game Kit · mechanics/race   (needs: objectives, quiz-gates, gadgets; spatial. Uses mechanics/online when loaded)
   A class race in ROUNDS (= the game's levels, one world each): preparation (loadout) → 3-2-1-GO → race to the finish
   through the firewall gates → round results → championship → next round … → final results.
   Modes (chosen on the title screen, which this mechanic adds to):
     solo   no internet needed: the same rounds against rival bots on this PC
     online students type the room code; the teacher's PC is the HOST (referee): it starts each round, keeps the
            clock (server time), and computes round scores + the championship from what each PC reports
     host   the teacher's PC (?host): room code, players, start / end / next round, live board, projector camera
   World: routes.course (centre line), locations start-N, barrier, cp-N, gate-N, finish {size} (worlds/_course.js).
   Config race: {
     roundTime: 600, timeChoices: [360, 480, 600], prep: 30, countdown: 3,
     multipliers: [1, 1, 1.1, 1.25, 1.5],
     score: { finish: 100, place: [40, 32, …], progress: 85, pow: 1.3, caps: {academic, strategy, explore} },
     bots: 7, botNames: [...], texts: {...} }
   A round's score = (race + academic + strategy + explore) × the round multiplier. race = finish 100 + place bonus,
   or progress^pow × 85 when time runs out (nobody gets zero for trying). The other parts come from the scoring log
   kinds 'academic' (+ 'reveal'), 'strategy', 'explore', capped so one kind cannot decide everything.
   Firebase (rooms/<CODE>/): race {round, phase, prepEnd, startAt, endAt, len, resultsFor}, stats/<id> (each PC: its
   round numbers), results/<round>/<id>, champ/<id> (host). Positions come from the online ghosts (no extra traffic).
   Adds GK.Race (session), game.rivals(), game.hitRival(), game.shareGadget(), game.reportHit(), game.raceInfo(),
   objective type 'waypoint' {flag, pos}. Emits race:go, race:finish {ms, place}, race:over, race:checkpoint {i}. */
(function () {
  'use strict';
  const U = GK.util, V = GK.vec, P = GK.Prefabs;
  const DEF = {
    roundTime: 600, timeChoices: [360, 480, 600], prep: 30, soloPrep: 20, countdown: 3,
    multipliers: [1, 1, 1.1, 1.25, 1.5],
    // finishers: 60 + a place bonus (1st 140 … 10th 77 … 20th 62); non-finishers: progress^1.3 × 60 (80% → 45, 40% → 18)
    score: { finish: 60, place: [80, 66, 55, 46, 39, 33, 28, 24, 20, 17, 14, 12, 10, 8, 7, 6, 5, 4, 3, 2], progress: 60, pow: 1.3, caps: { academic: 180, strategy: 90, explore: 60 }, floor: -40 },
    bots: 7, botNames: ['Pixel', 'Nova', 'Byte', 'Turbo', 'Echo', 'Glitch', 'Chip', 'Luna', 'Rex', 'Zippy', 'Bolt', 'Kiwi', 'Spark', 'Mochi', 'Vega'],
    points: { shard: 3, secret: 20, crate: [5, 10, 15], coop: 15 },
  };
  const ORD = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

        if (b.slow > 0) b.slow -= dt;
