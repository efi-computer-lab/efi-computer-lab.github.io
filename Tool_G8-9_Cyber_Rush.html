  U.rng = function (seed) {
    let s = (seed >>> 0) || 1;
    return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  };

  // ---------- vector / matrix math (column-major mat4 for WebGL) ----------
  const V = GK.vec = {
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: a => Math.hypot(a[0], a[1], a[2]),
    dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
    norm: a => { const l = Math.hypot(a[0], a[1], a[2]); return l > 1e-9 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 1, 0]; },
  };

  GK.mat4 = {
    create: () => new Float32Array(16),
    perspective(out, fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
      out.fill(0);
      out[0] = f / aspect; out[5] = f; out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
      return out;
    },
    lookAt(out, eye, target, up) {
      const z = V.norm(V.sub(eye, target)), x = V.norm(V.cross(up, z)), y = V.cross(z, x);
      out[0] = x[0]; out[1] = y[0]; out[2] = z[0]; out[3] = 0;
      out[4] = x[1]; out[5] = y[1]; out[6] = z[1]; out[7] = 0;
      out[8] = x[2]; out[9] = y[2]; out[10] = z[2]; out[11] = 0;
      out[12] = -V.dot(x, eye); out[13] = -V.dot(y, eye); out[14] = -V.dot(z, eye); out[15] = 1;
      return out;
    },
    multiply(out, a, b) {
      const r = new Float32Array(16);
      for (let c = 0; c < 4; c++) {
        for (let row = 0; row < 4; row++) {
          r[c * 4 + row] = a[row] * b[c * 4] + a[4 + row] * b[c * 4 + 1] + a[8 + row] * b[c * 4 + 2] + a[12 + row] * b[c * 4 + 3];
        }
      }
      out.set(r);
      return out;
    },
    /** translate(pos) · rotateY(yaw) · rotateX(−pitch) · scale(s). pitch > 0 tilts a model's front (+z) upwards. */
    /** Model matrix: turn by yaw (around y), tilt the front up by pitch, and (optional) roll around the front axis. */
    model(out, pos, yaw, s, pitch, roll) {
      const c = Math.cos(yaw), n = Math.sin(yaw);
      out.fill(0);
      if (roll) {
        const ca = Math.cos(-(pitch || 0)), sa = Math.sin(-(pitch || 0)), cr = Math.cos(roll), sr = Math.sin(roll);
        const X = [c, 0, -n], Y = [n * sa, ca, c * sa], Z = [n * ca, -sa, c * ca];
        for (let i = 0; i < 3; i++) {
          out[i] = (cr * X[i] + sr * Y[i]) * s[0];
          out[4 + i] = (-sr * X[i] + cr * Y[i]) * s[1];
          out[8 + i] = Z[i] * s[2];
        }
      } else if (pitch) {
        const ca = Math.cos(-pitch), sa = Math.sin(-pitch);
        out[0] = c * s[0]; out[2] = -n * s[0];
        out[4] = n * sa * s[1]; out[5] = ca * s[1]; out[6] = c * sa * s[1];
        out[8] = n * ca * s[2]; out[9] = -sa * s[2]; out[10] = c * ca * s[2];
      } else {
        out[0] = c * s[0]; out[2] = -n * s[0];
        out[5] = s[1];
        out[8] = n * s[2]; out[10] = c * s[2];
      }
      out[12] = pos[0]; out[13] = pos[1]; out[14] = pos[2]; out[15] = 1;
      return out;
    },
  };

  // ---------- events ----------
  /** Tiny event bus. Listening to '*' receives every event as (data, name). */
  class Events {
    constructor() { this.map = {}; }
    on(name, fn) { (this.map[name] = this.map[name] || []).push(fn); return () => this.off(name, fn); }
    off(name, fn) { const l = this.map[name]; if (l) { const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); } }
    emit(name, data) {
      data = data || {};
      for (const key of [name, '*']) {
        const l = this.map[key];
        if (!l) continue;
        for (const fn of l.slice()) {
          try { fn(data, name); } catch (e) { console.error('[GK] listener for "' + name + '" failed:', e); }
        }
      }
    }
    clear() { this.map = {}; }
  }
  GK.Events = Events;

  // ---------- registries (the extension points) ----------
  /** A named table of definitions. Games extend the engine by calling e.g. GK.Actions.add('myAction', fn). */
  GK.registry = function (kind) {
    const items = {};
    return {
      kind, items,
      add(name, def) { items[name] = def; return def; },
      has: name => Object.prototype.hasOwnProperty.call(items, name),
      get(name) {
        if (!Object.prototype.hasOwnProperty.call(items, name)) {
          throw new Error('[GK] Unknown ' + kind + ' "' + name + '". Known: ' + Object.keys(items).join(', '));
        }
        return items[name];
      },
    };
  };

  // The layers of the kit. Each file registers itself in one of these:
  GK.GameTypes = GK.registry('game type');   // game-types/<name>/type.js
  GK.Worlds = GK.registry('world');          // worlds/<name>/world.js
  GK.Mechanics = GK.registry('mechanic');    // mechanics/<name>/<name>.js  {setup, start, update, snapshot, restore, validate}
  // Registries that mechanics, types and games extend. Created here so load order never matters.
  GK.Conditions = GK.registry('condition');   // core/rules.js + mechanics
  GK.Actions = GK.registry('action');         // core/rules.js + mechanics
  GK.Interactions = GK.registry('interaction');
  GK.Objectives = GK.registry('objective');
  GK.Puzzles = GK.registry('puzzle');
  GK.Prefabs = GK.registry('prefab');         // entity types in spatial worlds
  GK.Models = GK.registry('model');           // assets/models
  GK.WorldParts = GK.registry('world part');  // worlds/_parts.js: reusable furniture groups for world legends

  /** Replace every "content:path.to.value" string in a config with the value from the game's content file. */
  GK.resolveContent = function (value, content, where, problems) {
    if (typeof value === 'string' && value.indexOf('content:') === 0) {
      const path = value.slice(8), out = path.split('.').reduce((o, k) => (o == null ? o : o[k]), content);
      if (out === undefined) {
        const msg = 'Missing content "' + path + '"' + (where ? ' (used by "' + where + '")' : '');
        console.warn('[GK] ' + msg);
        if (problems) problems.push(msg);
      }
      return out;
    }
    if (Array.isArray(value)) return value.map(v => GK.resolveContent(v, content, where, problems));
    if (U.isObj(value)) { const o = {}; for (const k in value) o[k] = GK.resolveContent(value[k], content, k, problems); return o; }
    return value;
  };

  GK.ready = fn => (document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', fn) : fn());
})();

</script>
<script>/* core/rules.js */
/* Game Kit · core/rules.js
   The small rule language every game type and mechanic shares:
   - Conditions  GK.test(game, cond)    'flagName' · {flag} · {var:{name, gte}} · {all:[…]} · {not:…} · fn(game)
   - Actions     GK.run(game, actions)  {do:'say', text} · {do:'flag', set} · {do:'win'} · fn(game, ctx)
   Mechanics and game types add their own (e.g. inventory adds {has:'key'} and {do:'give'}). */
(function () {
  'use strict';
  const U = GK.util;

  // ================= Conditions =================
  const C = GK.Conditions;
  const cmp = (val, c) => (c.gte == null || val >= c.gte) && (c.lte == null || val <= c.lte) && (c.eq == null || val === c.eq) && (c.gt == null || val > c.gt) && (c.lt == null || val < c.lt);
  GK.compare = cmp;

  C.add('flag', (g, v) => U.list(v).every(f => !!g.state.flags[f]));
  C.add('notFlag', (g, v) => U.list(v).every(f => !g.state.flags[f]));
  C.add('var', (g, v) => cmp(g.state.vars[v.name] == null ? 0 : g.state.vars[v.name], v));
  C.add('score', (g, v) => cmp(g.scoring.total, U.isObj(v) ? v : { gte: v }));
  C.add('time', (g, v) => cmp(g.state.time, U.isObj(v) ? v : { gte: v }));
  C.add('event', (g, v) => (g.state.events[U.isObj(v) ? v.name : v] || 0) >= (U.isObj(v) && v.count || 1));
  C.add('level', (g, v) => cmp(g.levelIndex + 1, U.isObj(v) ? v : { eq: v }));
  C.add('all', (g, v) => v.every(c => GK.test(g, c)));
  C.add('any', (g, v) => v.some(c => GK.test(g, c)));
  C.add('not', (g, v) => !GK.test(g, v));
  C.add('fn', (g, v) => !!v(g));
  const MODIFIERS = { count: 1 };

  /** null/undefined = true · string = flag name · function(game) · array = all · object = every key must pass */
  GK.test = function (g, cond) {
    if (cond == null) return true;
    if (typeof cond === 'boolean') return cond;   // e.g. win: false = the game never wins by itself (a mechanic ends rounds)
    if (typeof cond === 'function') return !!cond(g);
    if (typeof cond === 'string') return !!g.state.flags[cond];
    if (Array.isArray(cond)) return cond.every(c => GK.test(g, c));
    for (const k in cond) {
      if (MODIFIERS[k]) continue;
      if (!C.get(k)(g, cond[k], cond)) return false;
    }
    return true;
  };

  // ================= Actions =================
  const A = GK.Actions;
  /** Helper for actions that target an entity (spatial games): {target:'id'} or the entity that ran the action. */
  GK.targetOf = function (g, a, ctx) {
    const id = a.target || (ctx && ctx.entity && ctx.entity.id);
    const e = g.world ? g.world.get(id) : null;
    if (!e) console.warn('[GK] action "' + a.do + '": no entity "' + id + '"');
    return e;
  };

  A.add('say', (g, a) => g.ui.toast(U.fill(a.text, g.state.vars), a.style));
  A.add('message', (g, a) => g.ui.panel({ title: a.title, text: U.fill(a.text, g.state.vars), html: a.html }));
  A.add('flag', (g, a) => {
    for (const f of U.list(a.set)) g.setFlag(f, true);
    for (const f of U.list(a.clear)) g.setFlag(f, false);
    for (const f of U.list(a.toggle)) g.setFlag(f, !g.state.flags[f]);
  });
  A.add('var', (g, a) => {
    const v = g.state.vars;
    if (a.set !== undefined) v[a.name] = a.set;
    if (a.add !== undefined) v[a.name] = (Number(v[a.name]) || 0) + a.add;
    g.emit('var:changed', { name: a.name, value: v[a.name] });
  });
  A.add('score', (g, a) => g.scoring.add(a.points || 0, a.label || 'Bonus', a.kind || 'bonus'));
  A.add('penalty', (g, a) => g.scoring.add(-Math.abs(a.points || 0), a.label || 'Penalty', 'penalty'));
  A.add('sound', (g, a) => g.audio.play(a.name));
  A.add('emit', (g, a) => g.emit(a.event, a.data || {}));
  A.add('timer', (g, a) => {
    if (a.add) g.state.timeLimit = (g.state.timeLimit || 0) + a.add;
    if (a.set !== undefined) g.state.timeLimit = a.set;
  });
  A.add('win', (g, a) => g.win(a.text));
  A.add('lose', (g, a) => g.lose(a.text));
  A.add('if', (g, a, ctx) => GK.run(g, GK.test(g, a.cond) ? a.then : a.else, ctx));
  A.add('run', (g, a, ctx) => a.fn(g, ctx));

  /** Run actions. Each: {do:'name', …} | function(game, ctx) | "event name" (emits it).
      Any action may have `if` (skip unless true), `else` (actions when `if` fails) and `delay` (seconds). */
  GK.run = function (g, actions, ctx) {
    ctx = ctx || {};
    for (const a of U.list(actions)) {
      if (!a) continue;
      if (typeof a === 'function') { a(g, ctx); continue; }
      if (typeof a === 'string') { g.emit(a, ctx); continue; }
      if (a.if !== undefined && !GK.test(g, a.if)) { if (a.else) GK.run(g, a.else, ctx); continue; }
      if (a.delay) { const copy = Object.assign({}, a, { delay: 0, if: undefined }); g.later(a.delay, () => GK.run(g, [copy], ctx)); continue; }
      try { A.get(a.do)(g, a, ctx); } catch (e) { console.error('[GK] action failed:', a, e); }
    }
  };
})();

</script>
<script>/* core/store.js */
/* Game Kit · core/store.js
   - GK.Store: saved data on THIS computer (localStorage), namespaced per game, never throws
     (storage can be blocked in private windows or by school policies; the game still runs).
   - GK.Assets: cached images and sounds referenced by path (next to the game or in assets/). */
(function () {
  'use strict';

  class Store {
    constructor(gameId) { this.prefix = 'gk.' + (gameId || 'game') + '.'; }
    get(key, fallback) {
      try { const v = localStorage.getItem(this.prefix + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    }
    set(key, value) { try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch (e) { return false; } }
    remove(key) { try { localStorage.removeItem(this.prefix + key); } catch (e) { /* blocked */ } }
    /** Forget everything this game saved on this computer. */
    clear() {
      try { Object.keys(localStorage).filter(k => k.indexOf(this.prefix) === 0).forEach(k => localStorage.removeItem(k)); } catch (e) { /* blocked */ }
    }
  }
  GK.Store = Store;

  const cache = {};
  GK.Assets = {
    image(src) { return cache['img:' + src] || (cache['img:' + src] = Object.assign(new Image(), { src })); },
    sound(src) { return cache['snd:' + src] || (cache['snd:' + src] = new window.Audio(src)); },
    /** Start loading files early (e.g. in hooks.setup). */
    preload(list) { for (const s of list || []) (/\.(mp3|wav|ogg)$/i.test(s) ? this.sound(s) : this.image(s)); },
  };
})();

</script>
<script>/* core/input.js */
/* Game Kit · core/input.js
   Keyboard (by physical key code, so AZERTY etc. still use the same positions), mouse-look with
   pointer lock, and a drag-to-look fallback when the pointer cannot be locked. */
(function () {
  'use strict';

  const DEFAULT_KEYS = {
    forward: ['KeyW', 'ArrowUp'], back: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
    jump: ['Space'], sprint: ['ShiftLeft', 'ShiftRight'], interact: ['KeyE', 'KeyF'], hint: ['KeyH'], pause: ['KeyP', 'Escape'],
  };
  const TYPING = /^(INPUT|TEXTAREA|SELECT)$/;

  class Input {
    constructor(el, keys) {
      this.el = el;   // element that receives pointer lock / drag-look (game types can change it: input.el = canvas)
      this.map = Object.assign({}, DEFAULT_KEYS, keys || {});
      this.keys = new Set(); this.hits = new Set(); this.forced = {};
      this.dx = 0; this.dy = 0; this.drag = null; this.locked = false; this.enabled = false;
      this.onLockChange = null; this.onClick = null;
      this.handlers = {
        keydown: e => {
          if (TYPING.test(e.target.tagName)) return;
          if (this.enabled && /^(Space|Arrow|Tab)/.test(e.code)) e.preventDefault();
          if (!e.repeat) this.hits.add(e.code);
          this.keys.add(e.code);
        },
        keyup: e => this.keys.delete(e.code),
        blur: () => this.clear(),
        mousemove: e => {
          if (this.locked) { this.dx += e.movementX || 0; this.dy += e.movementY || 0; }
          else if (this.drag && this.enabled) { this.dx += e.clientX - this.drag[0]; this.dy += e.clientY - this.drag[1]; this.drag = [e.clientX, e.clientY]; }
        },
        mousedown: e => {
          if (e.target !== this.el) return;
          if (e.button === 0) this.mouse = true;   // held: e.g. automatic fire
          if (e.button === 2) this.rightClicks = (this.rightClicks || 0) + 1;   // takeRight(): e.g. punch
          if (!this.locked) this.drag = [e.clientX, e.clientY];
          if (e.button === 0 && this.onClick) this.onClick(this.locked);
        },
        mouseup: () => { this.drag = null; this.mouse = false; },
        contextmenu: e => { if (e.target === this.el || this.locked) e.preventDefault(); },   // right click is a game button
        wheel: e => { if (this.locked || e.target === this.el) this.wheel += e.deltaY > 0 ? 1 : e.deltaY < 0 ? -1 : 0; },
        lockchange: () => {
          this.locked = document.pointerLockElement === this.el;
          this.drag = null;
          if (this.onLockChange) this.onLockChange(this.locked);
        },
      };
      document.addEventListener('keydown', this.handlers.keydown);
      document.addEventListener('keyup', this.handlers.keyup);
      window.addEventListener('blur', this.handlers.blur);
      document.addEventListener('mousemove', this.handlers.mousemove);
      document.addEventListener('mousedown', this.handlers.mousedown);
      document.addEventListener('mouseup', this.handlers.mouseup);
      document.addEventListener('pointerlockchange', this.handlers.lockchange);
      document.addEventListener('wheel', this.handlers.wheel, { passive: true });
      document.addEventListener('contextmenu', this.handlers.contextmenu);
      this.wheel = 0;
    }
    /** Is the action held down? */
    down(action) { return !!this.forced[action] || (this.map[action] || []).some(c => this.keys.has(c)); }
    /** Was the action pressed this frame? */
    pressed(action) { return (this.map[action] || []).some(c => this.hits.has(c)); }
    /** Right clicks since the last call. */
    takeRight() { const n = this.rightClicks || 0; this.rightClicks = 0; return n; }
    /** Mouse movement since the last call. */
    takeMouse() { const d = [this.dx, this.dy]; this.dx = 0; this.dy = 0; return d; }
    endFrame() { this.hits.clear(); }
    clear() { this.keys.clear(); this.hits.clear(); this.dx = this.dy = 0; this.drag = null; this.mouse = false; }
    /** Hold an action from code (tests, on-screen buttons): input.force('forward', true). */
    force(action, on) { this.forced[action] = !!on; }
    lock() {
      if (this.locked || !this.el.requestPointerLock) return;
      try { const p = this.el.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* fallback: drag to look */ }
    }
    unlock() { if (document.pointerLockElement) document.exitPointerLock(); }
    destroy() {
      document.removeEventListener('keydown', this.handlers.keydown);
      document.removeEventListener('keyup', this.handlers.keyup);
      window.removeEventListener('blur', this.handlers.blur);
      document.removeEventListener('mousemove', this.handlers.mousemove);
      document.removeEventListener('mousedown', this.handlers.mousedown);
      document.removeEventListener('mouseup', this.handlers.mouseup);
      document.removeEventListener('pointerlockchange', this.handlers.lockchange);
      document.removeEventListener('wheel', this.handlers.wheel);
      document.removeEventListener('contextmenu', this.handlers.contextmenu);
    }
  }
  Input.DEFAULT_KEYS = DEFAULT_KEYS;
  GK.Input = Input;
})();

</script>
<script>/* core/audio.js */
/* Game Kit · core/audio.js
   Sound effects synthesised with WebAudio (no files needed, works offline).
   Add or replace sounds in config.audio.sounds:
     { name: {wave:'square', notes:[440, 660], dur:0.1, vol:0.2} }   — synth beeps, or
     { name: {src:'assets/door.mp3', vol:0.8} }                        — an audio file next to the game */
(function () {
  'use strict';
  const SOUNDS = {
    pickup: { wave: 'square', notes: [880, 1320], dur: 0.07, vol: 0.12 },
    click: { wave: 'square', notes: [320], dur: 0.04, vol: 0.1 },
    deny: { wave: 'sawtooth', notes: [180, 130], dur: 0.1, vol: 0.12 },
    wrong: { wave: 'sawtooth', notes: [220, 150], dur: 0.12, vol: 0.12 },
    success: { wave: 'triangle', notes: [523, 659, 784], dur: 0.08, vol: 0.2 },
    objective: { wave: 'triangle', notes: [659, 784, 1047], dur: 0.1, vol: 0.22 },
    door: { wave: 'triangle', notes: [150, 210], dur: 0.14, vol: 0.18 },
    jump: { wave: 'sine', notes: [300, 420], dur: 0.06, vol: 0.06 },
    hint: { wave: 'sine', notes: [660, 880], dur: 0.09, vol: 0.15 },
    checkpoint: { wave: 'triangle', notes: [440, 660, 880], dur: 0.07, vol: 0.18 },
    talk: { wave: 'square', notes: [500], dur: 0.03, vol: 0.05 },
    hurt: { wave: 'sawtooth', notes: [160, 100], dur: 0.12, vol: 0.2 },
    win: { wave: 'triangle', notes: [523, 659, 784, 1047, 1319], dur: 0.12, vol: 0.25 },
    lose: { wave: 'triangle', notes: [392, 330, 262, 196], dur: 0.18, vol: 0.22 },
    tick: { wave: 'sine', notes: [1000], dur: 0.03, vol: 0.08 },
    zap: { wave: 'square', notes: [1400, 700], dur: 0.04, vol: 0.07 },
    swing: { wave: 'sawtooth', notes: [420, 220, 140], dur: 0.05, vol: 0.05 },
    slash: { wave: 'square', notes: [900, 520, 300], dur: 0.04, vol: 0.1 },
    hit: { wave: 'square', notes: [600, 900], dur: 0.04, vol: 0.1 },
    boom: { wave: 'sawtooth', notes: [220, 120, 60], dur: 0.07, vol: 0.18 },
    blocked: { wave: 'triangle', notes: [1200, 1200], dur: 0.03, vol: 0.08 },
    enemyShot: { wave: 'sawtooth', notes: [300, 200], dur: 0.05, vol: 0.06 },
    empty: { wave: 'sine', notes: [200], dur: 0.04, vol: 0.06 },
    reload: { wave: 'square', notes: [260, 340, 260, 520], dur: 0.06, vol: 0.07 },
  };

  class Audio {
    constructor(cfg) {
      cfg = cfg || {};
      this.sounds = Object.assign({}, SOUNDS, cfg.sounds || {});
      this.volume = cfg.volume == null ? 0.7 : cfg.volume;
      this.muted = !!cfg.muted;
      this.ctx = null; this.files = {};
    }
    /** Must be called from a user gesture once (the Play button does this). */
    unlock() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { this.ctx = new AC(); } catch (e) { this.ctx = null; } }
    }
    play(name) {
      if (this.muted || !name) return;
      const s = this.sounds[name];
      if (!s) return;
      if (s.src) {
        try {
          const a = GK.Assets.sound(s.src);
          a.volume = Math.min(1, (s.vol == null ? 1 : s.vol) * this.volume);
          a.currentTime = 0;
          const p = a.play(); if (p && p.catch) p.catch(() => {});
        } catch (e) { /* ignore */ }
        return;
      }
      const ctx = this.ctx;
      if (!ctx) return;
      let t = ctx.currentTime;
      for (const f of s.notes) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = s.wave || 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime((s.vol || 0.15) * this.volume, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + s.dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + s.dur + 0.02);
        t += s.dur * 0.9;
      }
    }
    setMuted(m) { this.muted = !!m; }
  }
  GK.Audio = Audio;
})();

</script>
<script>/* core/ui.js */
/* Game Kit · core/ui.js
   HTML overlay used by every game type: HUD (title, objectives, progress, timer, score, health,
   inventory, prompt, crosshair, keys), toasts, screen-space labels, panels (inspect / puzzles /
   messages), dialogue box, and the title (with level select) / pause / completed / failed screens.
   Styled by core/gk.css; the accent colour comes from config.ui.accent. Game types decide which parts
   show (config.ui.crosshair, ui.lockHint, …) and pass already-projected labels to drawLabels(). */
(function () {
  'use strict';
  const U = GK.util, el = U.el;

  class UI {
    constructor(game, root) {
      this.game = game; this.root = root;
      this.cache = {};
      this.modalDepth = 0;
      this.hud = el('div', 'gk-hud');
      this.hud.innerHTML = [
        '<div class="gk-crosshair"></div>',
        '<div class="gk-card gk-obj"><div class="gk-obj-title"></div><div class="gk-bar"><i></i></div><ul class="gk-obj-list"></ul></div>',
        '<div class="gk-stats"><div class="gk-card gk-stat gk-timer"><span>⏱</span><b></b></div><div class="gk-card gk-stat gk-score"><span>★</span><b>0</b></div><div class="gk-card gk-stat gk-coins" style="display:none"><span>🪙</span><b>0</b><em></em></div></div>',
        '<div class="gk-health"><i></i></div>',
        '<div class="gk-chips"></div>',
        '<div class="gk-boss"><span></span><i><b></b></i></div>',
        '<div class="gk-weapon"><div class="gk-w-slots"></div><div class="gk-w-main"><span class="gk-w-name"></span><span class="gk-w-ammo"></span></div><i class="gk-w-reload"><b></b></i><div class="gk-w-hint"></div></div>',
        '<div class="gk-flash"></div>',
        '<div class="gk-prompt"></div>',
        '<div class="gk-inv"></div>',
        '<div class="gk-keys"></div>',
        '<div class="gk-toasts"></div>',
        '<div class="gk-lockhint">Click to look around</div>',
        '<div class="gk-debug"></div>',
      ].join('');
      this.labels = el('div', 'gk-labels');
      this.layer = el('div', 'gk-layer');
      root.append(this.labels, this.hud, this.layer);
      const q = s => this.hud.querySelector(s);
      this.$ = {
        objTitle: q('.gk-obj-title'), objList: q('.gk-obj-list'), bar: q('.gk-bar i'), obj: q('.gk-obj'),
        timer: q('.gk-timer'), timerVal: q('.gk-timer b'), score: q('.gk-score b'), health: q('.gk-health'), healthBar: q('.gk-health i'),
        prompt: q('.gk-prompt'), inv: q('.gk-inv'), chips: q('.gk-chips'), boss: q('.gk-boss'), weapon: q('.gk-weapon'), crosshair: q('.gk-crosshair'), coins: q('.gk-coins'), flash: q('.gk-flash'), keys: q('.gk-keys'), toasts: q('.gk-toasts'), lockhint: q('.gk-lockhint'), debug: q('.gk-debug'),
      };
      this.labelPool = [];
      this.onKey = e => this.handleKey(e);
      document.addEventListener('keydown', this.onKey);
    }
    applyConfig(cfg) {
      if (cfg.ui.accent) this.root.style.setProperty('--gk-accent', cfg.ui.accent);
      const sky = U.list(cfg.environment && cfg.environment.sky);
      this.root.style.background = sky.length ? 'linear-gradient(to bottom,' + U.css(sky[0]) + ',' + U.css(sky[1] || sky[0]) + ' 55%,' + U.css(sky[2] || sky[1] || sky[0]) + ')' : (cfg.ui.background || '#1b2636');
      this.hud.classList.toggle('no-crosshair', !cfg.ui.crosshair);
      this.$.objTitle.textContent = cfg.title + (cfg.stageTitle ? ' · ' + cfg.stageTitle : '');
      document.title = cfg.title;
      const hintCost = cfg.scoring.hint ? ' (−' + cfg.scoring.hint + ')' : '';
      this.$.keys.innerHTML = '';
      if (cfg.ui.showHintKey !== false) this.$.keys.appendChild(el('span', '', 'H  Hint' + hintCost));
      this.$.keys.appendChild(el('span', '', 'Esc  Pause'));
      this.$.timer.style.display = cfg.timer.show === false ? 'none' : '';
      this.$.health.style.display = !cfg.player || cfg.player.health == null ? 'none' : '';
      this.$.obj.style.display = cfg.ui.objectives === false ? 'none' : '';
      this.cache = {};
    }

    // ----- HUD -----
    setObjectives(m) {
      const list = this.$.objList, done = m.doneCount(), total = m.required().length;
      this.$.bar.style.width = (total ? done / total * 100 : 0) + '%';
      const key = m.list.map(o => o.status + o.cur).join('|');
      if (this.cache.obj === key) return;
      this.cache.obj = key;
      list.innerHTML = '';
      // long ordered missions: older finished steps collapse into one line so the list stays short
      const doneList = m.ordered ? m.list.filter(o => o.status === 'done' && !o.optional) : [];
      const hideDone = new Set(doneList.slice(0, Math.max(0, doneList.length - 2)));
      if (hideDone.size) list.appendChild(el('li', 'gk-o done gk-o-more', '✓ ' + hideDone.size + ' steps done'));
      for (const o of m.list) {
        if (hideDone.has(o)) continue;
        if (o.status === 'waiting' && (m.ordered || o.hidden)) continue;
        if (o.hidden && o.status !== 'done') continue;
        const li = el('li', 'gk-o ' + o.status + (o.optional ? ' optional' : ''));
        li.appendChild(el('span', 'gk-o-box', o.status === 'done' ? '✓' : o.status === 'failed' ? '✗' : ''));
        const need = m.need(o);
        li.appendChild(el('span', 'gk-o-text', (o.title || o.id) + (need > 1 && o.type !== 'survive' ? '  ' + o.cur + '/' + need : '') + (o.optional ? '  (bonus)' : '')));
        list.appendChild(li);
        // free, always-visible tip for the objective the player is working on now (objective.tip)
        if (o.tip && o === m.current()) list.appendChild(el('li', 'gk-o-tip', '💡 ' + U.fill(o.tip, this.game.state.vars)));
      }
    }
    /** Generic HUD status for game types without objectives (e.g. quiz): a few lines + the progress bar (0..1). */
    setStatus(lines, fraction) {
      this.$.bar.style.width = U.clamp(fraction || 0, 0, 1) * 100 + '%';
      const key = 'status:' + lines.join('|');
      if (this.cache.obj === key) return;
      this.cache.obj = key;
      this.$.objList.innerHTML = '';
      for (const l of lines) this.$.objList.appendChild(el('li', 'gk-o', l));
    }
    prompt(text) {
      if (this.cache.prompt === text) return;
      this.cache.prompt = text;
      this.$.prompt.innerHTML = text ? '<kbd>E</kbd> ' + U.esc(text) : '';
      this.$.prompt.classList.toggle('show', !!text);
      this.hud.classList.toggle('aiming', !!text);
    }
    setInventory(g) {
      const items = g.state.items, key = JSON.stringify(items);
      if (this.cache.inv === key) return;
      this.cache.inv = key;
      this.$.inv.innerHTML = '';
      for (const id in items) {
        if (!items[id]) continue;
        const def = g.itemDef(id);
        if (def.hidden) continue;
        const slot = el('div', 'gk-slot');
        slot.title = def.name || id;
        slot.appendChild(el('span', 'gk-slot-icon', def.icon || '◆'));
        if (def.color) slot.style.setProperty('--slot', U.css(def.color));
        if (items[id] > 1) slot.appendChild(el('b', '', String(items[id])));
        slot.appendChild(el('small', '', def.name || id));
        this.$.inv.appendChild(slot);
      }
    }
    update(g) {
      const s = g.state;
      const limit = s.timeLimit;
      const shown = limit ? Math.max(0, limit - s.time) : s.time;
      const tt = U.time(shown);
      if (this.cache.time !== tt) { this.cache.time = tt; this.$.timerVal.textContent = tt; }
      this.$.timer.classList.toggle('warn', !!limit && limit - s.time <= (g.cfg.timer.warnAt || 30));
      const sc = String(g.scoring.total);
      if (this.cache.score !== sc) { this.cache.score = sc; this.$.score.textContent = sc; }
      if (g.player && g.player.health != null) this.$.healthBar.style.width = (g.player.health / g.player.maxHealth * 100) + '%';
      this.$.lockhint.classList.toggle('show', s.mode === 'playing' && !g.input.locked && !!g.cfg.ui.lockHint);
      // teacher/debug overlay (GK.Settings.overlay): what a teacher or a game author needs to see at a glance
      const ov = GK.Settings.get('overlay', false);
      this.$.debug.style.display = ov ? 'block' : 'none';
      if (ov) {
        const p = g.player, f = g.focus;
        this.$.debug.textContent = [(g.fps ? Math.round(g.fps) + ' fps' : 'manual'), g.typeName, s.mode, (g.stageId || 'L' + (g.levelIndex + 1)),
          p ? 'x ' + p.pos[0].toFixed(1) + ' y ' + p.pos[1].toFixed(1) + ' z ' + p.pos[2].toFixed(1) : '', f ? 'focus ' + f.id : '',
          (g.problems && g.problems.length ? '⚠ ' + g.problems.length + ' problems' : '')].filter(Boolean).join('  ·  ');
      }
    }
    toast(text, style) {
      if (!text) return;
      const t = el('div', 'gk-toast ' + (style || ''), text);
      this.$.toasts.appendChild(t);
      while (this.$.toasts.children.length > 4) this.$.toasts.firstChild.remove();
      setTimeout(() => t.classList.add('out'), 2600);
      setTimeout(() => t.remove(), 3100);
    }
    /** Short full-screen colour flash (hurt, power-up...). */
    flash(color) {
      const f = this.$.flash;
      f.style.background = 'radial-gradient(circle, transparent 35%, ' + U.css(color || '#ff3b3b') + ' 120%)';
      f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    }
    /** The weapon panel: {name, icon, color, mag, magMax, res, reload (0..1 | null), rapid, slots: [{n, icon, owned, active}]} or null. */
    setWeapon(w) {
      const W = this.$.weapon;
      const key = w ? [w.name, w.mag, w.res, w.reload == null ? '' : Math.floor(w.reload * 20), w.rapid, w.melee, w.slots.map(x => (x.owned ? 1 : 0) + (x.active ? 2 : 0)).join('')].join('|') : '';
      if (this.cache.weapon === key) return;
      this.cache.weapon = key;
      W.classList.toggle('show', !!w);
      if (!w) return;
      W.style.setProperty('--wc', U.css(w.color || '#4cc9f0'));
      W.querySelector('.gk-w-name').textContent = (w.icon ? w.icon + ' ' : '') + w.name;
      const am = W.querySelector('.gk-w-ammo');
      am.innerHTML = w.rapid || w.melee ? '<b>∞</b>' : '<b>' + w.mag + '</b> / ' + w.res;
      W.classList.toggle('empty', !w.rapid && !w.melee && w.mag === 0);
      W.classList.toggle('low', !w.rapid && !w.melee && w.mag > 0 && w.mag <= Math.max(1, Math.floor(w.magMax / 4)));
      const rl = W.querySelector('.gk-w-reload');
      rl.style.visibility = w.reload == null ? 'hidden' : 'visible';
      rl.querySelector('b').style.width = (w.reload == null ? 0 : w.reload * 100) + '%';
      W.querySelector('.gk-w-hint').textContent = w.melee ? 'Get close and click to swing' : w.reload != null ? 'RELOADING…' : w.rapid ? 'RAPID FIRE: free ammo!' : w.mag === 0 ? (w.res > 0 ? 'Press R to reload' : 'OUT OF AMMO') : '';
      const slots = W.querySelector('.gk-w-slots');
      slots.innerHTML = '';
      if (w.slots && w.slots.length > 1) for (const x of w.slots) slots.appendChild(el('span', 'gk-w-slot' + (x.owned ? ' owned' : '') + (x.active ? ' active' : ''), x.n + ' ' + (x.owned ? x.icon || '•' : '🔒')));
    }
    /** Coins card next to the score (null hides it), and a small "+10" pop. */
    setCoins(n) {
      const key = n == null ? '' : String(n);
      if (this.cache.coins === key) return;
      this.cache.coins = key;
      this.$.coins.style.display = n == null ? 'none' : '';
      if (n != null) this.$.coins.querySelector('b').textContent = n;
    }
    coinPop(text) {
      const e = this.$.coins.querySelector('em');
      e.textContent = text;
      e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop');
    }
    /** Crosshair blink when a shot hits something (red = it took damage, blue = it is shielded). */
    hitMarker(kind) {
      const c = this.$.crosshair;
      c.classList.remove('hit', 'blocked'); void c.offsetWidth; c.classList.add(kind === 'blocked' ? 'blocked' : 'hit');
    }
    /** Boss health bar at the top: {name, hp, max, shielded} or null. */
    setBoss(b) {
      const key = b ? b.name + '|' + b.hp + '/' + b.max + (b.shielded ? 'S' : '') : '';
      if (this.cache.boss === key) return;
      this.cache.boss = key;
      this.$.boss.classList.toggle('show', !!b);
      if (!b) return;
      this.$.boss.querySelector('span').textContent = b.name + (b.shielded ? '  🛡 SHIELDED' : '');
      this.$.boss.querySelector('b').style.width = Math.max(0, b.hp / b.max) * 100 + '%';
      this.$.boss.classList.toggle('shielded', !!b.shielded);
    }
    /** Small status chips under the score (e.g. active power-ups): [{text, color}]. */
    setChips(list) {
      const key = JSON.stringify(list || []);
      if (this.cache.chips === key) return;
      this.cache.chips = key;
      this.$.chips.innerHTML = '';
      for (const c of list || []) { const s = el('span', 'gk-chip-hud', c.text); if (c.color) s.style.setProperty('--chip', U.css(c.color)); this.$.chips.appendChild(s); }
    }
    /** Leaderboard table (ui.leaderboard): rows [{name, score, time}], highlight = rank to mark (1-based). */
    leaderTable(rows, highlight, max) {
      if (!rows || !rows.length) return '';
      const list = (this.game.cfg.difficulty && this.game.cfg.difficulty.choices) || this.game.difficultyChoices(), tag = id => {
        const c = list && id && list.find(x => x.id === id);
        return c ? ' <span class="gk-diff-tag d-' + U.esc(c.id) + '">' + U.esc(c.short || c.label || c.id) + '</span>' : '';
      };
      return '<table class="gk-leaders"><tr><th>#</th><th>Name</th><th>Score</th><th>Time</th></tr>' +
        rows.slice(0, max || 5).map((r, i) => '<tr' + (i + 1 === highlight ? ' class="me"' : '') + '><td>' + (i + 1) + '</td><td>' + U.esc(r.name) + tag(r.difficulty) + '</td><td>' + r.score + '</td><td>' + U.time(r.time) + '</td></tr>').join('') + '</table>';
    }
    floatScore(points) {
      const f = el('div', 'gk-float ' + (points < 0 ? 'neg' : ''), (points > 0 ? '+' : '') + points);
      this.hud.appendChild(f);
      setTimeout(() => f.remove(), 1200);
    }

    // ----- screen-space labels (names, objective marker) -----
    /** items: [{text, x, y, cls}] in CSS pixels — game types project their world positions first. */
    drawLabels(items) {
      items = items || [];
      items.forEach((it, i) => {
        let n = this.labelPool[i];
        if (!n) { n = el('div', 'gk-label'); this.labels.appendChild(n); this.labelPool.push(n); }
        if (n.textContent !== it.text) n.textContent = it.text;
        n.className = 'gk-label ' + (it.cls || '');
        n.style.transform = 'translate(' + Math.round(it.x) + 'px,' + Math.round(it.y) + 'px) translate(-50%,-100%)';
      });
      for (let i = items.length; i < this.labelPool.length; i++) this.labelPool[i].style.transform = 'translate(-9999px,0)';
    }

    // ----- panels & dialogue -----
    /** Generic modal panel. opts: {title, text, html, body(node), buttons:[{label, primary, action}], onClose, closable, wide}
        Returns {close, body, note(msg)}. */
    panel(opts) {
      const g = this.game;
      const wrap = el('div', 'gk-modal'), box = el('div', 'gk-panel' + (opts.wide ? ' wide' : ''));
      if (opts.title) box.appendChild(el('h2', '', U.fill(opts.title, g.state.vars)));
      const body = el('div', 'gk-panel-body');
      if (opts.text) U.fill(opts.text, g.state.vars).split(/\n\n+/).forEach(p => body.appendChild(el('p', '', p)));
      if (opts.html) { const h = el('div', 'gk-html'); h.innerHTML = opts.html; body.appendChild(h); }
      if (opts.body) body.appendChild(opts.body);
      box.appendChild(body);
      const btns = el('div', 'gk-panel-buttons');
      let closed = false;
      const close = () => {
        if (closed) return;
        closed = true;
        wrap.remove();
        this.modalDepth--;
        if (this.topClose === close) this.topClose = null;
        g.exitModal();
        if (opts.onClose) opts.onClose();
      };
      const buttons = opts.buttons || [{ label: opts.okLabel || 'OK', primary: true }];
      if (opts.closable !== false && opts.buttons && !opts.noCancel) buttons.push({ label: 'Close' });
      for (const b of buttons) {
        const btn = el('button', 'gk-btn' + (b.primary ? ' primary' : ''), b.label);
        btn.onclick = () => { if (b.action) { if (b.action() === false) return; } close(); };
        btns.appendChild(btn);
      }
      box.appendChild(btns);
      wrap.appendChild(box);
      this.layer.appendChild(wrap);
      this.modalDepth++;
      this.topClose = opts.closable === false ? null : close;
      g.enterModal();
      const fb = () => box.querySelector('.gk-feedback');
      return {
        close, body,
        note: (msg, good) => {
          const f = fb() || body.appendChild(el('div', 'gk-feedback'));
          f.textContent = msg || '';
          f.className = 'gk-feedback ' + (good ? 'good' : 'bad');
          box.classList.remove('shake'); void box.offsetWidth; if (!good) box.classList.add('shake');
        },
      };
    }
    /** Dialogue box. d: {speaker, text, choices:[{text, pick()}], next()} — shows one line at a time. */
    dialog(d) {
      const g = this.game;
      if (!this.dlg) {
        this.dlg = el('div', 'gk-modal gk-dialog-wrap');
        this.dlg.innerHTML = '<div class="gk-dialog"><div class="gk-speaker"></div><div class="gk-line"></div><div class="gk-dchoices"></div></div>';
        this.layer.appendChild(this.dlg);
        this.modalDepth++;
        g.enterModal();
      }
      const q = s => this.dlg.querySelector(s);
      q('.gk-speaker').textContent = d.speaker || '';
      q('.gk-speaker').style.display = d.speaker ? '' : 'none';
      q('.gk-line').textContent = U.fill(d.text, g.state.vars);
      const ch = q('.gk-dchoices');
      ch.innerHTML = '';
      const opts = d.choices && d.choices.length ? d.choices : [{ text: 'Continue ▸', pick: d.next }];
      opts.forEach((c, i) => {
        const b = el('button', 'gk-btn' + (opts.length === 1 ? ' primary' : ' choice'), (opts.length > 1 ? (i + 1) + '. ' : '') + c.text);
        b.onclick = () => { g.audio.play('talk'); c.pick(); };
        ch.appendChild(b);
      });
      this.dlgChoices = opts;
    }
    closeDialog() {
      if (!this.dlg) return;
      this.dlg.remove(); this.dlg = null; this.dlgChoices = null;
      this.modalDepth--;
      this.game.exitModal();
    }
    handleKey(e) {
      if (this.dlgChoices) {
        const n = parseInt(e.key, 10);
        if ((e.key === 'Enter' || e.key === ' ' || e.key === 'e' || e.key === 'E') && this.dlgChoices.length === 1) { e.preventDefault(); this.dlgChoices[0].pick(); }
        else if (n >= 1 && n <= this.dlgChoices.length) this.dlgChoices[n - 1].pick();
        return;
      }
      if (e.key === 'Escape' && this.topClose && this.modalDepth > 0) { e.preventDefault(); this.topClose(); }
    }

    // ----- screens -----
    screen(cls, html) {
      this.hideScreens();
      const s = el('div', 'gk-screen ' + cls);
      s.innerHTML = '<div class="gk-screen-card">' + html + '</div>';
      this.root.appendChild(s);
      this.current = s;
      this.hud.classList.add('hidden');
      return s;
    }
    hideScreens() {
      if (this.current) { this.current.remove(); this.current = null; }
      this.hud.classList.remove('hidden');
    }
    /** Key hints; each game type supplies its own list in its defaults (ui.controls: [[key, label], …]). */
    controlsHtml(cfg) {
      const keys = cfg.ui.controls || [['Esc', 'Pause']];
      return '<div class="gk-controls">' + keys.map(k => '<span><kbd>' + U.esc(k[0]) + '</kbd>' + U.esc(k[1]) + '</span>').join('') + '</div>';
    }
    menuLink(cfg) { return cfg.ui.menuUrl ? '<p><a class="gk-link" href="' + U.esc(cfg.ui.menuUrl) + '">← ' + U.esc(cfg.ui.menuLabel || 'Menu') + '</a></p>' : ''; }
    /** levels: null or {count, unlocked, names} — shows a level picker. onPlay(levelIndex). */
    /** resume (optional): {info: saved resume point, onResume()} — adds a "Continue" box above the Play button. */
    showTitle(cfg, onPlay, levels, resume) {
      const best = this.game.store.get('best', 0);
      let cont = '';
      if (resume) {
        const r = resume.info, when = new Date(r.at);
        const day = isNaN(when) ? '' : when.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + when.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        cont = '<div class="gk-resume"><div class="gk-lead-title">💾 Saved game on this computer</div>' +
          '<p>' + U.esc(r.title || ('Part ' + r.part)) + (r.parts ? ' (' + r.part + ' of ' + r.parts + ')' : '') +
          (r.name ? ' · <b>' + U.esc(r.name) + '</b>' : '') + this.diffName(r.difficulty) + ' · ' + (r.score || 0) + ' points' + (day ? '<br><span class="gk-muted">Saved ' + U.esc(day) + '</span>' : '') + '</p>' +
          '<button class="gk-btn primary big" data-a="resume">▶ Continue' + (r.name ? ' as ' + U.esc(r.name) : '') + '</button>' +
          '<p class="gk-muted">Not you? Type your name below and start a new game.</p></div>';
      }
      let pick = '';
      if (levels) {
        pick = '<div class="gk-levels">' + levels.names.map((n, i) => '<button class="gk-btn' + (i === levels.unlocked - 1 ? ' primary' : '') + '" data-level="' + i + '"' + (i >= levels.unlocked ? ' disabled' : '') + '>' + (i >= levels.unlocked ? '🔒 ' : '') + U.esc(n) + '</button>').join('') + '</div>';
      }
      const ask = !!cfg.ui.askName, lead = cfg.ui.leaderboard ? this.game.leaders() : null;
      // difficulty (config.difficulty): one button per choice; the chosen one is highlighted
      const choices = this.game.difficultyChoices(), dlabels = (cfg.difficulty && cfg.difficulty.choices) || choices;
      // characters (config.characters) and the camera (ui.views, kept per computer in GK.Settings 'view')
      const chars = this.game.characterChoices(), clabels = (cfg.characters && cfg.characters.choices) || chars;
      const who = chars ? '<div class="gk-chars"><div class="gk-diff-title">' + U.esc((cfg.characters && cfg.characters.title) || 'Choose your character') + '</div><div class="gk-chars-row">' +
        clabels.map(c => '<button type="button" class="gk-char' + (c.id === this.game.character ? ' on' : '') + '" data-char="' + U.esc(c.id) + '" aria-pressed="' + (c.id === this.game.character) + '">' +
          this.avatar(c.look || {}) + '<b>' + U.esc(c.label || c.id) + '</b>' + (c.text ? '<span>' + U.esc(c.text) + '</span>' : '') + '</button>').join('') + '</div></div>' : '';
      const cam = this.viewsHtml(cfg);
      const diff = choices ? '<div class="gk-diff"><div class="gk-diff-title">' + U.esc((cfg.difficulty && cfg.difficulty.title) || 'Difficulty') + '</div><div class="gk-diff-row">' +
        dlabels.map(c => '<button type="button" class="gk-diff-btn d-' + U.esc(c.id) + (c.id === this.game.difficulty ? ' on' : '') + '" data-diff="' + U.esc(c.id) + '" aria-pressed="' + (c.id === this.game.difficulty) + '">' +
          '<b>' + U.esc(c.label || c.id) + '</b>' + (c.text ? '<span>' + U.esc(c.text) + '</span>' : '') + '</button>').join('') + '</div></div>' : '';
      const s = this.screen('gk-title-screen',
        '<h1>' + U.esc(cfg.title) + '</h1>' +
        (cfg.subtitle ? '<p class="gk-sub">' + U.esc(cfg.subtitle) + '</p>' : '') +
        (cfg.description ? '<p>' + U.esc(cfg.description) + '</p>' : '') + cont +
        (ask ? '<div class="gk-name"><label for="gk-name">Your name</label><input id="gk-name" class="gk-input" maxlength="18" autocomplete="off" spellcheck="false" placeholder="Type your name"></div>' : '') + who + diff + cam +
        (cfg.ui.showControls !== false ? this.controlsHtml(cfg) : '') +
        (levels ? pick : '<button class="gk-btn ' + (resume ? '' : 'primary ') + 'big" data-level="0">' + (resume ? '★ New game' : '▶ Play') + '</button>') +
        (lead && lead.length ? '<div class="gk-lead-title">🏆 Top players on this computer</div>' + this.leaderTable(lead, 0, 5) : '') +
        (best && !lead ? '<p class="gk-muted">Best score on this computer: ' + best + '</p>' : '') + this.menuLink(cfg));
      const nameBox = s.querySelector('#gk-name');
      if (nameBox) {
        nameBox.value = this.game.playerName || '';   // only within this page: the next student on a shared PC types their own
        setTimeout(() => nameBox.focus(), 50);
        nameBox.onkeydown = e => { if (e.key === 'Enter') { const b = s.querySelector('[data-level]:not([disabled])'); if (b) b.click(); } };
      }
      const rb = s.querySelector('[data-a=resume]');
      if (rb) rb.onclick = resume.onResume;
      s.querySelectorAll('[data-char]').forEach(b => {
        b.onclick = () => {
          this.game.setCharacter(b.getAttribute('data-char'));

        };

      this.bindViews(s);
      s.querySelectorAll('[data-diff]').forEach(b => {
        b.onclick = () => {

          s.querySelectorAll('[data-diff]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
        };

      this.game.emit('ui:title', { screen: s, nameBox });   // mechanics may add to the title screen (e.g. an online room box)
      s.querySelectorAll('[data-level]').forEach(b => {
        b.onclick = () => {

          onPlay(Number(b.getAttribute('data-level')));

    /** A small SVG portrait from a character look: skin, hair + hairStyle (short / spiky / long / ponytail), shirt, accent. */
    avatar(o) {
      const skin = U.css(o.skin || '#e0ac69'), hair = U.css(o.hair || '#3b2a1a'), shirt = U.css(o.shirt || '#2f80ed'), acc = U.css(o.accent || '#4cc9f0'), hs = o.hairStyle || 'short';
      let back = '', front = '';
      if (hs === 'long') back = '<path d="M17 24 Q16 46 20 50 L44 50 Q48 46 47 24 Z" fill="' + hair + '"/>';
      if (hs === 'ponytail') back = '<path d="M44 20 Q56 24 52 42 Q50 34 44 30 Z" fill="' + hair + '"/>';
      if (hs === 'spiky') front = '<path d="M18 22 L20 11 L25 18 L28 8 L32 17 L36 8 L39 18 L44 11 L46 22 Z" fill="' + hair + '"/>';
      else front = '<path d="M18 25 Q17 11 32 11 Q47 11 46 25 Q40 18 32 19 Q24 18 18 25 Z" fill="' + hair + '"/>';
      return '<svg class="gk-avatar" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="' + acc + '" opacity=".25"/>' + back +
        '<path d="M12 64 Q12 46 32 46 Q52 46 52 64 Z" fill="' + shirt + '"/><rect x="28" y="38" width="8" height="9" fill="' + skin + '"/>' +
        '<rect x="19" y="16" width="26" height="25" rx="7" fill="' + skin + '"/>' + front +
        '<circle cx="27" cy="29" r="2.2" fill="#1e1e24"/><circle cx="37" cy="29" r="2.2" fill="#1e1e24"/><path d="M28 35 Q32 38 36 35" stroke="#9e4a3c" stroke-width="1.8" fill="none" stroke-linecap="round"/>' +
        '<rect x="36" y="52" width="5" height="5" rx="1" fill="' + acc + '"/></svg>';
    }
    /** ' · Easy' for a saved game's difficulty ('' without the setting). */
    diffName(id) {
      const list = this.game.difficultyChoices(), c = list && id && list.find(x => x.id === id);
      const lab = c && ((this.game.cfg.difficulty && (this.game.cfg.difficulty.choices.find(x => x.id === id) || {}).label) || c.label || c.id);
      return lab ? ' · ' + U.esc(lab) : '';
    }
    showPause(cfg, h) {
      const s = this.screen('gk-pause-screen',
        '<h2>Paused</h2>' + (cfg.ui.pauseNote ? '<p class="gk-sub">' + U.esc(cfg.ui.pauseNote) + '</p>' : '') +   // ui.pauseNote: e.g. "the race goes on"
        '<button class="gk-btn primary big" data-a="resume">▶ Resume</button>' +
        '<div class="gk-row center">' + (h.checkpoint ? '<button class="gk-btn" data-a="checkpoint">↩ Last checkpoint</button>' : '') + (cfg.ui.restart === false ? '' : '<button class="gk-btn" data-a="restart">⟲ Restart</button>') +
        '<button class="gk-btn" data-a="sound">' + (this.game.audio.muted ? '🔇 Sound off' : '🔊 Sound on') + '</button></div>' +
        this.viewsHtml(cfg) + this.controlsHtml(cfg) + this.menuLink(cfg));
      this.bindViews(s);
      s.querySelector('[data-a=resume]').onclick = h.resume;
      const rs = s.querySelector('[data-a=restart]');   // ui.restart: false hides it (a class race cannot restart one PC)
      if (rs) rs.onclick = h.restart;
      const cp = s.querySelector('[data-a=checkpoint]');
      if (cp) cp.onclick = h.checkpoint;
      const snd = s.querySelector('[data-a=sound]');
      snd.onclick = () => { h.sound(); snd.textContent = this.game.audio.muted ? '🔇 Sound off' : '🔊 Sound on'; };
    }
    /** Camera choice (ui.views, e.g. first / third person) for the title and pause screens; kept in GK.Settings 'view'. */
    viewsHtml(cfg) {
      const views = cfg.ui.views;
      if (!views || views.length < 2) return '';
      const cur = GK.Settings.get('view', views[0][0]);
      return '<div class="gk-views"><span class="gk-diff-title">Camera</span>' +
        views.map(v => '<button type="button" class="gk-view' + (v[0] === cur ? ' on' : '') + '" data-view="' + U.esc(v[0]) + '" aria-pressed="' + (v[0] === cur) + '">' + U.esc(v[1]) + '</button>').join('') + '</div>';
    }
    bindViews(s) {
      s.querySelectorAll('[data-view]').forEach(b => {
        b.onclick = () => {
          GK.Settings.set('view', b.getAttribute('data-view'));
          s.querySelectorAll('[data-view]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
          this.game.emit('view', { view: b.getAttribute('data-view') });
        };
      });
    }
    /** r: {won, reason, total, stars, maxStars, best, breakdown, time, done, required}; h: {restart, next, checkpoint} */
    showEnd(cfg, r, h) {
      const rows = r.breakdown.map(b => '<tr><td>' + U.esc(b.label) + (b.count > 1 ? ' ×' + b.count : '') + '</td><td class="' + (b.points < 0 ? 'neg' : '') + '">' + (b.points > 0 ? '+' : '') + b.points + '</td></tr>').join('');
      const stars = r.maxStars ? '<div class="gk-stars">' + '★'.repeat(r.stars) + '<span>' + '★'.repeat(r.maxStars - r.stars) + '</span></div>' : '';
      const text = U.fill(r.reason || (r.won ? cfg.winText || 'Well done!' : cfg.loseText || 'Try again!'), this.game.state.vars);
      const s = this.screen('gk-end-screen ' + (r.won ? 'won' : 'lost'),
        '<h1>' + (r.won ? '🏆 ' + U.esc(cfg.ui.winTitle || 'Complete!') : U.esc(cfg.ui.loseTitle || 'Game over')) + '</h1>' +
        '<p>' + U.esc(text) + '</p>' + stars +
        '<div class="gk-final"><b>' + r.total + '</b><span>points</span></div>' +
        '<div class="gk-summary"><span>⏱ ' + U.time(r.time) + '</span>' + (r.required != null ? '<span>✓ ' + r.done + ' / ' + r.required + ' objectives</span>' : '') + (r.best ? '<span>Best: ' + r.best + '</span>' : '') + '</div>' +
        (r.leaders ? '<div class="gk-lead-title">' + (r.rank ? '🏆 ' + U.esc(r.playerName) + ', you are #' + r.rank + ' on this computer!' : 'Not in the top 10 yet: try again!') + '</div>' + this.leaderTable(r.leaders, r.rank, 5) : '') +
        (rows ? '<table class="gk-breakdown">' + rows + '<tr class="total"><td>Final score</td><td>' + r.total + '</td></tr></table>' : '') +
        '<div class="gk-row center">' + (h.next ? '<button class="gk-btn primary big" data-a="next">Next level ▶</button>' : '') +
        '<button class="gk-btn big' + (h.next ? '' : ' primary') + '" data-a="restart">⟲ Play again</button>' +
        (!r.won && h.checkpoint ? '<button class="gk-btn big" data-a="checkpoint">↩ From checkpoint</button>' : '') + '</div>' + this.menuLink(cfg));
      s.querySelector('[data-a=restart]').onclick = h.restart;
      const nx = s.querySelector('[data-a=next]');
      if (nx) nx.onclick = h.next;
      const cp = s.querySelector('[data-a=checkpoint]');
      if (cp) cp.onclick = h.checkpoint;
    }    /** Developer banner (only on a local server or with ?debug=1): configuration problems at a glance. */
    showProblems(list) {
      if (this.problemBox) this.problemBox.remove();
      const b = this.problemBox = el('div', 'gk-problem-banner');
      b.innerHTML = '<b>⚠ ' + list.length + ' configuration problem' + (list.length > 1 ? 's' : '') + '</b> <small>(only shown while developing · Ctrl+Shift+T for details)</small><ul>' +
        list.slice(0, 6).map(p => '<li>' + U.esc(p.msg) + '</li>').join('') + (list.length > 6 ? '<li>…</li>' : '') + '</ul>';
      b.onclick = () => b.remove();
      this.root.appendChild(b);
    }
    error(msg) {
      this.screen('gk-error-screen', '<h2>Something went wrong</h2><p>' + U.esc(msg) + '</p><p class="gk-muted">Press F5 to reload the game. (Details are in the browser console.)</p>');
    }
    clearLayer() {
      this.layer.innerHTML = '';
      if (this.problemBox) { this.problemBox.remove(); this.problemBox = null; }
      this.dlg = null; this.dlgChoices = null; this.topClose = null; this.modalDepth = 0;
      this.$.toasts.innerHTML = '';
      this.cache = {};
    }
    destroy() { document.removeEventListener('keydown', this.onKey); }
  }
  GK.UI = UI;
})();

</script>
<script>/* core/scoring.js */
/* Game Kit · core/scoring.js
   Keeps a log of every score change ({points, label, kind}) so the end screen can show a breakdown.
   Config (config.scoring):
     objective: 100          default points per objective (override with objective.points)
     hint: 10                penalty per hint shown
     wrongAnswer: 5          penalty per wrong puzzle answer
     respawn: 0              penalty for falling out of the world
     timeBonus: {perSecondLeft: 2} | {par: 180, perSecond: 3, max: 500}
     completionBonus: 0      added when the game is won
     stars: [300, 600, 900]  score needed for 1/2/3 stars (optional)
     allowNegative: false */
(function () {
  'use strict';
  const KIND_LABELS = { objective: 'Objectives', collect: 'Collectibles', puzzle: 'Puzzles', bonus: 'Bonuses', time: 'Time bonus', hint: 'Hints used', penalty: 'Penalties', wrong: 'Wrong answers' };

  class Scoring {
    constructor(game, cfg) {
      this.game = game; this.cfg = cfg || {};
      this.log = []; this.raw = 0;
    }
    /** The score shown. The true sum of the log is kept in `raw`, so an early penalty still counts later and the
        end-screen breakdown always adds up; only the displayed value is floored at 0 (unless allowNegative). */
    get total() { return this.cfg.allowNegative ? this.raw : Math.max(0, this.raw); }
    set total(v) { this.raw = v; }
    add(points, label, kind) {
      // a mechanic may multiply good points for a while (e.g. a power-up): game.scoreMultiplier(kind) -> number
      if (points > 0 && kind !== 'time' && this.game.scoreMultiplier) points *= this.game.scoreMultiplier(kind) || 1;
      points = Math.round(points || 0);
      if (!points) return;
      this.log.push({ points, label: label || '', kind: kind || 'bonus' });
      this.raw += points;
      this.game.emit('score', { points, label, kind, total: this.total });
      this.game.ui.floatScore(points);
    }
    timeBonus() {
      const tb = this.cfg.timeBonus, g = this.game;
      if (!tb) return 0;
      if (tb.perSecondLeft && g.state.timeLimit) return Math.max(0, Math.round((g.state.timeLimit - g.state.time) * tb.perSecondLeft));
      if (tb.par) return Math.min(tb.max || Infinity, Math.max(0, Math.round((tb.par - g.state.time) * (tb.perSecond || 1))));
      return 0;
    }
    /** Called once when the game ends. Returns the summary shown on the end screen. */
    finish(won) {
      if (won) {
        this.add(this.timeBonus(), 'Time bonus', 'time');
        this.add(this.cfg.completionBonus || 0, 'Completed', 'bonus');
      }
      const stars = this.cfg.stars ? this.cfg.stars.filter(s => this.total >= s).length : null;
      const best = this.saveBest(won);
      return { total: this.total, stars, maxStars: this.cfg.stars ? this.cfg.stars.length : 0, best, breakdown: this.breakdown() };
    }
    breakdown() {
      const groups = {};
      for (const e of this.log) {
        const g = groups[e.kind] = groups[e.kind] || { kind: e.kind, label: KIND_LABELS[e.kind] || e.kind, points: 0, count: 0 };
        g.points += e.points; g.count++;
      }
      return Object.values(groups);
    }
    saveBest(won) {
      const store = this.game.store, key = 'best' + (this.game.levelCount > 1 ? '.' + this.game.levelIndex : '');
      let best = Number(store.get(key, 0)) || 0;
      if (won && this.total > best) { best = this.total; store.set(key, best); }
      return best;
    }
  }
  GK.Scoring = Scoring;
  GK.Scoring.KIND_LABELS = KIND_LABELS;
})();

</script>
<script>/* core/validate.js */
/* Game Kit · core/validate.js
   Finds configuration mistakes that would otherwise fail silently: a typo in a config key, an unknown game type,
   mechanic, entity type, model, interaction or location, an objective pointing at nothing, a missing content text.
   Runs after each level is set up. Problems go to the console, to game.problems, to the teacher panel, and — while
   developing (?debug=1 or a localhost server) — to a red banner. Mechanics add checks with validate(game, report). */
(function () {
  'use strict';
  const U = GK.util;
  const KNOWN = ['id', 'title', 'subtitle', 'description', 'grade', 'subject', 'type', 'world', 'worlds', 'mechanics', 'scripts',
    'content', 'levels', 'scenes', 'startScene', 'resume', 'difficulty', 'characters', 'map', 'entities', 'zones', 'templates', 'items', 'puzzles', 'sequences',
    'locations', 'spawns', 'routes', 'spawn', 'slots', 'environment', 'render', 'view', 'player', 'objectives', 'ordered', 'timer',
    'scoring', 'hints', 'win', 'lose', 'ui', 'audio', 'controls', 'hooks', 'triggers', 'vars', 'flags', 'intro',
    'winText', 'loseText', 'teacher', 'quiz'];

  /** Returns [{level: 'error' | 'warn', msg}] for the current level. */
  GK.validate = function (game) {
    const out = [], base = game.base;
    const report = (msg, level) => { if (!out.some(p => p.msg === msg)) out.push({ level: level || 'warn', msg }); };
    const lr = window.GK_LOADER && window.GK_LOADER.result;
    if (lr) lr.warnings.forEach(w => report(w, 'error'));

    const type = GK.GameTypes.get(game.typeName);
    const known = new Set(KNOWN.concat(Object.keys(type.defaults || {})));
    for (const m of game.mechanics) U.list(m.configKeys).forEach(k => known.add(k));
    const stages = U.list(base.levels || base.scenes);
    for (const src of [base].concat(stages)) {
      for (const k in src) if (!known.has(k)) report('Unknown config key "' + k + '" — a typo? (known keys: docs/CONFIG.md)');
    }
    (game.contentProblems || []).forEach(p => report(p));

    if (game.world) {
      game.world.problems.forEach(p => report(p));
      for (const e of game.world.entities) {
        for (const d of e.interact) {
          if (d.type && !GK.Interactions.has(d.type)) report('Entity "' + e.id + '": unknown interaction type "' + d.type + '" (is its mechanic loaded?)', 'error');
        }
      }
    }
    for (const m of game.mechanics) if (m.validate) m.validate(game, report);
    if (game.view.validate) game.view.validate(report);
    return out;
  };
})();

</script>
<script>/* core/teacher.js */
/* Game Kit · core/teacher.js
   Teacher / debug mode for the classroom. Open with Ctrl+Shift+T (or add ?teacher to the address).
   Optional PIN: config.teacher.pin (keeps curious students out; it is not real security — the files are open).
   The game pauses. The panel offers: complete the current objective or the whole level, go to any level/scene,
   unlock all levels, the answers, results history on this computer, reset this game's saved data,
   per-computer settings (low graphics for slow PCs, sound, debug overlay with FPS / position / named places),
   and the configuration problems found by core/validate.js.
   GK.Settings = settings for THIS computer, shared by every game: {quality: 'normal' | 'low', muted, overlay}. */
(function () {
  'use strict';
  const U = GK.util;
  GK.Settings = new GK.Store('_settings');

  class Teacher {
    constructor(game) {
      this.game = game;
      this.isOpen = false;
      this.unlocked = false;
      this.onKey = e => { if (e.ctrlKey && e.shiftKey && e.code === 'KeyT') { e.preventDefault(); this.isOpen ? this.close() : this.open(); } };
      document.addEventListener('keydown', this.onKey);
    }
    open() {
      const g = this.game;
      if (this.isOpen) return;
      this.isOpen = true;
      this.prevMode = g.state.mode;
      if (g.state.mode === 'playing') g.pause();
      else if (g.view.onModal) g.view.onModal(true);
      const pin = g.cfg.teacher && g.cfg.teacher.pin;
      if (pin && !this.unlocked) this.askPin(String(pin)); else this.render();
    }
    close() {
      const g = this.game;
      if (!this.isOpen) return;
      this.isOpen = false;
      g.ui.hideScreens();
      const m = g.state.mode;
      if (m === 'title') g.showTitle();
      else if (m === 'ended' && g.result) g.ui.showEnd(g.cfg, g.result, g.endHandlers);
      else if (m === 'paused') g.resume();
    }
    askPin(pin) {
      const s = this.game.ui.screen('gk-teacher-screen', '<h2>Teacher</h2><p>Enter the teacher PIN</p><div class="gk-row center"><input class="gk-input" type="password" style="max-width:180px"><button class="gk-btn primary" data-a="ok">OK</button><button class="gk-btn" data-a="close">Cancel</button></div><p class="gk-feedback bad"></p>');
      const inp = s.querySelector('input'), check = () => {
        if (inp.value === pin) { this.unlocked = true; this.render(); } else { s.querySelector('.gk-feedback').textContent = 'Wrong PIN'; inp.select(); }
      };
      s.querySelector('[data-a=ok]').onclick = check;
      inp.onkeydown = e => { if (e.key === 'Enter') check(); };
      s.querySelector('[data-a=close]').onclick = () => this.close();
      setTimeout(() => inp.focus(), 30);
    }
    render() {
      const g = this.game, esc = U.esc, cfg = g.cfg;
      const sec = (title, html) => '<section><h3>' + title + '</h3>' + html + '</section>';
      const btn = (a, label, cls) => '<button class="gk-btn' + (cls ? ' ' + cls : '') + '" data-a="' + a + '">' + label + '</button>';
      let html = '<h2>🧑‍🏫 Teacher</h2><p class="gk-muted">' + esc(cfg.title) + ' · ' + (g.stages ? (g.sceneMode ? 'scene ' : 'level ') + (g.levelIndex + 1) + ' of ' + g.levelCount + ' · ' : '') +
        'time ' + U.time(g.state.time) + ' · score ' + g.scoring.total + '</p>';
      html += '<div class="gk-row center">' + btn('close', '▶ Back to the game', 'primary') + btn('restart', '⟲ Restart') + '</div>';

      // progress
      let prog = '';
      if (g.missions) {
        prog += '<table class="gk-tlist">' + g.missions.list.map(o => '<tr><td>' + (o.status === 'done' ? '✓' : o.status === 'active' ? '▶' : '·') + '</td><td>' + esc(o.title || o.id) + '</td><td>' +
          (o.status === 'active' ? '<button class="gk-btn small" data-complete="' + esc(o.id) + '">Complete</button>' : esc(o.status)) + '</td></tr>').join('') + '</table>';
      }
      prog += '<div class="gk-row">' + btn('win', '🏆 Finish this ' + (g.sceneMode ? 'game' : 'level') + ' (win)');
      if (g.stages) {
        prog += '<select class="gk-select" data-a="stage">' + g.stages.map((s, i) => '<option value="' + i + '"' + (i === g.levelIndex ? ' selected' : '') + '>' + esc(s.title || s.id || ((g.sceneMode ? 'Scene ' : 'Level ') + (i + 1))) + '</option>').join('') + '</select>' + btn('go', 'Go');
        if (!g.sceneMode) prog += btn('unlock', '🔓 Unlock all levels');
      }
      html += sec('Progress', prog + '</div>');

      const answers = g.answers();
      if (answers.length) html += sec('Answers', '<table class="gk-tlist">' + answers.map(a => '<tr><td>' + esc(a.where) + '</td><td><b>' + esc(a.answer) + '</b></td></tr>').join('') + '</table>');

      const hist = g.store.get('history', []).slice(-10).reverse();
      html += sec('Results on this computer', hist.length ? '<table class="gk-tlist">' + hist.map(h => '<tr><td>' + esc(h.at.slice(0, 16).replace('T', ' ')) + '</td><td>' + (g.levelCount > 1 ? 'L' + h.level + ' ' : '') + (h.won ? '🏆' : '✗') + '</td><td>' + h.score + ' pts</td><td>' + U.time(h.time) + '</td><td>' + h.hints + ' hints</td></tr>').join('') + '</table>' : '<p class="gk-muted">No finished games yet.</p>');

      const q = GK.Settings.get('quality', 'normal'), ov = GK.Settings.get('overlay', false);
      html += sec('This computer', '<div class="gk-row">' +
        btn('quality', q === 'low' ? '🐢 Graphics: low (faster)' : '✨ Graphics: normal') +
        btn('sound', g.audio.muted ? '🔇 Sound off' : '🔊 Sound on') +
        btn('overlay', ov ? '🛠 Debug overlay: on' : '🛠 Debug overlay: off') +
        btn('reset', '🗑 Reset saved data for this game', 'danger') + '</div>');

      const probs = g.problems || [];
      html += sec('Configuration check', probs.length ? '<ul class="gk-problems">' + probs.map(p => '<li class="' + p.level + '">' + esc(p.msg) + '</li>').join('') + '</ul>' : '<p class="gk-muted">✓ No problems found.</p>');

      const s = g.ui.screen('gk-teacher-screen', html);
      const on = (a, fn) => { const b = s.querySelector('[data-a=' + a + ']'); if (b) b.onclick = fn; };
      on('close', () => this.close());
      on('restart', () => { this.isOpen = false; g.restart(); });
      on('win', () => { this.isOpen = false; g.ui.hideScreens(); g.state.mode = 'playing'; g.win('Finished by the teacher.'); });
      on('go', () => { const i = Number(s.querySelector('[data-a=stage]').value); this.isOpen = false; g.loadLevel(i); });
      on('unlock', () => { g.store.set('unlocked', g.levelCount); g.ui.toast('All levels unlocked on this computer', 'good'); });
      on('quality', () => { GK.Settings.set('quality', q === 'low' ? 'normal' : 'low'); if (g.view.applySettings) g.view.applySettings(); this.render(); });
      on('sound', () => { g.audio.setMuted(!g.audio.muted); GK.Settings.set('muted', g.audio.muted); this.render(); });
      on('overlay', () => { GK.Settings.set('overlay', !ov); this.render(); });
      on('reset', () => {
        const b = s.querySelector('[data-a=reset]');
        if (b.dataset.sure) { g.store.clear(); g.ui.toast('Saved data cleared', 'good'); this.render(); } else { b.dataset.sure = 1; b.textContent = 'Click again to delete best scores, unlocked levels and results'; }
      });
      s.querySelectorAll('[data-complete]').forEach(b => { b.onclick = () => { g.missions.complete(b.getAttribute('data-complete')); g.missions.check(); this.render(); }; });
    }
    destroy() { document.removeEventListener('keydown', this.onKey); }
  }
  GK.Teacher = Teacher;
})();

</script>
<script>/* core/game.js */
/* Game Kit · core/game.js
   The Game owns what every game has, whatever it looks like: config, state, lifecycle
   (title → playing ⇄ paused/modal → ended), stages (levels OR scenes), timers, rules, scoring, UI, audio,
   input, save store, validation, teacher mode, snapshot/restore.
   Everything visual/spatial is delegated to the GAME TYPE's view:
     view = GK.GameTypes.get(cfg.type).create(game)  → setup() begin() update(dt, mode) render() onModal(open)
                                                        teardown() destroy() snapshot(out) restore(snap, opts) validate(report) answers()
   Gameplay comes from MECHANICS (every loaded mechanic, dependencies first):
     setup(game) start(game) update(game, dt) snapshot(game, out) restore(game, snap) validate(game, report) answers(game)
   Stages: `levels` = separate rounds (fresh state, unlocked one by one); `scenes` = places of ONE game that you travel
   between with {do:'goto', scene, spawn} — inventory, flags, score and objectives carry over and each scene
   remembers its objects. Start a game with GK.start(GAME) (core/load.js does this for you). */
(function () {
  'use strict';
  const U = GK.util;

  const DEFAULTS = {
    id: 'game', title: 'Untitled game', subtitle: '', description: '',
    type: 'first-person-3d', world: null, environment: {}, player: {},
    objectives: [], ordered: false, triggers: [], vars: {}, flags: [],
    timer: { limit: null, show: true, warnAt: 30, pauseInDialogs: false, onExpire: null },
    scoring: { objective: 100, hint: 10, wrongAnswer: 5, respawn: 0, timeBonus: null, completionBonus: 0, stars: null, allowNegative: false },
    hints: { max: null, general: [] },
    win: null,      // null = when all required objectives are done (objectives mechanic); or a condition
    lose: [],       // [{if: condition, text: 'reason', checkpoint: true}]
    ui: { accent: '#4cc9f0', markers: true, showControls: true, labelRange: 10, crosshair: false, lockHint: false, menuUrl: null, menuLabel: 'Menu', askName: false, leaderboard: false },
    audio: { muted: false, volume: 0.7, sounds: {} },
    teacher: { pin: null },
    resume: false,  // scene games: save on THIS computer as each scene (act) starts; the title screen offers "Continue"
    difficulty: null,  // {default: 'hard', choices: [{id, label, text, …options}]}: the title screen asks; mechanics read game.difficultyOpts()
    characters: null,  // {default, title, choices: [{id, label, text, look}]}: who you play; views read game.characterLook()
    controls: {},
    hooks: {},      // setup(game) start(game) update(game, dt) win(game) lose(game)
  };
  const DEV = () => /[?&]debug=1/.test(location.search) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

  class Game {
    constructor(config, options) {
      this.options = options || {};
      this.base = config;
      this.stages = config.levels || config.scenes || null;
      this.sceneMode = !!config.scenes;
      this.levelCount = this.stages ? this.stages.length : 1;
      this.sceneMemory = {};
      this.store = new GK.Store(config.id || 'game');
      this.events = new GK.Events();
      this.root = document.getElementById('gk-root') || document.body.appendChild(U.el('div'));
      this.root.classList.add('gk-root');
      this.input = new GK.Input(this.root, config.controls);
      this.audio = new GK.Audio(config.audio);
      if (GK.Settings.get('muted', false)) this.audio.setMuted(true);
      this.ui = new GK.UI(this, this.root);
      // Every mechanic that was loaded takes part, in load order (the loader puts dependencies first).
      this.mechanics = Object.keys(GK.Mechanics.items).map(name => Object.assign({ name }, GK.Mechanics.items[name]));
      this.onBlur = () => { if (this.state && this.state.mode === 'playing') this.pause(); };
      window.addEventListener('blur', this.onBlur);
      this.teacher = new GK.Teacher(this);

      this.difficulty = this.validDifficulty(this.options.difficulty || (location.search.match(/[?&]difficulty=(\w+)/) || [])[1]);
      this.character = this.validCharacter(this.options.character || (location.search.match(/[?&]character=(\w+)/) || [])[1]);
      const first = this.options.level != null ? this.options.level : this.sceneMode ? Math.max(0, this.stageIndex(config.startScene || 0)) : 0;
      this.configure(first);
      this.setup();
      if (this.options.autostart) this.begin();
      else this.showTitle();
      if (!this.options.manual) {
        this.last = performance.now();
        const loop = t => {
          this.raf = requestAnimationFrame(loop);
          const dt = Math.min(0.05, (t - this.last) / 1000);
          this.last = t;
          this.fps = this.fps ? this.fps * 0.95 + (dt > 0 ? 1 / dt : 60) * 0.05 : 60;
          try { this.frame(dt); } catch (e) { this.crash(e); }
        };
        this.raf = requestAnimationFrame(loop);
      }
      if (/[?&]debug=1/.test(location.search)) window.game = this;
      if (/[?&]teacher/.test(location.search)) this.teacher.open();
    }

    // ================= configuration & stages =================
    stageIndex(ref) {
      if (typeof ref === 'number') return ref;
      return this.stages ? this.stages.findIndex(s => s.id === ref) : -1;
    }
    /** Effective config for stage i = kit defaults ← game-type defaults ← game config ← stage overrides, with
        "content:…" references resolved and the world definition attached (cfg.worldDef). */
    configure(i) {
      const base = this.base, stage = this.stages ? (this.stages[i] || {}) : {};
      const typeName = stage.type || base.type || DEFAULTS.type;
      const type = GK.GameTypes.get(typeName);
      const content = base.content || window.GAME_CONTENT || {};
      this.contentProblems = [];
      // a stage's `title` names the stage ("Round 1"); it must not replace the game's title
      const stageCfg = Object.assign({}, stage);
      delete stageCfg.title;
      const cfg = GK.resolveContent(U.merge(DEFAULTS, type.defaults, base, stageCfg), content, null, this.contentProblems);
      cfg.stageTitle = stage.title ? GK.resolveContent(stage.title, content) : null;
      cfg.levels = cfg.scenes = undefined;
      cfg.content = content;
      if (type.spatial) {
        // world: a library name ('computer-lab'), an inline world object, or nothing (the game's own `map`)
        const w = cfg.world || {};
        if (typeof w === 'string' && !GK.Worlds.has(w)) throw new Error('World "' + w + '" is not loaded — check the name (worlds/' + w + '/world.js).');
        cfg.worldDef = typeof w === 'string' ? GK.Worlds.get(w) : w;
        // lighting: game-type defaults ← the world's own lighting ← the game's `environment` ← the stage's
        cfg.environment = U.merge(type.defaults && type.defaults.environment, cfg.worldDef.lighting, base.environment, stage.environment);
      }
      this.cfg = cfg;
      this.levelIndex = i;
      this.stageId = stage.id || null;
      if (this.typeName !== typeName) {
        if (this.view) this.view.destroy();
        this.view = type.create(this);
        this.typeName = typeName;
      }
      this.ui.applyConfig(cfg);
    }
    /** (Re)build everything for the current stage. Called at load, on restart, level change and scene travel. */
    setup() {
      const cfg = this.cfg;
      if (this.view.teardown) this.view.teardown();
      this.events.clear();
      this.timers = [];
      this.focus = null; this.modal = 0; this.pendingTravel = null;
      this.state = { mode: 'title', time: 0, timeLimit: cfg.timer.limit || null, flags: {}, vars: U.merge(cfg.vars), events: {} };
      for (const f of U.list(cfg.flags)) this.state.flags[f] = true;
      if (this.playerName) this.state.vars.playerName = this.playerName;   // typed on the title screen; kept on restart
      if (this.difficulty) this.state.vars.difficulty = this.difficulty;   // chosen on the title screen; kept on restart
      if (this.character) this.state.vars.character = this.character;
      this.builtFor = this.difficulty;   // the scene was built for this difficulty (a new choice rebuilds it)
      this.scoring = new GK.Scoring(this, cfg.scoring);
      this.ui.clearLayer();
      this.view.setup();
      for (const m of this.mechanics) if (m.setup) m.setup(this);
      this.setupTriggers();
      if (cfg.hooks.setup) cfg.hooks.setup(this);
      this.ui.update(this);
      this.ui.prompt(null);
      this.problems = GK.validate(this);
      if (this.problems.length) {
        console.warn('[GK] ' + this.problems.length + ' configuration problem(s) in "' + cfg.id + '":\n  ' + this.problems.map(p => p.msg).join('\n  '));
        if (DEV()) this.ui.showProblems(this.problems);
      }
    }
    begin() {
      this.state.mode = 'playing';
      this.input.clear();
      if (this.view.begin) this.view.begin();
      this.emit('game:start', { level: this.levelIndex });
      if (this.cfg.intro) GK.run(this, this.cfg.intro);
      if (this.cfg.hooks.start) this.cfg.hooks.start(this);
      for (const m of this.mechanics) if (m.start) m.start(this);
    }
    loadLevel(i) {
      this.ui.hideScreens();
      this.sceneMemory = {};
      this.configure(i);
      this.setup();
      this.begin();
    }
    /** The name typed on the title screen (ui.askName): kept for restarts while the page is open (not saved: lab PCs are shared). */
    setPlayerName(name) {
      this.playerName = String(name || '').trim().slice(0, 18) || 'Player';
      this.state.vars.playerName = this.playerName;
    }
    // ================= difficulty (config.difficulty) =================
    /** The choices ({id, label, text, …options}) or null when the game has no difficulty setting. */
    difficultyChoices() { const d = this.base.difficulty; return d && Array.isArray(d.choices) && d.choices.length ? d.choices : null; }
    /** A known choice id, else the game's default (else the last choice), else null. */
    validDifficulty(id) {
      const list = this.difficultyChoices();
      if (!list) return null;
      if (list.some(c => c.id === id)) return id;
      const d = this.base.difficulty.default;
      return list.some(c => c.id === d) ? d : list[list.length - 1].id;
    }
    setDifficulty(id) { this.difficulty = this.validDifficulty(id); if (this.state) this.state.vars.difficulty = this.difficulty; }
    /** Options of the chosen difficulty (e.g. {enemies: 0.5}); {} for a game without the setting. */
    difficultyOpts() { const list = this.difficultyChoices(); return (list && list.find(c => c.id === this.difficulty)) || {}; }
    // ================= characters (config.characters) =================
    characterChoices() { const d = this.base.characters; return d && Array.isArray(d.choices) && d.choices.length ? d.choices : null; }
    validCharacter(id) {
      const list = this.characterChoices();
      if (!list) return null;
      if (list.some(c => c.id === id)) return id;
      const d = this.base.characters.default;
      return list.some(c => c.id === d) ? d : list[0].id;
    }
    setCharacter(id) { this.character = this.validCharacter(id); if (this.state) this.state.vars.character = this.character; this.emit('character', { id: this.character }); }
    /** The chosen character's look (skin, hair, shirt…), or null for a game without characters. */
    characterLook() { const list = this.characterChoices(); const c = list && list.find(x => x.id === this.character); return c ? Object.assign({}, c.look) : null; }
    /** Best results on this computer (ui.leaderboard): [{name, score, time, stars, at}], best first. */
    leaders() { return this.store.get('leaders', []); }
