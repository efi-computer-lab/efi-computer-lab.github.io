<script>/* mechanics/interaction/interaction.js */
/* Game Kit · mechanics/interaction
   "Press E (or click) on the thing in focus." The game type decides WHAT is in focus (first-person: the
   crosshair raycast; top-down: the nearest thing in reach) and calls game.setFocus(entity).
   This mechanic owns the interaction-type registry and runs an entity's current interaction:
     entity.interact: {type, prompt, if, requires, lockedText, once, actions} (or a list; first passing `if` wins)
   Built-in types here: inspect · activate (optionally toggle on/off) · trigger.
   Other mechanics add more: pickup/use (inventory), talk (dialogue), puzzle/input (puzzles), open/close/toggle (world-objects). */
(function () {
  'use strict';
  const U = GK.util;
  const I = GK.Interactions;

  I.add('inspect', {
    prompt: 'Inspect',
    run(g, ent, def, done) {
      g.ui.panel({ title: def.title || ent.name, text: U.fill(def.text, g.state.vars), html: def.html, onClose: () => done(true) });
      g.emit('inspect', { id: ent.id });
    },
  });
  I.add('activate', {
    prompt: (ent, def) => (def.toggle ? (ent.state.on ? 'Turn off' : 'Turn on') : 'Use'),
    run(g, ent, def, done) {
      ent.pressT = 0.2;
      g.audio.play(def.sound || 'click');
      if (def.toggle) {
        ent.state.on = !ent.state.on;
        if (ent.look && 'on' in ent.look) ent.setLook({ on: ent.state.on });
        GK.run(g, ent.state.on ? def.on : def.off, { entity: ent });
        g.emit('switch', { id: ent.id, on: ent.state.on });
      }
      done(true);
    },
  });
  I.add('trigger', { prompt: 'Use', run(g, ent, def, done) { g.audio.play(def.sound || 'click'); done(true); } });

  /** Prompt text for an entity's current interaction, e.g. "Talk to Ada". */
  GK.promptFor = function (g, ent, def) {
    if (def.prompt) return U.fill(typeof def.prompt === 'function' ? def.prompt(ent, def, g) : def.prompt, g.state.vars);
    const t = I.get(def.type || 'trigger');
    const verb = typeof t.prompt === 'function' ? t.prompt(ent, def, g) : t.prompt;
    return (verb + ' ' + (ent.name || '')).trim();
  };

  GK.Mechanics.add('interaction', {
    setup(game) {
      game.state.interacted = {};
      game.clickInteract = false;
      game.setFocus = ent => {
        game.focus = ent || null;
        game.ui.prompt(ent ? GK.promptFor(game, ent, ent.currentInteraction()) : null);
      };
      /** Run an entity's current interaction (E key, click, touch, or from code). */
      game.interactWith = (ent, byTouch) => {
        const def = ent && ent.currentInteraction();
        if (!def) return false;
        if (def.requires !== undefined && !GK.test(game, def.requires)) {
          if (!byTouch) { game.ui.toast(U.fill(def.lockedText || 'You can\'t do that yet.', game.state.vars), 'bad'); game.audio.play('deny'); }
          game.emit('interact:denied', { id: ent.id });
          return false;
        }
        I.get(def.type || 'trigger').run(game, ent, def, ok => {
          if (!ok) return;
          if (def.once) ent.used.add(def);
          game.state.interacted[ent.id] = (game.state.interacted[ent.id] || 0) + 1;
          GK.run(game, def.actions, { entity: ent, def });
          game.emit('interact', { id: ent.id, type: def.type || 'trigger' });
          if (game.missions) game.missions.check();
        });
        return true;
      };
    },
    update(game) {
      if ((game.input.pressed('interact') || game.clickInteract) && game.focus) game.interactWith(game.focus);
      game.clickInteract = false;
    },
  });
})();

</script>
<script>/* mechanics/inventory/inventory.js */
/* Game Kit · mechanics/inventory   (needs: interaction)
   Items the player carries, pickups and "use item on".
   Config:  items: { id: {name, icon, color, start: qty, hidden} }
   Adds:    interactions pickup · use {item, consume, failText}
            conditions {has:'item', count} · {lacks:'item'}      actions {do:'give'} · {do:'take'}
            game.giveItem / takeItem / hasItem / itemCount / itemName / itemDef / collect(entity, def)
   state.items = what is carried now; state.collected = totals ever picked up (by item, '#tag' and '*'). */
(function () {
  'use strict';
  const U = GK.util, I = GK.Interactions;

  I.add('pickup', { prompt: 'Pick up', run(g, ent, def, done) { g.collect(ent, def); done(true); } });
  I.add('use', {
    prompt: (ent, def, g) => 'Use ' + g.itemName(def.item) + ' on',
    run(g, ent, def, done) {
      if (!g.hasItem(def.item)) {
        g.ui.toast(U.fill(def.failText || ('You need: ' + g.itemName(def.item)), g.state.vars), 'bad');
        g.audio.play('deny');
        done(false);
        return;
      }
      if (def.consume) g.takeItem(def.item, def.qty || 1);
      g.audio.play('success');
      g.emit('item:used', { item: def.item, id: ent.id });
      done(true);
    },
  });
  GK.Conditions.add('has', (g, v, cond) => U.list(v).every(i => g.itemCount(i) >= (cond.count || 1)));
  GK.Conditions.add('lacks', (g, v) => U.list(v).every(i => g.itemCount(i) < 1));
  GK.Actions.add('give', (g, a) => g.giveItem(a.item, a.qty || 1, a.silent));
  GK.Actions.add('take', (g, a) => g.takeItem(a.item, a.qty || 1));

  GK.Mechanics.add('inventory', {
    configKeys: ['items'],
    restore(game) { game.ui.setInventory(game); },
    setup(game) {
      const s = game.state, items = game.cfg.items || {};
      s.items = {}; s.collected = {};
      for (const id in items) if (items[id].start) s.items[id] = items[id].start;
      const changed = () => { game.ui.setInventory(game); if (game.missions) game.missions.check(); };
      game.itemDef = id => items[id] || { name: id };
      game.itemName = id => game.itemDef(id).name || id;
      game.itemCount = id => s.items[id] || 0;
      game.hasItem = (id, n) => game.itemCount(id) >= (n || 1);
      game.giveItem = (id, qty, silent) => {
        qty = qty || 1;
        s.items[id] = game.itemCount(id) + qty;
        s.collected[id] = (s.collected[id] || 0) + qty;
        if (!silent) { game.ui.toast('+ ' + game.itemName(id), 'good'); game.audio.play('pickup'); }
        game.emit('item:added', { item: id, qty });
        changed();
      };
      game.takeItem = (id, qty) => {
        s.items[id] = Math.max(0, game.itemCount(id) - (qty || 1));
        if (!s.items[id]) delete s.items[id];
        game.emit('item:removed', { item: id, qty: qty || 1 });
        changed();
      };
      /** Pick up a collectible/item entity: {item, qty, points, message, sound} from the interaction or the entity. */
      game.collect = (ent, def) => {
        const d = ent.def, item = def.item || d.item || null, qty = def.qty || d.qty || 1;
        const pts = def.points != null ? def.points : d.points || 0;
        const name = item ? game.itemName(item) : (ent.name || 'item');
        if (item) s.items[item] = game.itemCount(item) + qty;
        const c = s.collected;
        c[item || ent.id] = (c[item || ent.id] || 0) + qty;
        for (const t of ent.tags) c['#' + t] = (c['#' + t] || 0) + qty;
        c['*'] = (c['*'] || 0) + qty;
        ent.remove();
        if (pts) game.scoring.add(pts, name, 'collect');
        game.audio.play(def.sound || d.sound || 'pickup');
        game.ui.toast(U.fill(def.message || d.message || ('+ ' + name), s.vars), 'good');
        game.emit('item:added', { item: item || ent.id, qty, id: ent.id, tags: ent.tags });
        changed();
      };
      game.ui.setInventory(game);
    },
  });
})();

</script>
<script>/* mechanics/objectives/objectives.js */
/* Game Kit · mechanics/objectives   (works with any game type; spatial types add find/reach)
   Objectives (missions) are config objects: {id, title, type, …, points, optional, hidden, after, if,
   timeLimit, failGame, hints, marker, onStart, onComplete, onFail}. ordered: true = one at a time,
   otherwise any order. Progress is read from game state, so the order of events never matters.
   Types: collect · find · reach · interact · talk · solve · sequence · event · flag · var · survive · custom.
   Also: hints (H key, config.hints + objective.hints), win when all required objectives are done
   (unless config.win is set), conditions {objective:'id'}, actions complete / fail / hint.
   Add types: GK.Objectives.add('name', { need(o), progress(o, game), target(o, game, fromPos) }). */(function () {
  'use strict';
  const U = GK.util, V = GK.vec;
  const O = GK.Objectives;
  const entPos = (g, id) => { const e = g.world && g.world.get(id); return e && e.active ? e.top() : null; };
  const st = (g, k) => g.state[k] || {};

  O.add('collect', { // {item:'chip', count:3} or {tag:'coin', count:10}
    need: o => o.count || 1,
    progress: (o, g) => st(g, 'collected')[o.item ? o.item : o.tag ? '#' + o.tag : '*'] || 0,
    target(o, g, from) {
      if (!g.world) return null;
      let best = null, bd = Infinity;
      for (const e of g.world.entities) {
        if (!e.active || !e.currentInteraction()) continue;
        if (o.item && (e.def.item || e.id) !== o.item) continue;
        if (o.tag && e.tags.indexOf(o.tag) < 0) continue;
        if (!o.item && !o.tag) continue;
        const d = V.dist(e.pos, from);
        if (d < bd) { bd = d; best = e.center(); }
      }
      return best;
    },
  });
  O.add('find', { // {target:'entityId', radius:3} — get close and look at it
    progress(o, g) {
      if (!g.world) return 0;
      if (g.state.found[o.target]) return 1;
      const e = g.world.get(o.target);
      if (!e || !e.active) return 0;
      const eye = g.player.eye(), c = e.center(), d = V.dist(eye, c);
      if (d <= (o.radius || 3) && V.dot(V.norm(V.sub(c, eye)), g.player.forward()) > 0.8) { g.state.found[o.target] = 1; return 1; }
      return 0;
    },
    target: (o, g) => entPos(g, o.target),
  });
  O.add('reach', { // {zone:'exit'} or {target:'entityId', radius:2} or {pos:[x,y,z], radius:2}
    progress(o, g) {
      if (!g.world) return 0;
      if (o.zone) return g.state.inZone[o.zone] ? 1 : 0;
      const p = o.target ? entPos(g, o.target) : g.world.toPos(o);
      return p && Math.hypot(p[0] - g.player.pos[0], p[2] - g.player.pos[2]) <= (o.radius || 2) ? 1 : 0;
    },
    target(o, g) { if (!g.world) return null; if (o.zone) { const z = g.world.zone(o.zone); return z ? z.center : null; } return o.target ? entPos(g, o.target) : g.world.toPos(o); },
  });
  O.add('interact', { need: o => o.count || 1, progress: (o, g) => st(g, 'interacted')[o.target] || 0, target: (o, g) => entPos(g, o.target) });
  O.add('talk', { progress: (o, g) => (st(g, 'talked')[o.target || o.npc] ? 1 : 0), target: (o, g) => entPos(g, o.target || o.npc) });
  O.add('solve', { progress: (o, g) => (st(g, 'solved')[o.puzzle] ? 1 : 0), target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('sequence', { progress: (o, g) => (st(g, 'sequences')[o.sequence] ? 1 : 0), target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('event', { need: o => o.count || 1, progress: (o, g) => g.state.events[o.event] || 0, target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('flag', { progress: (o, g) => (g.state.flags[o.flag] ? 1 : 0), target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('var', { need: o => o.count || 1, progress: (o, g) => Number(g.state.vars[o.name]) || 0 });
  O.add('survive', { need: o => o.seconds || 30, progress: (o, g) => Math.floor(g.state.time - (o.startedAt || 0)) });
  O.add('custom', { need: o => o.need || 1, progress: (o, g) => { const r = o.check(g); return r === true ? (o.need || 1) : Number(r) || 0; } });

  class Missions {
    constructor(game, list, ordered) {
      this.game = game;
      this.ordered = !!ordered;
      this.list = U.list(list).map((d, i) => Object.assign({ id: 'objective' + (i + 1), type: 'custom' }, d, { status: 'waiting', cur: 0, hintIndex: 0 }));
      this.pollT = 0;
    }
    get(id) { return this.list.find(o => o.id === id) || null; }
    isDone(id) { const o = this.get(id); return !!o && o.status === 'done'; }
    need(o) { const t = O.has(o.type) && O.get(o.type); return t && t.need ? t.need(o, this.game) : 1; }   // unknown types: reported by validate()
    required() { return this.list.filter(o => !o.optional); }
    doneCount() { return this.required().filter(o => o.status === 'done').length; }
    allDone() { return this.required().every(o => o.status === 'done'); }
    active() { return this.list.filter(o => o.status === 'active'); }
    /** The objective hints and markers point at: first active required one (else first active). */
    current() { const a = this.active(); return a.find(o => !o.optional) || a[0] || null; }
    eligible(o) {
      if (o.status !== 'waiting') return false;
      if (this.ordered && !o.optional) {
        for (const p of this.required()) { if (p === o) break; if (p.status !== 'done') return false; }
      }
      if (o.after && !U.list(o.after).every(id => this.isDone(id))) return false;
      if (o.if !== undefined && !GK.test(this.game, o.if)) return false;
      return true;
    }
    start() { this.check(); }
    /** Re-evaluate everything; called after events and a few times a second. */
    check() {
      const g = this.game;
      if (g.state.mode === 'ended' || g.state.mode === 'title') return;
      let changed = true, guard = 0;
      while (changed && guard++ < 20) {
        changed = false;
        for (const o of this.list) {
          if (this.eligible(o)) {
            o.status = 'active'; o.startedAt = g.state.time; changed = true;
            g.emit('objective:start', { id: o.id });
            if (o.onStart) GK.run(g, o.onStart, { objective: o });
          }
          if (o.status !== 'active' || !O.has(o.type)) continue;   // unknown types are reported by validate()
          const t = O.get(o.type);
          o.cur = Math.min(this.need(o), t.progress(o, g));
          if (o.cur >= this.need(o)) { this.complete(o.id); changed = true; }
          else if (o.timeLimit && g.state.time - o.startedAt > o.timeLimit) { this.fail(o.id, 'Time ran out: ' + o.title); changed = true; }
        }
      }
      g.ui.setObjectives(this);
      if (this.required().length && this.allDone() && g.cfg.win == null) g.win();
    }
    update(dt) {
      this.pollT -= dt;
      if (this.pollT <= 0) { this.pollT = 0.1; this.check(); }
    }
    complete(id) {
      const o = this.get(id), g = this.game;
      if (!o || o.status === 'done') return;
      o.status = 'done'; o.cur = this.need(o);
      const pts = o.points == null ? g.cfg.scoring.objective : o.points;
      if (pts) g.scoring.add(pts, o.title || o.id, 'objective');
      g.audio.play('objective');
      g.ui.toast('✓ ' + (o.title || 'Objective complete'), 'good');
      if (o.onComplete) GK.run(g, o.onComplete, { objective: o });
      if (o.checkpoint && g.setCheckpoint) g.setCheckpoint(g.player.pos, null, o.id);
      g.emit('objective:complete', { id: o.id });
      g.ui.setObjectives(this);
    }
    fail(id, text) {
      const o = this.get(id), g = this.game;
      if (!o || o.status === 'done' || o.status === 'failed') return;
      o.status = 'failed';
      g.emit('objective:failed', { id: o.id });
      if (o.onFail) GK.run(g, o.onFail, { objective: o });
      if (!o.optional && o.failGame !== false) g.lose(text || ('Objective failed: ' + o.title));
      else g.ui.toast('✗ ' + (o.title || 'Objective failed'), 'bad');
    }
    /** Where the current objective is (for the on-screen marker), or null. */
    targetOf(o) {
      if (!o || o.marker === false || !O.has(o.type)) return null;
      const t = O.get(o.type);
      return t.target ? t.target(o, this.game, this.game.player ? this.game.player.pos : [0, 0, 0]) : null;
    }
  }
  GK.Missions = Missions;

  GK.Conditions.add('objective', (g, v) => U.list(v).every(id => g.missions && g.missions.isDone(id)));
  GK.Actions.add('complete', (g, a) => g.missions.complete(a.objective));
  GK.Actions.add('fail', (g, a) => g.missions.fail(a.objective, a.text));
  GK.Actions.add('hint', (g, a) => (a.text ? g.ui.toast('💡 ' + a.text, 'hint') : g.hint()));

  /** Every puzzle id the game can open: config.puzzles plus inline puzzles on entities (e.g. terminals). */
  const puzzleIds = g => {
    const ids = new Set(Object.keys(g.cfg.puzzles || {}));
    if (g.world) for (const e of g.world.entities) for (const d of e.interact) if (d.type === 'puzzle' || d.type === 'input') ids.add(typeof d.puzzle === 'string' ? d.puzzle : (d.puzzle && d.puzzle.id) || d.id || e.id + ':input');
    return ids;
  };

  GK.Mechanics.add('objectives', {
    configKeys: ['objectives', 'ordered', 'hints'],
    /** Report objectives that point at things that do not exist (they could never complete). */
    validate(game, report) {
      const g = game, w = g.world, other = g.sceneMode;   // in scenes, targets may live in another scene
      const ids = new Set(), puzzles = puzzleIds(g);
      const items = new Set(Object.keys(g.cfg.items || {}));
      if (w) for (const e of w.entities) if (e.def.item) items.add(e.def.item);
      for (const o of g.missions.list) {
        const where = 'Objective "' + o.id + '"';
        if (ids.has(o.id)) report(where + ': duplicate id');
        ids.add(o.id);
        if (!O.has(o.type)) { report(where + ': unknown type "' + o.type + '"', 'error'); continue; }
        const ent = o.target || o.npc;
        if (ent && w && !other && !w.get(ent)) report(where + ': no entity "' + ent + '"', 'error');
        if (o.type === 'reach' && o.zone && w && !w.zone(o.zone)) report(where + ': no zone or area "' + o.zone + '"', 'error');
        if (o.type === 'solve' && !other && !puzzles.has(o.puzzle)) report(where + ': no puzzle "' + o.puzzle + '" (known: ' + [...puzzles].join(', ') + ')', 'error');
        if (o.type === 'collect' && o.item && !other && !items.has(o.item)) report(where + ': nothing gives item "' + o.item + '"', 'error');
        if (o.type === 'collect' && o.tag && w && !other && !w.entities.some(e => e.tags.indexOf(o.tag) >= 0)) report(where + ': nothing has tag "' + o.tag + '"', 'error');
        if (o.type === 'sequence' && !(g.cfg.sequences || {})[o.sequence]) report(where + ': no sequence "' + o.sequence + '"', 'error');
        for (const a of U.list(o.after)) if (!g.missions.get(a)) report(where + ': "after" names unknown objective "' + a + '"', 'error');
      }
    },
    restore(game, snap) {
      for (const s of snap.objectives || []) { const o = game.missions.get(s.id); if (o) { o.status = s.status; o.cur = s.cur; } }
      game.ui.setObjectives(game.missions);
    },
    setup(game) {
      game.state.hintsUsed = 0;
      game.missions = new Missions(game, game.cfg.objectives, game.cfg.ordered);
      game.hintState = { general: 0 };
      /** Next hint for the current objective (costs scoring.hint points the first time each hint is shown). */
      game.hint = () => {
        const o = game.missions.current(), cfg = game.cfg;
        let list = o ? U.list(o.hints || o.hint) : [];
        const general = !list.length;
        if (general) list = U.list(cfg.hints.general);
        if (!list.length) { game.ui.toast('No hint for this right now.'); return; }
        const holder = general ? game.hintState : o;
        const key = general ? 'general' : 'hintIndex';
        holder[key] = holder[key] || 0;
        if (holder[key] < list.length) {
          if (cfg.hints.max != null && game.state.hintsUsed >= cfg.hints.max) { game.ui.toast('No hints left.', 'bad'); return; }
          game.state.hintsUsed++;
          if (cfg.scoring.hint) game.scoring.add(-cfg.scoring.hint, 'Hint', 'hint');
          holder[key]++;
        }
        const idx = holder[key] - 1;
        game.ui.toast('💡 ' + U.fill(list[idx], game.state.vars) + (list.length > 1 ? '  (' + (idx + 1) + '/' + list.length + ')' : ''), 'hint');
        game.audio.play('hint');
        game.emit('hint', { objective: o ? o.id : null, index: idx });
      };
      game.ui.setObjectives(game.missions);
    },
    start(game) { game.missions.start(); },
    update(game, dt) { game.missions.update(dt); },
    snapshot(game, out) { out.objectives = game.missions.list.map(o => ({ id: o.id, status: o.status, cur: o.cur })); },
  });
})();

</script>
<script>/* mechanics/puzzles/puzzles.js */
/* Game Kit · mechanics/puzzles   (needs: interaction)
   Puzzles shown in a panel, usable from any game type: input (answer / password / enter information),
   choice (multiple choice), order (put items in order), quiz (several questions, pass mark),
   sort (items into groups), bits (binary switches to a target number), mix (red/green/blue light),
   logic (gate expression: test with switches, fill in the truth table).
   Config: puzzles: {id: {type, title, points, kind, penalty, maxAttempts, onSolve, onFail, reveal, revealPoints, …}}
     reveal: 15 (or {cost: 15}) adds a "Show answer (−15)" button: it costs the points, marks the answer (choice) or
     shows it, and solving afterwards gives revealPoints (default 0) instead of points. Emits puzzle:revealed {id, cost}.
     kind: the scoring kind of the points (default 'puzzle'), e.g. 'academic'.
   Adds: interactions puzzle {puzzle:'id'|{…}} · input {question, store}; condition {solved:'id'};
         action {do:'puzzle', puzzle}; game.openPuzzle(ref, done(solved), entity); state.solved.
   New puzzle types: GK.Puzzles.add('name', { render(body, pz, api) }) — api.solve() · api.wrong(msg) · api.close() · api.note(msg) · api.game. */
(function () {
  'use strict';
  const U = GK.util, PZ = GK.Puzzles;

  /** Does value match answer? answer: string | number | array (any) | RegExp | fn(value) */
  PZ.matches = function (answer, value, pz) {
    const norm = s => (pz && pz.exact ? String(s) : String(s).trim().toLowerCase().replace(/\s+/g, ' '));
    if (answer instanceof RegExp) return answer.test(String(value).trim());
    if (typeof answer === 'function') return !!answer(value);
    if (Array.isArray(answer)) return answer.some(a => PZ.matches(a, value, pz));
    return norm(answer) === norm(value);
  };

  const question = (body, text) => { if (text) body.appendChild(U.el('p', 'gk-q', text)); };
  const feedback = body => body.appendChild(U.el('div', 'gk-feedback'));

  PZ.add('input', {
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars));
      const row = U.el('div', 'gk-row');
      const inp = U.el('input', 'gk-input');
      inp.type = 'text';
      inp.placeholder = pz.placeholder || (pz.numeric ? '0000' : 'Type here…');
      if (pz.numeric) inp.inputMode = 'numeric';
      if (pz.maxLength) inp.maxLength = pz.maxLength;
      inp.autocomplete = 'off'; inp.spellcheck = false;
      const btn = U.el('button', 'gk-btn primary', pz.button || (pz.store ? 'Save' : 'Check'));
      row.append(inp, btn);
      body.appendChild(row);
      feedback(body);
      const submit = () => {
        const v = inp.value;
        if (!String(v).trim()) { inp.focus(); return; }
        if (pz.store) { api.game.state.vars[pz.store] = v.trim(); api.game.emit('var:changed', { name: pz.store, value: v.trim() }); }
        if (pz.answer === undefined || PZ.matches(pz.answer, v, pz)) api.solve();
        else { api.wrong(pz.wrongText); inp.select(); }
      };
      btn.onclick = submit;
      inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
      setTimeout(() => inp.focus(), 30);
    },
  });

  PZ.add('choice', {
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars));
      const list = U.el('div', 'gk-choices');
      const correct = U.list(pz.correct);
      pz.options.forEach((opt, i) => {
        const b = U.el('button', 'gk-btn choice', opt);
        b.onclick = () => {
          if (correct.indexOf(i) >= 0 || correct.indexOf(opt) >= 0) {
            b.classList.add('right');
            list.querySelectorAll('button').forEach(x => { x.disabled = true; });   // no second click while it animates
            setTimeout(api.solve, 250);
          }
          else {   // explain: one text per option (array), or one text for all (shown by the quiz type)
            b.classList.add('wrong'); b.disabled = true;
            api.wrong(Array.isArray(pz.explain) ? pz.explain[i] : pz.wrongText);
          }
        };
        list.appendChild(b);
      });
      body.appendChild(list);
      feedback(body);
      api.onReveal = () => list.querySelectorAll('button').forEach((x, i) => { if (correct.indexOf(i) >= 0 || correct.indexOf(pz.options[i]) >= 0) x.classList.add('reveal'); });
    },
  });

  PZ.add('order', { // pz.items in the CORRECT order; they are shown shuffled.
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars) || 'Put these in the right order.');
      const answer = U.el('div', 'gk-order-answer'), pool = U.el('div', 'gk-order-pool');
      const rnd = U.rng(pz.items.length * 97 + (pz.seed || 1));
      const shuffled = pz.items.map((t, i) => ({ t, i })).sort(() => rnd() - 0.5);
      if (shuffled.every((x, k) => x.i === k) && shuffled.length > 1) shuffled.push(shuffled.shift());
      let picked = [];
      const draw = () => {
        answer.innerHTML = ''; pool.innerHTML = '';
        picked.forEach((x, k) => answer.appendChild(U.el('div', 'gk-chip on', (k + 1) + '. ' + x.t)));
        if (!picked.length) answer.appendChild(U.el('div', 'gk-muted', 'Click the items below in order…'));
        shuffled.filter(x => picked.indexOf(x) < 0).forEach(x => {
          const b = U.el('button', 'gk-chip', x.t);
          b.onclick = () => { picked.push(x); draw(); if (picked.length === shuffled.length) check(); };
          pool.appendChild(b);
        });
      };
      const check = () => {
        if (picked.every((x, k) => x.i === k)) setTimeout(api.solve, 250);
        else { api.wrong(pz.wrongText || 'Not quite — try a different order.'); picked = []; setTimeout(draw, 500); }
      };
      const reset = U.el('button', 'gk-btn small', '↺ Start again');
      reset.onclick = () => { picked = []; draw(); };
      body.append(answer, pool, reset);
      feedback(body);
      draw();
    },
  });

  PZ.add('quiz', { // pz.questions: [{type:'choice'|'input', …}], pz.pass = how many must be right (default all)
    render(body, pz, api) {
      const qs = pz.questions, pass = pz.pass == null ? qs.length : pz.pass;
      let i = 0, right = 0, missed = false;
      const next = () => {
        body.innerHTML = '';
        if (i >= qs.length) {
          if (right >= pass) api.solve();
          else { api.wrong('You got ' + right + ' of ' + qs.length + '. You need ' + pass + '.'); const b = U.el('button', 'gk-btn primary', 'Try again'); b.onclick = () => { i = 0; right = 0; next(); }; body.appendChild(b); }
          return;
        }
        body.appendChild(U.el('div', 'gk-muted', 'Question ' + (i + 1) + ' of ' + qs.length));
        const q = qs[i], sub = U.el('div');
        body.appendChild(sub);
        missed = false;
        PZ.get(q.type || 'choice').render(sub, q, {
          game: api.game,
          solve: () => { if (!missed) right++; i++; next(); },
          wrong: msg => { missed = true; api.note(msg || 'Not quite.'); if (!pz.retry) { i++; setTimeout(next, 700); } },
          close: api.close,
          note: api.note,
        });
      };
      next();
    },
  });
  PZ.add('sort', { // pz.bins: ['Input', 'Output'], pz.items: [{text, bin: index | name, why}] — put every item in its group
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars) || 'Put each item in the right group.');
      const bins = pz.bins.map((b, i) => ({ name: typeof b === 'string' ? b : b.name, i }));
      const binOf = it => (typeof it.bin === 'number' ? it.bin : bins.findIndex(b => b.name === it.bin));
      const rnd = U.rng(pz.items.length * 31 + (pz.seed || 3));
      const items = pz.items.map((it, k) => ({ text: typeof it === 'string' ? it : it.text, bin: binOf(it), why: it.why, k })).sort(() => rnd() - 0.5);
      let picked = null;
      const pool = U.el('div', 'gk-order-pool'), row = U.el('div', 'gk-sort-bins');
      const boxes = bins.map(b => {
        const box = U.el('button', 'gk-sort-bin');
        box.innerHTML = '<b>' + U.esc(b.name) + '</b><span class="gk-sort-in"></span>';
        box.onclick = () => {
          if (!picked) { api.note('First click an item, then click its group.'); return; }
          const it = picked;
          if (it.bin === b.i) {
            it.done = true; picked = null;
            box.querySelector('.gk-sort-in').appendChild(U.el('span', 'gk-chip on', it.text));
            api.game.audio.play('click');
            draw();
            if (items.every(x => x.done)) setTimeout(api.solve, 300);
          } else {
            api.wrong(it.why || (it.text + ' does not go in "' + b.name + '".'));
            picked = null; draw();
          }
        };
        row.appendChild(box);
        return box;
      });
      const draw = () => {
        pool.innerHTML = '';
        items.filter(x => !x.done).forEach(x => {
          const b = U.el('button', 'gk-chip' + (x === picked ? ' sel' : ''), x.text);
          b.onclick = () => { picked = x === picked ? null : x; draw(); };
          pool.appendChild(b);
        });
        boxes.forEach(bx => bx.classList.toggle('ready', !!picked));
      };
      body.append(pool, row);
      feedback(body);
      draw();
    },
  });

  PZ.add('bits', { // binary switches: pz.bits (5), pz.target (number), pz.values (place values), pz.check (press Check instead of auto)
    render(body, pz, api) {
      const n = pz.bits || 5, vals = pz.values || Array.from({ length: n }, (_, i) => Math.pow(2, n - 1 - i));
      question(body, U.fill(pz.question, api.game.state.vars) || 'Switch the bits on to make ' + pz.target + '.');
      const on = Array(n).fill(false);
      const wrap = U.el('div', 'gk-bits'), total = U.el('div', 'gk-bits-total');
      const sum = () => on.reduce((s, b, i) => s + (b ? vals[i] : 0), 0);
      let done = false;
      const draw = () => {
        wrap.innerHTML = '';
        on.forEach((b, i) => {
          const cell = U.el('button', 'gk-bit' + (b ? ' on' : ''));
          cell.innerHTML = (pz.hideValues ? '' : '<small>' + vals[i] + '</small>') + '<b>' + (b ? 1 : 0) + '</b>';
          cell.onclick = () => {
            if (done) return;
            on[i] = !on[i]; api.game.audio.play('click'); draw();
            if (!pz.check && sum() === pz.target) { done = true; setTimeout(api.solve, 300); }
          };
          wrap.appendChild(cell);
        });
        total.textContent = pz.hideTotal ? 'Binary: ' + on.map(b => (b ? 1 : 0)).join('') : 'Binary ' + on.map(b => (b ? 1 : 0)).join('') + ' = ' + sum();
      };
      body.append(wrap, total);
      if (pz.check) {
        const btn = U.el('button', 'gk-btn primary', pz.button || 'Check');
        btn.onclick = () => { if (done) return; if (sum() === pz.target) { done = true; api.solve(); } else api.wrong(pz.wrongText || 'Not yet: that is ' + sum() + '.'); };
        body.appendChild(btn);
      }
      feedback(body);
      draw();
    },
  });

  PZ.add('mix', { // red / green / blue light: pz.target [r,g,b] or pz.targets [[r,g,b], …] (+ pz.names), pz.steps [0,128,255]
    render(body, pz, api) {
      const targets = pz.targets || [pz.target], names = pz.names || [];
      const steps = pz.steps || [0, 128, 255], word = v => (v === 0 ? 'OFF' : v === 255 ? 'FULL' : v >= 128 ? 'HALF' : 'LOW');
      question(body, U.fill(pz.question, api.game.state.vars) || 'Mix red, green and blue light.');
      const lv = [0, 0, 0];
      let k = 0;
      const head = U.el('div', 'gk-muted'), sw = U.el('div', 'gk-mix-swatches'), ctl = U.el('div', 'gk-mix-lamps');
      const ch = [['Red', '255,60,60'], ['Green', '60,220,90'], ['Blue', '70,120,255']];
      const draw = () => {
        const t = targets[k];
        head.textContent = (targets.length > 1 ? 'Colour ' + (k + 1) + ' of ' + targets.length + ': ' : 'Target: ') + (names[k] || 'match the target');
        sw.innerHTML = '<div><span class="gk-sw" style="background:rgb(' + lv.join(',') + ')"></span>Your light</div>' +
          '<div><span class="gk-sw target" style="background:rgb(' + t.join(',') + ')"></span>Target</div>';
        ctl.innerHTML = '';
        lv.forEach((v, i) => {
          const b = U.el('button', 'gk-lamp');
          b.innerHTML = '<span class="gk-lamp-dot" style="background:rgba(' + ch[i][1] + ',' + (0.15 + v / 255 * 0.85) + ')"></span><b>' + ch[i][0] + '</b><small>' + word(v) + ' (' + v + ')</small>';
          b.onclick = () => {
            lv[i] = steps[(steps.indexOf(lv[i]) + 1) % steps.length]; api.game.audio.play('click'); draw();
            if (lv.every((x, j) => x === targets[k][j])) {
              if (k < targets.length - 1) { api.note('Correct! Next colour.', true); k++; lv.fill(0); setTimeout(draw, 500); }
              else setTimeout(api.solve, 300);
            }
          };
          ctl.appendChild(b);
        });
      };
      body.append(head, sw, ctl);
      feedback(body);
      draw();
    },
  });

  /** Evaluate a logic expression like "(A AND B) OR NOT C" with values {A: true, …}. */
  PZ.logic = function (expr, v) {
    const toks = String(expr).toUpperCase().match(/\(|\)|AND|OR|XOR|NOT|[A-Z]/g) || [];
    let i = 0;
    const atom = () => {
      const t = toks[i++];
      if (t === 'NOT') return !atom();
      if (t === '(') { const r = or(); i++; return r; }
      return !!v[t];
    };
    const and = () => { let r = atom(); while (toks[i] === 'AND') { i++; const b = atom(); r = r && b; } return r; };
    const xor = () => { let r = and(); while (toks[i] === 'XOR') { i++; const b = and(); r = r !== b; } return r; };
    const or = () => { let r = xor(); while (toks[i] === 'OR') { i++; const b = xor(); r = r || b; } return r; };
    return or();
  };
  PZ.add('logic', { // logic gates: pz.expr 'A AND B', pz.inputs ['A','B'] — test with switches, then fill in the truth table
    render(body, pz, api) {
      const ins = pz.inputs || (String(pz.expr).toUpperCase().match(/\b[A-Z]\b/g) || []).filter((x, i, a) => a.indexOf(x) === i);
      question(body, U.fill(pz.question, api.game.state.vars) || 'When does the lamp turn on? Test the switches, then fill in the table.');
      body.appendChild(U.el('div', 'gk-logic-expr', 'Lamp = ' + pz.expr));
      const sw = {}; ins.forEach(n => { sw[n] = false; });
      const bench = U.el('div', 'gk-logic-bench'), table = U.el('table', 'gk-logic-table');
      const rows = [];
      for (let m = 0; m < Math.pow(2, ins.length); m++) {
        const v = {}; ins.forEach((n, j) => { v[n] = !!(m >> (ins.length - 1 - j) & 1); });
        rows.push({ v, want: PZ.logic(pz.expr, v), got: null });
      }
      const drawBench = () => {
        bench.innerHTML = '';
        ins.forEach(n => {
          const b = U.el('button', 'gk-bit' + (sw[n] ? ' on' : ''));
          b.innerHTML = '<small>' + n + '</small><b>' + (sw[n] ? 1 : 0) + '</b>';
          b.onclick = () => { sw[n] = !sw[n]; api.game.audio.play('click'); drawBench(); };
          bench.appendChild(b);
        });
        const lit = PZ.logic(pz.expr, sw);
        bench.appendChild(U.el('span', 'gk-logic-lamp' + (lit ? ' on' : ''), lit ? 'ON' : 'OFF'));
      };
      const drawTable = () => {
        table.innerHTML = '<tr>' + ins.map(n => '<th>' + n + '</th>').join('') + '<th>Lamp</th></tr>';
        rows.forEach(r => {
          const tr = U.el('tr');
          tr.innerHTML = ins.map(n => '<td>' + (r.v[n] ? 1 : 0) + '</td>').join('');
          const td = U.el('td'), b = U.el('button', 'gk-btn small' + (r.got == null ? '' : r.got ? ' on' : ''), r.got == null ? '?' : r.got ? '1' : '0');
          b.onclick = () => { r.got = r.got == null ? true : r.got ? false : null; drawTable(); };
          td.appendChild(b); tr.appendChild(td); table.appendChild(tr);
        });
      };
      const btn = U.el('button', 'gk-btn primary', 'Check the table');
      btn.onclick = () => {
        if (rows.some(r => r.got == null)) { api.note('Fill in every row first (click ? to choose 1 or 0).'); return; }
        const bad = rows.filter(r => r.got !== r.want).length;
        if (!bad) api.solve(); else api.wrong(bad + ' row' + (bad === 1 ? ' is' : 's are') + ' wrong. Test them with the switches.');
      };
      drawBench(); drawTable();
      body.append(bench, table, btn);
      feedback(body);
    },
  });

  GK.Interactions.add('puzzle', { prompt: 'Solve', run(g, ent, def, done) { g.openPuzzle(def.puzzle || def, done, ent); } });
  GK.Interactions.add('input', { // enter information: {type:'input', question, store:'varName'} or with `answer` to check it
    prompt: 'Use',
    run(g, ent, def, done) { g.openPuzzle(U.merge({ type: 'input', id: def.id || (ent.id + ':input') }, def), done, ent); },
  });
  GK.Conditions.add('solved', (g, v) => U.list(v).every(id => !!g.state.solved[id]));
  GK.Actions.add('puzzle', (g, a) => g.openPuzzle(a.puzzle));

  /** Readable answer of a puzzle, for the teacher panel. */
  PZ.answerText = function (pz) {
    const t = pz.type || 'input';
    if (t === 'choice') return U.list(pz.correct).map(c => (typeof c === 'number' ? pz.options[c] : c)).join(' / ');
    if (t === 'order') return pz.items.join(' → ');
    if (t === 'quiz') return pz.questions.map((q, i) => (i + 1) + ') ' + PZ.answerText(q)).join('   ');
    if (t === 'sort') return pz.bins.map((b, i) => (typeof b === 'string' ? b : b.name) + ': ' + pz.items.filter(it => it.bin === i || it.bin === (typeof b === 'string' ? b : b.name)).map(it => it.text).join(', ')).join(' | ');
    if (t === 'bits') { const n = pz.bits || 5; return pz.target + ' = ' + Number(pz.target).toString(2).padStart(n, '0'); }
    if (t === 'mix') return (pz.targets || [pz.target]).map((c, i) => (pz.names && pz.names[i] ? pz.names[i] + ' ' : '') + 'rgb(' + c.join(', ') + ')').join(' → ');
    if (t === 'logic') return 'Lamp = ' + pz.expr + ' (fill each row with the result)';
    if (pz.answer === undefined) return pz.store ? '(anything — it is saved as ' + pz.store + ')' : '(any answer)';
    return U.list(pz.answer).map(a => (a instanceof RegExp ? a.source : typeof a === 'function' ? '(checked by code)' : String(a))).join(' / ');
  };

  GK.Mechanics.add('puzzles', {
    configKeys: ['puzzles'],
    validate(game, report) {
      const all = Object.assign({}, game.cfg.puzzles);
      if (game.world) for (const e of game.world.entities) for (const d of e.interact) if (d.type === 'puzzle' && d.puzzle && typeof d.puzzle === 'object') all[d.puzzle.id || e.id] = d.puzzle;
      for (const id in all) {
        const pz = all[id], t = pz.type || 'input';
        if (!PZ.has(t)) report('Puzzle "' + id + '": unknown type "' + t + '"', 'error');
        else if (t === 'choice' && !(pz.options && pz.options.length && pz.correct !== undefined)) report('Puzzle "' + id + '": a choice puzzle needs options and correct', 'error');
        else if (t === 'order' && !(pz.items && pz.items.length > 1)) report('Puzzle "' + id + '": an order puzzle needs at least 2 items', 'error');
        else if (t === 'sort' && !(pz.bins && pz.bins.length > 1 && pz.items && pz.items.length)) report('Puzzle "' + id + '": a sort puzzle needs bins (2 or more) and items', 'error');
        else if (t === 'bits' && typeof pz.target !== 'number') report('Puzzle "' + id + '": a bits puzzle needs a number target', 'error');
        else if (t === 'mix' && !(pz.target || pz.targets)) report('Puzzle "' + id + '": a mix puzzle needs target [r,g,b] or targets', 'error');
        else if (t === 'logic' && !pz.expr) report('Puzzle "' + id + '": a logic puzzle needs expr, e.g. "A AND B"', 'error');
      }
      if (game.world) for (const e of game.world.entities) for (const d of e.interact) if (d.type === 'puzzle' && typeof d.puzzle === 'string' && !all[d.puzzle]) report('Entity "' + e.id + '": no puzzle "' + d.puzzle + '" in config.puzzles', 'error');
    },
    /** For the teacher panel: every puzzle and its answer. */
    answers(game) {
      const out = [];
      for (const id in game.cfg.puzzles || {}) out.push({ where: game.cfg.puzzles[id].title || id, answer: PZ.answerText(game.cfg.puzzles[id]) });
      if (game.world) for (const e of game.world.entities) for (const d of e.interact) if (d.type === 'puzzle' && d.puzzle && typeof d.puzzle === 'object') out.push({ where: e.name || e.id, answer: PZ.answerText(d.puzzle) });
      return out;
    },
    setup(game) {
      game.state.solved = {};
      /** Open a puzzle by id (config.puzzles) or inline definition. done(solved) is called when it closes. */
      game.openPuzzle = (ref, done, ent) => {
        const base = typeof ref === 'string' ? (game.cfg.puzzles || {})[ref] : ref;
        if (!base) { console.warn('[GK] unknown puzzle', ref); if (done) done(false); return; }
        const pz = Object.assign({ id: typeof ref === 'string' ? ref : (ent ? ent.id + ':puzzle' : 'puzzle') }, base);
        if (game.state.solved[pz.id] && !pz.repeatable) { game.ui.toast(pz.doneText || 'Already solved.'); if (done) done(false); return; }
        let solved = false, attempts = 0, revealed = false;
        const body = U.el('div', 'gk-puzzle');
        const h = game.ui.panel({ title: pz.title || (ent && ent.name) || 'Puzzle', body, buttons: [], wide: pz.wide, onClose: () => { if (!solved) game.emit('puzzle:closed', { id: pz.id }); if (done) done(solved); } });
        const api = {
          game, close: h.close, note: h.note,
          solve: () => {
            if (solved) return;
            solved = true;
            game.state.solved[pz.id] = true;
            const pts = revealed ? (pz.revealPoints || 0) : pz.points;
            if (pts) game.scoring.add(pts, pz.title || 'Puzzle', pz.kind || 'puzzle');
            game.audio.play('success');
            h.note(pz.solvedText || (pz.store && pz.answer === undefined ? 'Saved.' : 'Correct!'), true);
            if (pz.onSolve) GK.run(game, pz.onSolve, { entity: ent });
            game.emit('puzzle:solved', { id: pz.id, revealed, attempts });
            if (game.missions) game.missions.check();
            setTimeout(h.close, 700);
          },
          wrong: msg => {
            attempts++;
            game.audio.play('wrong');
            const pen = pz.penalty != null ? pz.penalty : game.cfg.scoring.wrongAnswer;
            if (pen) game.scoring.add(-pen, 'Wrong answer', 'wrong');
            h.note(msg || 'Not quite — try again.');
            game.emit('puzzle:wrong', { id: pz.id });
            if (pz.maxAttempts && attempts >= pz.maxAttempts) {
              if (pz.onFail) GK.run(game, pz.onFail, { entity: ent });
              game.emit('puzzle:failed', { id: pz.id });
              setTimeout(h.close, 900);
            }
          },
        };
        PZ.get(pz.type || 'input').render(body, pz, api);
        if (pz.reveal) {
          const cost = typeof pz.reveal === 'number' ? pz.reveal : pz.reveal.cost || 0;
          const row = U.el('div', 'gk-reveal'), btn = U.el('button', 'gk-btn small gk-reveal-btn');
          btn.innerHTML = '💡 Show answer <b>' + (cost ? '−' + cost + ' points' : 'free') + '</b>';
          btn.title = 'Stuck? See the answer, but it costs ' + cost + ' points and this question then gives no points.';
          btn.onclick = () => {
            if (revealed || solved) return;
            revealed = true; btn.disabled = true;
            if (cost) game.scoring.add(-cost, 'Answer shown', pz.revealKind || 'reveal');
            if (api.onReveal) api.onReveal(); else h.note('Answer: ' + PZ.answerText(pz), true);
            if (api.onReveal && pz.type !== 'choice') h.note('Answer: ' + PZ.answerText(pz), true);
            game.audio.play('hint');
            game.emit('puzzle:revealed', { id: pz.id, cost });
          };
          row.appendChild(btn);
          if (pz.revealNote !== false) row.appendChild(U.el('span', 'gk-muted', cost ? 'Costs ' + cost + ' points. Only if you are stuck!' : ''));
          body.appendChild(row);
        }
      };
    },
  });
})();
</script>
<script>/* mechanics/world-objects/world-objects.js */
/* Game Kit · mechanics/world-objects   (needs: interaction, inventory; spatial game types only)
   Reusable interactive objects for spatial games: collectible, item, door (key / flag / condition locks),
   button, switch (lever), terminal (password or puzzle), crate, checkpoint, portal.
   Adds interactions open · close · toggle, actions open/close/toggle/lock/unlock, condition {open:'doorId'}.
   Each object type is a prefab = { defaults, init(ent, game), update(ent, dt, game) } (GK.Prefabs.add). */
(function () {
  'use strict';
  const U = GK.util, P = GK.Prefabs;
  P.add('collectible', {
    defaults: { model: 'coin', solid: false, hover: 0.9, spin: 2.2, bob: 0.1, touch: true, points: 10 },
    init(ent) { if (!ent.interact.length) ent.interact.push({ type: 'pickup' }); },
  });
  P.add('item', { // like a collectible, but the player presses E to pick it up
    defaults: { model: 'keycard', solid: false, hover: 0.9, spin: 1.5, bob: 0.08, touch: false, points: 0 },
    init(ent) { if (!ent.interact.length) ent.interact.push({ type: 'pickup' }); },
  });

  P.add('door', {
    defaults: { model: 'door', solid: true, width: 1.4, height: 2.2, slide: 'side', speed: 2.5, open: false },
    init(ent) {
      const d = ent.def;
      ent.state.open = !!d.open;
      ent.state.locked = !!d.locked;
      ent.openT = ent.state.open ? 1 : 0;
      ent.setModel(ent.model, U.merge(ent.look, { width: d.width, height: d.height, locked: ent.state.locked }));
      if (!ent.name) ent.name = 'door';
      if (!ent.interact.length) ent.interact.push({ type: 'toggle' });
      ent.blocks = () => ent.active && ent.openT < 0.7;
      /** Try to open, handling locks. Returns true if the door is (now) open. */
      ent.tryOpen = function (game, silent) {
        if (ent.state.locked) {
          const L = U.isObj(d.locked) ? d.locked : {};
          const ok = (L.item && game.hasItem(L.item)) || (L.flag && game.state.flags[L.flag]) || (L.if !== undefined && GK.test(game, L.if));
          if (!ok) {
            if (!silent) { game.ui.toast(U.fill(L.text || 'Locked.', game.state.vars), 'bad'); game.audio.play('deny'); }
            game.emit('door:denied', { id: ent.id });
            return false;
          }
          ent.unlock(game);
          if (L.item && L.consume) game.takeItem(L.item, 1);
          if (!silent) game.ui.toast(L.unlockText || ('Unlocked' + (L.item ? ' with ' + game.itemName(L.item) : '')), 'good');
        }
        ent.setOpen(game, true);
        return true;
      };
      ent.unlock = function (game) {
        ent.state.locked = false;
        ent.setLook({ locked: false });
        game.emit('door:unlocked', { id: ent.id });
      };
      ent.lock = function (game) {
        ent.state.locked = true;
        ent.setLook({ locked: true });
        game.emit('door:locked', { id: ent.id });
      };
      ent.setOpen = function (game, open) {
        if (ent.state.open === open) return;
        ent.state.open = open;
        game.audio.play('door');
        game.emit(open ? 'door:opened' : 'door:closed', { id: ent.id });
      };
    },
    restore(ent) { ent.openT = ent.state.open ? 1 : 0; ent.setLook({ locked: !!ent.state.locked }); },
    update(ent, dt) {
      const target = ent.state.open ? 1 : 0;
      ent.openT += U.clamp(target - ent.openT, -dt * ent.def.speed, dt * ent.def.speed);
      const w = ent.def.width, h = ent.def.height;
      if (ent.def.slide === 'up') ent.offset = [0, ent.openT * (h - 0.15), 0];
      else { const d = ent.openT * w; ent.offset = [Math.cos(ent.yaw) * d, 0, -Math.sin(ent.yaw) * d]; }
    },
  });

  P.add('button', {
    defaults: { model: 'button', solid: true, color: '#e74c3c' },
    init(ent) { if (!ent.interact.length) ent.interact.push({ type: 'activate', prompt: 'Press' }); },
  });
  P.add('switch', { // lever with on/off state: interact {type:'activate', toggle:true, on:[actions], off:[actions]}
    defaults: { model: 'lever', solid: true },
    init(ent) {
      ent.state.on = !!ent.def.on;
      ent.setLook({ on: ent.state.on });
      if (!ent.interact.length) ent.interact.push({ type: 'activate', toggle: true, prompt: 'Pull' });
    },
  });
  P.add('checkpoint', {
    defaults: { model: 'pad', solid: false, touch: true },
    init(ent) {
      ent.onTouch = game => {
        if (ent.state.on) return;
        ent.state.on = true;
        ent.setLook({ on: true });
        game.setCheckpoint(ent.pos, ent.def.rot, ent.id);
      };
    },
  });
  P.add('portal', { defaults: { model: 'portal', solid: false } });
  P.add('crate', { defaults: { model: 'crate', solid: true } });
  P.add('terminal', { // {type:'terminal', puzzle:'id'} or the password shortcut {password:'1234', question}
    defaults: { model: 'terminal', solid: true, screen: '#2ecc71', solvedScreen: '#27ae60' },
    init(ent) {
      const d = ent.def;
      if (!ent.name) ent.name = 'terminal';
      ent.setLook({ screen: d.lockedScreen || '#3fc1ff' });
      if (ent.interact.length) return;
      const pz = d.puzzle || (d.password != null ? { id: ent.id + ':password', type: 'input', title: d.title || 'Password', question: d.question || 'Enter the password:', answer: d.password, points: d.points || 0, onSolve: d.onSolve } : null);
      if (!pz) return;
      ent.interact.push({ type: 'puzzle', puzzle: pz, prompt: d.prompt || 'Use terminal', requires: d.requires, lockedText: d.lockedText, actions: [{ do: 'set', target: ent.id, look: { screen: d.solvedScreen } }].concat(U.list(d.actions)) });
    },
  });

  // ---------- doors: interactions, actions, condition ----------
  const I = GK.Interactions, A = GK.Actions, T = GK.targetOf;
  const doorVerb = (ent, verb) => (ent.tryOpen ? verb : 'Use');
  I.add('open', {
    prompt: ent => doorVerb(ent, 'Open'),
    run(g, ent, def, done) { if (!ent.tryOpen) { ent.state.open = true; done(true); return; } done(!ent.state.open && ent.tryOpen(g)); },
  });
  I.add('close', {
    prompt: ent => doorVerb(ent, 'Close'),
    run(g, ent, def, done) { if (ent.setOpen && ent.state.open) { ent.setOpen(g, false); done(true); } else done(false); },
  });
  I.add('toggle', {
    prompt: ent => (ent.state.open ? 'Close' : ent.state.locked ? 'Unlock' : 'Open'),
    run(g, ent, def, done) {
      if (!ent.setOpen) { ent.state.open = !ent.state.open; done(true); return; }
      if (ent.state.open) { ent.setOpen(g, false); done(true); } else done(ent.tryOpen(g));
    },
  });
  A.add('open', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.tryOpen) { if (a.force && e.state.locked) e.unlock(g); e.tryOpen(g, true); } });
  A.add('close', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.setOpen) e.setOpen(g, false); });
  A.add('toggle', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.setOpen) { if (e.state.open) e.setOpen(g, false); else e.tryOpen(g, true); } });
  A.add('unlock', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.unlock) e.unlock(g); });
  A.add('lock', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.lock) { e.setOpen(g, false); e.lock(g); } });
  GK.Conditions.add('open', (g, v) => { const e = g.world && g.world.get(v); return !!(e && e.state.open); });

  GK.Mechanics.add('world-objects', {});
})();

</script>
<script>/* mechanics/hazards/hazards.js */
/* Game Kit · mechanics/hazards   (spatial game types only)
   Enemies and traps: things that hurt on touch (viruses, bugs, drones, lasers…), pulsing floor traps (spark
   pads), enemies that chase you, turrets that shoot, and bosses. Use with config.player.health + respawnOnDeath.
     { id, type: 'hazard', model: 'virus', route: 'worldRoute' | path: [[x,z], 'location', …],
       speed: 2, wait: 0.3, damage: 25, onHit: [actions], label, points: 50,
       hp: 3,                                         // can be shot (mechanics/weapons): hits needed to defeat it
       squash: true, respawn: 20,                     // with a shield power-up, touching it defeats it; comes back
       chase: 8, chaseSpeed: 3,                       // runs at you when you are this close and it can see you
       shoots: { every: 2, range: 16, speed: 10, damage: 10, color },   // fires bolts at you (turrets, bosses)
       pulse: [on, off], phase: 0,                    // a trap that is dangerous for `on` s, then safe for `off` s
       boss: true, engage: 30, armor: condition,      // boss bar at the top; immune while `armor` is true
       summon: { every: 8, ids: ['m1', 'm2'], max: 3 },  // a boss brings hidden `minion: true` hazards back to life
       rage: { below: 0.5, speed: 1.5 },              // faster (and shoots faster) under half health
       onDefeat: [actions], contactEvery: 1, knockback: 5 }
   Touching one costs `damage` health (again every `contactEvery` s while touching), knocks you back, flashes the
   screen, runs onHit and emits hazard:hit {id}. Defeating one (shot or squashed) gives `points` and emits
   hazard:defeated {id} and "defeated:<tag>" for each tag (squashing also emits hazard:squashed / "squashed:<tag>").
   Objective {type: 'defeat', tag, count} counts defeats and points at the nearest enemy with that tag.
   With the powerups mechanic: a shield blocks damage (and squashes `squash` hazards); freeze stops every hazard.
   Adds game.hurtPlayer(amount, sourceEntity), game.hitHazard(entity, damage), game.defeatHazard(entity) and the
   condition {hp: {id, lte}}.
   Disable or remove one ({do:'disable'} / {do:'remove'}) to make it safe.
   Difficulty (config.difficulty, the chosen choice's options):
     enemies: 0.5     keep this share of the ordinary enemies (shootable, harmful, not bosses / minions / crates) in
                      each scene: every other one starts removed (hidden waves too). A tag that a 'defeat' objective
                      counts keeps at least that share of its enemies (rounded up), and the objective needs that share.
     bossDamage: 3    shots do this many times their damage to bosses (phase thresholds keep working)
     summons: 0.5     bosses keep at most this share of their minions alive (at least 1)
   Without these options (or with the value 1) nothing changes. */
(function () {
  'use strict';
  const P = GK.Prefabs, V = GK.vec, Ph = GK.Physics, U = GK.util, FROZEN = '#9fd8ff';

  /** Everything that blocks enemies and their line of sight this frame (walls, closed doors, solid props). */
  function solidsOf(g) {
    if (!g.hzSolids || g.hzSolidsAt !== g.state.time) { g.hzSolids = g.world.solids(); g.hzSolidsAt = g.state.time; }
    return g.hzSolids;
  }
  function clearLine(g, a, b) {
    const d = V.sub(b, a), dist = V.len(d);
    if (dist < 0.01) return true;
    const dir = V.scale(d, 1 / dist);
    for (const s of solidsOf(g)) { const t = Ph.rayBox(a, dir, s); if (t > 0 && t < dist - 0.25) return false; }
    return true;
  }
  /** Walk an enemy toward (x, z) with wall collision. Returns the distance left. */
  function walk(ent, g, x, z, speed, dt) {
    const b = ent.body;
    b.pos = ent.pos;
    const dx = x - ent.pos[0], dz = z - ent.pos[2], l = Math.hypot(dx, dz);
    if (l < 0.05) return l;
    const v = Math.min(speed, l / Math.max(dt, 1e-4));
    b.vel[0] = dx / l * v; b.vel[1] = 0; b.vel[2] = dz / l * v;
    const y = ent.pos[1];
    Ph.move(solidsOf(g), b, dt);
    ent.pos[1] = y;   // enemies keep their height (they float or crawl at one level)
    if (ent.def.faceTravel) ent.yaw = Math.atan2(dx, dz);
    return Math.hypot(x - ent.pos[0], z - ent.pos[2]);
  }
  /** Where an enemy looks and shoots from: near the top of its model (low centres clip low scenery). */
  function eyeOf(ent) { const b = ent.box(true); return [(b.min[0] + b.max[0]) / 2, Math.max(b.min[1] + 0.3, b.max[1] - 0.35), (b.min[2] + b.max[2]) / 2]; }
  function defeat(ent, g, how) {
    const d = ent.def;
    if (ent.state.dead || ent.removed) return;
    if (d.points) g.scoring.add(d.points, (ent.name || 'enemy') + (how === 'squash' ? ' squashed' : ' defeated'), 'bonus');
    g.audio.play(how === 'squash' ? 'success' : 'boom');
    if (g.burst) g.burst(ent.center(), d.burst || (ent.look && ent.look.color) || '#ff4d6d', d.boss ? 30 : 10);
    if (how === 'squash') { g.ui.flash('#ffffff'); g.ui.toast('SQUASHED! +' + d.points, 'good'); }
    if (d.boss) { g.ui.setBoss(null); g.ui.toast('💥 ' + (ent.name || 'Boss') + ' DEFEATED! +' + d.points, 'good'); if (g.shake) g.shake(0.8, 0.25); }
    g.emit('hazard:defeated', { id: ent.id });
    for (const t of ent.tags) g.emit('defeated:' + t, {});
    if (how === 'squash') {
      g.emit('hazard:squashed', { id: ent.id });
      for (const t of ent.tags) g.emit('squashed:' + t, {});
    }
    ent.state.dead = true;
    ent.chasing = false;
    if (d.respawn) { ent.hide(); g.later(d.respawn, () => revive(ent)); }
    else if (d.minion) ent.hide();
    else ent.remove();
    if (d.onDefeat) GK.run(g, d.onDefeat, { entity: ent });
    if (g.missions) g.missions.check();
  }
  /** Which ordinary enemies a difficulty leaves out, worked out once from the whole config (every scene), so a
      scene, a restore and a resume always agree: {drop: {id: true}, ratio: {tag: kept / total}}. */
  function thinPlan(game) {
    const share = Number(game.difficultyOpts ? game.difficultyOpts().enemies : 1);
    const key = game.difficulty + ':' + share;
    if (game.hzPlan && game.hzPlan.key === key) return game.hzPlan;
    const plan = { key, drop: {}, ratio: {} };
    game.hzPlan = plan;
    if (!(share > 0 && share < 1)) return plan;
    const base = game.base, tpls = base.templates || {}, defs = P.get('hazard').defaults;
    const stages = base.scenes || base.levels || [];
    const lists = [base.entities].concat(stages.map(s => s.entities));
    const counted = {};   // tags that 'defeat' objectives count (other than the catch-all 'enemy')
    for (const o of U.list(base.objectives).concat(...stages.map(s => U.list(s.objectives)))) if (o && o.type === 'defeat' && o.tag !== 'enemy') counted[o.tag] = true;
    const all = [], byTag = {};
    for (const list of lists) {
      let i = 0;
      for (const raw of U.list(list)) {
        if (!raw || typeof raw !== 'object') continue;
        const e = Object.assign({}, defs, raw.use ? tpls[raw.use] : null, raw);
        if (e.type !== 'hazard' || !(e.hp > 0) || e.boss || e.minion || e.solid || !(e.damage > 0 || e.shoots)) continue;
        // keep ceil(n · share) in each scene, spread out: the 1st, 3rd, 5th… for a half
        const m = { id: e.id, tags: U.list(e.tags), keep: !e.id || Math.ceil((i + 1) * share) > Math.ceil(i * share) };
        i++;
        all.push(m);
        for (const t of m.tags) (byTag[t] = byTag[t] || []).push(m);
      }
    }
    // a counted group never drops below its share, so its objective stays possible
    for (const t in counted) {
      const ms = byTag[t] || [], want = Math.ceil(ms.length * share);
      let kept = ms.filter(m => m.keep).length;
      for (const m of ms) { if (kept >= want) break; if (!m.keep) { m.keep = true; kept++; } }
    }
    for (const m of all) if (!m.keep) plan.drop[m.id] = true;
    for (const t in byTag) plan.ratio[t] = byTag[t].filter(m => m.keep).length / byTag[t].length;
    return plan;
  }
  function revive(ent, at) {
    if (ent.removed) return;
    ent.state.dead = false;
    ent.state.hp = ent.def.hp || 0;
    ent.chasing = false; ent.returning = false; ent.touching = false;
    if (at) ent.pos = at.slice(); else if (ent.def.chase && !ent.path.length) ent.pos = ent.home.slice();
    ent.show();
  }
  function contact(ent, g) {
    const d = ent.def;
    if (!ent.enabled || !ent.active || ent.state.off || ent.state.dead || g.state.mode !== 'playing') return;
    if (!d.damage && !d.squash) return;   // harmless (practice targets)
    ent.contactT = d.contactEvery || 1;
    if (g.shielded && g.shielded()) {
      if (d.squash) defeat(ent, g, 'squash'); else g.audio.play('blocked');
      return;
    }
    if (g.hurtPlayer(d.damage, ent)) {
      g.emit('hazard:hit', { id: ent.id });
      if (d.onHit) GK.run(g, d.onHit, { entity: ent });
    }
  }

  P.add('hazard', {
    defaults: { model: 'virus', solid: false, speed: 2, wait: 0.3, damage: 25, bob: 0.12, faceTravel: true, points: 50, hp: 0, contactEvery: 1, knockback: 5 },
    init(ent, game) {
      const d = ent.def, w = ent.world;
      ent.path = d.route ? (w.routes[d.route] || []).map(p => p.slice())
        : (d.path || []).map(p => w.toPos(Array.isArray(p) ? { pos: p } : typeof p === 'string' ? { at: p } : p));
      if (d.route && !w.routes[d.route]) w.problem('Hazard "' + ent.id + '": unknown route "' + d.route + '". This world has: ' + Object.keys(w.routes).join(', '));
      if (d.summon) for (const id of d.summon.ids || []) if (!w.byId[id] && !(game.cfg.entities || []).some(e => e.id === id)) w.problem('Hazard "' + ent.id + '": summons unknown "' + id + '"');
      if (ent.path.length && !d.pos && !d.cell && !d.at) ent.pos = ent.path[0].slice();
      if (ent.state.pathI == null) ent.state.pathI = 0;
      if (ent.state.hp == null) ent.state.hp = d.hp || 0;
      ent.home = ent.pos.slice();
      ent.body = { pos: ent.pos, vel: [0, 0, 0], r: d.bodyRadius || 0.4, h: 0.8, step: 0.45, grounded: true };
      ent.waitT = 0; ent.contactT = 0; ent.aiT = Math.random() * 0.2; ent.lostT = 0;
      ent.shootT = d.shoots ? (d.shoots.every || 2) * (0.5 + Math.random() * 0.5) : 0;
      ent.summonT = d.summon ? (d.summon.first != null ? d.summon.first : d.summon.every || 8) : 0;
      if (d.pulse) { ent.state.off = false; ent.pulseT = d.pulse[0] - (d.phase || 0); }
      ent.onTouch = g => contact(ent, g);
      if (thinPlan(game).drop[ent.id]) ent.removed = true;   // an easier difficulty: fewer enemies
      if (d.solid) {   // a solid hazard (a loot crate, a barrier): it blocks the player, but shots treat it as a target
        const base = GK.Entity.prototype.collider;
        ent.collider = function () { const b = base.call(this); b.hazard = true; return b; };
      }
    },
    restore(ent) { ent.home = ent.home || ent.pos.slice(); ent.chasing = false; ent.returning = false; },
    update(ent, dt, game) {
      const d = ent.def, g = game;
      if (!ent.enabled || !ent.active || ent.state.dead || g.state.mode !== 'playing') return;
      if (g.frozen && g.frozen()) { ent.tint = FROZEN; return; }
      if (ent.tint === FROZEN) ent.tint = null;
      if (d.pulse) {   // dangerous for pulse[0] seconds, then safe for pulse[1] seconds
        ent.pulseT -= dt;
        if (ent.pulseT <= 0) {
          ent.state.off = !ent.state.off;
          ent.pulseT = d.pulse[ent.state.off ? 1 : 0];
          ent.setLook({ off: ent.state.off });
          if (!ent.state.off) ent.touching = false;   // standing on it when it switches on still hurts
        }
      }
      if (ent.touching && !ent.state.off) { ent.contactT -= dt; if (ent.contactT <= 0) contact(ent, g); }

      // senses: distance to the player and line of sight, a few times a second
      const pl = g.player, eye = pl.eye();
      const range = Math.max(d.chase || 0, d.shoots ? d.shoots.range || 16 : 0, d.boss ? d.engage || 30 : 0);
      if (range) {
        ent.aiT -= dt;
        if (ent.aiT <= 0) {
          ent.aiT = 0.2;
          ent.dist = Math.hypot(eye[0] - ent.pos[0], eye[2] - ent.pos[2]);
          ent.sees = ent.dist <= range && Math.abs(eye[1] - ent.pos[1]) < 6 && clearLine(g, eyeOf(ent), [eye[0], eye[1] - 0.25, eye[2]]);
          if (d.boss && ent.sees) ent.state.engaged = true;
          if (d.chase) {
            if (ent.sees && ent.dist <= d.chase) { ent.chasing = true; ent.lostT = 0; }
            else if (ent.chasing) {
              ent.lostT += 0.2;
              if (ent.lostT > 2.5 || ent.dist > d.chase * 1.8) { ent.chasing = false; ent.returning = true; ent.stuckT = 0; }
            }
          }
        }
      }
      const rage = d.rage && d.hp && ent.state.hp <= d.hp * (d.rage.below || 0.5) ? d.rage : null;
      const mul = rage ? rage.speed || 1.5 : 1;

      // movement: chase · go back to the patrol · patrol
      if (ent.chasing) {
        walk(ent, g, pl.pos[0], pl.pos[2], (d.chaseSpeed || d.speed * 1.3) * mul, dt);
        ent.yaw = Math.atan2(pl.pos[0] - ent.pos[0], pl.pos[2] - ent.pos[2]);
      } else if (ent.returning) {
        const t = ent.path.length ? ent.path[ent.state.pathI % ent.path.length] : ent.home;
        const before = Math.hypot(t[0] - ent.pos[0], t[2] - ent.pos[2]);
        const left = walk(ent, g, t[0], t[2], d.speed * mul, dt);
        ent.stuckT = before - left < 0.2 * d.speed * dt ? (ent.stuckT || 0) + dt : 0;
        if (left < 0.3 || ent.stuckT > 1.5) { if (left >= 0.3) { ent.pos[0] = t[0]; ent.pos[2] = t[2]; } ent.returning = false; }
      } else if (ent.path.length) {
        if (ent.waitT > 0) ent.waitT -= dt;
        else {
          const t = ent.path[ent.state.pathI % ent.path.length], mx = t[0] - ent.pos[0], mz = t[2] - ent.pos[2], ml = Math.hypot(mx, mz);
          const step = d.speed * mul * dt;
          if (ml <= step) {
            ent.pos[0] = t[0]; ent.pos[2] = t[2];
            ent.state.pathI = (ent.state.pathI + 1) % ent.path.length;
            ent.waitT = d.wait;
          } else {
            ent.pos[0] += mx / ml * step; ent.pos[2] += mz / ml * step;
            if (d.faceTravel) ent.yaw = Math.atan2(mx, mz);
          }
        }
      }

      // shooting (turrets, bosses, ranged enemies)
      if (d.shoots && g.enemyFire && ent.sees && ent.dist <= (d.shoots.range || 16)) {
        if (!ent.chasing && !ent.path.length) ent.yaw = Math.atan2(eye[0] - ent.pos[0], eye[2] - ent.pos[2]);
        ent.shootT -= dt * (rage ? 1.6 : 1);
        if (ent.shootT <= 0) {
          ent.shootT = (d.shoots.every || 2) * (0.85 + Math.random() * 0.3);
          const c = eyeOf(ent);
          g.enemyFire(ent, c, [eye[0], eye[1] - 0.25, eye[2]], d.shoots);   // the same line it saw you along
        }
      }

      // bosses bring their minions back
      if (d.summon && ent.state.engaged && !(d.armor !== undefined && d.summon.whileArmored === false && GK.test(g, d.armor))) {
        ent.summonT -= dt * (rage ? 1.5 : 1);
        if (ent.summonT <= 0) {
          ent.summonT = d.summon.every || 8;
          const mins = (d.summon.ids || []).map(id => g.world.get(id)).filter(Boolean);
          const alive = mins.filter(m => m.active && !m.state.dead).length;
          const free = mins.find(m => !m.removed && (!m.active || m.state.dead));
          const share = Number(g.difficultyOpts ? g.difficultyOpts().summons : 1);
          const max = share > 0 && share < 1 ? Math.max(1, Math.ceil((d.summon.max || 3) * share)) : (d.summon.max || 3);
          if (free && alive < max) {
            const a = Math.random() * Math.PI * 2, r = d.summon.radius || 2.5;
            revive(free, [ent.pos[0] + Math.cos(a) * r, free.home[1], ent.pos[2] + Math.sin(a) * r]);
            free.enabled = true; free.chasing = !!free.def.chase;
            if (g.burst) g.burst(free.center(), '#a855f7', 8);
            g.emit('hazard:summoned', { id: free.id });
          }
        }
      }
    },
  });

  // {hp: {id: 'boss', lte: 10}} — an enemy's health (e.g. a boss changes phase); false once it is gone
  GK.Conditions.add('hp', (g, v) => { const e = g.world && g.world.get(v.id); return !!e && !e.removed && GK.compare(e.state.hp, v); });

  // {type:'defeat', tag:'bug', count:5} — counts defeated enemies with that tag; the marker points at the nearest one
  GK.Objectives.add('defeat', {
    need(o, g) {
      const n = o.count || 1, r = g ? thinPlan(g).ratio[o.tag] : undefined;
      return r !== undefined && r < 1 ? Math.max(1, Math.ceil(n * r)) : n;
    },
    progress: (o, g) => g.state.events['defeated:' + o.tag] || 0,
    target(o, g, from) {
      if (!g.world) return null;
      let best = null, bd = Infinity;
      for (const e of g.world.entities) {
        if (e.type !== 'hazard' || !e.active || e.state.dead || e.tags.indexOf(o.tag) < 0) continue;
        const dd = V.dist(e.pos, from);
        if (dd < bd) { bd = dd; best = e.top(); }
      }
      return best;
    },
  });

  GK.Mechanics.add('hazards', {
    setup(game) {
      game.hurtCD = 0;
      game.ui.setBoss(null);
      /** Hurt the player (enemy touch, enemy bolt, trap). Blocked by a shield; short safe time after each hit. */
      game.hurtPlayer = (amount, src) => {
        const g = game;
        if (g.state.mode !== 'playing' || g.hurtCD > 0) return false;
        if (g.shielded && g.shielded()) { g.audio.play('blocked'); return false; }
        g.hurtCD = 0.5;
        if (amount && g.player.health != null) g.player.damage(amount);
        g.audio.play('hurt');
        g.ui.flash('#ff2d55');
        if (g.shake) g.shake(0.3, 0.14);
        const kb = src && src.def && src.def.knockback;
        if (kb && src.pos) {
          const dx = g.player.pos[0] - src.pos[0], dz = g.player.pos[2] - src.pos[2], l = Math.hypot(dx, dz) || 1;
          g.player.vel[0] += dx / l * kb; g.player.vel[2] += dz / l * kb;
          if (g.player.grounded) g.player.vel[1] = 3;
        }
        g.emit('player:hit', { id: src && src.id });
        return true;
      };
      /** A shot hit an enemy: 'defeated' | 'hit' | 'blocked' (armoured / cannot be shot). */
      game.hitHazard = (ent, damage) => {
        const d = ent.def;
        if (!ent.active || ent.state.dead) return 'miss';
        if (d.boss) ent.state.engaged = true;
        if (!d.hp || (d.armor !== undefined && GK.test(game, d.armor))) { ent.hi = 0.35; game.audio.play('blocked'); return 'blocked'; }
        const mul = d.boss ? Number(game.difficultyOpts ? game.difficultyOpts().bossDamage : 1) : 1;
        ent.state.hp -= (damage || 1) * (mul > 0 ? mul : 1);
        ent.hi = 0.9;
        if (d.chase) ent.chasing = true;
        if (d.boss) ent.state.engaged = true;
        game.emit('hazard:damaged', { id: ent.id });
        if (ent.state.hp <= 0) { defeat(ent, game, 'shot'); return 'defeated'; }
        game.audio.play('hit');
        return 'hit';
      };
      game.defeatHazard = (ent, how) => defeat(ent, game, how || 'shot');
      game.on('player:respawn', () => { for (const e of game.world.entities) if (e.type === 'hazard' && e.chasing) { e.chasing = false; e.returning = true; e.stuckT = 0; } });
    },
    update(game, dt) {
      if (game.hurtCD > 0) game.hurtCD -= dt;
      // boss bar: the nearest engaged boss
      let boss = null, bd = Infinity;
      for (const e of game.world.entities) {
        if (e.type !== 'hazard' || !e.def.boss || !e.active || e.state.dead || !e.state.engaged) continue;
        const dd = V.dist(e.pos, game.player.pos);
        if (dd < bd) { bd = dd; boss = e; }
      }
      game.ui.setBoss(boss ? { name: boss.name || 'Boss', hp: Math.max(0, boss.state.hp), max: boss.def.hp || 1, shielded: boss.def.armor !== undefined && GK.test(game, boss.def.armor) } : null);
    },
  });
})();

</script>
<script>/* mechanics/powerups/powerups.js */
/* Game Kit · mechanics/powerups   (spatial game types only)
   Floating power-ups you pick up by touch. Each one gives a power for a few seconds:
     speed  — run 60% faster              shield — hazards cannot hurt you (and you can squash `squash` hazards)
     freeze — every hazard stops moving   double — good points count twice
     heal   — +50 health at once        rapid  — the weapon (mechanics/weapons) fires twice as fast, for free
   Entity: { type: 'powerup', power: 'shield', duration: 12, respawn: 30, points: 10 }
     respawn: seconds until it comes back (0 = once only) — good for competitive replays.
   Adds game.activatePower(name, seconds), game.hasPower(name), game.shielded(), game.frozen(),
   game.scoreMultiplier() (used by core scoring), state.powers {name: secondsLeft}, event powerup {id, power},
   condition {power: 'shield'}. Active powers show as chips under the score. */
(function () {
  'use strict';
  const P = GK.Prefabs;
  const KINDS = GK.PowerUps = {
    speed: { label: '⚡ SPEED', color: '#f5b700', duration: 10 },
    shield: { label: '🛡 SHIELD', color: '#4cc9f0', duration: 12 },
    freeze: { label: '❄ FREEZE', color: '#a5f3fc', duration: 8 },
    double: { label: '✖2 POINTS', color: '#2ecc71', duration: 15 },
    heal: { label: '❤ HEAL', color: '#ff6b81', duration: 0 },
    rapid: { label: '🔥 RAPID FIRE', color: '#ff7a1a', duration: 12 },
  };

  P.add('powerup', {
    defaults: { model: 'powerup', solid: false, hover: 1.0, spin: 2.4, bob: 0.15, touch: true, power: 'speed', respawn: 0, points: 10 },
    init(ent) {
      const k = KINDS[ent.def.power];
      if (!k) { ent.world.problem('Power-up "' + ent.id + '": unknown power "' + ent.def.power + '" (' + Object.keys(KINDS).join(', ') + ')'); return; }
      if (!ent.def.color && !(ent.def.look && ent.def.look.color)) ent.setLook({ color: k.color });
      if (ent.label == null) ent.label = k.label;
      if (!ent.name) ent.name = k.label;
      ent.onTouch = g => {
        if (!ent.active || g.state.mode !== 'playing') return;
        g.activatePower(ent.def.power, ent.def.duration, ent);
        if (ent.def.respawn) { ent.hide(); g.later(ent.def.respawn, () => { if (!ent.removed) ent.show(); }); } else ent.remove();
      };
    },
  });

  GK.Conditions.add('power', (g, v) => !!(g.hasPower && g.hasPower(v)));
  GK.Actions.add('power', (g, a) => g.activatePower && g.activatePower(a.power, a.seconds));   // {do:'power', power:'shield', seconds: 15}

  GK.Mechanics.add('powerups', {
    setup(game) {
      game.state.powers = {};
      game.activatePower = (name, seconds, ent, quiet) => {   // quiet: no toast / flash (e.g. a speed pad)
        const k = KINDS[name];
        if (!k) return;
        if (name === 'heal') { if (game.player && game.player.health != null) game.player.heal(50); }
        else game.state.powers[name] = Math.max(game.state.powers[name] || 0, seconds || k.duration);
        if (ent && ent.def.points) game.scoring.add(ent.def.points, 'Power-up', 'bonus');
        if (!quiet) {
          game.audio.play('checkpoint');
          game.ui.flash(k.color);
          game.ui.toast(k.label + (name === 'heal' ? '!' : ' for ' + (seconds || k.duration) + ' seconds!'), 'good');
        }
        game.emit('powerup', { id: ent ? ent.id : null, power: name });
      };
      game.hasPower = name => (game.state.powers[name] || 0) > 0;
      game.shielded = () => game.hasPower('shield');
      game.frozen = () => game.hasPower('freeze');
      game.scoreMultiplier = () => (game.hasPower('double') ? 2 : 1);
      game.ui.setChips([]);
    },
    update(game, dt) {
      const P2 = game.state.powers;
      for (const n in P2) {
        P2[n] -= dt;
        if (P2[n] <= 0) { delete P2[n]; if (!KINDS[n].quiet) game.ui.toast(KINDS[n].label + ' is over'); }
      }
      if (game.player) game.player.speedMul = game.hasPower('speed') ? 1.6 : 1;
      game.ui.setChips(Object.keys(P2).map(n => ({ text: KINDS[n].label + '  ' + Math.ceil(P2[n]), color: KINDS[n].color })));
    },
    restore(game) { if (!game.state.powers) game.state.powers = {}; },
  });
})();

</script>
<script>/* mechanics/moving-platform/moving-platform.js */
/* Game Kit · mechanics/moving-platform   (spatial game types only)
   Enable in a game:  mechanics: ['standard', 'moving-platform']
   Entity:  { type: 'mover', pos: [x, y, z], size: [w, h, d], to: [x, y, z]  (or path: [[x,y,z], …], or route: 'worldRoute'),
              speed: 1.5, wait: 0.8, loop: false (true = go round the path, false = back and forth),
              if: condition (only moves while true, e.g. {flag:'power'}), color }
   The player is carried when standing on top. Built only from public kit APIs, like every mechanic. */
(function () {
  'use strict';
  const U = GK.util, V = GK.vec;

  GK.Prefabs.add('mover', {
    defaults: { model: 'box', size: [2, 0.3, 2], color: '#e0a526', solid: true, speed: 1.5, wait: 0.8, loop: false },
    init(ent) {
      const d = ent.def;
      const route = d.route && ent.world.routes[d.route];   // a world route (e.g. filled into a slot) works like path

  M.add('piston', o => {   // a pusher block: its front face is at the origin, the block goes back (−z) into the wall

      .box(0, h * 0.4, 0.01, w * 0.6, h * 0.2, 0.04, '#1a202c');
  });

    const w = o.w || 9.6, c = o.color || '#ff2d55';
    return G().box(0, 0.32, 0, w, 0.16, 0.16, c, { glow: 1 }).box(-w / 2, 0, 0, 0.3, 0.6, 0.3, '#2d3748').box(w / 2, 0, 0, 0.3, 0.6, 0.3, '#2d3748');
  });
  /** Wall pusher: {type: 'piston', reach: 4.5, period: 2.8, phase, w, h} shoots out the way it faces, holds, slides back.
      Being hit while it shoots out throws you aside (off a walkway, into a lane). */
  P.add('piston', {
    defaults: { model: 'piston', solid: false, reach: 4.5, period: 2.8, w: 3, h: 2.2, power: 11 },
    init(e) { e.setLook({ w: e.def.w, h: e.def.h }); e.base = e.pos.slice(); e.phase = e.def.phase != null ? e.def.phase : (hashOf(e.id) % 100) / 100; },
    update(e, dt, g) {

      if (!e.enabled || g.state.mode !== 'playing' || !g.knock) return;
      const p = g.player.pos, dx = p[0] - e.pos[0], dz = p[2] - e.pos[2], along = dx * f[0] + dz * f[1], side = Math.abs(dx * f[1] - dz * f[0]);

    defaults: { model: 'jumpBar', solid: false, travel: 20, speed: 4.5, w: 9.6, power: 8 },
    init(e) { e.setLook({ w: e.def.w }); e.base = e.pos.slice(); e.phase = (hashOf(e.id) % 100) / 100; },
    update(e, dt, g) {

  /** Glass bridge tile (Squid Game): {type: 'glasstile', row, col (0 | 1), size}. In each row one of the two is FAKE and

        e.state.broken = true; e.hide();

  /** Door Dash: {type: 'dashdoor', row, real: 2} facing the runners. In each row `real` doors break when you run into them;
      the others are FAKE and bounce you back. game.trapRandom picks which (the same for the whole class). */
  P.add('dashdoor', {
    defaults: { model: 'dashDoor', solid: true, width: 4, height: 3.4, real: 2 },
    init(e) { e.setLook({ width: e.def.width, height: e.def.height, color: e.def.color }); e.state.broken = false; },
    restore(e) { if (e.state.broken) e.hide(); },
    update(e, dt, g) {
      if (e.state.broken || g.state.mode !== 'playing') return;
      if (e.bounceT > 0) { e.bounceT -= dt; return; }
      const pb = Ph.bodyBox(g.player.pos, g.player.r + 0.25, g.player.h), b = e.collider();
      if (!Ph.overlap(pb, b)) return;
      const row = g.world.entities.filter(x => x.type === 'dashdoor' && x.def.row === e.def.row).sort((x, y) => rand(g, 'door:' + x.id) - rand(g, 'door:' + y.id));
      if (row.indexOf(e) < e.def.real) {
        e.state.broken = true; e.hide(); g.audio.play('boom'); burst(g, e.center(), '#b794f4', 14); g.emit('terrain:door', { id: e.id, real: true });
      } else {
        e.bounceT = 0.8; e.hi = 1; e.label = '✖ FAKE'; e.labelRange = 30;
        const f = fwd(e);
        if (g.knock) g.knock([f[0], f[1]], 8, { stun: 0.45, up: 3, kind: 'door', source: e.id });   // the door faces the runners
        g.audio.play('deny'); g.emit('terrain:door', { id: e.id, real: false });

  /** The robot over a Red Light arena (look.eyes shows the light); a 'redlight' zone turns it. */
  P.add('watcher', { defaults: { model: 'watcherBot', solid: false }, init(e) { e.setLook({ w: e.def.w || 30, eyes: '#7cfc00' }); e.baseYaw = e.yaw; } });
  /** Red Light, Green Light (Squid Game): {type: 'redlight', size: [across, height, along], green: [3, 6], red: [2.5, 4.5],
