        b.nextAct -= dt;
        if (b.nextAct <= 0 && !st.finished) {
          b.nextAct = 18 + Math.random() * 30 - b.mean * 8;
          const me = g.player.pos, dx = me[0] - b.ent.pos[0], dz = me[2] - b.ent.pos[2], dd = Math.hypot(dx, dz);
          if (dd < 6 && dd > 0.5) { const r = g.gadgetEffect({ k: 'knock', g: 'glove', dir: [dx / dd, dz / dd], power: 12, stun: 0.9, up: 5 }, b.id, b.name); if (r === 'hit') b.strat += 8; }
          else if (dd < 40 && Math.random() < 0.5) { const p = C.at(b.d - 2); g.gadgetObject({ t: 'banana', id: b.id + '-' + Math.round(now), o: b.id, n: b.name, x: p.x - p.dz * b.off * 0.3, y: 0, z: p.z + p.dx * b.off * 0.3 }); }
        }
      }
      // put the figure on the course: centre line + its own lane offset (wandering a little)
      const zone = C.zones && C.zones.find(z => b.d >= z.d0 - 0.5 && b.d <= z.d1);
      // bots run in the middle lane (never inside the lane walls), on the panes of a glass bridge
      const p = C.at(b.d), w = zone && zone.kind === 'glass' ? (b.off >= 0 ? 2.3 : -2.3) : U.clamp(b.off * 0.55 + Math.sin(now / 2300 + b.speed * 5) * 0.8, -3.3, 3.3), x = p.x - p.dz * w, z = p.z + p.dx * w;
      const moving = running && !b.fin && b.pause <= 0 && b.stun <= 0 && !b.hold;
      const e = b.ent;
      e.pos[0] += (x - e.pos[0]) * Math.min(1, dt * 8); e.pos[2] += (z - e.pos[2]) * Math.min(1, dt * 8);
      // on hills the bots walk on the ground (a ray from above); elsewhere the course is flat
      if (zone && zone.kind === 'hill') { const hit = g.world.raycast([e.pos[0], 12, e.pos[2]], [0, -1, 0], 14); const gy = hit.hit ? 12 - hit.t : 0; e.pos[1] += (gy - e.pos[1]) * Math.min(1, dt * 10); }
      else e.pos[1] += (0 - e.pos[1]) * Math.min(1, dt * 10);
      e.yaw = Math.atan2(p.dx, p.dz);
      e.figure.walk += ((moving ? 1 : 0) - e.figure.walk) * Math.min(1, dt * 8);
      e.figure.phase += dt * (moving ? b.speed : 0) * 3.2;
      if (b.fxT > 0) b.fxT -= dt; else b.fx = null;
      e.flags = b.fx === 'freeze' ? 64 : b.fx === 'lift' ? 128 : b.stun > 0 ? 16 : 0;
      if (b.fx === 'lift') e.pos[1] += Math.min(3.5, (b.fxT > 1 ? 3.5 : b.fxT * 3.5)) * 0.06;   // floats up with the balloon
    }
  }
  function hitBot(g, id, eff) {
    const b = (R.bots || []).find(x => x.id === id);
    if (!b || b.fin || g.state.race.phase !== 'running') return 'immune';
    if (b.safe && b.safe > clock(g)) return 'immune';
    if (eff.k === 'slow') b.slow = eff.seconds || 3;
    else if (eff.k === 'freeze' || eff.k === 'lift') { b.stun = (eff.seconds || 2.4) + 0.3; b.fx = eff.k; b.fxT = b.stun; }
    else { b.stun = (eff.stun || 1) + 0.6; b.d = Math.max(0, b.d - (eff.power || 10) * 0.35); }
    b.safe = clock(g) + 2500;
    return 'hit';
  }

  // ===================== results (round + championship) =====================
  /** Round points for one racer: {race, academic, strategy, explore, total}. */
  function roundPoints(c, r, place, mult) {
    const S = c.score, caps = S.caps;
    const race = r.f ? S.finish + (S.place[place - 1] || 0) : Math.round(S.progress * Math.pow(U.clamp(r.d || 0, 0, 1), S.pow));
    const academic = U.clamp(Math.round(r.a || 0), S.floor, caps.academic), strategy = U.clamp(Math.round(r.s || 0), -30, caps.strategy), explore = U.clamp(Math.round(r.x || 0), 0, caps.explore);
    return { race, academic, strategy, explore, total: Math.round((race + academic + strategy + explore) * mult) };
  }
  /** stats {id: {n, d, f, a, s, x, c, w, v, h, k}} → sorted rows with places and points. */
  function scoreRound(c, stats, round) {
    const mult = c.multipliers[round] || 1, rows = Object.keys(stats).map(id => Object.assign({ id }, stats[id]));
    const fin = rows.filter(r => r.f > 0).sort((a, b) => a.f - b.f);
    fin.forEach((r, i) => { r.pl = i + 1; });
    for (const r of rows) Object.assign(r, roundPoints(c, r, r.pl || 0, mult), { mult });
    rows.sort((a, b) => b.total - a.total || (a.pl || 99) - (b.pl || 99));
    return rows;
  }
  function addChamp(champ, rows, round) {
    for (const r of rows) {
      const C = champ[r.id] = champ[r.id] || { n: r.n, t: 0, rs: {}, pl: {}, c: 0, w: 0, v: 0, h: 0, k: 0, x: 0, a: 0, bot: !!r.bot };
      if (C.rs[round] != null) C.t -= C.rs[round];   // a round counted again replaces its old score
      C.n = r.n; C.rs[round] = r.total; C.t += r.total; C.pl[round] = r.pl || 0;
      C.c += r.c || 0; C.w += r.w || 0; C.v += r.v || 0; C.h += r.h || 0; C.k += r.k || 0; C.x += r.explore || 0; C.a += r.academic || 0;
    }
  }
  const champRows = champ => Object.keys(champ).map(id => Object.assign({ id }, champ[id])).sort((a, b) => b.t - a.t);

  /** My numbers this round (what this PC reports to the host). */
  function myStats(g) {
    const st = g.state.race, by = { academic: 0, strategy: 0, explore: 0 };
    for (const e of g.scoring.log) { const k = e.kind === 'reveal' ? 'academic' : e.kind; if (k in by) by[k] += e.points; }
    const q = g.state.quiz || {}, gs = g.state.gstats || {};
    return { n: g.playerName || 'Player', r: g.levelIndex, d: Math.round(U.clamp(st.best / g.raceCourse.finish.d, 0, 1) * 1000) / 1000, g: st.gates, f: st.finished ? Math.round(st.finishMs) : 0,
      a: by.academic, s: by.strategy, x: by.explore, c: q.correct || 0, w: q.wrong || 0, v: q.reveals || 0, h: gs.hits || 0, k: st.coop };
  }

  // ===================== the mechanic =====================
  GK.Mechanics.add('race', {
    configKeys: ['race', 'roundInfo'],
    setup(game) {
      css();
      overlay(game, null);
      game.on('ui:title', d => titleHook(game, d));   // the title screen gets the join / solo / host box
      game.state.race = { phase: 'init', dist: 0, best: 0, seg: null, finished: false, finishMs: 0, place: 0, gates: 0, cp: 0, coop: 0, found: 0, over: false, warned: {} };
      game.raceCourse = courseOf(game);
      const C = game.raceCourse;
      // objectives: the firewalls, then the finish (the marker and minimap point at the next one)
      const list = C.gates.map(gt => ({ id: 'g' + gt.n, type: 'waypoint', flag: 'gate-' + gt.n + '-open', title: 'Open firewall ' + gt.n + ' / ' + C.gates.length, pos: [gt.pos[0], 1.5, gt.pos[2]], points: 0 }));
      list.push({ id: 'finish', type: 'waypoint', flag: 'finished', title: '🏁 Reach the finish', pos: [C.finish.pos[0], 1.5, C.finish.pos[2]], points: 0 });
      game.missions = new GK.Missions(game, list, true);
      game.ui.setObjectives(game.missions);
      // the start barrier and the team bridges
      const bl = game.world.locations.barrier;
      if (bl && !game.world.get('barrier')) game.world.add({ id: 'barrier', type: 'barrier', at: 'barrier', data: bl.data });
      // what other mechanics need from the race
      game.rivals = () => rivals(game);
      game.rivalName = id => { const r = rivals(game).find(x => x.id === id); return r ? r.name : ''; };
      game.hitRival = (id, eff) => {
        if (R.mode === 'solo') { const res = hitBot(game, id, eff); if (res === 'hit') game.gadgetLanded(eff.g, game.rivalName(id)); return res; }
        if (game.online) game.online.send('gfx', Object.assign({ n: game.playerName }, eff), id);
        return 'sent';
      };
      game.shareGadget = o => { if (game.online && R.mode === 'online') game.online.send('gobj', Object.assign({ n: game.playerName }, o)); };
      game.reportHit = (owner, gid) => { if (game.online && R.mode === 'online' && owner) game.online.send('gres', { g: gid, n: game.playerName }, owner); };
      game.gadgetsImmune = () => game.state.race.finished || game.state.race.phase !== 'running';
      if (game.gadgets) game.gadgets.enabled = () => game.state.race.phase === 'running' && !game.state.race.finished && !game.state.race.over;
      game.raceInfo = () => ({ mode: R.mode, round: game.levelIndex, phase: game.state.race.phase });
      // traps run on the race clock (seconds since GO) and pick fake glass / doors from a seed shared by the room
      game.raceClock = () => { const t = times(game); return t ? (clock(game) - t.startAt) / 1000 : game.state.time; };
      const seed = () => (R.mode === 'solo' ? (R.local && R.local.seed) || 'solo' : (game.online ? game.online.room : 'x')) + ':' + game.levelIndex;
      game.trapRandom = key => { let h = 2166136261; const k = seed() + ':' + key; for (let i = 0; i < k.length; i++) { h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };
      game.musicLevel = () => { const ph = game.state.race.phase; return ph === 'running' ? (game.state.race.finished ? 0.5 : 1) : ph === 'over' ? 0.3 : 0.5; };   // drums from GO
      game.raceRank = () => { const st2 = game.state.race; return st2.count > 1 ? U.clamp(((st2.place || 1) - 1) / (st2.count - 1), 0, 1) : 0.5; };
      game.on('terrain:caught', () => {
        game.scoring.add(-10, 'Caught on red light', 'strategy');
        banner(game, '🔴 CAUGHT!<small>−10</small>', 'bad', 2);
      });
      game.on('terrain:glass', () => banner(game, '💥', 'bad', 1));
      // hazards (lasers, drones) knock you back along the course and stun you briefly
      game.on('player:hit', () => {
        const p = C.at(game.state.race.dist - 1);
        game.knock([-p.dx, -p.dz], 7, { stun: 0.6, up: 3.5, kind: 'hazard' });
      });
      game.on('quiz:correct', ev => {
        game.state.race.gates = Object.keys(game.state.flags).filter(f => /^gate-\d+-open$/.test(f) && game.state.flags[f]).length;
        if (ev.pool === 'gate' && game.gadgets && ev.first) { game.gadgets.give('random', 1); game.activatePower('speed', 2, null, true); }
        if (ev.pool === 'case' && game.gadgets) game.gadgets.give('random', 1);
        if (ev.pool === 'comeback' && game.gadgets) game.gadgets.give('all', 1);
        sendStats(game, true);
      });
      game.on('quiz:wrong', ev => { if (ev.pool === 'gate' || ev.pool === 'shortcut') banner(game, '❌<small>⏳ ' + Math.round(ev.freeze + 1) + ' s</small>', 'bad', ev.freeze + 0.8); else banner(game, '❌', 'bad', 1.5); });
      // player position in the start area
      R.myId = game.online ? game.online.id : 'me';
      placeAtStart(game);
      if (R.mode === 'solo') { if (!R.bots) makeBots(game); placeBots(game); }
      // HUD
      hudEl(game, 'rush-timer'); hudEl(game, 'rush-pos'); info(game, '');
      if (R.mode === 'host') hostSetup(game);
      if (!R.timer) R.timer = setInterval(() => { const g = GK.current; if (g && g.state && g.state.race) { try { tick(g); } catch (e) { console.error('[GK race]', e); } } }, 100);
    },
    start(game) {
      if (R.mode === 'host') game.input.unlock();
      if (R.mode === 'solo') {
        const c = cfgOf(game), now = clock(game);
        R.local = { seed: Math.random().toString(36).slice(2, 8), round: game.levelIndex, prepEnd: now + c.soloPrep * 1000, startAt: now + (c.soloPrep + c.countdown + 0.2) * 1000, endAt: 0, len: (R.roundTime || c.roundTime) * 1000 };
        R.local.endAt = R.local.startAt + R.local.len;
      }
      tick(game);
    },
    update(game, dt) {
      const st = game.state.race, C = game.raceCourse;
      if (R.mode === 'host') { if (game.online) spectate(game, game.online.serverNow()); return; }
      if (!C) return;
      const pr = C.project(game.player.pos, st.seg);
      st.seg = pr.seg; st.dist = pr.d;
      if (st.phase === 'running' && !st.finished) {
        if (pr.d > st.best && pr.d - st.best < 40) st.best = pr.d;
        // checkpoints: falling into a pit puts you back at the last one you passed
        while (C.cps[st.cp + 1] && st.best >= C.cps[st.cp + 1].d - 1) { st.cp++; const cp = C.cps[st.cp]; game.checkpoint = { pos: cp.pos.slice(), rot: cp.rot }; game.emit('race:checkpoint', { i: st.cp }); }
        // the finish line (all firewalls must be open)
        const F = C.finish, p = game.player.pos;
        if (st.best >= F.d - 2.5 && Math.hypot(p[0] - F.pos[0], p[2] - F.pos[2]) < F.size[0] / 2 + 1 && st.gates >= C.gates.length) finish(game);
      }
      if (st.phase === 'running') coop(game, dt);
      if (R.mode === 'solo' && (st.phase === 'running' || st.phase === 'prep' || st.phase === 'countdown')) stepBots(game, dt);
      if (st.phase === 'running' && R.mode === 'online') sendStats(game, false);
    },
  });

  function placeAtStart(game) {
    const L = game.world.locations;
    let i = 1;
    if (game.online && R.mode === 'online') { let h = 0; for (const ch of game.online.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; i = 1 + h % 24; }
    const sp = L['start-' + i] || L['start-1'];
    if (sp && game.player) { game.player.place(sp.pos, sp.rot); game.checkpoint = { pos: sp.pos.slice(), rot: sp.rot }; }
  }

  // ===================== phases (server clock, also while a panel is open or the game is paused) =====================
  function times(g) {
    if (R.mode === 'solo') return R.local;
    const n = R.node;
    return n && n.round === g.levelIndex && n.prepEnd ? n : null;
  }
  function tick(g) {
    const st = g.state.race, c = cfgOf(g);
    if (!st || g.state.mode === 'title' || g.state.mode === 'ended') return;
    if (R.mode === 'host') { hostTick(g); return; }
    const t = times(g), now = clock(g);
    // solo: a paused game pauses the race too
    if (R.mode === 'solo' && t) {
      const wall = Date.now(), last = R.lastWall || wall; R.lastWall = wall;
      if (g.state.mode === 'paused' && st.phase !== 'over') { const d = wall - last; t.prepEnd += d; t.startAt += d; t.endAt += d; }
      else if (st.phase === 'running' && g.state.mode === 'modal') stepBots(g, Math.min(0.25, (wall - last) / 1000));
    }
    let phase = 'lobby';
    if (t) phase = now < t.prepEnd ? 'prep' : now < t.startAt ? 'countdown' : now < t.endAt ? 'running' : 'over';
    if (R.mode === 'online' && R.node && R.node.phase === 'results' && R.node.resultsFor === g.levelIndex) phase = 'over';
    if (phase !== st.phase) enter(g, phase, st.phase);
    const timer = g.ui.hud.querySelector('.rush-timer');
    if (timer) {
      let txt = '', sub = '', cls = '';
      if (phase === 'lobby') { sub = R.mode === 'online' ? 'ROOM ' + (g.online ? g.online.room : '') : ''; txt = '--:--'; }
      else if (phase === 'prep') { txt = fmt((t.prepEnd - now) / 1000); sub = 'GET READY'; }
      else if (phase === 'countdown') { txt = fmt(t.len / 1000); sub = 'ROUND ' + (g.levelIndex + 1); }
      else if (phase === 'running') {
        const left = (t.endAt - now) / 1000;
        txt = fmt(left); sub = 'ROUND ' + (g.levelIndex + 1) + ' / ' + g.levelCount; cls = left <= 10 ? 'end' : left <= 60 ? 'warn' : '';
        for (const w of [300, 120, 60]) if (left <= w && left > w - 2 && !st.warned[w] && t.len / 1000 > w + 5) { st.warned[w] = 1; banner(g, (w / 60) + ':00 LEFT', w === 60 ? 'bad' : '', 1.8); g.audio.play('tick'); }
        if (left <= 10 && Math.ceil(left) !== st.lastTick) { st.lastTick = Math.ceil(left); banner(g, String(Math.max(1, Math.ceil(left))), 'bad', 0.8); g.audio.play('tick'); }
        if (st.finished) sub = 'FINISHED ' + ORD(st.place || 1);
      } else { txt = '0:00'; sub = 'TIME UP'; }
      const html = txt + '<small>' + sub + '</small>';
      if (timer._h !== html) { timer._h = html; timer.innerHTML = html; }
      timer.className = 'rush-timer ' + cls;
    }
    if (phase === 'countdown') {
      const k = Math.ceil((t.startAt - now) / 1000);
      if (k !== st.cd && k >= 1 && k <= c.countdown) { st.cd = k; banner(g, String(k), '', 0.9); g.audio.play('tick'); }
    }
    positions(g);
  }

  function enter(g, phase, from) {
    const st = g.state.race;
    st.phase = phase;
    if (phase === 'lobby') info(g, R.mode === 'online' ? '<b class="rush-roundname">⏳ 👩‍🏫</b><br>' + U.esc(g.online ? g.online.room : '') : '');
    if (phase === 'prep') {
      info(g, '');
      placeAtStart(g);
      const b = g.world.get('barrier'); if (b) b.show();
      if (g.gadgets && g.gadgets.cfg.pickup && !st.chose) {
        st.chose = true;
        const ri = g.cfg.roundInfo || {};
        info(g, '<b class="rush-roundname">' + (g.levelIndex + 1) + ' · ' + U.esc(ri.name || g.cfg.stageTitle || '') + '</b>' +
          '<div class="rush-howto">' + [['🏁', 'FINISH'], ['❓', 'ANSWER'], ['🎁', 'GRAB'], ['🖱', 'USE / 👊'], ['🔴', 'FREEZE'], ['⭐', 'BONUS']].map(x => '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join('') + '</div>');
      } else if (g.gadgets && !st.chose) {
        st.chose = true;
        const t = times(g), ri = g.cfg.roundInfo || {};
        g.gadgets.chooser({
          title: '🎒 Round ' + (g.levelIndex + 1) + ': ' + (ri.name || g.cfg.stageTitle || '') + ' · choose your gadgets',
          info: (ri.text ? '<b>' + U.esc(ri.text) + '</b><br>' : '') + (g.levelIndex === 0 ? '<small>' + T(g, 'howto', '') + '</small><br>' : '') + '<small>Charges this round: ' + g.gadgets.cfg.charges + ' each · earn more with right answers and crates · ×' + (cfgOf(g).multipliers[g.levelIndex] || 1) + ' points</small>',
          secondsLeft: () => { const tt = times(g); return tt ? (tt.prepEnd - clock(g)) / 1000 : 0; },
          onDone: () => { if (R.mode === 'solo' && R.local && clock(g) < R.local.prepEnd - 300) { const d = R.local.prepEnd - clock(g); R.local.prepEnd -= d; R.local.startAt -= d; R.local.endAt -= d; } },
        });
      }
    }
    if (phase === 'countdown') { if (!(g.gadgets && g.gadgets.cfg.pickup)) info(g, ''); placeAtStart(g); }
    if (phase === 'running') {
      const b = g.world.get('barrier'); if (b) b.hide();
      if (from === 'countdown' || from === 'prep') { banner(g, 'GO!', 'go', 1.2); g.audio.play('go'); }
      else if (from === 'lobby' || from === 'init') { const bb = g.world.get('barrier'); if (bb) bb.hide(); banner(g, 'GO!<small>The race has already started!</small>', 'go', 1.5); }
      info(g, '');
      g.emit('race:go', {});
      if (g.gadgets) g.gadgets.draw(true);
    }
    if (phase === 'over') {
      st.over = true;
      if (!st.finished) { banner(g, 'TIME UP!', 'bad', 2.5); g.audio.play('lose'); if (g.player) g.player.stun = 9999; }
      if (g.gadgets) g.gadgets.draw(true);
      g.emit('race:over', {});
      if (R.mode === 'online') { sendStats(g, true); if (R.node && R.node.phase === 'results' && R.node.resultsFor === g.levelIndex) showOnlineResults(g); else info(g, '⏳ Waiting for the round results…'); }
      if (R.mode === 'solo') setTimeout(() => soloResults(g), 1800);
    }
  }

  function finish(g) {
    const st = g.state.race, t = times(g);
    if (st.finished || !t) return;
    st.finished = true; st.finishMs = clock(g) - t.startAt;
    g.setFlag('finished', true);
    // place: online from the other players' finish times, solo from the bots
    let ahead = 0;
    if (R.mode === 'solo') ahead = (R.bots || []).filter(b => b.fin && b.fin < st.finishMs).length;
    else if (g.online) ahead = g.online.players().filter(p => !p.me && p.raw && p.raw.fin > 0 && p.raw.r === g.levelIndex && p.raw.fin < st.finishMs).length;
    st.place = ahead + 1;
    banner(g, '🏁 FINISHED ' + ORD(st.place) + '!<small>' + fmtMs(st.finishMs) + '</small>', 'go', 3);
    g.audio.play('win');
    g.emit('race:finish', { ms: st.finishMs, place: st.place });
    if (g.online && R.mode === 'online') {
      g.online.set({ fin: Math.round(st.finishMs), r: g.levelIndex }); sendStats(g, true);
      setTimeout(() => { if (GK.current === g) g.onlineSilent = true; }, 3000);
      setTimeout(() => { if (GK.current === g && st.phase === 'running') info(g, '<b class="rush-roundname">🏁 ' + ORD(st.place) + '</b> ⏳'); }, 3200);
    }
    if (g.gadgets) g.gadgets.draw(true);
    if (R.mode === 'solo') {
      // the round ends a little after you finish (the bots' places are worked out from where they are)
      setTimeout(() => { if (R.local && GK.current === g && g.state.race === st) { R.local.endAt = Math.min(R.local.endAt, clock(g) + 4000); } }, 50);
    }
  }

  // ===================== team plates =====================
  function coop(g, dt) {
    const W = g.world, st = g.state.race;
    for (const a of W.entities) {
      if (a.type !== 'plate' || !/^plateA-/.test(a.id)) continue;
      const n = a.id.slice(7), b = W.get('plateB-' + n), br = W.get('bridge-' + n);
      if (!b || !br) continue;
      const on = e => {
        const pts = [];
        const me = g.player.pos;
        if (Math.hypot(me[0] - e.pos[0], me[2] - e.pos[2]) < 1.3 && Math.abs(me[1] - e.pos[1]) < 1) pts.push('me');
        for (const r of rivals(g)) if (Math.hypot(r.pos[0] - e.pos[0], r.pos[2] - e.pos[2]) < 1.4) pts.push(r.id);
        return pts;
      };
      let A = on(a), B = on(b);
      // solo: a helper robot steps on the other plate for you
      if (R.mode === 'solo') { if (A.includes('me') && !B.length) B = ['buddy']; if (B.includes('me') && !A.length) A = ['buddy']; }
      a.setLook({ on: A.length > 0 }); b.setLook({ on: B.length > 0 });
      const both = A.length > 0 && B.length > 0;
      a.state.hold = both ? 8 : Math.max(0, (a.state.hold || 0) - dt);
      if (a.state.hold > 0 && !br.visible) { br.show(); g.audio.play('door'); banner(g, '🤝 TEAM BRIDGE OPEN', '', 1.4); }
      if (a.state.hold <= 0 && br.visible && !GK.Physics.overlap(GK.Physics.bodyBox(g.player.pos, g.player.r, g.player.h), br.box(true))) br.hide();
      // teamwork points once per bridge per round (no farming by standing on the plates)
      if (both && (A.includes('me') || B.includes('me')) && !(st.coopDone || (st.coopDone = {}))[n]) {
        st.coopDone[n] = 1; st.coop++;
        g.scoring.add(cfgOf(g).points.coop, 'Teamwork', 'strategy');
        g.ui.toast('🤝 Teamwork! +' + cfgOf(g).points.coop + (R.mode === 'solo' ? ' (helper bot)' : ''), 'good');
      }
    }
  }

  // ===================== live positions =====================
  function positions(g) {
    const st = g.state.race, C = g.raceCourse, box = g.ui.hud.querySelector('.rush-pos');
    if (!C || !box) return;
    if (st.phase !== 'running' && st.phase !== 'over') { box.style.display = 'none'; return; }
    box.style.display = '';
    const list = [{ id: 'me', name: g.playerName || 'You', fin: st.finished ? st.finishMs : 0, d: st.best, me: true }];
    if (R.mode === 'solo') for (const b of R.bots || []) list.push({ id: b.id, name: b.name, fin: b.fin, d: b.d });
    else if (g.online) for (const p of g.online.players()) {
      if (p.me || !p.on || !p.pos) continue;
      const e = g.online.ghost(p.id), pos = e ? e.pos : p.pos, pr = C.project(pos, e ? e.seg : null);
      if (e) e.seg = pr.seg;
      list.push({ id: p.id, name: p.name, fin: p.raw && p.raw.r === g.levelIndex ? p.raw.fin || 0 : 0, d: pr.d });
    }
    list.sort((a, b) => (a.fin && b.fin ? a.fin - b.fin : a.fin ? -1 : b.fin ? 1 : b.d - a.d));
    const me = list.findIndex(x => x.me) + 1;
    st.count = list.length;
    if (st.finished && st.place) { /* keep the place you finished in */ } else st.place = me;
    const shown = list.slice(0, 5);
    const html = '<b class="big">' + ORD(st.finished ? st.place : me) + '</b> / ' + list.length + '<ol>' + shown.map(x => '<li class="' + (x.me ? 'me' : '') + (x.fin ? ' fin' : '') + '">' + U.esc(x.name) + '</li>').join('') + '</ol>' + (me > 5 ? '<small>… you: ' + ORD(me) + '</small>' : '');
    if (box._h !== html) { box._h = html; box.innerHTML = html; }
  }

  // ===================== online: what this PC reports =====================
  function sendStats(g, now) {
    if (!g.online || R.mode !== 'online') return;
    const t = performance.now();
    if (!now && t - (R.lastStats || 0) < 8000) return;
    R.lastStats = t;
    const s = myStats(g), key = JSON.stringify(s);
    if (key === R.lastStatsKey) return;
    R.lastStatsKey = key;
    g.online.ref('stats/' + g.online.id).set(Object.assign(s, { at: g.online.serverNow() }));
  }

  // ===================== solo results =====================
  function soloResults(g) {
    if (GK.current !== g || R.mode !== 'solo') return;
    const c = cfgOf(g), round = g.levelIndex, stats = {};
    stats.me = myStats(g);
    for (const b of R.bots) stats[b.id] = { n: '🤖 ' + b.name, d: U.clamp(b.d / g.raceCourse.finish.d, 0, 1), f: b.fin || 0, a: b.acad, s: b.strat + Math.round(Math.random() * 15), x: b.expl, c: b.correct, w: b.wrong, v: 0, h: 0, k: 0, bot: true };
    const rows = scoreRound(c, stats, round);
    addChamp(R.champ, rows, round);
    R.results[round] = rows;
    showResults(g, rows, champRows(R.champ), 'me');
  }

  function table(rows, meId, cols) {
    return '<table class="rush-table"><tr>' + cols.map(x => '<th' + (x.n ? ' class="n"' : '') + '>' + x.h + '</th>').join('') + '</tr>' +
      rows.map((r, i) => '<tr class="' + (r.id === meId ? 'me ' : '') + (i === 0 ? 'top1' : '') + '">' + cols.map(x => '<td' + (x.n ? ' class="n"' : '') + '>' + x.v(r, i) + '</td>').join('') + '</tr>').join('') + '</table>';
  }
  /** Round results + championship (solo and online). */
  function showResults(g, rows, champ, meId, opts) {
    opts = opts || {};
    const round = g.levelIndex, last = round + 1 >= g.levelCount, mine = rows.find(r => r.id === meId);
    const rt = table(rows.slice(0, opts.max || 12), meId, [
      { h: '#', v: (r, i) => i + 1 }, { h: 'Player', v: r => U.esc(r.n) }, { h: 'Finish', v: r => (r.f ? ORD(r.pl) + ' · ' + fmtMs(r.f) : Math.round((r.d || 0) * 100) + '%') },
      { h: '🏁', n: 1, v: r => r.race }, { h: '🧠', n: 1, v: r => r.academic }, { h: '🎯', n: 1, v: r => r.strategy }, { h: '🔎', n: 1, v: r => r.explore }, { h: 'Points', n: 1, v: r => '<b>' + r.total + '</b>' + (r.mult > 1 ? ' <small>×' + r.mult + '</small>' : '') }]);
    const ct = table(champ.slice(0, opts.max || 12), meId, [{ h: '#', v: (r, i) => i + 1 }, { h: 'Player', v: r => U.esc(r.n) }, { h: 'Rounds', v: r => Object.keys(r.rs).sort().map(k => r.rs[k]).join(' + ') }, { h: 'Total', n: 1, v: r => '<b>' + r.t + '</b>' }]);
    const myRank = champ.findIndex(r => r.id === meId) + 1;
    const me = mine ? '<div class="rush-mine"><span>Finish: <b>' + (mine.f ? ORD(mine.pl) + ' (' + fmtMs(mine.f) + ')' : Math.round(mine.d * 100) + '% of the course') + '</b></span><span>Race <b>' + mine.race + '</b></span><span>Questions <b>' + mine.academic + '</b> (' + (mine.c || 0) + ' right, ' + (mine.w || 0) + ' wrong' + (mine.v ? ', ' + mine.v + ' shown' : '') + ')</span><span>Strategy <b>' + mine.strategy + '</b></span><span>Explore <b>' + mine.explore + '</b></span><span>Round total <b>' + mine.total + '</b></span>' + (myRank ? '<span>Championship <b>' + ORD(myRank) + '</b></span>' : '') + '</div>' : '';
    let btns = '';
    if (R.mode === 'solo') btns = last ? '<button class="gk-btn primary big" data-a="final">🏆 Final results</button>' : '<button class="gk-btn primary big" data-a="next">Round ' + (round + 2) + ' ▶</button>';
    else if (R.mode === 'host') btns = last ? '<button class="gk-btn primary big" data-a="final">🏆 Show final results</button>' : '<button class="gk-btn primary big" data-a="next">▶ Start round ' + (round + 2) + '</button>';
    else btns = '<p class="sub">⏳ ' + (last ? 'Your teacher will show the final results.' : 'Your teacher will start round ' + (round + 2) + '.') + '</p>';
    const o = overlay(g, '<h1>Round ' + (round + 1) + ' results</h1><p class="sub">' + U.esc(g.cfg.stageTitle || '') + ' · points ×' + (cfgOf(g).multipliers[round] || 1) + '</p>' + me +
      '<div class="rush-cols"><div><h2>🏁 Round ' + (round + 1) + '</h2>' + rt + '</div><div><h2>🏆 Championship</h2>' + ct + '</div></div>' +
      '<p class="sub" style="margin-top:12px">🏁 race · 🧠 questions · 🎯 strategy (gadgets, shortcuts, teamwork) · 🔎 exploring</p><div class="rush-btns">' + btns + '</div>');
    const nx = o.querySelector('[data-a=next]'), fi = o.querySelector('[data-a=final]');
    if (nx) nx.onclick = () => { if (R.mode === 'host') hostStart(g, round + 1); else { overlay(g, null); g.loadLevel(round + 1); } };
    if (fi) fi.onclick = () => { if (R.mode === 'host') hostFinal(g); else showFinal(g, champRows(R.champ), 'me'); };
  }

  /** Final championship: podium, table, my numbers, highlights. */
  function showFinal(g, champ, meId) {
    const top = champ.slice(0, 3), me = champ.find(r => r.id === meId), myRank = champ.indexOf(me) + 1;
    const pod = '<div class="rush-podium">' + [1, 0, 2].map(i => top[i] ? '<div class="p' + (i + 1) + '"><b>' + ['🥇', '🥈', '🥉'][i] + '</b>' + U.esc(top[i].n) + '<br><b>' + top[i].t + '</b></div>' : '').join('') + '</div>';
    const rounds = Math.max(0, ...champ.map(r => Object.keys(r.rs).length));
    const ct = table(champ, meId, [{ h: '#', v: (r, i) => i + 1 }, { h: 'Player', v: r => U.esc(r.n) }].concat(Array.from({ length: rounds }, (_, i) => ({ h: 'R' + (i + 1), n: 1, v: r => (r.rs[i] == null ? '–' : r.rs[i]) })))
      .concat([{ h: 'Places', v: r => Object.keys(r.pl).sort().map(k => r.pl[k] ? ORD(r.pl[k]) : '–').join(' ') }, { h: 'Right', n: 1, v: r => r.c + '/' + (r.c + r.w) }, { h: 'Total', n: 1, v: r => '<b>' + r.t + '</b>' }]));
    const best = (f, txt, unit) => { const r = champ.slice().filter(x => !x.bot || R.mode === 'solo').sort((a, b) => f(b) - f(a))[0]; return r && f(r) > 0 ? '<div><b>' + txt + '</b>' + U.esc(r.n) + ' · ' + Math.round(f(r)) + ' ' + unit + '</div>' : ''; };
    const hl = '<div class="rush-hl">' + best(r => Object.values(r.pl).filter(p => p === 1).length, '⚡ Fastest racer', 'wins') + best(r => r.c, '🧠 Quiz master', 'right answers') +
      best(r => (r.c + r.w ? r.c / (r.c + r.w) * 100 : 0), '🎯 Sharpest', '% right') + best(r => r.h, '🥊 Gadget guru', 'hits') + best(r => r.x, '🔎 Explorer', 'explore points') + best(r => r.k, '🤝 Team player', 'teamwork') + '</div>';
    const mine = me ? '<div class="rush-mine"><span>Your rank <b>' + ORD(myRank) + ' / ' + champ.length + '</b></span><span>Total <b>' + me.t + '</b></span><span>Questions <b>' + me.c + '</b> right of ' + (me.c + me.w) + ' (' + (me.c + me.w ? Math.round(me.c / (me.c + me.w) * 100) : 0) + '%)</span><span>Gadget hits <b>' + me.h + '</b></span><span>Explore <b>' + me.x + '</b></span></div>' : '';
    const btns = R.mode === 'solo' ? '<button class="gk-btn primary big" data-a="again">⟲ Play again</button>' : R.mode === 'host' ? '<button class="gk-btn big" data-a="close">Close</button>' : '<p class="sub">🎉 Great racing!</p>';
    const o = overlay(g, '<h1>🏆 FINAL CHAMPIONSHIP RESULTS</h1><p class="sub">Cyber Rush · ' + champ.length + ' players · ' + rounds + ' rounds</p>' + pod + mine + '<h2>Highlights</h2>' + hl + '<h2>Championship</h2>' + ct + '<div class="rush-btns">' + btns + (g.cfg.ui.menuUrl ? '<a class="gk-btn big" href="' + U.esc(g.cfg.ui.menuUrl) + '">← ' + U.esc(g.cfg.ui.menuLabel || 'Menu') + '</a>' : '') + '</div>');
    const ag = o.querySelector('[data-a=again]'), cl = o.querySelector('[data-a=close]');
    if (ag) ag.onclick = () => { R.reset(); overlay(g, null); g.loadLevel(0); };
    if (cl) cl.onclick = () => overlay(g, null);
    g.audio.play('win');
  }

  // ===================== online client: follow the host =====================
  function follow(g) {
    if (R.unfollow) R.unfollow();
    const ref = g.online.ref('race'), fn = s => applyNode(s.val());
    ref.on('value', fn);
    const off = g.online.onEvent(ev => onEvent(ev));
    R.unfollow = () => { ref.off('value', fn); off(); };
  }
  function applyNode(n) {
    const g = GK.current;
    R.node = n;
    if (!g || !n || R.mode !== 'online') return;
    if (n.phase === 'final') { showFinalOnline(g); return; }
    if (n.round != null && n.round !== g.levelIndex && n.round < g.levelCount) { overlay(g, null); g.onlineSilent = false; g.loadLevel(n.round); return; }
    if (n.phase === 'results' && n.resultsFor === g.levelIndex) { if (g.state.race.phase !== 'over') enter(g, 'over', g.state.race.phase); else showOnlineResults(g); }
    if (n.phase === 'prep' && g.state.race.phase === 'over') { overlay(g, null); g.onlineSilent = false; g.loadLevel(g.levelIndex); }
  }
  function onEvent(ev) {
    const g = GK.current;
    if (!g || !g.state || !g.state.race) return;
    if (ev.k === 'gfx' && g.gadgetEffect) { const r = g.gadgetEffect(ev.d, ev.from, ev.d.n); if (r === 'hit' && g.reportHit) g.reportHit(ev.from, ev.d.g); }
    else if (ev.k === 'gres' && g.gadgetLanded) g.gadgetLanded(ev.d.g, ev.d.n);
    else if (ev.k === 'gobj' && g.gadgetObject) g.gadgetObject(ev.d);
  }
  function showOnlineResults(g) {
    const r = g.levelIndex;
    if (R.shownFor === r + ':' + (R.node && R.node.v)) return;
    R.shownFor = r + ':' + (R.node && R.node.v);
    info(g, '');
    Promise.all([g.online.ref('results/' + r).once('value'), g.online.ref('champ').once('value')]).then(([a, b]) => {
      if (GK.current !== g) return;
      const res = a.val() || {}, ch = b.val() || {};
      const rows = Object.keys(res).map(id => Object.assign({ id }, res[id])).sort((x, y) => y.total - x.total);
      showResults(g, rows, champRows(ch), g.online ? g.online.id : 'me', { max: 40 });
    });
  }
  function showFinalOnline(g) {
    if (R.finalShown) return;
    R.finalShown = true;
    g.online.ref('champ').once('value').then(s => showFinal(g, champRows(s.val() || {}), g.online ? g.online.id : 'me'));
  }

  // ===================== host (teacher PC) =====================
  function hostSetup(g) {
    // the host watches: no pause on blur, no mouse lock, a camera that follows the leaders
    g.pause = () => {};
    g.input.onClick = () => {};
    g.onlineSilent = true;
    g.ui.hud.classList.add('rush-hosthud');
    if (GK.Settings) GK.Settings.set('view', 'first');
    if (g.player) g.player.cfg = Object.assign({}, g.player.cfg, { gravity: 0 });
    if (!R.statsOn) {
      R.statsOn = true;
      g.online.ref('stats').on('child_added', s => { R.stats[s.key] = s.val(); });
      g.online.ref('stats').on('child_changed', s => { R.stats[s.key] = s.val(); });
      g.online.ref('champ').once('value').then(s => { R.champ = s.val() || {}; });
      g.online.ref('race').once('value').then(s => { if (s.val()) R.node = s.val(); });
    }
    drawHost(g, true);
  }
  function hostNode(g, patch) { R.node = Object.assign({}, R.node, patch, { v: ((R.node && R.node.v) || 0) + 1 }); return g.online.ref('race').set(R.node); }
  function hostStart(g, round) {
    const c = cfgOf(g), now = g.online.serverNow(), len = (R.roundTime || c.roundTime) * 1000;
    overlay(g, null);
    if (round !== g.levelIndex) g.loadLevel(round);
    g.online.ref('ev').remove();   // clear last round's gadget events
    hostNode(g, { round, phase: 'prep', prepEnd: now + c.prep * 1000, startAt: now + (c.prep + c.countdown + 0.5) * 1000, endAt: now + (c.prep + c.countdown + 0.5) * 1000 + len, len, n: g.levelCount, resultsFor: null });
    R.computed = null;
    drawHost(GK.current, true);
  }
  function hostEnd(g) { if (R.node && R.node.phase === 'prep') hostNode(g, { endAt: g.online.serverNow() }); else if (R.node) hostNode(g, { endAt: Math.min(R.node.endAt, g.online.serverNow()) }); }
  function hostResults(g) {
    const round = R.node.round, c = cfgOf(g), stats = {};
    for (const id in R.stats) { const s = R.stats[id]; if (s && s.r === round) stats[id] = s; }
    // anyone online who never reported still appears (with the progress their ghost reached)
    for (const p of g.online.players()) if (!stats[p.id] && !p.me) stats[p.id] = { n: p.name, d: 0, f: 0, a: 0, s: 0, x: 0 };
    const rows = scoreRound(c, stats, round), res = {};
    for (const r of rows) res[r.id] = { n: r.n, total: r.total, race: r.race, academic: r.academic, strategy: r.strategy, explore: r.explore, pl: r.pl || 0, d: r.d || 0, f: r.f || 0, c: r.c || 0, w: r.w || 0, v: r.v || 0, mult: r.mult };
    addChamp(R.champ, rows, round);
    R.computed = round; R.results[round] = rows;
    g.online.ref('results/' + round).set(res).then(() => g.online.ref('champ').set(R.champ)).then(() => hostNode(g, { phase: 'results', resultsFor: round }));
    showResults(g, rows, champRows(R.champ), null, { max: 40 });
  }
  function hostFinal(g) { hostNode(g, { phase: 'final' }); showFinal(g, champRows(R.champ), null); }
  function hostTick(g) {
    const n = R.node, now = g.online ? g.online.serverNow() : Date.now();
    if (n && n.round === g.levelIndex && n.phase === 'prep') {
      if (now >= n.endAt + 2500 && R.computed !== n.round && g.levelIndex === n.round) hostResults(g);
      // everyone finished: end the round early
      const on = g.online.players().filter(p => p.on && !p.me), done = on.filter(p => p.raw && p.raw.fin > 0 && p.raw.r === n.round);
      if (now > n.startAt + 5000 && now < n.endAt && on.length && done.length === on.length) hostNode(g, { endAt: now });
    }
    drawHost(g);
  }
  /** Projector camera: behind the race leader (or overview before the start). */
  function spectate(g, now) {
    const C = g.raceCourse, pl = g.player;
    if (!C || !pl) return;
    const list = g.online.players().filter(p => p.on && !p.me && p.pos).map(p => { const e = g.online.ghost(p.id); return { p, e, d: e ? C.project(e.pos, e.seg).d : 0 }; }).sort((a, b) => b.d - a.d);
    const lead = list.find(x => !(x.p.raw && x.p.raw.fin > 0 && x.p.raw.r === g.levelIndex)) || list[0];
    let tx, tz, ty, yaw;
    if (lead && lead.e) { const a = C.at(lead.d); yaw = Math.atan2(-a.dx, -a.dz); tx = lead.e.pos[0] - a.dx * 9; tz = lead.e.pos[2] - a.dz * 9; ty = lead.e.pos[1] + 3.5; }
    else { const a = C.at(10 + (now / 1000 % 60) * 2); yaw = Math.atan2(-a.dx, -a.dz); tx = a.x - a.dx * 10; tz = a.z - a.dz * 10; ty = 5; }
    const k = 0.08;
    pl.pos[0] += (tx - pl.pos[0]) * k; pl.pos[1] += (ty - pl.pos[1]) * k; pl.pos[2] += (tz - pl.pos[2]) * k; pl.vel = [0, 0, 0];
    let dy = yaw - pl.yaw; while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2;
    pl.yaw += dy * k; pl.pitch = -0.22;
  }
  function drawHost(g, force) {
    let box = g.root.querySelector('.rush-host');
    if (!box) { box = U.el('div', 'rush-host'); g.root.appendChild(box); box.onmousedown = e => e.stopPropagation(); force = true; }
    const n = R.node || {}, now = g.online.serverNow(), C = g.raceCourse, c = cfgOf(g);
    const players = g.online.players().filter(p => !p.me).sort((a, b) => a.name.localeCompare(b.name));
    let phase = 'lobby';
    if (n.round === g.levelIndex && n.prepEnd) phase = now < n.prepEnd ? 'prep' : now < n.startAt ? 'countdown' : now < n.endAt ? 'running' : n.phase === 'results' ? 'results' : 'scoring';
    if (n.phase === 'final') phase = 'final';
    // live board from the ghosts
    const live = players.filter(p => p.on && p.pos).map(p => { const e = g.online.ghost(p.id), pr = e && C ? C.project(e.pos, e.seg) : { d: 0 }; return { p, d: pr.d, fin: p.raw && p.raw.r === g.levelIndex ? p.raw.fin || 0 : 0 }; })
      .sort((a, b) => (a.fin && b.fin ? a.fin - b.fin : a.fin ? -1 : b.fin ? 1 : b.d - a.d));
    const key = [phase, n.round, Math.ceil(((phase === 'running' ? n.endAt : n.startAt || 0) - now) / 1000), players.map(p => p.name + p.on).join(), live.map(x => x.p.id + Math.round(x.d / 5) + x.fin).join()].join('|');
    if (!force && box._k === key) return;
    box._k = key;
    const url = location.href.split('?')[0].split('#')[0];
    const left = phase === 'prep' ? (n.prepEnd - now) / 1000 : phase === 'countdown' ? (n.startAt - now) / 1000 : phase === 'running' ? (n.endAt - now) / 1000 : 0;
    const timeSel = '<select data-a="len">' + c.timeChoices.map(s => '<option value="' + s + '"' + (s === (R.roundTime || c.roundTime) ? ' selected' : '') + '>' + (s / 60) + ' min rounds</option>').join('') + '</select>';
    const roundLabel = 'Round ' + (g.levelIndex + 1) + ' / ' + g.levelCount + ': ' + U.esc(g.cfg.stageTitle || '');
    let ctrl = '';
    if (phase === 'lobby') ctrl = '<button class="gk-btn primary big" data-a="start">▶ Start round ' + (g.levelIndex + 1) + '</button>' + timeSel;
    else if (phase === 'prep' || phase === 'countdown' || phase === 'running') ctrl = '<button class="gk-btn" data-a="end">⏹ End round now</button>';
    else if (phase === 'scoring') ctrl = '<button class="gk-btn primary" data-a="score">📊 Show round results</button>';
    else if (phase === 'results') ctrl = g.levelIndex + 1 < g.levelCount ? '<button class="gk-btn primary big" data-a="next">▶ Start round ' + (g.levelIndex + 2) + '</button>' + timeSel + '<button class="gk-btn" data-a="show">📊 Results again</button>' : '<button class="gk-btn primary big" data-a="final">🏆 Final results</button>';
    else if (phase === 'final') ctrl = '<button class="gk-btn" data-a="showfinal">🏆 Final results again</button><button class="gk-btn" data-a="close">🧹 Close the room (delete its data)</button>';
    box.innerHTML = '<div class="url">Students: open <b>' + U.esc(url) + '</b>, type a nickname, then this room code:</div><div class="code">' + U.esc(g.online.room) + '</div>' +
      '<div class="big">' + roundLabel + '</div>' + (left > 0 ? '<div class="big" style="color:#ffd166">' + { prep: 'Gadgets: ', countdown: 'Starting: ', running: '' }[phase] + fmt(left) + '</div>' : '') +
      '<div class="btns">' + ctrl + '</div>' +
      '<h3>Players (' + players.filter(p => p.on).length + ' online)</h3><div class="pl">' + (players.length ? players.map(p => '<span class="' + (p.on ? '' : 'off') + '">' + U.esc(p.name) + ' <button title="Remove from the room" data-kick="' + U.esc(p.id) + '">✕</button></span>').join('') : '<i>Nobody yet…</i>') + '</div>' +
      (phase === 'running' || phase === 'countdown' || phase === 'scoring' ? '<h3>Live race</h3><table>' + live.slice(0, 20).map((x, i) => '<tr><td>' + (i + 1) + '</td><td>' + U.esc(x.p.name) + '</td><td style="width:40%">' + (x.fin ? '🏁 ' + fmtMs(x.fin) : '<div class="bar"><i style="width:' + Math.round(U.clamp(x.d / (C ? C.finish.d : 1), 0, 1) * 100) + '%"></i></div>') + '</td></tr>').join('') + '</table>' : '') +
      '<p style="opacity:.7;font-size:12px;margin-top:12px">Free Firebase room · nicknames only · the room is removed when you leave. Keep this tab visible (it keeps the clock and works out the scores).</p>';
    const on = (sel, fn) => { const b = box.querySelector(sel); if (b) b.onclick = fn; };
    on('[data-a=start]', () => hostStart(g, g.levelIndex));
    on('[data-a=next]', () => hostStart(g, g.levelIndex + 1));
    on('[data-a=end]', () => hostEnd(g));
    on('[data-a=score]', () => hostResults(g));
    on('[data-a=show]', () => { if (R.results[g.levelIndex]) showResults(g, R.results[g.levelIndex], champRows(R.champ), null, { max: 40 }); });
    on('[data-a=final]', () => hostFinal(g));
    on('[data-a=showfinal]', () => showFinal(g, champRows(R.champ), null));
    on('[data-a=close]', () => { if (!confirm('Close room ' + g.online.room + '? Its results are deleted from the online database (write them down or take a photo first).')) return; g.online.clear().then(() => { try { sessionStorage.removeItem('gk.rush.hostRoom'); } catch (e) { /* storage off */ } GK.Online.leave(); location.href = location.href.split('?')[0]; }); });
    const sel = box.querySelector('[data-a=len]');
    if (sel) sel.onchange = () => { R.roundTime = Number(sel.value); };
    box.querySelectorAll('[data-kick]').forEach(b => { b.onclick = () => { if (confirm('Remove this player from the room?')) g.online.kick(b.getAttribute('data-kick')); }; });
  }

  // ===================== title screen: join / solo / host =====================
  const titleHook = (g, data) => {
    const s = data.screen, play = s.querySelector('[data-level]');
    if (!play || s.querySelector('.rush-join')) return;
    play.style.display = 'none';
    const online = GK.Online && GK.Online.available();
    let qRoom = (location.search.match(/[?&]room=([A-Za-z0-9-]+)/) || [])[1] || '';
    try { if (!qRoom) qRoom = sessionStorage.getItem('gk.rush.room') || ''; } catch (e) { /* storage off */ }
    const box = U.el('div', 'rush-join');
    // play with bots (no internet): how many, how good, and which world to start in (kept on this PC)
    const pref = GK.Settings.get('rushBots', { n: 7, skill: 'normal', round: 0 }), rounds = (g.cfg.content && g.cfg.content.rounds) || [];
    const opt = (list, cur) => list.map(([v, t]) => '<option value="' + v + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + U.esc(t) + '</option>').join('');
    // big buttons and pictures, very few words (students do not read long texts)
    box.innerHTML = '<button class="gk-btn primary big rush-playbtn" data-a="solo">🤖 PLAY ▶</button>' +
      '<div class="row rush-botset"><select data-a="bn" title="Bots">' + opt([[3, '🤖 3'], [5, '🤖 5'], [7, '🤖 7'], [11, '🤖 11'], [15, '🤖 15']], pref.n) + '</select>' +
      '<select data-a="bs" title="Bot level">' + opt([['easy', '😊 Easy'], ['normal', '🙂 Normal'], ['hard', '😈 Hard']], pref.skill) + '</select>' +
      '<select data-a="br" title="World">' + opt(Array.from({ length: g.levelCount }, (_, i) => [i, '🗺 ' + (i + 1) + ' ' + (rounds[i] ? rounds[i].name : '')]), pref.round) + '</select></div>' +
      (online ? '<div class="row rush-joinrow"><input class="gk-input" data-a="room" maxlength="16" placeholder="🌐 CODE" value="' + U.esc(qRoom.toUpperCase()) + '"><button class="gk-btn" data-a="join">JOIN ▶</button></div>' : '') +
      '<div class="st"></div>' +
      '<div class="rush-keys"><span><b>WASD</b>🏃</span><span><b>SPACE</b>⤴</span><span><b>SHIFT</b>⚡</span><span><b>🖱</b>👊🎁</span><span><b>E</b>❓</span></div>' +
      (online ? '<details><summary>👩‍🏫</summary><button class="gk-btn" data-a="host">Host a class race</button></details>' : '');
    const ctl = s.querySelector('.gk-controls');   // above the key list, so it is on screen without scrolling
    (ctl || play).parentNode.insertBefore(box, ctl || play);
    const st = box.querySelector('.st'), say = (t, ok) => { if (st) { st.textContent = t; st.className = 'st ' + (ok ? 'ok' : 'bad'); } };
    const nameOk = () => { const nb = data.nameBox; if (nb && !nb.value.trim()) { nb.focus(); nb.classList.add('need'); say('✏️ Name?'); return false; } if (nb) g.setPlayerName(nb.value.trim().slice(0, 16)); return true; };
    // start a fresh level 0 now that the mode is known (setup builds bots / host view for the mode)
    const go = (mode, level) => { R.mode = mode; R.reset(); g.audio.unlock(); g.ui.hideScreens(); g.loadLevel(level || 0); };
    box.querySelector('[data-a=solo]').onclick = () => {
      if (!nameOk()) return;
      const v = a => box.querySelector('[data-a=' + a + ']').value, p = { n: Number(v('bn')), skill: v('bs'), round: Number(v('br')) };
      GK.Settings.set('rushBots', p);
      R.botCount = p.n; R.botSkill = p.skill;
      GK.QuizDeck.reset((g.playerName || 'p') + Math.random());
      go('solo', p.round);
    };
    const jb = box.querySelector('[data-a=join]'), rb = box.querySelector('[data-a=room]');
    if (jb) {
      const join = () => {
        if (!nameOk()) return;
        jb.disabled = true; say('Connecting…', true);
        GK.Online.join({ room: rb.value, name: g.playerName, char: g.character }).then(S => {
          say('Joined room ' + S.room + '!', true);
          try { sessionStorage.setItem('gk.rush.room', S.room); } catch (e) { /* storage off */ }
          GK.QuizDeck.reset(S.id);
          go('online');
          follow(g);
        }).catch(e => { jb.disabled = false; say(e.message || String(e)); });
      };
      jb.onclick = join;
      rb.onkeydown = e => { if (e.key === 'Enter') join(); };
      // ?room=CODE&autojoin=Name joins by itself (a teacher's link for a test PC, and the live two-browser test)
      const auto = (location.search.match(/[?&]autojoin=([^&]+)/) || [])[1];
      if (auto && data.nameBox) setTimeout(() => { data.nameBox.value = decodeURIComponent(auto).slice(0, 16); join(); }, 300);
    }
    const hb = box.querySelector('[data-a=host]');
    if (hb) hb.onclick = () => {
      hb.disabled = true; say('Creating a room…', true);
      let prev = null; try { prev = sessionStorage.getItem('gk.rush.hostRoom'); } catch (e) { /* storage off */ }
      const p = prev && confirm('Continue hosting room ' + prev + '? (Cancel = a new room)') ? GK.Online.join({ room: prev, name: 'Teacher', host: true, watch: true }) : GK.Online.create({ name: 'Teacher', watch: true });
      p.then(S => {
        try { sessionStorage.setItem('gk.rush.hostRoom', S.room); } catch (e) { /* storage off */ }
        g.setPlayerName('Teacher'); go('host');
      }).catch(e => { hb.disabled = false; say(e.message || String(e)); });
    };
    if (/[?&]host\b/.test(location.search) && hb) { const d = box.querySelector('details'); if (d) d.open = true; }
  };
  GK.Race.tick = tick; GK.Race.courseOf = courseOf;
  GK.Race.scoreRound = scoreRound; GK.Race.addChamp = addChamp; GK.Race.champRows = champRows; GK.Race.roundPoints = roundPoints;
})();

</script>
<script>window.GAME.ui = window.GAME.ui || {}; window.GAME.ui.menuUrl = "START_HERE_Computer_Lab.html"; window.GAME.ui.menuLabel = "Lab home"; GK.start(window.GAME);</script>
