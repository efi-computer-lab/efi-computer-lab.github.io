<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Visual Foundation demo</title>
<style>
  :root { --panel: rgba(16, 24, 36, 0.78); --text: #f1f5f9; --accent: #4cc9f0; }
  html, body { margin: 0; height: 100%; background: #8ccaf5; font: 14px/1.4 system-ui, sans-serif; color: var(--text); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .ui { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  .ui h1 { font-size: 15px; margin: 0 8px 0 0; padding: 6px 10px; background: var(--panel); border-radius: 8px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tip { position: fixed; left: 16px; bottom: 16px; padding: 6px 10px; background: var(--panel); border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="ui">
  <h1>3D Visual Foundation</h1>
  <button data-preset="tropicalDay" class="on">☀️ Tropical day</button>
  <button data-preset="goldenHour">🌅 Golden hour</button>
  <button data-preset="storm">⛈️ Storm</button>
  <button id="low">🐢 Low graphics</button>
</div>
<div class="tip">Drag to look around · scroll or pinch to zoom · everything here comes from <code>src/</code> and <code>assets/</code></div>

<!-- The foundation: plain classic scripts, so this page also works when opened straight from the disk (file://). -->
<script src="../src/gk-core-math.js"></script>
<script src="../src/gk-geo.js"></script>
<script src="../assets/kenney-models.js"></script>
<script src="../src/stylized-nature.js"></script>
<script src="../src/stylized-characters.js"></script>
<script src="../src/gk-renderer.js"></script>
<script src="../src/lighting-presets.js"></script>
<script>
(function () {
  'use strict';
  const G = () => new GK.Geo(), M = GK.Models;
  const canvas = document.getElementById('view');
  const r = new GK.Renderer(canvas, { far: 220 });
  const place = (geo, model, look, x, y, z, yaw) => geo.add(G().add(M.shape(model, look || {}, 'demo').geo).rotY(yaw || 0).move(x, y, z));

  // ---- one merged mesh for all the still scenery (fast: one draw call) ----
  const world = G();
  world.plane(0, -0.04, 0, 900, 900, '#1c7ed6');                                  // the sea (flat blue near y = 0 = water)
  world.cyl(0, -1.2, 0, 17, 1.3, '#f3e0a8', { seg: 28, rTop: 15.5 });             // the beach
  world.blob(-2, -0.9, -2, 10, '#6aa84f', { seed: 2, rough: 0.08, seg: 16, rings: 8, squash: 0.12 });   // the grass
  world.blob(-6, 0.2, -7, 5.5, '#8a7f73', { seed: 9, rough: 0.25, seg: 9, rings: 6, flat: true, squash: 0.7 });   // a big rock
  world.blob(-6, 3.4, -7, 4.2, '#6aa84f', { seed: 10, rough: 0.12, seg: 10, rings: 5, squash: 0.25 });
  for (let i = 0; i < 9; i++) world.box(9 + i * 0.62, 0.15, 3, 0.5, 0.12, 2.2, i % 2 ? '#8b5a2b' : '#a0703c');   // a little pier
  for (const [x, z] of [[9, 2], [9, 4], [14, 2], [14, 4]]) world.cyl(x, -1, z, 0.12, 1.4, '#7a5636', { seg: 7 });
  const rnd = GK.util.rng(5);
  [[4, -6, 7], [-10, 3, 8], [7, 7, 6], [-3, 9, 6.5], [11, -3, 7.5]].forEach(([x, z, h], i) => place(world, 'palm', { h, lean: 0.12 + (i % 3) * 0.05 }, x, 0.1, z, rnd() * 6));
  [[-13, -8, 9], [3, -12, 8]].forEach(([x, z, h]) => place(world, 'bigTree', { h, color: '#2f9e44' }, x, 0.3, z));
  place(world, 'kenneyTree', { h: 6 }, -12, 0.2, -4);
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; place(world, 'bush', { lite: true, s: 1 + rnd() * 0.4, color: ['#2f7d32', '#37893a', '#3f9142'][i % 3], flower: i % 4 ? undefined : '#ff6b6b' }, Math.cos(a) * 9.5 - 2, 0.15, Math.sin(a) * 9.5 - 2); }
  for (let i = 0; i < 40; i++) place(world, 'grassTuft', { small: i % 3 === 0 }, (rnd() - 0.5) * 16 - 2, 0.12, (rnd() - 0.5) * 16 - 2, rnd() * 6);
  for (let i = 0; i < 6; i++) place(world, 'flowerPatch', { color: ['#ff6b6b', '#ffd43b', '#f783ac'][i % 3] }, (rnd() - 0.5) * 12 - 2, 0.12, (rnd() - 0.5) * 12 - 2);
  place(world, 'seaRock', { s: 1.6 }, 15, 0, -9); place(world, 'seaRock', { s: 1.1 }, -16, 0, 8, 2);
  place(world, 'cliffRock', { h: 2.2, color: '#8a7f73' }, 6, 0.1, -3);
  place(world, 'pebbles', {}, 3, 0.12, 10); place(world, 'fern', {}, -1, 0.15, 4);
  place(world, 'island', { r: 10 }, -70, 0, -90); place(world, 'island', { r: 7 }, 80, 0, -60, 1);
  const worldMesh = r.mesh(world);
  const hero = r.mesh(M.shape('hero', { skin: '#f1c27d', hair: '#6b3e26', hairStyle: 'spiky', shirt: '#9fc9ef', pants: '#34495e', shoes: '#7a5232', accent: '#ffd166', scarf: '#1c7ed6' }, 'demo').geo);
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2 + rnd(), d = 110 + rnd() * 30, k = 18 + rnd() * 10;
    clouds.push({ mesh: r.mesh(M.shape('skyCloud', { seed: i % 4 + 1 }, 'demo').geo), pos: [Math.cos(a) * d, 16 + rnd() * 14, Math.sin(a) * d], yaw: rnd() * 6, scale: [k * 1.6, k * 0.9, k], glow: 0.35 });
  }

  // ---- presets and quality ----
  let preset = 'tropicalDay', low = false;
  const applyEnv = () => { r.setEnv(GK.LightingPresets[preset]); r.setSkyProps(GK.LightingPresets[preset].cloudProps === 0 ? [] : clouds); };
  const applyQuality = () => r.setQuality(low ? { bloom: false, lights: 3, shadows: false, detail: false } : { bloom: true, lights: 8, shadows: true, detail: true });
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    preset = b.dataset.preset; applyEnv();
    document.querySelectorAll('[data-preset]').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('low').onclick = e => { low = !low; e.currentTarget.classList.toggle('on', low); applyQuality(); };
  applyEnv(); applyQuality();

  // ---- orbit camera ----
  let yaw = 0.6, pitch = 0.32, dist = 16, drag = null;
  canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.006; pitch = Math.max(0.05, Math.min(1.3, pitch + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); dist = Math.max(5, Math.min(60, dist * (e.deltaY > 0 ? 1.1 : 0.9))); }, { passive: false });

  const frame = t => {
    requestAnimationFrame(frame);
    if (!drag) yaw += 0.0007;
    const target = [1, 1.2, 1], eye = [target[0] + Math.sin(yaw) * Math.cos(pitch) * dist, target[1] + Math.sin(pitch) * dist, target[2] + Math.cos(yaw) * Math.cos(pitch) * dist];
    r.resize();
    r.setCamera(eye, GK.vec.sub(target, eye), 60);
    r.setShadowFocus(target);
    r.setLights([]);
    const bob = Math.sin(t / 400) * 0.02;
    r.render([{ mesh: worldMesh, pos: [0, 0, 0] }, { mesh: hero, pos: [1, 0.15 + bob, 1], yaw: yaw + Math.PI * 0.85 }]);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
