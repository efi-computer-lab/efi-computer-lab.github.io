      const push = game.anchored && game.anchored() ? [0, 0] : game.terrainPush;   // game.anchored(): another mechanic holds you in place
      if (push[0] || push[1]) GK.Physics.move(game.world.solids(), { pos: pl.pos, vel: [push[0], 0, push[1]], r: pl.r, h: pl.h, step: pl.step, grounded: false }, dt);
      if (game.state.knockT > 0) game.state.knockT -= dt;
      if (game.state.terrainAir > 0) game.state.terrainAir -= dt;
      pl.grip = game.state.knockT > 0 ? 0.08 : game.terrainGrip;
      if (game.state.terrainAir > 0 && !pl.grounded) pl.grip = 0.05;
      pl.gravityMul = game.terrainGrav;
      pl.jumpMul = game.terrainGrav < 1 ? 1.25 : 1;
      game.terrainPush = [0, 0]; game.terrainGrip = 1; game.terrainGrav = 1;
    },
  });
})();

</script>
<script>/* mechanics/traversal/traversal.js */
/* Game Kit · mechanics/traversal   (spatial game types; made for first-person-3d)
   Moving through nature: SWIMMING and CLIMBING. Works with any world; the island worlds pair it with grid `sink` +
   `water` cells (a lagoon: walk in, swim, climb out on a sandy slope) and `raise` cells (ledges to climb up to).
     { type: 'swim', size: [w, h, d] }    water you can swim in (pos = the middle of the bottom): slower, floaty, a
                                          bigger jump to climb out, and a STAMINA meter (config traversal.swimStamina
                                          seconds, default 20). It refills on land; empty = "too tired": back to the
                                          last checkpoint (no points lost).
     { type: 'climb', size: [w, h, d], model: 'vineWall' | 'ropeLadder' | null }   a vine wall / ladder: walk into it and
                                          hold W (forward) to climb up, S to climb down; let go to hang on. Put it against
                                          a ledge face, `h` a little higher than the ledge.
   Config: traversal: { swimStamina: 20, swimSpeed: 0.55, climbSpeed: 2.8 }
   Adds game.swimming, game.climbing; events traversal:swim {on}, traversal:climb {on}, traversal:tired.
   The HUD shows a small "🏊 Swimming" / "🧗 Climbing" meter. Works with powerups (speed) and terrain (gravity zones):
   list it AFTER them in `mechanics`, because it adjusts the player's speedMul / gravityMul last. */
(function () {
  'use strict';
  const U = GK.util, P = GK.Prefabs, Ph = GK.Physics;
  const G = () => new GK.Geo();

  GK.Models.add('vineWall', o => {   // hanging vines over a w × h face (front +z), thick enough to look climbable
    const w = o.w || 3, h = o.h || 3.5, g = G();
    for (let i = 0; i < 9; i++) {
      const x = -w / 2 + 0.2 + i * (w - 0.4) / 8;
      g.box(x, 0, 0, 0.1, h, 0.1, i % 2 ? '#2f9e44' : '#237a35');
      for (let y = 0.4; y < h; y += 0.7) g.box(x + (i % 2 ? 0.12 : -0.12), y, 0.05, 0.22, 0.08, 0.06, '#51cf66');
    }
    for (let y = 0.6; y < h; y += 1.1) g.box(0, y, -0.02, w, 0.06, 0.06, '#5a3d24');
    return g;
  });
  GK.Models.add('ropeLadder', o => {
    const h = o.h || 3.5, w = o.w || 0.9, g = G().box(-w / 2, 0, 0, 0.06, h, 0.06, '#c8a165').box(w / 2, 0, 0, 0.06, h, 0.06, '#c8a165');
    for (let y = 0.35; y < h; y += 0.4) g.box(0, y, 0, w, 0.07, 0.12, '#8b5a2b');
    return g;
  });

  const inside = (g, e, grow) => {
    const s = e.def.size, p = g.player.pos, c = Math.cos(e.yaw), n = Math.sin(e.yaw), dx = p[0] - e.pos[0], dz = p[2] - e.pos[2];
    const lx = dx * c - dz * n, lz = dx * n + dz * c, k = grow || 0;
    return Math.abs(lx) <= s[0] / 2 + k && Math.abs(lz) <= s[2] / 2 + k && p[1] >= e.pos[1] - 0.2 && p[1] <= e.pos[1] + s[1];
  };
  P.add('swim', { defaults: { model: null, solid: false, size: [8, 2, 8] } });
  P.add('climb', {
    defaults: { model: 'vineWall', solid: false, size: [3, 4, 0.6] },
    init(e) { if (e.model) e.setLook({ w: e.def.size[0], h: e.def.size[1] }); if (!e.label && e.def.hint !== false) e.label = '🧗'; },
  });

  GK.Mechanics.add('traversal', {
    configKeys: ['traversal'],
    setup(game) {
      const cfg = Object.assign({ swimStamina: 20, swimSpeed: 0.55, climbSpeed: 2.8 }, game.cfg.traversal);
      game.traversalCfg = cfg;
      game.swimming = false; game.climbing = false;
      game.state.stamina = cfg.swimStamina;
      const ui = game.ui;
      if (ui.trMeter) ui.trMeter.remove();
      ui.trMeter = U.el('div', 'gk-tr-meter');
      ui.trMeter.innerHTML = '<span class="gk-tr-label"></span><i><b></b></i>';
      ui.root.appendChild(ui.trMeter);
    },
    update(game, dt) {
      const pl = game.player, cfg = game.traversalCfg, S = game.state, inp = game.input;
      if (!pl || !game.world) return;
      let swim = null, climb = null;
      for (const e of game.world.entities) {
        if (!e.active || !e.enabled) continue;
        if (e.type === 'swim' && !swim && inside(game, e, 0)) swim = e;
        else if (e.type === 'climb' && !climb && inside(game, e, 0.35)) climb = e;
      }
      // ---- climbing ----
      const wasClimb = game.climbing;
      game.climbing = !!climb && !swim;
      if (game.climbing) {
        const up = inp.down('forward'), down = inp.down('back');
        pl.gravityMul = 0;
        pl.vel[1] = up ? cfg.climbSpeed : down ? -cfg.climbSpeed : Math.max(Math.min(pl.vel[1], 0) * 0.5, -0.6);
        pl.grounded = false;
        if (up && pl.pos[1] > climb.pos[1] + climb.def.size[1] - 0.9) pl.vel[1] = Math.max(pl.vel[1], 3.2);   // a last push over the edge
      } else if (wasClimb) pl.gravityMul = 1;
      if (game.climbing !== wasClimb) game.emit('traversal:climb', { on: game.climbing, id: climb ? climb.id : null });
      // ---- swimming ----
      const wasSwim = game.swimming;
      game.swimming = !!swim;
      const powerSpeed = game.hasPower && game.hasPower('speed') ? 1.6 : 1;
      if (game.swimming) {
        pl.speedMul = powerSpeed * cfg.swimSpeed;
        pl.gravityMul = Math.min(pl.gravityMul == null ? 1 : pl.gravityMul, 0.45);
        pl.jumpMul = 1.15;
        pl.bob = Math.sin(S.time * 2.4) * 0.06;
        S.stamina = Math.max(0, S.stamina - dt);
        if (!wasSwim) { game.audio.play('jump'); game.ui.toast('🏊 Swimming! Watch your stamina bar.', 'hint'); }
        if (S.stamina <= 0) {
          S.stamina = cfg.swimStamina;
          game.ui.toast('😮‍💨 Too tired to swim! Back to the last checkpoint. Rest on land to fill the bar.', 'bad');
          game.audio.play('hurt');
          game.emit('traversal:tired', {});
          if (game.respawn) game.respawn();
          game.swimming = false;
          pl.speedMul = powerSpeed; pl.jumpMul = 1; pl.gravityMul = 1;   // back to normal on land
        }
      } else {
        if (wasSwim) { pl.speedMul = powerSpeed; pl.jumpMul = 1; if (pl.gravityMul < 1 && !game.climbing) pl.gravityMul = 1; }
        S.stamina = Math.min(cfg.swimStamina, S.stamina + dt * 4);
      }
      if (game.swimming !== wasSwim) game.emit('traversal:swim', { on: game.swimming });
      // ---- meter ----
      const m = game.ui.trMeter, show = game.swimming || game.climbing || S.stamina < cfg.swimStamina;
      if (m) {
        m.classList.toggle('show', show && S.mode === 'playing');
        if (show) {
          m.querySelector('.gk-tr-label').textContent = game.climbing ? '🧗 Climbing · hold W' : game.swimming ? '🏊 Swimming' : '💨 Resting';
          const k = S.stamina / cfg.swimStamina;
          const b = m.querySelector('b');
          b.style.width = Math.round(k * 100) + '%';
          b.style.background = k < 0.3 ? '#ff6b6b' : k < 0.6 ? '#ffd166' : '#4cc9f0';
        }
      }
    },
    snapshot(game, out) { out.stamina = game.state.stamina; },
  });
})();

</script>
<script>/* mechanics/music/music.js */
/* Game Kit · mechanics/music   (any game type)
   Background music made live with WebAudio (no files, works offline): bass, chord arpeggios, a soft pad and drums,
   looping a 4-chord progression. A game (or each level) picks the style:
     music: { bpm: 124, root: 110, mode: 'minor' | 'major', prog: [0, 5, 3, 4] (scale degrees), wave: 'sawtooth',
              arpWave: 'square', drums: true, volume: 0.1 }
   game.musicLevel() (optional, from another mechanic) gives 0..1: 0 = silent, under 0.6 = calm (no drums), 1 = full.
   It stops on the title / end screens and follows the game's Sound on/off. */
(function () {
  'use strict';
  const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11] };
  const S = { ctx: null, out: null, noise: null, step: 0, next: 0, timer: null, cfg: null, game: null };

  const hz = (root, semis) => root * Math.pow(2, semis / 12);
  function degree(cfg, d) { const sc = SCALES[cfg.mode] || SCALES.minor, o = Math.floor(d / 7); return sc[((d % 7) + 7) % 7] + 12 * o; }
  function tone(t, f, dur, type, vol, attack) {
    const o = S.ctx.createOscillator(), g = S.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(S.out); o.start(t); o.stop(t + dur + 0.05);
  }
  function kick(t) {
    const o = S.ctx.createOscillator(), g = S.ctx.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(S.out); o.start(t); o.stop(t + 0.25);
  }
  function hiss(t, dur, vol, freq, type) {
    const src = S.ctx.createBufferSource(), f = S.ctx.createBiquadFilter(), g = S.ctx.createGain();
    src.buffer = S.noise; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(S.out); src.start(t); src.stop(t + dur + 0.02);
  }
  /** Schedule one 16th-note step of the loop (16 steps a bar, one chord a bar, 4 bars). */
  function play(step, t, level) {
    const c = S.cfg, s16 = step % 16, bar = Math.floor(step / 16) % c.prog.length, deg = c.prog[bar], d16 = 60 / c.bpm / 4;
    const chord = [0, 2, 4].map(k => degree(c, deg + k));
    if (s16 % 2 === 0 && [0, 1, 1, 0, 1, 1, 0, 1][s16 / 2]) tone(t, hz(c.root / 2, chord[0]), d16 * 1.8, c.wave, 0.22);   // bass
    const arp = [0, 1, 2, 1, 0, 2, 1, 2][s16 % 8];
    tone(t, hz(c.root * 2, chord[arp] + (s16 >= 8 ? 12 : 0)), d16 * 0.9, c.arpWave, 0.05);                                // arpeggio
    if (s16 === 0) for (const n of chord) tone(t, hz(c.root, n), d16 * 15, 'triangle', 0.035, 0.3);                      // pad
    if (level >= 0.6 && c.drums) {
      if (s16 % 4 === 0) kick(t);
      if (s16 === 4 || s16 === 12) hiss(t, 0.16, 0.35, 1800, 'bandpass');
      if (s16 % 2 === 1) hiss(t, 0.04, 0.12, 8000, 'highpass');
    }
  }
  function tick() {
    const g = GK.current;
    if (!g || !g.audio || !g.audio.ctx || !S.cfg) return;
    if (S.ctx !== g.audio.ctx) {   // first time (after the Play click unlocked the sound)
      S.ctx = g.audio.ctx;
      S.out = S.ctx.createGain(); S.out.connect(S.ctx.destination);
      S.noise = S.ctx.createBuffer(1, S.ctx.sampleRate, S.ctx.sampleRate);
      const d = S.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      S.next = S.ctx.currentTime + 0.1;
    }
    const mode = g.state && g.state.mode, on = mode === 'playing' || mode === 'modal' || mode === 'paused';
    let level = on ? (g.musicLevel ? g.musicLevel() : 1) : 0;
    if (mode === 'paused') level = Math.min(level, 0.4);
    const vol = g.audio.muted || level <= 0 ? 0 : (S.cfg.volume == null ? 0.1 : S.cfg.volume) * (level >= 0.6 ? 1 : 0.6);
    S.out.gain.setTargetAtTime(vol, S.ctx.currentTime, 0.3);
    const d16 = 60 / S.cfg.bpm / 4;
    if (S.next < S.ctx.currentTime) S.next = S.ctx.currentTime + 0.05;
    while (S.next < S.ctx.currentTime + 0.25) {
      if (vol > 0) play(S.step, S.next, level);
      S.step++; S.next += d16;
    }
  }

  GK.Music = S;
  GK.Mechanics.add('music', {
    configKeys: ['music'],
    setup(game) {
      const m = game.cfg.music || {};
      const cfg = Object.assign({ bpm: 120, root: 110, mode: 'minor', prog: [0, 5, 3, 4], wave: 'sawtooth', arpWave: 'square', drums: true, volume: 0.1 }, m);
      if (JSON.stringify(cfg) !== JSON.stringify(S.cfg)) { S.cfg = cfg; S.step = 0; }
      if (!S.timer) S.timer = setInterval(() => { try { tick(); } catch (e) { /* sound is optional */ } }, 60);
    },
  });
})();

</script>
<script>/* island.js */
/* Island Escape — the game's own script (loaded through GAME.scripts, before the game starts):
   · a boat-materials counter ("🛶 Boat materials 4/9") each time a material is added
   · mastery: per challenge, wrong tries, hints and shown answers (state.vars.mastery, so it is saved with the game)
   · the launch: after "Launch" on the finished boat, the boat sails out with the player on board towards the rescue
     ship (about 9 s), then the flag `escaped` completes the last mission and the game is won
   · a storm in act 3 ("peak"): lightning flashes the screen white now and then, with thunder
   · the end screen's mission table (hooks.endHtml). */
(function () {
  const C = window.GAME_CONTENT, esc = t => GK.util.esc(t);   // GK is used only once the game runs (this file may load before the kit)
  const MATERIALS = ['planks', 'rope', 'cutter', 'bamboo', 'cloth', 'fasteners', 'strongRope', 'rudder', 'compass'];
  const MISSIONS = [['m1', 'The Shipwreck'], ['m2', 'The Fallen Trees'], ['m3', 'The Jungle Trail'], ['m4', 'The Broken Crossing'], ['m5', 'The Lost Explorer\'s Pack'],
    ['m6', 'The Cave of Clues'], ['m7', 'The Dangerous Message'], ['m8', 'The Waterfall Generator'], ['m9', 'Signal Hill'], ['m10', 'Build the Boat']];
  const LAUNCH_TIME = 9;

  const mastery = (g, id) => {
    const m = g.state.vars.mastery = g.state.vars.mastery || {};
    return (m[id] = m[id] || { wrong: 0, hints: 0, answer: false, done: false });
  };

  const hooks = window.GAME.hooks = window.GAME.hooks || {};
  hooks.setup = g => {
    g.state.vars.mastery = {};
    g.on('puzzle:wrong', e => { mastery(g, e.id).wrong++; });
    g.on('puzzle:hint', e => { mastery(g, e.id).hints++; });
    g.on('puzzle:revealed', e => { mastery(g, e.id).answer = true; });
    g.on('puzzle:solved', e => { mastery(g, e.id).done = true; });
    g.on('item:added', e => {
      if (MATERIALS.indexOf(e.item) < 0) return;
      const n = MATERIALS.filter(i => g.hasItem(i)).length;
      g.ui.toast('🛶 Boat materials: ' + n + ' / ' + MATERIALS.length, 'hint');
    });
  };

  // ----- the storm: a white flash and thunder every 9-20 s in act 3 -----
  let flashEl = null, nextFlash = 6;
  const storm = (g, dt) => {
    if (g.stageId !== 'peak' || g.state.flags.escaped) return;
    if (!flashEl || !flashEl.isConnected) { flashEl = document.createElement('div'); flashEl.className = 'ie-lightning'; flashEl.style.cssText = 'position:absolute;inset:0;background:#f1f6ff;opacity:0;pointer-events:none;transition:opacity .5s;z-index:2'; g.ui.root.appendChild(flashEl); }
    nextFlash -= dt;
    if (nextFlash > 0) return;
    nextFlash = 9 + ((g.state.time * 7.3) % 11);
    flashEl.style.transition = 'none'; flashEl.style.opacity = '0.55';
    setTimeout(() => { flashEl.style.transition = 'opacity .6s'; flashEl.style.opacity = '0'; }, 70);
    setTimeout(() => g.audio.play('boom'), 600);
  };

  // ----- the launch: ride the boat out to the rescue ship -----
  hooks.update = (g, dt) => {
    storm(g, dt);
    const f = g.state.flags;
    if (!f.launching || f.escaped) return;
    const v = g.state.vars, boat = g.world.get('boat'), ship = g.world.get('ship'), route = g.world.routes.launch;
    if (!boat || !route) { f.escaped = true; return; }
    if (v.launchT == null) {
      v.launchT = 0;
      g.player.yaw = -Math.PI / 2; g.player.pitch = 0;   // look out to sea (east)
      if (ship) ship.show();
    }
    const t0 = v.launchT;
    v.launchT += dt;
    const k = Math.min(1, v.launchT / LAUNCH_TIME), e = k * k * (3 - 2 * k);   // smooth start and stop
    const a = route[0], b = route[route.length - 1];
    boat.pos = [a[0] + (b[0] - a[0]) * e, -0.25 + Math.sin(v.launchT * 2.2) * 0.06, a[2] + (b[2] - a[2]) * e];
    g.player.pos[0] = boat.pos[0] - 0.6; g.player.pos[1] = boat.pos[1] + 0.68; g.player.pos[2] = boat.pos[2];
    g.player.vel = [0, 0, 0];
    if (ship && ship.home == null) ship.home = ship.pos.slice();
    if (ship) ship.pos = [ship.home[0] - 10 * e, 0, ship.home[2]];
    if (t0 < 1.5 && v.launchT >= 1.5) g.ui.toast(C.messages.shipTurns, 'good');
    if (t0 < 5 && v.launchT >= 5) { g.ui.toast(C.messages.horn, 'good'); g.audio.play('objective'); }
    if (k >= 1) { f.escaped = true; g.emit('island:escaped', {}); if (g.missions) g.missions.check(); }
  };

  // ----- end screen: how each mission went -----
  hooks.endHtml = g => {
    const m = g.state.vars.mastery || {};
    let alone = 0;
    const rows = MISSIONS.map(([id, name], i) => {
      const r = m[id] || {};
      const icon = !r.done ? '—' : r.answer ? '🔑 answer shown' : r.hints ? '💡 with a hint' : '⭐ on my own';
      if (r.done && !r.answer) alone++;
      return '<tr><td>' + (i + 1) + '. ' + esc(name) + '</td><td>' + icon + '</td><td>' + (r.wrong || 0) + '</td></tr>';
    }).join('');
    const found = g.state.collected ? g.state.collected.supplies || 0 : 0;
    return '<p><b>🧠 Mastery: ' + alone + ' / ' + MISSIONS.length + ' challenges solved without seeing the answer</b> · 🎒 hidden supplies ' + found + ' / 5' +
      (g.state.solved && g.state.solved.bonus ? ' · 📖 logbook ✓' : '') + ' · ' + esc(g.difficulty === 'g7' ? 'Grade 7' : 'Grade 6') + '</p>' +
      '<table><tr><th>Mission</th><th>Result</th><th>Wrong tries</th></tr>' + rows + '</table>';
  };
})();

</script>
