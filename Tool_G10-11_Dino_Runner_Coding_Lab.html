/* ===== LAB BASE START ===== */
/* Computer Lab shared design system. Identical in every tool so each folder works on its own. */
:root {
  --ink: #172033;
  --ink-2: #3d4863;
  --muted: #5d6883;
  --bg: #f2f4f9;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --line: #dde2ec;
  --line-strong: #c3cad9;
  --good: #146c43;
  --good-soft: #e2f4ea;
  --bad: #b42318;
  --bad-soft: #fdecea;
  --warn: #8a5100;
  --warn-soft: #fff3d6;
  --focus: #f59e0b;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(23, 32, 51, .06), 0 4px 16px rgba(23, 32, 51, .06);
  --shadow-lg: 0 16px 48px rgba(23, 32, 51, .22);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", "Lucida Console", "Courier New", monospace;
  --accent: #0b7a6c;
  --accent-strong: #0b7a6c;
  --accent-dark: #075a50;
  --accent-soft: #e0f3f0;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  min-height: 100vh;
}
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; color: var(--ink); }
h1 { font-size: 2rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .8em; }
a { color: var(--accent-dark); }
img, svg { max-width: 100%; }
code, kbd, pre { font-family: var(--mono); }

:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }

.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 1000;
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none;
}
.skip-link:focus { top: 8px; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(23, 32, 51, .02);
}
.app-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.app-logo {
  flex: none; width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--accent-strong); color: #fff;
}
.app-logo svg { width: 28px; height: 28px; }
.app-title { font-size: 1.2rem; font-weight: 700; margin: 0; white-space: nowrap; }
.app-sub { font-size: .82rem; color: var(--muted); margin: 0; white-space: nowrap; }
.app-header .spacer { flex: 1; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 9px 18px;
  font: inherit; font-weight: 600; font-size: .95rem; line-height: 1.2;
  color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm);
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background-color .15s, border-color .15s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-danger { background: var(--surface); border-color: #e3a29b; color: var(--bad); }
.btn-danger:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-danger-solid:hover { background: #8f1b12; border-color: #8f1b12; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--accent-soft); border-color: transparent; }
.btn-lg { min-height: 54px; padding: 12px 26px; font-size: 1.08rem; border-radius: 12px; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- Cards, chips, notices ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}
.card-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-dark); margin: 0 0 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: .8rem; font-weight: 600;
  background: var(--accent-soft); color: var(--accent-dark);
  white-space: nowrap;
}
.chip-neutral { background: #e8ebf2; color: var(--ink-2); }
.chip-good { background: var(--good-soft); color: var(--good); }
.chip-bad { background: var(--bad-soft); color: var(--bad); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }

.notice {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--line);
}
.notice-icon { flex: none; font-weight: 800; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; color: #fff; background: var(--muted); }
.notice-good { background: var(--good-soft); border-color: #a9d9bf; }
.notice-good .notice-icon { background: var(--good); }
.notice-bad { background: var(--bad-soft); border-color: #f0b3ac; }
.notice-bad .notice-icon { background: var(--bad); }
.notice-warn { background: var(--warn-soft); border-color: #ecc77a; }
.notice-warn .notice-icon { background: var(--warn); }
.notice-info { background: var(--accent-soft); border-color: transparent; }
.notice-info .notice-icon { background: var(--accent-strong); }

.progress-bar { height: 12px; background: #e3e7f0; border-radius: 999px; overflow: hidden; }
.progress-bar > span { display: block; height: 100%; background: var(--accent-strong); border-radius: 999px; transition: width .3s; }

/* ---------- Forms ---------- */
label { font-weight: 600; }
input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select, textarea {
  font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line-strong); border-radius: 8px;
  padding: 8px 10px; min-height: 42px;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--accent-strong); }
input[type="range"] { accent-color: var(--accent-strong); }

/* ---------- Layout helpers ---------- */
.screen { animation: lab-fade .2s ease-out; }
@keyframes lab-fade { from { opacity: 0; } to { opacity: 1; } }
.container { max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.stack > * + * { margin-top: 14px; }
.muted { color: var(--muted); }
.center { text-align: center; }
.hero {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 32px; box-shadow: var(--shadow);
}
.hero h1 { font-size: 2.3rem; }
.hero-art svg { width: 100%; height: auto; display: block; }
.hero-lead { font-size: 1.12rem; color: var(--ink-2); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li { position: relative; padding-left: 30px; margin: 6px 0; }
.checklist li::before {
  content: "\2713"; position: absolute; left: 0; top: 1px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-dark);
  font-size: .75rem; font-weight: 800; display: grid; place-items: center;
}
.table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.table th, .table td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table th { background: var(--surface-2); font-weight: 700; color: var(--ink-2); }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(15, 22, 38, .55);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: lab-fade .15s ease-out;
}
.modal {
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
  width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto;
  padding: 26px 28px 22px;
}
.modal.modal-wide { width: min(820px, 100%); }
.modal h2 { margin-bottom: 12px; }
.modal-body { color: var(--ink-2); }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 22px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 600;
  transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 12px 20px; border-radius: 12px; box-shadow: var(--shadow-lg);
  font-weight: 600; max-width: calc(100% - 40px);
}

.no-storage-note { font-size: .85rem; color: var(--warn); }

/* ---------- Fun layer: motion and game feel ---------- */
.app-header::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
  background: linear-gradient(90deg, var(--accent-strong), #f5b700, var(--accent), var(--accent-strong));
  background-size: 300% 100%; animation: lab-sheen 9s linear infinite;
}
@keyframes lab-sheen { to { background-position: 300% 0; } }

.btn { transition: background-color .15s, border-color .15s, box-shadow .15s, transform .12s; }
.btn:hover:not([disabled]) { transform: translateY(-1px); }
.btn:active:not([disabled]) { transform: translateY(1px) scale(.98); }
.btn-primary { box-shadow: 0 3px 0 var(--accent-dark), 0 6px 14px rgba(23, 32, 51, .14); }
.btn-primary:hover:not([disabled]) { box-shadow: 0 4px 0 var(--accent-dark), 0 8px 18px rgba(23, 32, 51, .18); }
.btn-primary:active:not([disabled]) { box-shadow: 0 1px 0 var(--accent-dark); transform: translateY(2px); }
.btn-lg.btn-primary { box-shadow: 0 4px 0 var(--accent-dark), 0 8px 18px rgba(23, 32, 51, .16); }

.screen { animation: lab-enter .38s cubic-bezier(.2, .7, .3, 1); }
@keyframes lab-enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.modal { animation: lab-pop .32s cubic-bezier(.2, .9, .3, 1.25); }
@keyframes lab-pop { from { opacity: 0; transform: scale(.88) translateY(10px); } to { opacity: 1; transform: none; } }
.toast { animation: lab-toast .3s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes lab-toast { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }

.hero { position: relative; overflow: hidden; }
.hero > * { position: relative; }
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; pointer-events: none;
  background: var(--accent-soft); opacity: .8;
}
.hero::before { width: 340px; height: 340px; right: -90px; top: -120px; animation: lab-drift 14s ease-in-out infinite alternate; }
.hero::after { width: 200px; height: 200px; left: 38%; bottom: -120px; animation: lab-drift 11s ease-in-out infinite alternate-reverse; }
@keyframes lab-drift { to { transform: translate(-40px, 30px) scale(1.12); } }
.hero-art svg { animation: lab-float 5.5s ease-in-out infinite; transform-origin: center; }
@keyframes lab-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-1deg); } }
@keyframes lab-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .55); } 70% { box-shadow: 0 0 0 12px rgba(245, 158, 11, 0); } }
.pulse { animation: lab-pulse 2s ease-out infinite; }

#fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 900; overflow: hidden; }
.fx-bit { position: fixed; display: block; border-radius: 2px; will-change: transform, opacity; }

/* Picture tiles and icons */
.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -.22em; }
.pic-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; }
.pic-tile {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  padding: 16px 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); transition: transform .18s;
}
.pic-tile:hover { transform: translateY(-3px) rotate(-1deg); }
.pic-badge {
  width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
  background: var(--tile-bg, var(--accent-soft)); color: var(--tile-ink, var(--accent-dark));
}
.pic-badge .ic { width: 36px; height: 36px; }
.pic-tile:nth-child(5n+2) { --tile-bg: #fff1d6; --tile-ink: #8a5100; }
.pic-tile:nth-child(5n+3) { --tile-bg: #e7efff; --tile-ink: #1740a8; }
.pic-tile:nth-child(5n+4) { --tile-bg: #fde8f1; --tile-ink: #8f1146; }
.pic-tile:nth-child(5n+5) { --tile-bg: #e2f4ea; --tile-ink: #146c43; }
.pic-cap { font-weight: 700; font-size: .95rem; line-height: 1.2; }
.pic-num {
  position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; font-size: .78rem; font-weight: 800; color: #fff; background: var(--accent-strong);
}
.pic-title { font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 22px 0 10px; }
.tut-pic { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 14px; }
.tut-pic .pic-tile { min-width: 110px; box-shadow: none; }
.tut-line { text-align: center; font-size: 1.05rem; margin: 0; }

/* Breadcrumbs */
.crumbs { background: var(--surface); border-bottom: 1px solid var(--line); }
.crumbs ol { list-style: none; margin: 0 auto; padding: 6px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: .88rem; }
.crumbs li { display: inline-flex; align-items: center; }
.crumbs li + li::before { content: "›"; color: var(--muted); margin: 0 8px; font-weight: 700; }
.crumbs a, .crumbs button {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 3px 10px; border-radius: 999px;
  font: inherit; font-weight: 600; color: var(--accent-dark); background: transparent; border: 0; cursor: pointer; text-decoration: none;
}
.crumbs a:hover, .crumbs button:hover { background: var(--accent-soft); }
.crumbs a svg { width: 16px; height: 16px; }
.crumbs [aria-current="page"] { font-weight: 800; color: var(--ink); padding: 3px 10px; background: var(--surface-2); border-radius: 999px; }
.btn-sound[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-strong); color: var(--accent-dark); }
.btn-save { border-color: var(--good); color: var(--good); }
.btn-save:hover { background: var(--good-soft); border-color: var(--good); }
.btn-reset { color: var(--bad); border-color: #e3a29b; }
.btn-reset:hover { background: var(--bad-soft); border-color: var(--bad); }
.crumbs { display: flex; align-items: center; flex-wrap: wrap; }
.crumbs ol { flex: 1; margin: 0; }
.save-status { padding: 4px 24px; font-size: .82rem; font-weight: 600; color: var(--good); white-space: nowrap; }
.save-status:not(:empty)::before { content: "\2713  "; }
@media (max-width: 700px) { .save-status { padding: 2px 12px 6px; } }

/* ---------- Guided tutorial ---------- */
.coach {
  position: fixed; left: 20px; bottom: 20px; z-index: 560; width: min(340px, calc(100vw - 32px));
  background: var(--surface); border: 2px solid var(--accent-strong); border-radius: 16px;
  box-shadow: var(--shadow-lg); padding: 14px 16px 12px;
  animation: lab-pop .3s cubic-bezier(.2, .9, .3, 1.25);
}
.coach-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.coach-name { font-weight: 800; color: var(--accent-dark); font-size: .95rem; }
.coach-step { font-size: .78rem; font-weight: 700; color: var(--muted); margin-left: auto; white-space: nowrap; }
.coach-x { font: inherit; font-size: 1.2rem; line-height: 1; width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; background: var(--surface-2); color: var(--ink-2); }
.coach-x:hover { background: var(--bad-soft); color: var(--bad); }
.coach-bar { height: 8px; border-radius: 999px; background: #e3e7f0; overflow: hidden; margin-bottom: 10px; }
.coach-bar span { display: block; height: 100%; background: var(--accent-strong); border-radius: 999px; transition: width .3s; }
.coach-pics:not(:empty) { margin-bottom: 10px; }
.coach-pics .pic-row { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.coach-pics .pic-tile { padding: 10px 6px 8px; box-shadow: none; }
.coach-pics .pic-badge { width: 42px; height: 42px; border-radius: 12px; }
.coach-pics .pic-badge .ic { width: 24px; height: 24px; }
.coach-pics .pic-cap { font-size: .78rem; }
.coach-text { margin: 0 0 12px; font-size: 1rem; line-height: 1.45; color: var(--ink); }
.coach-text code, .coach-text strong { font-weight: 800; }
.coach-actions { display: flex; gap: 8px; justify-content: flex-end; }
.coach.is-done { border-color: var(--good); }
.coach.is-done .coach-text::after { content: "  \2713 done"; color: var(--good); font-weight: 800; }
.coach.coach-right { left: auto; right: 20px; }
@media (max-width: 700px) { .coach, .coach.coach-right { left: 8px; right: 8px; bottom: 8px; width: auto; } }

.coach-halo {
  position: relative; z-index: 1;
  outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 10px;
  animation: coach-ring 1.6s ease-out infinite;
}
@keyframes coach-ring {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .55); }
  60% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 700px) {
  html { font-size: 16px; }
  .app-header { padding: 8px 12px; flex-wrap: wrap; }
  .app-sub { display: none; }
  .container { padding: 18px 12px 40px; }
}
@media print {
  .app-header, .crumbs, #fx-layer, .no-print, .modal-backdrop, .toast, .skip-link, .coach { display: none !important; }
  .hero::before, .hero::after { display: none; }
  body { background: #fff; }
  .card { box-shadow: none; border-color: #bbb; }
}

/* ================= Dino Runner Coding Lab ================= */
:root {
  --accent: #2e7d4f;
  --accent-strong: #2e7d4f;
  --accent-dark: #1f5c39;
  --accent-soft: #e3f3e8;
  --code-bg: #1d1f2b;
  --code-line: #262938;
  --code-ink: #e4e6f0;
  --slot: #ffd166;
}
.lab { display: grid; grid-template-columns: 300px minmax(0, .9fr) minmax(0, 1.45fr); gap: 14px; max-width: 1760px; margin: 0 auto; padding: 12px 16px 28px; align-items: start; }
@media (max-width: 1180px) { .lab { grid-template-columns: 1fr; } }
.lab > * { min-width: 0; }

/* ---------- Mission column ---------- */
.stepper { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.step { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); font: inherit; font-weight: 800; font-size: .85rem; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; padding: 0; }
.step.done { background: var(--good); border-color: var(--good); color: #fff; }
.step[aria-current="step"] { box-shadow: 0 0 0 3px var(--slot); border-color: var(--accent-dark); }
.step:disabled { opacity: .45; cursor: not-allowed; }
.cycle { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 0 10px; font-size: .62rem; font-weight: 800; letter-spacing: 0; }
.cycle span { padding: 3px 5px; border-radius: 6px; background: #eceef4; color: var(--muted); }
.cycle span.on { background: var(--accent-strong); color: #fff; }
.mission-card { padding: 16px; }
.mission-card h2 { font-size: 1.3rem; margin: 2px 0 6px; }
.mission-card .explain { color: var(--ink-2); margin: 0 0 10px; }

<script>
'use strict';
/* ===== LAB KIT START ===== */
/* Computer Lab shared helpers. Identical in every tool so each folder works on its own. */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}

/* Progress is kept only in this browser on this computer. Nothing is ever sent anywhere. */
const store = {
  available: (() => {
    try {
      const k = '__lab_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })(),
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  /* locked stops any last-second writes (for example on page unload) after a reset or a file load. */
  locked: false,
  onWrite: null,
  set(key, value) {
    if (store.locked) return false;
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      if (typeof store.onWrite === 'function') store.onWrite(key);
      return true;
    } catch (e) { return false; }
  },
  remove(key) {
    try { window.localStorage.removeItem(key); } catch (e) { /* storage unavailable */ }
  }
};

const Modal = (() => {
  let root = null;
  let returnFocus = null;
  let current = null;

  function close() {
    if (!root) return;
    const opts = current;
    root.innerHTML = '';
    current = null;
    document.removeEventListener('keydown', onKey, true);
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
    if (opts && typeof opts.onClose === 'function') opts.onClose();
  }

  function onKey(e) {
    if (!current) return;
    if (e.key === 'Escape' && current.dismissible !== false) {
      e.preventDefault();
      close();
      return;
    }
    if (e.key === 'Tab') {
      const box = $('.modal', root);
      const items = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', box)
        .filter(el => !el.disabled && el.offsetParent !== null);
      if (!items.length) return;
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  /* opts: { title, html, actions: [{label, variant, onClick, keepOpen}], dismissible, wide, onClose, onOpen } */
  function open(opts) {
    root = root || document.getElementById('modal-root');
    if (current) { current = null; root.innerHTML = ''; }
    else {
      const active = document.activeElement;
      returnFocus = active && !root.contains(active) ? active : null;
    }
    current = opts;
    const actions = opts.actions && opts.actions.length ? opts.actions : [{ label: 'Close', variant: 'primary' }];
    root.innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal' + (opts.wide ? ' modal-wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
          '<h2 id="modal-title">' + esc(opts.title || '') + '</h2>' +
          '<div class="modal-body">' + (opts.html || '') + '</div>' +
          '<div class="modal-actions">' +
            actions.map((a, i) => '<button type="button" class="btn ' + (a.variant ? 'btn-' + a.variant : '') + '" data-modal-action="' + i + '">' + esc(a.label) + '</button>').join('') +
          '</div>' +
        '</div>' +
      '</div>';
    const backdrop = $('.modal-backdrop', root);
    backdrop.addEventListener('click', e => {
      if (e.target === backdrop && opts.dismissible !== false) close();
    });
    $$('[data-modal-action]', root).forEach(btn => {
      btn.addEventListener('click', () => {
        const action = actions[Number(btn.dataset.modalAction)];
        if (!action.keepOpen) {
          const onClose = current && current.onClose;
          if (current) current.onClose = null;
          close();
          if (typeof action.onClick === 'function') action.onClick();
          else if (typeof onClose === 'function') onClose();
        } else if (typeof action.onClick === 'function') {
          action.onClick();
        }
      });
    });
    document.addEventListener('keydown', onKey, true);
    if (typeof opts.onOpen === 'function') opts.onOpen($('.modal', root));
    const focusTarget = $('[data-autofocus]', root) || $('.modal-actions .btn-primary', root) || $('.modal-actions .btn', root);
    if (focusTarget) focusTarget.focus();
  }

  return { open, close, isOpen: () => !!current };
})();

function confirmBox(title, message, confirmLabel, onConfirm, danger) {
  Modal.open({
    title,
    html: '<p>' + message + '</p>',
    actions: [
      { label: 'Cancel', variant: 'secondary' },
      { label: confirmLabel, variant: danger ? 'danger-solid' : 'primary', onClick: onConfirm }
    ]
  });
}

let toastTimer = null;
function toast(message) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/* If a teacher clears progress in another tab (for example on the launcher page), start fresh here too,
   so this tab cannot write the old progress back. */
function reloadWhenCleared(key) {
  window.addEventListener('storage', e => {
    if (e.key === null || (e.key === key && e.newValue === null)) window.location.reload();
  });
}

function showScreen(id) {
  $$('.screen').forEach(s => { s.hidden = s.id !== id; });
  window.scrollTo(0, 0);
  Nav.render(id);
  const screen = document.getElementById(id);
  const heading = screen && $('h1, h2', screen);
  if (heading) {
    heading.setAttribute('tabindex', '-1');
    heading.focus({ preventScroll: true });
  }
}

/* ---------- "You are here" breadcrumbs ----------
   Nav.setup({ tool: 'Code Island', screens: { 'screen-home': { label, go }, 'screen-map': { label, parent, go } } })
   A label may be a function, so it can show the current level or case. */
const Nav = (() => {
  let cfg = null;
  let current = null;

  function setup(options) {
    cfg = options;
    const header = $('.app-header');
    if (!header || $('#crumbs')) return;
    const bar = document.createElement('nav');
    bar.className = 'crumbs';
    bar.setAttribute('aria-label', 'You are here');
    bar.innerHTML = '<ol id="crumbs"></ol>';
    header.insertAdjacentElement('afterend', bar);
    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-crumb]');
      if (!b) return;
      const s = cfg.screens[b.dataset.crumb];
      if (s && typeof s.go === 'function') { Fx.sound('click'); s.go(); }
    });
  }

  function label(s) { return typeof s.label === 'function' ? s.label() : s.label; }

  function render(id) {
    current = id || current;
    const list = $('#crumbs');
    if (!cfg || !list) return;
    const trail = [];
    let step = current;
    while (step && cfg.screens[step] && trail.length < 6) {
      trail.unshift(step);
      step = cfg.screens[step].parent;
    }
    /* Reuse the page's own "Lab home" link so the address is right in every copy of the tools. */
    const homeLink = $('.app-header a[href]');
    let html = homeLink
      ? '<li><a href="' + esc(homeLink.getAttribute('href')) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>Computer Lab</a></li>'
      : '';
    trail.forEach((sid, i) => {
      const s = cfg.screens[sid];
      const last = i === trail.length - 1;
      html += '<li>' + (last
        ? '<span aria-current="page">' + esc(label(s)) + '</span>'
        : '<button type="button" data-crumb="' + sid + '">' + esc(label(s)) + '</button>') + '</li>';
    });
    list.innerHTML = html;
  }

  return { setup, render: id => render(id), refresh: () => render(null) };
})();

function icon(name, cls) {
  const p = ICON_PATHS[name] || ICON_PATHS.star;
  return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}

/* A row of picture tiles: "icon:Label|icon:Label". */
function picRow(spec, numbered) {
  return String(spec).split('|').map((item, i) => {
    const at = item.indexOf(':');
    const name = at === -1 ? item : item.slice(0, at);
    const label = at === -1 ? '' : item.slice(at + 1);
    return '<div class="pic-tile">' + (numbered ? '<span class="pic-num" aria-hidden="true">' + (i + 1) + '</span>' : '') +
      '<span class="pic-badge">' + icon(name.trim()) + '</span><span class="pic-cap">' + esc(label.trim()) + '</span></div>';
  }).join('');
}

function fillPictures(root) {
  $$('[data-icon]', root).forEach(el => { if (!el.firstElementChild) el.innerHTML = icon(el.dataset.icon); });
  $$('[data-pics]', root).forEach(el => { if (!el.firstElementChild) el.innerHTML = picRow(el.dataset.pics, el.classList.contains('numbered')); });
}
fillPictures(document);

/* ---------- Save and Reset buttons ----------
   SaveBar.setup({ id: 'code-island', key: SAVE_KEY, name: 'Code Island', what: 'your stars and levels', save: fn, note: '' })
   Progress already saves automatically; these buttons make that visible, and let students carry
   progress to another computer in a small file (for example on a flash drive). */
const SaveBar = (() => {
  let cfg = null;
  const ICON_SAVE = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3"/><rect x="8" y="13" width="8" height="6" rx="1"/></svg>';
  const ICON_RESET = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>';

  const clock = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function setStatus(text) {
    const el = $('#save-status');
    if (el) el.textContent = text;
  }

  function setup(options) {
    cfg = options;
    store.onWrite = key => { if (key === cfg.key) setStatus('Auto-saved at ' + clock()); };
    if (!store.available) setStatus('Saving is blocked in this browser – use “Save to a file”');
    const bar = $('.header-actions');
    if (!bar || $('#btn-save')) return;
    const save = document.createElement('button');
    save.type = 'button';
    save.id = 'btn-save';
    save.className = 'btn btn-sm btn-save';
    save.innerHTML = ICON_SAVE + '<span>Save</span>';
    save.addEventListener('click', saveNow);
    const reset = document.createElement('button');
    reset.type = 'button';
    reset.id = 'btn-reset-all';
    reset.className = 'btn btn-sm btn-reset';
    reset.innerHTML = ICON_RESET + '<span>Reset</span>';
    reset.addEventListener('click', askReset);
    bar.insertBefore(reset, bar.firstChild);
    bar.insertBefore(save, bar.firstChild);
    const crumbs = $('.crumbs');
    if (crumbs && !$('#save-status')) {
      const status = document.createElement('span');
      status.id = 'save-status';
      status.className = 'save-status';
      crumbs.appendChild(status);
    }
    if (store.available && window.localStorage.getItem(cfg.key)) setStatus('Saved progress found on this computer');
  }

  function saveNow() {
    try { cfg.save(); } catch (e) { /* the file option below still works */ }
    const ok = store.available;
    if (ok) setStatus('Saved at ' + clock());
    Fx.sound('good');
    Modal.open({
      title: ok ? 'Game saved!' : 'This browser is blocking saving',
      html: (ok
        ? '<div class="notice notice-good"><span class="notice-icon" aria-hidden="true">&#10003;</span><div><strong>Your progress is saved on this computer.</strong> Next time, open ' + esc(cfg.name) + ' on this same computer and browser, and you will continue where you stopped.</div></div>'
        : '<div class="notice notice-warn"><span class="notice-icon" aria-hidden="true">!</span><div>This browser (or a private window) does not allow saving. Use <strong>Save to a file</strong> so you do not lose your work.</div></div>') +
        (cfg.note ? '<p style="margin-top:12px">' + esc(cfg.note) + '</p>' : '') +
        '<h3 style="margin:16px 0 6px;font-size:1rem">Using a different computer next time?</h3>' +
        '<p style="margin:0">Choose <strong>Save to a file</strong>. The browser puts a small progress file in your <strong>Downloads</strong> folder – copy it to your flash drive or school folder. On the other computer, open ' + esc(cfg.name) + ', press <strong>Save</strong>, then <strong>Load from a file</strong>.</p>',
      actions: [
        { label: 'Load from a file', variant: 'secondary', onClick: loadFromFile },
        { label: 'Save to a file', variant: 'secondary', onClick: saveToFile },
        { label: 'Done', variant: 'primary' }
      ]
    });
  }

  function saveToFile() {
    try { cfg.save(); } catch (e) { /* use what is stored */ }
    let data = store.get(cfg.key, null);
    if (!data) { toast('There is no progress to save yet – play first!'); return; }
    const today = new Date();
    const payload = { app: 'computerLab', tool: cfg.id, name: cfg.name, savedAt: today.toISOString(), data };
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = cfg.name.replace(/\s+/g, '-') + '-progress-' + today.toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Progress file saved – look in your Downloads folder.');
  }

  function loadFromFile() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let payload = null;
        try { payload = JSON.parse(String(reader.result)); } catch (e) { payload = null; }
        if (!payload || payload.app !== 'computerLab' || !payload.data || typeof payload.data !== 'object') {
          Modal.open({ title: 'That file cannot be loaded', html: '<p>This is not a Computer Lab progress file. Choose a file that was made with <strong>Save to a file</strong>.</p>' });
          return;
        }
        if (payload.tool !== cfg.id) {
          Modal.open({ title: 'Wrong activity', html: '<p>This progress file belongs to <strong>' + esc(payload.name || 'another activity') + '</strong>, not ' + esc(cfg.name) + '. Open ' + esc(payload.name || 'that activity') + ' and load it there.</p>' });
          return;
        }
        const when = payload.savedAt ? new Date(payload.savedAt).toLocaleString() : 'an earlier date';
        confirmBox('Load this progress?', 'This replaces the progress on this computer with the progress saved on <strong>' + esc(when) + '</strong>.', 'Load progress', () => {
          if (!store.set(cfg.key, payload.data)) { toast('This browser is blocking saving, so the file could not be loaded.'); return; }
          store.locked = true;
          window.location.reload();
        });
      };
      reader.readAsText(file);
    });
    input.click();
  }

  function askReset() {
    Modal.open({
      title: 'Reset ' + cfg.name + '?',
      html: '<p>This deletes <strong>' + esc(cfg.what) + '</strong> for ' + esc(cfg.name) + ' on this computer and starts again from the beginning. This cannot be undone.</p>' +
        '<p class="muted">Want to keep a copy? Choose <strong>Save to a file first</strong>.</p>',
      actions: [
        { label: 'Cancel', variant: 'secondary' },
        { label: 'Save to a file first', variant: 'secondary', onClick: saveToFile },
        { label: 'Reset and start again', variant: 'danger-solid', onClick: () => {
          store.remove(cfg.key);
          store.locked = true;
          window.location.reload();
        } }
      ]
    });
  }

  return { setup, saveNow, askReset };
})();

/* ---------- Fun layer: celebrations, small animations and optional sound ----------
   Everything here is decoration only: the game state never waits for an animation. */
const Fx = (() => {
  const SOUND_KEY = 'computerLab.sound';
  const COLORS = ['#f5b700', '#2a78d6', '#eb6834', '#1baf7a', '#e87ba4', '#7c3aed', '#ffffff'];
  let audio = null;
  let soundOn = !!store.get(SOUND_KEY, false);

  const calm = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const canAnimate = () => !calm() && typeof Element !== 'undefined' && !!Element.prototype.animate;

  function layer() {
    let l = document.getElementById('fx-layer');
    if (!l) {
      l = document.createElement('div');
      l.id = 'fx-layer';
      l.setAttribute('aria-hidden', 'true');
      document.body.appendChild(l);
    }
    return l;
  }

  function centerOf(el) {
    if (!el || !el.getBoundingClientRect) return { x: window.innerWidth / 2, y: window.innerHeight * 0.35 };
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* Pieces fly out from a point and fall with gravity. */
  function particles(x, y, count, power, colors, life) {
    if (!canAnimate()) return;
    const l = layer();
    for (let i = 0; i < count; i++) {
      const p = document.createElement('i');
      const size = 5 + Math.random() * 8;
      p.className = 'fx-bit';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.width = size + 'px';
      p.style.height = (Math.random() < 0.5 ? size : size * 0.45) + 'px';
      p.style.background = colors[i % colors.length];
      if (Math.random() < 0.35) p.style.borderRadius = '50%';
      l.appendChild(p);
      const angle = Math.random() * Math.PI * 2;
      const speed = power * (0.35 + Math.random() * 0.65);
      const dx = Math.cos(angle) * speed;
      const dy = Math.sin(angle) * speed - power * 0.45;
      const spin = (Math.random() - 0.5) * 900;
      const anim = p.animate([
        { transform: 'translate(-50%, -50%) rotate(0deg)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + dx * 0.7 + 'px), calc(-50% + ' + dy * 0.7 + 'px)) rotate(' + spin * 0.5 + 'deg)', opacity: 1, offset: 0.4 },
        { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + (dy + power * 1.3) + 'px)) rotate(' + spin + 'deg)', opacity: 0 }
      ], { duration: life * (0.7 + Math.random() * 0.6), easing: 'cubic-bezier(.15,.7,.35,1)' });
      anim.onfinish = () => p.remove();
    }
  }

  function confetti(el) {
    const c = el ? centerOf(el) : { x: window.innerWidth / 2, y: window.innerHeight * 0.3 };
    particles(c.x, c.y, 110, Math.min(window.innerWidth, 900) * 0.55, COLORS, 1900);
  }
  function sparkle(el, colors) {
    const c = centerOf(el);
    particles(c.x, c.y, 18, 110, colors || ['#f5b700', '#fde68a', '#ffffff'], 800);
  }

  function run(el, frames, options) {
    if (!el || !canAnimate()) return null;
    return el.animate(frames, Object.assign({ duration: 400, easing: 'ease-out' }, options || {}));
  }
  const pop = (el, delay) => run(el, [
    { transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.18)', opacity: 1, offset: 0.6 }, { transform: 'scale(1)', opacity: 1 }
  ], { duration: 480, delay: delay || 0, fill: 'backwards', easing: 'cubic-bezier(.2,.8,.3,1.2)' });
  const shake = el => run(el, [
    { transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(8px)' },
    { transform: 'translateX(-6px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }
  ], { duration: 420 });
  const bounce = el => run(el, [
    { transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' },
    { transform: 'translateY(-6px)' }, { transform: 'translateY(0)' }
  ], { duration: 650, easing: 'ease-in-out' });
  const glow = el => run(el, [
    { boxShadow: '0 0 0 0 rgba(245, 158, 11, .75)' }, { boxShadow: '0 0 0 14px rgba(245, 158, 11, 0)' }
  ], { duration: 900 });

  /* Children slide up one after another. */
  function stagger(container, selector) {
    if (!container || !canAnimate()) return;
    $$(selector || ':scope > *', container).forEach((child, i) => {
      run(child, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
        { duration: 420, delay: Math.min(i, 16) * 45, fill: 'backwards', easing: 'cubic-bezier(.2,.7,.3,1)' });
    });
  }

  /* Numbers roll up to their final value. The final text is always set, even without animation. */
  function countUp(el, to, format, duration) {
    if (!el) return;
    format = format || (v => Math.round(v).toLocaleString('en-US'));
    if (!canAnimate() || !window.requestAnimationFrame) { el.textContent = format(to); return; }
    const start = performance.now();
    const len = duration || 900;
    const token = {};
    el._countToken = token;
    const tick = now => {
      if (el._countToken !== token) return;
      const t = Math.min(1, (now - start) / len);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = format(to * eased);
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = format(to);
    };
    el.textContent = format(0);
    requestAnimationFrame(tick);
  }

  /* Tiny synthesised sound effects (no audio files). Off unless a student turns them on. */
  const TUNES = {
    click: [[660, 0.04, 'triangle']],
    good: [[523, 0.09, 'triangle'], [659, 0.09, 'triangle'], [784, 0.16, 'triangle']],
    coin: [[988, 0.06, 'square'], [1319, 0.14, 'square']],
    bad: [[220, 0.12, 'sawtooth'], [165, 0.2, 'sawtooth']],
    win: [[523, 0.1, 'triangle'], [659, 0.1, 'triangle'], [784, 0.1, 'triangle'], [1047, 0.3, 'triangle']],
    stamp: [[110, 0.12, 'square'], [80, 0.12, 'square']],
    cash: [[1319, 0.05, 'square'], [1568, 0.05, 'square'], [2093, 0.12, 'square']]
  };
  function sound(name) {
    if (!soundOn || !TUNES[name]) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audio = audio || new Ctx();
      let t = audio.currentTime + 0.01;
      TUNES[name].forEach(([freq, len, type]) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + len);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + len + 0.02);
        t += len * 0.85;
      });
    } catch (e) { /* sound is optional */ }
  }

  function renderToggle(btn) {
    btn.setAttribute('aria-pressed', String(soundOn));
    btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/>' +
      (soundOn ? '<path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="M16 9l5 6M21 9l-5 6"/>') +
      '</svg><span>Sound ' + (soundOn ? 'on' : 'off') + '</span>';
  }
  function mountSoundToggle() {
    const bar = $('.header-actions');
    if (!bar || $('#btn-sound')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'btn-sound';
    btn.className = 'btn btn-sm btn-sound';
    renderToggle(btn);
    btn.addEventListener('click', () => {
      soundOn = !soundOn;
      store.set(SOUND_KEY, soundOn);
      renderToggle(btn);
      sound('good');
    });
    bar.insertBefore(btn, bar.firstChild);
  }

  return { confetti, sparkle, pop, shake, bounce, glow, stagger, countUp, sound, mountSoundToggle, calm };
})();

/* ---------- Guided tutorial ----------
   Coach.start({ name, steps, onDone }) walks a student through one complete piece of work.
   Each step: { text, pic, target, check, act, done }
     text   one short instruction
     pic    optional "icon:Label|icon:Label" picture row
     target CSS selector of the thing to use; it is outlined and scrolled into view
     check  function returning true once the student has done it (the step then ticks by itself)
     act    function that does the step for them ("Show me")
   The tutorial never blocks the tool: students can press Stop at any time and keep whatever they made. */
const Coach = (() => {
  let cfg = null;
  let index = 0;
  let timer = null;
  let lastTarget = null;
  let advancing = false;

  const panel = () => document.getElementById('coach');

  function mount() {
    if (panel()) return;
    const el = document.createElement('div');
    el.id = 'coach';
    el.className = 'coach';
    el.setAttribute('role', 'region');
    el.setAttribute('aria-label', 'Guided tutorial');
    el.innerHTML =
      '<div class="coach-head"><span class="coach-name"></span><span class="coach-step"></span>' +
      '<button type="button" class="coach-x" data-coach="move" aria-label="Move this box to the other side">&harr;</button>' +
      '<button type="button" class="coach-x" data-coach="stop" aria-label="Stop the tutorial">&times;</button></div>' +
      '<div class="coach-bar" aria-hidden="true"><span></span></div>' +
      '<div class="coach-pics"></div>' +
      '<p class="coach-text" aria-live="polite"></p>' +
      '<div class="coach-actions">' +
        '<button type="button" class="btn btn-sm" data-coach="show">Show me</button>' +
        '<button type="button" class="btn btn-sm btn-primary" data-coach="next">Next</button>' +
      '</div>';
    document.body.appendChild(el);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-coach]');
      if (!b) return;
      if (b.dataset.coach === 'stop') stop(true);
      else if (b.dataset.coach === 'move') el.classList.toggle('coach-right');
      else if (b.dataset.coach === 'show') showMe();
      else next();
    });
  }

  function clearHalo() {
    $$('.coach-halo').forEach(el => el.classList.remove('coach-halo'));
    lastTarget = null;
  }

  function highlight() {
    const step = cfg && cfg.steps[index];
    if (!step || !step.target) { clearHalo(); return; }
    const el = $(step.target);
    if (!el) { clearHalo(); return; }
    if (el === lastTarget) { el.classList.add('coach-halo'); return; }
    clearHalo();
    el.classList.add('coach-halo');
    lastTarget = el;
    if (el.scrollIntoView) el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: Fx.calm() ? 'auto' : 'smooth' });
  }

  function render() {
    mount();
    const el = panel();
    const step = cfg.steps[index];
    const last = index === cfg.steps.length - 1;
    $('.coach-name', el).textContent = cfg.name || 'Tutorial';
    $('.coach-step', el).textContent = 'Step ' + (index + 1) + ' of ' + cfg.steps.length;
    $('.coach-bar span', el).style.width = Math.round(index / cfg.steps.length * 100) + '%';
    $('.coach-pics', el).innerHTML = step.pic ? '<div class="pic-row">' + picRow(step.pic) + '</div>' : '';
    $('.coach-text', el).innerHTML = step.text;
    $('[data-coach="show"]', el).hidden = typeof step.act !== 'function';
    $('[data-coach="next"]', el).textContent = last ? 'Finish' : 'Next';
    el.classList.remove('is-done');
    highlight();
    clearInterval(timer);
    timer = setInterval(tick, 300);
  }

  function tick() {
    if (!cfg) return;
    highlight();
    const step = cfg.steps[index];
    if (advancing || typeof step.check !== 'function') return;
    let ok = false;
    try { ok = !!step.check(); } catch (e) { ok = false; }
    if (!ok) return;
    advancing = true;
    const el = panel();
    if (el) el.classList.add('is-done');
    Fx.sound('good');
    setTimeout(() => { advancing = false; next(); }, 700);
  }

  function showMe() {
    const step = cfg && cfg.steps[index];
    if (!step || typeof step.act !== 'function') return;
    try { step.act(); } catch (e) { /* the student can still do it themselves */ }
    if (typeof step.check !== 'function') next();
  }

  function next() {
    if (!cfg) return;
    if (index >= cfg.steps.length - 1) { finish(); return; }
    index++;
    render();
  }

  function finish() {
    const done = cfg && cfg.onDone;
    stop(false);
    if (typeof done === 'function') done();
  }

  function stop(byStudent) {
    clearInterval(timer);
    timer = null;
    advancing = false;
    const onStop = cfg && cfg.onStop;
    cfg = null;
    clearHalo();
    const el = panel();
    if (el) el.remove();
    if (byStudent && typeof onStop === 'function') onStop();
  }

  function start(options) {
    stop(false);
    cfg = options;
    index = 0;
    render();
  }

  return { start, stop, next, active: () => !!cfg, step: () => index, count: () => (cfg ? cfg.steps.length : 0) };
})();

/* ---------- Building the program text ---------- */
/* values: { slotName: code }, overrides: { sectionId: code } */
function sectionCode(sec, values, overrides) {
  if (overrides && overrides[sec.id] !== undefined) return overrides[sec.id];
  return sec.text.split('\n').map(line => {
    const block = line.match(/^(\s*)«(\w+)»\s*$/);
    if (block) {
      const v = String(values[block[2]] || '');
      return v.split('\n').map(l => block[1] + l).join('\n');
    }
    return line.replace(/«(\w+)»/g, (_, k) => String(values[k] || ''));
  }).join('\n');
}

  try { const g = factory(); g.get().obstacle.x = 600; frames(g, 10); speed = (600 - g.get().obstacle.x) / 10; } catch (e) { /* reported by the game test */ }
  try { const g = factory(); g.get().obstacle.x = 1e6; frames(g, 60); pts = g.get().score; } catch (e) { /* reported by the game test */ }
  if (jump && Math.abs(jump.rise - ref.rise) >= 8) add('jump', 'Jump strength', 'jumps ' + Math.round(jump.rise) + ' px high (was ' + Math.round(ref.rise) + ')');
  else if (s.jumpPower !== undefined && s.jumpPower !== DEFAULTS.jumpPower) problems.push('You changed jumpPower, but the jump did not change. Does your jump code use -jumpPower?');
  if (typeof speed === 'number' && Math.abs(speed - ref.speed) >= 0.5) add('speed', 'Game speed', 'obstacle speed ' + (Math.round(speed * 10) / 10) + ' (was ' + ref.speed + ')');
  else if (s.gameSpeed !== undefined && s.gameSpeed !== DEFAULTS.gameSpeed) problems.push('You changed gameSpeed, but the obstacle speed did not change. Does your movement code use gameSpeed?');
  if (typeof pts === 'number' && pts !== ref.points) add('score', 'Score increase', (pts / 60) + ' point(s) per frame (was 1)');
  else if (s.scoreStep !== undefined && s.scoreStep !== DEFAULTS.scoreStep) problems.push('You changed scoreStep, but the score did not change. Does your score code use scoreStep?');
  if (typeof s.obstacleGap === 'number' && s.obstacleGap !== DEFAULTS.obstacleGap) {
    if (s.obstacleGap < 0 || s.obstacleGap > 3000) problems.push('obstacleGap should be between 0 and 3000.');
    else add('gap', 'Obstacle frequency', 'gap ' + s.obstacleGap + ' (was 300)');
  }
  if (typeof s.obstacleSize === 'number' && s.obstacleSize !== DEFAULTS.obstacleSize) {
    if (s.obstacleSize < 15 || s.obstacleSize > 110) problems.push('obstacleSize should be between 15 and 110.');
    else add('size', 'Difficulty', 'obstacles ' + s.obstacleSize + ' px tall (was 50)');
  }
  const num = (name, lo, hi, id, label, unit) => {
    const v = s[name];
    if (typeof v !== 'number' || v === DEFAULTS[name]) return;
    if (v < lo || v > hi) { problems.push(name + ' should be between ' + lo + ' and ' + hi + '.'); return; }
    add(id, label, name + ' ' + v + ' (was ' + DEFAULTS[name] + ')');
  };
  num('startLives', 1, 9, 'lives', 'Lives');
  num('coinValue', 1, 1000, 'coinvalue', 'Coin value');
  num('speedUp', 0, 0.02, 'speedup', 'Speed-up');
  SETTING_NAMES.forEach(n => { if (s[n] === undefined) problems.push('The setting ' + n + ' is missing. Keep every setting line (you can change its value).'); });
  return { list: out, problems, playable: playable(factory) };
}

function complete(n, items, extraText) {
  const first = !data.done[n];
  data.done[n] = true;
  data.unlocked = Math.max(data.unlocked, Math.min(FINAL, n + 1));
  saveNow();
  renderStepper();
  renderMission();
  const button = n < FINAL ? '<button type="button" class="btn btn-primary" data-go="' + (n + 1) + '">Next: Mission ' + (n + 1) + ' →</button>' : '<button type="button" class="btn btn-primary" data-report="1">See my Dino Runner score</button>';
  showResults(items, { text: (extraText ? extraText + ' ' : '') + MISSIONS[n].feedback + (MISSION_TESTS[n] ? ' Play your game to see the change!' : ''), button });
  setCycle('IMPROVE');
  if (first) toast('Mission ' + n + ' complete!');
}
function runBug(c, core) {
  const b = BUGS[data.bugIndex];
  const r = core[b.test];
  afterRun(core);
  if (!r.ok) { showResults([{ ok: false, msg: r.msg }], null); setCycle('DEBUG'); return; }
  data.bugs[data.bugIndex] = Object.assign(data.bugs[data.bugIndex] || {}, { fixed: true });
  const fixedText = 'Bug ' + (data.bugIndex + 1) + ' fixed (' + b.kind + '). ' + b.explain;
  data.bugIndex++;
  data.bugText = null;
  saveNow();
  renderCode();
  if (data.bugIndex >= BUGS.length) { complete(7, [{ ok: true, msg: fixedText }]); return; }
  renderMission();
  focusSection(true);
  showResults([{ ok: true, msg: fixedText }, { ok: true, warn: true, msg: 'Next bug: ' + BUGS[data.bugIndex].report }], null);
  Fx.sound('good');
  setCycle('DEBUG');
  const again = compileCurrent();
  if (!again.error) startGame(again.factory, { restartable: true }); else { Game.g = null; Game.error = 'Syntax error'; setStatus(); draw(); }
}
function runCustom(c, core) {
  const cust = customisations(c.factory);
  const coreOk = CORE_TESTS.every(t => core[t.id].ok);
  data.custom = coreOk && cust.playable ? cust.list : [];
  saveNow();
  afterRun(core);
  const items = [];
  CORE_TESTS.forEach(t => { if (!core[t.id].ok) items.push({ ok: false, msg: t.label + ': ' + core[t.id].msg }); });
  if (coreOk && !cust.playable) items.push({ ok: false, msg: 'Your game is now impossible to beat: the dino cannot get over the obstacles. Make it a little easier (for example a stronger jump, a slower speed or smaller obstacles).' });
  cust.problems.forEach(p => items.push({ ok: false, warn: true, msg: p }));
  cust.list.forEach((x, i) => items.push({ ok: coreOk && cust.playable, msg: 'Change ' + (i + 1) + ': ' + x.label + ' (' + x.detail + ')' }));
  if (coreOk && cust.playable && cust.list.length >= 2) { complete(FINAL, items, 'You made ' + cust.list.length + ' changes.'); return; }
  if (coreOk && cust.playable) items.push({ ok: false, msg: cust.list.length ? 'Good! Now make at least one more change.' : 'No changes found yet. Change at least two values in SETTINGS, then press ▶ RUN.' });
  renderMission();
  showResults(items, null);
  setCycle(items.some(i => !i.ok && !i.warn) ? 'DEBUG' : 'IMPROVE');
}
/* The GAME TEST card below the game: every part of the game, tested on the real code. */
let lastCore = null;
function afterRun(core) { lastCore = core; renderGameTest(); }
function renderGameTest() {
  const core = lastCore;
  let html = '<h3>Game test</h3><ul class="gt-list">' + CORE_TESTS.map(t => {
    const built = data.done[t.mission] || t.mission <= data.view;
    const r = core && core[t.id];
    const cls = !built ? 'todo' : r ? (r.ok ? 'ok' : 'no') : 'todo';
    const mark = cls === 'ok' ? '✓' : cls === 'no' ? '✗' : '·';
    return '<li class="' + cls + '" title="' + esc(!built ? 'Mission ' + t.mission + ' builds this' : r ? r.msg : 'Press RUN to test') + '"><span class="mk" aria-hidden="true">' + mark + '</span>' + t.label + (built ? '' : ' <span class="muted" style="font-weight:600;font-size:.8em">M' + t.mission + '</span>') + '</li>';
  }).join('') + '</ul>';
  if (data.view === FINAL || data.done[FINAL]) {
    const list = data.custom || [];
    html += '<h3 class="gt-sub">Customisation</h3><ul class="gt-list">' + [0, 1].map(i => '<li class="' + (list[i] ? 'ok' : 'todo') + '"><span class="mk" aria-hidden="true">' + (list[i] ? '✓' : '·') + '</span>' + (list[i] ? 'Change ' + (i + 1) + ': ' + esc(list[i].label) : 'Change ' + (i + 1)) + '</li>').join('') +
      (list.length > 2 ? '<li class="ok"><span class="mk" aria-hidden="true">✓</span>+' + (list.length - 2) + ' more</li>' : '') + '</ul>';
  }
  $('#gametest').innerHTML = html;
}

/* =====================================================================
   Score out of 100
   ===================================================================== */
const CORE_POINTS = { jump: 5, move: 4, collision: 5, score: 4, gameover: 4, restart: 4, speedup: 4, highscore: 4, twokeys: 3, lives: 4, coins: 4, random: 3, night: 2 };
function computeScore() {
  const vals = {};
  Object.keys(SLOTS).forEach(k => { const s = String(data.slots[k] || ''); vals[k] = s.trim() && (data.done[SLOTS[k].mission] || SLOTS[k].mission === FINAL) ? s : SLOTS[k].neutral; });
  const c = compile(vals);
  const core = c.error ? null : runCore(c.factory);
  let corePts = 0;
  CORE_TESTS.forEach(t => { if (core && core[t.id].ok) corePts += CORE_POINTS[t.id]; });
  let debug = 0;
  BUGS.forEach((_, i) => { const b = data.bugs[i]; if (b && b.fixed) debug += b.answer ? 1 : 2.5; });
  let understand = 0;
  /* Choosing well: full marks when the right code was found within two tries without Show answer. */
  BUILD_MISSIONS.forEach(n => { if (data.done[n]) understand += data.answer[n] ? 1 : (data.tries[n] || 0) >= 2 ? 2 : 3; });
  understand = Math.round(understand / (BUILD_MISSIONS.length * 3) * 15);
  let custom = 0;
  if (c.factory && core && CORE_TESTS.every(t => core[t.id].ok)) {
    const cu = customisations(c.factory);
    const count = cu.playable ? cu.list.length : 0;
    data.custom = cu.playable ? cu.list : [];
    custom = count >= 3 ? 20 : count === 2 ? 16 : count === 1 ? 8 : 0;
    if (count && data.answer[FINAL]) custom = Math.max(0, custom - 3);
  }
  const cats = [
    { name: 'Core game mechanics', pts: corePts, max: 50 },
    { name: 'Debugging', pts: Math.round(debug), max: 15 },
    { name: 'Code completion', pts: understand, max: 15 },
    { name: 'Customisation', pts: custom, max: 20 }
  ];
  const total = cats.reduce((s, x) => s + x.pts, 0);
  return { total, cats, core, compileError: c.error };
}
function showReport() {
  const r = computeScore();
  data.lastScore = r.total;
  saveNow();
  const built = [['jump', 'Working jump'], ['move', 'Moving obstacle'], ['collision', 'Collision system'], ['score', 'Score system'], ['gameover', 'Game over'], ['restart', 'Restart system'], ['speedup', 'Speed-up over time'], ['highscore', 'High score'], ['twokeys', 'Two jump keys'], ['lives', 'Lives'], ['coins', 'Coins'], ['random', 'Random obstacle sizes'], ['night', 'Night mode']].filter(([id]) => r.core && r.core[id].ok).map(x => x[1]);
  const answered = BUILD_MISSIONS.filter(n => data.answer[n]);
  const fixed = BUGS.filter((_, i) => data.bugs[i] && data.bugs[i].fixed).length;
  const custom = data.custom || [];
  const good = [], improve = [];
  if (built.length === CORE_TESTS.length) good.push('Your game has every mechanic, tested on your own code.');
  const selfDone = BUILD_MISSIONS.filter(n => data.done[n] && !data.answer[n]).length;
  if (selfDone) good.push('You typed working code for ' + selfDone + ' of ' + BUILD_MISSIONS.length + ' building missions without Show Answer.');
  if (fixed === 6) good.push('You fixed all 6 bugs' + (BUGS.some((_, i) => data.bugs[i] && data.bugs[i].answer) ? '.' : ' on your own.'));
  if (custom.length >= 2) good.push('You made ' + custom.length + ' changes to make the game your own.');
  if (!good.length) good.push('You made a start. Every mission you finish adds a working part to your game.');
  CORE_TESTS.forEach(t => { if (!r.core || !r.core[t.id].ok) improve.push(t.label + ': ' + (r.core ? r.core[t.id].msg : 'your code does not run yet.')); });
  if (fixed < 6) improve.push('Finish Mission 7: ' + (6 - fixed) + ' bug' + (6 - fixed === 1 ? '' : 's') + ' left to fix.');
  if (answered.length) improve.push('Go back to Mission ' + answered.join(', ') + ': read the choices and explain to yourself why the right one works.');
  if (custom.length < 2) improve.push('Change at least ' + (2 - custom.length) + ' more setting' + (custom.length === 1 ? '' : 's') + ' in Mission ' + FINAL + '.');
  else if (custom.length === 2) improve.push('Add a third change for full customisation points.');
  if (!improve.length) improve.push('Challenge: make the game harder but still fair, then challenge a classmate to beat your high score.');
  const html = '<div class="report-score"><div class="lbl">DINO RUNNER SCORE</div><div class="big">' + r.total + '<small> / 100</small></div></div>' +
    '<div class="rep-cats">' + r.cats.map(c => '<div class="rep-cat"><span>' + esc(c.name) + '</span><span class="progress-bar" aria-hidden="true"><span style="width:' + Math.round(c.pts / c.max * 100) + '%"></span></span><span class="pts">' + c.pts + ' / ' + c.max + '</span></div>').join('') + '</div>' +
    '<div class="rep-grid">' +
    '<div class="rep-box"><h3>Game test</h3><ul class="gt-list">' + CORE_TESTS.map(t => { const ok = r.core && r.core[t.id].ok; return '<li class="' + (ok ? 'ok' : 'no') + '"><span class="mk" aria-hidden="true">' + (ok ? '✓' : '✗') + '</span>' + t.label + '</li>'; }).join('') + '</ul>' +
    '<h3 style="margin-top:10px">Customisation</h3><ul class="gt-list">' + (custom.length ? custom.map((x, i) => '<li class="ok"><span class="mk" aria-hidden="true">✓</span>Change ' + (i + 1) + ': ' + esc(x.label) + '</li>').join('') : '<li class="no"><span class="mk" aria-hidden="true">✗</span>No changes yet</li>') + '</ul></div>' +
    '<div class="rep-box"><h3>What you built</h3><ul>' + (built.length ? built.map(b => '<li>' + b + '</li>').join('') : '<li>Nothing works yet: start with Mission 2.</li>') + '</ul>' +
    '<h3 style="margin-top:10px">What you did well</h3><ul>' + good.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul>' +
    '<h3 style="margin-top:10px">Improve</h3><ul>' + improve.slice(0, 3).map(g => '<li>' + esc(g) + '</li>').join('') + '</ul></div></div>';
  Modal.open({ title: 'Your Dino Runner', wide: true, html, actions: [{ label: 'Improve my game', variant: 'secondary', onClick: () => goMission(Math.min(data.unlocked, FINAL)) }, { label: 'Keep playing', variant: 'primary', onClick: () => $('#game-box').focus() }] });
  renderGameTest();
}

/* =====================================================================
   Navigation, help and events
   ===================================================================== */
function goMission(n) {
  if (n < 1 || n > data.unlocked) return;
  data.view = n;
  openHelp = null;
  saveNow();
  renderAll();
  focusSection(true);
  setCycle('LEARN');
  $('#results').innerHTML = '';
  if (n === 1) { const c = compile(ANSWER_VALUES); startGame(c.factory, { demo: true, restartable: true }); }
  else {
    const c = compileCurrent();
    if (c.error) { Game.g = null; Game.error = ''; cancelAnimationFrame(Game.raf); setStatus(); draw(); showResults([{ ok: false, warn: true, msg: 'Press ▶ RUN to test your code.' }], null); }
    else startGame(c.factory, { restartable: !!data.done[6] });
  }
}
function renderAll() { renderStepper(); renderMission(); renderCode(); renderGameTest(); setCycle(cyclePhase); }
function onGamePlayed() {
  if (data.view !== 1 || data.done[1] || !Game.demo) return;
  if (Game.jumps >= 1 && Game.overs >= 1) complete(1, [{ ok: true, msg: 'You jumped and you saw GAME OVER.' }]);
}
function showHelp(page) {
  page = page || 0;
  const pages = [
    { title: 'Program your own game', html: '<div class="help-flow"><span>LEARN</span><i>→</i><span>COMPLETE CODE</span><i>→</i><span>RUN</span><i>→</i><span>PLAY</span><i>→</i><span>DEBUG</span><i>→</i><span>IMPROVE</span></div>' +
      '<ul class="help-list"><li><b>Left:</b> your mission, with a Guide, a Hint and Show answer.</li><li><b>Middle:</b> the real JavaScript program. Write the <span style="background:#2e3144;color:#ffd166;padding:0 5px;border-radius:4px;font-family:Consolas,monospace">yellow</span> parts.</li><li><b>Right:</b> your live game. Press <b>▶ RUN / TEST</b> to run your code, play it, and have it tested.</li></ul>' },
    { title: 'Eight missions, one game', html: '<ul class="help-list"><li>1 Play the finished game</li><li>2 Jump · 3 Moving obstacle · 4 Collision · 5 Score · 6 Restart</li><li>7 Debug six bugs</li><li>8 Make it yours: change at least two things</li></ul><p class="muted">About one lesson in total. Take your time: the missions stay open and your work saves itself on this computer.</p>' },
    { title: 'How you are scored', html: '<ul class="help-list"><li><b>Core game mechanics (50):</b> the game tests your real code: jump, obstacle movement, collision, score, game over, restart.</li><li><b>Debugging (15)</b> and <b>code completion (15):</b> Show answer costs a few points but never stops you finishing.</li><li><b>Customisation (20):</b> at least two real changes, and the game must still be playable.</li></ul>' }
  ];
  const pg = pages[page];
  const actions = [];
  if (page > 0) actions.push({ label: 'Back', variant: 'secondary', onClick: () => showHelp(page - 1) });
  if (page < pages.length - 1) actions.push({ label: 'Next', variant: 'primary', onClick: () => showHelp(page + 1) });
  else actions.push({ label: 'Let\'s code!', variant: 'primary' });
  Modal.open({ title: pg.title, html: pg.html + '<div class="tut-dots" aria-hidden="true">' + pages.map((_, i) => '<span class="' + (i === page ? 'on' : '') + '"></span>').join('') + '</div>', actions });
}
function isTyping(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable); }
function bindEvents() {
  $('#btn-run').addEventListener('click', run);
  $('#btn-help').addEventListener('click', () => showHelp(0));
  $('#btn-score').addEventListener('click', showReport);
  $('#btn-replay').addEventListener('click', () => { if (Game.factory) { startGame(Game.factory, { demo: Game.demo, keepCounts: true }); $('#game-box').focus(); } else run(); });
  $('#btn-jump').addEventListener('pointerdown', e => { e.preventDefault(); press('Space'); });
  $('#btn-jump').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); press('Space'); } });
  $('#game-box').addEventListener('pointerdown', () => $('#game-box').focus());
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); return; }
    if (e.key === 'Escape' && document.body.classList.contains('big-game') && !Modal.isOpen()) { toggleBig(false); return; }
    if (Modal.isOpen() || isTyping(e.target) || e.target.closest && e.target.closest('button, a')) return;
    if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS', 'Enter'].indexOf(e.code) !== -1) { e.preventDefault(); if (!e.repeat) press(e.code); }
  });
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go && !go.disabled) { goMission(Number(go.dataset.go)); return; }
    if (e.target.closest('[data-report]')) { showReport(); return; }
    const h = e.target.closest('[data-help]');
    if (h) {
      const k = h.dataset.help;
      openHelp = openHelp === k ? null : k;
      const key = data.view === 7 ? '7-' + data.bugIndex : String(data.view);
      if (k === 'hint' && openHelp) data.hints[key] = Math.max(1, data.hints[key] || 0);
      if (openHelp === 'guide') setCycle('LEARN');
      saveSoon();
      renderMission();
      return;
    }
    if (e.target.closest('[data-more-hint]')) { const key = data.view === 7 ? '7-' + data.bugIndex : String(data.view); data.hints[key] = (data.hints[key] || 1) + 1; saveSoon(); renderMission(); return; }
    if (e.target.closest('[data-reveal]')) { revealAnswer(); return; }
    if (e.target.closest('#btn-big')) { toggleBig(); return; }
    if (e.target.closest('[data-skip]')) { complete(1, [{ ok: true, msg: 'Skipped. You can come back and play the finished game at any time.' }]); }
  });
  const code = $('#code');
  code.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.slot) {
      data.slots[t.dataset.slot] = t.value;
      t.classList.remove('bad');
      if (t.tagName === 'INPUT') t.size = Math.max(SLOTS[t.dataset.slot].size || 4, t.value.length + 1);
      if (t.tagName === 'TEXTAREA') t.rows = Math.max(SLOTS[t.dataset.slot].rows || 3, t.value.split('\n').length + 1);
    } else if (t.dataset.bug) { data.bugText = t.value; t.rows = t.value.split('\n').length + 1; }
    else return;
    saveSoon();
    setCycle('CODE');
    refreshChoicesSoon();
  });
  ['paste', 'drop'].forEach(ev => code.addEventListener(ev, e => {
    if (e.target.dataset && (e.target.dataset.slot || e.target.dataset.bug)) { e.preventDefault(); toast('Type the code yourself with the keyboard. That is how you learn it!'); }
  }));
  code.addEventListener('change', e => { if (e.target.dataset.slot) { data.slots[e.target.dataset.slot] = e.target.value; saveSoon(); setCycle('CODE'); } });
  code.addEventListener('keydown', e => {
    const t = e.target;
    if (e.key === 'Tab' && t.tagName === 'TEXTAREA' && !e.shiftKey) {
      e.preventDefault();
      const s = t.selectionStart;
      t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd);
      t.selectionStart = t.selectionEnd = s + 2;
      t.dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (e.key === 'Enter' && t.tagName === 'INPUT' && !e.ctrlKey) { e.preventDefault(); run(); }
  });
  window.addEventListener('resize', draw);
  window.addEventListener('beforeunload', saveNow);
}

function init() {
  reloadWhenCleared(SAVE_KEY);
  Nav.setup({ screens: { 'screen-lab': { label: 'Dino Runner Coding Lab', go: () => {} } } });
  SaveBar.setup({ id: 'dino-runner', key: SAVE_KEY, name: 'Dino Runner Coding Lab', what: 'all missions, your code and your score', save: saveNow, note: 'Next time, open Dino Runner Coding Lab on this computer and continue where you stopped.' });
  const reset = $('#btn-reset-all span');
  if (reset) reset.textContent = 'Reset activity';
  bindEvents();
  showScreen('screen-lab');
  goMission(data.view);
  if (!data.seenHelp) { data.seenHelp = true; saveNow(); showHelp(0); }
}

/* For testing in the browser console only. */
window.DinoLab = { data: () => data, tick: n => { for (let i = 0; i < n; i++) step(); draw(); }, run, goMission, compileCurrent, runCore, computeScore, showReport, press, Game, setSlot: (k, v) => { data.slots[k] = v; renderCode(); }, setBugText: v => { data.bugText = v; renderCode(); } };

init();

</script>
</body>
</html>
