            if (game.missions) game.missions.check();
            setTimeout(h.close, 700);
          },
          wrong: msg => {
            attempts++;
            game.audio.play('wrong');
            const pen = pz.penalty != null ? pz.penalty : game.cfg.scoring.wrongAnswer;
            if (pen) game.scoring.add(-pen, 'Wrong answer', 'wrong');
            h.note(msg || 'Not quite — try again.');
            game.emit('puzzle:wrong', { id: pz.id });
            if (pz.maxAttempts && attempts >= pz.maxAttempts) {
              if (pz.onFail) GK.run(game, pz.onFail, { entity: ent });
              game.emit('puzzle:failed', { id: pz.id });
              setTimeout(h.close, 900);
            }
          },
        };
        PZ.get(pz.type || 'input').render(body, pz, api);
      };
    },
  });
})();
</script>
<script>/* mechanics/world-objects/world-objects.js */
/* Game Kit · mechanics/world-objects   (needs: interaction, inventory; spatial game types only)
   Reusable interactive objects for spatial games: collectible, item, door (key / flag / condition locks),
   button, switch (lever), terminal (password or puzzle), crate, checkpoint, portal.
   Adds interactions open · close · toggle, actions open/close/toggle/lock/unlock, condition {open:'doorId'}.
   Each object type is a prefab = { defaults, init(ent, game), update(ent, dt, game) } (GK.Prefabs.add). */
(function () {
  'use strict';
  const U = GK.util, P = GK.Prefabs;
  P.add('collectible', {
    defaults: { model: 'coin', solid: false, hover: 0.9, spin: 2.2, bob: 0.1, touch: true, points: 10 },
    init(ent) { if (!ent.interact.length) ent.interact.push({ type: 'pickup' }); },
  });
  P.add('item', { // like a collectible, but the player presses E to pick it up
    defaults: { model: 'keycard', solid: false, hover: 0.9, spin: 1.5, bob: 0.08, touch: false, points: 0 },
    init(ent) { if (!ent.interact.length) ent.interact.push({ type: 'pickup' }); },
  });

  P.add('door', {
    defaults: { model: 'door', solid: true, width: 1.4, height: 2.2, slide: 'side', speed: 2.5, open: false },
    init(ent) {
      const d = ent.def;
      ent.state.open = !!d.open;
      ent.state.locked = !!d.locked;
      ent.openT = ent.state.open ? 1 : 0;
      ent.setModel(ent.model, U.merge(ent.look, { width: d.width, height: d.height, locked: ent.state.locked }));
      if (!ent.name) ent.name = 'door';
      if (!ent.interact.length) ent.interact.push({ type: 'toggle' });
      ent.blocks = () => ent.active && ent.openT < 0.7;
      /** Try to open, handling locks. Returns true if the door is (now) open. */
      ent.tryOpen = function (game, silent) {
        if (ent.state.locked) {
          const L = U.isObj(d.locked) ? d.locked : {};
          const ok = (L.item && game.hasItem(L.item)) || (L.flag && game.state.flags[L.flag]) || (L.if !== undefined && GK.test(game, L.if));
          if (!ok) {
            if (!silent) { game.ui.toast(U.fill(L.text || 'Locked.', game.state.vars), 'bad'); game.audio.play('deny'); }
            game.emit('door:denied', { id: ent.id });
            return false;
          }
          ent.unlock(game);
          if (L.item && L.consume) game.takeItem(L.item, 1);
          if (!silent) game.ui.toast(L.unlockText || ('Unlocked' + (L.item ? ' with ' + game.itemName(L.item) : '')), 'good');
        }
        ent.setOpen(game, true);
        return true;
      };
      ent.unlock = function (game) {
        ent.state.locked = false;
        ent.setLook({ locked: false });
        game.emit('door:unlocked', { id: ent.id });
      };
      ent.lock = function (game) {
        ent.state.locked = true;
        ent.setLook({ locked: true });
        game.emit('door:locked', { id: ent.id });
      };
      ent.setOpen = function (game, open) {
        if (ent.state.open === open) return;
        ent.state.open = open;
        game.audio.play('door');
        game.emit(open ? 'door:opened' : 'door:closed', { id: ent.id });
      };
    },
    restore(ent) { ent.openT = ent.state.open ? 1 : 0; ent.setLook({ locked: !!ent.state.locked }); },
    update(ent, dt) {
      const target = ent.state.open ? 1 : 0;
      ent.openT += U.clamp(target - ent.openT, -dt * ent.def.speed, dt * ent.def.speed);
      const w = ent.def.width, h = ent.def.height;
      if (ent.def.slide === 'up') ent.offset = [0, ent.openT * (h - 0.15), 0];
      else { const d = ent.openT * w; ent.offset = [Math.cos(ent.yaw) * d, 0, -Math.sin(ent.yaw) * d]; }
    },
  });

  P.add('button', {
    defaults: { model: 'button', solid: true, color: '#e74c3c' },
    init(ent) { if (!ent.interact.length) ent.interact.push({ type: 'activate', prompt: 'Press' }); },
  });
  P.add('switch', { // lever with on/off state: interact {type:'activate', toggle:true, on:[actions], off:[actions]}
    defaults: { model: 'lever', solid: true },
    init(ent) {
      ent.state.on = !!ent.def.on;
      ent.setLook({ on: ent.state.on });
      if (!ent.interact.length) ent.interact.push({ type: 'activate', toggle: true, prompt: 'Pull' });
    },
  });
  P.add('checkpoint', {
    defaults: { model: 'pad', solid: false, touch: true },
    init(ent) {
      ent.onTouch = game => {
        if (ent.state.on) return;
        ent.state.on = true;
        ent.setLook({ on: true });
        game.setCheckpoint(ent.pos, ent.def.rot, ent.id);
      };
    },
  });
  P.add('portal', { defaults: { model: 'portal', solid: false } });
  P.add('crate', { defaults: { model: 'crate', solid: true } });
  P.add('terminal', { // {type:'terminal', puzzle:'id'} or the password shortcut {password:'1234', question}
    defaults: { model: 'terminal', solid: true, screen: '#2ecc71', solvedScreen: '#27ae60' },
    init(ent) {
      const d = ent.def;
      if (!ent.name) ent.name = 'terminal';
      ent.setLook({ screen: d.lockedScreen || '#3fc1ff' });
      if (ent.interact.length) return;
      const pz = d.puzzle || (d.password != null ? { id: ent.id + ':password', type: 'input', title: d.title || 'Password', question: d.question || 'Enter the password:', answer: d.password, points: d.points || 0, onSolve: d.onSolve } : null);
      if (!pz) return;
      ent.interact.push({ type: 'puzzle', puzzle: pz, prompt: d.prompt || 'Use terminal', requires: d.requires, lockedText: d.lockedText, actions: [{ do: 'set', target: ent.id, look: { screen: d.solvedScreen } }].concat(U.list(d.actions)) });
    },
  });

  // ---------- doors: interactions, actions, condition ----------
  const I = GK.Interactions, A = GK.Actions, T = GK.targetOf;
  const doorVerb = (ent, verb) => (ent.tryOpen ? verb : 'Use');
  I.add('open', {
    prompt: ent => doorVerb(ent, 'Open'),
    run(g, ent, def, done) { if (!ent.tryOpen) { ent.state.open = true; done(true); return; } done(!ent.state.open && ent.tryOpen(g)); },
  });
  I.add('close', {
    prompt: ent => doorVerb(ent, 'Close'),
    run(g, ent, def, done) { if (ent.setOpen && ent.state.open) { ent.setOpen(g, false); done(true); } else done(false); },
  });
  I.add('toggle', {
    prompt: ent => (ent.state.open ? 'Close' : ent.state.locked ? 'Unlock' : 'Open'),
    run(g, ent, def, done) {
      if (!ent.setOpen) { ent.state.open = !ent.state.open; done(true); return; }
      if (ent.state.open) { ent.setOpen(g, false); done(true); } else done(ent.tryOpen(g));
    },
  });
  A.add('open', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.tryOpen) { if (a.force && e.state.locked) e.unlock(g); e.tryOpen(g, true); } });
  A.add('close', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.setOpen) e.setOpen(g, false); });
  A.add('toggle', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.setOpen) { if (e.state.open) e.setOpen(g, false); else e.tryOpen(g, true); } });
  A.add('unlock', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.unlock) e.unlock(g); });
  A.add('lock', (g, a, ctx) => { const e = T(g, a, ctx); if (e && e.lock) { e.setOpen(g, false); e.lock(g); } });
  GK.Conditions.add('open', (g, v) => { const e = g.world && g.world.get(v); return !!(e && e.state.open); });

  GK.Mechanics.add('world-objects', {});
})();

</script>
<script>/* mechanics/npcs/npcs.js */
/* Game Kit · mechanics/npcs   (needs: dialogue; spatial game types only)
   Simple NPCs: face the player when near, talk (lines or branching dialogue), optional patrol along
   `path: [[x,z], …]` or a world route `route: 'name'`. NPCs get a fixed round collider (`radius`) so
   turning never pushes them into the player. Future NPC kinds (guards, enemies…) = new prefabs / mechanics. */
(function () {
  'use strict';
  const U = GK.util, P = GK.Prefabs;
  P.add('npc', {
    defaults: { model: 'person', solid: true, faceRange: 5, speed: 1.2, wait: 1 },
    init(ent, game) {
      const d = ent.def;
      if (ent.label == null && ent.name) ent.label = ent.name;
      if (!ent.interact.length && (d.talk || d.lines || d.dialog)) {
        ent.interact.push(U.merge({ type: 'talk' }, d.talk || { lines: d.lines, dialog: d.dialog }));
      }
      ent.path = d.route ? (ent.world.routes[d.route] || []).map(p => p.slice()) : (d.path || []).map(p => ent.world.toPos(Array.isArray(p) ? { pos: p } : typeof p === 'string' ? { at: p } : p));
      if (d.route && !ent.world.routes[d.route]) ent.world.problem('NPC "' + ent.id + '": unknown route "' + d.route + '". This world has: ' + Object.keys(ent.world.routes).join(', '));
      if (ent.path.length && !d.pos && !d.cell && !d.at) ent.pos = ent.path[0].slice();
      if (!ent.radius && ent.shape) { const b = ent.shape.bounds; ent.radius = Math.max(b.max[0] - b.min[0], b.max[2] - b.min[2]) / 2 * Math.max(ent.scale[0], ent.scale[2]); }
      ent.pathI = 0; ent.waitT = 0;
    },
    update(ent, dt, game) {
      const p = game.player.pos, dx = p[0] - ent.pos[0], dz = p[2] - ent.pos[2], dist = Math.hypot(dx, dz);
      const talking = game.talkingTo === ent;
      let targetYaw = null;
      if (ent.path.length && !talking && dist > 2) {
        if (ent.waitT > 0) ent.waitT -= dt;
        else {
          const t = ent.path[ent.pathI], mx = t[0] - ent.pos[0], mz = t[2] - ent.pos[2], ml = Math.hypot(mx, mz);
          const stepLen = ent.def.speed * dt;
          if (ml <= stepLen) { ent.pos[0] = t[0]; ent.pos[2] = t[2]; ent.pathI = (ent.pathI + 1) % ent.path.length; ent.waitT = ent.def.wait; }
          else { ent.pos[0] += mx / ml * stepLen; ent.pos[2] += mz / ml * stepLen; targetYaw = Math.atan2(mx, mz); }
          ent.offset[1] = targetYaw != null ? Math.abs(Math.sin(ent.t * 8)) * 0.04 : 0;
        }
      }
      if ((dist < ent.def.faceRange || talking) && targetYaw == null) targetYaw = Math.atan2(dx, dz);
      if (targetYaw != null) {
        let dy = targetYaw - ent.yaw;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        ent.yaw += dy * Math.min(1, dt * 6);
      }
    },
  });

  GK.Mechanics.add('npcs', {});
})();

</script>
<script>/* mechanics/sequences/sequences.js */
/* Game Kit · mechanics/sequences   (needs: interaction)
   "Use these things in the right order" (colour codes, switch puzzles, combination levers).
   Config:  sequences: { id: {steps: ['entityA', 'entityB', …], onComplete, onWrong, once: true} }
   Emits sequence:step / sequence:complete / sequence:wrong; state.sequences[id] counts completions
   (used by the `sequence` objective type). */
(function () {
  'use strict';
  GK.Mechanics.add('sequences', {
    configKeys: ['sequences'],
    restore(game) { for (const id in game.sequenceProgress) game.sequenceProgress[id].done = !!game.state.sequences[id]; },
    validate(game, report) {
      const seqs = game.cfg.sequences || {};
      for (const id in seqs) {
        const steps = seqs[id].steps || [], missing = steps.filter(s => game.world && !game.world.get(s));
        if (game.sceneMode && missing.length === steps.length) continue;   // a sequence of another scene
        for (const s of missing) report('Sequence "' + id + '": no entity "' + s + '"', 'error');
      }
    },
    setup(game) {
      game.state.sequences = {};
      game.sequenceProgress = {};
      const seqs = game.cfg.sequences || {};
      for (const id in seqs) {
        const S = seqs[id], st = game.sequenceProgress[id] = { i: 0, done: false };
        game.on('interact', e => {
          if (st.done && S.once !== false) return;
          if (S.steps.indexOf(e.id) < 0) return;
          if (e.id === S.steps[st.i]) {
            st.i++;
            game.emit('sequence:step', { id, step: st.i });
            if (st.i === S.steps.length) {
              st.done = true; st.i = 0;
              game.state.sequences[id] = (game.state.sequences[id] || 0) + 1;
              game.audio.play('success');
              GK.run(game, S.onComplete);
              game.emit('sequence:complete', { id });
              if (game.missions) game.missions.check();
            }
          } else {
            st.i = e.id === S.steps[0] ? 1 : 0;
            game.audio.play('wrong');
            GK.run(game, S.onWrong);
            game.emit('sequence:wrong', { id });
          }
        });
      }
    },
  });
})();

</script>
<script>/* mechanics/hazards/hazards.js */
/* Game Kit · mechanics/hazards   (spatial game types only)
   Enemies and traps: things that hurt on touch (viruses, bugs, drones, lasers…), pulsing floor traps (spark
   pads), enemies that chase you, turrets that shoot, and bosses. Use with config.player.health + respawnOnDeath.
     { id, type: 'hazard', model: 'virus', route: 'worldRoute' | path: [[x,z], 'location', …],
       speed: 2, wait: 0.3, damage: 25, onHit: [actions], label, points: 50,
       hp: 3,                                         // can be shot (mechanics/weapons): hits needed to defeat it
       squash: true, respawn: 20,                     // with a shield power-up, touching it defeats it; comes back
       chase: 8, chaseSpeed: 3,                       // runs at you when you are this close and it can see you
       shoots: { every: 2, range: 16, speed: 10, damage: 10, color },   // fires bolts at you (turrets, bosses)
       pulse: [on, off], phase: 0,                    // a trap that is dangerous for `on` s, then safe for `off` s
       boss: true, engage: 30, armor: condition,      // boss bar at the top; immune while `armor` is true
       summon: { every: 8, ids: ['m1', 'm2'], max: 3 },  // a boss brings hidden `minion: true` hazards back to life
       rage: { below: 0.5, speed: 1.5 },              // faster (and shoots faster) under half health
       onDefeat: [actions], contactEvery: 1, knockback: 5 }
   Touching one costs `damage` health (again every `contactEvery` s while touching), knocks you back, flashes the
   screen, runs onHit and emits hazard:hit {id}. Defeating one (shot or squashed) gives `points` and emits
   hazard:defeated {id} and "defeated:<tag>" for each tag (squashing also emits hazard:squashed / "squashed:<tag>").
   Objective {type: 'defeat', tag, count} counts defeats and points at the nearest enemy with that tag.
   With the powerups mechanic: a shield blocks damage (and squashes `squash` hazards); freeze stops every hazard.
   Adds game.hurtPlayer(amount, sourceEntity), game.hitHazard(entity, damage), game.defeatHazard(entity) and the
   condition {hp: {id, lte}}.
   Disable or remove one ({do:'disable'} / {do:'remove'}) to make it safe.
   Difficulty (config.difficulty, the chosen choice's options):
     enemies: 0.5     keep this share of the ordinary enemies (shootable, harmful, not bosses / minions / crates) in
                      each scene: every other one starts removed (hidden waves too). A tag that a 'defeat' objective
                      counts keeps at least that share of its enemies (rounded up), and the objective needs that share.
     bossDamage: 3    shots do this many times their damage to bosses (phase thresholds keep working)
     summons: 0.5     bosses keep at most this share of their minions alive (at least 1)
   Without these options (or with the value 1) nothing changes. */
(function () {
  'use strict';
  const P = GK.Prefabs, V = GK.vec, Ph = GK.Physics, U = GK.util, FROZEN = '#9fd8ff';

  /** Everything that blocks enemies and their line of sight this frame (walls, closed doors, solid props). */
  function solidsOf(g) {
    if (!g.hzSolids || g.hzSolidsAt !== g.state.time) { g.hzSolids = g.world.solids(); g.hzSolidsAt = g.state.time; }
    return g.hzSolids;
  }
  function clearLine(g, a, b) {
    const d = V.sub(b, a), dist = V.len(d);
    if (dist < 0.01) return true;
    const dir = V.scale(d, 1 / dist);
    for (const s of solidsOf(g)) { const t = Ph.rayBox(a, dir, s); if (t > 0 && t < dist - 0.25) return false; }
    return true;
  }
  /** Walk an enemy toward (x, z) with wall collision. Returns the distance left. */
  function walk(ent, g, x, z, speed, dt) {
    const b = ent.body;
    b.pos = ent.pos;
    const dx = x - ent.pos[0], dz = z - ent.pos[2], l = Math.hypot(dx, dz);
    if (l < 0.05) return l;
    const v = Math.min(speed, l / Math.max(dt, 1e-4));
    b.vel[0] = dx / l * v; b.vel[1] = 0; b.vel[2] = dz / l * v;
    const y = ent.pos[1];
    Ph.move(solidsOf(g), b, dt);
    ent.pos[1] = y;   // enemies keep their height (they float or crawl at one level)
    if (ent.def.faceTravel) ent.yaw = Math.atan2(dx, dz);
    return Math.hypot(x - ent.pos[0], z - ent.pos[2]);
  }
  /** Where an enemy looks and shoots from: near the top of its model (low centres clip low scenery). */
  function eyeOf(ent) { const b = ent.box(true); return [(b.min[0] + b.max[0]) / 2, Math.max(b.min[1] + 0.3, b.max[1] - 0.35), (b.min[2] + b.max[2]) / 2]; }
  function defeat(ent, g, how) {
    const d = ent.def;
    if (ent.state.dead || ent.removed) return;
    if (d.points) g.scoring.add(d.points, (ent.name || 'enemy') + (how === 'squash' ? ' squashed' : ' defeated'), 'bonus');
    g.audio.play(how === 'squash' ? 'success' : 'boom');
    if (g.burst) g.burst(ent.center(), d.burst || (ent.look && ent.look.color) || '#ff4d6d', d.boss ? 30 : 10);
    if (how === 'squash') { g.ui.flash('#ffffff'); g.ui.toast('SQUASHED! +' + d.points, 'good'); }
    if (d.boss) { g.ui.setBoss(null); g.ui.toast('💥 ' + (ent.name || 'Boss') + ' DEFEATED! +' + d.points, 'good'); if (g.shake) g.shake(0.8, 0.25); }
    g.emit('hazard:defeated', { id: ent.id });
    for (const t of ent.tags) g.emit('defeated:' + t, {});
    if (how === 'squash') {
      g.emit('hazard:squashed', { id: ent.id });
      for (const t of ent.tags) g.emit('squashed:' + t, {});
    }
    ent.state.dead = true;
    ent.chasing = false;
    if (d.respawn) { ent.hide(); g.later(d.respawn, () => revive(ent)); }
    else if (d.minion) ent.hide();
    else ent.remove();
    if (d.onDefeat) GK.run(g, d.onDefeat, { entity: ent });
    if (g.missions) g.missions.check();
  }
  /** Which ordinary enemies a difficulty leaves out, worked out once from the whole config (every scene), so a
      scene, a restore and a resume always agree: {drop: {id: true}, ratio: {tag: kept / total}}. */
  function thinPlan(game) {
    const share = Number(game.difficultyOpts ? game.difficultyOpts().enemies : 1);
    const key = game.difficulty + ':' + share;
    if (game.hzPlan && game.hzPlan.key === key) return game.hzPlan;
    const plan = { key, drop: {}, ratio: {} };
    game.hzPlan = plan;
    if (!(share > 0 && share < 1)) return plan;
    const base = game.base, tpls = base.templates || {}, defs = P.get('hazard').defaults;
    const stages = base.scenes || base.levels || [];
    const lists = [base.entities].concat(stages.map(s => s.entities));
    const counted = {};   // tags that 'defeat' objectives count (other than the catch-all 'enemy')
    for (const o of U.list(base.objectives).concat(...stages.map(s => U.list(s.objectives)))) if (o && o.type === 'defeat' && o.tag !== 'enemy') counted[o.tag] = true;
    const all = [], byTag = {};
    for (const list of lists) {
      let i = 0;
      for (const raw of U.list(list)) {
        if (!raw || typeof raw !== 'object') continue;
        const e = Object.assign({}, defs, raw.use ? tpls[raw.use] : null, raw);
        if (e.type !== 'hazard' || !(e.hp > 0) || e.boss || e.minion || e.solid || !(e.damage > 0 || e.shoots)) continue;
        // keep ceil(n · share) in each scene, spread out: the 1st, 3rd, 5th… for a half
        const m = { id: e.id, tags: U.list(e.tags), keep: !e.id || Math.ceil((i + 1) * share) > Math.ceil(i * share) };
        i++;
        all.push(m);
        for (const t of m.tags) (byTag[t] = byTag[t] || []).push(m);
      }
    }
    // a counted group never drops below its share, so its objective stays possible
    for (const t in counted) {
      const ms = byTag[t] || [], want = Math.ceil(ms.length * share);
      let kept = ms.filter(m => m.keep).length;
      for (const m of ms) { if (kept >= want) break; if (!m.keep) { m.keep = true; kept++; } }
    }
    for (const m of all) if (!m.keep) plan.drop[m.id] = true;
    for (const t in byTag) plan.ratio[t] = byTag[t].filter(m => m.keep).length / byTag[t].length;
    return plan;
  }
  function revive(ent, at) {
    if (ent.removed) return;
    ent.state.dead = false;
    ent.state.hp = ent.def.hp || 0;
    ent.chasing = false; ent.returning = false; ent.touching = false;
    if (at) ent.pos = at.slice(); else if (ent.def.chase && !ent.path.length) ent.pos = ent.home.slice();
    ent.show();
  }
  function contact(ent, g) {
    const d = ent.def;
    if (!ent.enabled || !ent.active || ent.state.off || ent.state.dead || g.state.mode !== 'playing') return;
    if (!d.damage && !d.squash) return;   // harmless (practice targets)
    ent.contactT = d.contactEvery || 1;
    if (g.shielded && g.shielded()) {
      if (d.squash) defeat(ent, g, 'squash'); else g.audio.play('blocked');
      return;
    }
    if (g.hurtPlayer(d.damage, ent)) {
      g.emit('hazard:hit', { id: ent.id });
      if (d.onHit) GK.run(g, d.onHit, { entity: ent });
    }
  }

  P.add('hazard', {
    defaults: { model: 'virus', solid: false, speed: 2, wait: 0.3, damage: 25, bob: 0.12, faceTravel: true, points: 50, hp: 0, contactEvery: 1, knockback: 5 },
    init(ent, game) {
      const d = ent.def, w = ent.world;
      ent.path = d.route ? (w.routes[d.route] || []).map(p => p.slice())
        : (d.path || []).map(p => w.toPos(Array.isArray(p) ? { pos: p } : typeof p === 'string' ? { at: p } : p));
      if (d.route && !w.routes[d.route]) w.problem('Hazard "' + ent.id + '": unknown route "' + d.route + '". This world has: ' + Object.keys(w.routes).join(', '));
      if (d.summon) for (const id of d.summon.ids || []) if (!w.byId[id] && !(game.cfg.entities || []).some(e => e.id === id)) w.problem('Hazard "' + ent.id + '": summons unknown "' + id + '"');
      if (ent.path.length && !d.pos && !d.cell && !d.at) ent.pos = ent.path[0].slice();
      if (ent.state.pathI == null) ent.state.pathI = 0;
      if (ent.state.hp == null) ent.state.hp = d.hp || 0;
      ent.home = ent.pos.slice();
      ent.body = { pos: ent.pos, vel: [0, 0, 0], r: d.bodyRadius || 0.4, h: 0.8, step: 0.45, grounded: true };
      ent.waitT = 0; ent.contactT = 0; ent.aiT = Math.random() * 0.2; ent.lostT = 0;
      ent.shootT = d.shoots ? (d.shoots.every || 2) * (0.5 + Math.random() * 0.5) : 0;
      ent.summonT = d.summon ? (d.summon.first != null ? d.summon.first : d.summon.every || 8) : 0;
      if (d.pulse) { ent.state.off = false; ent.pulseT = d.pulse[0] - (d.phase || 0); }
      ent.onTouch = g => contact(ent, g);
      if (thinPlan(game).drop[ent.id]) ent.removed = true;   // an easier difficulty: fewer enemies
      if (d.solid) {   // a solid hazard (a loot crate, a barrier): it blocks the player, but shots treat it as a target
        const base = GK.Entity.prototype.collider;
        ent.collider = function () { const b = base.call(this); b.hazard = true; return b; };
      }
    },
    restore(ent) { ent.home = ent.home || ent.pos.slice(); ent.chasing = false; ent.returning = false; },
    update(ent, dt, game) {
      const d = ent.def, g = game;
      if (!ent.enabled || !ent.active || ent.state.dead || g.state.mode !== 'playing') return;
      if (g.frozen && g.frozen()) { ent.tint = FROZEN; return; }
      if (ent.tint === FROZEN) ent.tint = null;
      if (d.pulse) {   // dangerous for pulse[0] seconds, then safe for pulse[1] seconds
        ent.pulseT -= dt;
        if (ent.pulseT <= 0) {
          ent.state.off = !ent.state.off;
          ent.pulseT = d.pulse[ent.state.off ? 1 : 0];
          ent.setLook({ off: ent.state.off });
          if (!ent.state.off) ent.touching = false;   // standing on it when it switches on still hurts
        }
      }
      if (ent.touching && !ent.state.off) { ent.contactT -= dt; if (ent.contactT <= 0) contact(ent, g); }

      // senses: distance to the player and line of sight, a few times a second
      const pl = g.player, eye = pl.eye();
      const range = Math.max(d.chase || 0, d.shoots ? d.shoots.range || 16 : 0, d.boss ? d.engage || 30 : 0);
      if (range) {
        ent.aiT -= dt;
        if (ent.aiT <= 0) {
          ent.aiT = 0.2;
          ent.dist = Math.hypot(eye[0] - ent.pos[0], eye[2] - ent.pos[2]);
          ent.sees = ent.dist <= range && Math.abs(eye[1] - ent.pos[1]) < 6 && clearLine(g, eyeOf(ent), [eye[0], eye[1] - 0.25, eye[2]]);
          if (d.boss && ent.sees) ent.state.engaged = true;
          if (d.chase) {
            if (ent.sees && ent.dist <= d.chase) { ent.chasing = true; ent.lostT = 0; }
            else if (ent.chasing) {
              ent.lostT += 0.2;
              if (ent.lostT > 2.5 || ent.dist > d.chase * 1.8) { ent.chasing = false; ent.returning = true; ent.stuckT = 0; }
            }
          }
        }
      }
      const rage = d.rage && d.hp && ent.state.hp <= d.hp * (d.rage.below || 0.5) ? d.rage : null;
      const mul = rage ? rage.speed || 1.5 : 1;

      // movement: chase · go back to the patrol · patrol
      if (ent.chasing) {
        walk(ent, g, pl.pos[0], pl.pos[2], (d.chaseSpeed || d.speed * 1.3) * mul, dt);
        ent.yaw = Math.atan2(pl.pos[0] - ent.pos[0], pl.pos[2] - ent.pos[2]);
      } else if (ent.returning) {
        const t = ent.path.length ? ent.path[ent.state.pathI % ent.path.length] : ent.home;
        const before = Math.hypot(t[0] - ent.pos[0], t[2] - ent.pos[2]);
        const left = walk(ent, g, t[0], t[2], d.speed * mul, dt);
        ent.stuckT = before - left < 0.2 * d.speed * dt ? (ent.stuckT || 0) + dt : 0;
        if (left < 0.3 || ent.stuckT > 1.5) { if (left >= 0.3) { ent.pos[0] = t[0]; ent.pos[2] = t[2]; } ent.returning = false; }
      } else if (ent.path.length) {
        if (ent.waitT > 0) ent.waitT -= dt;
        else {
          const t = ent.path[ent.state.pathI % ent.path.length], mx = t[0] - ent.pos[0], mz = t[2] - ent.pos[2], ml = Math.hypot(mx, mz);
          const step = d.speed * mul * dt;
          if (ml <= step) {
            ent.pos[0] = t[0]; ent.pos[2] = t[2];
            ent.state.pathI = (ent.state.pathI + 1) % ent.path.length;
            ent.waitT = d.wait;
          } else {
            ent.pos[0] += mx / ml * step; ent.pos[2] += mz / ml * step;
            if (d.faceTravel) ent.yaw = Math.atan2(mx, mz);
          }
        }
      }

      // shooting (turrets, bosses, ranged enemies)
      if (d.shoots && g.enemyFire && ent.sees && ent.dist <= (d.shoots.range || 16)) {
        if (!ent.chasing && !ent.path.length) ent.yaw = Math.atan2(eye[0] - ent.pos[0], eye[2] - ent.pos[2]);
        ent.shootT -= dt * (rage ? 1.6 : 1);
        if (ent.shootT <= 0) {
          ent.shootT = (d.shoots.every || 2) * (0.85 + Math.random() * 0.3);
          const c = eyeOf(ent);
          g.enemyFire(ent, c, [eye[0], eye[1] - 0.25, eye[2]], d.shoots);   // the same line it saw you along
        }
      }

      // bosses bring their minions back
      if (d.summon && ent.state.engaged && !(d.armor !== undefined && d.summon.whileArmored === false && GK.test(g, d.armor))) {
        ent.summonT -= dt * (rage ? 1.5 : 1);
        if (ent.summonT <= 0) {
          ent.summonT = d.summon.every || 8;
          const mins = (d.summon.ids || []).map(id => g.world.get(id)).filter(Boolean);
          const alive = mins.filter(m => m.active && !m.state.dead).length;
          const free = mins.find(m => !m.removed && (!m.active || m.state.dead));
          const share = Number(g.difficultyOpts ? g.difficultyOpts().summons : 1);
          const max = share > 0 && share < 1 ? Math.max(1, Math.ceil((d.summon.max || 3) * share)) : (d.summon.max || 3);
          if (free && alive < max) {
            const a = Math.random() * Math.PI * 2, r = d.summon.radius || 2.5;
            revive(free, [ent.pos[0] + Math.cos(a) * r, free.home[1], ent.pos[2] + Math.sin(a) * r]);
            free.enabled = true; free.chasing = !!free.def.chase;
            if (g.burst) g.burst(free.center(), '#a855f7', 8);
            g.emit('hazard:summoned', { id: free.id });
          }
        }
      }
    },
  });

  // {hp: {id: 'boss', lte: 10}} — an enemy's health (e.g. a boss changes phase); false once it is gone
  GK.Conditions.add('hp', (g, v) => { const e = g.world && g.world.get(v.id); return !!e && !e.removed && GK.compare(e.state.hp, v); });

  // {type:'defeat', tag:'bug', count:5} — counts defeated enemies with that tag; the marker points at the nearest one
  GK.Objectives.add('defeat', {
    need(o, g) {
      const n = o.count || 1, r = g ? thinPlan(g).ratio[o.tag] : undefined;
      return r !== undefined && r < 1 ? Math.max(1, Math.ceil(n * r)) : n;
    },
    progress: (o, g) => g.state.events['defeated:' + o.tag] || 0,
    target(o, g, from) {
      if (!g.world) return null;
      let best = null, bd = Infinity;
      for (const e of g.world.entities) {
        if (e.type !== 'hazard' || !e.active || e.state.dead || e.tags.indexOf(o.tag) < 0) continue;
        const dd = V.dist(e.pos, from);
        if (dd < bd) { bd = dd; best = e.top(); }
      }
      return best;
    },
  });

  GK.Mechanics.add('hazards', {
    setup(game) {
      game.hurtCD = 0;
      game.ui.setBoss(null);
      /** Hurt the player (enemy touch, enemy bolt, trap). Blocked by a shield; short safe time after each hit. */
      game.hurtPlayer = (amount, src) => {
        const g = game;
        if (g.state.mode !== 'playing' || g.hurtCD > 0) return false;
        if (g.shielded && g.shielded()) { g.audio.play('blocked'); return false; }
        g.hurtCD = 0.5;
        if (amount && g.player.health != null) g.player.damage(amount);
        g.audio.play('hurt');
        g.ui.flash('#ff2d55');
        if (g.shake) g.shake(0.3, 0.14);
        const kb = src && src.def && src.def.knockback;
        if (kb && src.pos) {
          const dx = g.player.pos[0] - src.pos[0], dz = g.player.pos[2] - src.pos[2], l = Math.hypot(dx, dz) || 1;
          g.player.vel[0] += dx / l * kb; g.player.vel[2] += dz / l * kb;
          if (g.player.grounded) g.player.vel[1] = 3;
        }
        g.emit('player:hit', { id: src && src.id });
        return true;
      };
      /** A shot hit an enemy: 'defeated' | 'hit' | 'blocked' (armoured / cannot be shot). */
      game.hitHazard = (ent, damage) => {
        const d = ent.def;
        if (!ent.active || ent.state.dead) return 'miss';
        if (d.boss) ent.state.engaged = true;
        if (!d.hp || (d.armor !== undefined && GK.test(game, d.armor))) { ent.hi = 0.35; game.audio.play('blocked'); return 'blocked'; }
        const mul = d.boss ? Number(game.difficultyOpts ? game.difficultyOpts().bossDamage : 1) : 1;
        ent.state.hp -= (damage || 1) * (mul > 0 ? mul : 1);
        ent.hi = 0.9;
        if (d.chase) ent.chasing = true;
        if (d.boss) ent.state.engaged = true;
        game.emit('hazard:damaged', { id: ent.id });
        if (ent.state.hp <= 0) { defeat(ent, game, 'shot'); return 'defeated'; }
        game.audio.play('hit');
        return 'hit';
      };
      game.defeatHazard = (ent, how) => defeat(ent, game, how || 'shot');
      game.on('player:respawn', () => { for (const e of game.world.entities) if (e.type === 'hazard' && e.chasing) { e.chasing = false; e.returning = true; e.stuckT = 0; } });
    },
    update(game, dt) {
      if (game.hurtCD > 0) game.hurtCD -= dt;
      // boss bar: the nearest engaged boss
      let boss = null, bd = Infinity;
      for (const e of game.world.entities) {
        if (e.type !== 'hazard' || !e.def.boss || !e.active || e.state.dead || !e.state.engaged) continue;
        const dd = V.dist(e.pos, game.player.pos);
        if (dd < bd) { bd = dd; boss = e; }
      }
      game.ui.setBoss(boss ? { name: boss.name || 'Boss', hp: Math.max(0, boss.state.hp), max: boss.def.hp || 1, shielded: boss.def.armor !== undefined && GK.test(game, boss.def.armor) } : null);
    },
  });
})();

</script>
<script>/* mechanics/powerups/powerups.js */
/* Game Kit · mechanics/powerups   (spatial game types only)
   Floating power-ups you pick up by touch. Each one gives a power for a few seconds:
     speed  — run 60% faster              shield — hazards cannot hurt you (and you can squash `squash` hazards)
     freeze — every hazard stops moving   double — good points count twice
     heal   — +50 health at once        rapid  — the weapon (mechanics/weapons) fires twice as fast, for free
   Entity: { type: 'powerup', power: 'shield', duration: 12, respawn: 30, points: 10 }
     respawn: seconds until it comes back (0 = once only) — good for competitive replays.
   Adds game.activatePower(name, seconds), game.hasPower(name), game.shielded(), game.frozen(),
   game.scoreMultiplier() (used by core scoring), state.powers {name: secondsLeft}, event powerup {id, power},
   condition {power: 'shield'}. Active powers show as chips under the score. */
(function () {
  'use strict';
  const P = GK.Prefabs;
  const KINDS = GK.PowerUps = {
    speed: { label: '⚡ SPEED', color: '#f5b700', duration: 10 },
    shield: { label: '🛡 SHIELD', color: '#4cc9f0', duration: 12 },
    freeze: { label: '❄ FREEZE', color: '#a5f3fc', duration: 8 },
    double: { label: '✖2 POINTS', color: '#2ecc71', duration: 15 },
    heal: { label: '❤ HEAL', color: '#ff6b81', duration: 0 },
    rapid: { label: '🔥 RAPID FIRE', color: '#ff7a1a', duration: 12 },
  };

  P.add('powerup', {
    defaults: { model: 'powerup', solid: false, hover: 1.0, spin: 2.4, bob: 0.15, touch: true, power: 'speed', respawn: 0, points: 10 },
    init(ent) {
      const k = KINDS[ent.def.power];
      if (!k) { ent.world.problem('Power-up "' + ent.id + '": unknown power "' + ent.def.power + '" (' + Object.keys(KINDS).join(', ') + ')'); return; }
      if (!ent.def.color && !(ent.def.look && ent.def.look.color)) ent.setLook({ color: k.color });
      if (ent.label == null) ent.label = k.label;
      if (!ent.name) ent.name = k.label;
      ent.onTouch = g => {
        if (!ent.active || g.state.mode !== 'playing') return;
        g.activatePower(ent.def.power, ent.def.duration, ent);
        if (ent.def.respawn) { ent.hide(); g.later(ent.def.respawn, () => { if (!ent.removed) ent.show(); }); } else ent.remove();
      };
    },
  });

  GK.Conditions.add('power', (g, v) => !!(g.hasPower && g.hasPower(v)));
  GK.Actions.add('power', (g, a) => g.activatePower && g.activatePower(a.power, a.seconds));   // {do:'power', power:'shield', seconds: 15}

  GK.Mechanics.add('powerups', {
    setup(game) {
      game.state.powers = {};
      game.activatePower = (name, seconds, ent) => {
        const k = KINDS[name];
        if (!k) return;
        if (name === 'heal') { if (game.player && game.player.health != null) game.player.heal(50); }
        else game.state.powers[name] = Math.max(game.state.powers[name] || 0, seconds || k.duration);
        if (ent && ent.def.points) game.scoring.add(ent.def.points, 'Power-up', 'bonus');
        game.audio.play('checkpoint');
        game.ui.flash(k.color);
        game.ui.toast(k.label + (name === 'heal' ? '!' : ' for ' + (seconds || k.duration) + ' seconds!'), 'good');
        game.emit('powerup', { id: ent ? ent.id : null, power: name });
      };
      game.hasPower = name => (game.state.powers[name] || 0) > 0;
      game.shielded = () => game.hasPower('shield');
      game.frozen = () => game.hasPower('freeze');
      game.scoreMultiplier = () => (game.hasPower('double') ? 2 : 1);
      game.ui.setChips([]);
    },
    update(game, dt) {
      const P2 = game.state.powers;
      for (const n in P2) {
        P2[n] -= dt;
        if (P2[n] <= 0) { delete P2[n]; game.ui.toast(KINDS[n].label + ' is over'); }
      }
      if (game.player) game.player.speedMul = game.hasPower('speed') ? 1.6 : 1;
      game.ui.setChips(Object.keys(P2).map(n => ({ text: KINDS[n].label + '  ' + Math.ceil(P2[n]), color: KINDS[n].color })));
    },
    restore(game) { if (!game.state.powers) game.state.powers = {}; },
  });
})();

</script>
<script>/* mechanics/weapons/weapons.js */
/* Game Kit · mechanics/weapons   (spatial game types; made for first-person-3d)
   Tools the player shoots with — zappers, blasters, paint guns… — with LIMITED AMMO, reloading, several weapon
   types, COINS and a SHOP to buy more.
     arsenal: {
       weapons: [{ id, name, model, look, color, icon, desc,
                   damage: 1, cooldown: 0.22, speed: 30, range: 45, boltSize: 0.11,
                   mag: 12, reserve: 48, maxReserve: 120, reload: 1.2,     // magazine, spare ammo, reload seconds
                   pellets: 1, spread: 0,                                  // several bolts at once (scatter)
                   splash: 0,                                              // explodes: hurts every enemy this close
                   pierce: false,                                          // goes through enemies
                   price: 0, ammoPrice: 20, ammoPack: 24 }, …],            // shop: buy it, buy a pack of ammo
       start: 'zapper', requires: {has: 'zapper'},                         // owned at the start; usable once true
       coins: 0, objectiveCoins: 15, dropChance: 0.35,                     // coins for each objective; ammo drops
       extras: [{ id, name, icon, desc, price, actions }] }                // other things to buy (heal, shield…)
     weapon: {…}  — the old single-weapon form still works (one weapon, owned from the start).
   Controls: click / hold the mouse / hold Q = fire · R = reload · 1-5 or the mouse wheel = switch weapon.
   An empty magazine reloads by itself if there is spare ammo. Coins come from defeated enemies (their `coins`, or
   points ÷ 4), objectives, coin pickups and loot crates; spend them at a shop: { interact: { type: 'shop' } }.
   Pickups: { type: 'pickup', kind: 'ammo' | 'coins' | 'health', amount, respawn }. Enemies sometimes drop ammo.
   Bolts stop at walls and damage hazards with `hp` (mechanics/hazards: game.hitHazard). Hazards with `shoots` fire
   enemy bolts through game.enemyFire(); they hurt the player through game.hurtPlayer. Power-up 'rapid' doubles the
   fire rate and uses no ammo. game.burst(pos, color, n) = a burst of glowing sparks.
   Adds game.fire(), game.reload(instant), game.selectWeapon(id | slot), game.giveWeapon(id), game.addAmmo(n),
   game.addCoins(n), game.coins(), game.buy(id), game.openShop(), game.armed(), game.weaponState().
   Conditions {coins: {gte}}, {weapon: 'id'}; actions {do:'coins', add}, {do:'giveWeapon', weapon}, {do:'ammo', amount},
   {do:'shop'}. Events weapon:fire / hit / reload / switch, shop:open, shop:buy {id}, coins.
   Bolts, sparks and loot come from small pools made once per scene (ids fx-…), so snapshot/restore keep working. */
(function () {
  'use strict';
  const V = GK.vec, Ph = GK.Physics, U = GK.util;
  const POOL = { bolt: 16, enemy: 12, spark: 32, loot: 8 };
  const WDEF = { name: 'Zapper', model: 'zapper', color: '#4cc9f0', icon: '⚡', damage: 1, cooldown: 0.22, speed: 30, range: 45, boltSize: 0.11,
    mag: 12, reserve: 48, maxReserve: 120, reload: 1.2, pellets: 1, spread: 0, splash: 0, pierce: false, price: 0, ammoPrice: 20, ammoPack: 24 };
  const PICKUP = { ammo: { model: 'ammoBox', color: '#f5b700', amount: 1 }, coins: { model: 'coinStack', color: '#f5d76e', amount: 10 }, health: { model: 'healthPack', color: '#ff6b81', amount: 30 } };

  GK.Prefabs.add('fx', { defaults: { solid: false, visible: false } });
  GK.Prefabs.add('pickup', {
    defaults: { solid: false, kind: 'ammo', hover: 0.35, spin: 2, bob: 0.1, respawn: 0 },
    init(ent) {
      const k = PICKUP[ent.def.kind] || PICKUP.ammo;
      if (!ent.def.model) ent.setModel(k.model, ent.def.look);
      ent.onTouch = g => { if (ent.active && g.state.mode === 'playing' && g.takePickup) g.takePickup(ent); };
    },
  });

  function solids(g) {
    if (!g.hzSolids || g.hzSolidsAt !== g.state.time) { g.hzSolids = g.world.solids(); g.hzSolidsAt = g.state.time; }
    return g.hzSolids;
  }
  /** Nearest wall along a segment (t, or Infinity). Solid hazards (crates) are hit as enemies, not walls. */
  function wallAt(g, o, dir, max) {
    let best = Infinity;
    for (const s of solids(g)) { if (s.hazard) continue; const t = Ph.rayBox(o, dir, s); if (t > 0 && t < max && t < best) best = t; }
    return best;
  }
  function enemyAt(g, o, dir, max, skip) {
    let best = { t: Infinity, e: null };
    for (const e of g.world.entities) {
      if (e.type !== 'hazard' || !e.active || e.state.dead || !e.def.hp || (skip && skip.has(e.id))) continue;   // traps without hp do not stop shots
      const b = e.pickBox();
      for (let i = 0; i < 3; i++) { b.min[i] -= 0.2; b.max[i] += 0.2; }   // a little aim help for young players
      const t = Ph.rayBox(o, dir, b);
      if (t >= 0 && t < max && t < best.t) best = { t, e };
    }
    return best;
  }
  function take(list) { return list.find(e => !e.visible) || null; }

  function config(game) {
    const c = game.cfg;
    const A = c.arsenal ? U.merge(c.arsenal) : { weapons: [c.weapon || {}], requires: c.weapon && c.weapon.requires };
    A.weapons = U.list(A.weapons).map((w, i) => Object.assign({}, WDEF, { id: w.id || ('weapon' + (i + 1)) }, w));
    A.byId = {}; A.weapons.forEach(w => { A.byId[w.id] = w; });
    A.start = A.start || A.weapons[0].id;
    A.objectiveCoins = A.objectiveCoins == null ? 15 : A.objectiveCoins;
    A.dropChance = A.dropChance == null ? 0.35 : A.dropChance;
    A.extras = U.list(A.extras);
    return A;
  }

  GK.Interactions.add('shop', { prompt: 'Open the', run(g, ent, def, done) { g.openShop(def, () => done(true)); } });
  GK.Conditions.add('coins', (g, v) => GK.compare(g.coins ? g.coins() : 0, U.isObj(v) ? v : { gte: v }));
  GK.Conditions.add('weapon', (g, v) => U.list(v).every(id => !!(g.state.arsenal && g.state.arsenal.owned[id])));
  GK.Actions.add('coins', (g, a) => g.addCoins && g.addCoins(a.add || 0));
  GK.Actions.add('giveWeapon', (g, a) => g.giveWeapon && g.giveWeapon(a.weapon));
  GK.Actions.add('ammo', (g, a) => g.addAmmo && g.addAmmo(a.amount));
  GK.Actions.add('shop', (g, a) => g.openShop && g.openShop(a));

  GK.Mechanics.add('weapons', {
    configKeys: ['weapon', 'arsenal'],
    setup(game) {
      const A = game.arsenalCfg = config(game);
      if (!game.state.arsenal) {
        const w = A.byId[A.start];
        game.state.arsenal = { cur: A.start, owned: { [A.start]: { mag: w.mag, res: w.reserve } }, coins: A.coins || 0 };
      }
      const M = game.input.map;
      if (!M.fire) M.fire = ['KeyQ'];
      if (!M.reload) M.reload = ['KeyR'];
      const add = (kind, n, model, look, type) => {
        const out = [];
        for (let i = 1; i <= n; i++) out.push(game.world.add({ id: 'fx-' + kind + i, type: type || 'fx', model, look, visible: false }));
        return out;
      };
      const fx = game.fx = {
        bolts: add('bolt', POOL.bolt, 'bolt', { color: A.weapons[0].color }),
        enemy: add('enemy', POOL.enemy, 'bolt', { color: '#ff4d6d', size: 0.16 }),
        sparks: add('spark', POOL.spark, 'spark', { color: '#ffffff' }),
        loot: add('loot', POOL.loot, 'ammoBox', {}, 'pickup'),
      };
      game.cool = 0; game.kick = 0; game.reloadT = 0; game.emptyT = 0;
      game.ui.setWeapon(null);
      const st = () => game.state.arsenal;
      game.armed = () => A.requires === undefined || GK.test(game, A.requires);
      game.weaponState = () => { const s = st(), w = A.byId[s.cur]; return { def: w, id: s.cur, mag: s.owned[s.cur].mag, res: s.owned[s.cur].res, reloading: game.reloadT > 0 }; };
      game.coins = () => st().coins;
      game.addCoins = (n, at) => {
        if (!n) return;
        st().coins = Math.max(0, st().coins + n);
        if (n > 0) game.ui.coinPop('+' + n);
        game.emit('coins', { amount: n });
      };
      game.giveWeapon = id => {
        const w = A.byId[id];
        if (!w) return false;
        const o = st().owned[id];
        if (o) o.res = Math.min(w.maxReserve, o.res + w.ammoPack);
        else st().owned[id] = { mag: w.mag, res: w.reserve };
        game.selectWeapon(id);
        return true;
      };
      /** Ammo for every weapon you own: `packs` packs each (default half a pack). */
      game.addAmmo = packs => {
        const k = packs == null ? 0.5 : packs;
        for (const id in st().owned) { const w = A.byId[id], o = st().owned[id]; o.res = Math.min(w.maxReserve, o.res + Math.max(1, Math.round(w.ammoPack * k))); }
      };
      game.selectWeapon = ref => {
        const id = typeof ref === 'number' ? (A.weapons[ref - 1] || {}).id : ref;
        if (!id || !st().owned[id] || id === st().cur) return false;
        st().cur = id; game.reloadT = 0; game.cool = 0.25; game.kick = 1;
        game.audio.play('click');
        game.emit('weapon:switch', { id });
        return true;
      };
      game.reload = instant => {
        const s = st(), w = A.byId[s.cur], o = s.owned[s.cur];
        if (o.mag >= w.mag || o.res <= 0 || (game.reloadT > 0 && !instant)) return false;
        if (instant) { const n = Math.min(w.mag - o.mag, o.res); o.mag += n; o.res -= n; game.reloadT = 0; return true; }
        game.reloadT = w.reload; game.reloadMax = w.reload;
        game.audio.play('reload');
        game.emit('weapon:reload', { id: s.cur });
        return true;
      };
      game.burst = (pos, color, n) => {
        for (let i = 0; i < (n || 8); i++) {
          const s = take(fx.sparks);
          if (!s) return;
          if (s.look.color !== color) s.setLook({ color });
          const a = Math.random() * Math.PI * 2, up = Math.random();
          const sp = 2 + Math.random() * 3.5;
          s.pos = pos.slice(); s.v = [Math.cos(a) * sp * (1 - up * 0.5), 1.5 + up * 4, Math.sin(a) * sp * (1 - up * 0.5)];
          s.life = s.maxLife = 0.45 + Math.random() * 0.4;
          s.alpha = 1; s.scale = [1, 1, 1];
          s.show();
        }
      };
      game.enemyFire = (src, from, to, o) => {
        const b = take(fx.enemy);
        if (!b) return;
        o = o || {};
        const dir = V.norm(V.sub(to, from)), sp = o.speed || 10;
        if (o.color && b.look.color !== o.color) b.setLook({ color: o.color, size: 0.16 });
        b.pos = from.slice(); b.v = V.scale(dir, sp); b.life = (o.range || 18) / sp + 0.5; b.dmg = o.damage || 10; b.src = src;
        b.show();
        if (game.lightFlash) game.lightFlash(from, o.color || '#ff4d6d', 4, 0.08);
        game.audio.play('enemyShot');
      };
      game.fire = () => {
        if (!game.armed() || game.state.mode !== 'playing' || game.cool > 0 || game.reloadT > 0) return false;
        const s = st(), w = A.byId[s.cur], o = s.owned[s.cur], rapid = game.hasPower && game.hasPower('rapid');
        if (!rapid && o.mag < 1) {
          if (o.res > 0) game.reload();
          else { game.audio.play('empty'); game.cool = 0.35; if (game.emptyT <= 0) { game.ui.toast('Out of ammo! Find an ammo box or buy ammo at a shop.', 'bad'); game.emptyT = 3; } }
          return false;
        }
        if (!rapid) o.mag -= 1;
        game.cool = w.cooldown * (rapid ? 0.5 : 1);
        const p = game.player, eye = p.eye(), f = p.forward(), yaw = p.yaw;
        // aim where the crosshair points, start at the tip of the tool
        const tWall = wallAt(game, eye, f, w.range), tEnemy = enemyAt(game, eye, f, w.range).t;
        const aim = V.add(eye, V.scale(f, Math.min(tWall, tEnemy, w.range)));
        let start = [eye[0] + f[0] * 0.55 + Math.cos(yaw) * 0.16, eye[1] + f[1] * 0.55 - 0.13, eye[2] + f[2] * 0.55 - Math.sin(yaw) * 0.16];
        let dir = V.norm(V.sub(aim, start));
        // the tip sits beside the eye: if scenery is in its way but not in the crosshair's, shoot along the crosshair
        if (wallAt(game, start, dir, V.dist(start, aim) - 0.3) < Infinity) { start = V.add(eye, V.scale(f, 0.4)); dir = f; }
        for (let i = 0; i < (w.pellets || 1); i++) {
          const b = take(fx.bolts);
          if (!b) break;
          let d = dir;
          if (w.spread) d = V.norm([dir[0] + (Math.random() - 0.5) * w.spread * 2, dir[1] + (Math.random() - 0.5) * w.spread * 2, dir[2] + (Math.random() - 0.5) * w.spread * 2]);
          if (b.look.color !== w.color || b.look.size !== w.boltSize) b.setLook({ color: w.color, size: w.boltSize });
          b.pos = start.slice(); b.v = V.scale(d, w.speed); b.life = w.range / w.speed; b.w = w; b.hits = w.pierce ? new Set() : null;
          b.show();
        }
        game.kick = 1;
        if (game.lightFlash) game.lightFlash(start, w.color, 4, 0.07);
        game.audio.play(w.splash ? 'boom' : w.pellets > 1 ? 'hit' : 'zap');
        game.emit('weapon:fire', { id: s.cur });
        return true;
      };
      const explode = (pos, w) => {
        for (const e of game.world.entities) {
          if (e.type !== 'hazard' || !e.active || e.state.dead) continue;
          if (V.dist(e.center(), pos) <= w.splash) game.hitHazard(e, w.damage);
        }
        game.burst(pos, '#ff9f43', 16); game.burst(pos, '#fff3b0', 6);
        if (game.lightFlash) game.lightFlash(pos, '#ff9f43', w.splash * 3, 0.3);
        if (game.shake) game.shake(0.25, 0.1);
        game.audio.play('boom');
      };
      fx.explode = explode;
      game.takePickup = ent => {
        const d = ent.def, kind = ent.kind || d.kind, k = PICKUP[kind] || PICKUP.ammo, amount = ent.amount != null ? ent.amount : d.amount != null ? d.amount : k.amount;
        if (kind === 'health') {
          if (game.player.health == null || game.player.health >= game.player.maxHealth) return;   // keep it for later
          game.player.heal(amount); game.ui.toast('+' + amount + ' health', 'good');
        } else if (kind === 'coins') { game.addCoins(amount); game.ui.toast('+' + amount + ' coins', 'good'); }
        else { game.addAmmo(amount === 1 ? 0.5 : amount); game.ui.toast('+ Ammo for your weapons', 'good'); }
        game.audio.play('pickup');
        if (game.lightFlash) game.lightFlash(ent.center(), k.color, 4, 0.2);
        game.emit('pickup', { id: ent.id, kind });
        if (ent.loot) { ent.hide(); ent.lootT = 0; }
        else if (d.respawn) { ent.hide(); game.later(d.respawn, () => { if (!ent.removed) ent.show(); }); }
        else ent.remove();
      };
      game.dropLoot = (pos, kind, amount) => {
        const L = take(fx.loot);
        if (!L) return;
        const k = PICKUP[kind] || PICKUP.ammo;
        if (L.model !== k.model) L.setModel(k.model, {});
        L.kind = kind; L.amount = amount; L.loot = true; L.lootT = 25;
        L.pos = [pos[0], pos[1], pos[2]]; L.touching = false;
        L.show();
      };
      // coins for defeated enemies and finished objectives; some enemies drop ammo
      game.on('hazard:defeated', ({ id }) => {
        const e = game.world.get(id);
        if (!e) return;
        const n = e.def.coins != null ? e.def.coins : Math.round((e.def.points || 0) / 4);
        game.addCoins(n);
        if (e.def.drop !== false && !e.def.boss && Math.random() < (e.def.dropChance != null ? e.def.dropChance : A.dropChance)) game.dropLoot(e.pos, 'ammo', 1);
      });
      game.on('objective:complete', ({ id }) => { const o = game.missions && game.missions.get(id); if (o && !o.optional && A.objectiveCoins) game.addCoins(A.objectiveCoins); });
      game.on('player:respawn', () => { const w = A.byId[A.start], o = st().owned[A.start]; if (o && o.mag + o.res < w.mag * 2) o.res = w.mag * 2 - o.mag; });

      /** The shop panel: every weapon (buy it, or buy ammo for it) and the extras. */
      game.openShop = (def, done) => {
        def = def || {};
        game.emit('shop:open', {});
        const body = U.el('div', 'gk-shop');
        const draw = () => {
          const s = st();
          body.innerHTML = '';
          body.appendChild(U.el('div', 'gk-shop-coins', '🪙 ' + s.coins + ' ' + (A.coinsName || 'coins')));
          const grid = U.el('div', 'gk-shop-grid');
          const bar = (label, k) => '<div class="gk-shop-stat"><span>' + label + '</span><i><b style="width:' + Math.round(U.clamp(k, 0.05, 1) * 100) + '%"></b></i></div>';
          for (const w of A.weapons) {
            const owned = s.owned[w.id], price = owned ? w.ammoPrice : w.price;
            const card = U.el('div', 'gk-shop-card' + (owned ? ' owned' : '') + (s.cur === w.id ? ' active' : ''));
            card.innerHTML = '<div class="gk-shop-icon" style="--c:' + U.css(w.color) + '">' + U.esc(w.icon || '⚡') + '</div>' +
              '<b>' + U.esc(w.name) + '</b><small>' + U.esc(w.desc || '') + '</small>' +
              bar('Power', (w.damage * (w.pellets || 1) + (w.splash ? 3 : 0)) / 8) + bar('Speed', 0.09 / Math.max(0.09, w.cooldown)) + bar('Ammo', w.mag / 30);
            const btn = U.el('button', 'gk-btn' + (owned ? '' : ' primary'), owned ? 'Ammo +' + w.ammoPack + ' · 🪙 ' + price : (price ? 'Buy · 🪙 ' + price : 'Free'));
            btn.disabled = s.coins < price || (owned && owned.res >= w.maxReserve);
            btn.onclick = () => { game.buy(w.id); draw(); };
            card.appendChild(btn);
            if (owned && s.cur !== w.id) { const eq = U.el('button', 'gk-btn small', 'Equip'); eq.onclick = () => { game.selectWeapon(w.id); draw(); }; card.appendChild(eq); }
            grid.appendChild(card);
          }
          for (const x of A.extras) {
            const card = U.el('div', 'gk-shop-card extra');
            card.innerHTML = '<div class="gk-shop-icon">' + U.esc(x.icon || '✨') + '</div><b>' + U.esc(x.name) + '</b><small>' + U.esc(x.desc || '') + '</small>';
            const btn = U.el('button', 'gk-btn primary', 'Buy · 🪙 ' + x.price);
            btn.disabled = s.coins < x.price;
            btn.onclick = () => { game.buy(x.id); draw(); };
            card.appendChild(btn);
            grid.appendChild(card);
          }
          body.appendChild(grid);
        };
        draw();
        game.audio.play('checkpoint');
        game.ui.panel({ title: def.title || A.shopTitle || 'Upgrade Shop', body, wide: true, buttons: [{ label: 'Close', primary: true }], noCancel: true, onClose: () => { if (done) done(); } });
      };
      /** Buy a weapon (or a pack of ammo for one you own) or an extra. Returns true if it worked. */
      game.buy = id => {
        const s = st(), w = A.byId[id], x = A.extras.find(e => e.id === id);
        if (w) {
          const owned = s.owned[id], price = owned ? w.ammoPrice : w.price;
          if (s.coins < price || (owned && owned.res >= w.maxReserve)) { game.audio.play('deny'); return false; }
          s.coins -= price;
          if (owned) owned.res = Math.min(w.maxReserve, owned.res + w.ammoPack);
          else game.giveWeapon(id);
          game.ui.toast(owned ? '+' + w.ammoPack + ' ammo for the ' + w.name : 'You bought the ' + w.name + '! Press ' + (A.weapons.indexOf(w) + 1) + ' to switch to it.', 'good');
        } else if (x) {
          if (s.coins < x.price) { game.audio.play('deny'); return false; }
          s.coins -= x.price;
          GK.run(game, x.actions);
          game.ui.toast(x.name + '!', 'good');
        } else return false;
        game.audio.play('success');
        game.emit('shop:buy', { id });
        return true;
      };
    },
    update(game, dt) {
      const A = game.arsenalCfg, fx = game.fx, inp = game.input, s = game.state.arsenal;
      const armed = game.armed();
      if (armed) {
        // switch: 1-5 or the mouse wheel
        for (let i = 1; i <= A.weapons.length && i <= 9; i++) if (inp.hits.has('Digit' + i) || inp.hits.has('Numpad' + i)) game.selectWeapon(i);
        if (inp.wheel) {
          const owned = A.weapons.filter(w => s.owned[w.id]), i = owned.findIndex(w => w.id === s.cur);
          if (owned.length > 1) game.selectWeapon(owned[(i + (inp.wheel > 0 ? 1 : -1) + owned.length) % owned.length].id);
        }
        if (inp.pressed('reload')) game.reload();
        // fire: a click, the mouse held down while looking around, or Q
        if (!game.focus && (game.clickFire || (inp.mouse && inp.locked) || inp.down('fire'))) game.fire();
      }
      inp.wheel = 0;
      game.clickFire = false;
      if (game.cool > 0) game.cool -= dt;
      if (game.emptyT > 0) game.emptyT -= dt;
      if (game.reloadT > 0) { game.reloadT -= dt; if (game.reloadT <= 0) { game.reloadT = 0; game.reload(true); game.audio.play('click'); } }
      game.kick = Math.max(0, game.kick - dt * 7);
      const w = A.byId[s.cur], o = s.owned[s.cur];
      const lower = game.reloadT > 0 ? Math.sin(Math.PI * (1 - game.reloadT / (game.reloadMax || 1))) : 0;
      game.viewModel = armed ? { model: w.model, look: w.look, kick: game.kick, glow: game.kick * 0.25, lower } : null;
      game.ui.setWeapon(armed ? {
        name: w.name, icon: w.icon, color: w.color, mag: o.mag, magMax: w.mag, res: o.res, rapid: !!(game.hasPower && game.hasPower('rapid')),
        reload: game.reloadT > 0 ? 1 - game.reloadT / (game.reloadMax || 1) : null,
        slots: A.weapons.map((x, i) => ({ n: i + 1, icon: x.icon, owned: !!s.owned[x.id], active: x.id === s.cur })),
      } : null);
      game.ui.setCoins(armed || s.coins ? s.coins : null);

      // player bolts
      for (const b of fx.bolts) {
        if (!b.visible) continue;
        if (!b.v || !b.w) { b.hide(); continue; }   // restored mid-flight
        const W = b.w;
        b.life -= dt;
        const len = V.len(b.v) * dt, dir = V.norm(b.v);
        const tw = wallAt(game, b.pos, dir, len), he = enemyAt(game, b.pos, dir, len, b.hits);
        if (he.e && he.t <= tw) {
          const at = V.add(b.pos, V.scale(dir, he.t));
          if (W.splash) { fx.explode(at, W); game.ui.hitMarker('hit'); b.hide(); continue; }
          const r = game.hitHazard ? game.hitHazard(he.e, W.damage) : 'blocked';
          game.ui.hitMarker(r === 'blocked' ? 'blocked' : 'hit');
          if (r !== 'defeated') game.burst(at, r === 'blocked' ? '#4cc9f0' : W.color, 4);
          game.emit('weapon:hit', { id: he.e.id });
          if (b.hits && r !== 'blocked') { b.hits.add(he.e.id); b.pos = V.add(b.pos, V.scale(b.v, dt)); }
          else b.hide();
        } else if (tw < Infinity) {
          const at = V.add(b.pos, V.scale(dir, tw));
          if (W.splash) fx.explode(at, W); else game.burst(at, W.color, 3);
          b.hide();
        } else {
          b.pos = V.add(b.pos, V.scale(b.v, dt));
          if (b.life <= 0) { if (W.splash) fx.explode(b.pos, W); b.hide(); }
        }
      }
      // enemy bolts
      const pl = game.player;
      for (const b of fx.enemy) {
        if (!b.visible) continue;
        if (!b.v) { b.hide(); continue; }
        b.life -= dt;
        const len = V.len(b.v) * dt, dir = V.norm(b.v);
        const tw = wallAt(game, b.pos, dir, len);
        const tp = Ph.rayBox(b.pos, dir, Ph.bodyBox(pl.pos, pl.r + 0.15, pl.h));
        if (tp >= 0 && tp <= len && tp <= tw) {
          b.hide();
          if (game.hurtPlayer && game.hurtPlayer(b.dmg, b.src)) {
            game.emit('hazard:hit', { id: b.src && b.src.id });
            if (b.src && b.src.def && b.src.def.onHit) GK.run(game, b.src.def.onHit, { entity: b.src });
          } else game.burst(b.pos, '#4cc9f0', 4);
        } else if (tw < Infinity) {
          game.burst(V.add(b.pos, V.scale(dir, tw)), b.look.color, 3);
          b.hide();
        } else {
          b.pos = V.add(b.pos, V.scale(b.v, dt));
          if (b.life <= 0) b.hide();
        }
      }
      // sparks
      for (const sp of fx.sparks) {
        if (!sp.visible) continue;
        if (!sp.v) { sp.hide(); continue; }
        sp.life -= dt;
        if (sp.life <= 0) { sp.hide(); continue; }
        sp.v[1] -= 9 * dt;
        sp.pos = V.add(sp.pos, V.scale(sp.v, dt));
        const k = sp.life / sp.maxLife;
        sp.alpha = Math.min(1, k * 1.5); sp.scale = [k, k, k];
      }
      // dropped loot disappears after a while
      for (const L of fx.loot) if (L.visible && L.loot) { L.lootT -= dt; if (L.lootT <= 0) L.hide(); }
    },
    restore(game) {
      if (!game.state.arsenal) { const A = game.arsenalCfg, w = A.byId[A.start]; game.state.arsenal = { cur: A.start, owned: { [A.start]: { mag: w.mag, res: w.reserve } }, coins: 0 }; }
      game.reloadT = 0;
      if (game.fx) for (const k in game.fx) if (Array.isArray(game.fx[k])) for (const e of game.fx[k]) e.hide();
    },
    answers(game) {
      const A = game.arsenalCfg;
      return [{ where: 'Shop prices', answer: A.weapons.map(w => w.name + ' ' + (w.price || 'free') + ' (ammo ' + w.ammoPrice + ')').join(' · ') }];
    },
  });
})();

<script>
(function () {
  var SLOTS = [10, 30, 50];   // minutes past every hour
  var GRACE = 3;              // still pops up if the tool is opened up to 3 minutes late
  var WAIT = 5;               // seconds before the OK button works, so it gets read
  var KEY = 'computerLab.classroomReminder.lastShown';
  var shownHere = {}, back = null;

  function slotId(d) {
    var m = d.getMinutes();
    for (var i = 0; i < SLOTS.length; i++)
      if (m >= SLOTS[i] && m < SLOTS[i] + GRACE)
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + ' ' + d.getHours() + ':' + SLOTS[i];
    return null;
  }
  function seen(id) {
    if (shownHere[id]) return true;
    try { return localStorage.getItem(KEY) === id; } catch (e) { return false; }
  }
  function mark(id) {
    shownHere[id] = true;
    try { localStorage.setItem(KEY, id); } catch (e) {}
  }
  function pauseGame() {
    try { if (document.exitPointerLock) document.exitPointerLock(); } catch (e) {}
    try {
      var g = window.GK && window.GK.current;
      if (g && g.state && g.state.mode === 'playing' && g.pause) g.pause();
    } catch (e) {}
  }
  function keys(e) {
    if (!back) return;
    e.stopPropagation();
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { e.preventDefault(); close(); }
  }
  function close() {
    var ok = document.getElementById('ccr-ok');
    if (!back || !ok || ok.disabled) return;
    back.parentNode.removeChild(back);
    back = null;
  }
  function show() {
    if (back || !document.body) return;
    pauseGame();
    back = document.createElement('div');
    back.id = 'ccr-back';
    back.setAttribute('role', 'alertdialog');
    back.setAttribute('aria-labelledby', 'ccr-top');
    back.innerHTML =
      '<div id="ccr-card">' +
        '<div id="ccr-top">\uD83D\uDCDA Google Classroom reminder<small>Your teacher posted a quiz for you!</small></div>' +
        '<div id="ccr-body">Have you <b>joined your Google Classroom</b> yet? There is a <b>QUIZ assignment</b> waiting for you.' +
          '<ol><li>Open <b>Google Classroom</b> and join your class.</li>' +
          '<li>Open the <b>quiz assignment</b>.</li>' +
          '<li>Answer every question, then click <b>Turn in</b>.</li></ol>' +
          'Keep this tab open, so you can come back and continue here.</div>' +
        '<div id="ccr-foot"><button id="ccr-ok" type="button" disabled>OK (' + WAIT + ')</button></div>' +
      '</div>';
    ['mousedown', 'mouseup', 'click', 'pointerdown', 'wheel', 'contextmenu'].forEach(function (t) {
      back.addEventListener(t, function (e) { e.stopPropagation(); });
    });
    document.body.appendChild(back);
    var ok = document.getElementById('ccr-ok'), left = WAIT;
    ok.addEventListener('click', close);
    var timer = setInterval(function () {
      left--;
      if (left > 0) { ok.textContent = 'OK (' + left + ')'; return; }
      clearInterval(timer);
      ok.disabled = false;
      ok.textContent = 'OK, I will do it';
      try { ok.focus(); } catch (e) {}
    }, 1000);
  }
  function tick() {
    var id = slotId(new Date());
    if (id && !seen(id) && !back) { mark(id); show(); }
  }
  window.addEventListener('keydown', keys, true);
  window.addEventListener('keyup', function (e) { if (back) e.stopPropagation(); }, true);
  window.ClassroomReminder = { show: show };
  function begin() {
    if (/[?&]remind=now\b/.test(location.search)) show();
    tick();
    setInterval(tick, 5000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', begin); else begin();
})();
</script>
<!-- CLASSROOM REMINDER END -->
</body>
</html>
