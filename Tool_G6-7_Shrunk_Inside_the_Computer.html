<script>/* game-types/_spatial/physics.js */
/* Game Kit · game-types/_spatial/physics.js
   Axis-aligned box collision: the player is a box, the world is a list of boxes {min, max}.
   Movement is resolved one axis at a time ("move and slide"), with automatic step-up for stairs
   and snap-down so walking down steps stays grounded. Plus a ray-vs-box raycast for interaction. */
(function () {
  'use strict';
  const EPS = 1e-4;

  const P = GK.Physics = {};

  /** Box of a body standing at pos (feet centre) with half-width r and height h. */
  P.bodyBox = (pos, r, h) => ({ min: [pos[0] - r, pos[1], pos[2] - r], max: [pos[0] + r, pos[1] + h, pos[2] + r] });
  P.overlap = (a, b) => a.min[0] < b.max[0] && a.max[0] > b.min[0] && a.min[1] < b.max[1] && a.max[1] > b.min[1] && a.min[2] < b.max[2] && a.max[2] > b.min[2];
  P.contains = (b, p) => p[0] >= b.min[0] && p[0] <= b.max[0] && p[1] >= b.min[1] && p[1] <= b.max[1] && p[2] >= b.min[2] && p[2] <= b.max[2];

  function hits(solids, box, ignore) {
    const out = [];
    for (const s of solids) if (P.overlap(box, s) && !(ignore && ignore.has(s))) out.push(s);
    return out;
  }

  /** Move body {pos, vel, r, h, step, grounded} through solids for dt seconds. */
  P.move = function (solids, b, dt) {
    const wasGrounded = b.grounded;
    b.grounded = false;
    // Boxes we already overlap (e.g. a door closed on us) are ignored so we can always walk out.
    const stuck = new Set(hits(solids, P.bodyBox(b.pos, b.r, b.h)));

    for (const ax of [0, 2]) {
      const d = b.vel[ax] * dt;
      if (!d) continue;
      const old = b.pos[ax];
      b.pos[ax] += d;
      const hs = hits(solids, P.bodyBox(b.pos, b.r, b.h), stuck);
      if (!hs.length) continue;
      // Step up onto low obstacles (stairs, kerbs).
      if (b.step > 0 && (wasGrounded || b.vel[1] <= 0)) {
        let top = -Infinity;
        for (const s of hs) top = Math.max(top, s.max[1]);
        const rise = top - b.pos[1];
        if (rise > 0 && rise <= b.step) {
          const y0 = b.pos[1];
          b.pos[1] = top + EPS;
          if (!hits(solids, P.bodyBox(b.pos, b.r, b.h), stuck).length) { b.grounded = true; continue; }
          b.pos[1] = y0;
        }
      }
      // Slide: stop at the face we ran into.
      let lim = d > 0 ? Infinity : -Infinity;
      for (const s of hs) lim = d > 0 ? Math.min(lim, s.min[ax] - b.r - EPS) : Math.max(lim, s.max[ax] + b.r + EPS);
      b.pos[ax] = d > 0 ? Math.max(old, Math.min(old + d, lim)) : Math.min(old, Math.max(old + d, lim));
      b.vel[ax] = 0;
    }

    const dy = b.vel[1] * dt;
    const y0 = b.pos[1];
    b.pos[1] += dy;
    const hs = hits(solids, P.bodyBox(b.pos, b.r, b.h), stuck);
    if (hs.length) {
      if (dy <= 0) {
        let top = -Infinity;
        for (const s of hs) top = Math.max(top, s.max[1]);
        b.pos[1] = Math.min(y0, top);
        b.grounded = true;
      } else {
        let bottom = Infinity;
        for (const s of hs) bottom = Math.min(bottom, s.min[1]);
        b.pos[1] = Math.max(y0, bottom - b.h - EPS);
      }
      b.vel[1] = 0;
    } else if (wasGrounded && b.vel[1] <= 0 && b.step > 0) {
      // Snap down onto a step just below us instead of briefly falling.
      const probe = P.bodyBox([b.pos[0], b.pos[1] - b.step, b.pos[2]], b.r, b.h);
      let top = -Infinity;
      for (const s of hits(solids, probe, stuck)) if (s.max[1] <= b.pos[1] + EPS) top = Math.max(top, s.max[1]);
      if (top > -Infinity) { b.pos[1] = top; b.vel[1] = 0; b.grounded = true; }
    }
  };

  /** Ray (origin o, unit dir d) vs box → distance, or -1 for a miss. */
  P.rayBox = function (o, d, b) {
    let tmin = 0, tmax = Infinity;
    for (let i = 0; i < 3; i++) {
      if (Math.abs(d[i]) < 1e-9) {
        if (o[i] < b.min[i] || o[i] > b.max[i]) return -1;
      } else {
        let t1 = (b.min[i] - o[i]) / d[i], t2 = (b.max[i] - o[i]) / d[i];
        if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
        if (t1 > tmin) tmin = t1;
        if (t2 < tmax) tmax = t2;
        if (tmin > tmax) return -1;
      }
    }
    return tmin;
  };
})();

<script>/* game-types/_spatial/body.js */
/* Game Kit · game-types/_spatial/body.js
   The player's body in a spatial world: WASD, sprint, jump (coyote time + jump buffer), gravity,
   box collision via GK.Physics, head-bob and optional health. Settings come from config.player.
   steering: 'camera' (first-person: W = where you look) | 'world' (top-down: W = north, body turns to face movement). */
(function () {
  'use strict';
  const U = GK.util;

  class Player {
    constructor(game, cfg) {
      this.game = game; this.cfg = cfg;
      this.pos = [0, 0, 0]; this.vel = [0, 0, 0];
      this.yaw = 0; this.pitch = 0;
      this.r = cfg.radius; this.h = cfg.height; this.step = cfg.stepHeight;
      this.grounded = false; this.coyote = 0; this.jumpBuffer = 0;
      this.bob = 0; this.moving = false; this.sprinting = false;
      this.health = cfg.health == null ? null : cfg.health;
      this.maxHealth = this.health;
    }
    /** Put the player at pos facing `rot` ('n' | 's' | 'e' | 'w' | degrees, same convention as entities). */
    place(pos, rot) {
      this.pos = pos.slice(0, 3);
      if (this.pos.length < 3) this.pos[2] = 0;
      this.vel = [0, 0, 0];
      this.yaw = U.yaw(rot == null ? 'n' : rot) + Math.PI;
      this.pitch = 0;
      this.grounded = false;
    }
    eye() { return [this.pos[0], this.pos[1] + this.cfg.eyeHeight + this.bob, this.pos[2]]; }
    forward() {
      const cp = Math.cos(this.pitch);
      return [-Math.sin(this.yaw) * cp, Math.sin(this.pitch), -Math.cos(this.yaw) * cp];
    }
    look(dx, dy) {
      const s = this.cfg.sensitivity;
      this.yaw -= dx * s;
      this.pitch = U.clamp(this.pitch - dy * s * (this.cfg.invertY ? -1 : 1), -1.5, 1.5);
    }
    update(dt, input, solids) {
      const c = this.cfg;
      let f = (input.down('forward') ? 1 : 0) - (input.down('back') ? 1 : 0);
      let s = (input.down('right') ? 1 : 0) - (input.down('left') ? 1 : 0);
      const l = Math.hypot(f, s);
      if (l > 1) { f /= l; s /= l; }
      const world = c.steering === 'world';
      this.sprinting = c.canSprint && (world ? l > 0 : f > 0) && input.down('sprint');
      const speed = (this.sprinting ? c.sprintSpeed : c.walkSpeed) * (this.speedMul || 1);   // speedMul: power-ups
      let tx, tz;
      if (world) {
        tx = s * speed; tz = -f * speed;

      } else {
        const fx = -Math.sin(this.yaw), fz = -Math.cos(this.yaw), rx = Math.cos(this.yaw), rz = -Math.sin(this.yaw);
        tx = (fx * f + rx * s) * speed; tz = (fz * f + rz * s) * speed;
      }
      const k = Math.min(1, (this.grounded ? c.accel : c.airAccel) * dt);
      this.vel[0] += (tx - this.vel[0]) * k;
      this.vel[2] += (tz - this.vel[2]) * k;
      this.vel[1] = Math.max(this.vel[1] - c.gravity * dt, -40);

      this.coyote = this.grounded ? 0.1 : this.coyote - dt;
      this.jumpBuffer = input.pressed('jump') ? 0.12 : this.jumpBuffer - dt;
      if (c.canJump && this.jumpBuffer > 0 && this.coyote > 0) {

        this.coyote = this.jumpBuffer = 0;
        this.grounded = false;
        this.game.emit('player:jump');

      // Sub-steps keep fast movement from tunnelling through thin walls.
      const maxV = Math.max(Math.abs(this.vel[0]), Math.abs(this.vel[1]), Math.abs(this.vel[2]));
      const n = Math.max(1, Math.ceil(maxV * dt / 0.15));

      const hs = Math.hypot(this.vel[0], this.vel[2]);

<script>/* game-types/_spatial/world.js */
/* Game Kit · game-types/_spatial/world.js
   The logical world shared by every spatial game type (first-person, top-down, …). No rendering here:
   views read `statics` (boxes with colours), `tiles` (floor squares), `geo` (merged 3D level geometry)
   and `entities` (each with a `shape` from the model library) and draw them their own way.

   Built from TWO sources, merged:
   - the WORLD definition (worlds/<name>/world.js): map, decorations, lighting, spawns, locations, routes, areas
   - the GAME config: its own entities / zones / extra map parts, placed with `at:'locationName'`
   Map sources: map.grid (ASCII, '#' wall '.' floor 'S' spawn 'D' door + legend), map.floors/walls/rooms/platforms/stairs. */
(function () {
  'use strict';
  const U = GK.util, V = GK.vec, Ph = GK.Physics;

  // ================= Entities =================
  class Entity {
    constructor(world, d) {
      this.world = world; this.game = world.game; this.def = d;
      // auto ids are per world and in build order, so they are the same on every restart / every computer (save + LAN)
      this.id = d.id || ((d.type || 'prop') + '-' + (++world.seq));
      this.type = d.type || 'prop';
      this.name = d.name || '';
      this.tags = U.list(d.tags);
      this.pos = world.toPos(d);
      this.yaw = U.yaw(d.rot != null ? d.rot : world.rotAt(d));
      this.scale = d.scale == null ? [1, 1, 1] : typeof d.scale === 'number' ? [d.scale, d.scale, d.scale] : d.scale.slice();
      this.solid = d.solid !== false;
      this.visible = d.visible !== false;
      this.removed = false;
      this.enabled = d.enabled !== false;
      this.hover = d.hover || 0; this.spin = d.spin || 0; this.bobAmp = d.bob || 0;
      this.offset = [0, 0, 0];
      this.state = U.merge(d.state);
      this.interact = U.list(d.interact).map(x => Object.assign({}, x));
      this.used = new Set();
      this.label = d.label == null ? null : d.label;
      this.alpha = d.alpha;
      this.radius = d.radius || 0;
      this.tint = d.tint || null;
      this.t = Math.random() * 10;
      this.setModel(d.model, d.look);
    }
    /** Change model/look at runtime (e.g. lever on/off). `shape` = {key, geo, bounds, top} from the model library. */
    setModel(model, look) {
      this.model = model;
      this.look = U.merge({ color: this.def.color, size: this.def.size }, look);
      if (typeof model === 'string' && !GK.Models.has(model)) {
        this.world.problem('Entity "' + this.id + '": unknown model "' + model + '" (drawn as a pink box)');
        model = 'box'; this.look = U.merge(this.look, { color: '#ff00ff' });
      }
      this.shape = model ? GK.Models.shape(model, this.look, this.id) : null;
    }
    setLook(changes) { this.setModel(this.model, U.merge(this.look, changes)); }
    get active() { return this.visible && !this.removed; }
    drawPos() { return [this.pos[0] + this.offset[0], this.pos[1] + this.offset[1] + this.hover + (this.bobAmp ? Math.sin(this.t * 2.2) * this.bobAmp : 0), this.pos[2] + this.offset[2]]; }

    box(noAnim) {
      const b = this.shape ? this.shape.bounds : { min: [-0.25, 0, -0.25], max: [0.25, 0.5, 0.25] };
      const s = this.scale, c = Math.cos(this.yaw), n = Math.sin(this.yaw);
      const cx = (b.min[0] + b.max[0]) / 2 * s[0], cz = (b.min[2] + b.max[2]) / 2 * s[2];
      const hx = (b.max[0] - b.min[0]) / 2 * s[0], hz = (b.max[2] - b.min[2]) / 2 * s[2];
      const ex = Math.abs(c) * hx + Math.abs(n) * hz, ez = Math.abs(n) * hx + Math.abs(c) * hz;
      const p = noAnim ? [this.pos[0] + this.offset[0], this.pos[1] + this.offset[1] + this.hover, this.pos[2] + this.offset[2]] : this.drawPos();

    center() { const b = this.box(true); return [(b.min[0] + b.max[0]) / 2, (b.min[1] + b.max[1]) / 2, (b.min[2] + b.max[2]) / 2]; }
    top() { const b = this.box(true); return [(b.min[0] + b.max[0]) / 2, b.max[1], (b.min[2] + b.max[2]) / 2]; }

    }
    show() { this.visible = true; }
    hide() { this.visible = false; }
    remove() { this.removed = true; this.game.emit('entity:removed', { id: this.id }); }

    blocks() { return this.solid && this.active; }

    }
  }
  GK.Entity = Entity;

  // ================= Prefabs (entity types) =================
  // Each prefab = { defaults, init(ent, game), update(ent, dt, game) }. Mechanics add more (door, npc, mover…).
  const P = GK.Prefabs;
  P.add('prop', { defaults: { solid: true } });
  P.add('decoration', { defaults: { solid: true } });   // what worlds use: scenery with no gameplay
  P.add('spawn', { defaults: { solid: false } });

  // ================= World =================
  const LEGEND = {
    '#': { wall: true }, '.': { floor: true }, ' ': {}, 'S': { floor: true, spawn: true }, 'D': { floor: true, door: {} },
  };
  const LISTS = ['floors', 'walls', 'rooms', 'platforms', 'stairs'];

  class World {
    constructor(game) {
      this.game = game;
      this.entities = []; this.byId = {}; this.zones = [];
      this.statics = [];           // collision boxes {min, max, color, top, kind: 'floor'|'wall'|'platform'|'stairs'}
      this.tiles = [];             // floor squares for 2D views {x, z, w, d, y, color}
      this.geo = new GK.Geo();     // 3D level geometry (views that draw in 3D merge it into one mesh)
      this.spawn = { pos: [0, 0, 0], rot: 'n' };
      this.spawns = {}; this.locations = {}; this.routes = {};
      this.cell = 2; this.wallH = 3; this.origin = [0, 0];
      this.seq = 0;
      this.problems = [];   // configuration problems found while building (see core/validate.js)
    }
    problem(msg) { if (this.problems.indexOf(msg) < 0) { this.problems.push(msg); console.warn('[GK] ' + msg); } }

    // ----- coordinates -----
    /** Grid cell [col,row] → world centre [x, 0, z]. */
    cellPos(c, r) { return [this.origin[0] + (c + 0.5) * this.cell, 0, this.origin[1] + (r + 0.5) * this.cell]; }
    /** A definition's position: at:'locationName' | pos [x,y,z] | pos [x,z] | cell [c,r]; plus y and offset [dx,dy,dz]. */
    toPos(d) {
      let p;
      if (d.at) {
        const L = this.locations[d.at];
        if (!L) this.problem('Unknown location "' + d.at + '". This world has: ' + Object.keys(this.locations).join(', '));
        p = L ? L.pos.slice() : [0, 0, 0];
        if (d.y != null) p[1] = d.y;
      } else if (d.pos) p = d.pos.length === 2 ? [d.pos[0], d.y || 0, d.pos[1]] : d.pos.slice();
      else if (d.cell) { p = this.cellPos(d.cell[0], d.cell[1]); p[1] = d.y || 0; }
      else p = [0, d.y || 0, 0];
      if (d.offset) { p[0] += d.offset[0] || 0; p[1] += d.offset[1] || 0; p[2] += d.offset[2] || 0; }
      return p;
    }
    /** Facing stored with a named location (used when an entity placed `at` it has no rot of its own). */
    rotAt(d) { const L = d.at && this.locations[d.at]; return L && L.rot != null ? L.rot : 0; }
    location(name) { return this.locations[name] || null; }

    // ----- building -----
    /** cfg.worldDef = the world library entry (or inline world); cfg.map/entities/zones = the game's additions. */
    build(cfg) {
      const def = cfg.worldDef || {}, gmap = cfg.map || {};
      const map = U.merge(def.map, gmap);
      for (const k of LISTS) map[k] = U.list(def.map && def.map[k]).concat(U.list(gmap[k]));
      map.legend = Object.assign({}, def.map && def.map.legend, gmap.legend);
      this.def = def;
      this.cell = map.cell || 2;
      this.wallH = map.wallHeight || 3;
      this.origin = map.origin || [0, 0];
      this.colors = U.merge({ wall: '#d8d2c4', wallTop: '#b9b2a3', floor: '#9aa5b1', floor2: '#8f9aa6', ceiling: '#eeeeea', stairs: '#b0a595', platform: '#a7b0ba' }, map.colors);

      const pending = [];
      if (map.grid) this.buildGrid(map, pending);
      for (const f of map.floors) this.floor(f);
      for (const w of map.walls) this.wall(w);
      for (const r of map.rooms) this.room(r, pending);
      for (const p of map.platforms) this.solid(this.toPos(p), p.size || [2, 1, 2], p.color || this.colors.platform, { top: p.top, kind: 'platform' });
      for (const s of map.stairs) this.stairs(s);

      // named places (world first, game may add or override)
      const addLoc = (name, L) => { this.locations[name] = { pos: this.toPos(L), rot: L.rot, name }; };
      for (const n in def.locations || {}) addLoc(n, def.locations[n]);
      for (const n in cfg.locations || {}) addLoc(n, cfg.locations[n]);
      const routes = Object.assign({}, def.routes, cfg.routes);
      for (const n in routes) this.routes[n] = routes[n].map(p => (typeof p === 'string' ? this.toPos({ at: p }) : this.toPos(Array.isArray(p) ? { pos: p } : p)));
      const spawns = Object.assign({}, def.spawns, cfg.spawns);
      for (const n in spawns) this.spawns[n] = { pos: this.toPos(spawns[n]), rot: spawns[n].rot != null ? spawns[n].rot : this.rotAt(spawns[n]) };
      if (map.spawn) this.spawns.default = { pos: this.toPos(map.spawn), rot: map.spawn.rot || 'n' };
      if (!this.spawns.default && this.gridSpawn) this.spawns.default = this.gridSpawn;
      const sp = cfg.spawn;
      this.spawn = (typeof sp === 'string' ? this.spawns[sp] : sp && (sp.pos || sp.at || sp.cell) ? { pos: this.toPos(sp), rot: sp.rot || 'n' } : null) || this.spawns.default || this.spawn;
      if (typeof sp === 'string' && !this.spawns[sp]) this.problem('Unknown spawn "' + sp + '". This world has: ' + Object.keys(this.spawns).join(', '));

      // areas are named regions of the world; games use them as zones (e.g. reach objectives)
      for (const n in def.areas || {}) this.addZone(Object.assign({ id: n, area: true }, def.areas[n]));
      for (const d of U.list(def.decorations)) this.add(Object.assign({ type: 'decoration' }, d));
      for (const d of pending) this.add(d);
      for (const d of U.list(cfg.entities)) this.add(d);
      for (const z of U.list(cfg.zones)) this.addZone(z);
    }

    /** Static solid box (visual + collision). pos = bottom centre. */
    solid(pos, size, color, o) {
      o = o || {};
      if (!o.noDraw) this.geo.box(pos[0], pos[1], pos[2], size[0], size[1], size[2], color, { top: o.top, noBottom: true });
      if (!o.noCollide) this.statics.push({ min: [pos[0] - size[0] / 2, pos[1], pos[2] - size[2] / 2], max: [pos[0] + size[0] / 2, pos[1] + size[1], pos[2] + size[2] / 2], color, top: o.top || color, kind: o.kind || 'wall' });
    }
    floor(f) {
      const p = this.toPos(f), s = f.size || [10, 10], t = 0.3, color = f.color || this.colors.floor;
      this.solid([p[0], p[1] - t, p[2]], [s[0], t, s[1]], color, { kind: 'floor' });
      this.tiles.push({ x: p[0], z: p[2], w: s[0], d: s[1], y: p[1], color });
    }
    /** Axis-aligned wall from [x,z] to [x,z]. */
    wall(w) {
      const a = w.from, b = w.to, th = w.thick || 0.2, h = w.height || this.wallH, y = w.y || 0;
      const cx = (a[0] + b[0]) / 2, cz = (a[1] + b[1]) / 2;
      const sx = Math.abs(b[0] - a[0]) || th, sz = Math.abs(b[1] - a[1]) || th;
      this.solid([cx, y, cz], [sx === th ? th : sx + th, h, sz === th ? th : sz + th], w.color || this.colors.wall, { top: this.colors.wallTop, kind: y > 0.5 ? 'lintel' : 'wall' });
    }
    /** Stairs: pos = bottom-front centre of the first step, dir = direction you climb. */
    stairs(s) {
      const p = this.toPos(s), d = U.dir(s.dir), n = s.steps || 6, rise = s.rise || 0.25, run = s.run || 0.5, w = s.width || 2;
      for (let i = 0; i < n; i++) {
        const along = run * i + run / 2, h = rise * (i + 1);
        const size = d[0] ? [run, h, w] : [w, h, run];
        this.solid([p[0] + d[0] * along, p[1], p[2] + d[1] * along], size, s.color || this.colors.stairs, { top: U.shade(s.color || this.colors.stairs, 1.1), kind: 'stairs' });
      }
    }
    /** Rectangular room with optional door gaps: doors [{side:'n', offset:0, width:1.4, height:2.2, door:{…}|false}] */
    room(r, pending) {
      const c = r.pos, w = r.size[0], d = r.size[1], h = r.height || this.wallH, y = r.y || 0, th = r.thick || 0.2;
      const col = r.color || this.colors.wall;
      if (r.floor !== false) this.floor({ pos: [c[0], y, c[1]], size: [w + th, d + th], color: r.floor || this.colors.floor });
      if (r.ceiling) this.geo.plane(c[0], y + h, c[1], w, d, r.ceiling === true ? this.colors.ceiling : r.ceiling, { down: true });
      const sides = {
        n: { a: [c[0] - w / 2, c[1] - d / 2], b: [c[0] + w / 2, c[1] - d / 2], ax: 0 },
        s: { a: [c[0] - w / 2, c[1] + d / 2], b: [c[0] + w / 2, c[1] + d / 2], ax: 0 },
        w: { a: [c[0] - w / 2, c[1] - d / 2], b: [c[0] - w / 2, c[1] + d / 2], ax: 1 },
        e: { a: [c[0] + w / 2, c[1] - d / 2], b: [c[0] + w / 2, c[1] + d / 2], ax: 1 },
      };
      const doors = U.list(r.doors);
      for (const k in sides) {
        if (r.open && r.open.indexOf(k) >= 0) continue;
        const S = sides[k], ax = S.ax, lo = S.a[ax], hi = S.b[ax], mid = (lo + hi) / 2;
        const gaps = doors.filter(g => g.side === k).map(g => { const gw = g.width || 1.4; const at = mid + (g.offset || 0); return { g, a: at - gw / 2, b: at + gw / 2 }; }).sort((x, y2) => x.a - y2.a);
        let cur = lo;
        const seg = (from, to, yy, hh) => {
          if (to - from < 0.01) return;
          const A = S.a.slice(), B = S.a.slice();
          A[ax] = from; B[ax] = to;
          this.wall({ from: A, to: B, height: hh, y: yy, thick: th, color: col });
        };
        for (const gp of gaps) {
          seg(cur, gp.a, y, h);
          const dh = gp.g.height || 2.2;
          seg(gp.a, gp.b, y + dh, h - dh);
          const at = (gp.a + gp.b) / 2, pos = ax === 0 ? [at, y, S.a[1]] : [S.a[0], y, at];
          if (gp.g.location) this.locations[gp.g.location] = { pos, rot: ax === 0 ? 0 : 90, name: gp.g.location };
          if (gp.g.door) pending.push(U.merge({ type: 'door', width: gp.b - gp.a, height: dh, rot: ax === 0 ? 0 : 90 }, gp.g.door, { pos }));
          cur = gp.b;
        }
        seg(cur, hi, y, h);
      }
    }
    /** ASCII grid. Legend entries: {wall, floor, spawn, door, entity|entities, zone, location:'name' ('#' → auto number)}. */
    buildGrid(map, pending) {
      const rows = map.grid, cs = this.cell, H = this.wallH;
      // legend entries may reuse a world part: {part: 'workstation', location: 'pc#'} (worlds/_parts.js)
      const legend = Object.assign({}, LEGEND);
      for (const ch in map.legend || {}) {
        const L = map.legend[ch];
        legend[ch] = L && L.part ? U.merge(GK.WorldParts.get(L.part), L) : L;
      }
      const at = (c, r) => legend[(rows[r] || '')[c] || ' '] || {};
      const isWall = (c, r) => !!at(c, r).wall;
      const hasFloor = L => !!(L.floor || L.spawn || L.door || L.entity || L.entities || L.zone || L.location);
      const counters = {};
      rows.forEach((line, r) => {
        let run = null;
        const flush = end => {
          if (!run) return;
          const L = run.L, wc = U.isObj(L.wall) ? L.wall : {};
          const x0 = this.origin[0] + run.c * cs, x1 = this.origin[0] + end * cs, z = this.origin[1] + (r + 0.5) * cs;
          this.solid([(x0 + x1) / 2, 0, z], [x1 - x0, wc.height || H, cs], wc.color || this.colors.wall, { top: wc.top || this.colors.wallTop });
          run = null;
        };
        for (let c = 0; c <= line.length; c++) {
          const ch = line[c], L = at(c, r);
          if (c < line.length && L.wall) {
            if (run && run.ch !== ch) flush(c);
            if (!run) run = { c, ch, L };
          } else flush(c);
          if (c >= line.length) break;
          const p = this.cellPos(c, r);
          const acrossX = isWall(c - 1, r) || isWall(c + 1, r);
          if (hasFloor(L)) {
            const fc = U.isObj(L.floor) && L.floor.color ? L.floor.color : ((c + r) % 2 ? this.colors.floor : this.colors.floor2);
            this.geo.plane(p[0], 0, p[2], cs, cs, fc);
            this.tiles.push({ x: p[0], z: p[2], w: cs, d: cs, y: 0, color: fc });
            this.statics.push({ min: [p[0] - cs / 2, -0.5, p[2] - cs / 2], max: [p[0] + cs / 2, 0, p[2] + cs / 2], color: fc, kind: 'floor', noDraw: true });
            if (map.ceiling) this.geo.plane(p[0], H, p[2], cs, cs, map.ceiling === true ? this.colors.ceiling : map.ceiling, { down: true });
          }
          if (L.spawn) this.gridSpawn = { pos: p.slice(), rot: (U.isObj(L.spawn) && L.spawn.rot) || map.spawnRot || 'n' };
          if (L.location) {
            let name = L.location;
            if (name.indexOf('#') >= 0) { counters[name] = (counters[name] || 0) + 1; name = name.replace('#', counters[name]); }
            this.locations[name] = { pos: p.slice(), rot: L.rot != null ? L.rot : (acrossX ? 0 : 90), name };
          }
          if (L.door) {
            const dh = L.door.height || 2.2;
            if (GK.Prefabs.has('door')) pending.push(U.merge({ type: 'door', width: cs, height: dh, rot: acrossX ? 0 : 90 }, L.door, { pos: p.slice() }));
            else this.problem('The map has a door (D) but the "world-objects" mechanic is not loaded');
            if (dh < H) this.solid([p[0], dh, p[2]], [cs, H - dh, cs], this.colors.wall, { top: this.colors.wallTop, kind: 'lintel' });
          }
          // legend entities with no 	ype (and no template) are scenery; give them a type (e.g. 'collectible') for gameplay
          for (const e of U.list(L.entity).concat(U.list(L.entities))) pending.push(U.merge(e.type || e.use ? {} : { type: 'decoration' }, e, { cell: [c, r] }));
          if (L.zone) this.addZone(U.merge(L.zone, { cell: [c, r] }));
        }
      });
    }

    // ----- entities & zones -----
    add(def) {
      const tpl = def.use ? (this.game.cfg.templates || {})[def.use] : null;
      if (def.use && !tpl) this.problem('Unknown template "' + def.use + '"');
      let d = tpl ? U.merge(tpl, def) : U.merge(def);
      if (d.type && !GK.Prefabs.has(d.type)) { this.problem('Entity "' + (d.id || '?') + '": unknown type "' + d.type + '" (is its mechanic loaded?) — shown as a prop'); d.type = 'prop'; }
      const prefab = GK.Prefabs.get(d.type || 'prop');
      d = U.merge(prefab.defaults, d);
      const ent = new Entity(this, d);
      if (this.byId[ent.id]) this.problem('Duplicate entity id "' + ent.id + '"');
      this.byId[ent.id] = ent;
      this.entities.push(ent);
      ent.prefab = prefab;
      if (prefab.init) prefab.init(ent, this.game);
      if (d.type === 'spawn') this.spawn = { pos: ent.pos.slice(), rot: d.rot || 'n' };
      return ent;
    }
    get(id) { return this.byId[id] || null; }
    /** Entities by tag, type or item. */
    find(q) {
      return this.entities.filter(e => !e.removed && (q.tag ? e.tags.indexOf(q.tag) >= 0 : true) && (q.type ? e.type === q.type : true) && (q.item ? (e.def.item || e.id) === q.item : true));
    }
    addZone(z) {
      const zone = Object.assign({}, z);
      zone.id = z.id || ('zone-' + (++this.seq));
      const p = this.toPos(z);
      if (z.radius) zone.test = q => Math.hypot(q[0] - p[0], q[2] - p[2]) <= z.radius && q[1] >= p[1] - 1 && q[1] <= p[1] + (z.height || 4);
      else {
        const s = z.size || (z.cell || z.at ? [this.cell, 4, this.cell] : [2, 4, 2]);
        const sz = s.length === 2 ? [s[0], 4, s[1]] : s;
        zone.box = { min: [p[0] - sz[0] / 2, p[1] - 0.5, p[2] - sz[2] / 2], max: [p[0] + sz[0] / 2, p[1] + sz[1], p[2] + sz[2] / 2] };
        zone.test = q => Ph.contains(zone.box, q);
      }
      zone.center = p;
      zone.inside = false; zone.fired = 0;
      const old = this.zones.findIndex(o => o.id === zone.id);
      if (old >= 0) this.zones.splice(old, 1);   // a game zone replaces a world area with the same name
      this.zones.push(zone);
      return zone;
    }
    zone(id) { return this.zones.find(z => z.id === id) || null; }
    /** Zones a view should draw (config `show: true | colour`). */
    visibleZones() { return this.zones.filter(z => z.show && z.box && (z.if === undefined || GK.test(this.game, z.if))); }

    // ----- per-frame -----
    /** Everything the player collides with this frame (optionally leaving one entity out). */
    solids(except) {
      const out = this.statics.slice();
      for (const e of this.entities) if (e !== except && e.blocks()) out.push(e.collider());
      return out;
    }
    update(dt) {
      const g = this.game, pl = g.player, pbox = Ph.bodyBox(pl.pos, pl.r + 0.15, pl.h);
      for (const e of this.entities) {
        if (e.removed) continue;
        e.t += dt;
        if (e.spin) e.yaw += e.spin * dt;
        if (e.pressT > 0) { e.pressT -= dt; e.offset[1] = e.pressT > 0 ? -0.04 : 0; }
        if (e.prefab.update) e.prefab.update(e, dt, g);
        if (!e.active || g.state.mode !== 'playing') continue;
        if (e.def.touch || e.onTouch || e.def.onTouch) {
          if (Ph.overlap(pbox, e.pickBox())) {
            if (!e.touching) {
              e.touching = true;
              if (e.onTouch) e.onTouch(g);
              if (e.def.onTouch) GK.run(g, e.def.onTouch, { entity: e });
              if (e.def.touch && e.currentInteraction() && g.interactWith) g.interactWith(e, true);
            }
          } else e.touching = false;
        }
      }
      if (g.state.mode !== 'playing') return;
      const feet = [pl.pos[0], pl.pos[1] + 0.1, pl.pos[2]];
      for (const z of this.zones) {
        const inside = (z.if === undefined || GK.test(g, z.if)) && z.test(feet);
        g.state.inZone[z.id] = inside;
        if (inside === z.inside) {
          if (inside && z.onStay) GK.run(g, z.onStay, { zone: z, dt });
          continue;
        }
        z.inside = inside;
        if (inside) {
          if (z.once && z.fired) continue;
          z.fired++;
          g.emit('zone:enter', { id: z.id });
          GK.run(g, z.onEnter, { zone: z });
        } else {
          g.emit('zone:exit', { id: z.id });
          GK.run(g, z.onExit, { zone: z });
        }
      }
    }
    /** Nearest thing along a ray: {t, entity} (entity null = wall/floor). */
    raycast(o, d, maxDist) {
      let best = { t: maxDist, entity: null, hit: false };
      for (const s of this.statics) {
        const t = Ph.rayBox(o, d, s);
        if (t >= 0 && t < best.t) best = { t, entity: null, hit: true };
      }
      for (const e of this.entities) {
        if (!e.active) continue;
        const it = e.currentInteraction();
        if (!e.blocks() && !it) continue;
        const t = Ph.rayBox(o, d, it ? e.pickBox() : e.box());
        if (t >= 0 && t < best.t) best = { t, entity: e, hit: true };
      }
      return best;
    }
    /** Interactable entity closest to point p within `reach` (views without aiming, e.g. top-down). */
    nearest(p, reach, facing) {
      let best = null, bs = Infinity;
      for (const e of this.entities) {
        if (!e.active || !e.currentInteraction()) continue;
        const b = e.pickBox();
        const dx = Math.max(b.min[0] - p[0], 0, p[0] - b.max[0]), dz = Math.max(b.min[2] - p[2], 0, p[2] - b.max[2]);
        const d = Math.hypot(dx, dz);
        if (d > reach || b.min[1] > p[1] + 2.2 || b.max[1] < p[1] - 0.5) continue;
        const c = e.center(), dir = V.norm([c[0] - p[0], 0, c[2] - p[2]]);
        const score = d - (facing ? V.dot(dir, facing) * 0.4 : 0);
        if (score < bs) { bs = score; best = e; }
      }
      return best;
    }
  }
  GK.World = World;
})();

</script>
<script>/* game-types/../worlds/_parts.js */
/* World parts — reusable furniture groups for world grids, so worlds share pieces instead of copying them.
   Use in a world legend:  w: { part: 'workstation', location: 'pc#' }   (anything you add overrides the part)
   A part is a legend entry: {floor: true, entities: [...], rot, location}. Offsets are within one 2 m cell; the
   part's "front" (where a person stands or sits) faces +z unless noted. Add parts with GK.WorldParts.add(). */
(function () {
  'use strict';
  const P = GK.WorldParts;
  P.add('workstation', {   // student computer desk; the chair and screen face +z (a person sits on the +z side)
    floor: true, rot: 's',
    entities: [{ model: 'workstation', offset: [0, 0, -0.2] }, { model: 'chair', offset: [0, 0, 0.55], rot: 'n' }],
  });
  P.add('studentDesk', {
    floor: true, rot: 's',
    entities: [{ model: 'desk', look: { size: [1.1, 0.6] }, offset: [0, 0, -0.15] }, { model: 'chair', offset: [0, 0, 0.45], rot: 'n' }],
  });
  P.add('teacherDesk', {   // desk + computer, chair on the +z side
    floor: true, rot: 's',
    entities: [{ model: 'desk', look: { size: [1.6, 0.8] }, color: '#b08d64' }, { model: 'computer', y: 0.76, offset: [0.3, 0, 0] }, { model: 'chair', offset: [0, 0, 0.75], rot: 'n' }],
  });
  P.add('officeDesk', {    // desk + computer, chair on the −z side (faces the room)
    floor: true, rot: 's',

<script>/* game-types/_spatial/spatial.js */
/* Game Kit · game-types/_spatial/spatial.js

   builds the world + player body, checkpoints, respawn and falling, per-frame world update, and the
   list of labels (entity names + objective marker) a view projects onto the screen.
   Also registers the spatial conditions ({inZone}, {visible}) and actions (show/hide/teleport/…).
   A view calls:  GK.Spatial.setup(game) in setup(),  GK.Spatial.update(game, dt) in update(). */

    stepHeight: 0.4, accel: 14, airAccel: 3, sensitivity: 0.0022, invertY: false, fov: 72, reach: 3,
    canJump: true, canSprint: true, headBob: true, health: null, respawnOnDeath: false, killY: -15, steering: 'camera',

    PLAYER,
    setup(game) {
      const cfg = game.cfg;
      game.state.inZone = {};
      game.state.found = {};

      game.world = new GK.World(game);
      game.world.build(cfg);
      game.player = new GK.Player(game, U.merge(PLAYER, cfg.player));
      game.player.place(game.world.spawn.pos, game.world.spawn.rot);
      game.checkpoint = { pos: game.world.spawn.pos.slice(), rot: game.world.spawn.rot };
      game.setCheckpoint = (pos, rot, id) => {
        game.checkpoint = { pos: pos.slice(), rot: rot == null ? game.checkpoint.rot : rot };
        game.ui.toast('⚑ Checkpoint', 'good');
        game.audio.play('checkpoint');
        game.emit('checkpoint', { id: id || null });
      };
      game.respawn = heal => {
        if (heal && game.player.maxHealth != null) game.player.health = game.player.maxHealth;
        game.player.place(game.checkpoint.pos, game.checkpoint.rot);

        game.respawn();

        game.audio.play('hurt');

        if (pl.cfg.respawnOnDeath) {
          s.deaths++;

      if (game.cfg.ui.showLocations || GK.Settings.get('overlay', false)) {
        const r = game.cfg.ui.locationRange || 30;

          if (Math.hypot(L[0] - game.player.pos[0], L[2] - game.player.pos[2]) <= r) out.push({ text: '📍 ' + n, pos: [L[0], L[1] + 0.2, L[2]], cls: 'loc' });

        const t = game.missions.targetOf(game.missions.current());
        if (t) {
          const d = Math.round(Math.hypot(t[0] - game.player.pos[0], t[2] - game.player.pos[2]));

  A.add('remove', (g, a, ctx) => { const e = T(g, a, ctx); if (e) e.remove(); });
  A.add('enable', (g, a, ctx) => { const e = T(g, a, ctx); if (e) e.enabled = true; });
  A.add('disable', (g, a, ctx) => { const e = T(g, a, ctx); if (e) e.enabled = false; });
  A.add('set', (g, a, ctx) => { // change an entity's look / model / label / tint / name

    if (a.label !== undefined) e.label = a.label;
    if (a.tint !== undefined) e.tint = a.tint;

  A.add('checkpoint', (g, a) => g.setCheckpoint(a.pos || a.cell || a.at ? g.world.toPos(a) : g.player.pos, a.rot));
  A.add('damage', (g, a) => g.player.damage(a.amount || 10));
  A.add('heal', (g, a) => g.player.heal(a.amount || 10));

        for (const L of U.list(g.world.def && g.world.def.lights)) this.staticLights.push({ pos: g.world.toPos(L), color: L.color, range: L.range || 8, k: L.intensity == null ? 0.8 : L.intensity });
      }
      for (const L of this.staticLights) if (!L.ent || L.ent.active) add(L.pos, L.color, L.range, L.k);
      for (const e of g.world.entities) {
        if (!e.active) continue;
        if (e.type === 'fx' && e.model === 'bolt') add(e.pos, e.look.color, 4.5, 1.0);

      for (const f of this.flashes) add(f.pos, f.color, f.range, 1.6 * f.t / f.max);

      return out;
    }
    snapshot(out) { GK.Spatial.snapshot(this.game, out); }
    restore(snap, opts) { GK.Spatial.restore(this.game, snap, opts); }
    destroy() { this.teardown(); this.renderer.destroy(); this.canvas.remove(); }
  }

<script>/* mechanics/interaction/interaction.js */
/* Game Kit · mechanics/interaction
   "Press E (or click) on the thing in focus." The game type decides WHAT is in focus (first-person: the
   crosshair raycast; top-down: the nearest thing in reach) and calls game.setFocus(entity).
   This mechanic owns the interaction-type registry and runs an entity's current interaction:
     entity.interact: {type, prompt, if, requires, lockedText, once, actions} (or a list; first passing `if` wins)
   Built-in types here: inspect · activate (optionally toggle on/off) · trigger.
   Other mechanics add more: pickup/use (inventory), talk (dialogue), puzzle/input (puzzles), open/close/toggle (world-objects). */
(function () {
  'use strict';
  const U = GK.util;
  const I = GK.Interactions;

  I.add('inspect', {
    prompt: 'Inspect',
    run(g, ent, def, done) {
      g.ui.panel({ title: def.title || ent.name, text: U.fill(def.text, g.state.vars), html: def.html, onClose: () => done(true) });
      g.emit('inspect', { id: ent.id });
    },
  });
  I.add('activate', {
    prompt: (ent, def) => (def.toggle ? (ent.state.on ? 'Turn off' : 'Turn on') : 'Use'),
    run(g, ent, def, done) {
      ent.pressT = 0.2;
      g.audio.play(def.sound || 'click');
      if (def.toggle) {
        ent.state.on = !ent.state.on;
        if (ent.look && 'on' in ent.look) ent.setLook({ on: ent.state.on });
        GK.run(g, ent.state.on ? def.on : def.off, { entity: ent });
        g.emit('switch', { id: ent.id, on: ent.state.on });
      }
      done(true);
    },
  });
  I.add('trigger', { prompt: 'Use', run(g, ent, def, done) { g.audio.play(def.sound || 'click'); done(true); } });

  /** Prompt text for an entity's current interaction, e.g. "Talk to Ada". */
  GK.promptFor = function (g, ent, def) {
    if (def.prompt) return U.fill(typeof def.prompt === 'function' ? def.prompt(ent, def, g) : def.prompt, g.state.vars);
    const t = I.get(def.type || 'trigger');
    const verb = typeof t.prompt === 'function' ? t.prompt(ent, def, g) : t.prompt;
    return (verb + ' ' + (ent.name || '')).trim();
  };

  GK.Mechanics.add('interaction', {
    setup(game) {
      game.state.interacted = {};
      game.clickInteract = false;
      game.setFocus = ent => {
        game.focus = ent || null;
        game.ui.prompt(ent ? GK.promptFor(game, ent, ent.currentInteraction()) : null);
      };
      /** Run an entity's current interaction (E key, click, touch, or from code). */
      game.interactWith = (ent, byTouch) => {
        const def = ent && ent.currentInteraction();
        if (!def) return false;
        if (def.requires !== undefined && !GK.test(game, def.requires)) {
          if (!byTouch) { game.ui.toast(U.fill(def.lockedText || 'You can\'t do that yet.', game.state.vars), 'bad'); game.audio.play('deny'); }
          game.emit('interact:denied', { id: ent.id });
          return false;
        }
        I.get(def.type || 'trigger').run(game, ent, def, ok => {
          if (!ok) return;
          if (def.once) ent.used.add(def);
          game.state.interacted[ent.id] = (game.state.interacted[ent.id] || 0) + 1;
          GK.run(game, def.actions, { entity: ent, def });
          game.emit('interact', { id: ent.id, type: def.type || 'trigger' });
          if (game.missions) game.missions.check();
        });
        return true;
      };
    },
    update(game) {
      if ((game.input.pressed('interact') || game.clickInteract) && game.focus) game.interactWith(game.focus);
      game.clickInteract = false;
    },
  });
})();

</script>
<script>/* mechanics/inventory/inventory.js */
/* Game Kit · mechanics/inventory   (needs: interaction)
   Items the player carries, pickups and "use item on".
   Config:  items: { id: {name, icon, color, start: qty, hidden} }
   Adds:    interactions pickup · use {item, consume, failText}
            conditions {has:'item', count} · {lacks:'item'}      actions {do:'give'} · {do:'take'}
            game.giveItem / takeItem / hasItem / itemCount / itemName / itemDef / collect(entity, def)
   state.items = what is carried now; state.collected = totals ever picked up (by item, '#tag' and '*'). */
(function () {
  'use strict';
  const U = GK.util, I = GK.Interactions;

  I.add('pickup', { prompt: 'Pick up', run(g, ent, def, done) { g.collect(ent, def); done(true); } });
  I.add('use', {
    prompt: (ent, def, g) => 'Use ' + g.itemName(def.item) + ' on',
    run(g, ent, def, done) {
      if (!g.hasItem(def.item)) {
        g.ui.toast(U.fill(def.failText || ('You need: ' + g.itemName(def.item)), g.state.vars), 'bad');
        g.audio.play('deny');
        done(false);
        return;
      }
      if (def.consume) g.takeItem(def.item, def.qty || 1);
      g.audio.play('success');
      g.emit('item:used', { item: def.item, id: ent.id });
      done(true);
    },
  });
  GK.Conditions.add('has', (g, v, cond) => U.list(v).every(i => g.itemCount(i) >= (cond.count || 1)));
  GK.Conditions.add('lacks', (g, v) => U.list(v).every(i => g.itemCount(i) < 1));
  GK.Actions.add('give', (g, a) => g.giveItem(a.item, a.qty || 1, a.silent));
  GK.Actions.add('take', (g, a) => g.takeItem(a.item, a.qty || 1));

  GK.Mechanics.add('inventory', {
    configKeys: ['items'],
    restore(game) { game.ui.setInventory(game); },
    setup(game) {
      const s = game.state, items = game.cfg.items || {};
      s.items = {}; s.collected = {};
      for (const id in items) if (items[id].start) s.items[id] = items[id].start;
      const changed = () => { game.ui.setInventory(game); if (game.missions) game.missions.check(); };
      game.itemDef = id => items[id] || { name: id };
      game.itemName = id => game.itemDef(id).name || id;
      game.itemCount = id => s.items[id] || 0;
      game.hasItem = (id, n) => game.itemCount(id) >= (n || 1);
      game.giveItem = (id, qty, silent) => {
        qty = qty || 1;
        s.items[id] = game.itemCount(id) + qty;
        s.collected[id] = (s.collected[id] || 0) + qty;
        if (!silent) { game.ui.toast('+ ' + game.itemName(id), 'good'); game.audio.play('pickup'); }
        game.emit('item:added', { item: id, qty });
        changed();
      };
      game.takeItem = (id, qty) => {
        s.items[id] = Math.max(0, game.itemCount(id) - (qty || 1));
        if (!s.items[id]) delete s.items[id];
        game.emit('item:removed', { item: id, qty: qty || 1 });
        changed();
      };
      /** Pick up a collectible/item entity: {item, qty, points, message, sound} from the interaction or the entity. */
      game.collect = (ent, def) => {
        const d = ent.def, item = def.item || d.item || null, qty = def.qty || d.qty || 1;
        const pts = def.points != null ? def.points : d.points || 0;
        const name = item ? game.itemName(item) : (ent.name || 'item');
        if (item) s.items[item] = game.itemCount(item) + qty;
        const c = s.collected;
        c[item || ent.id] = (c[item || ent.id] || 0) + qty;
        for (const t of ent.tags) c['#' + t] = (c['#' + t] || 0) + qty;
        c['*'] = (c['*'] || 0) + qty;
        ent.remove();
        if (pts) game.scoring.add(pts, name, 'collect');
        game.audio.play(def.sound || d.sound || 'pickup');
        game.ui.toast(U.fill(def.message || d.message || ('+ ' + name), s.vars), 'good');
        game.emit('item:added', { item: item || ent.id, qty, id: ent.id, tags: ent.tags });
        changed();
      };
      game.ui.setInventory(game);
    },
  });
})();

</script>
<script>/* mechanics/objectives/objectives.js */
/* Game Kit · mechanics/objectives   (works with any game type; spatial types add find/reach)
   Objectives (missions) are config objects: {id, title, type, …, points, optional, hidden, after, if,
   timeLimit, failGame, hints, marker, onStart, onComplete, onFail}. ordered: true = one at a time,
   otherwise any order. Progress is read from game state, so the order of events never matters.
   Types: collect · find · reach · interact · talk · solve · sequence · event · flag · var · survive · custom.
   Also: hints (H key, config.hints + objective.hints), win when all required objectives are done
   (unless config.win is set), conditions {objective:'id'}, actions complete / fail / hint.
   Add types: GK.Objectives.add('name', { need(o), progress(o, game), target(o, game, fromPos) }). */(function () {
  'use strict';
  const U = GK.util, V = GK.vec;
  const O = GK.Objectives;
  const entPos = (g, id) => { const e = g.world && g.world.get(id); return e && e.active ? e.top() : null; };
  const st = (g, k) => g.state[k] || {};

  O.add('collect', { // {item:'chip', count:3} or {tag:'coin', count:10}
    need: o => o.count || 1,
    progress: (o, g) => st(g, 'collected')[o.item ? o.item : o.tag ? '#' + o.tag : '*'] || 0,
    target(o, g, from) {
      if (!g.world) return null;
      let best = null, bd = Infinity;
      for (const e of g.world.entities) {
        if (!e.active || !e.currentInteraction()) continue;
        if (o.item && (e.def.item || e.id) !== o.item) continue;
        if (o.tag && e.tags.indexOf(o.tag) < 0) continue;
        if (!o.item && !o.tag) continue;
        const d = V.dist(e.pos, from);
        if (d < bd) { bd = d; best = e.center(); }
      }
      return best;
    },
  });
  O.add('find', { // {target:'entityId', radius:3} — get close and look at it
    progress(o, g) {
      if (!g.world) return 0;
      if (g.state.found[o.target]) return 1;
      const e = g.world.get(o.target);
      if (!e || !e.active) return 0;
      const eye = g.player.eye(), c = e.center(), d = V.dist(eye, c);
      if (d <= (o.radius || 3) && V.dot(V.norm(V.sub(c, eye)), g.player.forward()) > 0.8) { g.state.found[o.target] = 1; return 1; }
      return 0;
    },
    target: (o, g) => entPos(g, o.target),
  });
  O.add('reach', { // {zone:'exit'} or {target:'entityId', radius:2} or {pos:[x,y,z], radius:2}
    progress(o, g) {
      if (!g.world) return 0;
      if (o.zone) return g.state.inZone[o.zone] ? 1 : 0;
      const p = o.target ? entPos(g, o.target) : g.world.toPos(o);
      return p && Math.hypot(p[0] - g.player.pos[0], p[2] - g.player.pos[2]) <= (o.radius || 2) ? 1 : 0;
    },
    target(o, g) { if (!g.world) return null; if (o.zone) { const z = g.world.zone(o.zone); return z ? z.center : null; } return o.target ? entPos(g, o.target) : g.world.toPos(o); },
  });
  O.add('interact', { need: o => o.count || 1, progress: (o, g) => st(g, 'interacted')[o.target] || 0, target: (o, g) => entPos(g, o.target) });
  O.add('talk', { progress: (o, g) => (st(g, 'talked')[o.target || o.npc] ? 1 : 0), target: (o, g) => entPos(g, o.target || o.npc) });
  O.add('solve', { progress: (o, g) => (st(g, 'solved')[o.puzzle] ? 1 : 0), target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('sequence', { progress: (o, g) => (st(g, 'sequences')[o.sequence] ? 1 : 0), target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('event', { need: o => o.count || 1, progress: (o, g) => g.state.events[o.event] || 0, target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('flag', { progress: (o, g) => (g.state.flags[o.flag] ? 1 : 0), target: (o, g) => (o.target ? entPos(g, o.target) : null) });
  O.add('var', { need: o => o.count || 1, progress: (o, g) => Number(g.state.vars[o.name]) || 0 });
  O.add('survive', { need: o => o.seconds || 30, progress: (o, g) => Math.floor(g.state.time - (o.startedAt || 0)) });
  O.add('custom', { need: o => o.need || 1, progress: (o, g) => { const r = o.check(g); return r === true ? (o.need || 1) : Number(r) || 0; } });

  class Missions {
    constructor(game, list, ordered) {
      this.game = game;
      this.ordered = !!ordered;
      this.list = U.list(list).map((d, i) => Object.assign({ id: 'objective' + (i + 1), type: 'custom' }, d, { status: 'waiting', cur: 0, hintIndex: 0 }));
      this.pollT = 0;
    }
    get(id) { return this.list.find(o => o.id === id) || null; }
    isDone(id) { const o = this.get(id); return !!o && o.status === 'done'; }
    need(o) { const t = O.has(o.type) && O.get(o.type); return t && t.need ? t.need(o, this.game) : 1; }   // unknown types: reported by validate()
    required() { return this.list.filter(o => !o.optional); }
    doneCount() { return this.required().filter(o => o.status === 'done').length; }
    allDone() { return this.required().every(o => o.status === 'done'); }
    active() { return this.list.filter(o => o.status === 'active'); }
    /** The objective hints and markers point at: first active required one (else first active). */
    current() { const a = this.active(); return a.find(o => !o.optional) || a[0] || null; }
    eligible(o) {
      if (o.status !== 'waiting') return false;
      if (this.ordered && !o.optional) {
        for (const p of this.required()) { if (p === o) break; if (p.status !== 'done') return false; }
      }
      if (o.after && !U.list(o.after).every(id => this.isDone(id))) return false;
      if (o.if !== undefined && !GK.test(this.game, o.if)) return false;
      return true;
    }
    start() { this.check(); }
    /** Re-evaluate everything; called after events and a few times a second. */
    check() {
      const g = this.game;
      if (g.state.mode === 'ended' || g.state.mode === 'title') return;
      let changed = true, guard = 0;
      while (changed && guard++ < 20) {
        changed = false;
        for (const o of this.list) {
          if (this.eligible(o)) {
            o.status = 'active'; o.startedAt = g.state.time; changed = true;
            g.emit('objective:start', { id: o.id });
            if (o.onStart) GK.run(g, o.onStart, { objective: o });
          }
          if (o.status !== 'active' || !O.has(o.type)) continue;   // unknown types are reported by validate()
          const t = O.get(o.type);
          o.cur = Math.min(this.need(o), t.progress(o, g));
          if (o.cur >= this.need(o)) { this.complete(o.id); changed = true; }
          else if (o.timeLimit && g.state.time - o.startedAt > o.timeLimit) { this.fail(o.id, 'Time ran out: ' + o.title); changed = true; }
        }
      }
      g.ui.setObjectives(this);
      if (this.required().length && this.allDone() && g.cfg.win == null) g.win();
    }
    update(dt) {
      this.pollT -= dt;
      if (this.pollT <= 0) { this.pollT = 0.1; this.check(); }
    }
    complete(id) {
      const o = this.get(id), g = this.game;
      if (!o || o.status === 'done') return;
      o.status = 'done'; o.cur = this.need(o);
      const pts = o.points == null ? g.cfg.scoring.objective : o.points;
      if (pts) g.scoring.add(pts, o.title || o.id, 'objective');
      g.audio.play('objective');
      g.ui.toast('✓ ' + (o.title || 'Objective complete'), 'good');
      if (o.onComplete) GK.run(g, o.onComplete, { objective: o });
      if (o.checkpoint && g.setCheckpoint) g.setCheckpoint(g.player.pos, null, o.id);
      g.emit('objective:complete', { id: o.id });
      g.ui.setObjectives(this);
    }
    fail(id, text) {
      const o = this.get(id), g = this.game;
      if (!o || o.status === 'done' || o.status === 'failed') return;
      o.status = 'failed';
      g.emit('objective:failed', { id: o.id });
      if (o.onFail) GK.run(g, o.onFail, { objective: o });
      if (!o.optional && o.failGame !== false) g.lose(text || ('Objective failed: ' + o.title));
      else g.ui.toast('✗ ' + (o.title || 'Objective failed'), 'bad');
    }
    /** Where the current objective is (for the on-screen marker), or null. */
    targetOf(o) {
      if (!o || o.marker === false || !O.has(o.type)) return null;
      const t = O.get(o.type);
      return t.target ? t.target(o, this.game, this.game.player ? this.game.player.pos : [0, 0, 0]) : null;
    }
  }
  GK.Missions = Missions;

  GK.Conditions.add('objective', (g, v) => U.list(v).every(id => g.missions && g.missions.isDone(id)));
  GK.Actions.add('complete', (g, a) => g.missions.complete(a.objective));
  GK.Actions.add('fail', (g, a) => g.missions.fail(a.objective, a.text));
  GK.Actions.add('hint', (g, a) => (a.text ? g.ui.toast('💡 ' + a.text, 'hint') : g.hint()));

  /** Every puzzle id the game can open: config.puzzles plus inline puzzles on entities (e.g. terminals). */
  const puzzleIds = g => {
    const ids = new Set(Object.keys(g.cfg.puzzles || {}));
    if (g.world) for (const e of g.world.entities) for (const d of e.interact) if (d.type === 'puzzle' || d.type === 'input') ids.add(typeof d.puzzle === 'string' ? d.puzzle : (d.puzzle && d.puzzle.id) || d.id || e.id + ':input');
    return ids;
  };

  GK.Mechanics.add('objectives', {
    configKeys: ['objectives', 'ordered', 'hints'],
    /** Report objectives that point at things that do not exist (they could never complete). */
    validate(game, report) {
      const g = game, w = g.world, other = g.sceneMode;   // in scenes, targets may live in another scene
      const ids = new Set(), puzzles = puzzleIds(g);
      const items = new Set(Object.keys(g.cfg.items || {}));
      if (w) for (const e of w.entities) if (e.def.item) items.add(e.def.item);
      for (const o of g.missions.list) {
        const where = 'Objective "' + o.id + '"';
        if (ids.has(o.id)) report(where + ': duplicate id');
        ids.add(o.id);
        if (!O.has(o.type)) { report(where + ': unknown type "' + o.type + '"', 'error'); continue; }
        const ent = o.target || o.npc;
        if (ent && w && !other && !w.get(ent)) report(where + ': no entity "' + ent + '"', 'error');
        if (o.type === 'reach' && o.zone && w && !w.zone(o.zone)) report(where + ': no zone or area "' + o.zone + '"', 'error');
        if (o.type === 'solve' && !other && !puzzles.has(o.puzzle)) report(where + ': no puzzle "' + o.puzzle + '" (known: ' + [...puzzles].join(', ') + ')', 'error');
        if (o.type === 'collect' && o.item && !other && !items.has(o.item)) report(where + ': nothing gives item "' + o.item + '"', 'error');
        if (o.type === 'collect' && o.tag && w && !other && !w.entities.some(e => e.tags.indexOf(o.tag) >= 0)) report(where + ': nothing has tag "' + o.tag + '"', 'error');
        if (o.type === 'sequence' && !(g.cfg.sequences || {})[o.sequence]) report(where + ': no sequence "' + o.sequence + '"', 'error');
        for (const a of U.list(o.after)) if (!g.missions.get(a)) report(where + ': "after" names unknown objective "' + a + '"', 'error');
      }
    },
    restore(game, snap) {
      for (const s of snap.objectives || []) { const o = game.missions.get(s.id); if (o) { o.status = s.status; o.cur = s.cur; } }
      game.ui.setObjectives(game.missions);
    },
    setup(game) {
      game.state.hintsUsed = 0;
      game.missions = new Missions(game, game.cfg.objectives, game.cfg.ordered);
      game.hintState = { general: 0 };
      /** Next hint for the current objective (costs scoring.hint points the first time each hint is shown). */
      game.hint = () => {
        const o = game.missions.current(), cfg = game.cfg;
        let list = o ? U.list(o.hints || o.hint) : [];
        const general = !list.length;
        if (general) list = U.list(cfg.hints.general);
        if (!list.length) { game.ui.toast('No hint for this right now.'); return; }
        const holder = general ? game.hintState : o;
        const key = general ? 'general' : 'hintIndex';
        holder[key] = holder[key] || 0;
        if (holder[key] < list.length) {
          if (cfg.hints.max != null && game.state.hintsUsed >= cfg.hints.max) { game.ui.toast('No hints left.', 'bad'); return; }
          game.state.hintsUsed++;
          if (cfg.scoring.hint) game.scoring.add(-cfg.scoring.hint, 'Hint', 'hint');
          holder[key]++;
        }
        const idx = holder[key] - 1;
        game.ui.toast('💡 ' + U.fill(list[idx], game.state.vars) + (list.length > 1 ? '  (' + (idx + 1) + '/' + list.length + ')' : ''), 'hint');
        game.audio.play('hint');
        game.emit('hint', { objective: o ? o.id : null, index: idx });
      };
      game.ui.setObjectives(game.missions);
    },
    start(game) { game.missions.start(); },
    update(game, dt) { game.missions.update(dt); },
    snapshot(game, out) { out.objectives = game.missions.list.map(o => ({ id: o.id, status: o.status, cur: o.cur })); },
  });
})();

</script>
<script>/* mechanics/dialogue/dialogue.js */
/* Game Kit · mechanics/dialogue   (needs: interaction)
   Conversations shown in the dialogue box, one line at a time, with optional choices.
     lines:  ['Hello!', {text, speaker, actions}]
     dialog: {start:'hi', nodes:{hi:{text, speaker, choices:[{text, goto, actions, if}], next, actions}}}
   Adds: interaction `talk` (NPCs use it), action {do:'talk', speaker, lines|dialog} (works without a map,
   e.g. in quiz or card games), game.startDialog(d, onEnd), state.talked[id]. */
(function () {
  'use strict';
  const U = GK.util;

  GK.Interactions.add('talk', {
    prompt: 'Talk to',
    run(g, ent, def, done) {
      g.startDialog({ name: def.speaker || ent.name, lines: def.lines, dialog: def.dialog, entity: ent }, () => {
        g.state.talked[ent.id] = (g.state.talked[ent.id] || 0) + 1;
        g.emit('talk', { id: ent.id });
        done(true);
      });
    },
  });
  GK.Actions.add('talk', (g, a) => g.startDialog({ name: a.speaker || '', lines: a.lines, dialog: a.dialog }, () => {
    if (a.id) { g.state.talked[a.id] = (g.state.talked[a.id] || 0) + 1; g.emit('talk', { id: a.id }); }
    GK.run(g, a.then);
  }));

  GK.Mechanics.add('dialogue', {
    setup(game) {
      game.state.talked = {};
      game.talkingTo = null;
      game.startDialog = (d, onEnd) => {
        game.talkingTo = d.entity || null;
        const end = () => { game.ui.closeDialog(); game.talkingTo = null; if (onEnd) onEnd(); };
        if (d.dialog) {
          const nodes = d.dialog.nodes || d.dialog;
          const show = id => {
            const n = id && nodes[id];
            if (!n) { end(); return; }
            if (n.actions) GK.run(game, n.actions, { entity: d.entity });
            const choices = U.list(n.choices).filter(c => c.if === undefined || GK.test(game, c.if))
              .map(c => ({ text: U.fill(c.text, game.state.vars), pick: () => { GK.run(game, c.actions, { entity: d.entity }); show(c.goto); } }));
            game.ui.dialog({ speaker: n.speaker || d.name, text: n.text, choices, next: () => show(n.next) });
          };
          show(d.dialog.start || Object.keys(nodes)[0]);
          return;
        }
        const lines = U.list(d.lines);
        let i = 0;
        const next = () => {
          if (i >= lines.length) { end(); return; }
          const L = typeof lines[i] === 'string' ? { text: lines[i] } : lines[i];
          i++;
          if (L.actions) GK.run(game, L.actions, { entity: d.entity });
          game.ui.dialog({ speaker: L.speaker || d.name, text: L.text, next });
        };
        next();
      };
    },
  });
})();

</script>
<script>/* mechanics/puzzles/puzzles.js */
/* Game Kit · mechanics/puzzles   (needs: interaction)
   Puzzles shown in a panel, usable from any game type: input (answer / password / enter information),
   choice (multiple choice), order (put items in order), quiz (several questions, pass mark),
   sort (items into groups), bits (binary switches to a target number), mix (red/green/blue light),
   logic (gate expression: test with switches, fill in the truth table).
   Config: puzzles: {id: {type, title, points, penalty, maxAttempts, onSolve, onFail, …}}
   Adds: interactions puzzle {puzzle:'id'|{…}} · input {question, store}; condition {solved:'id'};
         action {do:'puzzle', puzzle}; game.openPuzzle(ref, done(solved), entity); state.solved.
   New puzzle types: GK.Puzzles.add('name', { render(body, pz, api) }) — api.solve() · api.wrong(msg) · api.close() · api.note(msg) · api.game. */
(function () {
  'use strict';
  const U = GK.util, PZ = GK.Puzzles;

  /** Does value match answer? answer: string | number | array (any) | RegExp | fn(value) */
  PZ.matches = function (answer, value, pz) {
    const norm = s => (pz && pz.exact ? String(s) : String(s).trim().toLowerCase().replace(/\s+/g, ' '));
    if (answer instanceof RegExp) return answer.test(String(value).trim());
    if (typeof answer === 'function') return !!answer(value);
    if (Array.isArray(answer)) return answer.some(a => PZ.matches(a, value, pz));
    return norm(answer) === norm(value);
  };

  const question = (body, text) => { if (text) body.appendChild(U.el('p', 'gk-q', text)); };
  const feedback = body => body.appendChild(U.el('div', 'gk-feedback'));

  PZ.add('input', {
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars));
      const row = U.el('div', 'gk-row');
      const inp = U.el('input', 'gk-input');
      inp.type = 'text';
      inp.placeholder = pz.placeholder || (pz.numeric ? '0000' : 'Type here…');
      if (pz.numeric) inp.inputMode = 'numeric';
      if (pz.maxLength) inp.maxLength = pz.maxLength;
      inp.autocomplete = 'off'; inp.spellcheck = false;
      const btn = U.el('button', 'gk-btn primary', pz.button || (pz.store ? 'Save' : 'Check'));
      row.append(inp, btn);
      body.appendChild(row);
      feedback(body);
      const submit = () => {
        const v = inp.value;
        if (!String(v).trim()) { inp.focus(); return; }
        if (pz.store) { api.game.state.vars[pz.store] = v.trim(); api.game.emit('var:changed', { name: pz.store, value: v.trim() }); }
        if (pz.answer === undefined || PZ.matches(pz.answer, v, pz)) api.solve();
        else { api.wrong(pz.wrongText); inp.select(); }
      };
      btn.onclick = submit;
      inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
      setTimeout(() => inp.focus(), 30);
    },
  });

  PZ.add('choice', {
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars));
      const list = U.el('div', 'gk-choices');
      const correct = U.list(pz.correct);
      pz.options.forEach((opt, i) => {
        const b = U.el('button', 'gk-btn choice', opt);
        b.onclick = () => {
          if (correct.indexOf(i) >= 0 || correct.indexOf(opt) >= 0) {
            b.classList.add('right');
            list.querySelectorAll('button').forEach(x => { x.disabled = true; });   // no second click while it animates
            setTimeout(api.solve, 250);
          }
          else {   // explain: one text per option (array), or one text for all (shown by the quiz type)
            b.classList.add('wrong'); b.disabled = true;
            api.wrong(Array.isArray(pz.explain) ? pz.explain[i] : pz.wrongText);
          }
        };
        list.appendChild(b);
      });
      body.appendChild(list);
      feedback(body);
    },
  });

  PZ.add('order', { // pz.items in the CORRECT order; they are shown shuffled.
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars) || 'Put these in the right order.');
      const answer = U.el('div', 'gk-order-answer'), pool = U.el('div', 'gk-order-pool');
      const rnd = U.rng(pz.items.length * 97 + (pz.seed || 1));
      const shuffled = pz.items.map((t, i) => ({ t, i })).sort(() => rnd() - 0.5);
      if (shuffled.every((x, k) => x.i === k) && shuffled.length > 1) shuffled.push(shuffled.shift());
      let picked = [];
      const draw = () => {
        answer.innerHTML = ''; pool.innerHTML = '';
        picked.forEach((x, k) => answer.appendChild(U.el('div', 'gk-chip on', (k + 1) + '. ' + x.t)));
        if (!picked.length) answer.appendChild(U.el('div', 'gk-muted', 'Click the items below in order…'));
        shuffled.filter(x => picked.indexOf(x) < 0).forEach(x => {
          const b = U.el('button', 'gk-chip', x.t);
          b.onclick = () => { picked.push(x); draw(); if (picked.length === shuffled.length) check(); };
          pool.appendChild(b);
        });
      };
      const check = () => {
        if (picked.every((x, k) => x.i === k)) setTimeout(api.solve, 250);
        else { api.wrong(pz.wrongText || 'Not quite — try a different order.'); picked = []; setTimeout(draw, 500); }
      };
      const reset = U.el('button', 'gk-btn small', '↺ Start again');
      reset.onclick = () => { picked = []; draw(); };
      body.append(answer, pool, reset);
      feedback(body);
      draw();
    },
  });

  PZ.add('quiz', { // pz.questions: [{type:'choice'|'input', …}], pz.pass = how many must be right (default all)
    render(body, pz, api) {
      const qs = pz.questions, pass = pz.pass == null ? qs.length : pz.pass;
      let i = 0, right = 0, missed = false;
      const next = () => {
        body.innerHTML = '';
        if (i >= qs.length) {
          if (right >= pass) api.solve();
          else { api.wrong('You got ' + right + ' of ' + qs.length + '. You need ' + pass + '.'); const b = U.el('button', 'gk-btn primary', 'Try again'); b.onclick = () => { i = 0; right = 0; next(); }; body.appendChild(b); }
          return;
        }
        body.appendChild(U.el('div', 'gk-muted', 'Question ' + (i + 1) + ' of ' + qs.length));
        const q = qs[i], sub = U.el('div');
        body.appendChild(sub);
        missed = false;
        PZ.get(q.type || 'choice').render(sub, q, {
          game: api.game,
          solve: () => { if (!missed) right++; i++; next(); },
          wrong: msg => { missed = true; api.note(msg || 'Not quite.'); if (!pz.retry) { i++; setTimeout(next, 700); } },
          close: api.close,
          note: api.note,
        });
      };
      next();
    },
  });
  PZ.add('sort', { // pz.bins: ['Input', 'Output'], pz.items: [{text, bin: index | name, why}] — put every item in its group
    render(body, pz, api) {
      question(body, U.fill(pz.question, api.game.state.vars) || 'Put each item in the right group.');
      const bins = pz.bins.map((b, i) => ({ name: typeof b === 'string' ? b : b.name, i }));
      const binOf = it => (typeof it.bin === 'number' ? it.bin : bins.findIndex(b => b.name === it.bin));
      const rnd = U.rng(pz.items.length * 31 + (pz.seed || 3));
      const items = pz.items.map((it, k) => ({ text: typeof it === 'string' ? it : it.text, bin: binOf(it), why: it.why, k })).sort(() => rnd() - 0.5);
      let picked = null;
      const pool = U.el('div', 'gk-order-pool'), row = U.el('div', 'gk-sort-bins');
      const boxes = bins.map(b => {
        const box = U.el('button', 'gk-sort-bin');
        box.innerHTML = '<b>' + U.esc(b.name) + '</b><span class="gk-sort-in"></span>';
        box.onclick = () => {
          if (!picked) { api.note('First click an item, then click its group.'); return; }
          const it = picked;
          if (it.bin === b.i) {
            it.done = true; picked = null;
            box.querySelector('.gk-sort-in').appendChild(U.el('span', 'gk-chip on', it.text));
            api.game.audio.play('click');
            draw();
            if (items.every(x => x.done)) setTimeout(api.solve, 300);
          } else {
            api.wrong(it.why || (it.text + ' does not go in "' + b.name + '".'));
            picked = null; draw();
          }
        };
        row.appendChild(box);
        return box;
      });
      const draw = () => {
        pool.innerHTML = '';
        items.filter(x => !x.done).forEach(x => {
          const b = U.el('button', 'gk-chip' + (x === picked ? ' sel' : ''), x.text);
          b.onclick = () => { picked = x === picked ? null : x; draw(); };
          pool.appendChild(b);
        });
        boxes.forEach(bx => bx.classList.toggle('ready', !!picked));
      };
      body.append(pool, row);
      feedback(body);
      draw();
    },
  });

  PZ.add('bits', { // binary switches: pz.bits (5), pz.target (number), pz.values (place values), pz.check (press Check instead of auto)
    render(body, pz, api) {
      const n = pz.bits || 5, vals = pz.values || Array.from({ length: n }, (_, i) => Math.pow(2, n - 1 - i));
      question(body, U.fill(pz.question, api.game.state.vars) || 'Switch the bits on to make ' + pz.target + '.');
      const on = Array(n).fill(false);
      const wrap = U.el('div', 'gk-bits'), total = U.el('div', 'gk-bits-total');
      const sum = () => on.reduce((s, b, i) => s + (b ? vals[i] : 0), 0);
      let done = false;
      const draw = () => {
        wrap.innerHTML = '';
        on.forEach((b, i) => {
          const cell = U.el('button', 'gk-bit' + (b ? ' on' : ''));
          cell.innerHTML = (pz.hideValues ? '' : '<small>' + vals[i] + '</small>') + '<b>' + (b ? 1 : 0) + '</b>';
          cell.onclick = () => {
            if (done) return;
            on[i] = !on[i]; api.game.audio.play('click'); draw();
            if (!pz.check && sum() === pz.target) { done = true; setTimeout(api.solve, 300); }
          };
          wrap.appendChild(cell);
        });
        total.textContent = pz.hideTotal ? 'Binary: ' + on.map(b => (b ? 1 : 0)).join('') : 'Binary ' + on.map(b => (b ? 1 : 0)).join('') + ' = ' + sum();
      };
      body.append(wrap, total);
      if (pz.check) {
        const btn = U.el('button', 'gk-btn primary', pz.button || 'Check');
        btn.onclick = () => { if (done) return; if (sum() === pz.target) { done = true; api.solve(); } else api.wrong(pz.wrongText || 'Not yet: that is ' + sum() + '.'); };
        body.appendChild(btn);
      }
      feedback(body);
      draw();
    },
  });

  PZ.add('mix', { // red / green / blue light: pz.target [r,g,b] or pz.targets [[r,g,b], …] (+ pz.names), pz.steps [0,128,255]
    render(body, pz, api) {
      const targets = pz.targets || [pz.target], names = pz.names || [];
      const steps = pz.steps || [0, 128, 255], word = v => (v === 0 ? 'OFF' : v === 255 ? 'FULL' : v >= 128 ? 'HALF' : 'LOW');
      question(body, U.fill(pz.question, api.game.state.vars) || 'Mix red, green and blue light.');
      const lv = [0, 0, 0];
      let k = 0;
      const head = U.el('div', 'gk-muted'), sw = U.el('div', 'gk-mix-swatches'), ctl = U.el('div', 'gk-mix-lamps');
      const ch = [['Red', '255,60,60'], ['Green', '60,220,90'], ['Blue', '70,120,255']];
      const draw = () => {
        const t = targets[k];
        head.textContent = (targets.length > 1 ? 'Colour ' + (k + 1) + ' of ' + targets.length + ': ' : 'Target: ') + (names[k] || 'match the target');
        sw.innerHTML = '<div><span class="gk-sw" style="background:rgb(' + lv.join(',') + ')"></span>Your light</div>' +
          '<div><span class="gk-sw target" style="background:rgb(' + t.join(',') + ')"></span>Target</div>';
        ctl.innerHTML = '';
        lv.forEach((v, i) => {
          const b = U.el('button', 'gk-lamp');
          b.innerHTML = '<span class="gk-lamp-dot" style="background:rgba(' + ch[i][1] + ',' + (0.15 + v / 255 * 0.85) + ')"></span><b>' + ch[i][0] + '</b><small>' + word(v) + ' (' + v + ')</small>';
          b.onclick = () => {
            lv[i] = steps[(steps.indexOf(lv[i]) + 1) % steps.length]; api.game.audio.play('click'); draw();
            if (lv.every((x, j) => x === targets[k][j])) {
              if (k < targets.length - 1) { api.note('Correct! Next colour.', true); k++; lv.fill(0); setTimeout(draw, 500); }
              else setTimeout(api.solve, 300);
            }
          };
          ctl.appendChild(b);
        });
      };
      body.append(head, sw, ctl);
      feedback(body);
      draw();
    },
  });

  /** Evaluate a logic expression like "(A AND B) OR NOT C" with values {A: true, …}. */
  PZ.logic = function (expr, v) {
    const toks = String(expr).toUpperCase().match(/\(|\)|AND|OR|XOR|NOT|[A-Z]/g) || [];
    let i = 0;
    const atom = () => {
      const t = toks[i++];
      if (t === 'NOT') return !atom();
      if (t === '(') { const r = or(); i++; return r; }
      return !!v[t];
    };
    const and = () => { let r = atom(); while (toks[i] === 'AND') { i++; const b = atom(); r = r && b; } return r; };
    const xor = () => { let r = and(); while (toks[i] === 'XOR') { i++; const b = and(); r = r !== b; } return r; };
    const or = () => { let r = xor(); while (toks[i] === 'OR') { i++; const b = xor(); r = r || b; } return r; };
    return or();
  };
  PZ.add('logic', { // logic gates: pz.expr 'A AND B', pz.inputs ['A','B'] — test with switches, then fill in the truth table
    render(body, pz, api) {
      const ins = pz.inputs || (String(pz.expr).toUpperCase().match(/\b[A-Z]\b/g) || []).filter((x, i, a) => a.indexOf(x) === i);
      question(body, U.fill(pz.question, api.game.state.vars) || 'When does the lamp turn on? Test the switches, then fill in the table.');
      body.appendChild(U.el('div', 'gk-logic-expr', 'Lamp = ' + pz.expr));
      const sw = {}; ins.forEach(n => { sw[n] = false; });
      const bench = U.el('div', 'gk-logic-bench'), table = U.el('table', 'gk-logic-table');
      const rows = [];
      for (let m = 0; m < Math.pow(2, ins.length); m++) {
        const v = {}; ins.forEach((n, j) => { v[n] = !!(m >> (ins.length - 1 - j) & 1); });
        rows.push({ v, want: PZ.logic(pz.expr, v), got: null });
      }
      const drawBench = () => {
        bench.innerHTML = '';
        ins.forEach(n => {
          const b = U.el('button', 'gk-bit' + (sw[n] ? ' on' : ''));
          b.innerHTML = '<small>' + n + '</small><b>' + (sw[n] ? 1 : 0) + '</b>';
          b.onclick = () => { sw[n] = !sw[n]; api.game.audio.play('click'); drawBench(); };
          bench.appendChild(b);
        });
        const lit = PZ.logic(pz.expr, sw);
        bench.appendChild(U.el('span', 'gk-logic-lamp' + (lit ? ' on' : ''), lit ? 'ON' : 'OFF'));
      };
      const drawTable = () => {
        table.innerHTML = '<tr>' + ins.map(n => '<th>' + n + '</th>').join('') + '<th>Lamp</th></tr>';
        rows.forEach(r => {
          const tr = U.el('tr');
          tr.innerHTML = ins.map(n => '<td>' + (r.v[n] ? 1 : 0) + '</td>').join('');
          const td = U.el('td'), b = U.el('button', 'gk-btn small' + (r.got == null ? '' : r.got ? ' on' : ''), r.got == null ? '?' : r.got ? '1' : '0');
          b.onclick = () => { r.got = r.got == null ? true : r.got ? false : null; drawTable(); };
          td.appendChild(b); tr.appendChild(td); table.appendChild(tr);
        });
      };
      const btn = U.el('button', 'gk-btn primary', 'Check the table');
      btn.onclick = () => {
        if (rows.some(r => r.got == null)) { api.note('Fill in every row first (click ? to choose 1 or 0).'); return; }
        const bad = rows.filter(r => r.got !== r.want).length;
        if (!bad) api.solve(); else api.wrong(bad + ' row' + (bad === 1 ? ' is' : 's are') + ' wrong. Test them with the switches.');
      };
      drawBench(); drawTable();
      body.append(bench, table, btn);
      feedback(body);
    },
  });

  GK.Interactions.add('puzzle', { prompt: 'Solve', run(g, ent, def, done) { g.openPuzzle(def.puzzle || def, done, ent); } });
  GK.Interactions.add('input', { // enter information: {type:'input', question, store:'varName'} or with `answer` to check it
    prompt: 'Use',
    run(g, ent, def, done) { g.openPuzzle(U.merge({ type: 'input', id: def.id || (ent.id + ':input') }, def), done, ent); },
  });
  GK.Conditions.add('solved', (g, v) => U.list(v).every(id => !!g.state.solved[id]));
  GK.Actions.add('puzzle', (g, a) => g.openPuzzle(a.puzzle));

  /** Readable answer of a puzzle, for the teacher panel. */
  PZ.answerText = function (pz) {
    const t = pz.type || 'input';
    if (t === 'choice') return U.list(pz.correct).map(c => (typeof c === 'number' ? pz.options[c] : c)).join(' / ');
    if (t === 'order') return pz.items.join(' → ');
    if (t === 'quiz') return pz.questions.map((q, i) => (i + 1) + ') ' + PZ.answerText(q)).join('   ');
    if (t === 'sort') return pz.bins.map((b, i) => (typeof b === 'string' ? b : b.name) + ': ' + pz.items.filter(it => it.bin === i || it.bin === (typeof b === 'string' ? b : b.name)).map(it => it.text).join(', ')).join(' | ');
    if (t === 'bits') { const n = pz.bits || 5; return pz.target + ' = ' + Number(pz.target).toString(2).padStart(n, '0'); }
    if (t === 'mix') return (pz.targets || [pz.target]).map((c, i) => (pz.names && pz.names[i] ? pz.names[i] + ' ' : '') + 'rgb(' + c.join(', ') + ')').join(' → ');
    if (t === 'logic') return 'Lamp = ' + pz.expr + ' (fill each row with the result)';
    if (pz.answer === undefined) return pz.store ? '(anything — it is saved as ' + pz.store + ')' : '(any answer)';
    return U.list(pz.answer).map(a => (a instanceof RegExp ? a.source : typeof a === 'function' ? '(checked by code)' : String(a))).join(' / ');
  };

  GK.Mechanics.add('puzzles', {
    configKeys: ['puzzles'],
    validate(game, report) {
      const all = Object.assign({}, game.cfg.puzzles);
      if (game.world) for (const e of game.world.entities) for (const d of e.interact) if (d.type === 'puzzle' && d.puzzle && typeof d.puzzle === 'object') all[d.puzzle.id || e.id] = d.puzzle;
      for (const id in all) {
        const pz = all[id], t = pz.type || 'input';
        if (!PZ.has(t)) report('Puzzle "' + id + '": unknown type "' + t + '"', 'error');
        else if (t === 'choice' && !(pz.options && pz.options.length && pz.correct !== undefined)) report('Puzzle "' + id + '": a choice puzzle needs options and correct', 'error');
        else if (t === 'order' && !(pz.items && pz.items.length > 1)) report('Puzzle "' + id + '": an order puzzle needs at least 2 items', 'error');
        else if (t === 'sort' && !(pz.bins && pz.bins.length > 1 && pz.items && pz.items.length)) report('Puzzle "' + id + '": a sort puzzle needs bins (2 or more) and items', 'error');
        else if (t === 'bits' && typeof pz.target !== 'number') report('Puzzle "' + id + '": a bits puzzle needs a number target', 'error');
        else if (t === 'mix' && !(pz.target || pz.targets)) report('Puzzle "' + id + '": a mix puzzle needs target [r,g,b] or targets', 'error');
        else if (t === 'logic' && !pz.expr) report('Puzzle "' + id + '": a logic puzzle needs expr, e.g. "A AND B"', 'error');
      }
      if (game.world) for (const e of game.world.entities) for (const d of e.interact) if (d.type === 'puzzle' && typeof d.puzzle === 'string' && !all[d.puzzle]) report('Entity "' + e.id + '": no puzzle "' + d.puzzle + '" in config.puzzles', 'error');
    },
    /** For the teacher panel: every puzzle and its answer. */
    answers(game) {
      const out = [];
      for (const id in game.cfg.puzzles || {}) out.push({ where: game.cfg.puzzles[id].title || id, answer: PZ.answerText(game.cfg.puzzles[id]) });
      if (game.world) for (const e of game.world.entities) for (const d of e.interact) if (d.type === 'puzzle' && d.puzzle && typeof d.puzzle === 'object') out.push({ where: e.name || e.id, answer: PZ.answerText(d.puzzle) });
      return out;
    },
    setup(game) {
      game.state.solved = {};
      /** Open a puzzle by id (config.puzzles) or inline definition. done(solved) is called when it closes. */
      game.openPuzzle = (ref, done, ent) => {
        const base = typeof ref === 'string' ? (game.cfg.puzzles || {})[ref] : ref;
        if (!base) { console.warn('[GK] unknown puzzle', ref); if (done) done(false); return; }
        const pz = Object.assign({ id: typeof ref === 'string' ? ref : (ent ? ent.id + ':puzzle' : 'puzzle') }, base);
        if (game.state.solved[pz.id] && !pz.repeatable) { game.ui.toast(pz.doneText || 'Already solved.'); if (done) done(false); return; }
        let solved = false, attempts = 0;
        const body = U.el('div', 'gk-puzzle');
        const h = game.ui.panel({ title: pz.title || (ent && ent.name) || 'Puzzle', body, buttons: [], wide: pz.wide, onClose: () => { if (!solved) game.emit('puzzle:closed', { id: pz.id }); if (done) done(solved); } });
        const api = {
          game, close: h.close, note: h.note,
          solve: () => {
            if (solved) return;
            solved = true;
            game.state.solved[pz.id] = true;
            if (pz.points) game.scoring.add(pz.points, pz.title || 'Puzzle', 'puzzle');
            game.audio.play('success');
            h.note(pz.solvedText || (pz.store && pz.answer === undefined ? 'Saved.' : 'Correct!'), true);
            if (pz.onSolve) GK.run(game, pz.onSolve, { entity: ent });
            game.emit('puzzle:solved', { id: pz.id });
