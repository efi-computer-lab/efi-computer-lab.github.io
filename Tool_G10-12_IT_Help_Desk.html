        '<div class="gk-summary"><span>⏱ ' + U.time(r.time) + '</span>' + (r.required != null ? '<span>✓ ' + r.done + ' / ' + r.required + ' objectives</span>' : '') + (r.best ? '<span>Best: ' + r.best + '</span>' : '') + '</div>' +
        (r.leaders ? '<div class="gk-lead-title">' + (r.rank ? '🏆 ' + U.esc(r.playerName) + ', you are #' + r.rank + ' on this computer!' : 'Not in the top 10 yet: try again!') + '</div>' + this.leaderTable(r.leaders, r.rank, 5) : '') +
        (cfg.hooks && cfg.hooks.endHtml ? '<div class="gk-end-extra">' + (cfg.hooks.endHtml(this.game, r) || '') + '</div>' : '') +
        (rows ? '<table class="gk-breakdown">' + rows + '<tr class="total"><td>Final score</td><td>' + r.total + '</td></tr></table>' : '') +
        '<div class="gk-row center">' + (h.next ? '<button class="gk-btn primary big" data-a="next">Next level ▶</button>' : '') +
        '<button class="gk-btn big' + (h.next ? '' : ' primary') + '" data-a="restart">⟲ Play again</button>' +
        (!r.won && h.checkpoint ? '<button class="gk-btn big" data-a="checkpoint">↩ From checkpoint</button>' : '') + '</div>' + this.menuLink(cfg));
      s.querySelector('[data-a=restart]').onclick = h.restart;
      const nx = s.querySelector('[data-a=next]');
      if (nx) nx.onclick = h.next;
      const cp = s.querySelector('[data-a=checkpoint]');
      if (cp) cp.onclick = h.checkpoint;
    }    /** Developer banner (only on a local server or with ?debug=1): configuration problems at a glance. */
    showProblems(list) {
      if (this.problemBox) this.problemBox.remove();
      const b = this.problemBox = el('div', 'gk-problem-banner');
      b.innerHTML = '<b>⚠ ' + list.length + ' configuration problem' + (list.length > 1 ? 's' : '') + '</b> <small>(only shown while developing · Ctrl+Shift+T for details)</small><ul>' +
        list.slice(0, 6).map(p => '<li>' + U.esc(p.msg) + '</li>').join('') + (list.length > 6 ? '<li>…</li>' : '') + '</ul>';
      b.onclick = () => b.remove();
      this.root.appendChild(b);
    }
    error(msg) {
      this.screen('gk-error-screen', '<h2>Something went wrong</h2><p>' + U.esc(msg) + '</p><p class="gk-muted">Press F5 to reload the game. (Details are in the browser console.)</p>');
    }
    clearLayer() {
      this.layer.innerHTML = '';
      if (this.problemBox) { this.problemBox.remove(); this.problemBox = null; }
      this.dlg = null; this.dlgChoices = null; this.topClose = null; this.modalDepth = 0;
      this.$.toasts.innerHTML = '';
      this.cache = {};
    }
    destroy() { document.removeEventListener('keydown', this.onKey); }
  }
  GK.UI = UI;
})();

</script>
<script>/* core/scoring.js */
/* Game Kit · core/scoring.js
   Keeps a log of every score change ({points, label, kind}) so the end screen can show a breakdown.
   Config (config.scoring):
     objective: 100          default points per objective (override with objective.points)
     hint: 10                penalty per hint shown
     wrongAnswer: 5          penalty per wrong puzzle answer
     respawn: 0              penalty for falling out of the world
     timeBonus: {perSecondLeft: 2} | {par: 180, perSecond: 3, max: 500}
     completionBonus: 0      added when the game is won
     stars: [300, 600, 900]  score needed for 1/2/3 stars (optional)
     labels: {kind: 'Name'}  end-screen names for score kinds (e.g. {challenge: 'Computer challenges'})
     allowNegative: false */
(function () {
  'use strict';
  const KIND_LABELS = { objective: 'Objectives', collect: 'Collectibles', puzzle: 'Puzzles', bonus: 'Bonuses', time: 'Time bonus', hint: 'Hints used', penalty: 'Penalties', wrong: 'Wrong answers' };

  class Scoring {
    constructor(game, cfg) {
      this.game = game; this.cfg = cfg || {};
      this.log = []; this.raw = 0;
    }
    /** The score shown. The true sum of the log is kept in `raw`, so an early penalty still counts later and the
        end-screen breakdown always adds up; only the displayed value is floored at 0 (unless allowNegative). */
    get total() { return this.cfg.allowNegative ? this.raw : Math.max(0, this.raw); }
    set total(v) { this.raw = v; }
    add(points, label, kind) {
      // a mechanic may multiply good points for a while (e.g. a power-up): game.scoreMultiplier(kind) -> number
      if (points > 0 && kind !== 'time' && this.game.scoreMultiplier) points *= this.game.scoreMultiplier(kind) || 1;
      points = Math.round(points || 0);
      if (!points) return;
      this.log.push({ points, label: label || '', kind: kind || 'bonus' });
      this.raw += points;
      this.game.emit('score', { points, label, kind, total: this.total });
      this.game.ui.floatScore(points);
    }
    timeBonus() {
      const tb = this.cfg.timeBonus, g = this.game;
      if (!tb) return 0;
      if (tb.perSecondLeft && g.state.timeLimit) return Math.max(0, Math.round((g.state.timeLimit - g.state.time) * tb.perSecondLeft));
      if (tb.par) return Math.min(tb.max || Infinity, Math.max(0, Math.round((tb.par - g.state.time) * (tb.perSecond || 1))));
      return 0;
    }
    /** Called once when the game ends. Returns the summary shown on the end screen. */
    finish(won) {
      if (won) {
        this.add(this.timeBonus(), 'Time bonus', 'time');
        this.add(this.cfg.completionBonus || 0, 'Completed', 'bonus');
      }
      const stars = this.cfg.stars ? this.cfg.stars.filter(s => this.total >= s).length : null;
      const best = this.saveBest(won);
      return { total: this.total, stars, maxStars: this.cfg.stars ? this.cfg.stars.length : 0, best, breakdown: this.breakdown() };
    }
    breakdown() {
      const groups = {};
      for (const e of this.log) {
        const g = groups[e.kind] = groups[e.kind] || { kind: e.kind, label: (this.cfg.labels || {})[e.kind] || KIND_LABELS[e.kind] || e.kind, points: 0, count: 0 };
        g.points += e.points; g.count++;
      }
      return Object.values(groups);
    }
    saveBest(won) {
      const store = this.game.store, key = 'best' + (this.game.levelCount > 1 ? '.' + this.game.levelIndex : '');
      let best = Number(store.get(key, 0)) || 0;
      if (won && this.total > best) { best = this.total; store.set(key, best); }
      return best;
    }
  }
  GK.Scoring = Scoring;
  GK.Scoring.KIND_LABELS = KIND_LABELS;
})();

</script>
<script>/* core/validate.js */
/* Game Kit · core/validate.js
   Finds configuration mistakes that would otherwise fail silently: a typo in a config key, an unknown game type,
   mechanic, entity type, model, interaction or location, an objective pointing at nothing, a missing content text.
   Runs after each level is set up. Problems go to the console, to game.problems, to the teacher panel, and — while
   developing (?debug=1 or a localhost server) — to a red banner. Mechanics add checks with validate(game, report). */
(function () {
  'use strict';
  const U = GK.util;
  const KNOWN = ['id', 'title', 'subtitle', 'description', 'grade', 'subject', 'type', 'world', 'worlds', 'mechanics', 'scripts', 'models',
    'content', 'levels', 'scenes', 'startScene', 'resume', 'difficulty', 'characters', 'map', 'entities', 'zones', 'templates', 'items', 'puzzles', 'sequences',
    'locations', 'spawns', 'routes', 'spawn', 'slots', 'environment', 'render', 'view', 'player', 'objectives', 'ordered', 'timer',
    'scoring', 'hints', 'win', 'lose', 'ui', 'audio', 'controls', 'hooks', 'triggers', 'vars', 'flags', 'intro',
    'winText', 'loseText', 'teacher', 'quiz'];

  /** Returns [{level: 'error' | 'warn', msg}] for the current level. */
  GK.validate = function (game) {
    const out = [], base = game.base;
    const report = (msg, level) => { if (!out.some(p => p.msg === msg)) out.push({ level: level || 'warn', msg }); };
    const lr = window.GK_LOADER && window.GK_LOADER.result;
    if (lr) lr.warnings.forEach(w => report(w, 'error'));

    const type = GK.GameTypes.get(game.typeName);
    const known = new Set(KNOWN.concat(Object.keys(type.defaults || {})));
    for (const m of game.mechanics) U.list(m.configKeys).forEach(k => known.add(k));
    const stages = U.list(base.levels || base.scenes);
    for (const src of [base].concat(stages)) {
      for (const k in src) if (!known.has(k)) report('Unknown config key "' + k + '" — a typo? (known keys: docs/CONFIG.md)');
    }
    (game.contentProblems || []).forEach(p => report(p));

    if (game.world) {
      game.world.problems.forEach(p => report(p));
      for (const e of game.world.entities) {
        for (const d of e.interact) {
          if (d.type && !GK.Interactions.has(d.type)) report('Entity "' + e.id + '": unknown interaction type "' + d.type + '" (is its mechanic loaded?)', 'error');
        }
      }
    }
    for (const m of game.mechanics) if (m.validate) m.validate(game, report);
    if (game.view.validate) game.view.validate(report);
    return out;
  };
})();

</script>
<script>/* core/teacher.js */
/* Game Kit · core/teacher.js
   Teacher / debug mode for the classroom. Open with Ctrl+Shift+T (or add ?teacher to the address).
   Optional PIN: config.teacher.pin (keeps curious students out; it is not real security — the files are open).
   The game pauses. The panel offers: complete the current objective or the whole level, go to any level/scene,
   unlock all levels, the answers, results history on this computer, reset this game's saved data,
   per-computer settings (low graphics for slow PCs, sound, debug overlay with FPS / position / named places),
   and the configuration problems found by core/validate.js.
   GK.Settings = settings for THIS computer, shared by every game: {quality: 'normal' | 'low', muted, overlay}. */
(function () {
  'use strict';
  const U = GK.util;
  GK.Settings = new GK.Store('_settings');

  class Teacher {
    constructor(game) {
      this.game = game;
      this.isOpen = false;
      this.unlocked = false;
      this.onKey = e => { if (e.ctrlKey && e.shiftKey && e.code === 'KeyT') { e.preventDefault(); this.isOpen ? this.close() : this.open(); } };
      document.addEventListener('keydown', this.onKey);
    }
    open() {
      const g = this.game;
      if (this.isOpen) return;
      this.isOpen = true;
      this.prevMode = g.state.mode;
      if (g.state.mode === 'playing') g.pause();
      else if (g.view.onModal) g.view.onModal(true);
      const pin = g.cfg.teacher && g.cfg.teacher.pin;
      if (pin && !this.unlocked) this.askPin(String(pin)); else this.render();
    }
    close() {
      const g = this.game;
      if (!this.isOpen) return;
      this.isOpen = false;
      g.ui.hideScreens();
      const m = g.state.mode;
      if (m === 'title') g.showTitle();
      else if (m === 'ended' && g.result) g.ui.showEnd(g.cfg, g.result, g.endHandlers);
      else if (m === 'paused') g.resume();
    }
    askPin(pin) {
      const s = this.game.ui.screen('gk-teacher-screen', '<h2>Teacher</h2><p>Enter the teacher PIN</p><div class="gk-row center"><input class="gk-input" type="password" style="max-width:180px"><button class="gk-btn primary" data-a="ok">OK</button><button class="gk-btn" data-a="close">Cancel</button></div><p class="gk-feedback bad"></p>');
      const inp = s.querySelector('input'), check = () => {
        if (inp.value === pin) { this.unlocked = true; this.render(); } else { s.querySelector('.gk-feedback').textContent = 'Wrong PIN'; inp.select(); }
      };
      s.querySelector('[data-a=ok]').onclick = check;
      inp.onkeydown = e => { if (e.key === 'Enter') check(); };
      s.querySelector('[data-a=close]').onclick = () => this.close();
      setTimeout(() => inp.focus(), 30);
    }
    render() {
      const g = this.game, esc = U.esc, cfg = g.cfg;
      const sec = (title, html) => '<section><h3>' + title + '</h3>' + html + '</section>';
      const btn = (a, label, cls) => '<button class="gk-btn' + (cls ? ' ' + cls : '') + '" data-a="' + a + '">' + label + '</button>';
      let html = '<h2>🧑‍🏫 Teacher</h2><p class="gk-muted">' + esc(cfg.title) + ' · ' + (g.stages ? (g.sceneMode ? 'scene ' : 'level ') + (g.levelIndex + 1) + ' of ' + g.levelCount + ' · ' : '') +
        'time ' + U.time(g.state.time) + ' · score ' + g.scoring.total + '</p>';
      html += '<div class="gk-row center">' + btn('close', '▶ Back to the game', 'primary') + btn('restart', '⟲ Restart') + '</div>';

      // progress
      let prog = '';
      if (g.missions) {
        prog += '<table class="gk-tlist">' + g.missions.list.map(o => '<tr><td>' + (o.status === 'done' ? '✓' : o.status === 'active' ? '▶' : '·') + '</td><td>' + esc(o.title || o.id) + '</td><td>' +
          (o.status === 'active' ? '<button class="gk-btn small" data-complete="' + esc(o.id) + '">Complete</button>' : esc(o.status)) + '</td></tr>').join('') + '</table>';
      }
      prog += '<div class="gk-row">' + btn('win', '🏆 Finish this ' + (g.sceneMode ? 'game' : 'level') + ' (win)');
      if (g.stages) {
        prog += '<select class="gk-select" data-a="stage">' + g.stages.map((s, i) => '<option value="' + i + '"' + (i === g.levelIndex ? ' selected' : '') + '>' + esc(s.title || s.id || ((g.sceneMode ? 'Scene ' : 'Level ') + (i + 1))) + '</option>').join('') + '</select>' + btn('go', 'Go');
        if (!g.sceneMode) prog += btn('unlock', '🔓 Unlock all levels');
      }
      html += sec('Progress', prog + '</div>');

      const answers = g.answers();
      if (answers.length) html += sec('Answers', '<table class="gk-tlist">' + answers.map(a => '<tr><td>' + esc(a.where) + '</td><td><b>' + esc(a.answer) + '</b></td></tr>').join('') + '</table>');

      const hist = g.store.get('history', []).slice(-10).reverse();
      html += sec('Results on this computer', hist.length ? '<table class="gk-tlist">' + hist.map(h => '<tr><td>' + esc(h.at.slice(0, 16).replace('T', ' ')) + '</td><td>' + (g.levelCount > 1 ? 'L' + h.level + ' ' : '') + (h.won ? '🏆' : '✗') + '</td><td>' + h.score + ' pts</td><td>' + U.time(h.time) + '</td><td>' + h.hints + ' hints</td></tr>').join('') + '</table>' : '<p class="gk-muted">No finished games yet.</p>');

      const q = GK.Settings.get('quality', 'normal'), ov = GK.Settings.get('overlay', false);
      html += sec('This computer', '<div class="gk-row">' +
        btn('quality', q === 'low' ? '🐢 Graphics: low (faster)' : '✨ Graphics: normal') +
        btn('sound', g.audio.muted ? '🔇 Sound off' : '🔊 Sound on') +
        btn('overlay', ov ? '🛠 Debug overlay: on' : '🛠 Debug overlay: off') +
        btn('reset', '🗑 Reset saved data for this game', 'danger') + '</div>');

      const probs = g.problems || [];
      html += sec('Configuration check', probs.length ? '<ul class="gk-problems">' + probs.map(p => '<li class="' + p.level + '">' + esc(p.msg) + '</li>').join('') + '</ul>' : '<p class="gk-muted">✓ No problems found.</p>');

      const s = g.ui.screen('gk-teacher-screen', html);
      const on = (a, fn) => { const b = s.querySelector('[data-a=' + a + ']'); if (b) b.onclick = fn; };
      on('close', () => this.close());
      on('restart', () => { this.isOpen = false; g.restart(); });
      on('win', () => { this.isOpen = false; g.ui.hideScreens(); g.state.mode = 'playing'; g.win('Finished by the teacher.'); });
      on('go', () => { const i = Number(s.querySelector('[data-a=stage]').value); this.isOpen = false; g.loadLevel(i); });
      on('unlock', () => { g.store.set('unlocked', g.levelCount); g.ui.toast('All levels unlocked on this computer', 'good'); });
      on('quality', () => { GK.Settings.set('quality', q === 'low' ? 'normal' : 'low'); if (g.view.applySettings) g.view.applySettings(); this.render(); });
      on('sound', () => { g.audio.setMuted(!g.audio.muted); GK.Settings.set('muted', g.audio.muted); this.render(); });
      on('overlay', () => { GK.Settings.set('overlay', !ov); this.render(); });
      on('reset', () => {
        const b = s.querySelector('[data-a=reset]');
        if (b.dataset.sure) { g.store.clear(); g.ui.toast('Saved data cleared', 'good'); this.render(); } else { b.dataset.sure = 1; b.textContent = 'Click again to delete best scores, unlocked levels and results'; }
      });
      s.querySelectorAll('[data-complete]').forEach(b => { b.onclick = () => { g.missions.complete(b.getAttribute('data-complete')); g.missions.check(); this.render(); }; });
    }
    destroy() { document.removeEventListener('keydown', this.onKey); }
  }
  GK.Teacher = Teacher;
})();

</script>
<script>/* core/game.js */
/* Game Kit · core/game.js
   The Game owns what every game has, whatever it looks like: config, state, lifecycle
   (title → playing ⇄ paused/modal → ended), stages (levels OR scenes), timers, rules, scoring, UI, audio,
   input, save store, validation, teacher mode, snapshot/restore.
   Everything visual/spatial is delegated to the GAME TYPE's view:
     view = GK.GameTypes.get(cfg.type).create(game)  → setup() begin() update(dt, mode) render() onModal(open)
                                                        teardown() destroy() snapshot(out) restore(snap, opts) validate(report) answers()
   Gameplay comes from MECHANICS (every loaded mechanic, dependencies first):
     setup(game) start(game) update(game, dt) snapshot(game, out) restore(game, snap) validate(game, report) answers(game)
   Stages: `levels` = separate rounds (fresh state, unlocked one by one); `scenes` = places of ONE game that you travel
   between with {do:'goto', scene, spawn} — inventory, flags, score and objectives carry over and each scene
   remembers its objects. Start a game with GK.start(GAME) (core/load.js does this for you). */
(function () {
  'use strict';
  const U = GK.util;

  const DEFAULTS = {
    id: 'game', title: 'Untitled game', subtitle: '', description: '',
    type: 'first-person-3d', world: null, environment: {}, player: {},
    objectives: [], ordered: false, triggers: [], vars: {}, flags: [],
    timer: { limit: null, show: true, warnAt: 30, pauseInDialogs: false, onExpire: null },
    scoring: { objective: 100, hint: 10, wrongAnswer: 5, respawn: 0, timeBonus: null, completionBonus: 0, stars: null, allowNegative: false },
    hints: { max: null, general: [] },
    win: null,      // null = when all required objectives are done (objectives mechanic); or a condition
    lose: [],       // [{if: condition, text: 'reason', checkpoint: true}]
    ui: { accent: '#4cc9f0', markers: true, showControls: true, labelRange: 10, crosshair: false, lockHint: false, menuUrl: null, menuLabel: 'Menu', askName: false, leaderboard: false },
    audio: { muted: false, volume: 0.7, sounds: {} },
    teacher: { pin: null },
    resume: false,  // scene games: save on THIS computer as each scene (act) starts; the title screen offers "Continue"
    difficulty: null,  // {default: 'hard', choices: [{id, label, text, …options}], combat?: {default, title, choices}}: the title screen asks; mechanics read game.difficultyOpts()
    characters: null,  // {default, title, choices: [{id, label, text, look}]}: who you play; views read game.characterLook()
    controls: {},
    hooks: {},      // setup(game) start(game) update(game, dt) win(game) lose(game)
  };
  const DEV = () => /[?&]debug=1/.test(location.search) || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

  class Game {
    constructor(config, options) {
      this.options = options || {};
      this.base = config;
      this.stages = config.levels || config.scenes || null;
      this.sceneMode = !!config.scenes;
      this.levelCount = this.stages ? this.stages.length : 1;
      this.sceneMemory = {};
      this.store = new GK.Store(config.id || 'game');
      this.events = new GK.Events();
      this.root = document.getElementById('gk-root') || document.body.appendChild(U.el('div'));
      this.root.classList.add('gk-root');
      this.input = new GK.Input(this.root, config.controls);
      this.audio = new GK.Audio(config.audio);
      if (GK.Settings.get('muted', false)) this.audio.setMuted(true);
      this.ui = new GK.UI(this, this.root);
      // Every mechanic that was loaded takes part, in load order (the loader puts dependencies first).
      this.mechanics = Object.keys(GK.Mechanics.items).map(name => Object.assign({ name }, GK.Mechanics.items[name]));
      this.onBlur = () => { if (this.state && this.state.mode === 'playing') this.pause(); };
      window.addEventListener('blur', this.onBlur);
      this.teacher = new GK.Teacher(this);

      this.difficulty = this.validDifficulty(this.options.difficulty || (location.search.match(/[?&]difficulty=(\w+)/) || [])[1]);
      this.combat = this.validCombat(this.options.combat || (location.search.match(/[?&]combat=(\w+)/) || [])[1]);
      this.character = this.validCharacter(this.options.character || (location.search.match(/[?&]character=(\w+)/) || [])[1]);
      const first = this.options.level != null ? this.options.level : this.sceneMode ? Math.max(0, this.stageIndex(config.startScene || 0)) : 0;
      this.configure(first);
      this.setup();
      if (this.options.autostart) this.begin();
      else this.showTitle();
      if (!this.options.manual) {
        this.last = performance.now();
        const loop = t => {
          this.raf = requestAnimationFrame(loop);
          const dt = Math.min(0.05, (t - this.last) / 1000);
          this.last = t;
          this.fps = this.fps ? this.fps * 0.95 + (dt > 0 ? 1 / dt : 60) * 0.05 : 60;
          try { this.frame(dt); } catch (e) { this.crash(e); }
        };
        this.raf = requestAnimationFrame(loop);
      }
      if (/[?&]debug=1/.test(location.search)) window.game = this;
      if (/[?&]teacher/.test(location.search)) this.teacher.open();
    }

    // ================= configuration & stages =================
    stageIndex(ref) {
      if (typeof ref === 'number') return ref;
      return this.stages ? this.stages.findIndex(s => s.id === ref) : -1;
    }
    /** Effective config for stage i = kit defaults ← game-type defaults ← game config ← stage overrides, with
        "content:…" references resolved and the world definition attached (cfg.worldDef). */
    configure(i) {
      const base = this.base, stage = this.stages ? (this.stages[i] || {}) : {};
      const typeName = stage.type || base.type || DEFAULTS.type;
      const type = GK.GameTypes.get(typeName);
      const content = base.content || window.GAME_CONTENT || {};
      this.contentProblems = [];
      // a stage's `title` names the stage ("Round 1"); it must not replace the game's title
      const stageCfg = Object.assign({}, stage);
      delete stageCfg.title;
      const cfg = GK.resolveContent(U.merge(DEFAULTS, type.defaults, base, stageCfg), content, null, this.contentProblems);
      cfg.stageTitle = stage.title ? GK.resolveContent(stage.title, content) : null;
      cfg.levels = cfg.scenes = undefined;
      cfg.content = content;
      if (type.spatial) {
        // world: a library name ('computer-lab'), an inline world object, or nothing (the game's own `map`)
        const w = cfg.world || {};
        if (typeof w === 'string' && !GK.Worlds.has(w)) throw new Error('World "' + w + '" is not loaded — check the name (worlds/' + w + '/world.js).');
        cfg.worldDef = typeof w === 'string' ? GK.Worlds.get(w) : w;
        // lighting: game-type defaults ← the world's own lighting ← the game's `environment` ← the stage's
        cfg.environment = U.merge(type.defaults && type.defaults.environment, cfg.worldDef.lighting, base.environment, stage.environment);
      }
      this.cfg = cfg;
      this.levelIndex = i;
      this.stageId = stage.id || null;
      if (this.typeName !== typeName) {
        if (this.view) this.view.destroy();
        this.view = type.create(this);
        this.typeName = typeName;
      }
      this.ui.applyConfig(cfg);
    }
    /** (Re)build everything for the current stage. Called at load, on restart, level change and scene travel. */
    setup() {
      const cfg = this.cfg;
      if (this.view.teardown) this.view.teardown();
      this.events.clear();
      this.timers = [];
      this.focus = null; this.modal = 0; this.pendingTravel = null;
      this.state = { mode: 'title', time: 0, timeLimit: cfg.timer.limit || null, flags: {}, vars: U.merge(cfg.vars), events: {} };
      for (const f of U.list(cfg.flags)) this.state.flags[f] = true;
      if (this.playerName) this.state.vars.playerName = this.playerName;   // typed on the title screen; kept on restart
      if (this.difficulty) this.state.vars.difficulty = this.difficulty;   // chosen on the title screen; kept on restart
      if (this.combat) this.state.vars.combat = this.combat;
      if (this.character) this.state.vars.character = this.character;
      this.builtFor = this.buildKey();   // the scene was built for this difficulty (a new choice rebuilds it)
      this.scoring = new GK.Scoring(this, cfg.scoring);
      this.ui.clearLayer();
      this.view.setup();
      for (const m of this.mechanics) if (m.setup) m.setup(this);
      this.setupTriggers();
      // resume: {checkpoints: true} also saves at every checkpoint, so one long scene loses at most a few minutes
      if (U.isObj(cfg.resume) && cfg.resume.checkpoints) this.on('checkpoint', () => { if (this.checkpoint && (this.state.mode === 'playing' || this.state.mode === 'modal')) this.saveResume({ pos: this.checkpoint.pos.slice(), rot: this.checkpoint.rot }); });
      if (cfg.hooks.setup) cfg.hooks.setup(this);
      this.ui.update(this);
      this.ui.prompt(null);
      this.problems = GK.validate(this);
      if (this.problems.length) {
        console.warn('[GK] ' + this.problems.length + ' configuration problem(s) in "' + cfg.id + '":\n  ' + this.problems.map(p => p.msg).join('\n  '));
        if (DEV()) this.ui.showProblems(this.problems);
      }
    }
    begin() {
      if (this.ui.toggleGuide) this.ui.toggleGuide(false);
      this.state.mode = 'playing';
      this.input.clear();
      if (this.view.begin) this.view.begin();
      this.emit('game:start', { level: this.levelIndex });
      if (this.cfg.intro) GK.run(this, this.cfg.intro);
      if (this.cfg.hooks.start) this.cfg.hooks.start(this);
      for (const m of this.mechanics) if (m.start) m.start(this);
    }
    loadLevel(i) {
      this.ui.hideScreens();
      this.sceneMemory = {};
      this.configure(i);
      this.setup();
      this.begin();
    }
    /** The name typed on the title screen (ui.askName): kept for restarts while the page is open (not saved: lab PCs are shared). */
    setPlayerName(name) {
      this.playerName = String(name || '').trim().slice(0, 24) || 'Player';
      this.state.vars.playerName = this.playerName;
    }
    // ================= difficulty (config.difficulty) =================
    /** The choices ({id, label, text, …options}) or null when the game has no difficulty setting. */
    difficultyChoices() { const d = this.base.difficulty; return d && Array.isArray(d.choices) && d.choices.length ? d.choices : null; }
    /** A known choice id, else the game's default (else the last choice), else null. */
    validDifficulty(id) {
      const list = this.difficultyChoices();
      if (!list) return null;
      if (list.some(c => c.id === id)) return id;
      const d = this.base.difficulty.default;
      return list.some(c => c.id === d) ? d : list[list.length - 1].id;
    }
    setDifficulty(id) { this.difficulty = this.validDifficulty(id); if (this.state) this.state.vars.difficulty = this.difficulty; }
    /** A second, separate choice: difficulty.combat {default, title, choices: [{id, label, short, text, …options}]} — e.g.
        Grade 6 / Grade 7 questions (difficulty) AND Easy / Hard fights (combat). Its options join difficultyOpts(). */
    combatChoices() { const d = this.base.difficulty && this.base.difficulty.combat; return d && Array.isArray(d.choices) && d.choices.length ? d.choices : null; }
    validCombat(id) {
      const list = this.combatChoices();
      if (!list) return null;
      if (list.some(c => c.id === id)) return id;
      const d = this.base.difficulty.combat.default;
      return list.some(c => c.id === d) ? d : list[list.length - 1].id;
    }
    /** What a scene is built for: the difficulty (and the combat choice, when the game has one). */
    buildKey() { return this.combat ? this.difficulty + '|' + this.combat : this.difficulty; }
    setCombat(id) { this.combat = this.validCombat(id); if (this.state) this.state.vars.combat = this.combat; }
    /** Options of the chosen difficulty (e.g. {enemies: 0.5}) and of the chosen combat choice; {} without the setting.
        `without: ['tag', …]` (either choice) leaves out the entities with one of those tags when a scene is built. */
    difficultyOpts() {
      const list = this.difficultyChoices(), d = (list && list.find(c => c.id === this.difficulty)) || {};
      const cl = this.combatChoices(), c = cl && cl.find(x => x.id === this.combat);
      if (!c) return d;
      const o = Object.assign({}, d);
      for (const k in c) if (['id', 'label', 'short', 'text'].indexOf(k) < 0) o[k] = k === 'without' ? U.list(d.without).concat(c.without) : c[k];
      return o;
    }
    // ================= characters (config.characters) =================
    characterChoices() { const d = this.base.characters; return d && Array.isArray(d.choices) && d.choices.length ? d.choices : null; }
    validCharacter(id) {
      const list = this.characterChoices();
      if (!list) return null;
      if (list.some(c => c.id === id)) return id;
      const d = this.base.characters.default;
      return list.some(c => c.id === d) ? d : list[0].id;
    }
    setCharacter(id) { this.character = this.validCharacter(id); if (this.state) this.state.vars.character = this.character; this.emit('character', { id: this.character }); }
    /** The chosen character's look (skin, hair, shirt…), or null for a game without characters. */
    characterLook() { const list = this.characterChoices(); const c = list && list.find(x => x.id === this.character); return c ? Object.assign({}, c.look) : null; }
    /** Best results on this computer (ui.leaderboard): [{name, score, time, stars, at}], best first. */
    leaders() { return this.store.get('leaders', []); }
    /** Restart: a level restarts itself; a scene-based game restarts from its first scene. A restart is a new game,
        so the saved resume point is dropped. */
    restart() {
      this.store.remove('resume');
      this.loadLevel(this.sceneMode ? Math.max(0, this.stageIndex(this.base.startScene || 0)) : this.levelIndex);
    }
    unlockedLevels() { return Math.min(this.levelCount, Math.max(1, Number(this.store.get('unlocked', 1)) || 1)); }
    showTitle() {
      const levels = this.levelCount > 1 && !this.sceneMode && this.cfg.ui.levelSelect !== false;   // ui.levelSelect: false = one Play button
      const saved = this.savedResume();
      this.ui.showTitle(this.cfg, i => {
        this.audio.unlock();
        this.store.remove('resume');   // a new game replaces the old resume point
        if (i !== this.levelIndex || this.builtFor !== this.buildKey()) this.loadLevel(i); else { this.ui.hideScreens(); this.begin(); }
      }, levels ? { count: this.levelCount, unlocked: this.unlockedLevels(), names: this.stages.map((l, k) => l.title || ('Level ' + (k + 1))) } : null,
      saved ? { info: saved, onResume: () => { this.audio.unlock(); this.resumeSaved(saved); } } : null);
    }

    // ================= resume after a crash (config.resume) =================
    /** Saved on this computer when a scene starts, so a closed browser or a sudden shutdown loses at most the
        current scene. Only the entry of a scene is saved: nothing is running yet (no timers, waves or dialogs). */
    saveResume(spawn) {
      if (!this.cfg.resume || !this.sceneMode) return;
      const mid = spawn && typeof spawn === 'object';   // {pos, rot}: a save in the middle of a scene (resume.checkpoints)
      const stage = this.stages[this.levelIndex] || {};
      this.store.set('resume', {
        v: 1, id: this.base.id || 'game', at: new Date().toISOString(), scene: this.stageId, spawn: spawn || null, mid: mid || undefined,
        part: this.levelIndex + 1, parts: this.levelCount, title: this.cfg.stageTitle || stage.id || '',
        name: this.playerName || '', difficulty: this.difficulty, combat: this.combat, character: this.character, score: this.scoring.total, time: Math.round(this.state.time), snap: this.snapshot(),
      });
    }
    /** The resume point on this computer, or null (none, another game's, or damaged). */
    savedResume() {
      if (!this.base.resume || !this.sceneMode) return null;
      const r = this.store.get('resume', null);
      const ok = r && r.v === 1 && r.id === (this.base.id || 'game') && r.snap && (this.stageIndex(r.scene) > 0 || (r.mid && this.stageIndex(r.scene) >= 0));
      if (r && !ok) this.store.remove('resume');
      return ok ? r : null;
    }
    /** Continue from a resume point: rebuild its scene, put the saved state back, then start it like a scene entry. */
    resumeSaved(r) {
      try {
        this.ui.hideScreens();
        if (r.name) this.setPlayerName(r.name);
        this.difficulty = this.validDifficulty(r.difficulty || (r.snap.state && r.snap.state.vars && r.snap.state.vars.difficulty));
        this.combat = this.validCombat(r.combat || (r.snap.state && r.snap.state.vars && r.snap.state.vars.combat));
        this.character = this.validCharacter(r.character || (r.snap.state && r.snap.state.vars && r.snap.state.vars.character));
        this.sceneMemory = {};
        this.restore(r.snap);   // mode is 'title' here, so nothing starts yet
        this.state.inZone = {};
        if (r.name) this.state.vars.playerName = this.playerName;
        if (this.world) {
          const at = (r.spawn && typeof r.spawn === 'object' ? r.spawn : r.spawn && this.world.spawns[r.spawn]) || this.world.spawn;
          this.player.place(at.pos, at.rot);
          this.checkpoint = { pos: at.pos.slice(), rot: at.rot };
        }
        this.state.mode = 'playing';
        this.input.clear();
        if (this.view.begin) this.view.begin();
        for (const m of this.mechanics) if (m.start) m.start(this);
        this.ui.update(this);
        this.emit('scene:enter', { id: this.stageId, from: null, resumed: true });
      } catch (e) {
        // a damaged save must never trap a student: forget it and start a fresh game
        console.warn('[GK] resume failed, starting a new game:', e);
        this.store.remove('resume');
        this.loadLevel(Math.max(0, this.stageIndex(this.base.startScene || 0)));
      }
    }
    /** Move to another scene (or level) and KEEP progress: flags, vars, inventory, score, time, objectives.
        Each scene remembers its objects (collected items stay collected). Happens at the end of the current step. */
    travel(ref, spawn) {
      const i = this.stageIndex(ref);
      if (i < 0 || i >= this.levelCount) { this.ui.toast('Nowhere called "' + ref + '"', 'bad'); console.warn('[GK] goto: no scene "' + ref + '"'); return; }
      this.pendingTravel = { i, spawn };
    }
    doTravel(t) {
      const carry = this.snapshot();
      if (carry.entities) this.sceneMemory[this.levelIndex] = carry.entities;
      const from = this.stageId;
      this.ui.hideScreens();
      this.configure(t.i);
      this.setup();
      carry.state.inZone = {};
      this.restore(carry, { keepStage: true, entities: false, player: false });
      if (this.view.restore && this.sceneMemory[t.i]) this.view.restore({ entities: this.sceneMemory[t.i] }, { player: false });
      if (this.world) {
        const sp = t.spawn ? this.world.spawns[t.spawn] : this.world.spawn;
        if (t.spawn && !sp) console.warn('[GK] goto: scene has no spawn "' + t.spawn + '"');
        const at = sp || this.world.spawn;
        this.player.place(at.pos, at.rot);
        this.checkpoint = { pos: at.pos.slice(), rot: at.rot };
      }
      this.state.mode = 'playing';
      if (this.view.begin) this.view.begin();
      for (const m of this.mechanics) if (m.start) m.start(this);
      this.saveResume(t.spawn);   // before scene:enter, so a resume replays the same entry (story card included)
      this.emit('scene:enter', { id: this.stageId, from });
    }

    // ================= modes =================
    pause() {
      if (this.state.mode !== 'playing') return;
      this.state.mode = 'paused';
      this.input.clear();
      if (this.view.onModal) this.view.onModal(true);
      this.ui.prompt(null);
      this.ui.showPause(this.cfg, {
        resume: () => this.resume(),
        restart: () => this.restart(),
        checkpoint: this.respawn ? () => { this.respawn(); this.resume(); } : null,
        sound: () => { this.audio.setMuted(!this.audio.muted); GK.Settings.set('muted', this.audio.muted); },
      });
      this.emit('game:pause');
    }
    resume() {
      if (this.state.mode !== 'paused') return;
      this.ui.hideScreens();
      this.state.mode = this.modal > 0 ? 'modal' : 'playing';
      this.input.clear();
      if (this.state.mode === 'playing' && this.view.onModal) this.view.onModal(false);
      this.emit('game:resume');
    }
    /** Panels and dialogue call these: play stops (except the timer) and the mouse is released. */
    enterModal() {
      this.modal++;
      if (this.state.mode === 'playing') this.state.mode = 'modal';
      this.input.clear();
      if (this.view.onModal) this.view.onModal(true);
      this.ui.prompt(null);
    }
    exitModal() {
      this.modal = Math.max(0, this.modal - 1);
      if (this.modal === 0 && this.state.mode === 'modal') {
        this.state.mode = 'playing';
        this.input.clear();
        if (this.view.onModal) this.view.onModal(false);
      }
    }
    end(won, reason, allowCheckpoint) {
      if (this.state.mode === 'ended') return;
      this.state.mode = 'ended';
      this.ui.clearLayer();
      this.input.clear();
      if (this.view.onModal) this.view.onModal(true);
      this.ui.prompt(null);
      const res = this.scoring.finish(won);
      const obj = this.missions;
      Object.assign(res, { won, reason, time: this.state.time, done: obj ? obj.doneCount() : null, required: obj ? obj.required().length : null });
      const next = won && !this.sceneMode && this.levelIndex + 1 < this.levelCount;
      if (won && next) this.store.set('unlocked', Math.max(this.unlockedLevels(), this.levelIndex + 2));
      if (won) this.store.remove('resume');   // finished: nothing left to continue
      // results history on this computer (teacher panel)
      const hist = this.store.get('history', []);
      hist.push({ at: new Date().toISOString(), level: this.levelIndex + 1, won, score: res.total, time: Math.round(this.state.time), hints: this.state.hintsUsed || 0 });
      this.store.set('history', hist.slice(-50));
      if (won && this.cfg.ui.leaderboard) {
        const entry = { name: this.playerName || this.state.vars.playerName || 'Player', score: res.total, time: Math.round(this.state.time), stars: res.stars || 0, at: new Date().toISOString() };
        if (this.difficulty) entry.difficulty = this.difficulty;
        if (this.combat) entry.combat = this.combat;
        const list = this.leaders().concat([entry]).sort((a, b) => b.score - a.score || a.time - b.time).slice(0, 10);
        this.store.set('leaders', list);
        res.leaders = list;
        res.rank = list.indexOf(entry) + 1;   // 0 = not in the top 10
        res.playerName = entry.name;
      }
      this.result = res;
      this.audio.play(won ? 'win' : 'lose');
      this.emit(won ? 'game:win' : 'game:lose', res);
      if (won && this.cfg.hooks.win) this.cfg.hooks.win(this);
      if (!won && this.cfg.hooks.lose) this.cfg.hooks.lose(this);
      this.endHandlers = {
        restart: () => this.restart(),
        next: next ? () => this.loadLevel(this.levelIndex + 1) : null,
        checkpoint: allowCheckpoint && this.respawn ? () => {
          this.ui.hideScreens();
          this.respawn(true);
          this.state.mode = 'playing';
          if (this.view.onModal) this.view.onModal(false);
        } : null,
      };
      this.ui.showEnd(this.cfg, res, this.endHandlers);
    }
    win(text) { this.end(true, text); }
    lose(text, allowCheckpoint) { this.end(false, text, allowCheckpoint); }
    /** A bug in a game must not freeze the classroom: stop the loop and say so. */
    crash(e) {
      cancelAnimationFrame(this.raf);
      this.raf = null;
      console.error('[GK] game stopped:', e);
      this.ui.error((e && e.message) || String(e));
    }

    // ================= loop =================
    frame(dt) { this.step(dt); this.render(); }
    /** Advance by dt seconds (tests call this directly with options.manual). */
    step(dt) {
      const s = this.state, cfg = this.cfg;
      if (s.mode === 'playing' || s.mode === 'modal') {
        if (s.mode === 'playing' || !cfg.timer.pauseInDialogs) s.time += dt;
        for (const t of this.timers.slice()) { t.at -= dt; if (t.at <= 0) { this.timers.splice(this.timers.indexOf(t), 1); t.fn(); } }
        if (s.timeLimit) {
          const left = s.timeLimit - s.time;
          if (left <= 10 && left > 0 && Math.ceil(left) !== this.lastTick) { this.lastTick = Math.ceil(left); this.audio.play('tick'); }
          if (left <= 0 && s.mode !== 'ended') {
            if (cfg.timer.onExpire) { s.timeLimit = null; GK.run(this, cfg.timer.onExpire); } else this.lose(cfg.timer.text || 'Time is up!');
          }
        }
      }
      this.view.update(dt, s.mode);
      if (s.mode === 'playing') {
        for (const m of this.mechanics) if (m.update) m.update(this, dt);
        if (this.input.pressed('hint') && this.hint) this.hint();
        if (this.input.pressed('pause')) this.pause();
        this.checkRules();
        if (cfg.hooks.update && this.state.mode === 'playing') cfg.hooks.update(this, dt);
      } else if (s.mode === 'paused' && this.input.hits.has('KeyP') && !this.teacher.isOpen) this.resume();
      this.input.endFrame();
      this.ui.update(this);
      if (this.pendingTravel) { const t = this.pendingTravel; this.pendingTravel = null; this.doTravel(t); }
    }
    render() { this.view.render(); }
    checkRules() {
      const cfg = this.cfg;
      if (this.state.mode !== 'playing' && this.state.mode !== 'modal') return;
      if (cfg.win != null && GK.test(this, cfg.win)) { this.win(); return; }
      for (const rule of U.list(cfg.lose)) if (rule.if !== undefined && GK.test(this, rule.if)) { this.lose(rule.text, rule.checkpoint); return; }
    }

    // ================= events, timers, state =================
    on(name, fn) { return this.events.on(name, fn); }
    /** Every event is counted in state.events (and as "name#id" when data.id is set). */
    emit(name, data) {
      data = data || {};
      const ev = this.state.events;
      ev[name] = (ev[name] || 0) + 1;
      if (data.id != null) ev[name + '#' + data.id] = (ev[name + '#' + data.id] || 0) + 1;
      this.events.emit(name, data);
    }
    /** Run fn after `seconds` of game time (paused time doesn't count). */
    later(seconds, fn) { this.timers.push({ at: seconds, fn }); }
    run(actions, ctx) { GK.run(this, actions, ctx); }
    test(cond) { return GK.test(this, cond); }
    setFlag(name, on) {
      this.state.flags[name] = !!on;
      this.emit('flag', { id: name, on: !!on });
      if (this.missions) this.missions.check();
    }
    /** config.triggers: [{on:'event', match:{id:'x'}, if, once, actions}] — react to any event with actions. */
    setupTriggers() {
      for (const t of U.list(this.cfg.triggers)) {
        let fired = false;
        this.on(t.on, data => {
          if (t.once && fired) return;
          if (t.match && !Object.keys(t.match).every(k => data[k] === t.match[k])) return;
          if (t.if !== undefined && !GK.test(this, t.if)) return;
          fired = true;
          GK.run(this, t.actions, data);
        });
      }
    }
    /** Every puzzle/question answer (teacher panel): from mechanics and the game type. */
    answers() {
      let out = [];
      for (const m of this.mechanics) if (m.answers) out = out.concat(m.answers(this));
      if (this.view.answers) out = out.concat(this.view.answers());
      return out;
    }

    // ================= snapshot / restore =================
    /** Plain-JSON picture of everything that changes during play (save/resume, scene travel, a future LAN host).
        Mechanics and the game type add their parts through snapshot(…, out). */
    snapshot() {
      const s = this.state;
      const out = { id: this.cfg.id, level: this.levelIndex, type: this.typeName, mode: s.mode, time: s.time, timeLimit: s.timeLimit, state: s, score: { total: this.scoring.total, log: this.scoring.log }, scenes: this.sceneMemory };
      if (this.view.snapshot) this.view.snapshot(out);
      for (const m of this.mechanics) if (m.snapshot) m.snapshot(this, out);
      return JSON.parse(JSON.stringify(out));
    }
    /** Apply a snapshot. opts: {keepStage, entities: false, player: false}. The current mode (playing, title…) is kept. */
    restore(snap, opts) {
      opts = opts || {};
      snap = JSON.parse(JSON.stringify(snap));
      const mode = this.state.mode;   // read BEFORE a rebuild (setup() resets the mode to 'title')
      const rebuild = !opts.keepStage && snap.level !== this.levelIndex;
      if (rebuild) { this.sceneMemory = {}; this.configure(snap.level); this.setup(); }
      Object.assign(this.state, snap.state);   // same object: mechanics that hold game.state keep working
      this.state.mode = mode;
      this.state.time = snap.time;
      this.state.timeLimit = snap.timeLimit;
      this.scoring.total = snap.score.total;
      this.scoring.log = snap.score.log;
      if (snap.scenes && !opts.keepStage) this.sceneMemory = snap.scenes;
      if (this.view.restore) this.view.restore(snap, opts);
      for (const m of this.mechanics) if (m.restore) m.restore(this, snap);
      if (rebuild && mode === 'playing') {
        if (this.view.begin) this.view.begin();
        for (const m of this.mechanics) if (m.start) m.start(this);
      }
      this.ui.update(this);
      this.emit('game:restored');
    }

    destroy() {
      cancelAnimationFrame(this.raf);
      window.removeEventListener('blur', this.onBlur);
      this.input.destroy(); this.ui.destroy(); this.view.destroy(); this.teacher.destroy();
    }
  }
  Game.DEFAULTS = DEFAULTS;
  GK.Game = Game;

  // scene / level travel as an action: {do:'goto', scene:'lab', spawn:'door'}
  GK.Actions.add('goto', (g, a) => g.travel(a.scene != null ? a.scene : a.level, a.spawn));
  GK.Conditions.add('scene', (g, v) => U.list(v).indexOf(g.stageId) >= 0);

  /** Start a game. options (or window.GK_START): {autostart, manual, level}. Tests use autostart + manual. */
  GK.start = function (config, options) {
    options = Object.assign({}, window.GK_START, options);
    const go = () => {
      try {
        GK.current = new Game(config, options);
      } catch (e) {
        console.error(e);
        const box = document.getElementById('gk-root') || document.body;
        box.innerHTML = '<div class="gk-fatal"><h2>This game could not start</h2><p>' + U.esc(e.message) + '</p></div>';
      }
    };
    if (document.getElementById('gk-root')) go(); else GK.ready(go);
  };
})();

<script>/* game-types/../assets/models/lowpoly.js */
/* Game Kit · assets/models/lowpoly.js
   Low-poly model library shared by every game type and world. Each model is fn(look) → GK.Geo, built around
   the origin: centred on x/z, standing on y = 0, FRONT facing +z. look holds the entity's color, size
   and anything in its look: {...}. Add your own with GK.Models.add('name', look => geo).
   GK.Models.shape(model, look) → {key, geo, bounds, top} (cached) is what entities and views use.

  'use strict';
  const U = GK.util, M = GK.Models;

  const dk = (c, f) => U.shade(c, f == null ? 0.7 : f);
  const sz = (o, d) => (o.size == null ? d : o.size);

  // ----- basic shapes -----
  M.add('box', o => { const s = sz(o, [1, 1, 1]); return G().box(0, 0, 0, s[0], s[1], s[2], o.color || '#9aa4b1', { top: o.top }); });
  M.add('cylinder', o => { const s = sz(o, [0.5, 1]); return G().cyl(0, 0, 0, s[0], s[1], o.color || '#9aa4b1', { seg: o.seg || 10 }); });
  M.add('ball', o => { const r = sz(o, 0.4); return G().sphere(0, r, 0, r, o.color || '#e74c3c', { glow: o.glow }); });
  M.add('pillar', o => { const h = sz(o, 3); return G().box(0, 0, 0, 0.5, h, 0.5, o.color || '#c9c2b5').box(0, 0, 0, 0.64, 0.2, 0.64, dk(o.color || '#c9c2b5')).box(0, h - 0.2, 0, 0.64, 0.2, 0.64, dk(o.color || '#c9c2b5')); });

  // ----- furniture -----
  M.add('crate', o => {
    const s = sz(o, 1), c = o.color || '#b98a4e';
    return G().box(0, 0, 0, s, s, s, c).box(0, 0, 0, s * 1.03, s * 0.12, s * 1.03, dk(c)).box(0, s * 0.88, 0, s * 1.03, s * 0.12, s * 1.03, dk(c));
  });
  M.add('barrel', o => {
    const c = o.color || '#3d7ea6';
    return G().cyl(0, 0, 0, 0.4, 1.1, c, { seg: 10 }).cyl(0, 0.15, 0, 0.42, 0.08, dk(c), { seg: 10 }).cyl(0, 0.85, 0, 0.42, 0.08, dk(c), { seg: 10 });
  });

    const g = G().box(0, h - 0.06, 0, w, 0.06, d, c);
    for (const sx of [-1, 1]) for (const sz2 of [-1, 1]) g.box(sx * (w / 2 - 0.07), 0, sz2 * (d / 2 - 0.07), 0.07, h - 0.06, 0.07, dk(c));

  M.add('desk', o => { const s = sz(o, [1.4, 0.7]); return table(s[0], s[1], 0.76, o.color || '#d9d4c7'); });
  M.add('chair', o => {
    const c = o.color || '#34495e', g = G().box(0, 0.42, 0, 0.46, 0.06, 0.46, c).box(0, 0.48, -0.2, 0.46, 0.5, 0.06, c);

  M.add('shelf', o => {
    const c = o.color || '#8b5e3c', g = G(), w = 1.6, h = 2, d = 0.4, rnd = U.rng(7);

    const books = ['#c0392b', '#2980b9', '#27ae60', '#f39c12', '#8e44ad', '#16a085', '#d35400'];
    for (let i = 0; i < 4; i++) {
      const y = i * 0.5;
      g.box(0, y, 0, w, 0.05, d, c);

  });
  M.add('poster', o => {
    const s = sz(o, [1, 1.3]);

  M.add('sign', o => {
    const c = o.color || '#2c3e50';
    return G().box(0, 0, 0, 0.1, 1.2, 0.1, '#7f8c8d').box(0, 1.1, 0, 1.2, 0.6, 0.08, c, { glow: 0.1 });

    const c = o.color || '#2c3e50', g = G().box(0, 0, 0, 0.8, 2, 0.8, c);

    const s = sz(o, [2, 1.2]);
    return G().box(0, 0, 0, s[0] + 0.1, s[1] + 0.1, 0.08, '#222').box(0, 0.05, 0.03, s[0], s[1], 0.06, o.color || '#1f6feb', { glow: 0.8 });
  });

  // ----- interactive props -----
  M.add('button', o => {
    const c = o.color || '#e74c3c', on = o.on;
    return G().box(0, 0, 0, 0.5, 0.9, 0.5, '#5d6d7e').box(0, 0.9, 0, 0.56, 0.06, 0.56, '#4a5663')
      .cyl(0, 0.96, 0, 0.16, on ? 0.04 : 0.1, c, { seg: 12, glow: on ? 0.9 : 0.35 });
  });
  M.add('lever', o => {
    const c = o.color || '#e67e22', g = G().box(0, 0, 0, 0.5, 0.8, 0.35, '#5d6d7e');
    const stick = G().box(0, 0, 0, 0.07, 0.55, 0.07, '#bdc3c7').sphere(0, 0.58, 0, 0.09, c, { glow: 0.3 });
    stick.rotX(o.on ? -0.6 : 0.6).move(0, 0.8, 0);
    return g.add(stick).box(0, 0.4, 0.176, 0.18, 0.1, 0.01, o.on ? '#2ecc71' : '#c0392b', { glow: 0.9 });
  });
  M.add('door', o => {
    const w = o.width || 1.4, h = o.height || 2.2, c = o.color || '#6c7a89';
    return G().box(0, 0, 0, w, h, 0.12, c).box(w * 0.32, h * 0.45, 0.07, 0.08, 0.2, 0.06, '#d5dbdb')
      .box(0, h * 0.72, 0.063, w * 0.6, h * 0.14, 0.01, o.locked ? '#e74c3c' : '#2ecc71', { glow: 0.8 });
  });
  M.add('pad', o => { // checkpoints, pressure plates
    const c = o.color || '#27ae60';
    return G().cyl(0, 0, 0, 0.85, 0.06, '#566573', { seg: 12 }).cyl(0, 0.06, 0, 0.62, 0.03, c, { seg: 12, glow: o.on ? 1 : 0.4 });
  });
  M.add('portal', o => {
    const c = o.color || '#9b59b6';
    return G().box(-0.9, 0, 0, 0.3, 2.6, 0.3, '#566573').box(0.9, 0, 0, 0.3, 2.6, 0.3, '#566573').box(0, 2.5, 0, 2.1, 0.3, 0.3, '#566573')
      .box(0, 0, 0, 1.5, 2.5, 0.06, c, { glow: 0.9 });
  });
  M.add('chest', o => {
    const c = o.color || '#9c6b30';
    const g = G().box(0, 0, 0, 1, 0.55, 0.6, c).box(0, 0.1, 0, 1.03, 0.08, 0.63, '#d4ac0d');
    if (o.on) g.box(0, 0.55, -0.35, 1, 0.5, 0.08, dk(c, 0.85)); else g.box(0, 0.55, 0, 1, 0.22, 0.6, dk(c, 0.85));
    return g.box(0, 0.45, 0.305, 0.14, 0.18, 0.02, '#d4ac0d');
  });
  M.add('note', o => G().box(0, 0, 0, 0.32, 0.012, 0.42, o.color || '#fdf6e3').box(0, 0.012, -0.08, 0.24, 0.002, 0.02, '#888').box(0, 0.012, 0, 0.24, 0.002, 0.02, '#888').box(0, 0.012, 0.08, 0.16, 0.002, 0.02, '#888'));
  M.add('book', o => G().box(0, 0, 0, 0.3, 0.06, 0.4, o.color || '#2980b9').box(0.01, 0.005, 0, 0.29, 0.05, 0.38, '#fdfdfd'));

  // ----- collectibles (float and spin; front faces +z) -----
  M.add('coin', o => G().cyl(0, -0.03, 0, 0.25, 0.06, o.color || '#f1c40f', { seg: 14, glow: 0.25 }).rotX(Math.PI / 2));
  M.add('gem', o => {
    const c = o.color || '#1abc9c';
    return G().cone(0, 0, 0, 0.22, 0.3, c, { seg: 6, glow: 0.3 }).add(G().cone(0, 0, 0, 0.22, 0.3, dk(c, 0.8), { seg: 6, glow: 0.3 }).scale(1, -1, 1));
  });
  M.add('keycard', o => {
    const c = o.color || '#3498db';
    return G().box(0, -0.16, 0, 0.5, 0.32, 0.03, c, { glow: 0.2 }).box(-0.1, -0.02, 0.016, 0.24, 0.05, 0.005, '#fff', { glow: 0.5 }).box(0.14, -0.12, 0.016, 0.1, 0.08, 0.005, '#f1c40f');
  });
  M.add('key', o => {
    const c = o.color || '#f1c40f';
    return G().cyl(0, -0.03, 0, 0.12, 0.06, c, { seg: 8, glow: 0.2 }).rotX(Math.PI / 2).move(0, 0.12, 0)
      .box(0, -0.25, 0, 0.05, 0.3, 0.05, c, { glow: 0.2 }).box(0.05, -0.25, 0, 0.08, 0.05, 0.05, c).box(0.05, -0.16, 0, 0.06, 0.04, 0.05, c);
  });
  M.add('chip', o => {
    const c = o.color || '#27ae60', g = G().box(0, -0.2, 0, 0.36, 0.4, 0.03, c, { glow: 0.15 }).box(0, -0.08, 0.018, 0.14, 0.14, 0.02, '#222');
    for (let i = 0; i < 5; i++) g.box(-0.12 + i * 0.06, -0.2, 0.016, 0.03, 0.07, 0.005, '#f1c40f', { glow: 0.3 });
    return g;
  });
  M.add('trophy', o => {
    const c = o.color || '#f1c40f';
    return G().box(0, 0, 0, 0.3, 0.08, 0.3, '#5d4037').cyl(0, 0.08, 0, 0.04, 0.2, c).cyl(0, 0.28, 0, 0.1, 0.22, c, { rTop: 0.18, glow: 0.25 });
  });
  M.add('marker', o => G().cone(0, 0, 0, 0.18, 0.35, o.color || '#f39c12', { seg: 6, glow: 0.8 }).scale(1, -1, 1).move(0, 0.35, 0));

  // ----- nature -----
  M.add('tree', o => {
    const c = o.color || '#2e8b57';
    return G().cyl(0, 0, 0, 0.15, 1, '#7b5230', { seg: 6 }).cone(0, 0.8, 0, 0.9, 1.4, c, { seg: 7 }).cone(0, 1.6, 0, 0.65, 1.1, dk(c, 1.12), { seg: 7 });
  });
  M.add('rock', o => { const s = sz(o, 0.6); return G().sphere(0, s * 0.45, 0, s, o.color || '#8e8e8e', { seg: 6, rings: 4 }).scale(1, 0.6, 0.85); });
  M.add('cone', o => G().box(0, 0, 0, 0.45, 0.04, 0.45, '#222').cone(0, 0.04, 0, 0.17, 0.6, o.color || '#e67e22', { seg: 8 }).cyl(0, 0.25, 0, 0.12, 0.1, '#fff', { rTop: 0.1, seg: 8 }));

  // ----- people -----
  M.add('person', o => {
    const skin = o.skin || '#e0ac69', shirt = o.color || o.shirt || '#2980b9', pants = o.pants || '#2c3e50', hair = o.hair || '#3b2a1a';
    const g = G();
    g.box(-0.11, 0, 0, 0.17, 0.8, 0.2, pants).box(0.11, 0, 0, 0.17, 0.8, 0.2, pants);
    g.box(0, 0.8, 0, 0.5, 0.62, 0.26, shirt);
    g.box(-0.32, 0.84, 0, 0.13, 0.56, 0.14, shirt).box(0.32, 0.84, 0, 0.13, 0.56, 0.14, shirt);
    g.box(-0.32, 0.72, 0, 0.11, 0.13, 0.12, skin).box(0.32, 0.72, 0, 0.11, 0.13, 0.12, skin);
    g.box(0, 1.42, 0, 0.14, 0.08, 0.14, skin).box(0, 1.5, 0, 0.34, 0.34, 0.3, skin);
    g.box(0, 1.78, -0.02, 0.37, 0.1, 0.34, hair).box(0, 1.52, -0.14, 0.37, 0.3, 0.06, hair);
    g.box(-0.08, 1.63, 0.151, 0.05, 0.05, 0.01, '#222').box(0.08, 1.63, 0.151, 0.05, 0.05, 0.01, '#222');
    return g.box(0, 1.54, 0.151, 0.1, 0.025, 0.01, '#8e4b3b');
  });
  // ----- shared shape cache -----
  const shapes = {};
  /** model = registered name or fn(look) → Geo (then ownerId keeps its cache key unique). */
  M.shape = function (model, look, ownerId) {
    const key = (typeof model === 'function' ? 'fn:' + ownerId : model) + JSON.stringify(look || {});
    if (!shapes[key]) {
      const geo = typeof model === 'function' ? model(look || {}) : M.get(model)(look || {});
      shapes[key] = { key, geo, bounds: geo.bounds(), top: geo.topColor() };
    }
    return shapes[key];
  };

  M.add('robot', o => {
    const c = o.color || '#95a5a6';
    return G().cyl(0, 0, 0, 0.3, 0.9, dk(c), { seg: 10 }).box(0, 0.9, 0, 0.6, 0.5, 0.45, c).box(0, 1.4, 0, 0.44, 0.34, 0.38, c)
      .box(-0.1, 1.5, 0.19, 0.08, 0.08, 0.02, '#3fc1ff', { glow: 1 }).box(0.1, 1.5, 0.19, 0.08, 0.08, 0.02, '#3fc1ff', { glow: 1 })
      .box(0, 1.74, 0, 0.03, 0.2, 0.03, '#555').sphere(0, 1.96, 0, 0.05, '#e74c3c', { glow: 1 });
  });
})();

</script>
<script>/* game-types/../assets/models/circuit.js */
/* Game Kit · assets/models/circuit.js
   Giant computer parts, for worlds where the player is tiny (inside a computer, a phone, a robot…).
   Same rules as lowpoly.js: fn(look) → GK.Geo, centred on x/z, standing on y = 0, FRONT facing +z.
   Sizes are in metres at "shrunk" scale, so a capacitor is a tower and a chip is a building.
     capacitor  icChip  ramStick  heatsink  fan  platter  readArm  coinCell  keycap  led  trace  resistor
     usbPort  psu  cableRun  standoff  databit  packet  virus  gpuCore
   look.size changes the main dimensions (see each model); look.color the main colour. */
(function () {
  'use strict';
  const U = GK.util, M = GK.Models;
  const G = () => new GK.Geo();
  const dk = (c, f) => U.shade(c, f == null ? 0.7 : f);
  const sz = (o, d) => (o.size == null ? d : o.size);
  const METAL = '#c3c9d1', DARK = '#1b1d24', GOLD = '#d9a92b';

  // electrolytic capacitor: size [radius, height]
  M.add('capacitor', o => {
    const s = sz(o, [1.1, 4.2]), r = s[0], h = s[1], c = o.color || '#23408e';
    const g = G().cyl(0, 0, 0, r * 1.02, 0.25, '#111', { seg: 14 })
      .cyl(0, 0.25, 0, r, h - 0.25, c, { seg: 14 })
      .cyl(0, h, 0, r * 0.97, 0.1, METAL, { seg: 14 })
      .box(0, h + 0.1, 0, r * 1.5, 0.05, 0.14, '#7f8791').box(0, h + 0.1, 0, 0.14, 0.05, r * 1.5, '#7f8791');
    return g.box(0, 0.6, r * 0.97, r * 0.42, h * 0.72, 0.06, o.stripe || '#a9c1f0');
  });

  // integrated circuit (a "building"): size [width, depth, height]
  M.add('icChip', o => {
    const s = sz(o, [5, 5, 1.2]), w = s[0], d = s[1], h = s[2], c = o.color || DARK;
    const g = G().box(0, 0.25, 0, w, h, d, c, { top: dk(c, 1.25) });
    const pins = Math.max(3, Math.round(w / 0.8));
    for (let i = 0; i < pins; i++) {
      const x = -w / 2 + (i + 0.5) * (w / pins);
      g.box(x, 0, d / 2 + 0.2, 0.28, 0.6, 0.4, METAL).box(x, 0, -d / 2 - 0.2, 0.28, 0.6, 0.4, METAL);
    }
    const pinsZ = Math.max(3, Math.round(d / 0.8));
    for (let i = 0; i < pinsZ; i++) {
      const z = -d / 2 + (i + 0.5) * (d / pinsZ);
      g.box(w / 2 + 0.2, 0, z, 0.4, 0.6, 0.28, METAL).box(-w / 2 - 0.2, 0, z, 0.4, 0.6, 0.28, METAL);
    }
    g.cyl(-w / 2 + 0.6, 0.25 + h, -d / 2 + 0.6, 0.22, 0.02, '#555', { seg: 8 });
    g.box(0, 0.25 + h, 0, w * 0.6, 0.02, d * 0.12, o.mark || '#6b7280');
    if (o.glow) g.box(0, 0.25 + h, d * 0.25, w * 0.3, 0.03, d * 0.08, o.glow, { glow: 1 });
    return g;
  });

  // memory module standing on its gold contacts: size [length, height]
  M.add('ramStick', o => {
    const s = sz(o, [9, 3.6]), L = s[0], H = s[1], t = 0.25, c = o.color || '#1e7a4a';
    const g = G().box(0, 0.45, 0, L, H, t, c);
    const n = 8, gap = L / n;
    for (let i = 0; i < n; i++) {
      const x = -L / 2 + (i + 0.5) * gap;
      g.box(x, 0.45 + H * 0.3, t / 2 + 0.08, gap * 0.7, H * 0.45, 0.16, DARK).box(x, 0.45 + H * 0.3, -t / 2 - 0.08, gap * 0.7, H * 0.45, 0.16, DARK);
    }
    for (let i = 0; i < 24; i++) g.box(-L / 2 + 0.3 + i * (L - 0.6) / 23, 0, 0, 0.18, 0.45, t * 1.02, GOLD, { glow: 0.25 });
    return g.box(L * 0.12, 0, 0, 0.3, 0.45, t * 1.05, '#0e1a12').box(0, 0.45 + H - 0.2, 0, L, 0.2, t * 1.04, dk(c, 0.8));
  });

  // cooler fins on a base: size [width, depth, height]
  M.add('heatsink', o => {
    const s = sz(o, [6, 4, 3]), w = s[0], d = s[1], h = s[2], c = o.color || '#9aa3ad';
    const g = G().box(0, 0, 0, w, 0.5, d, dk(c, 0.85));
    const fins = Math.max(4, Math.round(w / 0.6));
    for (let i = 0; i < fins; i++) g.box(-w / 2 + (i + 0.5) * (w / fins), 0.5, 0, 0.12, h - 0.5, d, c, { top: U.shade(c, 1.2) });
    return g;
  });

  // flat cooling fan (spin it with the entity's `spin`): size = width
  M.add('fan', o => {
    const s = sz(o, 6), r = s / 2, c = o.color || '#3a4150', frame = o.frame || '#22262e';
    const g = G();
    g.box(0, 0, -r, s, 0.35, 0.4, frame).box(0, 0, r, s, 0.35, 0.4, frame).box(-r, 0, 0, 0.4, 0.35, s, frame).box(r, 0, 0, 0.4, 0.35, s, frame);
    g.cyl(0, 0, 0, r * 0.24, 0.4, dk(c, 0.8), { seg: 12 }).cyl(0, 0.4, 0, r * 0.12, 0.03, o.hub || '#4cc9f0', { seg: 10, glow: 0.9 });
    const blades = 7;
    for (let i = 0; i < blades; i++) {
      const b = G().box(r * 0.55, 0.08, 0, r * 0.7, 0.12, r * 0.32, c).rotX(0.35).rotY(i / blades * Math.PI * 2);
      g.add(b);
    }
    if (o.ring) for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; g.box(Math.cos(a) * r * 0.9, 0.35, Math.sin(a) * r * 0.9, 0.25, 0.04, 0.25, o.ring, { glow: 1 }); }
    return g;
  });

  // hard-disk platter (low enough to step onto; spin it): size = radius
  M.add('platter', o => {
    const r = sz(o, 4), c = o.color || '#d4dae2';
    return G().cyl(0, 0, 0, r, 0.22, c, { seg: 28, top: U.shade(c, 1.08) })
      .cyl(0, 0.22, 0, r * 0.82, 0.01, dk(c, 0.92), { seg: 28 }).cyl(0, 0.23, 0, r * 0.62, 0.01, U.shade(c, 1.12), { seg: 28 })
      .cyl(0, 0.24, 0, r * 0.4, 0.01, dk(c, 0.9), { seg: 24 }).cyl(0, 0, 0, r * 0.14, 0.7, '#7d858f', { seg: 12 })
      .box(r * 0.5, 0.25, 0, r * 0.3, 0.012, 0.08, '#4cc9f0', { glow: 0.8 });
  });

  // hard-disk read/write arm, pivot at the origin, reaching along -x: size = length
  M.add('readArm', o => {
    const L = sz(o, 5);
    return G().cyl(0, 0, 0, 0.6, 1.4, '#4b5563', { seg: 10 }).box(-L / 2, 0.9, 0, L, 0.2, 0.5, o.color || '#9ca3af')
      .box(-L, 0.55, 0, 0.5, 0.4, 0.45, '#374151').box(-L, 0.5, 0, 0.12, 0.06, 0.12, '#ef4444', { glow: 1 });
  });

  // coin-cell battery (CMOS): size [radius, height]
  M.add('coinCell', o => {
    const s = sz(o, [2.2, 0.8]), r = s[0], h = s[1];
    return G().cyl(0, 0, 0, r, h, o.color || '#d5d8dc', { seg: 20, top: '#e9ecef' })
      .box(0, h, 0, r * 0.6, 0.04, 0.2, '#6c757d').box(0, h, 0, 0.2, 0.04, r * 0.6, '#6c757d');
  });

  // giant keyboard key, low enough to step onto (0.36 m): size = width. look.on lights the top (pressed).
  M.add('keycap', o => {
    const s = sz(o, 1.7), c = o.color || '#2f3542', on = o.on;
    return G().box(0, 0, 0, s, 0.26, s, dk(c, 0.8)).box(0, 0.26, 0, s * 0.82, 0.1, s * 0.82, on ? (o.lit || '#4cc9f0') : c, { glow: on ? 0.9 : 0.05, top: on ? (o.lit || '#4cc9f0') : U.shade(c, 1.25) });
  });

  // status LED on a little base
  M.add('led', o => {
    const c = o.color || '#2ecc71';
    return G().box(0, 0, 0, 0.5, 0.2, 0.5, '#2d3436').sphere(0, 0.32, 0, 0.22, c, { glow: o.off ? 0.1 : 1 });
  });

  // copper/gold trace on the board (flat, put it at y ≈ 0.01, not solid): size [length, width]
  M.add('trace', o => {
    const s = sz(o, [8, 0.35]);
    return G().box(0, 0, 0, s[0], 0.02, s[1], o.color || GOLD, { glow: o.glow == null ? 0.35 : o.glow }).box(-s[0] / 2, 0, 0, 0.7, 0.03, 0.7, o.color || GOLD, { glow: 0.5 }).box(s[0] / 2, 0, 0, 0.7, 0.03, 0.7, o.color || GOLD, { glow: 0.5 });
  });

  // resistor lying on its side: size = length
  M.add('resistor', o => {
    const L = sz(o, 3), c = o.color || '#d8c39a';
    const body = G().cyl(0, -L / 2, 0, 0.45, L, c, { seg: 10 });
    const bands = o.bands || ['#8e44ad', '#c0392b', '#e67e22', GOLD];
    bands.forEach((b, i) => body.cyl(0, -L / 2 + 0.4 + i * 0.5, 0, 0.47, 0.18, b, { seg: 10 }));
    return body.rotZ(Math.PI / 2).move(0, 0.55, 0).box(-L / 2 - 0.6, 0, 0, 0.1, 0.55, 0.1, METAL).box(L / 2 + 0.6, 0, 0, 0.1, 0.55, 0.1, METAL)
      .box(-L / 2 - 0.3, 0.5, 0, 0.7, 0.1, 0.1, METAL).box(L / 2 + 0.3, 0.5, 0, 0.7, 0.1, 0.1, METAL);
  });

  // USB-A socket frame you can walk into (front +z): size [width, height, depth]
  M.add('usbPort', o => {
    const s = sz(o, [5, 3, 3]), w = s[0], h = s[1], d = s[2], c = o.color || '#b8bec6', t = 0.2;
    return G().box(0, 0, 0, w, t, d, c).box(0, h - t, 0, w, t, d, c).box(-w / 2 + t / 2, 0, 0, t, h, d, c).box(w / 2 - t / 2, 0, 0, t, h, d, c)
      .box(0, h * 0.55, -0.2, w - 0.8, h * 0.3, d - 0.4, o.tongue || '#1f6feb', { glow: 0.25 })
      .box(-w * 0.25, h * 0.8, d / 2, 0.5, 0.3, 0.02, '#e9ecef').box(w * 0.25, h * 0.8, d / 2, 0.5, 0.3, 0.02, '#e9ecef');
  });

  // power-supply unit: size [width, height, depth]
  M.add('psu', o => {
    const s = sz(o, [6, 4, 4]), w = s[0], h = s[1], d = s[2], c = o.color || '#2d3436';
    const g = G().box(0, 0, 0, w, h, d, c, { top: U.shade(c, 1.2) });
    for (let i = 0; i < 9; i++) g.box(-w * 0.35 + i * w * 0.0875, h * 0.25, d / 2 + 0.01, 0.12, h * 0.5, 0.04, '#111');
    return g.box(w * 0.3, h * 0.72, d / 2 + 0.02, w * 0.25, h * 0.16, 0.02, '#f1c40f').box(w * 0.3, h * 0.75, d / 2 + 0.04, 0.12, h * 0.1, 0.02, '#111')
      .box(-w * 0.32, h * 0.82, d / 2 + 0.02, 0.4, 0.25, 0.03, o.light || '#e74c3c', { glow: 1 });
  });

  // bundle of thick wires lying along x: size [length, radius]
  M.add('cableRun', o => {
    const s = sz(o, [10, 0.35]), L = s[0], r = s[1];
    const cols = o.colors || ['#e74c3c', '#f1c40f', '#2d3436', '#2d3436', '#e67e22'];
    const g = G();
    cols.forEach((c, i) => g.add(G().cyl(0, -L / 2, 0, r, L, c, { seg: 8 }).rotZ(Math.PI / 2).move(0, r + (i % 2) * r * 1.6, (i - (cols.length - 1) / 2) * r * 2.1)));
    return g.box(-L / 2, 0, 0, 0.8, r * 4.5, cols.length * r * 2.3, '#e9ecef').box(L / 2, 0, 0, 0.8, r * 4.5, cols.length * r * 2.3, '#e9ecef');
  });

  // brass board standoff / screw post: size [radius, height]
  M.add('standoff', o => {
    const s = sz(o, [0.6, 2]);
    return G().cyl(0, 0, 0, s[0], s[1], o.color || '#c9a227', { seg: 6 }).cyl(0, s[1], 0, s[0] * 1.3, 0.25, '#9aa3ad', { seg: 12 }).box(0, s[1] + 0.25, 0, s[0] * 1.6, 0.04, 0.12, '#555');
  });

  // collectible "data bit": a glowing cube
  M.add('databit', o => {

  // computer virus: spiky glowing ball with eyes: size = radius

  M.add('gpuCore', o => {
    const s = sz(o, [6, 4]), w = s[0], d = s[1], c = o.color || '#111827';

  // ---------- game pieces: power-ups, enemies, hazards, lights ----------
  // power-up orb with a ring of sparks (float + spin it): look.color
  M.add('powerup', o => {
    const c = o.color || '#2ecc71', g = G().sphere(0, 0, 0, 0.32, c, { glow: 0.95, seg: 10, rings: 8 }).sphere(0, 0, 0, 0.16, '#ffffff', { glow: 1 });
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; g.box(Math.cos(a) * 0.55, -0.04, Math.sin(a) * 0.55, 0.1, 0.08, 0.1, c, { glow: 1 }); }

  // a software "bug": a cute beetle with glowing eyes: size = body length, look.color
  M.add('bug', o => {

    g.box(-0.11, 0.5, L * 0.5 + 0.22, 0.05, 0.05, 0.03, '#111').box(0.11, 0.5, L * 0.5 + 0.22, 0.05, 0.05, 0.03, '#111');
    for (const sx of [-1, 1]) for (const zz of [-0.3, 0, 0.3]) g.box(sx * L * 0.42, 0, zz * L, L * 0.4, 0.06, 0.06, '#222').box(sx * L * 0.6, 0, zz * L, 0.06, 0.25, 0.06, '#222');
    return g.box(-0.1, 0.55, L * 0.62, 0.03, 0.03, 0.35, '#222').box(0.1, 0.55, L * 0.62, 0.03, 0.03, 0.35, '#222')
      .sphere(-0.1, 0.56, L * 0.62 + 0.18, 0.05, o.tip || '#f1c40f', { glow: 1 }).sphere(0.1, 0.56, L * 0.62 + 0.18, 0.05, o.tip || '#f1c40f', { glow: 1 });
  });

  // a dust bunny: a fluffy grey ball with eyes: size = radius
  M.add('dustBunny', o => {
    const r = sz(o, 0.55), c = o.color || '#a4a9b3', g = G();
    g.sphere(0, r, 0, r, c, { seg: 8, rings: 6 });

  // electric spark pad on the floor (a pulsing hazard): size = radius, look.off dims it
  M.add('sparkPad', o => {
    const r = sz(o, 1.1), on = !o.off, c = o.color || '#ffd23f';
    const g = G().cyl(0, 0, 0, r, 0.06, '#2d3436', { seg: 14 }).cyl(0, 0.06, 0, r * 0.85, 0.02, on ? c : '#4b5058', { seg: 14, glow: on ? 0.9 : 0 });

      g.box(Math.cos(a) * r * 0.5, 0.1, Math.sin(a) * r * 0.5, 0.06, 0.6 + (i % 2) * 0.4, 0.06, c, { glow: 1 });

  // glowing light strip for walls (place it against a wall, not solid): size [length, height]
  M.add('lightStrip', o => {
    const s = sz(o, [6, 0.25]), c = o.color || '#4cc9f0';

  // an energy cell (collectible battery): look.color is the glowing band
  M.add('energyCell', o => {

  });
})();

<script>/* game-types/../assets/models/combat.js */
/* Game Kit · assets/models/combat.js
   Things for action games (mechanics/weapons + hazards) and for network / internet worlds.
   Same rules as lowpoly.js: fn(look) → GK.Geo, centred on x/z, standing on y = 0, FRONT facing +z
   (held tools and bolts are centred on their middle instead).
     held tools: zapper  blaster          shots: bolt  spark          enemies: turret  queenBug  glitchCore  target
     boss fight: pylon                    network: router  serverRack  firewall  dataTower  satDish  mailbox  cloudGate
   look.size changes the main dimensions (see each model); look.color the main colour. */
(function () {
  'use strict';
  const U = GK.util, M = GK.Models;
  const G = () => new GK.Geo();
  const dk = (c, f) => U.shade(c, f == null ? 0.7 : f);
  const sz = (o, d) => (o.size == null ? d : o.size);
  const DARK = '#1b1d24', METAL = '#c3c9d1';
  const along = g => g.rotX(Math.PI / 2);   // turn a vertical cylinder to point forward (+z)

  // ---------- held tools (drawn in the player's hand; centred, muzzle at +z) ----------

    const c = o.color || '#f5b700', gl = o.glow || '#4cc9f0', g = G();
    g.box(0, -0.05, -0.02, 0.09, 0.09, 0.3, c, { top: dk(c, 1.15) });                   // body
    g.box(0, -0.15, -0.11, 0.06, 0.13, 0.07, dk(c, 0.55));                              // handle
    g.box(0, -0.09, -0.04, 0.02, 0.05, 0.06, DARK);                                     // trigger
    g.add(along(G().cyl(0, 0, 0, 0.045, 0.1, DARK, { seg: 10 })).move(0, 0, 0.12));     // barrel

    for (let i = 0; i < 4; i++) g.box(0, 0.04, -0.12 + i * 0.06, 0.1, 0.022, 0.025, gl, { glow: 1 });   // coil
    return g.box(0, 0.055, 0.0, 0.03, 0.03, 0.2, '#ffffff', { glow: 0.6 });
  });
  // a sleek antivirus blaster: look.color body, look.glow energy lines
  M.add('blaster', o => {
    const c = o.color || '#e6e9f2', gl = o.glow || '#a855f7', g = G();
    g.box(0, -0.05, -0.04, 0.075, 0.075, 0.36, c, { top: dk(c, 1.1) });

    g.box(0, -0.17, -0.12, 0.055, 0.14, 0.065, '#2d2f3a');                              // grip
    g.box(0, -0.12, 0.06, 0.05, 0.07, 0.08, '#2d2f3a');                                 // front grip
    g.add(along(G().cyl(0, 0, 0, 0.03, 0.16, DARK, { seg: 10 })).move(0, -0.012, 0.13));
    g.add(along(G().cyl(0, 0, 0, 0.026, 0.02, gl, { seg: 10, glow: 1 })).move(0, -0.012, 0.29));
    g.box(0.039, -0.03, -0.04, 0.005, 0.02, 0.28, gl, { glow: 1 }).box(-0.039, -0.03, -0.04, 0.005, 0.02, 0.28, gl, { glow: 1 });
    return g.box(0, 0.045, -0.16, 0.035, 0.03, 0.05, gl, { glow: 1 });
  });

  // spread gun: three short barrels side by side: look.color, look.glow
  M.add('scatterGun', o => {
    const c = o.color || '#ff7a1a', gl = o.glow || '#ffd23f', g = G();
    g.box(0, -0.06, -0.04, 0.13, 0.1, 0.3, c, { top: dk(c, 1.15) });
    g.box(0, -0.17, -0.12, 0.06, 0.13, 0.07, dk(c, 0.5)).box(0, 0.04, -0.1, 0.09, 0.03, 0.16, '#2d2f3a');
    for (const x of [-0.04, 0, 0.04]) {
      g.add(along(G().cyl(0, 0, 0, 0.022, 0.14, DARK, { seg: 8 })).move(x, -0.01, 0.1));
      g.add(along(G().cyl(0, 0, 0, 0.016, 0.02, gl, { seg: 8, glow: 1 })).move(x, -0.01, 0.235));
    }
    return g.box(0.068, -0.03, -0.04, 0.006, 0.03, 0.24, gl, { glow: 1 }).box(-0.068, -0.03, -0.04, 0.006, 0.03, 0.24, gl, { glow: 1 });
  });
  // rapid-fire gun: long body with a drum: look.color, look.glow
  M.add('rapidGun', o => {
    const c = o.color || '#2ecc71', gl = o.glow || '#a5ffcf', g = G();
    g.box(0, -0.05, -0.06, 0.08, 0.08, 0.42, c, { top: dk(c, 1.15) });
    g.add(G().cyl(0, 0, 0, 0.06, 0.07, '#2d2f3a', { seg: 10 }).rotZ(Math.PI / 2).move(-0.035, -0.06, -0.02));
    g.box(0, -0.17, -0.16, 0.055, 0.13, 0.06, '#2d2f3a');
    g.add(along(G().cyl(0, 0, 0, 0.024, 0.18, DARK, { seg: 8 })).move(0, -0.01, 0.15));
    for (let i = 0; i < 5; i++) g.box(0, 0.03, -0.2 + i * 0.07, 0.085, 0.015, 0.03, gl, { glow: 1 });
    return g.add(along(G().cyl(0, 0, 0, 0.02, 0.02, gl, { seg: 8, glow: 1 })).move(0, -0.01, 0.33));
  });
  // long laser rifle with a scope: look.color, look.glow
  M.add('beamRifle', o => {
    const c = o.color || '#e6e9f2', gl = o.glow || '#ff2d55', g = G();
    g.box(0, -0.045, -0.1, 0.06, 0.07, 0.5, c, { top: dk(c, 1.1) });
    g.box(0, -0.15, -0.2, 0.05, 0.12, 0.06, '#2d2f3a').box(0, -0.02, -0.33, 0.05, 0.08, 0.1, '#2d2f3a');
    g.add(along(G().cyl(0, 0, 0, 0.022, 0.12, DARK, { seg: 8 })).move(0, 0.05, -0.12));   // scope
    g.add(along(G().cyl(0, 0, 0, 0.018, 0.02, gl, { seg: 8, glow: 1 })).move(0, 0.05, 0.0));
    g.add(along(G().cyl(0, 0, 0, 0.016, 0.22, '#9aa0a6', { seg: 8 })).move(0, -0.015, 0.15));
    g.box(0.032, -0.03, -0.1, 0.005, 0.02, 0.44, gl, { glow: 1 }).box(-0.032, -0.03, -0.1, 0.005, 0.02, 0.44, gl, { glow: 1 });
    return g.add(along(G().cyl(0, 0, 0, 0.02, 0.02, gl, { seg: 8, glow: 1 })).move(0, -0.015, 0.37));
  });
  // bomb launcher: a fat tube with a glowing orb inside: look.color, look.glow
  M.add('orbLauncher', o => {
    const c = o.color || '#8e44ad', gl = o.glow || '#ff9f43', g = G();
    g.add(along(G().cyl(0, 0, 0, 0.075, 0.42, c, { seg: 12 })).move(0, -0.02, -0.2));
    g.add(along(G().cyl(0, 0, 0, 0.085, 0.04, '#2d2f3a', { seg: 12 })).move(0, -0.02, 0.2));
    g.sphere(0, -0.02, 0.2, 0.05, gl, { seg: 8, rings: 6, glow: 1 });
    g.box(0, -0.19, -0.12, 0.055, 0.14, 0.065, '#2d2f3a').box(0, 0.06, -0.08, 0.03, 0.05, 0.1, '#2d2f3a');
    for (let i = 0; i < 3; i++) g.add(along(G().cyl(0, 0, 0, 0.079, 0.012, gl, { seg: 12, glow: 1 })).move(0, -0.02, -0.15 + i * 0.1));
    return g;
  });

  // ---------- pickups ----------
  M.add('ammoBox', o => {
    const c = o.color || '#3d5a3d', g = G().box(0, 0, 0, 0.55, 0.32, 0.36, c, { top: dk(c, 1.2) });
    g.box(0, 0.32, 0, 0.58, 0.05, 0.39, dk(c, 0.6)).box(0, 0.12, 0.181, 0.36, 0.12, 0.01, '#f5b700', { glow: 0.9 });
    for (const x of [-0.12, 0, 0.12]) g.box(x, 0.37, 0, 0.06, 0.12, 0.06, '#f5b700', { glow: 0.7 });
    return g;
  });
  M.add('coinStack', o => {
    const g = G();
    for (let i = 0; i < 4; i++) g.cyl(Math.sin(i * 1.7) * 0.03, i * 0.07, Math.cos(i * 1.7) * 0.03, 0.17, 0.06, '#f5c542', { seg: 12, glow: 0.6 });
    return g.cyl(0.25, 0, 0.05, 0.17, 0.06, '#f5c542', { seg: 12, glow: 0.6 }).box(0, 0.3, 0, 0.1, 0.02, 0.02, '#fff8d6', { glow: 1 });
  });
  M.add('healthPack', o => {
    const g = G().box(0, 0, 0, 0.5, 0.3, 0.36, '#f4f6fb', { top: '#ffffff' });
    return g.box(0, 0.08, 0.181, 0.24, 0.07, 0.01, '#ff2d55', { glow: 1 }).box(0, 0.0, 0.181, 0.07, 0.23, 0.012, '#ff2d55', { glow: 1 })
      .box(0, 0.3, 0, 0.24, 0.01, 0.07, '#ff2d55', { glow: 1 }).box(0, 0.3, 0, 0.07, 0.012, 0.24, '#ff2d55', { glow: 1 });
  });

  // ---------- traps and obstacles ----------
  // laser gate across a passage: size = width; look.off = beams off (posts only); look.color
  M.add('laserGate', o => {
    const w = sz(o, 4), c = o.color || '#ff2d55', g = G();
    for (const x of [-w / 2, w / 2]) g.box(x, 0, 0, 0.3, 2.2, 0.3, '#2d3436', { top: '#636e72' }).box(x, 2.2, 0, 0.36, 0.12, 0.36, o.off ? '#4b5058' : c, { glow: o.off ? 0 : 1 });
    if (!o.off) for (const y of [0.35, 0.85, 1.35, 1.85]) g.box(0, y, 0, w - 0.3, 0.05, 0.05, c, { glow: 1 });
    else for (const y of [0.35, 0.85, 1.35, 1.85]) g.box(-w / 2 + 0.2, y, 0, 0.06, 0.04, 0.06, '#4b5058').box(w / 2 - 0.2, y, 0, 0.06, 0.04, 0.06, '#4b5058');
    return g;
  });
  // crusher: a heavy block that slams down (look.off = raised, safe): size = width
  M.add('crusher', o => {
    const w = sz(o, 2.2), up = !!o.off, g = G(), y = up ? 2.6 : 0.05;
    for (const x of [-w / 2 - 0.15, w / 2 + 0.15]) g.box(x, 0, 0, 0.2, 4.2, 0.4, '#2d3436', { top: '#636e72' });
    g.box(0, 4.0, 0, w + 0.5, 0.3, 0.5, '#2d3436');
    g.box(0, y, 0, w, 1.4, w, '#7f8c8d', { top: '#95a5a6' });
    g.box(0, y + 0.2, w / 2 + 0.01, w * 0.8, 0.12, 0.02, up ? '#f5b700' : '#ff2d55', { glow: 1 }).box(0, y + 0.2, -w / 2 - 0.01, w * 0.8, 0.12, 0.02, up ? '#f5b700' : '#ff2d55', { glow: 1 });
    for (let i = 0; i < 5; i++) g.box(-w / 2 + (i + 0.5) * w / 5, y - 0.04, 0, 0.12, 0.08, w * 0.9, '#2d3436');

  // rolling spike ball: size = radius; look.color
  M.add('roller', o => {

    const dirs = [[1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, 0, 1], [0, 0, -1], [0.7, 0.7, 0], [-0.7, 0.7, 0], [0, 0.7, 0.7], [0, 0.7, -0.7], [0.7, -0.5, 0.5], [-0.7, -0.5, -0.5]];
    for (const v of dirs) g.box(v[0] * r * 1.05, r + v[1] * r * 1.05 - 0.06, v[2] * r * 1.05, 0.14, 0.14, 0.14, '#ecf0f1');
    return g.box(-r * 0.3, r * 1.25, r * 0.8, r * 0.18, r * 0.18, 0.04, '#ffd23f', { glow: 1 }).box(r * 0.3, r * 1.25, r * 0.8, r * 0.18, r * 0.18, 0.04, '#ffd23f', { glow: 1 });
  });
  // a puddle of corrupted data (goo): size = radius; look.color
  M.add('goo', o => {
    const r = sz(o, 1.4), c = o.color || '#7CFC00', g = G().cyl(0, 0, 0, r, 0.04, dk(c, 0.5), { seg: 14 }).cyl(0, 0.04, 0, r * 0.82, 0.02, c, { seg: 14, glow: 0.8 });
    for (let i = 0; i < 6; i++) { const a = i * 1.05; g.sphere(Math.cos(a) * r * 0.5, 0.08, Math.sin(a) * r * 0.5, 0.09 + (i % 3) * 0.04, c, { seg: 6, rings: 4, glow: 1 }); }
    return g;
  });
  // breakable data crate with loot inside: size = edge; look.color
  M.add('dataCrate', o => {
    const s = sz(o, 1.2), c = o.color || '#8e6c3a', g = G().box(0, 0, 0, s, s, s, c, { top: dk(c, 1.15) });
    for (const f of [1, -1]) {
      g.box(0, s * 0.45, f * (s / 2 + 0.01), s * 0.9, 0.08, 0.02, dk(c, 0.6)).box(0, s * 0.45, f * (s / 2 + 0.02), 0.08, s * 0.9, 0.02, dk(c, 0.6));
