  function drawApp(S, w) {
    const a = w.app;
    if (a === 'settings') return drawSettings(S);
    if (a === 'store') return '<div class="dk-store"><h3>🛍️ Store</h3><p class="dk-muted">✅ = approved by the school</p>' + S.store.map(x => {
      const nm = x.name || appName(x.id), ic = x.icon || appIcon(x.id), have = S.apps.indexOf(x.id) >= 0;
      return '<div class="dk-storeapp' + (x.ok ? '' : ' bad') + '"><span class="dk-ci">' + ic + '</span><b>' + esc(nm) + '</b>' + (x.ok ? '<span class="dk-ok">✅</span>' : '<span class="dk-warn">⚠️ unknown</span>') +
        (have ? '<span class="dk-good">Installed</span>' : S.installing === x.id ? '<span class="dk-busy">⏳</span>' : B('get-' + x.id, 'Get ' + nm, 'Get', 'dk-primary dk-small')) + '</div>';
    }).join('') + '</div>';
    if (a === 'taskmgr') {
      let h = '<div class="dk-tm"><div class="dk-tabs">' + B('tm-proc', 'Processes', '📋 Processes', S.tmTab === 'proc' ? 'on' : '') + B('tm-perf', 'Performance', '📈 Performance', S.tmTab === 'perf' ? 'on' : '') + B('tm-startup', 'Startup apps', '🚀 Startup apps', S.tmTab === 'startup' ? 'on' : '') + '</div>';
      if (S.tmTab === 'proc') h += '<div class="dk-prochead"><span>Name</span><span>CPU</span><span>Memory</span></div>' + S.procs.map(p => B('proc-' + p.id, p.name, '<span>' + (p.frozen ? '❄️ ' : '') + esc(p.name) + (p.frozen ? ' <em>(Not responding)</em>' : '') + '</span><span>' + p.cpu + '%</span><span>' + p.mem + ' MB</span>', 'dk-procrow' + (S.selected === p.id ? ' on' : '') + (p.frozen ? ' frozen' : ''))).join('') +
        B('tm-end', 'End task', '⛔ End task', 'dk-danger' + (S.selected ? '' : ' off'));
      else if (S.tmTab === 'perf') { const cpu = Math.min(99, S.procs.reduce((t, p) => t + p.cpu, 0)), mem = S.procs.reduce((t, p) => t + p.mem, 0); h += '<div class="dk-perf"><div>🧠 CPU <b>' + cpu + '%</b><i style="width:' + cpu + '%"></i></div><div>⚡ Memory <b>' + (mem / 1000).toFixed(1) + ' GB</b> of ' + S.spec.ram + ' GB<i style="width:' + Math.min(100, mem / 10 / S.spec.ram) + '%"></i></div></div>'; }
      else h += '<table class="dk-tab"><tr><th>App</th><th>Startup impact</th><th></th></tr>' + S.startup.map(s => '<tr><td>' + appIcon(s.id) + ' ' + esc(s.name) + '</td><td>' + s.impact + '</td><td>' + B('su-' + s.id, (s.on ? 'Disable ' : 'Enable ') + s.name, s.on ? '✔ On' : '✖ Off', s.on ? 'dk-small on' : 'dk-small') + '</td></tr>').join('') + '</table>';
      return h + '</div>';
    }
    if (a === 'devmgr') {
      const cats = {};
      for (const d of S.devices) (cats[d.cat] = cats[d.cat] || []).push(d);
      const sel = S.devices.find(d => d.id === S.devSel);
      return '<div class="dk-dm">' + Object.keys(cats).map(c => '<div class="dk-dmcat">▾ ' + esc(c) + '</div>' + cats[c].map(d => B('dev-' + d.id, d.name, (d.ok ? '🟢 ' : '⚠️ ') + esc(d.name), 'dk-devrow' + (S.devSel === d.id ? ' on' : ''))).join('')).join('') +
        '<div class="dk-dmact">' + (sel ? '<b>' + esc(sel.name) + ':</b> ' + (S.devBusy ? '<span class="dk-busy">⏳ Updating driver…</span>' : (sel.ok ? '<span class="dk-good">This device is working properly.</span>' : '<span class="dk-warn">⚠️ This device has a problem.</span>') + B('dm-update', 'Update driver', '🔄 Update driver', 'dk-primary dk-small') + B('dm-uninstall', 'Uninstall device', '🗑️ Uninstall device', 'dk-small')) : '<span class="dk-muted">Click a device.</span>') + '</div></div>';
    }
    const p = S.procs.find(x => x.id === a);
    if (p && p.frozen) return '<div class="dk-frozen">❄️ ' + esc(appName(a)) + ' is not responding…<br><small>Clicking does nothing. Use Task Manager.</small></div>';
    if (a === 'notes') return '<div class="dk-notes">My homework notes…<br>✏️ Science: plants need light.</div>';
    if (a === 'web') {
      if (S.webPage === 'download') return '<div class="dk-web"><div class="dk-url">🔒 libreoffice.org/download</div><div class="dk-ad">' + B('dl-ad', 'FAST DOWNLOAD (ad)', '⬇️⬇️ FAST DOWNLOAD!!! ⬇️⬇️', '') + '<small>Ad</small></div><h3>📄 LibreOffice (official site)</h3><p>Free office suite.</p>' + B('dl-official', 'Download LibreOffice', '⬇️ Download LibreOffice', 'dk-primary') + '</div>';
      return '<div class="dk-web"><div class="dk-url">🔒 school.example/homework</div><h3>📚 Homework page</h3><p>Today: read page 12.</p>' + B('web-download', 'Go to libreoffice.org', '🔗 libreoffice.org', 'dk-small') + '</div>';
    }
    if (a === 'cmd') return '<div class="dk-cmd"><pre>' + esc(['Microsoft Windows [Version 10.0.22631]', ''].concat(S.cmdOut).join('\n')) + '</pre><div class="dk-cmdrow"><span>C:\\Users\\' + esc(S.users[0]) + '&gt;</span><input data-id="cmd-input" class="dk-cmdin" spellcheck="false" autocomplete="off" placeholder="type a command">' + B('cmd-run', 'Run', '↵ Run', 'dk-small') + '</div></div>';
    if (a === 'files') return '<div class="dk-files">📁 Documents<br>📁 Pictures<br>📁 Downloads</div>';
    return '<div class="dk-appbody"><span>' + appIcon(a) + '</span><b>' + esc(appName(a)) + '</b></div>';
  }
  function drawDesktop(S, task) {

    if (S.power === 'locked') return '<div class="dk-lock" style="background:' + WALLS[S.lockPic] + '"><div class="dk-time">10:30</div>' + B('lock-unlock', 'Sign in', '👤 ' + esc(S.users[0]) + ' · Sign in', 'dk-primary') + '</div>';

    h += B('desk-bg', 'Desktop', '', 'dk-bg') + '<div class="dk-icons">' + B('ic-files', 'File Explorer', '📁<small>Files</small>', 'dk-icon') + B('ic-web', 'Edge', '🌐<small>Edge</small>', 'dk-icon') + '<span class="dk-icon dk-nob">🗑️<small>Recycle Bin</small></span></div>';
    S.windows.forEach((w, i) => {

      h += '<div class="dk-win st-' + w.st + (S.focus === w.app ? ' focus' : '') + '" style="--i:' + i + '"><div class="dk-title"><span>' + appIcon(w.app) + ' ' + esc(appName(w.app)) + '</span>' +
        B('w-min-' + w.app, 'Minimise', '—', 'dk-wb') + B('w-snap-' + w.app, 'Snap layouts', '⧉', 'dk-wb') + B('w-max-' + w.app, 'Maximise', '☐', 'dk-wb') + B('w-close-' + w.app, 'Close', '✕', 'dk-wb dk-x') + '</div>' +
        (S.open.snap === w.app ? '<div class="dk-snap">' + B('sn-left-' + w.app, 'Snap left', '◧ Left', '') + B('sn-right-' + w.app, 'Snap right', '◨ Right', '') + B('sn-max-' + w.app, 'Full screen', '⬛ Full', '') + '</div>' : '') +

    if (S.open.start) {
      h += '<div class="dk-start"><div class="dk-sttitle">📌 Pinned</div><div class="dk-pinned">' + S.apps.map(a => B('st-' + a, appName(a), appIcon(a) + '<small>' + esc(appName(a)) + '</small>', 'dk-pin')).join('') + '</div>' +
        '<div class="dk-stbar">' + B('st-user', 'Account', '👤 ' + esc(S.users[0])) + B('st-power', 'Power', '⏻') + '</div>' +
        (S.open.power ? '<div class="dk-pmenu">' + B('pw-sleep', 'Sleep', '💤 Sleep') + B('pw-shutdown', 'Shut down', '⏻ Shut down') + B('pw-restart', 'Restart', '🔁 Restart') + '</div>' : '') +
        (S.open.user ? '<div class="dk-pmenu left">' + B('ac-settings', 'Change account settings', '⚙️ Account settings') + B('ac-lock', 'Lock', '🔒 Lock') + B('ac-signout', 'Sign out', '🚪 Sign out') + '</div>' : '') + '</div>';
    }
    if (S.open.ctx) h += '<div class="dk-ctx">' + B('cx-taskmgr', 'Task Manager', '📊 Task Manager') + B('cx-devmgr', 'Device Manager', '🖥️ Device Manager') + B('cx-cmd', 'Terminal (Command Prompt)', '⬛ Terminal') + B('cx-settings', 'Settings', '⚙️ Settings') + '</div>';
    if (S.uac) h += '<div class="dk-uac"><b>🛡️ Do you want to allow this app to make changes to your device?</b><p>' + esc(appName(S.uac.app)) + '<br>Verified publisher: <b>' + esc(S.uac.publisher) + '</b></p>' + B('uac-yes', 'Yes', 'Yes', 'dk-primary') + B('uac-no', 'No', 'No', 'dk-small') + '</div>';
    if (S.open.quick) h += '<div class="dk-quick"><div>🔊 Volume ' + B('q-mute', 'Mute', S.mute ? '🔇' : '🔈', 'dk-small') + '</div><div class="dk-bar">' + Array.from({ length: 11 }, (_, i) => B('qvol-' + i, 'Volume ' + i * 10 + '%', '', i * 10 <= S.volume && !S.mute ? 'fill' : '')).join('') + '</div>' +
      '<div>☀️ Brightness</div><div class="dk-bar">' + Array.from({ length: 11 }, (_, i) => B('qbr-' + i, 'Brightness ' + i * 10 + '%', '', i * 10 <= S.brightness ? 'fill' : '')).join('') + '</div></div>';
    h += '<div class="dk-taskbar"><div class="dk-tbmid">' + B('start', 'Start', '<span class="dk-winlogo">⊞</span>', 'dk-tb', ' data-rc="1"') + B('tb-files', 'File Explorer', '📁', 'dk-tb') + B('tb-web', 'Edge', '🌐', 'dk-tb') + B('tb-store', 'Store', '🛍️', 'dk-tb') + B('tb-settings', 'Settings', '⚙️', 'dk-tb') +

    return h + '</div>';
  }

  GK.Interactions.add('desktop', {
    prompt: (ent, def, g) => (def.prompt || 'Fix') + ' ' + (ent.name || ''),
    run(g, ent, def, done) { g.desk.open(def.slot, done, ent, def); },
  });

  GK.Mechanics.add('desktop-sim', {
    configKeys: ['desktop'],
    setup(game) {
      css();
      const D = game.cfg.desktop || {}, W = Object.assign({}, WORDS, D.words);
      game.state.desk = { mastered: {}, stats: {}, jobs: {}, cards: [], checklist: null };
      const gradeOpts = () => Object.assign({ watch: 'auto', tryIt: true, ladder: [2, 4, 6] }, (D.grades || {})[game.difficulty] || {});
      const jobFor = slot => ((D.slots || {})[game.difficulty] || (D.slots || {}).all || {})[slot];
      let deckEl = null;
      const desk = game.desk = {
        jobFor, words: W,
        /** Open the job of a slot. */
        open(slot, done, ent, def) {
          const jid = jobFor(slot), job = (D.jobs || {})[jid];
          if (!job) { game.ui.toast('No job here.'); if (done) done(false); return; }
          if (game.state.flags['desk_' + slot]) { game.ui.toast(W.done + ' ' + (job.customer || '')); if (done) done(false); return; }
          if (def && def.requires !== undefined && !GK.test(game, def.requires)) { game.ui.toast(def.lockedText || W.locked, 'bad'); if (done) done(false); return; }
          if (game.vehicle && game.vehicle.driving) game.vehicle.exit();
          runJob(game, D, W, gradeOpts(), slot, jid, job, ok => { if (done) done(ok); });
        },
        report: () => reportHtml(game, D, W),
        printReport: () => printReport(game, D, W),
        record: () => recordHtml(game, D, W),
        skills: () => skillsFor(D, game.difficulty).map(k => ({ id: k, name: ((D.skills || {})[k] || { name: k }).name, points: skillPoints(game, k) })),
        deck() {
          const cards = game.state.desk.cards;
          const body = U.el('div', '');
          body.innerHTML = recordHtml(game, D, W) + (cards.length ? cards.map(id => skillCard(D, id)).join('') : '<p>' + esc(W.none) + '</p>');
          game.ui.panel({ title: W.cards, body, wide: true });
        },
        stats: () => game.state.desk,
      };
      void desk;
      // the 🃏 deck chip on the HUD (K opens it)
      deckEl = U.el('div', 'gk-guide-chip gk-desk-chip', 'K  ' + W.cards + ' · 📋');
      deckEl.style.cssText = 'position:absolute;right:12px;top:52%;pointer-events:auto;cursor:pointer';
      deckEl.onclick = () => game.desk.deck();
      game.ui.hud.appendChild(deckEl);
      game.on('game:win', () => setTimeout(() => {
        const s = document.querySelector('.gk-screen:last-child .gk-panel, .gk-screen:last-child') || null;
        if (!s) return;
        const box = U.el('div', 'gk-desk-report');
        box.style.cssText = 'background:#fff;color:#222;border-radius:12px;padding:10px 14px;margin:10px auto;max-width:560px;text-align:left';
        box.innerHTML = recordHtml(game, D, W) + reportHtml(game, D, W);
        if ((game.state.desk.report || []).length) {
          const pb = U.el('button', 'gk-btn primary', W.printReport || '🖨 Print my report');
          pb.style.marginTop = '8px'; pb.onclick = () => printReport(game, D, W);
          box.appendChild(pb);
        }
        s.appendChild(box);
      }, 30));
    },
    update(game) {
      if (game.state.mode === 'playing' && game.input.hits.has('KeyK') && game.desk) game.desk.deck();
    },
    validate(game, report) {
      const D = game.cfg.desktop || {};
      for (const g in D.slots || {}) for (const s in D.slots[g]) {
        const j = (D.jobs || {})[D.slots[g][s]];
        if (!j) { report('desktop.slots.' + g + '.' + s + ': no job "' + D.slots[g][s] + '"', 'error'); continue; }
        for (const t of j.tasks || []) if (!(D.tasks || {})[t]) report('Job "' + D.slots[g][s] + '": no task "' + t + '"', 'error');
      }
      for (const t in D.tasks || {}) { const T = D.tasks[t]; if (!T.goal || !T.path) report('Task "' + t + '" needs goal and path', 'error'); if (T.skill && !(D.skills || {})[T.skill]) report('Task "' + t + '": no skill "' + T.skill + '"', 'error'); }
    },
    answers(game) {
      const D = game.cfg.desktop || {}, out = [], slots = (D.slots || {})[game.difficulty] || {};
      for (const s in slots) { const j = D.jobs[slots[s]]; if (!j) continue; for (const t of j.tasks || []) out.push({ where: (j.customer || s) + ' · ' + t, answer: D.tasks[t].path.map(p => p.split('|')[0]).join(' › ') }); }
      return out;
    },
  });

  const skillCard = (D, id) => { const s = (D.skills || {})[id] || { name: id }; return '<div class="dk-skill"><span>' + esc(s.icon || '⭐') + '</span><b>' + esc(s.name) + '</b><small>' + esc(s.card || '') + '</small></div>'; };
  /** Every skill of the chosen grade, in job order (the teacher's record sheet uses the same order). */
  function skillsFor(D, diff) {
    const out = [], sl = (D.slots || {})[diff] || {};
    for (const s in sl) {
      const j = (D.jobs || {})[sl[s]]; if (!j) continue;
      for (const t of j.tasks || []) { const k = ((D.tasks || {})[t] || {}).skill || t; if (out.indexOf(k) < 0) out.push(k); }
      if (j.skill && out.indexOf(j.skill) < 0) out.push(j.skill);
    }
    return out;
  }
  /** Skill points 0-3: 3 = done alone, 2 = done alone with several mistakes or a wrong check answer, 1 = needed the
      ghost-hand rescue, 0 = not done yet. */
  function skillPoints(game, k) {
    const d = game.state.desk, s = d.stats[k];
    if (d.cards.indexOf(k) < 0) return 0;
    if (!s) return 3;
    if (s.rescued) return 1;
    if (s.misses > 3 || s.quizWrong > 0) return 2;
    return 3;
  }
  /** The record card the teacher copies into the record sheet: name, grade, points, every skill 0-3. */
  function recordHtml(game, D, W) {
    const list = skillsFor(D, game.difficulty), pts = list.map(k => skillPoints(game, k)), sum = pts.reduce((a, b) => a + b, 0);
    const total = game.result ? game.result.total : game.scoring.total, v = game.state.vars;
    const grade = String(game.difficulty || '').replace(/\D/g, '');
    return '<div class="dk-record"><b>' + esc(W.record || '📋 Record for your teacher') + '</b>' +
      '<div class="dk-recline"><span>👤 ' + esc(v.playerName || '') + '</span><span>🎓 ' + esc(v.section || ((W.gradeLbl || 'Grade') + ' ' + grade)) + '</span><span>⭐ ' + esc(W.pointsLbl || 'Points') + ': <b>' + total + '</b> / 100</span></div>' +
      '<table class="dk-rectab">' + list.map((k, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(((D.skills || {})[k] || { name: k }).name) + '</td><td>' + '★★★'.slice(0, pts[i]) + '<span class="dk-dim">' + '★★★'.slice(pts[i]) + '</span></td><td><b>' + pts[i] + '</b></td></tr>').join('') + '</table>' +
      '<div class="dk-recline"><span>' + esc(W.skillPts || 'Skill points') + ': <b>' + sum + '</b> / ' + (list.length * 3) + '</span></div></div>';
  }
  function reportHtml(game, D, W) {
    const strong = [], weak = [];   // done skills: 2-3 skill points = I can do, 1 = review
    for (const id of skillsFor(D, game.difficulty)) { const p = skillPoints(game, id), name = ((D.skills || {})[id] || { name: id }).name; if (p >= 2) strong.push(name); else if (p === 1) weak.push(name); }
    return '<b>' + esc(W.report) + '</b><table class="dk-rep"><tr><td>' + esc(W.strong) + ':</td><td>' + (strong.map(esc).join(', ') || '–') + '</td></tr><tr><td>' + esc(W.review) + ':</td><td>' + (weak.map(esc).join(', ') || esc(W.noReview || 'Nothing! Great work.')) + '</td></tr></table>';
  }

  /** The printable report (Grade 10-12 health check): every job's problem found + fix, the skills, the name and date. */
  function printReport(game, D, W) {
    const R = game.state.desk.report || [], v = game.state.vars, st = game.state.desk.stats;
    const rows = R.map((r, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(r.who) + '</td><td>' + esc(r.found) + '</td><td>' + esc(r.fix) + '</td><td>' + (r.rescues ? 'with help' : 'alone') + '</td></tr>').join('');
    const skills = Object.keys(st).map(k => ((D.skills || {})[k] || { name: k }).name);
    const html = '<html><head><meta charset="utf-8"><title>' + esc(D.reportTitle || 'Report') + '</title><style>body{font:14px Segoe UI,sans-serif;margin:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;text-align:left}h1{margin:0}</style></head><body>' +
      '<h1>' + esc(D.reportTitle || 'Report') + '</h1><p><b>Name:</b> ' + esc(v.playerName || '') + ' &nbsp; <b>Grade:</b> ' + esc(String(game.difficulty || '').replace('g', '')) + ' &nbsp; <b>Date:</b> ' + new Date().toLocaleDateString() + '</p>' +
      '<table><tr><th>#</th><th>Computer / user</th><th>Problem found</th><th>Fix</th><th>Done</th></tr>' + rows + '</table>' +
      '<p><b>Skills used:</b> ' + skills.map(esc).join(', ') + '</p>' + recordHtml(game, D, W) + reportHtml(game, D, W) + '<p>Score: ' + (game.result ? game.result.total : game.scoring.total) + ' / 100</p></body></html>';
    try {
      const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0'; document.body.appendChild(f);
      f.contentDocument.write(html); f.contentDocument.close(); f.contentWindow.print(); setTimeout(() => f.remove(), 3000);
    } catch (e) { /* printing not available */ }
    return html;
  }
  /** Run one job on the pretend PC (full-screen overlay). */
  function runJob(game, D, W, G, slot, jid, job, finish) {
    const root = game.ui.layer, ov = U.el('div', 'dk-overlay');
    root.appendChild(ov);
    game.enterModal();
    const tasks = (job.tasks || []).map(id => Object.assign({ id }, D.tasks[id]));
    const rec = { rescues: 0, quizWrong: 0 };
    const timers = [];
    let S = freshState(), mode = null, task = null, taskIdx = -1, misses = 0, ladder = 0, rescued = 0, idleT = null, busy = false, closed = false, ghostOn = false;
    const sim = { later(ms, fn) { const t = setTimeout(() => { if (closed) return; fn(); draw(); check(); }, game.fast ? 30 : ms); timers.push(t); } };
    const clearTimers = () => { while (timers.length) clearTimeout(timers.pop()); };
    ov.innerHTML = '<div class="dk-coach"><div class="dk-av"></div><div class="dk-say"></div><div class="dk-steps"></div><button class="dk-cbtn dk-read" title="Read aloud">' + W.readAloud + '</button><button class="dk-cbtn dk-show" style="display:none">' + W.showMe + '</button><button class="dk-cbtn dk-leave">' + W.leave + '</button></div>' +
      '<div class="dk-stage"><div class="dk-cards" style="display:none"></div><div class="dk-pc" style="display:none"><div class="dk-monitor"><div class="dk-screen"></div></div><div class="dk-hw" style="display:none"><span style="color:#adb5bd;align-self:center">🖥️ ' + esc(W.tower) + ':</span>' + B('hw-plug', W.plug, W.plug) + B('hw-hold', W.hold, W.hold) + '</div></div></div>';
    const $ = s => ov.querySelector(s), screen = $('.dk-screen'), stage = $('.dk-stage'), pcEl = $('.dk-pc'), cardEl = $('.dk-cards');
    $('.dk-av').textContent = job.avatar || '🙂';
    const say = (main, sub) => { $('.dk-say').innerHTML = esc(main) + (sub ? '<small>' + esc(sub) + '</small>' : ''); };
    const steps = list => { $('.dk-steps').innerHTML = list.map(s => '<span class="' + s[1] + '">' + esc(s[0]) + '</span>').join(''); };
    $('.dk-leave').onclick = () => close(false);
    $('.dk-read').onclick = () => { try { const u = new SpeechSynthesisUtterance($('.dk-say').textContent); u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* no voice on this PC */ } };
    $('.dk-show').onclick = () => { if (mode === 'alone' && !ghostOn) { rec.rescues++; rescued++; statFor(task).rescued++; ghostRun(() => { reset(); setMode('alone'); }); } };
    const bubble = (text, cls) => {
      let b = ov.querySelector('.dk-bubble');
      if (!b) { b = U.el('div', 'dk-bubble'); screen.parentNode.appendChild(b); }
      b.className = 'dk-bubble ' + (cls || ''); b.textContent = text; b.style.display = text ? '' : 'none';
      clearTimeout(b.t); if (text) b.t = setTimeout(() => { b.style.display = 'none'; }, 4200);
    };
    const statFor = t => { const s = game.state.desk.stats; const k = t.skill || t.id; return (s[k] = s[k] || { misses: 0, rescued: 0, quizWrong: 0 }); };
    // ---------- the screen ----------
    const draw = () => {
      if (closed || !task) return;
      const hadFocus = document.activeElement && document.activeElement.classList.contains('dk-cmdin');
      screen.innerHTML = drawDesktop(S, task);
      const pre = screen.querySelector('.dk-cmd pre'); if (pre) pre.scrollTop = pre.scrollHeight;
      if (hadFocus || (task && mode !== 'watch' && screen.querySelector('.dk-cmdin') && nextTarget() && nextTarget().indexOf('cmd:') === 0)) { const i = screen.querySelector('.dk-cmdin'); if (i) i.focus(); }
      $('.dk-hw').style.display = task.hardware ? '' : 'none';
      glow();
    };
    const tokens = () => (task ? task.path.reduce((a, p) => a.concat(p.split('|')), []) : []);
    const sel = id => (id.indexOf('cmd:') === 0 ? 'cmd-input' : id.replace(/:right$/, ''));
    const norm = t => String(t || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const visible = id => { const el = ov.querySelector('[data-id="' + sel(id) + '"]'); if (!el) return null; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 ? el : null; };
    /** The next click: the deepest step of the path that is on screen now. */
    // reach = the furthest step clicked so far; the next click is the deepest step up to reach + 1 that is on screen
    // (so a button that is always there, like the taskbar, is not offered before its turn)
    let reach = -1;
    const stepOf = id => { if (!task) return -1; for (let i = Math.max(0, reach); i < task.path.length; i++) if (task.path[i].split('|').indexOf(id) >= 0) return i; return task.path.findIndex(p => p.split('|').indexOf(id) >= 0); };
    const advance = id => { const i = stepOf(id); if (i > reach) reach = i; };
    const nextTarget = () => {
      if (!task) return null;
      for (let i = Math.min(task.path.length - 1, reach + 1); i >= 0; i--) for (const id of task.path[i].split('|')) if (visible(id)) return id;
      return null;
    };
    const glow = () => {
      ov.querySelectorAll('.dk-glow').forEach(e => e.classList.remove('dk-glow'));
      if (ghostOn || !(mode === 'try' || (mode === 'alone' && ladder >= 2))) return;
      const t = nextTarget(); const el = t && visible(t);
      if (el) el.classList.add('dk-glow');
    };
    const goalMet = () => { try { return !!task.goal(S); } catch (e) { return false; } };
    const reset = () => { clearTimers(); S = freshState(); if (task.setup) task.setup(S); misses = 0; ladder = 0; reach = -1; draw(); };
    const kickIdle = () => {
      clearTimeout(idleT);
      if (mode !== 'alone') return;
      idleT = setTimeout(() => { if (closed || mode !== 'alone' || ghostOn) return; misses++; climb(); kickIdle(); }, 14000);
    };
    const climb = quiet => {   // quiet: a trap message is showing, keep it on screen
      const L = G.ladder;
      if (ladder < 1 && misses >= L[0]) { ladder = 1; if (!quiet) bubble('💡 ' + (task.hint || ''), ''); }
      if (ladder < 2 && misses >= L[1]) { ladder = 2; if (!quiet) bubble('💡 ' + (task.hint || ''), ''); glow(); }
      if (ladder < 3 && misses >= L[2] && rescued < 1) {
        ladder = 3; rescued++; rec.rescues++; statFor(task).rescued++;
        bubble(W.rescue, '');
        ghostRun(() => { reset(); setMode('alone'); });
      } else if (misses >= L[2]) { ladder = 2; glow(); }
    };
    const handle = (id, ev) => {
      if (busy || ghostOn || closed) return;
      if (mode !== 'try' && mode !== 'alone') return;
      const target = nextTarget(), onPath = tokens().indexOf(id) >= 0 || (task.also || []).indexOf(id) >= 0, traps = task.traps || {};
      if (mode === 'try' && id !== target) {
        if (target && target.indexOf('cmd:') === 0) { bubble('⌨️ Type: ' + target.slice(4), ''); return; }
        const trapText = traps[id] || traps[(act(clone(S), id, { later() {} }).find(e => traps[e]))];
        bubble(trapText ? '⚠️ ' + trapText : W.glowing, trapText ? 'bad' : '');
        if (ev) ev.preventDefault();
        return;
      }
      // try it on a copy first: a trap (pull the plug, end a system process…) explains why and changes nothing
      const probe = act(clone(S), id, { later() {} });
      const trap = probe.map(e => traps[e]).find(Boolean) || (probe.some(e => /^trap:/.test(e)) ? W.notThat : null);
      if (trap) { bubble('⚠️ ' + trap, 'bad'); if (mode === 'alone') { misses += 2; statFor(task).misses += 2; climb(true); } draw(); return; }
      act(S, id, sim);
      if (onPath) advance(id);
      if (mode === 'alone' && !onPath && !/^(desk-bg|w-max-|w-focus|sn-max-)/.test(id)) { misses++; statFor(task).misses++; bubble(ladder >= 1 ? '💡 ' + task.hint : '🤔 ' + W.notThat, ''); climb(); }
      draw(); kickIdle(); check();
    };
    const clone = s => JSON.parse(JSON.stringify(s));
    const runCmd = () => { const i = ov.querySelector('.dk-cmdin'); if (!i) return; const t = norm(i.value); i.value = ''; if (t) handle('cmd:' + t); const j = ov.querySelector('.dk-cmdin'); if (j) j.focus(); };
    screen.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b || b.dataset.id === 'cmd-input') return; if (b.dataset.id === 'cmd-run') return runCmd(); handle(b.dataset.id, e); });
    screen.addEventListener('keydown', e => { if (e.target.classList && e.target.classList.contains('dk-cmdin') && e.key === 'Enter') { e.preventDefault(); runCmd(); } });
    screen.addEventListener('contextmenu', e => { e.preventDefault(); const b = e.target.closest('[data-rc]'); if (b) handle(b.dataset.id + ':right', e); });
    $('.dk-hw').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) handle(b.dataset.id, e); });
    let checking = false;
    const check = () => {
      if (checking || closed || ghostOn || !task || !goalMet()) return;
      if (mode === 'try') { checking = true; bubble('✅ ' + W.again, 'good'); busy = true; setTimeout(() => { checking = false; busy = false; if (closed) return; reset(); setMode('alone'); }, game.fast ? 10 : 1300); }
      else if (mode === 'alone') {
        checking = true; busy = true; clearTimeout(idleT);
        game.state.desk.mastered[task.skill || task.id] = rescued === 0 || !!game.state.desk.mastered[task.skill || task.id];
        bubble('✅ ' + (task.why || W.done), 'good'); game.audio.play('success');
        setTimeout(() => { checking = false; busy = false; if (!closed) nextTask(); }, game.fast ? 10 : 1800);
      }
    };
    // ---------- the ghost hand ----------
    const ghostRun = then => {
      ghostOn = true; glow();
      const gh = U.el('div', 'dk-ghost', '👆'), cap = U.el('div', 'dk-cap');
      stage.appendChild(gh); stage.appendChild(cap);
      const sr = stage.getBoundingClientRect();
      gh.style.left = (sr.width / 2) + 'px'; gh.style.top = (sr.height - 40) + 'px';
      let n = 0;
      const stepT = game.fast ? 5 : 1;
      const step = () => {
        if (closed) return;
        if (goalMet() || n > 16) { setTimeout(() => { gh.remove(); cap.remove(); ghostOn = false; if (!closed) then(); }, game.fast ? 5 : 900); return; }
        const id = nextTarget();
        if (!id) { n++; setTimeout(step, 400 * stepT); return; }   // waiting for something (an update, a restart)
        const el = visible(id), r = el.getBoundingClientRect(), s2 = stage.getBoundingClientRect();
        gh.style.left = (r.left - s2.left + r.width / 2 - 8) + 'px'; gh.style.top = (r.top - s2.top + r.height / 2 - 4) + 'px';
        cap.textContent = id.indexOf('cmd:') === 0 ? '⌨️ Type: ' + id.slice(4) + '  ↵' : (id.endsWith(':right') ? '🖱️ Right-click ' : '👆 ') + (el.dataset.l || id);
        if (id.indexOf('cmd:') === 0) el.value = id.slice(4);
        setTimeout(() => {
          if (closed) return;
          gh.classList.add('tap'); el.classList.add('dk-glow');
          setTimeout(() => { gh.classList.remove('tap'); advance(id); act(S, id, sim); draw(); n++; setTimeout(step, game.fast ? 5 : 650); }, game.fast ? 5 : 260);
        }, game.fast ? 5 : 800);
      };
      step();
    };
    // ---------- modes ----------
    const STEP_LIST = () => {
      const learned = game.state.desk.mastered[task.skill || task.id];
      const list = [];
      if (!learned) { if (G.watch === 'auto') list.push(['watch', W.watch]); if (G.tryIt) list.push(['try', W.tryIt]); }
      list.push(['alone', learned ? W.useIt : W.alone]);
      return list;
    };
    const setMode = m => {
      mode = m; misses = 0; ladder = 0;
      const list = STEP_LIST(), at = list.findIndex(x => x[0] === m);
      steps(list.map((x, i) => [x[1], i < at ? 'ok' : i === at ? 'on' : '']).concat(job.quiz && job.quiz.length ? [[W.check, '']] : []));
      $('.dk-show').style.display = m === 'alone' && G.watch === 'button' && !game.state.desk.mastered[task.skill || task.id] ? '' : 'none';
      const head = (job.customer ? job.customer + ': ' : '') + (task.say || '');
      const sub = W.stepOf + ' ' + (taskIdx + 1) + '/' + tasks.length + ' · ' + (m === 'watch' ? W.watch : m === 'try' ? W.tryIt : list[at][1]);
      say(head, sub);
      draw();
      if (m === 'watch') ghostRun(() => { reset(); setMode(G.tryIt ? 'try' : 'alone'); });
      if (m === 'alone') kickIdle();
    };
    const nextTask = () => {
      taskIdx++;
      if (taskIdx >= tasks.length) { task = null; return afterTasks(); }
      task = tasks[taskIdx]; rescued = 0;
      reset();
      setMode(STEP_LIST()[0][0]);
    };
    // ---------- cards (story, learn, quiz, pick, done) ----------
    const card = html => { clearTimers(); task = null; pcEl.style.display = 'none'; cardEl.style.display = ''; cardEl.innerHTML = '<div class="dk-card2">' + html + '</div>'; return cardEl.firstChild; };
    const fill = t => String(t == null ? '' : t).replace(/\{(\w+)\}/g, (a, k) => (S.spec[k] != null ? S.spec[k] : a));
    const quizAt = i => {
      const qs = job.quiz || [];
      if (i >= qs.length) return job.pick ? pickCard() : doneCard();
      const q = qs[i];
      steps([[W.check + ' ' + (i + 1) + '/' + qs.length, 'on']]);
      say(job.customer ? job.customer + ': ' + (job.checkSay || '') : '', '');
      const c = card('<div class="dk-q">❓ ' + esc(fill(q.q)) + '</div><div class="dk-opts">' + q.options.map((o, k) => '<button class="dk-opt" data-k="' + k + '">' + esc(fill(o)) + '</button>').join('') + '</div><div class="dk-why" style="display:none"></div>');
      let solved = false;
      c.querySelectorAll('.dk-opt').forEach(b => b.onclick = () => {
        if (solved) return;
        const k = +b.dataset.k, why = c.querySelector('.dk-why'), ok = k === q.answer;
        why.style.display = ''; why.className = 'dk-why ' + (ok ? 'good' : 'bad');
        const wrongWhy = q.wrong && q.wrong[k];
        why.textContent = (ok ? '✅ ' : '❌ ') + fill(ok ? q.why : (wrongWhy || q.hint || 'Not quite. Think again!'));
        b.classList.add(ok ? 'good' : 'bad');
        if (!ok) { rec.quizWrong++; const s = statFor(tasks[0] || { id: job.skill || jid }); s.quizWrong++; game.audio.play('wrong'); return; }
        solved = true; game.audio.play('success');
        const go = U.el('button', 'dk-cbtn go', W.next); go.style.marginTop = '12px'; go.onclick = () => quizAt(i + 1); c.appendChild(go);
      });
    };
    const pickCard = () => {
      const P = job.pick, on = new Set();
      steps([[W.pick, 'on']]);
      say((job.customer ? job.customer + ': ' : '') + (P.title || ''), P.sub || '');
      const c = card('<div class="dk-q">' + esc(P.title) + '</div><div class="dk-opts">' + P.options.map((o, k) => '<button class="dk-opt" data-k="' + k + '">' + esc(o.text) + '</button>').join('') + '</div><div class="dk-why" style="display:none"></div><button class="dk-cbtn go" style="margin-top:12px">' + esc(W.check2) + '</button>');
      c.querySelectorAll('.dk-opt').forEach(b => b.onclick = () => { const k = +b.dataset.k; if (on.has(k)) on.delete(k); else on.add(k); b.classList.toggle('on', on.has(k)); b.classList.remove('bad'); });
      c.querySelector('.dk-cbtn.go').onclick = () => {
        const why = c.querySelector('.dk-why'), bad = [...on].filter(k => !P.options[k].good), good = [...on].filter(k => P.options[k].good);
        why.style.display = '';
        if (bad.length) { rec.quizWrong++; bad.forEach(k => c.querySelector('[data-k="' + k + '"]').classList.add('bad')); why.className = 'dk-why bad'; why.textContent = '❌ ' + P.options[bad[0]].why; game.audio.play('wrong'); return; }
        if (good.length < (P.need || 1)) { why.className = 'dk-why'; why.textContent = '➕ ' + (P.more || 'Pick more good habits.') + ' (' + good.length + '/' + (P.need || 1) + ')'; return; }
        game.state.desk.checklist = good.map(k => P.options[k].text);
        game.audio.play('success');
        why.className = 'dk-why good'; why.innerHTML = '✅ ' + esc(P.done || '') + '<br><b>' + good.map(k => '☑ ' + esc(P.options[k].text)).join('<br>') + '</b>';
        const pr = U.el('button', 'dk-cbtn blue', W.print); pr.style.margin = '12px 6px 0'; pr.onclick = () => printList(P.title, game.state.desk.checklist, game.state.vars.playerName);
        const go = U.el('button', 'dk-cbtn go', W.next); go.style.marginTop = '12px'; go.onclick = doneCard;
        c.querySelector('.dk-cbtn.go').remove(); c.appendChild(pr); c.appendChild(go);
      };
    };
    const learnCard = then => {
      const L = job.learn;
      steps([[W.learn, 'on']]);
      say((job.customer ? job.customer + ': ' : '') + (L.say || ''), '');
      const c = card('<h2>📖 ' + esc(L.title) + '</h2><div class="dk-learn">' + L.cards.map(x => '<div><span>' + esc(x.icon) + '</span><b>' + esc(x.title) + '</b>' + esc(x.text) + '</div>').join('') + '</div><button class="dk-cbtn go">' + esc(W.next) + '</button>');
      c.querySelector('.dk-cbtn.go').onclick = then;
    };
    const afterTasks = () => { if (job.quiz && job.quiz.length) quizAt(0); else if (job.pick) pickCard(); else doneCard(); };
    const doneCard = () => {
      const pts0 = job.points == null ? 12 : job.points, pts = Math.max(Math.ceil(pts0 / 2), pts0 - rec.rescues * 2 - rec.quizWrong);
      const coins = (job.coins == null ? 50 : job.coins) + (rec.rescues === 0 ? 10 : 0);
      const newCards = [];
      for (const t of tasks) { const k = t.skill || t.id; if (game.state.desk.cards.indexOf(k) < 0 && D.skills && D.skills[k]) { game.state.desk.cards.push(k); newCards.push(k); } }
      if (job.skill && game.state.desk.cards.indexOf(job.skill) < 0) { game.state.desk.cards.push(job.skill); newCards.push(job.skill); if (!game.state.desk.stats[job.skill]) game.state.desk.stats[job.skill] = { misses: 0, rescued: 0, quizWrong: rec.quizWrong }; }
      steps([[W.done, 'ok']]);
      say((job.customer ? job.customer + ': ' : '') + (job.thanks || 'Thank you!'), '');
      const c = card('<h2>' + esc(W.done) + '</h2>' + (newCards.length ? '<div>🎉 ' + esc(W.newCard) + '</div>' + newCards.map(k => skillCard(D, k)).join('') : '') +
        '<p style="font-size:20px">🪙 +' + coins + ' ' + esc(W.coins) + ' &nbsp; ⭐ +' + pts + ' ' + esc(W.points) + '</p><button class="dk-cbtn go">' + esc(W.backToTown) + '</button>');
      c.querySelector('.dk-cbtn.go').onclick = () => {
        game.state.desk.jobs[jid] = { score: pts, rescues: rec.rescues, quizWrong: rec.quizWrong };
        if (game.addCoins && D.coinsVar === 'arsenal') game.addCoins(coins);
        else { const cv = D.coinsVar || 'coins'; game.state.vars[cv] = (Number(game.state.vars[cv]) || 0) + coins; if (game.ui.setCoins) game.ui.setCoins(game.state.vars[cv]); }
        if (job.report) (game.state.desk.report = game.state.desk.report || []).push({ who: job.customer || jid, found: job.report.found, fix: job.report.fix, rescues: rec.rescues });
        if (pts) game.scoring.add(pts, job.customer || jid, 'job');
        game.state.flags['desk_' + slot] = true;
        game.emit('desk:job', { id: jid, slot });
        if (job.onDone) GK.run(game, job.onDone, {});
        close(true);
        if (game.missions) game.missions.check();
      };
    };
    function printList(title, items, name) {
      try {
        const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0'; document.body.appendChild(f);
        f.contentDocument.write('<h1>' + esc(title) + '</h1><p>' + esc(name || '') + '</p><ul style="font-size:20px;line-height:2">' + items.map(t => '<li>☐ ' + esc(t) + '</li>').join('') + '</ul>');
        f.contentDocument.close(); f.contentWindow.print(); setTimeout(() => f.remove(), 2000);
      } catch (e) { /* printing not available */ }
    }
    function close(ok) {
      if (closed) return;
      closed = true; clearTimers(); clearTimeout(idleT);
      try { speechSynthesis.cancel(); } catch (e) { /* none */ }
      ov.remove(); game.exitModal(); finish(ok);
    }
    // ---------- start: the story card ----------
    const begin = () => { cardEl.style.display = 'none'; pcEl.style.display = ''; nextTask(); };
    say((job.customer ? job.customer + ': ' : '') + (job.story || ''), '');
    steps([['🚐 ' + (job.customer || ''), 'on']]);
    const startBtn = (job.learn ? '📖 ' : '🔧 ') + (job.startLabel || 'Let\'s fix it!');
    const c0 = card('<div style="font-size:64px">' + esc(job.avatar || '🙂') + '</div><h2>' + esc(job.customer || '') + '</h2><p style="font-size:20px">' + esc(job.story || '') + '</p><button class="dk-cbtn go" style="font-size:20px">' + esc(startBtn) + '</button>');
    c0.querySelector('.dk-cbtn.go').onclick = () => {
      if (job.learn) learnCard(() => (tasks.length ? begin() : afterTasks()));
      else if (tasks.length) begin();
      else afterTasks();
    };
    // test hook
    game.deskJob = { get S() { return S; }, get mode() { return mode; }, get task() { return task && task.id; }, click: id => handle(id), next: nextTarget, close: () => close(false), overlay: ov, get ghost() { return ghostOn; } };
  }
})();

<script>/* mechanics/gradebook/gradebook.js */
/* Game Kit · mechanics/gradebook — sends each student's result to the teacher's Google Sheet for this game
   (an Apps Script web app: mechanics/gradebook/gradebook.gs + SETUP.md), the same way Bayside and Haunted House do.
   Config gradebook: {url, key, game, title, sections: {difficultyId: 'Grade 6 Kepler' | ['Grade 9 Curie', 'Grade 9 Newton']},
     words: {classTitle, classNeed}}.
   - Title screen: when the chosen grade has more than one class, a class picker appears and is required before Play.
   - A result = {game, session, grade, section, english name, points, status, jobs done, skill points, every skill 0-3,
     minutes}; it is sent after every finished job (desk:job), at the win, and with sendBeacon when the page closes.
   - The newest result of each session waits in localStorage ('gk.gradebook.outbox') until it is delivered, so a Wi-Fi
     drop-out loses nothing and the next game on that PC sends it. No url = nothing is sent (offline copies still work).
   Needs desktop-sim for the skill points (game.desk.skills()). ?nocloud=1 turns sending off (tests). */
(function () {
  'use strict';
  const U = GK.util, OUTBOX = 'gk.gradebook.outbox';
  const read = () => { try { return JSON.parse(localStorage.getItem(OUTBOX) || '{}'); } catch (e) { return {}; } };
  const write = o => { try { localStorage.setItem(OUTBOX, JSON.stringify(o)); } catch (e) { /* storage off */ } };
  const off = () => /[?&]nocloud=1/.test(location.search);
  let chosen = null, busy = false;

  function flush(cfg) {
    if (!cfg.url || off() || busy || !window.fetch) return;
    busy = true;
    const box = read(), ids = Object.keys(box);
    let p = Promise.resolve();
    ids.forEach(id => {
      const item = box[id];
      p = p.then(() => fetch(cfg.url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(item) })
        .then(() => { const cur = read(); if (cur[id] && cur[id].sent === item.sent) { delete cur[id]; write(cur); } }));
    });
    p.catch(() => { /* offline: try again later */ }).then(() => { busy = false; });
  }

  GK.Mechanics.add('gradebook', {
    configKeys: ['gradebook'],
    setup(game) {
      const cfg = game.cfg.gradebook || {}, W = Object.assign({ classTitle: 'Your class', classNeed: 'Pick your class first.' }, cfg.words);
      const sectionsOf = d => U.list((cfg.sections || {})[d]);
      // ---- the class picker on the title screen (only when a grade has more than one class) ----
      game.on('ui:title', ({ screen }) => {
        if (!screen || screen.querySelector('.gk-class')) return;
        const box = U.el('div', 'gk-class');
        box.style.cssText = 'margin:8px 0;text-align:center';
        const anchor = screen.querySelector('[data-diff]') && screen.querySelector('[data-diff]').parentNode;
        if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(box, anchor.nextSibling); else screen.appendChild(box);
        const draw = () => {
          const list = sectionsOf(game.difficulty);
          if (list.length < 2) { box.innerHTML = ''; return; }
          if (list.indexOf(chosen) < 0) chosen = null;
          box.innerHTML = '<div class="gk-label" style="font-weight:700;margin-bottom:4px">' + U.esc(W.classTitle) + '</div>' +
            list.map(s => '<button class="gk-btn' + (s === chosen ? ' primary' : '') + '" data-class="' + U.esc(s) + '" style="margin:0 4px">' + U.esc(s) + '</button>').join('') +
            '<div class="gk-class-msg" style="display:none;color:#ff8787;font-weight:700;margin-top:4px">⚠️ ' + U.esc(W.classNeed) + '</div>';
          box.querySelectorAll('[data-class]').forEach(b => { b.onclick = () => { chosen = b.getAttribute('data-class'); draw(); }; });
        };
        draw();
        screen.addEventListener('click', e => {
          const t = e.target.closest && e.target.closest('[data-diff], [data-level]');
          if (!t) return;
          if (t.hasAttribute('data-diff')) { setTimeout(draw, 0); return; }
          if (sectionsOf(game.difficulty).length > 1 && !chosen) {   // Play without a class: stop it here
            e.stopPropagation(); e.preventDefault();
            draw(); const m = box.querySelector('.gk-class-msg'); if (m) m.style.display = '';
          }
        }, true);
      });
      // ---- sending ----
      const send = status => {
        const v = game.state.vars, list = game.desk && game.desk.skills ? game.desk.skills() : [];
        const sum = list.reduce((a, s) => a + s.points, 0), max = list.length * 3;
        const sl = (game.cfg.desktop && game.cfg.desktop.slots && game.cfg.desktop.slots[game.difficulty]) || {};
        const slots = Object.keys(sl), done = slots.filter(s => game.state.flags['desk_' + s]).length;
        const item = {
          key: cfg.key, game: cfg.game, title: cfg.title || game.cfg.title, session: v.gbSession, sent: Date.now(),
          grade: String(game.difficulty || '').replace(/\D/g, ''), section: v.section || '', english: v.playerName || '',
          points: Math.round(game.result ? game.result.total : game.scoring.total), status,
          jobsDone: done, jobsTotal: slots.length, skillPoints: sum, skillMax: max, skillPct: max ? Math.round(sum / max * 100) : 0,
          skills: list.map(s => ({ name: s.name, points: s.points })), minutes: Math.round(game.state.time / 6) / 10, startedAt: v.gbStarted || '',
        };
        if (!item.session || !item.english) return;
        const box = read(); box[item.session] = item; write(box);
        flush(cfg);
      };
      game.gradebook = { send, flush: () => flush(cfg), pending: () => Object.keys(read()).length };
      game.on('desk:job', () => send('Provisional'));
      game.on('game:win', () => send('Complete'));
      window.addEventListener('pagehide', () => {
        if (!cfg.url || off() || !navigator.sendBeacon) return;
        for (const it of Object.values(read())) navigator.sendBeacon(cfg.url, new Blob([JSON.stringify(it)], { type: 'text/plain;charset=utf-8' }));
      });
    },
    start(game) {
      const v = game.state.vars, cfg = game.cfg.gradebook || {};
      const list = U.list((cfg.sections || {})[game.difficulty]);
      if (!v.gbSession) { v.gbSession = (cfg.game || 'game') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); v.gbStarted = new Date().toISOString(); }
      if (!v.section) v.section = list.length > 1 ? (chosen || list[0]) : (list[0] || '');
      flush(cfg);   // anything left over from an earlier game on this PC
    },
  });
})();

</script>
<script>/* mechanics/hazards/hazards.js */
/* Game Kit · mechanics/hazards   (spatial game types only)
   Enemies and traps: things that hurt on touch (viruses, bugs, drones, lasers…), pulsing floor traps (spark
   pads), enemies that chase you, turrets that shoot, and bosses. Use with config.player.health + respawnOnDeath.
     { id, type: 'hazard', model: 'virus', route: 'worldRoute' | path: [[x,z], 'location', …],
       speed: 2, wait: 0.3, damage: 25, onHit: [actions], label, points: 50,
       hp: 3,                                         // can be shot (mechanics/weapons): hits needed to defeat it
       squash: true, respawn: 20,                     // with a shield power-up, touching it defeats it; comes back
       chase: 8, chaseSpeed: 3,                       // runs at you when you are this close and it can see you
       shoots: { every: 2, range: 16, speed: 10, damage: 10, color },   // fires bolts at you (turrets, bosses)
       pulse: [on, off], phase: 0,                    // a trap that is dangerous for `on` s, then safe for `off` s
       boss: true, engage: 30, armor: condition,      // boss bar at the top; immune while `armor` is true
       summon: { every: 8, ids: ['m1', 'm2'], max: 3 },  // a boss brings hidden `minion: true` hazards back to life
       rage: { below: 0.5, speed: 1.5 },              // faster (and shoots faster) under half health
       onDefeat: [actions], contactEvery: 1, knockback: 5 }
   Touching one costs `damage` health (again every `contactEvery` s while touching), knocks you back, flashes the
   screen, runs onHit and emits hazard:hit {id}. Defeating one (shot or squashed) gives `points` and emits
   hazard:defeated {id} and "defeated:<tag>" for each tag (squashing also emits hazard:squashed / "squashed:<tag>").
   Objective {type: 'defeat', tag, count} counts defeats and points at the nearest enemy with that tag.
   With the powerups mechanic: a shield blocks damage (and squashes `squash` hazards); freeze stops every hazard.
   Adds game.hurtPlayer(amount, sourceEntity), game.hitHazard(entity, damage), game.defeatHazard(entity) and the
   condition {hp: {id, lte}}.
   Disable or remove one ({do:'disable'} / {do:'remove'}) to make it safe.
   Difficulty (config.difficulty, the chosen choice's options):
     enemies: 0.5     keep this share of the ordinary enemies (shootable, harmful, not bosses / minions / crates) in
                      each scene: every other one starts removed (hidden waves too). A tag that a 'defeat' objective
                      counts keeps at least that share of its enemies (rounded up), and the objective needs that share.
     bossDamage: 3    shots do this many times their damage to bosses (phase thresholds keep working)
     summons: 0.5     bosses keep at most this share of their minions alive (at least 1)
   Without these options (or with the value 1) nothing changes. */
(function () {
  'use strict';
  const P = GK.Prefabs, V = GK.vec, Ph = GK.Physics, U = GK.util, FROZEN = '#9fd8ff';

  /** Everything that blocks enemies and their line of sight this frame (walls, closed doors, solid props). */
  function solidsOf(g) {
    if (!g.hzSolids || g.hzSolidsAt !== g.state.time) { g.hzSolids = g.world.solids(); g.hzSolidsAt = g.state.time; }
    return g.hzSolids;
  }
  function clearLine(g, a, b) {
    const d = V.sub(b, a), dist = V.len(d);
    if (dist < 0.01) return true;
    const dir = V.scale(d, 1 / dist);
    for (const s of solidsOf(g)) { const t = Ph.rayBox(a, dir, s); if (t > 0 && t < dist - 0.25) return false; }
    return true;
  }
  /** Walk an enemy toward (x, z) with wall collision. Returns the distance left. */
  function walk(ent, g, x, z, speed, dt) {
    const b = ent.body;
    b.pos = ent.pos;
    const dx = x - ent.pos[0], dz = z - ent.pos[2], l = Math.hypot(dx, dz);
    if (l < 0.05) return l;
    const v = Math.min(speed, l / Math.max(dt, 1e-4));
    b.vel[0] = dx / l * v; b.vel[1] = 0; b.vel[2] = dz / l * v;
    const y = ent.pos[1];
    Ph.move(solidsOf(g), b, dt);
    ent.pos[1] = y;   // enemies keep their height (they float or crawl at one level)
    if (ent.def.faceTravel) ent.yaw = Math.atan2(dx, dz);
    return Math.hypot(x - ent.pos[0], z - ent.pos[2]);
  }
  /** Where an enemy looks and shoots from: near the top of its model (low centres clip low scenery). */
  function eyeOf(ent) { const b = ent.box(true); return [(b.min[0] + b.max[0]) / 2, Math.max(b.min[1] + 0.3, b.max[1] - 0.35), (b.min[2] + b.max[2]) / 2]; }
  function defeat(ent, g, how) {
    const d = ent.def;
    if (ent.state.dead || ent.removed) return;
    if (d.points) g.scoring.add(d.points, (ent.name || 'enemy') + (how === 'squash' ? ' squashed' : ' defeated'), 'bonus');
    g.audio.play(how === 'squash' ? 'success' : 'boom');
    if (g.burst) g.burst(ent.center(), d.burst || (ent.look && ent.look.color) || '#ff4d6d', d.boss ? 30 : 10);
    if (how === 'squash') { g.ui.flash('#ffffff'); g.ui.toast('SQUASHED! +' + d.points, 'good'); }
    if (d.boss) { g.ui.setBoss(null); g.ui.toast('💥 ' + (ent.name || 'Boss') + ' DEFEATED! +' + d.points, 'good'); if (g.shake) g.shake(0.8, 0.25); }
    g.emit('hazard:defeated', { id: ent.id });
    for (const t of ent.tags) g.emit('defeated:' + t, {});
    if (how === 'squash') {
      g.emit('hazard:squashed', { id: ent.id });
      for (const t of ent.tags) g.emit('squashed:' + t, {});
    }
    ent.state.dead = true;
    ent.chasing = false;
    if (d.respawn) { ent.hide(); g.later(d.respawn, () => revive(ent)); }
    else if (d.minion) ent.hide();
    else ent.remove();
    if (d.onDefeat) GK.run(g, d.onDefeat, { entity: ent });
    if (g.missions) g.missions.check();
  }
  /** Which ordinary enemies a difficulty leaves out, worked out once from the whole config (every scene), so a
      scene, a restore and a resume always agree: {drop: {id: true}, ratio: {tag: kept / total}}. */
  function thinPlan(game) {
    const share = Number(game.difficultyOpts ? game.difficultyOpts().enemies : 1);
    const key = game.difficulty + ':' + share;
    if (game.hzPlan && game.hzPlan.key === key) return game.hzPlan;
    const plan = { key, drop: {}, ratio: {} };
    game.hzPlan = plan;
    if (!(share > 0 && share < 1)) return plan;
    const base = game.base, tpls = base.templates || {}, defs = P.get('hazard').defaults;
    const stages = base.scenes || base.levels || [];
    const lists = [base.entities].concat(stages.map(s => s.entities));
    const counted = {};   // tags that 'defeat' objectives count (other than the catch-all 'enemy')
    for (const o of U.list(base.objectives).concat(...stages.map(s => U.list(s.objectives)))) if (o && o.type === 'defeat' && o.tag !== 'enemy') counted[o.tag] = true;
    const all = [], byTag = {};
    for (const list of lists) {
      let i = 0;
      for (const raw of U.list(list)) {
        if (!raw || typeof raw !== 'object') continue;
        const e = Object.assign({}, defs, raw.use ? tpls[raw.use] : null, raw);
        if (e.type !== 'hazard' || !(e.hp > 0) || e.boss || e.minion || e.solid || !(e.damage > 0 || e.shoots)) continue;
        // keep ceil(n · share) in each scene, spread out: the 1st, 3rd, 5th… for a half
        const m = { id: e.id, tags: U.list(e.tags), keep: !e.id || Math.ceil((i + 1) * share) > Math.ceil(i * share) };
        i++;
        all.push(m);
        for (const t of m.tags) (byTag[t] = byTag[t] || []).push(m);
      }
    }
    // a counted group never drops below its share, so its objective stays possible
    for (const t in counted) {
      const ms = byTag[t] || [], want = Math.ceil(ms.length * share);
      let kept = ms.filter(m => m.keep).length;
      for (const m of ms) { if (kept >= want) break; if (!m.keep) { m.keep = true; kept++; } }
    }
    for (const m of all) if (!m.keep) plan.drop[m.id] = true;
    for (const t in byTag) plan.ratio[t] = byTag[t].filter(m => m.keep).length / byTag[t].length;
    return plan;
  }
  function revive(ent, at) {
    if (ent.removed) return;
    ent.state.dead = false;
    ent.state.hp = ent.def.hp || 0;
    ent.chasing = false; ent.returning = false; ent.touching = false;
    if (at) ent.pos = at.slice(); else if (ent.def.chase && !ent.path.length) ent.pos = ent.home.slice();
    ent.show();
  }
  function contact(ent, g) {
    const d = ent.def;
    if (!ent.enabled || !ent.active || ent.state.off || ent.state.dead || g.state.mode !== 'playing') return;
    if (!d.damage && !d.squash) return;   // harmless (practice targets)
    ent.contactT = d.contactEvery || 1;
    if (g.shielded && g.shielded()) {
      if (d.squash) defeat(ent, g, 'squash'); else g.audio.play('blocked');
      return;
    }
    if (g.hurtPlayer(d.damage, ent)) {
      g.emit('hazard:hit', { id: ent.id });
      if (d.onHit) GK.run(g, d.onHit, { entity: ent });
    }
  }

  /** gait: how a creature moves (drawn only, nothing changes in the game): 'waddle' (rocks side to side: crabs),
      'trot' (bounces and nods: boars), 'hop' (jumps along), 'flap' (flutters up and down: bats), 'slither' (sways:
      snakes), 'stomp' (heavy steps: big bosses). Shooters lean back before they throw and forward as they throw;
      a hit knocks them back a little. */
  function gait(ent, dt, moved) {
    const g = ent.def.gait, t = ent.t || 0;
    ent.gaitK = U.lerp(ent.gaitK || 0, moved > 0.001 ? 1 : 0, Math.min(1, dt * 8));
    ent.gaitPh = (ent.gaitPh || 0) + moved * (g === 'hop' ? 3.2 : g === 'stomp' ? 2.4 : 6.5);
    const k = ent.gaitK, ph = ent.gaitPh;
    let lift = 0, roll = 0, pitch = 0;
    if (g === 'waddle') { roll = Math.sin(ph) * 0.2 * k; lift = Math.abs(Math.sin(ph)) * 0.05 * k; }
    else if (g === 'trot') { pitch = Math.sin(ph * 2) * 0.09 * k; lift = Math.abs(Math.sin(ph)) * 0.1 * k; }
    else if (g === 'hop') lift = Math.abs(Math.sin(ph)) * 0.35 * k;
    else if (g === 'flap') { lift = Math.sin(t * 11) * 0.1; roll = Math.sin(t * 5.5) * 0.18; }
    else if (g === 'slither') { roll = Math.sin(t * 7) * 0.12 * (0.4 + k); lift = 0; }
    else if (g === 'stomp') { roll = Math.sin(ph) * 0.07 * k; lift = Math.abs(Math.sin(ph)) * 0.16 * k; }
    // throwing: lean back while about to shoot, snap forward when the shot leaves
    if (ent.def.shoots && ent.sees && ent.shootT < 0.45) pitch -= (0.45 - Math.max(0, ent.shootT)) / 0.45 * 0.35;
    if (ent.throwT > 0) { ent.throwT -= dt; pitch += ent.throwT / 0.3 * 0.4; }
    if (ent.hurtT > 0) { ent.hurtT -= dt; pitch -= ent.hurtT / 0.25 * 0.3; lift += ent.hurtT * 0.3; }
    ent.lift = lift; ent.roll = roll; ent.pitch = pitch;
  }

  P.add('hazard', {
    defaults: { model: 'virus', solid: false, speed: 2, wait: 0.3, damage: 25, bob: 0.12, faceTravel: true, points: 50, hp: 0, contactEvery: 1, knockback: 5 },
    init(ent, game) {
      const d = ent.def, w = ent.world;
      ent.path = d.route ? (w.routes[d.route] || []).map(p => p.slice())
        : (d.path || []).map(p => w.toPos(Array.isArray(p) ? { pos: p } : typeof p === 'string' ? { at: p } : p));
      if (d.route && !w.routes[d.route]) w.problem('Hazard "' + ent.id + '": unknown route "' + d.route + '". This world has: ' + Object.keys(w.routes).join(', '));
      if (d.summon) for (const id of d.summon.ids || []) if (!w.byId[id] && !(game.cfg.entities || []).some(e => e.id === id)) w.problem('Hazard "' + ent.id + '": summons unknown "' + id + '"');
      if (ent.path.length && !d.pos && !d.cell && !d.at) ent.pos = ent.path[0].slice();
      if (ent.state.pathI == null) ent.state.pathI = 0;
      if (ent.state.hp == null) ent.state.hp = d.hp || 0;
      ent.home = ent.pos.slice();
      ent.body = { pos: ent.pos, vel: [0, 0, 0], r: d.bodyRadius || 0.4, h: 0.8, step: 0.45, grounded: true };
      ent.waitT = 0; ent.contactT = 0; ent.aiT = Math.random() * 0.2; ent.lostT = 0;
      ent.shootT = d.shoots ? (d.shoots.every || 2) * (0.5 + Math.random() * 0.5) : 0;
      ent.summonT = d.summon ? (d.summon.first != null ? d.summon.first : d.summon.every || 8) : 0;
      if (d.pulse) { ent.state.off = false; ent.pulseT = d.pulse[0] - (d.phase || 0); }
      ent.onTouch = g => contact(ent, g);
      if (thinPlan(game).drop[ent.id]) ent.removed = true;   // an easier difficulty: fewer enemies
      if (d.solid) {   // a solid hazard (a loot crate, a barrier): it blocks the player, but shots treat it as a target
        const base = GK.Entity.prototype.collider;
        ent.collider = function () { const b = base.call(this); b.hazard = true; return b; };
      }
    },
    restore(ent) { ent.home = ent.home || ent.pos.slice(); ent.chasing = false; ent.returning = false; },
    update(ent, dt, game) {
      const d = ent.def, g = game;
      if (!ent.enabled || !ent.active || ent.state.dead || g.state.mode !== 'playing') return;
      if (g.frozen && g.frozen()) { ent.tint = FROZEN; return; }
      if (ent.tint === FROZEN) ent.tint = null;
      if (d.pulse) {   // dangerous for pulse[0] seconds, then safe for pulse[1] seconds
        ent.pulseT -= dt;
        if (ent.pulseT <= 0) {
          ent.state.off = !ent.state.off;
          ent.pulseT = d.pulse[ent.state.off ? 1 : 0];
          ent.setLook({ off: ent.state.off });
          if (!ent.state.off) ent.touching = false;   // standing on it when it switches on still hurts
        }
      }
      if (ent.touching && !ent.state.off) { ent.contactT -= dt; if (ent.contactT <= 0) contact(ent, g); }
      const x0 = ent.pos[0], z0 = ent.pos[2];

      // senses: distance to the player and line of sight, a few times a second
      const pl = g.player, eye = pl.eye();
      const range = Math.max(d.chase || 0, d.shoots ? d.shoots.range || 16 : 0, d.boss ? d.engage || 30 : 0);
      if (range) {
        ent.aiT -= dt;
        if (ent.aiT <= 0) {
          ent.aiT = 0.2;
          ent.dist = Math.hypot(eye[0] - ent.pos[0], eye[2] - ent.pos[2]);
          ent.sees = ent.dist <= range && Math.abs(eye[1] - ent.pos[1]) < 6 && clearLine(g, eyeOf(ent), [eye[0], eye[1] - 0.25, eye[2]]);
          if (d.boss && ent.sees) ent.state.engaged = true;
          if (d.chase) {
            if (ent.sees && ent.dist <= d.chase) { ent.chasing = true; ent.lostT = 0; }
            else if (ent.chasing) {
              ent.lostT += 0.2;
              if (ent.lostT > 2.5 || ent.dist > d.chase * 1.8) { ent.chasing = false; ent.returning = true; ent.stuckT = 0; }
            }
          }
        }
      }
      const rage = d.rage && d.hp && ent.state.hp <= d.hp * (d.rage.below || 0.5) ? d.rage : null;
      const mul = rage ? rage.speed || 1.5 : 1;

      // movement: chase · go back to the patrol · patrol (holdT: another mechanic holds it still, e.g. a boss winding up)
      const held = ent.holdT > 0;
      if (held) ent.holdT -= dt;
      if (held) { /* standing still */ } else if (ent.chasing) {
        walk(ent, g, pl.pos[0], pl.pos[2], (d.chaseSpeed || d.speed * 1.3) * mul, dt);
        ent.yaw = Math.atan2(pl.pos[0] - ent.pos[0], pl.pos[2] - ent.pos[2]);
      } else if (ent.returning) {
        const t = ent.path.length ? ent.path[ent.state.pathI % ent.path.length] : ent.home;
        const before = Math.hypot(t[0] - ent.pos[0], t[2] - ent.pos[2]);
        const left = walk(ent, g, t[0], t[2], d.speed * mul, dt);
        ent.stuckT = before - left < 0.2 * d.speed * dt ? (ent.stuckT || 0) + dt : 0;
        if (left < 0.3 || ent.stuckT > 1.5) { if (left >= 0.3) { ent.pos[0] = t[0]; ent.pos[2] = t[2]; } ent.returning = false; }
      } else if (ent.path.length) {
        if (ent.waitT > 0) ent.waitT -= dt;
        else {
          const t = ent.path[ent.state.pathI % ent.path.length], mx = t[0] - ent.pos[0], mz = t[2] - ent.pos[2], ml = Math.hypot(mx, mz);
          const step = d.speed * mul * dt;
          if (ml <= step) {
            ent.pos[0] = t[0]; ent.pos[2] = t[2];
            ent.state.pathI = (ent.state.pathI + 1) % ent.path.length;
            ent.waitT = d.wait;
          } else {
            ent.pos[0] += mx / ml * step; ent.pos[2] += mz / ml * step;
            if (d.faceTravel) ent.yaw = Math.atan2(mx, mz);
          }
        }
      }

      // shooting (turrets, bosses, ranged enemies)
      if (d.shoots && g.enemyFire && ent.sees && !held && ent.dist <= (d.shoots.range || 16)) {
        if (!ent.chasing && !ent.path.length) ent.yaw = Math.atan2(eye[0] - ent.pos[0], eye[2] - ent.pos[2]);
        ent.shootT -= dt * (rage ? 1.6 : 1);
        if (ent.shootT <= 0) {
          ent.shootT = (d.shoots.every || 2) * (0.85 + Math.random() * 0.3);
          const c = eyeOf(ent);
          g.enemyFire(ent, c, [eye[0], eye[1] - 0.25, eye[2]], d.shoots);   // the same line it saw you along
          ent.throwT = 0.3;
        }
      }
      if (d.gait) gait(ent, dt, Math.hypot(ent.pos[0] - x0, ent.pos[2] - z0));

      // bosses bring their minions back
      if (d.summon && ent.state.engaged && !(d.armor !== undefined && d.summon.whileArmored === false && GK.test(g, d.armor))) {
        ent.summonT -= dt * (rage ? 1.5 : 1);
        if (ent.summonT <= 0) {
          ent.summonT = d.summon.every || 8;
          const mins = (d.summon.ids || []).map(id => g.world.get(id)).filter(Boolean);
          const alive = mins.filter(m => m.active && !m.state.dead).length;
          const free = mins.find(m => !m.removed && (!m.active || m.state.dead));
          const share = Number(g.difficultyOpts ? g.difficultyOpts().summons : 1);
          const max = share > 0 && share < 1 ? Math.max(1, Math.ceil((d.summon.max || 3) * share)) : (d.summon.max || 3);
          if (free && alive < max) {

      game.hitHazard = (ent, damage) => {

        const mul = d.boss ? Number(game.difficultyOpts ? game.difficultyOpts().bossDamage : 1) : 1;
        ent.state.hp -= (damage || 1) * (mul > 0 ? mul : 1);
        ent.hi = 0.9;
        if (d.chase) ent.chasing = true;
        if (d.boss) ent.state.engaged = true;
        game.emit('hazard:damaged', { id: ent.id });
        if (ent.state.hp <= 0) { defeat(ent, game, 'shot'); return 'defeated'; }
        if (ent.def.gait) ent.hurtT = 0.25;
        game.audio.play('hit');
        return 'hit';
      };
      game.defeatHazard = (ent, how) => defeat(ent, game, how || 'shot');
      game.on('player:respawn', () => { for (const e of game.world.entities) if (e.type === 'hazard' && e.chasing) { e.chasing = false; e.returning = true; e.stuckT = 0; } });
    },
    update(game, dt) {
      if (game.hurtCD > 0) game.hurtCD -= dt;
      // boss bar: the nearest engaged boss
      let boss = null, bd = Infinity;
      for (const e of game.world.entities) {
        if (e.type !== 'hazard' || !e.def.boss || !e.active || e.state.dead || !e.state.engaged) continue;
        const dd = V.dist(e.pos, game.player.pos);
        if (dd < bd) { bd = dd; boss = e; }
      }
      game.ui.setBoss(boss ? { name: boss.name || 'Boss', hp: Math.max(0, boss.state.hp), max: boss.def.hp || 1, shielded: boss.def.armor !== undefined && GK.test(game, boss.def.armor) } : null);
    },
  });
})();

                   mag: 12, reserve: 48, maxReserve: 120, reload: 1.2,     // magazine, spare ammo, reload seconds
                   pellets: 1, spread: 0,                                  // several bolts at once (scatter)
                   splash: 0,                                              // explodes: hurts every enemy this close
                   pierce: false,                                          // goes through enemies
                   price: 0, ammoPrice: 20, ammoPack: 24,                  // shop: buy it, buy a pack of ammo
                   melee: true, reach: 2.6, arc: 90, maxTargets: 3, swing: 0.3, // a sword: no ammo, hits what is in front
                   viewScale: 0.55,                                        // size of the tool drawn in the hand (first person)
                   anim: 'bow' | 'sling' | 'load' | 'thrust',              // how it moves in the hand (below)
                   zoom: 0.35,                                             // hold the RIGHT mouse button: look down the sight (0 = no sight)

   inside an `arc` (degrees) in front of the player, not through walls. `always: true` weapons work before the arsenal's

      };
      /** A shot that lands at once (third person, the target closer than the muzzle): hit the enemy under the crosshair,

      const pointBlank = (w, ray, aim) => {
        if (w.splash) { fx.explode(aim, w); game.ui.hitMarker('hit'); return; }
        const e = enemyAt(game, ray.o, ray.d, V.dist(ray.o, aim) + 0.6).e;
        if (!e) { game.burst(aim, w.color, 4); return; }

        }
        game.burst(pos, '#ff9f43', 16); game.burst(pos, '#fff3b0', 6);
        if (game.lightFlash) game.lightFlash(pos, '#ff9f43', w.splash * 3, 0.3);
        if (game.shake) game.shake(0.25, 0.1);
        game.audio.play('boom');
      };

      game.takePickup = ent => {
        const d = ent.def, kind = ent.kind || d.kind, k = PICKUP[kind] || PICKUP.ammo, amount = ent.amount != null ? ent.amount : d.amount != null ? d.amount : k.amount;
        if (kind === 'health') {

          game.player.heal(amount); game.ui.toast('+' + amount + ' health', 'good');
        } else if (kind === 'coins') { game.addCoins(amount); game.ui.toast('+' + amount + ' coins', 'good'); }
        else { game.addAmmo(amount === 1 ? 0.5 : amount); game.ui.toast('+ Ammo for your weapons', 'good'); }
        game.audio.play('pickup');
        if (game.lightFlash) game.lightFlash(ent.center(), k.color, 4, 0.2);
        game.emit('pickup', { id: ent.id, kind });
        if (ent.loot) { ent.hide(); ent.lootT = 0; }
        else if (d.respawn) { ent.hide(); game.later(d.respawn, () => { if (!ent.removed) ent.show(); }); }

      };
      game.dropLoot = (pos, kind, amount) => {
        const L = take(fx.loot);
        if (!L) return;

        if (L.model !== k.model) L.setModel(k.model, {});
        L.kind = kind; L.amount = amount; L.loot = true; L.lootT = 25;
        L.pos = [pos[0], pos[1], pos[2]]; L.touching = false;

        if (e.def.drop !== false && !e.def.boss && Math.random() < (e.def.dropChance != null ? e.def.dropChance : A.dropChance)) game.dropLoot(e.pos, 'ammo', 1);

          for (const w of A.weapons) {

            const card = U.el('div', 'gk-shop-card' + (owned ? ' owned' : '') + (s.cur === w.id ? ' active' : ''));
            card.innerHTML = '<div class="gk-shop-icon" style="--c:' + U.css(w.color) + '">' + U.esc(w.icon || '⚡') + '</div>' +
              '<b>' + U.esc(w.name) + '</b><small>' + U.esc(w.desc || '') + '</small>' +

            card.appendChild(btn);
            if (owned && s.cur !== w.id && usable(w)) { const eq = U.el('button', 'gk-btn small', 'Equip'); eq.onclick = () => { game.selectWeapon(w.id); draw(); }; card.appendChild(eq); }
            grid.appendChild(card);
          }
          for (const x of A.extras) {
            const card = U.el('div', 'gk-shop-card extra');
            card.innerHTML = '<div class="gk-shop-icon">' + U.esc(x.icon || '✨') + '</div><b>' + U.esc(x.name) + '</b><small>' + U.esc(x.desc || '') + '</small>';
            const btn = U.el('button', 'gk-btn primary', 'Buy · ' + (A.coinIcon || '🪙') + ' ' + x.price);

    answers(game) {

    },
  });
})();

<script>/* mechanics/music/music.js */
/* Game Kit · mechanics/music   (any game type)
   Background music made live with WebAudio (no files, works offline): bass, chord arpeggios, a soft pad and drums,
   looping a 4-chord progression. A game (or each level) picks the style:
     music: { bpm: 124, root: 110, mode: 'minor' | 'major', prog: [0, 5, 3, 4] (scale degrees), wave: 'sawtooth',
              arpWave: 'square', drums: true, volume: 0.1 }

   It stops on the title / end screens and follows the game's Sound on/off. */
(function () {

    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);

  function play(step, t, level) {
    const c = S.cfg, s16 = step % 16, bar = Math.floor(step / 16) % c.prog.length, deg = c.prog[bar], d16 = 60 / c.bpm / 4;
    const chord = [0, 2, 4].map(k => degree(c, deg + k));
    if (s16 % 2 === 0 && [0, 1, 1, 0, 1, 1, 0, 1][s16 / 2]) tone(t, hz(c.root / 2, chord[0]), d16 * 1.8, c.wave, 0.22);   // bass
    const arp = [0, 1, 2, 1, 0, 2, 1, 2][s16 % 8];
    tone(t, hz(c.root * 2, chord[arp] + (s16 >= 8 ? 12 : 0)), d16 * 0.9, c.arpWave, 0.05);                                // arpeggio
    if (s16 === 0) for (const n of chord) tone(t, hz(c.root, n), d16 * 15, 'triangle', 0.035, 0.3);                      // pad
    if (level >= 0.6 && c.drums) {
      if (s16 % 4 === 0) kick(t);
      if (s16 === 4 || s16 === 12) hiss(t, 0.16, 0.35, 1800, 'bandpass');
      if (s16 % 2 === 1) hiss(t, 0.04, 0.12, 8000, 'highpass');
    }
  }
  function tick() {
    const g = GK.current;
    if (!g || !g.audio || !g.audio.ctx || !S.cfg) return;
    if (S.ctx !== g.audio.ctx) {   // first time (after the Play click unlocked the sound)
      S.ctx = g.audio.ctx;
      S.out = S.ctx.createGain(); S.out.connect(S.ctx.destination);
      S.noise = S.ctx.createBuffer(1, S.ctx.sampleRate, S.ctx.sampleRate);
      const d = S.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      S.next = S.ctx.currentTime + 0.1;
    }
    const mode = g.state && g.state.mode, on = mode === 'playing' || mode === 'modal' || mode === 'paused';
    let level = on ? (g.musicLevel ? g.musicLevel() : 1) : 0;
    if (mode === 'paused') level = Math.min(level, 0.4);
    const vol = g.audio.muted || level <= 0 ? 0 : (S.cfg.volume == null ? 0.1 : S.cfg.volume) * (level >= 0.6 ? 1 : 0.6);
    S.out.gain.setTargetAtTime(vol, S.ctx.currentTime, 0.3);
    const d16 = 60 / S.cfg.bpm / 4;
    if (S.next < S.ctx.currentTime) S.next = S.ctx.currentTime + 0.05;
    while (S.next < S.ctx.currentTime + 0.25) {
      if (vol > 0) play(S.step, S.next, level);
      S.step++; S.next += d16;
    }
  }

  GK.Music = S;
  GK.Mechanics.add('music', {
    configKeys: ['music'],
    setup(game) {
      const m = game.cfg.music || {};
      const cfg = Object.assign({ bpm: 120, root: 110, mode: 'minor', prog: [0, 5, 3, 4], wave: 'sawtooth', arpWave: 'square', drums: true, volume: 0.1 }, m);
      if (JSON.stringify(cfg) !== JSON.stringify(S.cfg)) { S.cfg = cfg; S.step = 0; }
      if (!S.timer) S.timer = setInterval(() => { try { tick(); } catch (e) { /* sound is optional */ } }, 60);
    },
  });
})();

</script>
<script>/* helpdesk.js */
/* IT HELP DESK · helpdesk.js — ticket ratings (★★★ for a fast fix + bonus coins), promotions every 2 tickets (HUD chip),
   lost USB sticks → coins, finished computers go dark, a save after every ticket. Loaded by GAME.scripts. */
(function () {
  'use strict';
  const C = window.GAME_CONTENT, M = C.messages;
  let usbSeen = 0;
  const done = g => ['t1', 't2', 't3', 't4', 't5', 't6', 'server'].filter(s => g.state.flags['desk_' + s]).length;
  const rankOf = g => Math.min(C.ranks.length - 1, Math.floor(done(g) / 2) + (g.state.flags.desk_server ? 1 : 0));
  const chip = g => g.ui.setChips([{ text: '🎖️ ' + C.ranks[rankOf(g)], color: '#4dabf7' }]);
  window.IT_DESK_GAME = {
    start(g) {
      usbSeen = (g.state.collected && g.state.collected['#usb']) || 0;
      if (g.state.vars.tStart == null) g.state.vars.tStart = g.state.time;
      for (const s of ['t1', 't2', 't3', 't4', 't5', 't6', 'server']) if (g.state.flags['desk_' + s]) { const e = g.world.get(s); if (e) e.setLook({ screen: '#2b2f36' }); }
      chip(g);
      if (!g._deskHooked) {
        g._deskHooked = true;
        g.on('desk:job', e => {
          const pc = g.world.get(e.slot); if (pc) pc.setLook({ screen: '#2b2f36' });
          const secs = g.state.time - (g.state.vars.tStart || 0), ins = e.slot === 'server' ? 2 : 1;
          const stars = secs < 150 * ins ? 3 : secs < 300 * ins ? 2 : 1;
          g.state.vars.tStart = g.state.time;
          if (g.addCoins) g.addCoins(stars === 3 ? 30 : stars === 2 ? 15 : 0);
          g.ui.toast(stars === 3 ? M.rate3 : stars === 2 ? M.rate2 : M.rate1, 'good');
          const before = g.state.vars.rank || 0, now = rankOf(g);
          if (now > before) { g.state.vars.rank = now; setTimeout(() => g.ui.toast(M.rank + C.ranks[now], 'good'), 1200); }
          chip(g);
          if (g.saveResume && g.player) g.saveResume({ pos: g.player.pos.slice(), rot: 0 });
        });
      }
      g.ui.toast(M.welcome, 'good');
    },
    update(g) {
      const n = (g.state.collected && g.state.collected['#usb']) || 0;
      if (n > usbSeen) { if (g.addCoins) g.addCoins(15 * (n - usbSeen)); usbSeen = n; g.ui.toast(M.usb, 'good'); }
    },
  };
})();

</script>
